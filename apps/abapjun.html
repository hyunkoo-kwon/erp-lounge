    structs: { ty_cc: [{ n: 'kostl', t: 'string' }, { n: 'wkgbtr', t: 'i' }] },
    inputs: [{ n: 'p_kostl', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_cc' }], inDesc: 'gt_itab: 1~50행', outDesc: '두 줄을 출력합니다.',
    tests: [['C200', [['C100', 1300], ['C200', 1350], ['C300', 400]]], ['C900', [['C100', 10]]], ['C100', [['C300', 50], ['C100', 70], ['C200', 990], ['C400', 0]]]].map(([p_kostl, gt_itab]) => ({ p_kostl, gt_itab })),
    ref: ({ p_kostl, gt_itab }) => { const t = gt_itab.slice().sort((a, b) => b[1] - a[1]); const f = gt_itab.find(r => r[0] === p_kostl); return `TOP ${t[0][0]} ${t[0][1]}\n${p_kostl} ${f ? f[1] : 'NOT FOUND'}`; },
    sol: L('SORT gt_itab BY wkgbtr DESCENDING.', 'READ TABLE gt_itab INTO DATA(gs_top) INDEX 1.', "WRITE: 'TOP', gs_top-kostl, gs_top-wkgbtr.", 'READ TABLE gt_itab INTO DATA(gs_cc) WITH KEY kostl = p_kostl.', 'IF sy-subrc = 0.', '  WRITE: / p_kostl, gs_cc-wkgbtr.', 'ELSE.', "  WRITE: / p_kostl, 'NOT FOUND'.", 'ENDIF.') },

  { id: 6514, lv: 1, kind: 'rpt', noTmplSel: true, title: '배부 금액 계산 선택 화면',
    body: '보조 원가센터의 원가를 다른 원가센터로 나눠 주는 것을 배부라고 합니다.\n선택 화면을 만들고 배부 금액을 계산하세요.\n· p_kostl (TYPE csks-kostl): 받는 원가센터\n· p_amt (TYPE i): 배부할 총금액, p_rate (TYPE i): 배부 비율(%)\n· r_dn, r_rd: 라디오버튼(RADIOBUTTON GROUP g1) — r_dn 은 원 미만 버림(DIV), r_rd 는 반올림\n· AT SELECTION-SCREEN 에서 비율이 0보다 작거나 100보다 크면 MESSAGE \'RATE ERROR\' TYPE \'E\'\n"원가센터 배부액"을 출력하세요.',
    fields: [['csks-kostl', '원가센터'], ['coep-wkgbtr', 'CO 금액']],
    sel: [{ n: 'p_kostl', kind: 'p', decl: 'TYPE csks-kostl', label: '받는 원가센터' }, { n: 'p_amt', kind: 'p', decl: 'TYPE i', label: '총금액' }, { n: 'p_rate', kind: 'p', decl: 'TYPE i', label: '비율(%)' },
      { n: 'r_dn', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '버림' }, { n: 'r_rd', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '반올림' }],
    tests: [['C200', 1005, 30, 'X', ''], ['C200', 1005, 30, '', 'X'], ['C300', 999, 50, '', 'X'], ['C300', 999, 50, 'X', ''], ['C400', 100, 101, 'X', ''], ['C400', 100, -1, '', 'X'], ['C100', 777, 0, 'X', '']]
      .map(([p_kostl, p_amt, p_rate, r_dn, r_rd]) => ({ p_kostl, p_amt, p_rate, r_dn, r_rd })),
    ref: ({ p_kostl, p_amt, p_rate, r_dn }) => p_rate < 0 || p_rate > 100 ? 'RATE ERROR' : `${p_kostl} ${r_dn === 'X' ? Math.floor(p_amt * p_rate / 100) : rh(p_amt * p_rate / 100)}`,
    sol: "REPORT zco_alloc_calc.\n\nPARAMETERS: p_kostl TYPE csks-kostl,\n            p_amt   TYPE i,\n            p_rate  TYPE i,\n            r_dn    RADIOBUTTON GROUP g1,\n            r_rd    RADIOBUTTON GROUP g1.\n\nAT SELECTION-SCREEN.\n  IF p_rate < 0 OR p_rate > 100.\n    MESSAGE 'RATE ERROR' TYPE 'E'.\n  ENDIF.\n\nSTART-OF-SELECTION.\n  DATA lv_amt TYPE i.\n  IF r_dn = 'X'.\n    lv_amt = p_amt * p_rate DIV 100.\n  ELSE.\n    lv_amt = p_amt * p_rate / 100.\n  ENDIF.\n  WRITE: p_kostl, lv_amt." },

  // =================== Lv.2 ===================
  { id: 6523, lv: 2, kind: 'rpt', title: '원가센터 예산 등록 (MODIFY)', checkDb: ['zco_budget'],
    body: '원가센터 예산 테이블 ZCO_BUDGET 에 예산을 등록하거나 고치세요.\n· 원가센터가 CSKS(관리회계 영역 \'1000\')에 없으면 INVALID 를 출력하고 아무것도 바꾸지 않습니다.\n· 같은 원가센터·연도의 예산이 이미 있으면 UPDATED, 없으면 CREATED 를 출력합니다.\n· 저장은 MODIFY zco_budget FROM ... 한 문장으로 하고 COMMIT WORK 하세요.',
    fields: [['zco_budget-kostl', '원가센터'], ['zco_budget-gjahr', '회계연도'], ['zco_budget-budget', '예산 금액'], ['csks-kostl', '원가센터 마스터']],
    tables: ['csks', 'zco_budget'], sel: [{ n: 'p_kostl', kind: 'p', decl: 'TYPE zco_budget-kostl', label: '원가센터' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE zco_budget-gjahr', label: '회계연도' }, { n: 'p_budget', kind: 'p', decl: 'TYPE zco_budget-budget', label: '예산' }],
    tests: [['C200', '2026', 1800], ['C300', '2027', 700], ['C999', '2026', 100], ['D100', '2026', 50]].map(([p_kostl, p_gjahr, p_budget]) => ({ p_kostl, p_gjahr, p_budget, db: { csks: CO_CSKS, zco_budget: CO_BUDGET() } })),
    ref: ({ p_kostl, p_gjahr, p_budget, db }) => { const t = db.zco_budget.map(r => r.slice()); let m; if (!db.csks.some(r => r[0] === '1000' && r[1] === p_kostl)) m = 'INVALID'; else { const i = t.findIndex(r => r[0] === p_kostl && r[1] === p_gjahr); if (i >= 0) { t[i][2] = p_budget; m = 'UPDATED'; } else { t.push([p_kostl, p_gjahr, p_budget]); m = 'CREATED'; } } return m + '\n' + coDump('zco_budget', t, 2); },
    sol: "REPORT zco_budget_save.\n\nPARAMETERS: p_kostl  TYPE zco_budget-kostl,\n            p_gjahr  TYPE zco_budget-gjahr,\n            p_budget TYPE zco_budget-budget.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE kostl FROM csks\n    WHERE kokrs = '1000' AND kostl = @p_kostl\n    INTO @DATA(lv_kostl).\n  IF sy-subrc <> 0.\n    WRITE 'INVALID'.\n    RETURN.\n  ENDIF.\n\n  SELECT SINGLE budget FROM zco_budget\n    WHERE kostl = @p_kostl AND gjahr = @p_gjahr\n    INTO @DATA(lv_old).\n  DATA(lv_msg) = COND string( WHEN sy-subrc = 0 THEN `UPDATED` ELSE `CREATED` ).\n\n  DATA(gs_bud) = VALUE zco_budget( kostl = p_kostl gjahr = p_gjahr budget = p_budget ).\n  MODIFY zco_budget FROM gs_bud.\n  COMMIT WORK.\n  WRITE lv_msg." },

  // =================== Lv.3 ===================
  { id: 6531, lv: 3, title: '원가센터 클래스', must: ['lcl_cost_center'],
    body: '로컬 클래스 lcl_cost_center 로 예산 소진을 관리하세요.\n· constructor: 원가센터 iv_kostl, 예산 iv_budget 을 받습니다.\n· post( iv_amt ): 실적을 더합니다.\n· get_rate( ) RETURNING rv_rate: 소진율(%) = 실적 × 100 / 예산 (반올림)\n· is_over( ) RETURNING rv_over: 실적이 예산보다 크면 abap_true\n원가센터 p_kostl, 예산 p_budget 으로 객체를 만들고 실적 gt_itab 을 차례로 post 하세요.\npost 할 때마다 "POST 금액 누계"를, 마지막 줄에 "원가센터 소진율 OVER" 또는 "원가센터 소진율 OK"를 출력합니다.',
    fields: [['csks-kostl', '원가센터'], ['zco_budget-budget', '예산'], ['coep-wkgbtr', '실적 금액']],
    inputs: [{ n: 'p_kostl', t: 'string' }, { n: 'p_budget', t: 'i' }, { n: 'gt_itab', t: 'itab_i' }], inDesc: '1 ≤ p_budget ≤ 1,000,000 / gt_itab: 1~20행', outDesc: 'post 마다 한 줄, 마지막에 결과 한 줄을 출력합니다.',
    tests: [['C100', 1500, [500, 200, 600]], ['C300', 300, [400]], ['C200', 1000, [250, 250, 250, 250]], ['C400', 3, [1]]].map(([p_kostl, p_budget, gt_itab]) => ({ p_kostl, p_budget, gt_itab })),
    ref: ({ p_kostl, p_budget, gt_itab }) => { let a = 0; const o = gt_itab.map(x => { a += x; return `POST ${x} ${a}`; }); o.push(`${p_kostl} ${rh(a * 100 / p_budget)} ${a > p_budget ? 'OVER' : 'OK'}`); return o.join('\n'); },
    sol: "CLASS lcl_cost_center DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_kostl TYPE string iv_budget TYPE i,\n             post IMPORTING iv_amt TYPE i,\n             get_actual RETURNING VALUE(rv_actual) TYPE i,\n             get_rate RETURNING VALUE(rv_rate) TYPE i,\n             is_over RETURNING VALUE(rv_over) TYPE abap_bool.\n  PRIVATE SECTION.\n    DATA: mv_kostl  TYPE string,\n          mv_budget TYPE i,\n          mv_actual TYPE i.\nENDCLASS.\n\nCLASS lcl_cost_center IMPLEMENTATION.\n  METHOD constructor.\n    mv_kostl = iv_kostl.\n    mv_budget = iv_budget.\n  ENDMETHOD.\n  METHOD post.\n    mv_actual = mv_actual + iv_amt.\n  ENDMETHOD.\n  METHOD get_actual.\n    rv_actual = mv_actual.\n  ENDMETHOD.\n  METHOD get_rate.\n    rv_rate = mv_actual * 100 / mv_budget.\n  ENDMETHOD.\n  METHOD is_over.\n    IF mv_actual > mv_budget.\n      rv_over = abap_true.\n    ENDIF.\n  ENDMETHOD.\nENDCLASS.\n\nDATA(go_cc) = NEW lcl_cost_center( iv_kostl = p_kostl iv_budget = p_budget ).\nLOOP AT gt_itab INTO DATA(lv_amt).\n  go_cc->post( lv_amt ).\n  WRITE: / 'POST', lv_amt, go_cc->get_actual( ).\nENDLOOP.\nIF go_cc->is_over( ) = abap_true.\n  WRITE: / p_kostl, go_cc->get_rate( ), 'OVER'.\nELSE.\n  WRITE: / p_kostl, go_cc->get_rate( ), 'OK'.\nENDIF." },

  { id: 6532, lv: 3, title: '배부 방식 상속 (REDEFINITION)', must: ['redefinition'],
    body: '보조 원가센터 금액 p_amt 를 받는 원가센터들 gt_itab(kostl 원가센터, kind 방식, base 기준값)에 배부하세요.\n· lcl_alloc: constructor 로 기준값 iv_base 를 받고, calc( iv_amt ) RETURNING rv_amt 는 비율 배부 — iv_amt × 기준값 DIV 100 (기준값 = %)\n· lcl_fixed: lcl_alloc 을 상속하고 calc 를 REDEFINITION 해서 기준값을 그대로(고정액) 돌려줍니다.\n· kind 가 R 이면 lcl_alloc, F 면 lcl_fixed 객체를 만들되, 둘 다 TYPE REF TO lcl_alloc 변수에 담아 calc( ) 를 부르세요.\n"원가센터 배부액"을 한 줄씩, 마지막 줄에 "REST 남은금액"(p_amt - 배부액 합계)을 출력합니다.',
    fields: [['csks-kostl', '원가센터'], ['coep-wkgbtr', 'CO 금액']],
    structs: { ty_rcv: [{ n: 'kostl', t: 'string' }, { n: 'kind', t: 'string' }, { n: 'base', t: 'i' }] },
    inputs: [{ n: 'p_amt', t: 'i' }, { n: 'gt_itab', t: 'itab', st: 'ty_rcv' }], inDesc: '0 ≤ p_amt ≤ 1,000,000 / gt_itab: 1~20행', outDesc: '원가센터마다 한 줄, 마지막에 REST 줄을 출력합니다.',
    tests: [[1000, [['C200', 'R', 50], ['C300', 'F', 120], ['C400', 'R', 25]]], [999, [['C200', 'R', 33], ['C300', 'R', 33]]], [500, [['C100', 'F', 500]]], [0, [['C200', 'R', 10], ['C300', 'F', 5]]]].map(([p_amt, gt_itab]) => ({ p_amt, gt_itab })),
    ref: ({ p_amt, gt_itab }) => { let s = 0; const o = gt_itab.map(([k, kind, b]) => { const v = kind === 'F' ? b : Math.floor(p_amt * b / 100); s += v; return `${k} ${v}`; }); o.push(`REST ${p_amt - s}`); return o.join('\n'); },
    sol: "CLASS lcl_alloc DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_base TYPE i,\n             calc IMPORTING iv_amt TYPE i RETURNING VALUE(rv_amt) TYPE i.\n  PROTECTED SECTION.\n    DATA mv_base TYPE i.\nENDCLASS.\n\nCLASS lcl_fixed DEFINITION INHERITING FROM lcl_alloc.\n  PUBLIC SECTION.\n    METHODS calc REDEFINITION.\nENDCLASS.\n\nCLASS lcl_alloc IMPLEMENTATION.\n  METHOD constructor.\n    mv_base = iv_base.\n  ENDMETHOD.\n  METHOD calc.\n    rv_amt = iv_amt * mv_base DIV 100.\n  ENDMETHOD.\nENDCLASS.\n\nCLASS lcl_fixed IMPLEMENTATION.\n  METHOD calc.\n    rv_amt = mv_base.\n  ENDMETHOD.\nENDCLASS.\n\nDATA: go_alloc TYPE REF TO lcl_alloc,\n      lv_sum   TYPE i.\nLOOP AT gt_itab INTO DATA(gs_itab).\n  IF gs_itab-kind = 'F'.\n    go_alloc = NEW lcl_fixed( iv_base = gs_itab-base ).\n  ELSE.\n    go_alloc = NEW lcl_alloc( iv_base = gs_itab-base ).\n  ENDIF.\n  DATA(lv_amt) = go_alloc->calc( p_amt ).\n  lv_sum = lv_sum + lv_amt.\n  WRITE: / gs_itab-kostl, lv_amt.\nENDLOOP.\nWRITE: / 'REST', p_amt - lv_sum." },

  { id: 6534, lv: 3, kind: 'rpt', title: '내부오더 관리 CRUD 리포트', checkDb: ['zco_order'],
    body: '라디오버튼으로 작업을 골라 내부오더 테이블 ZCO_ORDER 를 관리하세요.\n· r_c 생성: 같은 오더가 있으면 MESSAGE \'ALREADY EXISTS\' TYPE \'E\', 없으면 상태 CRTD 로 INSERT 하고 CREATED\n· r_r 조회: "오더 내역 예산 상태" 또는 NOT FOUND\n· r_u 예산 변경: 오더가 있으면 예산만 p_budget 으로 UPDATE 하고 UPDATED, 없으면 NOT FOUND\n· r_d 삭제: 상태가 CRTD(생성됨)인 오더만 지우고 DELETED. 릴리스(REL)된 오더는 CANNOT DELETE, 없으면 NOT FOUND\n변경이 있으면 COMMIT WORK 하세요.',
    fields: [['zco_order-aufnr', '내부오더 번호'], ['zco_order-ktext', '오더 내역'], ['zco_order-budget', '오더 예산'], ['zco_order-status', '상태 (CRTD 생성, REL 릴리스)'], ['aufk-aufnr', '표준 내부오더 마스터']],
    tables: ['zco_order'], sel: [{ n: 'r_c', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '생성' }, { n: 'r_r', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '조회' }, { n: 'r_u', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '예산 변경' }, { n: 'r_d', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '삭제' },
      { n: 'p_aufnr', kind: 'p', decl: 'TYPE zco_order-aufnr', label: '오더' }, { n: 'p_ktext', kind: 'p', decl: 'TYPE zco_order-ktext', label: '내역' }, { n: 'p_budget', kind: 'p', decl: 'TYPE zco_order-budget', label: '예산' }],
    tests: [['C', 'Z1004', '안전 점검', 400], ['C', 'Z1001', '중복', 1], ['R', 'Z1002', '', 0], ['R', 'Z9999', '', 0], ['U', 'Z1003', '', 350], ['U', 'Z9999', '', 1], ['D', 'Z1003', '', 0], ['D', 'Z1001', '', 0], ['D', 'Z9999', '', 0]]
      .map(([m, p_aufnr, p_ktext, p_budget]) => ({ r_c: m === 'C' ? 'X' : '', r_r: m === 'R' ? 'X' : '', r_u: m === 'U' ? 'X' : '', r_d: m === 'D' ? 'X' : '', p_aufnr, p_ktext, p_budget, db: { zco_order: CO_ORDER() } })),
    ref: (x) => { const t = x.db.zco_order.map(r => r.slice()); const i = t.findIndex(r => r[0] === x.p_aufnr); let m;
      if (x.r_c === 'X') { if (i >= 0) m = 'ALREADY EXISTS'; else { t.push([x.p_aufnr, x.p_ktext, x.p_budget, 'CRTD']); m = 'CREATED'; } }
      else if (x.r_r === 'X') m = i >= 0 ? t[i].join(' ') : 'NOT FOUND';
      else if (x.r_u === 'X') { if (i >= 0) { t[i][2] = x.p_budget; m = 'UPDATED'; } else m = 'NOT FOUND'; }
      else { if (i < 0) m = 'NOT FOUND'; else if (t[i][3] !== 'CRTD') m = 'CANNOT DELETE'; else { t.splice(i, 1); m = 'DELETED'; } }
      return m + '\n' + coDump('zco_order', t, 1); },
    sol: "REPORT zco_order_crud.\n\nPARAMETERS: r_c RADIOBUTTON GROUP g1,\n            r_r RADIOBUTTON GROUP g1,\n            r_u RADIOBUTTON GROUP g1,\n            r_d RADIOBUTTON GROUP g1.\nPARAMETERS: p_aufnr  TYPE zco_order-aufnr,\n            p_ktext  TYPE zco_order-ktext,\n            p_budget TYPE zco_order-budget.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE * FROM zco_order WHERE aufnr = @p_aufnr INTO @DATA(gs_ord).\n  DATA(lv_found) = COND abap_bool( WHEN sy-subrc = 0 THEN abap_true ).\n\n  IF r_c = 'X'.\n    IF lv_found = abap_true.\n      MESSAGE 'ALREADY EXISTS' TYPE 'E'.\n    ENDIF.\n    gs_ord = VALUE #( aufnr = p_aufnr ktext = p_ktext budget = p_budget status = 'CRTD' ).\n    INSERT zco_order FROM gs_ord.\n    COMMIT WORK.\n    WRITE 'CREATED'.\n\n  ELSEIF r_r = 'X'.\n    IF lv_found = abap_true.\n      WRITE: gs_ord-aufnr, gs_ord-ktext, gs_ord-budget, gs_ord-status.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n\n  ELSEIF r_u = 'X'.\n    UPDATE zco_order SET budget = @p_budget WHERE aufnr = @p_aufnr.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'UPDATED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n\n  ELSE.\n    IF lv_found = abap_false.\n      WRITE 'NOT FOUND'.\n    ELSEIF gs_ord-status <> 'CRTD'.\n      WRITE 'CANNOT DELETE'.\n    ELSE.\n      DELETE FROM zco_order WHERE aufnr = @p_aufnr.\n      COMMIT WORK.\n      WRITE 'DELETED'.\n    ENDIF.\n  ENDIF." },

  // =================== Lv.4 ===================
  { id: 6542, lv: 4, kind: 'rpt', title: '보조 원가센터 배부 (단수 처리)',
    body: '보조 원가센터 p_sender 의 기간 p_perio 실적(회계연도 \'2026\', COEP)을 배부 기준 ZCO_ALCKEY 의 비중(share)대로 받는 원가센터에 나눠 주세요.\n· 배부할 금액 = 보내는 원가센터 오브젝트(\'KS\' && 원가센터)의 그 기간 실적 합계\n· 각 수신처 배부액 = 금액 × 비중 / 비중합계 의 원 미만 버림(DIV)\n· 버리고 남은 끝전은 비중이 가장 큰 수신처(같으면 원가센터 코드가 앞선 곳)에 더합니다.\n· 수신처 순으로 "원가센터 배부액", 마지막 줄에 "SENDER 보낸원가센터 금액"\n· 배부 기준이 없거나 금액이 0이면 NOTHING TO ALLOCATE.',
    fields: [['zco_alckey-sender', '보내는 원가센터'], ['zco_alckey-receiver', '받는 원가센터'], ['zco_alckey-share', '배부 비중'], ['coep-perio', '기간'], ['coep-objnr', '오브젝트 번호 (KS+원가센터)']],
    tables: ['coep', 'zco_alckey'], sel: [{ n: 'p_sender', kind: 'p', decl: 'TYPE csks-kostl', label: '보내는 원가센터' }, { n: 'p_perio', kind: 'p', decl: 'TYPE coep-perio', label: '기간' }],
    tests: [['C100', '001', CO_ALCKEY], ['C100', '003', CO_ALCKEY], ['C200', '002', [['C200', 'C300', 2], ['C200', 'C100', 2], ['C200', 'C400', 3]]], ['C100', '003', [['C100', 'C300', 4], ['C100', 'C200', 4], ['C100', 'C400', 3]]], ['C400', '001', CO_ALCKEY], ['C100', '002', CO_ALCKEY]].map(([p_sender, p_perio, k]) => ({ p_sender, p_perio, db: { coep: CO_COEP, zco_alckey: k } })),
    ref: ({ p_sender, p_perio, db }) => { const amt = coAct({ coep: db.coep.filter(r => r[3] === '2026' && r[4] === p_perio) }, 'KS' + p_sender); const k = coSort(db.zco_alckey.filter(r => r[0] === p_sender), r => r[1]); if (!k.length || !amt) return 'NOTHING TO ALLOCATE'; const sum = k.reduce((s, r) => s + r[2], 0); const v = k.map(r => Math.floor(amt * r[2] / sum)); let bi = 0; k.forEach((r, i) => { if (r[2] > k[bi][2]) bi = i; }); v[bi] += amt - v.reduce((s, x) => s + x, 0); return [...k.map((r, i) => `${r[1]} ${v[i]}`), `SENDER ${p_sender} ${amt}`].join('\n'); },
    sol: "REPORT zco_assessment.\n\nPARAMETERS: p_sender TYPE csks-kostl,\n            p_perio  TYPE coep-perio.\n\nSTART-OF-SELECTION.\n  DATA(lv_objnr) = |KS{ p_sender }|.\n  SELECT SUM( wkgbtr ) FROM coep\n    WHERE gjahr = '2026' AND perio = @p_perio AND objnr = @lv_objnr\n    INTO @DATA(lv_amt).\n  SELECT receiver, share FROM zco_alckey\n    WHERE sender = @p_sender\n    ORDER BY receiver\n    INTO TABLE @DATA(gt_key).\n  IF gt_key IS INITIAL OR lv_amt = 0.\n    WRITE 'NOTHING TO ALLOCATE'.\n    RETURN.\n  ENDIF.\n\n  TYPES: BEGIN OF ty_out,\n           receiver TYPE string,\n           share    TYPE i,\n           amt      TYPE i,\n         END OF ty_out.\n  DATA: gt_out  TYPE TABLE OF ty_out,\n        lv_sum  TYPE i,\n        lv_done TYPE i,\n        lv_big  TYPE i VALUE 1,\n        lv_max  TYPE i VALUE -1.\n  LOOP AT gt_key INTO DATA(gs_key).\n    lv_sum = lv_sum + gs_key-share.\n  ENDLOOP.\n  LOOP AT gt_key INTO gs_key.\n    DATA(lv_part) = lv_amt * gs_key-share DIV lv_sum.\n    APPEND VALUE #( receiver = gs_key-receiver share = gs_key-share amt = lv_part ) TO gt_out.\n    lv_done = lv_done + lv_part.\n    IF gs_key-share > lv_max.\n      lv_max = gs_key-share.\n      lv_big = sy-tabix.\n    ENDIF.\n  ENDLOOP.\n  READ TABLE gt_out INTO DATA(gs_out) INDEX lv_big.\n  gs_out-amt = gs_out-amt + lv_amt - lv_done.\n  MODIFY gt_out FROM gs_out INDEX lv_big.\n\n  LOOP AT gt_out INTO gs_out.\n    WRITE: / gs_out-receiver, gs_out-amt.\n  ENDLOOP.\n  WRITE: / 'SENDER', p_sender, lv_amt." },

  { id: 6543, lv: 4, kind: 'rpt', title: '내부오더 정산',
    body: '내부오더에 쌓인 실적을 책임 원가센터로 정산하는 리포트를 만드세요.\n· 내부오더 마스터 AUFK: 오더유형 범위 s_auart 로 거르고, KOSTV 가 정산 받을 원가센터입니다.\n· 실적: COEP 에서 회계연도 p_gjahr, 오브젝트 번호 = AUFK-OBJNR 인 금액 합계\n· 실적이 있는 오더만 오더번호 순으로 "오더 내역 실적 -> 원가센터"를 출력하고\n· 이어서 받는 원가센터 순으로 "SETTLE 원가센터 합계"를 출력합니다.\n· 정산할 실적이 하나도 없으면 NOTHING TO SETTLE.',
    fields: [['aufk-aufnr', '내부오더 번호'], ['aufk-auart', '오더 유형'], ['aufk-objnr', '오브젝트 번호 (OR…)'], ['aufk-kostv', '책임 원가센터'], ['coep-wkgbtr', '실적 금액']],
    tables: ['aufk', 'coep'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coep-gjahr', label: '회계연도' }, { n: 's_auart', kind: 's', decl: 'FOR aufk-auart', label: '오더유형' }],
    tests: [['2026', []], ['2026', [['I', 'EQ', 'ZI02', '']]], ['2025', []], ['2026', [['E', 'EQ', 'ZI02', '']]]].map(([p_gjahr, s_auart]) => ({ p_gjahr, s_auart, db: { aufk: CO_AUFK.concat([['Z1004', 'ZI01', '전시회', 'ORZ1004', 'C300']]), coep: CO_COEP.concat([['1000', '100009', '001', '2026', '004', 'ORZ1004', '4100000', 30], ['1000', '100010', '001', '2026', '004', 'ORZ1003', '4200000', 60]]) } })),
    ref: ({ p_gjahr, s_auart, db }) => { const o = coSort(db.aufk.filter(r => jsIn(r[1], s_auart)), r => r[0]).map(r => [r, coAct(db, r[3], p_gjahr)]).filter(x => x[1] > 0); if (!o.length) return 'NOTHING TO SETTLE'; const m = {}; o.forEach(([r, a]) => m[r[4]] = (m[r[4]] || 0) + a); return [...o.map(([r, a]) => `${r[0]} ${r[2]} ${a} -> ${r[4]}`), ...Object.keys(m).sort().map(k => `SETTLE ${k} ${m[k]}`)].join('\n'); },
    sol: "REPORT zco_order_settle.\n\nPARAMETERS p_gjahr TYPE coep-gjahr.\nSELECT-OPTIONS s_auart FOR aufk-auart.\n\nSTART-OF-SELECTION.\n  SELECT aufnr, ktext, objnr, kostv FROM aufk\n    WHERE auart IN @s_auart\n    ORDER BY aufnr\n    INTO TABLE @DATA(gt_ord).\n\n  TYPES: BEGIN OF ty_sum,\n           kostv TYPE aufk-kostv,\n           amt   TYPE i,\n         END OF ty_sum.\n  DATA gt_sum TYPE TABLE OF ty_sum.\n\n  LOOP AT gt_ord INTO DATA(gs_ord).\n    SELECT SUM( wkgbtr ) FROM coep\n      WHERE gjahr = @p_gjahr AND objnr = @gs_ord-objnr\n      INTO @DATA(lv_amt).\n    IF lv_amt > 0.\n      WRITE: / gs_ord-aufnr, gs_ord-ktext, lv_amt, '->', gs_ord-kostv.\n      COLLECT VALUE ty_sum( kostv = gs_ord-kostv amt = lv_amt ) INTO gt_sum.\n    ENDIF.\n  ENDLOOP.\n\n  IF gt_sum IS INITIAL.\n    WRITE 'NOTHING TO SETTLE'.\n    RETURN.\n  ENDIF.\n  SORT gt_sum BY kostv.\n  LOOP AT gt_sum INTO DATA(gs_sum).\n    WRITE: / 'SETTLE', gs_sum-kostv, gs_sum-amt.\n  ENDLOOP." },

  // =================== Lv.5 New Syntax ===================
  { id: 6551, lv: 5, title: 'SWITCH 로 원가요소 범주', ban: ['IF', 'CASE'],
    body: '원가요소 마스터 CSKB 의 KATYP 은 원가요소 범주입니다.\n1 → 1차원가, 41 → 오버헤드, 42 → 배부, 43 → 활동배분, 그 밖 → 기타\n원가요소 목록 gt_itab(kstar, katyp)을 "원가요소 범주명"으로 한 줄씩 출력하고, 마지막 줄에 "PRIMARY 1차원가요소수"를 출력하세요.\nIF, CASE 대신 SWITCH 와 REDUCE ... FOR ... WHERE 를 쓰세요.',
    fields: [['cskb-kstar', '원가요소'], ['cskb-katyp', '원가요소 범주']],
    structs: { ty_kstar: [{ n: 'kstar', t: 'string' }, { n: 'katyp', t: 'string' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_kstar' }], inDesc: 'gt_itab: 1~50행', outDesc: '원가요소마다 한 줄, 마지막에 PRIMARY 줄을 출력합니다.',
    tests: [[['4100000', '1'], ['4200000', '1'], ['9400000', '42'], ['9500000', '43'], ['9100000', '41'], ['9900000', '90']], [['9400000', '42']], [['4100000', '1']]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => [...gt_itab.map(([k, t]) => `${k} ${({ 1: '1차원가', 41: '오버헤드', 42: '배부', 43: '활동배분' })[t] || '기타'}`), `PRIMARY ${gt_itab.filter(r => r[1] === '1').length}`].join('\n'),
    sol: "LOOP AT gt_itab INTO DATA(gs_itab).\n  WRITE: / gs_itab-kstar, SWITCH string( gs_itab-katyp\n    WHEN '1'  THEN `1차원가`\n    WHEN '41' THEN `오버헤드`\n    WHEN '42' THEN `배부`\n    WHEN '43' THEN `활동배분`\n    ELSE `기타` ).\nENDLOOP.\nDATA(lv_cnt) = REDUCE i( INIT n = 0 FOR r IN gt_itab WHERE ( katyp = '1' ) NEXT n = n + 1 ).\nWRITE: / 'PRIMARY', lv_cnt." },

  { id: 6552, lv: 5, title: 'COND 와 REDUCE 로 소진율 등급', ban: ['IF', 'CASE'],
    body: '원가센터별 예산·실적 gt_itab(kostl, budget, actual)이 주어집니다.\n· 소진율 = 실적 × 100 / 예산 (반올림한 정수)\n· 등급: 100 초과 OVER, 80 이상 WARN, 그 밖 OK\n원가센터마다 "원가센터 소진율 등급"을, 마지막 줄에 "TOTAL 예산합 실적합"을 출력하세요.\nIF, CASE 대신 COND 를, 합계는 LOOP 누적 대신 REDUCE 를 쓰세요.',
    fields: [['zco_budget-budget', '예산'], ['coep-wkgbtr', '실적 금액'], ['csks-kostl', '원가센터']],
    structs: { ty_bud: [{ n: 'kostl', t: 'string' }, { n: 'budget', t: 'i' }, { n: 'actual', t: 'i' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_bud' }], inDesc: 'gt_itab: 1~50행, 1 ≤ budget', outDesc: '원가센터마다 한 줄, 마지막에 TOTAL 줄을 출력합니다.',
    tests: [[['C100', 1500, 1300], ['C200', 1200, 1350], ['C300', 300, 400], ['C400', 500, 0]], [['C100', 1000, 795]], [['C1', 1000, 1004], ['C2', 1000, 1005]]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => [...gt_itab.map(([k, b, a]) => { const r = rh(a * 100 / b); return `${k} ${r} ${r > 100 ? 'OVER' : r >= 80 ? 'WARN' : 'OK'}`; }), `TOTAL ${gt_itab.reduce((s, r) => s + r[1], 0)} ${gt_itab.reduce((s, r) => s + r[2], 0)}`].join('\n'),
    sol: "DATA lv_rate TYPE i.\nLOOP AT gt_itab INTO DATA(gs_itab).\n  lv_rate = gs_itab-actual * 100 / gs_itab-budget.\n  WRITE: / gs_itab-kostl, lv_rate, COND string( WHEN lv_rate > 100 THEN `OVER`\n                                                 WHEN lv_rate >= 80 THEN `WARN`\n                                                 ELSE `OK` ).\nENDLOOP.\nDATA(lv_bud) = REDUCE i( INIT s = 0 FOR r IN gt_itab NEXT s = s + r-budget ).\nDATA(lv_act) = REDUCE i( INIT s = 0 FOR r IN gt_itab NEXT s = s + r-actual ).\nWRITE: / 'TOTAL', lv_bud, lv_act." },

  { id: 6554, lv: 5, kind: 'rpt', title: '새 문법 원가센터 실적 리포트', ban: ['READ', 'COLLECT', 'APPEND'],
    body: '관리회계 영역 p_kokrs 의 원가센터별 실적을 새 문법으로 출력하세요.\n· CSKS 의 원가센터를 원가센터 순으로, CSKT 한국어 이름(spras = \'3\'), COEP 의 같은 오브젝트(OBJNR) 금액 합계(모든 연도)를 붙입니다.\n· "원가센터 이름 실적"을 출력하고, 이름이 없으면 - 를 씁니다.\n· 마지막 줄에 "TOTAL 실적합계"\n· READ TABLE, COLLECT, APPEND 대신 테이블 식(itab[ ... ]) 과 VALUE ... OPTIONAL/DEFAULT, REDUCE ... WHERE 를 쓰세요.',
    fields: [['csks-objnr', '오브젝트 번호'], ['cskt-ktext', '원가센터 이름'], ['cskt-spras', '언어 키'], ['coep-wkgbtr', '실적 금액']],
    tables: ['csks', 'cskt', 'coep'], sel: [{ n: 'p_kokrs', kind: 'p', decl: 'TYPE csks-kokrs', label: '관리회계 영역' }],
    tests: ['1000', '2000', '3000'].map(p_kokrs => ({ p_kokrs, db: { csks: CO_CSKS, cskt: CO_CSKT.filter(r => r[1] !== 'C400'), coep: CO_COEP } })),
    ref: ({ p_kokrs, db }) => { const c = coSort(db.csks.filter(r => r[0] === p_kokrs), r => r[1]); let t = 0; const o = c.map(r => { const tx = db.cskt.find(x => x[0] === p_kokrs && x[1] === r[1] && x[2] === '3'); const a = coAct(db, r[5]); t += a; return `${r[1]} ${tx ? tx[3] : '-'} ${a}`; }); o.push(`TOTAL ${t}`); return o.join('\n'); },
    sol: "REPORT zco_cc_actual_new.\n\nPARAMETERS p_kokrs TYPE csks-kokrs.\n\nSTART-OF-SELECTION.\n  SELECT kostl, objnr FROM csks\n    WHERE kokrs = @p_kokrs\n    ORDER BY kostl\n    INTO TABLE @DATA(gt_csks).\n  SELECT kostl, ktext FROM cskt\n    WHERE kokrs = @p_kokrs AND spras = '3'\n    INTO TABLE @DATA(gt_text).\n  SELECT objnr, wkgbtr FROM coep INTO TABLE @DATA(gt_coep).\n\n  DATA lv_total TYPE i.\n  LOOP AT gt_csks INTO DATA(gs_cc).\n    DATA(lv_text) = VALUE #( gt_text[ kostl = gs_cc-kostl ]-ktext DEFAULT `-` ).\n    DATA(lv_act) = REDUCE i( INIT s = 0 FOR c IN gt_coep WHERE ( objnr = gs_cc-objnr ) NEXT s = s + c-wkgbtr ).\n    WRITE: / gs_cc-kostl, lv_text, lv_act.\n    lv_total = lv_total + lv_act.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_total.",
  },
  // =================== 2차 교체 문제 ===================
  { id: 6511, lv: 1, title: '1분기 실적 합계 (COSP 기간 컬럼)',
    body: 'CO 합계 테이블 COSP 는 한 줄에 열두 달 금액을 WKG001(1기간) ~ WKG012(12기간) 컬럼으로 나눠 담습니다.\n어떤 원가센터의 1~3기간 실적 wkg001, wkg002, wkg003 과 1분기 계획 plan 이 주어집니다.\n· 분기 실적 = 세 기간의 합\n· 소진율(%) = 분기 실적 × 100 / 계획 (i 타입 변수에 담아 반올림)\n· 상태: 실적이 계획보다 크면 OVER, 작으면 UNDER, 같으면 ON\n"분기실적 소진율 상태"를 출력하세요.',
    fields: [['cosp-wkg001', '1기간 금액 (WKG001~WKG012 = 1~12월)'], ['cosp-wrttp', '값 유형 (01 계획, 04 실적)'], ['cosp-objnr', '오브젝트 번호 (KS+원가센터)']],
    inputs: [{ n: 'wkg001', t: 'i' }, { n: 'wkg002', t: 'i' }, { n: 'wkg003', t: 'i' }, { n: 'plan', t: 'i' }], inDesc: '0 ≤ wkg001~wkg003 ≤ 1,000,000 / 1 ≤ plan ≤ 3,000,000', outDesc: '"분기실적 소진율 상태"를 한 줄에 출력합니다.',
    tests: [[100, 120, 80, 300], [300, 280, 320, 750], [60, 70, 50, 240], [1, 1, 0, 3], [0, 0, 0, 100], [5, 5, 5, 8]].map(([wkg001, wkg002, wkg003, plan]) => ({ wkg001, wkg002, wkg003, plan })),
    ref: ({ wkg001, wkg002, wkg003, plan }) => { const a = wkg001 + wkg002 + wkg003; return `${a} ${rh(a * 100 / plan)} ${a > plan ? 'OVER' : a < plan ? 'UNDER' : 'ON'}`; },
    sol: L('DATA: lv_act  TYPE i,', '      lv_rate TYPE i,', '      lv_stat TYPE string.', 'lv_act = wkg001 + wkg002 + wkg003.', 'lv_rate = lv_act * 100 / plan.', 'IF lv_act > plan.', "  lv_stat = 'OVER'.", 'ELSEIF lv_act < plan.', "  lv_stat = 'UNDER'.", 'ELSE.', "  lv_stat = 'ON'.", 'ENDIF.', 'WRITE: lv_act, lv_rate, lv_stat.') },

  { id: 6512, lv: 1, title: '손익센터 유효 여부 (CEPC-DATBI)',
    body: '손익센터 마스터 CEPC 는 유효 종료일 DATBI 까지만 쓸 수 있습니다. (계속 쓰는 손익센터는 99991231)\n손익센터 prctr, 관리회계 영역 kokrs, 유효 종료일 datbi, 전기일 p_budat 이 주어집니다.\n· 관리회계 영역이 1000 이 아니면 "손익센터 OTHER AREA"\n· 전기일이 유효 종료일보다 뒤면 "손익센터 EXPIRED"\n· 그 밖에는 "손익센터 VALID 남은일수" (남은일수 = datbi - p_budat)\n를 출력하세요.',
    fields: [['cepc-prctr', '손익센터'], ['cepc-datbi', '유효 종료일'], ['cepc-kokrs', '관리회계 영역']],
    inputs: [{ n: 'prctr', t: 'string' }, { n: 'kokrs', t: 'string' }, { n: 'datbi', t: 'd' }, { n: 'p_budat', t: 'd' }], inDesc: 'datbi, p_budat: YYYYMMDD', outDesc: '한 줄을 출력합니다.',
    tests: [['P3000', '1000', '20261231', '20261110'], ['P8000', '1000', '20241231', '20260105'], ['P9000', '2000', '99991231', '20260105'], ['P1000', '1000', '20261110', '20261110'], ['P2000', '1000', '20260301', '20260302']].map(([prctr, kokrs, datbi, p_budat]) => ({ prctr, kokrs, datbi, p_budat })),
    ref: ({ prctr, kokrs, datbi, p_budat }) => kokrs !== '1000' ? `${prctr} OTHER AREA` : p_budat > datbi ? `${prctr} EXPIRED` : `${prctr} VALID ${ddays(p_budat, datbi)}`,
    sol: L("IF kokrs <> '1000'.", "  WRITE: prctr, 'OTHER AREA'.", 'ELSEIF p_budat > datbi.', "  WRITE: prctr, 'EXPIRED'.", 'ELSE.', '  DATA(lv_days) = datbi - p_budat.', "  WRITE: prctr, 'VALID', lv_days.", 'ENDIF.') },

  // ---- Lv.2
  { id: 6521, lv: 2, kind: 'rpt', title: '원가센터의 손익센터 조회 (CSKS·CEPCT·TKA01)',
    body: '원가센터는 손익센터(CSKS-PRCTR)에 속합니다. 관리회계 영역 p_kokrs 의 원가센터 p_kostl 이 어느 손익센터에 속하는지 조회하세요.\n· CSKS 와 손익센터 내역 CEPCT(한국어 spras = \'3\')를 PRCTR 로 INNER JOIN 해서 SELECT SINGLE 합니다.\n· 관리회계 영역의 통화는 TKA01-WAERS 에서 읽습니다.\n· "원가센터 손익센터 손익센터명 통화"를 출력하고, 원가센터가 없으면 NOT FOUND 를 출력합니다.',
    fields: [['csks-prctr', '원가센터가 속한 손익센터'], ['cepct-ktext', '손익센터 내역'], ['cepct-spras', '언어 키'], ['tka01-kokrs', '관리회계 영역'], ['tka01-waers', '관리회계 영역 통화']],
    tables: ['csks', 'cepct', 'tka01'], sel: [{ n: 'p_kokrs', kind: 'p', decl: 'TYPE csks-kokrs', label: '관리회계 영역' }, { n: 'p_kostl', kind: 'p', decl: 'TYPE csks-kostl', label: '원가센터' }],
    tests: [['1000', 'C100'], ['1000', 'C400'], ['2000', 'D100'], ['1000', 'C999'], ['1000', 'C300']].map(([p_kokrs, p_kostl]) => ({ p_kokrs, p_kostl, db: { csks: CO_CSKS, cepct: CO_CEPCT, tka01: CO_TKA01 } })),
    ref: ({ p_kokrs, p_kostl, db }) => { const c = db.csks.find(r => r[0] === p_kokrs && r[1] === p_kostl); const t = c && db.cepct.find(r => r[0] === c[6] && r[1] === '3'); if (!c || !t) return 'NOT FOUND'; const k = db.tka01.find(r => r[0] === p_kokrs); return `${c[1]} ${c[6]} ${t[2]} ${k ? k[2] : ''}`; },
    sol: "REPORT zco_cc_prctr.\n\nPARAMETERS: p_kokrs TYPE csks-kokrs,\n            p_kostl TYPE csks-kostl.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE c~kostl, c~prctr, t~ktext\n    FROM csks AS c\n    INNER JOIN cepct AS t ON t~prctr = c~prctr\n    WHERE c~kokrs = @p_kokrs\n      AND c~kostl = @p_kostl\n      AND t~spras = '3'\n    INTO @DATA(gs_cc).\n  IF sy-subrc <> 0.\n    WRITE 'NOT FOUND'.\n    RETURN.\n  ENDIF.\n\n  SELECT SINGLE waers FROM tka01\n    WHERE kokrs = @p_kokrs\n    INTO @DATA(lv_waers).\n  WRITE: gs_cc-kostl, gs_cc-prctr, gs_cc-ktext, lv_waers." },

  { id: 6522, lv: 2, kind: 'rpt', title: '원가요소별 연간 실적 (COSP)',
    body: '원가센터 p_kostl 의 회계연도 p_gjahr 실적을 COSP 에서 읽어 원가요소별 연간 합계를 내세요.\n· 오브젝트 번호 OBJNR = \'KS\' && 원가센터, 실적은 값 유형 WRTTP = \'04\', 버전 VERSN = \'000\' 입니다. (01 은 계획이므로 빼세요)\n· 한 줄의 연간 합계 = WKG001 + WKG002 + … + WKG012\n· 원가요소(KSTAR) 순으로 "원가요소 연간합계", 마지막 줄에 "TOTAL 전체합계"\n· 데이터가 없으면 NO DATA.',
    fields: [['cosp-objnr', '오브젝트 번호 (KS+원가센터)'], ['cosp-wrttp', '값 유형 (01 계획, 04 실적)'], ['cosp-versn', '버전 (000 = 실적·기본 계획)'], ['cosp-kstar', '원가요소'], ['cosp-wkg001', '1기간 금액 … WKG012 12기간']],
    tables: ['cosp'], sel: [{ n: 'p_kostl', kind: 'p', decl: 'TYPE csks-kostl', label: '원가센터' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE cosp-gjahr', label: '회계연도' }],
    tests: [['C100', '2026'], ['C200', '2026'], ['C100', '2025'], ['C999', '2026']].map(([p_kostl, p_gjahr]) => ({ p_kostl, p_gjahr, db: { cosp: CO_COSP } })),
    ref: ({ p_kostl, p_gjahr, db }) => { const r = coSort(db.cosp.filter(x => x[0] === 'KS' + p_kostl && x[1] === p_gjahr && x[2] === '04' && x[3] === '000'), x => x[4]); if (!r.length) return 'NO DATA'; const v = r.map(x => [x[4], coRowSum(x, 1, 12)]); return [...v.map(x => `${x[0]} ${x[1]}`), `TOTAL ${v.reduce((s, x) => s + x[1], 0)}`].join('\n'); },
    sol: "REPORT zco_cosp_year.\n\nPARAMETERS: p_kostl TYPE csks-kostl,\n            p_gjahr TYPE cosp-gjahr.\n\nSTART-OF-SELECTION.\n  DATA(lv_objnr) = |KS{ p_kostl }|.\n  SELECT kstar, wkg001, wkg002, wkg003, wkg004, wkg005, wkg006,\n         wkg007, wkg008, wkg009, wkg010, wkg011, wkg012\n    FROM cosp\n    WHERE objnr = @lv_objnr\n      AND gjahr = @p_gjahr\n      AND wrttp = '04'\n      AND versn = '000'\n    ORDER BY kstar\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_year  TYPE i,\n        lv_total TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    lv_year = gs_itab-wkg001 + gs_itab-wkg002 + gs_itab-wkg003 + gs_itab-wkg004\n            + gs_itab-wkg005 + gs_itab-wkg006 + gs_itab-wkg007 + gs_itab-wkg008\n            + gs_itab-wkg009 + gs_itab-wkg010 + gs_itab-wkg011 + gs_itab-wkg012.\n    WRITE: / gs_itab-kstar, lv_year.\n    lv_total = lv_total + lv_year.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_total." },

  { id: 6524, lv: 2, kind: 'rpt', title: '1분기 배부 실적 ALV (COSS, REUSE)',
    body: '원가센터끼리 주고받은 배부 금액은 내부 원가 합계 COSS 에 쌓입니다. OBJNR 은 받은 오브젝트, PAROB 는 보낸(파트너) 오브젝트입니다.\n회계연도 p_gjahr 의 실적(WRTTP = \'04\') 배부 금액을 1분기 기준으로 ALV 에 보여 주세요.\n· 1분기 = WKG001 + WKG002 + WKG003\n· 받은 오브젝트, 보낸 오브젝트, 원가요소 순으로 정렬합니다.\n· 필드 카탈로그(slis_t_fieldcat_alv) 순서: OBJNR(받는곳), PAROB(보낸곳), KSTAR(원가요소), Q1(1분기, do_sum = \'X\')\n· 제목(i_grid_title)은 1분기 배부 실적',
    fields: [['coss-objnr', '받은 오브젝트'], ['coss-parob', '파트너(보낸) 오브젝트'], ['coss-kstar', '배부 원가요소 (2차)'], ['coss-wrttp', '값 유형 (04 실적)'], ['coss-wkg001', '1기간 금액']],
    tables: ['coss'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coss-gjahr', label: '회계연도' }],
    tests: ['2026', '2025', '2024'].map(p_gjahr => ({ p_gjahr, db: { coss: CO_COSS } })),
    ref: ({ p_gjahr, db }) => { const r = coSort(db.coss.filter(x => x[1] === p_gjahr && x[2] === '04'), x => x[0] + '|' + x[5] + '|' + x[4]); return alvTxt('1분기 배부 실적', ['받는곳', '보낸곳', '원가요소', '1분기'], r.map(x => [x[0], x[5], x[4], String(cossSum(x, 1, 3))]), ['합계', '', '', String(r.reduce((s, x) => s + cossSum(x, 1, 3), 0))]); },
    sol: "REPORT zco_coss_alv.\n\nTYPE-POOLS slis.\nPARAMETERS p_gjahr TYPE coss-gjahr.\n\nTYPES: BEGIN OF ty_out,\n         objnr TYPE coss-objnr,\n         parob TYPE coss-parob,\n         kstar TYPE coss-kstar,\n         q1    TYPE i,\n       END OF ty_out.\nDATA gt_out TYPE TABLE OF ty_out.\n\nSTART-OF-SELECTION.\n  SELECT objnr, parob, kstar, wkg001, wkg002, wkg003\n    FROM coss\n    WHERE gjahr = @p_gjahr\n      AND wrttp = '04'\n    ORDER BY objnr, parob, kstar\n    INTO TABLE @DATA(gt_coss).\n  LOOP AT gt_coss INTO DATA(gs_coss).\n    APPEND VALUE #( objnr = gs_coss-objnr parob = gs_coss-parob kstar = gs_coss-kstar\n                    q1 = gs_coss-wkg001 + gs_coss-wkg002 + gs_coss-wkg003 ) TO gt_out.\n  ENDLOOP.\n\n  DATA gt_fcat TYPE slis_t_fieldcat_alv.\n  APPEND VALUE #( fieldname = 'OBJNR' seltext_m = '받는곳' ) TO gt_fcat.\n  APPEND VALUE #( fieldname = 'PAROB' seltext_m = '보낸곳' ) TO gt_fcat.\n  APPEND VALUE #( fieldname = 'KSTAR' seltext_m = '원가요소' ) TO gt_fcat.\n  APPEND VALUE #( fieldname = 'Q1' seltext_m = '1분기' do_sum = 'X' ) TO gt_fcat.\n\n  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'\n    EXPORTING\n      i_grid_title = '1분기 배부 실적'\n      it_fieldcat  = gt_fcat\n    TABLES\n      t_outtab     = gt_out." },

  // ---- Lv.3
  { id: 6533, lv: 3, kind: 'rpt', title: '손익센터 ALV 더블클릭 → 원가센터 실적', must: ['cl_gui_alv_grid', 'double_click'],
    body: '관리회계 영역 \'1000\' 의 손익센터(CEPC)를 CL_GUI_ALV_GRID 로 보여 주고, 행을 더블클릭하면 그 손익센터에 속한 원가센터들의 실적을 메시지로 보여 주세요.\n· ALV 열: PRCTR(손익센터), KTEXT(이름, CEPCT 한국어), VERAK(책임자) — 손익센터 순\n· 더블클릭하면 CSKS 에서 PRCTR 이 같은 원가센터(관리회계 영역 \'1000\')를 찾고, 그 원가센터들 오브젝트(CSKS-OBJNR)의 2026년 COSP 실적(WRTTP \'04\', VERSN \'000\') WKG001~WKG012 합계를 구합니다.\n· MESSAGE |손익센터 CC 원가센터수 ACTUAL 실적합계| TYPE \'I\' 로 보여 줍니다.\n· 채점기가 테스트마다 "n번째 행 더블클릭"을 대신 일으킵니다(e_row-index = n).',
    fields: [['cepc-prctr', '손익센터'], ['cepct-ktext', '손익센터 내역'], ['cepc-verak', '책임자'], ['csks-prctr', '원가센터 → 손익센터 연결'], ['cosp-wkg001', '기간 금액 (WKG001~WKG012)']],
    tables: ['cepc', 'cepct', 'csks', 'cosp'], sel: [],
    tests: [[{ ev: 'double_click', row: 1, col: 'PRCTR' }], [{ ev: 'double_click', row: 3, col: 'KTEXT' }, { ev: 'double_click', row: 2, col: 'VERAK' }], [{ ev: 'double_click', row: 4, col: 'PRCTR' }]].map(events => ({ events, db: { cepc: CO_CEPC, cepct: CO_CEPCT, csks: CO_CSKS, cosp: CO_COSP } })),
    ref: ({ events, db }) => { const r = coSort(db.cepc.filter(x => x[2] === '1000'), x => x[0]); const tx = p => { const t = db.cepct.find(x => x[0] === p && x[1] === '3'); return t ? t[2] : ''; }; const out = [alvTxt('', ['손익센터', '이름', '책임자'], r.map(x => [x[0], tx(x[0]), x[3]]))]; for (const e of events) { const p = r[e.row - 1]; const cc = db.csks.filter(x => x[0] === '1000' && x[6] === p[0]); let a = 0; cc.forEach(c => db.cosp.filter(x => x[0] === c[5] && x[1] === '2026' && x[2] === '04' && x[3] === '000').forEach(x => a += coRowSum(x, 1, 12))); out.push(`${p[0]} CC ${cc.length} ACTUAL ${a}`); } return out.join('\n'); },
    sol: "REPORT zco_prctr_grid.\n\nTYPES: BEGIN OF ty_pc,\n         prctr TYPE cepc-prctr,\n         ktext TYPE cepct-ktext,\n         verak TYPE cepc-verak,\n       END OF ty_pc.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF ty_pc.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    METHODS on_double_click FOR EVENT double_click OF cl_gui_alv_grid\n      IMPORTING e_row.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_double_click.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row-index.\n    CHECK sy-subrc = 0.\n    SELECT kostl, objnr FROM csks\n      WHERE kokrs = '1000' AND prctr = @gs_itab-prctr\n      INTO TABLE @DATA(gt_cc).\n    DATA lv_amt TYPE i.\n    LOOP AT gt_cc INTO DATA(gs_cc).\n      SELECT kstar, wkg001, wkg002, wkg003, wkg004, wkg005, wkg006,\n             wkg007, wkg008, wkg009, wkg010, wkg011, wkg012\n        FROM cosp\n        WHERE objnr = @gs_cc-objnr AND gjahr = '2026'\n          AND wrttp = '04' AND versn = '000'\n        INTO TABLE @DATA(gt_cosp).\n      LOOP AT gt_cosp INTO DATA(gs_cosp).\n        lv_amt = lv_amt + gs_cosp-wkg001 + gs_cosp-wkg002 + gs_cosp-wkg003 + gs_cosp-wkg004\n               + gs_cosp-wkg005 + gs_cosp-wkg006 + gs_cosp-wkg007 + gs_cosp-wkg008\n               + gs_cosp-wkg009 + gs_cosp-wkg010 + gs_cosp-wkg011 + gs_cosp-wkg012.\n      ENDLOOP.\n    ENDLOOP.\n    MESSAGE |{ gs_itab-prctr } CC { lines( gt_cc ) } ACTUAL { lv_amt }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT p~prctr, t~ktext, p~verak\n    FROM cepc AS p\n    LEFT OUTER JOIN cepct AS t ON t~prctr = p~prctr AND t~spras = '3'\n    WHERE p~kokrs = '1000'\n    ORDER BY prctr\n    INTO CORRESPONDING FIELDS OF TABLE @gt_itab.\n\n  gt_fcat = VALUE #( ( fieldname = 'PRCTR' coltext = '손익센터' )\n                     ( fieldname = 'KTEXT' coltext = '이름' )\n                     ( fieldname = 'VERAK' coltext = '책임자' ) ).\n  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).\n  DATA(go_handler) = NEW lcl_handler( ).\n  SET HANDLER go_handler->on_double_click FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },

  // ---- Lv.4
  { id: 6541, lv: 4, kind: 'rpt', title: '계획 대비 실적 (COSP 01·04)',
    body: '원가센터별 계획 대비 실적 리포트를 COSP 로 만드세요.\n· 대상: CSKS 관리회계 영역 \'1000\' 의 원가센터 중 범위 s_kostl 에 드는 것, 원가센터 순\n· 오브젝트 OBJNR = CSKS-OBJNR, 회계연도 p_gjahr, 버전 VERSN = \'000\'\n· 계획 = 값 유형 WRTTP \'01\' 줄들의 WKG001 ~ WKG(p_to) 합계, 실적 = WRTTP \'04\' 줄들의 같은 기간 합계 (p_to: 1~12)\n· 차이 = 실적 - 계획, 소진율 = 실적 × 100 / 계획 (반올림)\n· 상태: 계획이 0 이면 NO PLAN(소진율 0), 소진율 100 초과 OVER, 80 이상 WARN, 그 밖 OK\n· "원가센터 계획 실적 차이 소진율 상태"를 한 줄씩, 마지막에 "TOTAL 계획합 실적합 차이합"\n· 대상 원가센터가 없으면 NO DATA.',
    fields: [['cosp-wrttp', '값 유형 (01 계획, 04 실적)'], ['cosp-versn', '버전'], ['cosp-wkg001', '기간 금액 WKG001~WKG012'], ['csks-objnr', '원가센터 오브젝트 번호']],
    tables: ['csks', 'cosp'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE cosp-gjahr', label: '회계연도' }, { n: 'p_to', kind: 'p', decl: 'TYPE i', label: '마지막 기간' }, { n: 's_kostl', kind: 's', decl: 'FOR csks-kostl', label: '원가센터' }],
    tests: [['2026', 3, []], ['2026', 6, [['I', 'BT', 'C100', 'C200']]], ['2025', 12, []], ['2026', 1, [['I', 'EQ', 'C999', '']]], ['2026', 4, [['E', 'EQ', 'C100', '']]]].map(([p_gjahr, p_to, s_kostl]) => ({ p_gjahr, p_to, s_kostl, db: { csks: CO_CSKS, cosp: CO_COSP } })),
    ref: ({ p_gjahr, p_to, s_kostl, db }) => { const c = coSort(db.csks.filter(r => r[0] === '1000' && jsIn(r[1], s_kostl)), r => r[1]); if (!c.length) return 'NO DATA'; let tp = 0, ta = 0; const sum = (o, w) => db.cosp.filter(x => x[0] === o && x[1] === p_gjahr && x[2] === w && x[3] === '000').reduce((s, x) => s + coRowSum(x, 1, p_to), 0); const out = c.map(r => { const p = sum(r[5], '01'), a = sum(r[5], '04'); tp += p; ta += a; const rt = p ? rh(a * 100 / p) : 0; const st = !p ? 'NO PLAN' : rt > 100 ? 'OVER' : rt >= 80 ? 'WARN' : 'OK'; return `${r[1]} ${p} ${a} ${a - p} ${rt} ${st}`; }); out.push(`TOTAL ${tp} ${ta} ${ta - tp}`); return out.join('\n'); },
    sol: "REPORT zco_plan_actual.\n\nPARAMETERS: p_gjahr TYPE cosp-gjahr,\n            p_to    TYPE i.\nSELECT-OPTIONS s_kostl FOR csks-kostl.\n\nSTART-OF-SELECTION.\n  SELECT kostl, objnr FROM csks\n    WHERE kokrs = '1000' AND kostl IN @s_kostl\n    ORDER BY kostl\n    INTO TABLE @DATA(gt_cc).\n  IF gt_cc IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  SELECT objnr, wrttp, kstar, wkg001, wkg002, wkg003, wkg004, wkg005, wkg006,\n         wkg007, wkg008, wkg009, wkg010, wkg011, wkg012\n    FROM cosp\n    WHERE gjahr = @p_gjahr AND versn = '000'\n    INTO TABLE @DATA(gt_cosp).\n\n  DATA: gt_w   TYPE TABLE OF i,\n        lv_plan TYPE i,\n        lv_act  TYPE i,\n        lv_rate TYPE i,\n        lv_stat TYPE string,\n        lv_tp   TYPE i,\n        lv_ta   TYPE i.\n  LOOP AT gt_cc INTO DATA(gs_cc).\n    CLEAR: lv_plan, lv_act.\n    LOOP AT gt_cosp INTO DATA(gs_cosp) WHERE objnr = gs_cc-objnr.\n      gt_w = VALUE #( ( gs_cosp-wkg001 ) ( gs_cosp-wkg002 ) ( gs_cosp-wkg003 ) ( gs_cosp-wkg004 )\n                      ( gs_cosp-wkg005 ) ( gs_cosp-wkg006 ) ( gs_cosp-wkg007 ) ( gs_cosp-wkg008 )\n                      ( gs_cosp-wkg009 ) ( gs_cosp-wkg010 ) ( gs_cosp-wkg011 ) ( gs_cosp-wkg012 ) ).\n      LOOP AT gt_w INTO DATA(lv_w) TO p_to.\n        CASE gs_cosp-wrttp.\n          WHEN '01'. lv_plan = lv_plan + lv_w.\n          WHEN '04'. lv_act = lv_act + lv_w.\n        ENDCASE.\n      ENDLOOP.\n    ENDLOOP.\n    IF lv_plan = 0.\n      lv_rate = 0.\n      lv_stat = 'NO PLAN'.\n    ELSE.\n      lv_rate = lv_act * 100 / lv_plan.\n      IF lv_rate > 100.\n        lv_stat = 'OVER'.\n      ELSEIF lv_rate >= 80.\n        lv_stat = 'WARN'.\n      ELSE.\n        lv_stat = 'OK'.\n      ENDIF.\n    ENDIF.\n    WRITE: / gs_cc-kostl, lv_plan, lv_act, lv_act - lv_plan, lv_rate, lv_stat.\n    lv_tp = lv_tp + lv_plan.\n    lv_ta = lv_ta + lv_act.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_tp, lv_ta, lv_ta - lv_tp." },

  { id: 6544, lv: 4, kind: 'rpt', title: '손익센터 손익 리포트 (ACDOCA)',
    body: 'S/4HANA 의 유니버설 저널 ACDOCA 로 손익센터별 손익을 구하세요.\n· 원장 RLDNR = \'0L\', 회사코드 RBUKRS = p_bukrs, 회계연도 GJAHR = p_gjahr, 기간 POPER 는 범위 s_poper\n· 계정 RACCT 가 4 로 시작하면 매출, 5 로 시작하면 비용입니다. 다른 계정과 손익센터(PRCTR)가 비어 있는 줄은 빼세요.\n· HSL 은 차변(S) +, 대변(H) - 로 저장되어 있습니다. 매출 = 4계정 HSL 합계의 부호를 바꾼 값, 비용 = 5계정 HSL 합계, 이익 = 매출 - 비용\n· 손익센터 순으로 "손익센터 이름 매출 비용 이익" (이름: CEPCT 한국어, 없으면 -), 마지막 줄에 "TOTAL 매출 비용 이익"\n· 대상 줄이 없으면 NO DATA.',
    fields: [['acdoca-rldnr', '원장 (0L 선도원장)'], ['acdoca-racct', 'G/L 계정'], ['acdoca-prctr', '손익센터'], ['acdoca-drcrk', '차대 구분 (S/H)'], ['acdoca-hsl', '회사코드 통화 금액 (부호 있음)'], ['acdoca-poper', '전기 기간']],
    tables: ['acdoca', 'cepct'], sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE acdoca-rbukrs', label: '회사코드' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE acdoca-gjahr', label: '회계연도' }, { n: 's_poper', kind: 's', decl: 'FOR acdoca-poper', label: '기간' }],
    tests: [['1000', '2026', []], ['1000', '2026', [['I', 'BT', '002', '003']]], ['2000', '2026', []], ['1000', '2024', []], ['1000', '2026', [['I', 'EQ', '001', '']]]].map(([p_bukrs, p_gjahr, s_poper]) => ({ p_bukrs, p_gjahr, s_poper, db: { acdoca: CO_ACDOCA, cepct: CO_CEPCT } })),
    ref: ({ p_bukrs, p_gjahr, s_poper, db }) => { const r = db.acdoca.filter(x => x[0] === '0L' && x[1] === p_bukrs && x[2] === p_gjahr && jsIn(x[13], s_poper) && x[7] && (x[5][0] === '4' || x[5][0] === '5')); if (!r.length) return 'NO DATA'; const m = {}; r.forEach(x => { m[x[7]] = m[x[7]] || [0, 0]; if (x[5][0] === '4') m[x[7]][0] -= x[11]; else m[x[7]][1] += x[11]; }); let tr = 0, tc = 0; const out = Object.keys(m).sort().map(p => { const t = db.cepct.find(x => x[0] === p && x[1] === '3'); const [rv, c] = m[p]; tr += rv; tc += c; return `${p} ${t ? t[2] : '-'} ${rv} ${c} ${rv - c}`; }); out.push(`TOTAL ${tr} ${tc} ${tr - tc}`); return out.join('\n'); },
    sol: "REPORT zco_prctr_pl.\n\nPARAMETERS: p_bukrs TYPE acdoca-rbukrs,\n            p_gjahr TYPE acdoca-gjahr.\nSELECT-OPTIONS s_poper FOR acdoca-poper.\n\nTYPES: BEGIN OF ty_pl,\n         prctr TYPE acdoca-prctr,\n         rev   TYPE i,\n         cost  TYPE i,\n       END OF ty_pl.\nDATA gt_pl TYPE TABLE OF ty_pl.\n\nSTART-OF-SELECTION.\n  SELECT prctr, racct, hsl FROM acdoca\n    WHERE rldnr = '0L'\n      AND rbukrs = @p_bukrs\n      AND gjahr = @p_gjahr\n      AND poper IN @s_poper\n      AND prctr <> ''\n    INTO TABLE @DATA(gt_acd).\n\n  LOOP AT gt_acd INTO DATA(gs_acd).\n    CASE gs_acd-racct+0(1).\n      WHEN '4'. COLLECT VALUE ty_pl( prctr = gs_acd-prctr rev = 0 - gs_acd-hsl ) INTO gt_pl.\n      WHEN '5'. COLLECT VALUE ty_pl( prctr = gs_acd-prctr cost = gs_acd-hsl ) INTO gt_pl.\n    ENDCASE.\n  ENDLOOP.\n  IF gt_pl IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  SELECT prctr, ktext FROM cepct WHERE spras = '3' INTO TABLE @DATA(gt_txt).\n  SORT gt_pl BY prctr.\n  DATA: lv_txt TYPE string,\n        lv_tr  TYPE i,\n        lv_tc  TYPE i.\n  LOOP AT gt_pl INTO DATA(gs_pl).\n    READ TABLE gt_txt INTO DATA(gs_txt) WITH KEY prctr = gs_pl-prctr.\n    lv_txt = COND #( WHEN sy-subrc = 0 THEN gs_txt-ktext ELSE `-` ).\n    WRITE: / gs_pl-prctr, lv_txt, gs_pl-rev, gs_pl-cost, gs_pl-rev - gs_pl-cost.\n    lv_tr = lv_tr + gs_pl-rev.\n    lv_tc = lv_tc + gs_pl-cost.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_tr, lv_tc, lv_tr - lv_tc." },

  // ---- Lv.5
  { id: 6553, lv: 5, kind: 'rpt', title: '원가센터 분기 실적 (COSP, GROUP BY 루프)', ban: ['COLLECT', 'READ', 'IF', 'CASE'],
    body: '회계연도 p_gjahr 의 원가센터 실적을 분기별로 정리하세요.\n· COSP 에서 실적 WRTTP = \'04\', 버전 VERSN = \'000\', 원가센터 오브젝트(OBJNR 이 KS 로 시작, LIKE \'KS%\')만 읽습니다.\n· 오브젝트별로 묶어(원가요소 여러 줄을 합침) 오브젝트 순으로 "오브젝트 Q1 Q2 Q3 Q4 연간"을 출력합니다. Q1 = WKG001~WKG003, Q2 = WKG004~006, Q3 = WKG007~009, Q4 = WKG010~012\n· 마지막 줄에 "TOTAL 연간합계" (데이터가 없으면 TOTAL 0 만)\n· COLLECT, READ TABLE, IF, CASE 대신 LOOP AT ... GROUP BY 와 REDUCE ... FOR ... IN GROUP 을 쓰세요.',
    fields: [['cosp-objnr', '오브젝트 번호'], ['cosp-wrttp', '값 유형'], ['cosp-wkg001', '1기간 금액'], ['cosp-wkg012', '12기간 금액']],
    tables: ['cosp'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE cosp-gjahr', label: '회계연도' }],
    tests: ['2026', '2025', '2024'].map(p_gjahr => ({ p_gjahr, db: { cosp: CO_COSP } })),
    ref: ({ p_gjahr, db }) => { const r = db.cosp.filter(x => x[1] === p_gjahr && x[2] === '04' && x[3] === '000' && x[0].startsWith('KS')); const m = {}; r.forEach(x => { m[x[0]] = m[x[0]] || [0, 0, 0, 0]; for (let q = 0; q < 4; q++) m[x[0]][q] += coRowSum(x, q * 3 + 1, q * 3 + 3); }); let t = 0; const out = Object.keys(m).sort().map(o => { const y = m[o].reduce((s, v) => s + v, 0); t += y; return `${o} ${m[o].join(' ')} ${y}`; }); out.push(`TOTAL ${t}`); return out.join('\n'); },
    sol: "REPORT zco_cosp_quarter.\n\nPARAMETERS p_gjahr TYPE cosp-gjahr.\n\nSTART-OF-SELECTION.\n  SELECT objnr, kstar, wkg001, wkg002, wkg003, wkg004, wkg005, wkg006,\n         wkg007, wkg008, wkg009, wkg010, wkg011, wkg012\n    FROM cosp\n    WHERE gjahr = @p_gjahr\n      AND wrttp = '04'\n      AND versn = '000'\n      AND objnr LIKE 'KS%'\n    INTO TABLE @DATA(gt_cosp).\n\n  DATA lv_total TYPE i.\n  LOOP AT gt_cosp INTO DATA(gs_cosp)\n       GROUP BY ( objnr = gs_cosp-objnr ) ASCENDING\n       INTO DATA(grp).\n    DATA(lv_q1) = REDUCE i( INIT s = 0 FOR m IN GROUP grp NEXT s = s + m-wkg001 + m-wkg002 + m-wkg003 ).\n    DATA(lv_q2) = REDUCE i( INIT s = 0 FOR m IN GROUP grp NEXT s = s + m-wkg004 + m-wkg005 + m-wkg006 ).\n    DATA(lv_q3) = REDUCE i( INIT s = 0 FOR m IN GROUP grp NEXT s = s + m-wkg007 + m-wkg008 + m-wkg009 ).\n    DATA(lv_q4) = REDUCE i( INIT s = 0 FOR m IN GROUP grp NEXT s = s + m-wkg010 + m-wkg011 + m-wkg012 ).\n    DATA(lv_year) = lv_q1 + lv_q2 + lv_q3 + lv_q4.\n    WRITE: / grp-objnr, lv_q1, lv_q2, lv_q3, lv_q4, lv_year.\n    lv_total = lv_total + lv_year.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_total." }

]);

// =================== 3차 개편: 새 레벨에 맞지 않는 문제 → 모듈별 프로그램 개발(PGM) ===================
for (const [o, n, topic] of [[6514, 7501, '선택화면'], [6521, 7502, '리포트'], [6522, 7503, '리포트'], [6523, 7504, 'CRUD'], [6531, 7505, '클래스'], [6532, 7506, '클래스'],
  [6533, 7507, 'ALV'], [6534, 7508, 'CRUD'], [6541, 7509, '리포트'], [6542, 7510, '리포트'], [6543, 7511, '리포트'], [6544, 7512, '리포트']]) {
  const p = MOD_PROBLEMS.find(x => x.mod === 'co' && x.id === o); if (!p) throw new Error('CO 이동 대상 없음 ' + o);

const coCsksTxt = db => db.csks;
const CO_ORDER_BO = (beh) => ({ name: 'zr_intorder', entities: [Object.assign({ name: 'order', table: 'zco_order', key: ['aufnr'] }, beh)] });
const CO_LHC_HEAD = (methods) => `CLASS lhc_order DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n${methods}\nENDCLASS.\n\nCLASS lhc_order IMPLEMENTATION.\n`;
const CO_VAL_IMPL = CO_LHC_HEAD('    METHODS validatebudget FOR VALIDATE ON SAVE\n      IMPORTING keys FOR order~validatebudget.') +
  `  METHOD validatebudget.\n    READ ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order FIELDS ( budget ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_order).\n    LOOP AT lt_order INTO DATA(ls_order) WHERE budget <= 0.\n      APPEND VALUE #( %tky = ls_order-%tky ) TO failed-order.\n      APPEND VALUE #( %tky = ls_order-%tky\n                      %msg = new_message_with_text( severity = if_abap_behv_message=>severity-error\n                                                    text     = '예산은 0보다 커야 합니다' ) ) TO reported-order.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.`;

addMod('co', [
  // ---- Lv.1 (인터널 테이블 기초)
  { id: 6514, lv: 1, title: '원가요소별 실적 찾기 (인터널 테이블)',
    body: 'CO 실적 라인(COEP) 몇 줄을 인터널 테이블 gt_itab(kstar 원가요소, wkgbtr 금액)에 담아 두었습니다.\n원가요소 p_kstar 의 건수와 금액 합계를 "원가요소 건수 합계"로 출력하세요. 한 줄도 없으면 "원가요소 NOT FOUND"를 출력합니다.\n둘째 줄에는 gt_itab 전체 행 수를 "LINES 행수"로 출력합니다.\nLOOP AT ... WHERE 와 lines( ) 를 써 보세요.',
    fields: [['coep-kstar', '원가요소 (어떤 성격의 원가인지: 4100000 급여 등)'], ['coep-wkgbtr', 'CO 통화 금액'], ['coep-objnr', '오브젝트 번호 (KS+원가센터, OR+내부오더)']],
    structs: { ty_coep: [{ n: 'kstar', t: 'string' }, { n: 'wkgbtr', t: 'i' }] },
    inputs: [{ n: 'p_kstar', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_coep' }], inDesc: 'gt_itab: 0~50행', outDesc: '두 줄을 출력합니다.',
    tests: [['4100000', [['4100000', 500], ['4200000', 200], ['4100000', 800]]], ['4300000', [['4100000', 10]]], ['4200000', [['4200000', -30], ['4200000', 30], ['4100000', 1]]], ['4100000', []]].map(([p_kstar, gt_itab]) => ({ p_kstar, gt_itab })),
    ref: ({ p_kstar, gt_itab }) => { const r = gt_itab.filter(x => x[0] === p_kstar); return `${r.length ? `${p_kstar} ${r.length} ${r.reduce((s, x) => s + x[1], 0)}` : `${p_kstar} NOT FOUND`}\nLINES ${gt_itab.length}`; },
    sol: L('DATA: lv_cnt TYPE i,', '      lv_sum TYPE i.', 'LOOP AT gt_itab INTO DATA(gs_itab) WHERE kstar = p_kstar.', '  lv_cnt = lv_cnt + 1.', '  lv_sum = lv_sum + gs_itab-wkgbtr.', 'ENDLOOP.', 'IF lv_cnt > 0.', '  WRITE: p_kstar, lv_cnt, lv_sum.', 'ELSE.', "  WRITE: p_kstar, 'NOT FOUND'.", 'ENDIF.', "WRITE: / 'LINES', lines( gt_itab )."), },

  // ---- Lv.2 (FOR ALL ENTRIES / WITH / EXISTS)
  { id: 6521, lv: 2, kind: 'rpt', title: '원가센터 내역 조회 (FOR ALL ENTRIES)', must: ['entries'],
    body: '원가센터 유형 p_kosar 인 원가센터(관리회계 영역 \'1000\')의 한국어 내역을 출력하세요.\n1) CSKS 에서 kokrs, kostl 을 인터널 테이블로 읽고\n2) 읽은 행이 없으면 NO DATA 를 출력하고 끝냅니다. (FOR ALL ENTRIES 의 드라이버 테이블이 비면 조건이 무시되어 전체를 읽으니 꼭 막아야 합니다)\n3) CSKT 를 FOR ALL ENTRIES 로 읽어(spras = \'3\') 원가센터 순으로 "원가센터 내역"을 출력합니다. 내역이 없으면 내역 자리에 - 를 씁니다.',
    fields: [['csks-kosar', '원가센터 유형 (F 생산, V 관리, E 영업, H 보조)'], ['csks-kostl', '원가센터'], ['cskt-ktext', '원가센터 내역'], ['cskt-spras', '언어 (3 = 한국어)']],
    tables: ['csks', 'cskt'], sel: [{ n: 'p_kosar', kind: 'p', decl: 'TYPE csks-kosar', label: '원가센터 유형' }],
    tests: ['F', 'V', 'H', 'X'].map(p_kosar => ({ p_kosar, db: { csks: CO_CSKS, cskt: CO_CSKT } })),
    ref: ({ p_kosar, db }) => { const c = db.csks.filter(r => r[0] === '1000' && r[3] === p_kosar).sort((a, b) => a[1] < b[1] ? -1 : 1); if (!c.length) return 'NO DATA'; return c.map(r => { const t = db.cskt.find(x => x[0] === r[0] && x[1] === r[1] && x[2] === '3'); return `${r[1]} ${t ? t[3] : '-'}`; }).join('\n'); },
    sol: "REPORT zco_cctr_text.\n\nPARAMETERS p_kosar TYPE csks-kosar.\n\nSTART-OF-SELECTION.\n  SELECT kokrs, kostl FROM csks\n    WHERE kokrs = '1000' AND kosar = @p_kosar\n    INTO TABLE @DATA(gt_csks).\n  IF gt_csks IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  SELECT kostl, ktext FROM cskt\n    FOR ALL ENTRIES IN @gt_csks\n    WHERE kokrs = @gt_csks-kokrs\n      AND kostl = @gt_csks-kostl\n      AND spras = '3'\n    INTO TABLE @DATA(gt_text).\n  SORT gt_csks BY kostl.\n  LOOP AT gt_csks INTO DATA(gs_csks).\n    READ TABLE gt_text INTO DATA(gs_text) WITH KEY kostl = gs_csks-kostl.\n    IF sy-subrc = 0.\n      WRITE: / gs_csks-kostl, gs_text-ktext.\n    ELSE.\n      WRITE: / gs_csks-kostl, '-'.\n    ENDIF.\n  ENDLOOP." },

  { id: 6522, lv: 2, kind: 'rpt', title: '원가센터별 실적 합계 (WITH 공통 테이블 식)', must: ['with'],
    body: 'WITH 문으로 먼저 오브젝트별 실적 합계를 만든 뒤, 원가센터 마스터와 조인하세요.\n· 공통 테이블 식 +act: COEP 에서 회계연도 p_gjahr 의 objnr 별 SUM( wkgbtr ) AS total\n· 본 SELECT: CSKS(kokrs = \'1000\')와 +act 를 objnr 로 INNER JOIN\n· 원가센터 순으로 "원가센터 실적합계"를, 마지막 줄에 "TOTAL 전체합계"를 출력합니다. 결과가 없으면 NO DATA.\n(내부오더 OR… 오브젝트는 CSKS 에 없으니 자연히 빠집니다)',
    fields: [['coep-objnr', '오브젝트 번호 (CSKS-OBJNR 과 연결)'], ['coep-gjahr', '회계연도'], ['coep-wkgbtr', 'CO 금액'], ['csks-objnr', '원가센터의 오브젝트 번호']],
    tables: ['coep', 'csks'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coep-gjahr', label: '회계연도' }],
    tests: ['2026', '2025', '2024'].map(p_gjahr => ({ p_gjahr, db: { coep: CO_COEP, csks: CO_CSKS } })),
    ref: ({ p_gjahr, db }) => { const out = []; let tot = 0; for (const c of db.csks.filter(r => r[0] === '1000').sort((a, b) => a[1] < b[1] ? -1 : 1)) { const e = db.coep.filter(r => r[3] === p_gjahr && r[5] === c[5]); if (!e.length) continue; const s = e.reduce((a, r) => a + r[7], 0); tot += s; out.push(`${c[1]} ${s}`); } return out.length ? [...out, `TOTAL ${tot}`].join('\n') : 'NO DATA'; },
    sol: "REPORT zco_act_with.\n\nPARAMETERS p_gjahr TYPE coep-gjahr.\n\nSTART-OF-SELECTION.\n  WITH +act AS ( SELECT objnr, SUM( wkgbtr ) AS total\n                   FROM coep\n                   WHERE gjahr = @p_gjahr\n                   GROUP BY objnr )\n  SELECT c~kostl, a~total\n    FROM csks AS c\n    INNER JOIN +act AS a ON a~objnr = c~objnr\n    WHERE c~kokrs = '1000'\n    ORDER BY c~kostl\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  DATA lv_tot TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-kostl, gs_itab-total.\n    lv_tot = lv_tot + gs_itab-total.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_tot." },

  { id: 6523, lv: 2, kind: 'rpt', title: '실적 없는 원가센터 (NOT EXISTS)', must: ['exists'],
    body: '회계연도 p_gjahr 에 CO 실적(COEP)이 한 줄도 없는 원가센터를 찾으세요. (관리회계 영역 \'1000\')\n· CSKS 를 읽으면서 WHERE NOT EXISTS ( SELECT ... FROM coep WHERE objnr = 바깥 원가센터의 objnr AND gjahr = @p_gjahr ) 로 거릅니다.\n· 원가센터 순으로 한 줄에 하나씩 출력하고, 마지막 줄에 "COUNT 개수"를 출력합니다. 모두 실적이 있으면 ALL ACTIVE.',
    fields: [['csks-objnr', '원가센터 오브젝트 번호'], ['coep-objnr', '실적이 쌓인 오브젝트'], ['coep-gjahr', '회계연도']],
    tables: ['csks', 'coep'], sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coep-gjahr', label: '회계연도' }],
    tests: [['2026', CO_COEP], ['2025', CO_COEP], ['2026', CO_COEP.concat([['1000', '100099', '001', '2026', '004', 'KSC400', '4100000', 5]])]].map(([p_gjahr, coep]) => ({ p_gjahr, db: { csks: CO_CSKS, coep } })),
    ref: ({ p_gjahr, db }) => { const r = db.csks.filter(c => c[0] === '1000' && !db.coep.some(e => e[5] === c[5] && e[3] === p_gjahr)).map(c => c[1]).sort(); return r.length ? [...r, `COUNT ${r.length}`].join('\n') : 'ALL ACTIVE'; },
    sol: "REPORT zco_idle_cctr.\n\nPARAMETERS p_gjahr TYPE coep-gjahr.\n\nSTART-OF-SELECTION.\n  SELECT kostl FROM csks AS c\n    WHERE kokrs = '1000'\n      AND NOT EXISTS ( SELECT belnr FROM coep\n                         WHERE objnr = c~objnr\n                           AND gjahr = @p_gjahr )\n    ORDER BY kostl\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'ALL ACTIVE'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(lv_kostl).\n    WRITE / lv_kostl.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." },

  // ---- Lv.3 CDS View
  { id: 6531, lv: 3, kind: 'cds', title: '원가센터 기본 뷰 (JOIN)',
    body: 'CDS 뷰 ZI_COSTCENTER 를 정의하세요.\n· CSKS 를 c 로, CSKT 를 t 로 INNER JOIN (kokrs·kostl 이 같고 t.spras = \'3\')\n· 필드: key kokrs, key kostl, ktext(원가센터 내역), kosar(유형), verak(책임자)\n· 유효 종료일 datbi 가 \'99991231\' 인 원가센터만\n채점기가 뷰를 kokrs, kostl 순으로 읽어 출력합니다.',
    fields: [['csks-datbi', '유효 종료일 (9999-12-31 = 계속 사용)'], ['csks-verak', '책임자'], ['cskt-ktext', '원가센터 내역'], ['cskt-spras', '언어 키']],

    ref: ({ db }) => cdsTxt(['kokrs', 'kostl', 'ktext', 'kosar', 'verak'], db.csks.filter(c => c[2] === '99991231').flatMap(c => db.cskt.filter(t => t[0] === c[0] && t[1] === c[1] && t[2] === '3').map(t => [c[0], c[1], t[3], c[3], c[4]])).sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1)),
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '원가센터'\ndefine view entity ZI_CostCenter\n  as select from csks as c\n    inner join cskt as t on  t.kokrs = c.kokrs\n                         and t.kostl = c.kostl\n                         and t.spras = '3'\n{\n  key c.kokrs,\n  key c.kostl,\n      t.ktext,\n      c.kosar,\n      c.verak\n}\nwhere c.datbi = '99991231'" },

  { id: 6532, lv: 3, kind: 'cds', title: '손익센터 연관과 유형 텍스트 (association·CASE)',
    body: 'CDS 뷰 ZI_CCTR_PRCTR 를 정의하세요.\n· 소스: CSKS (kokrs = \'1000\' 만)\n· 연관: association [0..1] to CEPCT as _ProfitText — $projection.prctr = _ProfitText.prctr 이고 _ProfitText.spras = \'3\'\n· 필드: key kostl, prctr, _ProfitText.ktext as prctr_text, CASE 로 만든 kosar_txt (F → PROD, V → ADMIN, E → SALES, 그 밖 → OTHER), 연관 _ProfitText 노출\n연관 대상이 없으면 prctr_text 는 빈 값입니다.',
    fields: [['csks-prctr', '원가센터가 속한 손익센터'], ['cepct-prctr', '손익센터'], ['cepct-ktext', '손익센터 내역'], ['csks-kosar', '원가센터 유형']],
    tables: ['csks', 'cepct'], inputs: [], outDesc: '머리글 KOSTL PRCTR PRCTR_TEXT KOSAR_TXT 다음에 한 줄씩 출력됩니다.',
    show: [{ view: 'zi_cctr_prctr', cols: ['kostl', 'prctr', 'prctr_text', 'kosar_txt'], order: ['kostl'] }],
    tests: [{ db: { csks: CO_CSKS, cepct: CO_CEPCT } }, { db: { csks: CO_CSKS, cepct: [['P1000', 'E', 'HQ'], ['P3000', 'E', 'Domestic Sales'], ...CO_CEPCT.filter(r => r[0] !== 'P2000' && r[1] !== 'E')] } }],
    ref: ({ db }) => cdsTxt(['kostl', 'prctr', 'prctr_text', 'kosar_txt'], db.csks.filter(c => c[0] === '1000').sort((a, b) => a[1] < b[1] ? -1 : 1).map(c => { const t = db.cepct.find(x => x[0] === c[6] && x[1] === '3'); return [c[1], c[6], t ? t[2] : '', { F: 'PROD', V: 'ADMIN', E: 'SALES' }[c[3]] || 'OTHER']; })),
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\ndefine view entity ZI_CCTR_PRCTR\n  as select from csks\n  association [0..1] to cepct as _ProfitText on  $projection.prctr = _ProfitText.prctr\n                                              and _ProfitText.spras = '3'\n{\n  key kostl,\n      prctr,\n      _ProfitText.ktext as prctr_text,\n      case kosar\n        when 'F' then 'PROD'\n        when 'V' then 'ADMIN'\n        when 'E' then 'SALES'\n        else 'OTHER'\n      end as kosar_txt,\n      _ProfitText\n}\nwhere kokrs = '1000'" },

  { id: 6533, lv: 3, kind: 'cds', title: '원가요소별 실적 집계 (파라미터·GROUP BY·HAVING)',
    body: '파라미터를 받는 CDS 뷰 ZI_COST_BY_KSTAR 를 정의하세요.\n· with parameters p_gjahr : abap.char(4)\n· 소스: COEP, 조건 gjahr = $parameters.p_gjahr\n· objnr, kstar 로 묶어 key objnr, key kstar, sum( wkgbtr ) as total, count( * ) as cnt\n· 합계가 200 이상인 그룹만 (HAVING)\n채점기는 p_gjahr = \'2026\' 으로 읽어 objnr, kstar 순으로 출력합니다.',
    fields: [['coep-objnr', '오브젝트 번호'], ['coep-kstar', '원가요소'], ['coep-wkgbtr', 'CO 금액'], ['coep-gjahr', '회계연도']],
    tables: ['coep'], inputs: [], outDesc: '머리글 OBJNR KSTAR TOTAL CNT 다음에 한 줄씩 출력됩니다.',
    show: [{ view: 'zi_cost_by_kstar', cols: ['objnr', 'kstar', 'total', 'cnt'], order: ['objnr', 'kstar'], params: { p_gjahr: '2026' } }],
    tests: [{ db: { coep: CO_COEP } }, { db: { coep: CO_COEP.concat([['1000', '100010', '001', '2026', '004', 'KSC300', '4200000', 150], ['1000', '100011', '001', '2026', '004', 'KSC300', '4200000', 60]]) } }],
    ref: ({ db }) => { const m = new Map(); for (const r of db.coep.filter(r => r[3] === '2026')) { const k = r[5] + '|' + r[6]; const o = m.get(k) || [r[5], r[6], 0, 0]; o[2] += r[7]; o[3]++; m.set(k, o); } return cdsTxt(['objnr', 'kstar', 'total', 'cnt'], [...m.values()].filter(o => o[2] >= 200).sort((a, b) => (a[0] + '|' + a[1]) < (b[0] + '|' + b[1]) ? -1 : 1)); },
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\ndefine view entity ZI_COST_BY_KSTAR\n  with parameters p_gjahr : abap.char(4)\n  as select from coep\n{\n  key objnr,\n  key kstar,\n      sum( wkgbtr ) as total,\n      count( * )    as cnt\n}\nwhere gjahr = $parameters.p_gjahr\ngroup by objnr, kstar\nhaving sum( wkgbtr ) >= 200" },

  { id: 6534, lv: 3, kind: 'cds', title: '예산 소진율 소비 뷰 (뷰 위의 뷰)',
    body: 'CDS 뷰 두 개를 정의하세요.\n① 기본 뷰 ZI_COSTACT: COEP(e) 와 CSKS(c) 를 objnr 로 INNER JOIN — key e.belnr, key e.buzei, c.kostl, e.gjahr, e.wkgbtr\n② 소비 뷰 ZC_COSTACT_SUM (with parameters p_gjahr : abap.char(4)): ZI_COSTACT 를 소스로\n  · association [0..1] to ZCO_BUDGET as _Budget on _Budget.kostl = $projection.kostl and _Budget.gjahr = $parameters.p_gjahr\n  · gjahr = $parameters.p_gjahr 인 행만, kostl 로 묶어\n  · key kostl, sum( wkgbtr ) as actual, _Budget.budget as budget, division( sum( wkgbtr ) * 100, _Budget.budget, 1 ) as rate (소진율 %, 소수 1자리)\n  · GROUP BY kostl, _Budget.budget\n예산이 없으면 budget 은 0, rate 는 0.00 입니다. 채점기는 ZC_COSTACT_SUM 을 p_gjahr = \'2026\' 으로 읽습니다.',
    fields: [['zco_budget-budget', '원가센터 예산 (Z)'], ['coep-wkgbtr', '실적 금액'], ['csks-objnr', '원가센터 오브젝트 번호'], ['coep-buzei', 'CO 문서 라인']],
    tables: ['coep', 'csks', 'zco_budget'], inputs: [], outDesc: '머리글 KOSTL ACTUAL BUDGET RATE 다음에 한 줄씩 출력됩니다.',
    show: [{ view: 'zc_costact_sum', cols: ['kostl', 'actual', 'budget', 'rate'], order: ['kostl'], params: { p_gjahr: '2026' } }],
    tests: [{ db: { coep: CO_COEP, csks: CO_CSKS, zco_budget: CO_BUDGET() } }, { db: { coep: CO_COEP, csks: CO_CSKS, zco_budget: CO_BUDGET().filter(r => r[0] !== 'C300') } }],
    ref: ({ db }) => { const m = new Map(); for (const e of db.coep.filter(r => r[3] === '2026')) for (const c of db.csks.filter(c => c[5] === e[5])) m.set(c[1], (m.get(c[1]) || 0) + e[7]); return cdsTxt(['kostl', 'actual', 'budget', 'rate'], [...m].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([k, a]) => { const b = db.zco_budget.find(r => r[0] === k && r[1] === '2026'); return [k, a, b ? b[2] : 0, (b ? Math.round(a * 100 / b[2] * 10) / 10 : 0).toFixed(2)]; })); },
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\ndefine view entity ZI_COSTACT\n  as select from coep as e\n    inner join csks as c on c.objnr = e.objnr\n{\n  key e.belnr,\n  key e.buzei,\n      c.kostl,\n      e.gjahr,\n      e.wkgbtr\n}\n\ndefine view entity ZC_COSTACT_SUM\n  with parameters p_gjahr : abap.char(4)\n  as select from ZI_COSTACT as a\n  association [0..1] to zco_budget as _Budget on  _Budget.kostl = $projection.kostl\n                                              and _Budget.gjahr = $parameters.p_gjahr\n{\n  key a.kostl,\n      sum( a.wkgbtr )   as actual,\n      _Budget.budget    as budget,\n      division( sum( a.wkgbtr ) * 100, _Budget.budget, 1 ) as rate\n}\nwhere a.gjahr = $parameters.p_gjahr\ngroup by a.kostl, _Budget.budget" }
]);

addMod('co', [
  coRap({ id: 6541, kind: 'rpt', title: 'EML 로 내부오더 생성 (MODIFY ENTITIES·COMMIT ENTITIES)',
    bo: CO_ORDER_BO({ validations: [{ n: 'validatebudget', on: ['create', 'field budget'] }] }), boImpl: CO_VAL_IMPL,
    body: '내부오더 BO ZR_INTORDER(엔티티 order, 테이블 ZCO_ORDER)에 EML 로 오더를 만드세요.\n· MODIFY ENTITIES OF zr_intorder ENTITY order CREATE FIELDS ( aufnr ktext budget status ) WITH ... 로 %cid = \'C1\', 상태 status = \'CRTD\' 인 오더 1건을 만듭니다. FAILED DATA(...) 도 받으세요.\n· 생성에 실패하면(같은 오더번호가 이미 있음) "DUPLICATE 오더번호"를 출력하고 ROLLBACK ENTITIES 후 끝냅니다.\n· COMMIT ENTITIES RESPONSE OF zr_intorder ... REPORTED DATA(...) 로 저장합니다. 이 BO 에는 "예산은 0보다 커야 한다"는 검증이 이미 구현돼 있습니다.\n  - 저장 성공(sy-subrc = 0): "CREATED 오더번호"\n  - 저장 실패: reported 의 order 메시지(%msg)를 한 줄씩 출력\n(%msg 는 이 채점기에서 \'E:텍스트\' 문자열입니다)',
    fields: [['zco_order-aufnr', '내부오더 번호 (AUFK-AUFNR 에 해당)'], ['zco_order-budget', '오더 예산'], ['zco_order-status', '상태 (CRTD 생성, REL 릴리스)'], ['zco_order-ktext', '오더 내역']],
    sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE zco_order-aufnr', label: '오더' }, { n: 'p_ktext', kind: 'p', decl: 'TYPE zco_order-ktext', label: '내역' }, { n: 'p_budget', kind: 'p', decl: 'TYPE zco_order-budget', label: '예산' }],
    tests: [['Z2001', '전시회 참가', 800], ['Z1001', '중복', 100], ['Z2002', '예산없음', 0]].map(([p_aufnr, p_ktext, p_budget]) => ({ p_aufnr, p_ktext, p_budget, db: { zco_order: CO_ORDER() } })),
    ref: ({ p_aufnr, p_ktext, p_budget, db }) => { const t = db.zco_order.map(r => r.slice()); let m; if (t.some(r => r[0] === p_aufnr)) m = `DUPLICATE ${p_aufnr}`; else if (p_budget <= 0) m = 'E:예산은 0보다 커야 합니다'; else { t.push([p_aufnr, p_ktext, p_budget, 'CRTD']); m = `CREATED ${p_aufnr}`; } return m + '\n' + dump('zco_order', t); },
    sol: "REPORT zco_eml_create.\n\nPARAMETERS: p_aufnr  TYPE zco_order-aufnr,\n            p_ktext  TYPE zco_order-ktext,\n            p_budget TYPE zco_order-budget.\n\nSTART-OF-SELECTION.\n  MODIFY ENTITIES OF zr_intorder\n    ENTITY order\n      CREATE FIELDS ( aufnr ktext budget status )\n      WITH VALUE #( ( %cid   = 'C1'\n                      aufnr  = p_aufnr\n                      ktext  = p_ktext\n                      budget = p_budget\n                      status = 'CRTD' ) )\n    FAILED DATA(ls_failed).\n  IF ls_failed-order IS NOT INITIAL.\n    WRITE: 'DUPLICATE', p_aufnr.\n    ROLLBACK ENTITIES.\n    RETURN.\n  ENDIF.\n\n  COMMIT ENTITIES RESPONSE OF zr_intorder\n    FAILED DATA(ls_commit_failed)\n    REPORTED DATA(ls_reported).\n  IF sy-subrc = 0.\n    WRITE: 'CREATED', p_aufnr.\n  ELSE.\n    LOOP AT ls_reported-order INTO DATA(ls_msg).\n      WRITE / ls_msg-%msg.\n    ENDLOOP.\n  ENDIF." }),

  coRap({ id: 6542, kind: 'rap', title: '예산 검증 (validation)',
    bo: CO_ORDER_BO({ validations: [{ n: 'validatebudget', on: ['create', 'field budget'] }] }),
    body: '내부오더 BO 의 행동 정의(BDEF)에 아래 검증이 선언돼 있습니다. 핸들러 클래스 lhc_order 에 검증을 구현하세요.\n  validation validateBudget on save { create; field budget; }\n· 예산 budget 이 1 ~ 10000 이 아니면 failed-order 에 %tky 를 넣고, reported-order 에 오류 메시지 \'예산은 1~10000 이어야 합니다\' 를 넣습니다.\n  (severity = if_abap_behv_message=>severity-error, new_message_with_text 사용)\n· 오더를 읽을 때는 READ ENTITIES ... IN LOCAL MODE 로 keys 에 해당하는 budget 을 읽습니다.\n채점기가 생성·수정·저장 시나리오를 실행해 결과와 ZCO_ORDER 를 출력합니다. 검증이 하나라도 실패하면 그 저장(COMMIT) 전체가 취소됩니다.',
    fields: [['zco_order-budget', '오더 예산'], ['zco_order-aufnr', '오더 번호 (%tky 의 키)'], ['zco_order-status', '상태']],
    outDesc: '시나리오 단계마다 결과 줄(CREATE OK, COMMIT FAILED, " FAILED ORDER 키", " MSG ORDER 키 E:메시지")이 나오고, 끝에 [ZCO_ORDER] 내용이 붙습니다.',
    tests: [
      { in: { db: { zco_order: CO_ORDER() }, ops: [
        { op: 'create', ent: 'order', fields: ['aufnr', 'ktext', 'budget', 'status'], rows: [{ '%cid': 'C1', aufnr: 'Z2001', ktext: '전시회', budget: 800, status: 'CRTD' }] },
        { op: 'commit' },
        { op: 'update', ent: 'order', fields: ['budget'], rows: [{ aufnr: 'Z1001', budget: 20000 }] },
        { op: 'commit' }] } },
      { in: { db: { zco_order: CO_ORDER() }, ops: [
        { op: 'create', ent: 'order', fields: ['aufnr', 'ktext', 'budget', 'status'], rows: [{ '%cid': 'C1', aufnr: 'Z2002', ktext: '세미나', budget: 0, status: 'CRTD' }, { '%cid': 'C2', aufnr: 'Z2003', ktext: '워크숍', budget: 50, status: 'CRTD' }] },
        { op: 'commit' },
        { op: 'update', ent: 'order', fields: ['ktext'], rows: [{ aufnr: 'Z1002', ktext: '설비 수리(2차)' }] },
        { op: 'commit' }] } },
      { in: { db: { zco_order: CO_ORDER() }, ops: [
        { op: 'update', ent: 'order', fields: ['budget'], rows: [{ aufnr: 'Z1003', budget: 10000 }, { aufnr: 'Z1002', budget: 10001 }] },
        { op: 'commit' },
        { op: 'update', ent: 'order', fields: ['budget'], rows: [{ aufnr: 'Z1003', budget: 1 }] },
        { op: 'commit' }] } }],
    sol: CO_LHC_HEAD('    METHODS validatebudget FOR VALIDATE ON SAVE\n      IMPORTING keys FOR order~validatebudget.') +
      "  METHOD validatebudget.\n    READ ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        FIELDS ( budget ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_order).\n\n    LOOP AT lt_order INTO DATA(ls_order) WHERE budget < 1 OR budget > 10000.\n      APPEND VALUE #( %tky = ls_order-%tky ) TO failed-order.\n      APPEND VALUE #( %tky = ls_order-%tky\n                      %msg = new_message_with_text(\n                               severity = if_abap_behv_message=>severity-error\n                               text     = '예산은 1~10000 이어야 합니다' ) ) TO reported-order.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS." }),

  coRap({ id: 6543, kind: 'rap', title: '생성 시 상태 결정 (determination)',
    bo: CO_ORDER_BO({ determinations: [{ n: 'setinitialstatus', on: ['create'], when: 'modify' }] }),
    body: 'BDEF 에 결정이 선언돼 있습니다. 핸들러 lhc_order 에 구현하세요.\n  determination setInitialStatus on modify { create; }\n· 새로 만든 오더의 상태 status 를 예산으로 정합니다: 예산 5000 이상 → \'HOLD\'(승인 대기), 그 밖 → \'CRTD\'\n· 이미 상태가 채워져 있으면(초기값이 아니면) 그대로 둡니다.\n· READ ENTITIES ... IN LOCAL MODE 로 읽고, MODIFY ENTITIES ... IN LOCAL MODE ... UPDATE FIELDS ( status ) 로 바꿉니다.\n채점기가 생성·조회·저장 시나리오를 실행합니다(조회 줄: READ ORDER 오더 내역 예산 상태).',
    fields: [['zco_order-status', '상태 (CRTD 생성, HOLD 승인 대기, REL 릴리스)'], ['zco_order-budget', '오더 예산']],
    outDesc: '시나리오 단계마다 결과 줄이 나오고, 끝에 [ZCO_ORDER] 내용이 붙습니다.',
    tests: [
      { in: { db: { zco_order: CO_ORDER() }, ops: [
