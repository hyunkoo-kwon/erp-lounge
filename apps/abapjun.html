  reuse(3002, { id: 6152, lv: 5, title: 'COND로 고객 등급',
    fields: [['kna1-kunnr', '고객 번호'], ['vbak-netwr', '오더 순금액 (고객별 합계)']] }),
  reuse(3008, { id: 6154, lv: 5, title: 'GROUP BY 로 고객별 판매 집계',
    fields: [['vbak-kunnr', '판매처'], ['vbap-kwmeng', '주문 수량']] }),
  // ===== 2차 개편: 표준 테이블 활용 문제 =====
  { id: 6112, lv: 1, ban: ['LOOP'], title: '납품일정 라인 확정 점검 (VBEP 구조)',
    body: '판매오더 품목 하나의 납품일정 라인 gt_itab 이 있습니다. 구조는 VBEP 를 본떴습니다(일정번호 etenr, 납품일 edatu, 주문수량 wmeng, 확정수량 bmeng).\n첫째 줄에 "LINES 라인수"를 출력하고, 일정번호 p_etenr 인 라인을 찾아 둘째 줄에 출력하세요.\n· 없으면 NOT FOUND\n· 확정수량 ≥ 주문수량이면 "납품일 CONFIRMED"\n· 확정수량이 0이면 "납품일 NOT CONFIRMED"\n· 그 밖에는 "납품일 PARTIAL 부족수량"(주문 - 확정)\nLOOP 없이 READ TABLE ... WITH KEY 를 쓰세요.',
    fields: [['vbep-etenr', '일정 라인 번호 (0001, 0002 …)'], ['vbep-edatu', '납품 예정일'], ['vbep-wmeng', '고객이 주문한 수량'], ['vbep-bmeng', '가용성 점검으로 확정된 수량']],
    structs: { ty_vbep: [{ n: 'etenr', t: 'string' }, { n: 'edatu', t: 'string' }, { n: 'wmeng', t: 'i' }, { n: 'bmeng', t: 'i' }] },
    inputs: [{ n: 'p_etenr', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_vbep' }], inDesc: 'gt_itab: 0~10행, 일정번호 중복 없음', outDesc: '"LINES 라인수"와 점검 결과 한 줄을 출력합니다.',
    tests: [['0002', [['0001', '20261008', 12, 12], ['0002', '20261012', 8, 4]]], ['0001', [['0001', '20261008', 12, 12], ['0002', '20261012', 8, 4]]], ['0001', [['0001', '20261015', 10, 0]]], ['0003', [['0001', '20261008', 5, 5]]], ['0001', []]]
      .map(([p_etenr, gt_itab]) => ({ p_etenr, gt_itab })),
    ref: ({ p_etenr, gt_itab }) => { const r = gt_itab.find(x => x[0] === p_etenr); const l2 = !r ? 'NOT FOUND' : r[3] >= r[2] ? `${r[1]} CONFIRMED` : r[3] === 0 ? `${r[1]} NOT CONFIRMED` : `${r[1]} PARTIAL ${r[2] - r[3]}`; return `LINES ${gt_itab.length}\n${l2}`; },
    sol: L("WRITE: 'LINES', lines( gt_itab ).", 'READ TABLE gt_itab INTO DATA(gs_itab) WITH KEY etenr = p_etenr.', 'IF sy-subrc <> 0.', "  WRITE / 'NOT FOUND'.", 'ELSEIF gs_itab-bmeng >= gs_itab-wmeng.', "  WRITE: / gs_itab-edatu, 'CONFIRMED'.", 'ELSEIF gs_itab-bmeng = 0.', "  WRITE: / gs_itab-edatu, 'NOT CONFIRMED'.", 'ELSE.', "  WRITE: / gs_itab-edatu, 'PARTIAL', gs_itab-wmeng - gs_itab-bmeng.", 'ENDIF.') },

  { id: 6121, lv: 2, kind: 'rpt', title: '오더 처리 상태 조회 (VBAK + VBUK)',
    body: '판매오더 헤더(VBAK)와 헤더 상태(VBUK)를 조인해 오더 처리 상태를 보여 주세요.\n· 판매처 범위 s_kunnr 로 거르고 오더번호 순으로 "오더번호 판매처 금액 상태"를 출력합니다.\n· 상태는 VBUK-GBSTK(전체 처리 상태)로 A → OPEN, B → PARTIAL, C → DONE 입니다.\n· 마지막 줄에 완료되지 않은(C 가 아닌) 오더 수를 "OPEN 건수"로 출력합니다. 데이터가 없으면 NO DATA.',
    fields: [['vbuk-vbeln', '판매 문서 번호 (VBAK 와 같은 키)'], ['vbuk-gbstk', '전체 처리 상태 (A 미처리 / B 부분 / C 완료)'], ['vbuk-lfstk', '납품 상태'], ['vbuk-fkstk', '대금청구 상태'], ['vbak-kunnr', '판매처']],
    tables: ['vbak', 'vbuk'], sel: [{ n: 's_kunnr', kind: 's', decl: 'FOR vbak-kunnr', label: '판매처' }],
    tests: [[], [['I', 'EQ', 'C100', '']], [['I', 'EQ', 'C200', ''], ['I', 'EQ', 'C300', '']], [['I', 'EQ', 'C999', '']]].map(s_kunnr => ({ s_kunnr, db: { vbak: SD_VBAK, vbuk: SD_VBUK } })),
    ref: ({ s_kunnr, db }) => { const r = db.vbak.filter(x => jsIn(x[3], s_kunnr)).map(x => [...x, (db.vbuk.find(u => u[0] === x[0]) || [])[1]]).filter(x => x[5]).sort((a, b) => sdBy(a[0], b[0])); if (!r.length) return 'NO DATA'; return [...r.map(x => `${x[0]} ${x[3]} ${x[4]} ${sdSt(x[5])}`), `OPEN ${r.filter(x => x[5] !== 'C').length}`].join('\n'); },
    sol: "REPORT z_sd_order_status.\n\nSELECT-OPTIONS s_kunnr FOR vbak-kunnr.\n\nSTART-OF-SELECTION.\n  SELECT k~vbeln, k~kunnr, k~netwr, u~gbstk\n    FROM vbak AS k\n    INNER JOIN vbuk AS u ON k~vbeln = u~vbeln\n    WHERE k~kunnr IN @s_kunnr\n    ORDER BY k~vbeln\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_txt  TYPE string,\n        lv_open TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    CASE gs_itab-gbstk.\n      WHEN 'A'. lv_txt = 'OPEN'.\n      WHEN 'B'. lv_txt = 'PARTIAL'.\n      WHEN 'C'. lv_txt = 'DONE'.\n    ENDCASE.\n    IF gs_itab-gbstk <> 'C'.\n      lv_open = lv_open + 1.\n    ENDIF.\n    WRITE: / gs_itab-vbeln, gs_itab-kunnr, gs_itab-netwr, lv_txt.\n  ENDLOOP.\n  WRITE: / 'OPEN', lv_open." },

  { id: 6123, lv: 2, kind: 'rpt', title: '고객 판매영역 조회 (KNA1 + KNVV)',
    body: '고객은 판매조직(vkorg)·유통경로(vtweg)·제품군(spart)마다 판매 데이터(KNVV)를 따로 가집니다.\n판매조직 p_vkorg 에 등록된 고객을 KNA1 과 조인해 보여 주세요.\n· 고객번호, 유통경로 순으로 "고객번호 고객명 유통경로 고객그룹 지급조건"을 출력합니다.\n· 마지막 줄에 "COUNT 행수". 없으면 NO CUSTOMER.',
    fields: [['knvv-vkorg', '판매 조직'], ['knvv-vtweg', '유통 경로 (10 국내, 20 수출 …)'], ['knvv-kdgrp', '고객 그룹'], ['knvv-zterm', '지급 조건 (NT30 = 30일 이내)'], ['kna1-name1', '고객명']],
    tables: ['kna1', 'knvv'], sel: [{ n: 'p_vkorg', kind: 'p', decl: 'TYPE knvv-vkorg', label: '판매조직' }],
    tests: ['1000', '2000', '3000'].map(p_vkorg => ({ p_vkorg, db: { kna1: SD_KNA1, knvv: SD_KNVV } })),
    ref: ({ p_vkorg, db }) => { const r = db.knvv.filter(x => x[1] === p_vkorg).sort((a, b) => sdBy(a[0] + a[2], b[0] + b[2])); if (!r.length) return 'NO CUSTOMER'; return [...r.map(x => `${x[0]} ${db.kna1.find(k => k[0] === x[0])[1]} ${x[2]} ${x[4]} ${x[5]}`), `COUNT ${r.length}`].join('\n'); },
    sol: "REPORT z_sd_knvv.\n\nPARAMETERS p_vkorg TYPE knvv-vkorg.\n\nSTART-OF-SELECTION.\n  SELECT v~kunnr, k~name1, v~vtweg, v~kdgrp, v~zterm\n    FROM knvv AS v\n    INNER JOIN kna1 AS k ON v~kunnr = k~kunnr\n    WHERE v~vkorg = @p_vkorg\n    ORDER BY v~kunnr, v~vtweg\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO CUSTOMER'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-kunnr, gs_itab-name1, gs_itab-vtweg, gs_itab-kdgrp, gs_itab-zterm.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." },

  { id: 6131, lv: 3, kind: 'rpt', must: ['lcl_credit'], title: '여신 점검 클래스 (KNKK)',
    body: '고객 여신(KNKK)을 다루는 로컬 클래스 lcl_credit 를 만들어 오더 금액 p_amt 를 받아도 되는지 판단하세요. 여신관리영역(kkber)은 \'1000\' 입니다.\n· constructor( iv_kunnr ): KNKK 에서 여신한도 klimk 와 여신노출 skfor 를 읽어 속성에 보관\n· is_found( ) RETURNING rv_found: 여신 데이터가 있으면 abap_true\n· get_free( ) RETURNING rv_free: 남은 한도 = klimk - skfor (음수일 수 있음)\n· check( iv_amt ) RETURNING rv_ok: iv_amt ≤ 남은 한도면 abap_true\n출력: 여신 데이터가 없으면 NO CREDIT DATA. 있으면 "고객번호 FREE 남은한도", 다음 줄에 RELEASED(통과) 또는 BLOCKED(보류).',
    fields: [['knkk-kunnr', '고객 번호'], ['knkk-kkber', '여신 관리 영역'], ['knkk-klimk', '여신 한도'], ['knkk-skfor', '여신 노출액 (미결 채권 등)']],
    tables: ['knkk'], sel: [{ n: 'p_kunnr', kind: 'p', decl: 'TYPE knkk-kunnr', label: '고객' }, { n: 'p_amt', kind: 'p', decl: 'TYPE i', label: '오더 금액' }],
    tests: [['C100', 3000], ['C100', 3001], ['C300', 1], ['C999', 10], ['C200', 0]].map(([p_kunnr, p_amt]) => ({ p_kunnr, p_amt, db: { knkk: SD_KNKK } })),
    ref: ({ p_kunnr, p_amt, db }) => { const r = db.knkk.find(x => x[0] === p_kunnr && x[1] === '1000'); if (!r) return 'NO CREDIT DATA'; const f = r[2] - r[3]; return `${p_kunnr} FREE ${f}\n${p_amt <= f ? 'RELEASED' : 'BLOCKED'}`; },
    sol: "REPORT z_sd_credit.\n\nPARAMETERS: p_kunnr TYPE knkk-kunnr,\n            p_amt   TYPE i.\n\nCLASS lcl_credit DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_kunnr TYPE string,\n             is_found RETURNING VALUE(rv_found) TYPE abap_bool,\n             get_free RETURNING VALUE(rv_free) TYPE i,\n             check IMPORTING iv_amt TYPE i RETURNING VALUE(rv_ok) TYPE abap_bool.\n  PRIVATE SECTION.\n    DATA: mv_klimk TYPE i,\n          mv_skfor TYPE i,\n          mv_found TYPE abap_bool.\nENDCLASS.\n\nCLASS lcl_credit IMPLEMENTATION.\n  METHOD constructor.\n    SELECT SINGLE klimk, skfor\n      FROM knkk\n      WHERE kunnr = @iv_kunnr\n        AND kkber = '1000'\n      INTO ( @mv_klimk, @mv_skfor ).\n    mv_found = xsdbool( sy-subrc = 0 ).\n  ENDMETHOD.\n  METHOD is_found.\n    rv_found = mv_found.\n  ENDMETHOD.\n  METHOD get_free.\n    rv_free = mv_klimk - mv_skfor.\n  ENDMETHOD.\n  METHOD check.\n    rv_ok = xsdbool( iv_amt <= get_free( ) ).\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA(go_credit) = NEW lcl_credit( p_kunnr ).\n  IF go_credit->is_found( ) = abap_false.\n    WRITE 'NO CREDIT DATA'.\n    RETURN.\n  ENDIF.\n  WRITE: p_kunnr, 'FREE', go_credit->get_free( ).\n  IF go_credit->check( p_amt ) = abap_true.\n    WRITE / 'RELEASED'.\n  ELSE.\n    WRITE / 'BLOCKED'.\n  ENDIF." },

  { id: 6133, lv: 3, kind: 'rpt', must: ['cl_gui_alv_grid', 'hotspot_click'], title: '대금청구 ALV 핫스팟 (VBRK → VBRP)',
    body: '대금청구 문서 헤더(VBRK)를 CL_GUI_ALV_GRID 로 보여 주고, 청구번호를 클릭(핫스팟)하면 청구 품목(VBRP) 요약을 메시지로 보여 주세요.\n· 취소된 청구(fksto = \'X\')는 빼고 청구번호 순으로 표시합니다.\n· ALV 열: VBELN(청구번호, hotspot), FKART(청구유형), KUNAG(지급인), NETWR(순금액)\n· hotspot_click 에서 e_row_id-index 로 행을 찾고, VBRP 의 품목 수·청구수량 합계·순금액 합계를 MESSAGE |청구번호: ITEMS 품목수 QTY 수량합 NET 금액합| TYPE \'I\' 로 보여 줍니다.',
    fields: [['vbrk-vbeln', '대금청구 문서 번호'], ['vbrk-fkart', '청구 유형 (F2 송장, G2 대변메모 …)'], ['vbrk-kunag', '지급인(판매처)'], ['vbrk-fksto', '청구 취소 표시'], ['vbrp-fkimg', '청구 수량']],
    tables: ['vbrk', 'vbrp'], sel: [],
    tests: [[{ ev: 'hotspot_click', row: 1, col: 'VBELN' }], [{ ev: 'hotspot_click', row: 3, col: 'VBELN' }, { ev: 'hotspot_click', row: 2, col: 'VBELN' }]].map(events => ({ events, db: { vbrk: SD_VBRK, vbrp: SD_VBRP } })),
    ref: ({ events, db }) => { const r = db.vbrk.filter(x => x[8] !== 'X').sort((a, b) => sdBy(a[0], b[0])); const out = [alvTxt('', ['청구번호', '청구유형', '지급인', '순금액'], r.map(x => [x[0], x[1], x[3], String(x[5])]))]; for (const e of events) { const h = r[e.row - 1]; const it = db.vbrp.filter(p => p[0] === h[0]); out.push(`${h[0]}: ITEMS ${it.length} QTY ${it.reduce((s, p) => s + p[3], 0)} NET ${it.reduce((s, p) => s + p[4], 0)}`); } return out.join('\n'); },
    sol: "REPORT z_sd_billing_alv.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF vbrk.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    CLASS-METHODS on_hotspot FOR EVENT hotspot_click OF cl_gui_alv_grid\n      IMPORTING e_row_id e_column_id.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_hotspot.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row_id-index.\n    SELECT COUNT(*) AS cnt, SUM( fkimg ) AS qty, SUM( netwr ) AS net\n      FROM vbrp\n      WHERE vbeln = @gs_itab-vbeln\n      INTO ( @DATA(lv_cnt), @DATA(lv_qty), @DATA(lv_net) ).\n    MESSAGE |{ gs_itab-vbeln }: ITEMS { lv_cnt } QTY { lv_qty } NET { lv_net }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT * FROM vbrk WHERE fksto <> 'X' ORDER BY vbeln INTO TABLE @gt_itab.\n  gt_fcat = VALUE #( ( fieldname = 'VBELN' coltext = '청구번호' hotspot = 'X' )\n                     ( fieldname = 'FKART' coltext = '청구유형' )\n                     ( fieldname = 'KUNAG' coltext = '지급인' )\n                     ( fieldname = 'NETWR' coltext = '순금액' ) ).\n  CREATE OBJECT go_grid EXPORTING i_parent = cl_gui_container=>default_screen.\n  SET HANDLER lcl_handler=>on_hotspot FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },

  { id: 6142, lv: 4, kind: 'rpt', title: 'O2C 문서 흐름 추적 (VBFA → LIKP → VBRK)',
    body: '판매오더 p_vbeln 이후의 후속 문서를 문서 흐름(VBFA)으로 따라가 보여 주세요.\n· 첫 줄: "ORDER 오더번호"\n· 오더 → 납품: VBFA 에서 vbelv = 오더, vbtyp_n = \'J\'(납품) 인 문서. 납품번호 순으로 LIKP 의 실제 출고일 wadat_ist 를 보고 "DELIVERY 납품번호 GI 출고일", 아직 출고 전(초기값)이면 "DELIVERY 납품번호 GI OPEN"\n· 납품 → 청구: VBFA 에서 vbelv = 납품, vbtyp_n = \'M\'(청구) 인 문서. 청구번호 순으로 "INVOICE 청구번호", VBRK-FKSTO = \'X\' 이면 뒤에 CANCELLED\n· 품목마다 VBFA 행이 있으니 문서번호 중복은 한 번만 출력합니다.\n· 납품이 없으면 둘째 줄에 NO FOLLOW-ON DOCUMENTS, 납품은 있는데 청구가 없으면 마지막 줄에 NO INVOICE.',
    fields: [['vbfa-vbelv', '선행 문서 번호'], ['vbfa-vbeln', '후속 문서 번호'], ['vbfa-vbtyp_n', '후속 문서 범주 (J 납품, M 송장)'], ['likp-wadat_ist', '실제 출고(GI) 일자'], ['vbrk-fksto', '청구 취소 표시']],
    tables: ['vbfa', 'likp', 'vbrk'], sel: [{ n: 'p_vbeln', kind: 'p', decl: 'TYPE vbak-vbeln', label: '판매오더' }],
    tests: ['20001', '20002', '20003', '20004'].map(p_vbeln => ({ p_vbeln, db: { vbfa: SD_VBFA, likp: SD_LIKP, vbrk: SD_VBRK } })),
    ref: ({ p_vbeln, db }) => { const out = [`ORDER ${p_vbeln}`]; const dl = [...new Set(db.vbfa.filter(x => x[0] === p_vbeln && x[5] === 'J').map(x => x[2]))].sort(); if (!dl.length) return out.concat('NO FOLLOW-ON DOCUMENTS').join('\n');
      for (const d of dl) { const l = db.likp.find(x => x[0] === d); if (!l) continue; out.push(l[6] === '00000000' ? `DELIVERY ${d} GI OPEN` : `DELIVERY ${d} GI ${l[6]}`); }
      const iv = [...new Set(db.vbfa.filter(x => dl.includes(x[0]) && x[5] === 'M').map(x => x[2]))].sort(); if (!iv.length) return out.concat('NO INVOICE').join('\n');
      for (const i of iv) { const k = db.vbrk.find(x => x[0] === i); if (!k) continue; out.push(`INVOICE ${i}${k[8] === 'X' ? ' CANCELLED' : ''}`); } return out.join('\n'); },
    sol: "REPORT z_sd_docflow.\n\nPARAMETERS p_vbeln TYPE vbak-vbeln.\n\nSTART-OF-SELECTION.\n  WRITE: 'ORDER', p_vbeln.\n\n  \" 1) 오더 → 납품\n  SELECT vbeln, vbtyp_n FROM vbfa\n    WHERE vbelv = @p_vbeln\n      AND vbtyp_n = 'J'\n    INTO TABLE @DATA(gt_dlv).\n  IF gt_dlv IS INITIAL.\n    WRITE / 'NO FOLLOW-ON DOCUMENTS'.\n    RETURN.\n  ENDIF.\n  SORT gt_dlv BY vbeln.\n  DELETE ADJACENT DUPLICATES FROM gt_dlv COMPARING vbeln.\n\n  SELECT vbeln, wadat_ist FROM likp\n    FOR ALL ENTRIES IN @gt_dlv\n    WHERE vbeln = @gt_dlv-vbeln\n    INTO TABLE @DATA(gt_likp).\n  SORT gt_likp BY vbeln.\n  LOOP AT gt_likp INTO DATA(gs_likp).\n    IF gs_likp-wadat_ist IS INITIAL.\n      WRITE: / 'DELIVERY', gs_likp-vbeln, 'GI OPEN'.\n    ELSE.\n      WRITE: / 'DELIVERY', gs_likp-vbeln, 'GI', gs_likp-wadat_ist.\n    ENDIF.\n  ENDLOOP.\n\n  \" 2) 납품 → 청구\n  SELECT vbeln, vbtyp_n FROM vbfa\n    FOR ALL ENTRIES IN @gt_dlv\n    WHERE vbelv = @gt_dlv-vbeln\n      AND vbtyp_n = 'M'\n    INTO TABLE @DATA(gt_inv).\n  IF gt_inv IS INITIAL.\n    WRITE / 'NO INVOICE'.\n    RETURN.\n  ENDIF.\n  SORT gt_inv BY vbeln.\n  DELETE ADJACENT DUPLICATES FROM gt_inv COMPARING vbeln.\n\n  SELECT vbeln, fksto FROM vbrk\n    FOR ALL ENTRIES IN @gt_inv\n    WHERE vbeln = @gt_inv-vbeln\n    INTO TABLE @DATA(gt_vbrk).\n  SORT gt_vbrk BY vbeln.\n  LOOP AT gt_vbrk INTO DATA(gs_vbrk).\n    IF gs_vbrk-fksto = 'X'.\n      WRITE: / 'INVOICE', gs_vbrk-vbeln, 'CANCELLED'.\n    ELSE.\n      WRITE: / 'INVOICE', gs_vbrk-vbeln.\n    ENDIF.\n  ENDLOOP." },

  { id: 6143, lv: 4, kind: 'rpt', title: '여신 노출 점검 리포트 (KNKK + VBAK + VBUK)',
    body: '고객별 여신 노출을 계산해 한도 초과 고객을 찾으세요. 여신관리영역은 \'1000\' 입니다.\n· 대상: KNKK 에서 고객 범위 s_kunnr 인 고객, 고객번호 순\n· 미완료 오더 금액 = 오더유형 OR 이고 VBUK-GBSTK 가 C(완료)가 아닌 VBAK 오더의 금액 합계\n· 노출액 = KNKK-SKFOR + 미완료 오더 금액\n· "고객번호 여신한도 노출액 OK", 노출액이 한도를 넘으면 OK 대신 OVER\n· 마지막 줄에 "OVER 초과고객수". 대상이 없으면 NO DATA.',
    fields: [['knkk-klimk', '여신 한도'], ['knkk-skfor', '여신 노출액 (미결 채권)'], ['vbuk-gbstk', '오더 전체 처리 상태'], ['vbak-auart', '오더 유형'], ['vbak-netwr', '오더 순금액']],
    tables: ['knkk', 'vbak', 'vbuk'], sel: [{ n: 's_kunnr', kind: 's', decl: 'FOR knkk-kunnr', label: '고객' }],
    tests: [
      { s_kunnr: [], db: { knkk: SD_KNKK, vbak: SD_VBAK, vbuk: SD_VBUK } },
      { s_kunnr: [], db: { knkk: SD_KNKK, vbak: SD_VBAK, vbuk: SD_VBUK.map(x => [x[0], 'C', 'C', 'C', 'C', 'A']) } },
      { s_kunnr: [['I', 'EQ', 'C100', '']], db: { knkk: [['C100', '1000', 10000, 8000, '001']], vbak: SD_VBAK, vbuk: SD_VBUK } },
      { s_kunnr: [['I', 'EQ', 'C999', '']], db: { knkk: SD_KNKK, vbak: SD_VBAK, vbuk: SD_VBUK } },
      { s_kunnr: [['E', 'EQ', 'C300', '']], db: { knkk: SD_KNKK.concat([['C200', '2000', 1, 999999, '009']]), vbak: SD_VBAK, vbuk: SD_VBUK } }],
    ref: ({ s_kunnr, db }) => { const ks = db.knkk.filter(x => x[1] === '1000' && jsIn(x[0], s_kunnr)).sort((a, b) => sdBy(a[0], b[0])); if (!ks.length) return 'NO DATA'; let over = 0;
      const out = ks.map(k => { const open = db.vbak.filter(v => v[3] === k[0] && v[2] === 'OR' && (db.vbuk.find(u => u[0] === v[0]) || [])[1] && db.vbuk.find(u => u[0] === v[0])[1] !== 'C').reduce((s, v) => s + v[4], 0); const ex = k[3] + open; if (ex > k[2]) over++; return `${k[0]} ${k[2]} ${ex} ${ex > k[2] ? 'OVER' : 'OK'}`; }); return out.concat(`OVER ${over}`).join('\n'); },
    sol: "REPORT z_sd_credit_exposure.\n\nSELECT-OPTIONS s_kunnr FOR knkk-kunnr.\n\nSTART-OF-SELECTION.\n  SELECT kunnr, klimk, skfor FROM knkk\n    WHERE kunnr IN @s_kunnr\n      AND kkber = '1000'\n    ORDER BY kunnr\n    INTO TABLE @DATA(gt_knkk).\n  IF gt_knkk IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  \" 미완료 판매오더\n  SELECT k~kunnr, k~netwr\n    FROM vbak AS k\n    INNER JOIN vbuk AS u ON k~vbeln = u~vbeln\n    WHERE k~auart = 'OR'\n      AND u~gbstk <> 'C'\n    INTO TABLE @DATA(gt_open).\n\n  DATA: lv_exp  TYPE i,\n        lv_over TYPE i.\n  LOOP AT gt_knkk INTO DATA(gs_knkk).\n    lv_exp = gs_knkk-skfor.\n    LOOP AT gt_open INTO DATA(gs_open) WHERE kunnr = gs_knkk-kunnr.\n      lv_exp = lv_exp + gs_open-netwr.\n    ENDLOOP.\n    IF lv_exp > gs_knkk-klimk.\n      lv_over = lv_over + 1.\n      WRITE: / gs_knkk-kunnr, gs_knkk-klimk, lv_exp, 'OVER'.\n    ELSE.\n      WRITE: / gs_knkk-kunnr, gs_knkk-klimk, lv_exp, 'OK'.\n    ENDIF.\n  ENDLOOP.\n  WRITE: / 'OVER', lv_over." },

  { id: 6144, lv: 4, kind: 'rpt', title: '청구 가격 조건 분석 (VBRK + KONV)',
    body: '대금청구 p_vbeln 의 가격 조건을 KONV 에서 읽어 품목별로 분석하세요. 조건은 VBRK-KNUMV(조건 문서 번호)로 연결됩니다.\n· 조건유형: PR00 기본가, K007 고객 할인(음수), MWST 부가세\n· 품목번호(kposn) 순으로 "품목 PR00금액 K007금액 순액 세금"을 출력합니다. 순액 = MWST 를 뺀 조건 금액(kwert)의 합, 없는 조건은 0\n· 다음 줄에 "TOTAL 순액합 세금합"\n· 마지막 줄: 순액합이 VBRK-NETWR, 세금합이 VBRK-MWSBK 와 모두 같으면 CHECK OK, 아니면 CHECK DIFF\n· 청구 문서가 없으면 NOT FOUND.',
    fields: [['vbrk-knumv', '조건 문서 번호 (KONV 연결 키)'], ['konv-kposn', '조건 품목 번호'], ['konv-kschl', '조건 유형 (PR00, K007, MWST)'], ['konv-kwert', '조건 금액'], ['vbrk-mwsbk', '세금 금액']],
    tables: ['vbrk', 'konv'], sel: [{ n: 'p_vbeln', kind: 'p', decl: 'TYPE vbrk-vbeln', label: '청구문서' }],
    tests: ['90001', '90002', '90004', '99999', '90003'].map(p_vbeln => ({ p_vbeln, db: { vbrk: SD_VBRK, konv: SD_KONV } })),
    ref: ({ p_vbeln, db }) => { const h = db.vbrk.find(x => x[0] === p_vbeln); if (!h) return 'NOT FOUND'; const m = {}; db.konv.filter(x => x[0] === h[4]).forEach(x => { const o = m[x[1]] || (m[x[1]] = { pr: 0, k7: 0, net: 0, tax: 0 }); if (x[3] === 'PR00') o.pr += x[5]; if (x[3] === 'K007') o.k7 += x[5]; if (x[3] === 'MWST') o.tax += x[5]; else o.net += x[5]; });
      const ks = Object.keys(m).sort(); let n = 0, t = 0; const out = ks.map(k => { n += m[k].net; t += m[k].tax; return `${k} ${m[k].pr} ${m[k].k7} ${m[k].net} ${m[k].tax}`; }); out.push(`TOTAL ${n} ${t}`, n === h[5] && t === h[6] ? 'CHECK OK' : 'CHECK DIFF'); return out.join('\n'); },
    sol: "REPORT z_sd_konv.\n\nPARAMETERS p_vbeln TYPE vbrk-vbeln.\n\nTYPES: BEGIN OF ty_item,\n         kposn TYPE string,\n         pr00  TYPE i,\n         k007  TYPE i,\n         net   TYPE i,\n         tax   TYPE i,\n       END OF ty_item.\nDATA: gt_item TYPE TABLE OF ty_item,\n      gs_item TYPE ty_item.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE knumv, netwr, mwsbk FROM vbrk\n    WHERE vbeln = @p_vbeln\n    INTO @DATA(gs_vbrk).\n  IF sy-subrc <> 0.\n    WRITE 'NOT FOUND'.\n    RETURN.\n  ENDIF.\n\n  SELECT kposn, kschl, kwert FROM konv\n    WHERE knumv = @gs_vbrk-knumv\n    INTO TABLE @DATA(gt_konv).\n\n  LOOP AT gt_konv INTO DATA(gs_konv).\n    CLEAR gs_item.\n    gs_item-kposn = gs_konv-kposn.\n    CASE gs_konv-kschl.\n      WHEN 'PR00'. gs_item-pr00 = gs_konv-kwert.\n      WHEN 'K007'. gs_item-k007 = gs_konv-kwert.\n      WHEN 'MWST'. gs_item-tax  = gs_konv-kwert.\n    ENDCASE.\n    IF gs_konv-kschl <> 'MWST'.\n      gs_item-net = gs_konv-kwert.\n    ENDIF.\n    COLLECT gs_item INTO gt_item.\n  ENDLOOP.\n  SORT gt_item BY kposn.\n\n  DATA: lv_net TYPE i,\n        lv_tax TYPE i.\n  LOOP AT gt_item INTO gs_item.\n    WRITE: / gs_item-kposn, gs_item-pr00, gs_item-k007, gs_item-net, gs_item-tax.\n    lv_net = lv_net + gs_item-net.\n    lv_tax = lv_tax + gs_item-tax.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_net, lv_tax.\n  IF lv_net = gs_vbrk-netwr AND lv_tax = gs_vbrk-mwsbk.\n    WRITE / 'CHECK OK'.\n  ELSE.\n    WRITE / 'CHECK DIFF'.\n  ENDIF." },

  { id: 6151, lv: 5, kind: 'rpt', ban: ['IF', 'CASE'], title: 'SWITCH로 품목 상태 표시 (VBUP)',
    body: '판매오더 p_vbeln 의 품목 상태(VBUP)를 읽어, 품목번호 순으로 "품목 DLV 납품상태 BILL 청구상태"를 출력하세요.\n· 상태 코드: A → OPEN, B → PARTIAL, C → DONE, 그 밖(빈 값 등) → N/A\n· 마지막 줄에 "ITEMS 품목수"\nIF, CASE 대신 SWITCH 와 문자열 템플릿을 쓰세요.',
    fields: [['vbup-posnr', '품목 번호'], ['vbup-lfsta', '품목 납품 상태'], ['vbup-fksta', '품목 대금청구 상태 (빈 값 = 청구 대상 아님)']],
    tables: ['vbup'], sel: [{ n: 'p_vbeln', kind: 'p', decl: 'TYPE vbup-vbeln', label: '판매오더' }],
    tests: ['20002', '20001', '20004', '20009'].map(p_vbeln => ({ p_vbeln, db: { vbup: SD_VBUP } })),
    ref: ({ p_vbeln, db }) => { const r = db.vbup.filter(x => x[0] === p_vbeln).sort((a, b) => sdBy(a[1], b[1])); return [...r.map(x => `${x[1]} DLV ${sdSt(x[2])} BILL ${sdSt(x[3])}`), `ITEMS ${r.length}`].join('\n'); },
    sol: "REPORT z_sd_vbup.\n\nPARAMETERS p_vbeln TYPE vbup-vbeln.\n\nSTART-OF-SELECTION.\n  SELECT posnr, lfsta, fksta FROM vbup\n    WHERE vbeln = @p_vbeln\n    ORDER BY posnr\n    INTO TABLE @DATA(gt_itab).\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(lv_dlv) = SWITCH string( gs_itab-lfsta WHEN 'A' THEN `OPEN` WHEN 'B' THEN `PARTIAL` WHEN 'C' THEN `DONE` ELSE `N/A` ).\n    DATA(lv_bil) = SWITCH string( gs_itab-fksta WHEN 'A' THEN `OPEN` WHEN 'B' THEN `PARTIAL` WHEN 'C' THEN `DONE` ELSE `N/A` ).\n    WRITE / |{ gs_itab-posnr } DLV { lv_dlv } BILL { lv_bil }|.\n  ENDLOOP.\n  WRITE / |ITEMS { lines( gt_itab ) }|." },

  { id: 6153, lv: 5, kind: 'rpt', ban: ['LOOP', 'IF', 'CASE'], title: 'REDUCE로 일정 확정률 (VBEP)',
    body: '판매오더 p_vbeln 의 납품일정 라인(VBEP)을 읽어 가용성 확정 현황을 출력하세요.\n· ORDERED 주문수량(wmeng) 합계\n· CONFIRMED 확정수량(bmeng) 합계\n· RATE 확정률% = 확정 × 100 DIV 주문 (주문이 0이면 0)\n· SHORT LINES 확정이 주문보다 적은 라인 수\n네 줄을 "ORDERED 값"처럼 출력합니다. LOOP, IF, CASE 대신 REDUCE 와 COND 를 쓰세요.',
    fields: [['vbep-etenr', '일정 라인 번호'], ['vbep-wmeng', '주문 수량'], ['vbep-bmeng', '확정 수량'], ['vbep-edatu', '납품 예정일']],
    tables: ['vbep'], sel: [{ n: 'p_vbeln', kind: 'p', decl: 'TYPE vbep-vbeln', label: '판매오더' }],
    tests: ['20002', '20001', '20003', '20009'].map(p_vbeln => ({ p_vbeln, db: { vbep: SD_VBEP } })),
    ref: ({ p_vbeln, db }) => { const r = db.vbep.filter(x => x[0] === p_vbeln); const o = r.reduce((s, x) => s + x[4], 0), c = r.reduce((s, x) => s + x[5], 0); return `ORDERED ${o}\nCONFIRMED ${c}\nRATE ${o ? Math.floor(c * 100 / o) : 0}%\nSHORT LINES ${r.filter(x => x[5] < x[4]).length}`; },
    sol: "REPORT z_sd_vbep.\n\nPARAMETERS p_vbeln TYPE vbep-vbeln.\n\nSTART-OF-SELECTION.\n  SELECT etenr, wmeng, bmeng FROM vbep\n    WHERE vbeln = @p_vbeln\n    INTO TABLE @DATA(gt_itab).\n\n  DATA(lv_ord)   = REDUCE i( INIT s = 0 FOR gs IN gt_itab NEXT s = s + gs-wmeng ).\n  DATA(lv_cnf)   = REDUCE i( INIT s = 0 FOR gs IN gt_itab NEXT s = s + gs-bmeng ).\n  DATA(lv_short) = REDUCE i( INIT n = 0 FOR gs IN gt_itab WHERE ( bmeng < wmeng ) NEXT n = n + 1 ).\n  DATA(lv_rate)  = COND i( WHEN lv_ord = 0 THEN 0 ELSE lv_cnf * 100 DIV lv_ord ).\n\n  WRITE: / |ORDERED { lv_ord }|,\n         / |CONFIRMED { lv_cnf }|,\n         / |RATE { lv_rate }%|,\n         / |SHORT LINES { lv_short }|." }
]);

// ======================= 3차 개편 =======================
// 새 레벨(Lv1 기초 / Lv2 SQL / Lv3 CDS / Lv4 RAP)에 맞지 않는 문제는 '모듈별 프로그램 개발'(PGM)로 옮긴다

 [6141, '리포트'], [6142, '리포트'], [6143, '리포트'], [6144, '리포트']].forEach(([old, topic], i) => {

{ const m = MODULES.find(x => x.code === 'sd'); for (const t of ['zsd_so_h', 'zsd_so_i']) if (!m.tables.includes(t)) m.tables.push(t); }
const SD_VBAP = [['20001', '10', 'M1', 10, 3000], ['20001', '20', 'M2', 5, 2000], ['20002', '10', 'M3', 20, 12000], ['20003', '10', 'M1', 3, 900], ['20003', '20', 'M4', 7, 2100], ['20004', '10', 'M2', 8, 8000], ['20005', '10', 'M1', 2, 1000]];

const SD_SOH = () => [['30001', 'C100', 'OR', 'N', 5000], ['30002', 'C200', 'OR', 'A', 3000], ['30003', 'C300', 'OR', 'X', 0]];

const SD_BO = (ext) => ({ name: 'zr_salesorder', entities: [

addMod('sd', [
  // ---------------- Lv.1 (선택 화면 문제 자리) ----------------
  { id: 6113, lv: 1, title: '오더유형별 금액 부호',
    body: '판매 문서 유형 auart 와 금액 netwr 가 주어집니다. 매출 집계에서 반품·대변메모는 금액을 빼야 합니다.\n· OR(표준오더), DR(차변메모): 금액 그대로\n· RE(반품), CR(대변메모): 금액에 -1 을 곱함\n· 그 밖의 유형: UNKNOWN 을 출력하고 끝\nCASE 문으로 유형 이름(OR 표준오더 / DR 차변메모 / RE 반품 / CR 대변메모)과 부호를 붙인 금액을 "이름 금액"으로 출력하세요.',
    fields: [['vbak-auart', '판매 문서 유형'], ['vbak-netwr', '오더 순금액 (통화 금액)']],
    inputs: [{ n: 'auart', t: 'string' }, { n: 'netwr', t: 'i' }], inDesc: 'auart 는 2자, 0 ≤ netwr ≤ 1,000,000', outDesc: '"유형이름 금액" 또는 UNKNOWN 을 출력합니다.',
    tests: [['OR', 5000], ['RE', 1200], ['CR', 300], ['DR', 0], ['ZZ', 100], ['RE', 0]].map(([auart, netwr]) => ({ auart, netwr })),
    ref: ({ auart, netwr }) => { const m = { OR: ['표준오더', 1], DR: ['차변메모', 1], RE: ['반품', -1], CR: ['대변메모', -1] }[auart]; return m ? `${m[0]} ${m[1] * netwr}` : 'UNKNOWN'; },
    sol: L('DATA lv_name TYPE string.', 'DATA lv_sign TYPE i VALUE 1.', 'CASE auart.', "  WHEN 'OR'. lv_name = '표준오더'.", "  WHEN 'DR'. lv_name = '차변메모'.", "  WHEN 'RE'. lv_name = '반품'.   lv_sign = -1.", "  WHEN 'CR'. lv_name = '대변메모'. lv_sign = -1.", '  WHEN OTHERS.', "    WRITE 'UNKNOWN'.", '    RETURN.', 'ENDCASE.', 'WRITE: lv_name, netwr * lv_sign.') },

  // ---------------- Lv.2 초급: WITH / FAE+ALV / EXISTS ----------------
  { id: 6121, lv: 2, kind: 'rpt', must: ['with'], title: '고객별 매출 집계 (WITH 공통 테이블 식)',
    body: '표준오더(AUART = \'OR\')의 고객별 오더 건수와 매출 합계를 구해, 합계가 p_min 이상인 고객만 고객명과 함께 출력하세요.\n· WITH +sales AS ( SELECT … FROM vbak … GROUP BY kunnr ) 로 고객별 집계를 먼저 만들고,\n  메인 SELECT 에서 +sales 와 KNA1 을 INNER JOIN 합니다.\n· 합계 큰 순(같으면 고객번호 순)으로 "고객 고객명 건수 합계"를 출력, 없으면 NO DATA.',
    fields: [['vbak-kunnr', '판매처(고객)'], ['vbak-auart', '판매 문서 유형'], ['vbak-netwr', '오더 순금액'], ['kna1-name1', '고객명']],
    tables: ['vbak', 'kna1'], sel: [{ n: 'p_min', kind: 'p', decl: 'TYPE i', label: '최소 매출' }],
    tests: [[0, SD_VBAK, SD_KNA1], [8000, SD_VBAK, SD_KNA1], [20000, SD_VBAK, SD_KNA1],
      [0, [...SD_VBAK, ['20006', '20261015', 'OR', 'C900', 9999], ['20007', '20261016', 'OR', 'C400', 8000]], SD_KNA1]].map(([p_min, vbak, kna1]) => ({ p_min, db: { vbak, kna1 } })),
    ref: ({ p_min, db }) => { const m = {}; for (const r of db.vbak) if (r[2] === 'OR') { m[r[3]] = m[r[3]] || [0, 0]; m[r[3]][0]++; m[r[3]][1] += r[4]; } const rows = Object.entries(m).filter(([k, v]) => v[1] >= p_min && db.kna1.some(c => c[0] === k)).sort((a, b) => b[1][1] - a[1][1] || sdBy(a[0], b[0])); return rows.length ? rows.map(([k, v]) => `${k} ${db.kna1.find(c => c[0] === k)[1]} ${v[0]} ${v[1]}`).join('\n') : 'NO DATA'; },
    sol: "REPORT z_sd_with.\n\nPARAMETERS p_min TYPE i.\n\nSTART-OF-SELECTION.\n  WITH +sales AS (\n    SELECT kunnr, COUNT(*) AS cnt, SUM( netwr ) AS total\n      FROM vbak\n      WHERE auart = 'OR'\n      GROUP BY kunnr )\n  SELECT s~kunnr, k~name1, s~cnt, s~total\n    FROM +sales AS s\n    INNER JOIN kna1 AS k ON k~kunnr = s~kunnr\n    WHERE s~total >= @p_min\n    ORDER BY s~total DESCENDING, s~kunnr\n    INTO TABLE @DATA(gt_itab).\n\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-kunnr, gs_itab-name1, gs_itab-cnt, gs_itab-total.\n  ENDLOOP." },

  { id: 6122, lv: 2, kind: 'rpt', must: ['entries'], title: '고객 오더 품목 ALV (FOR ALL ENTRIES)',
    body: '고객 p_kunnr 의 판매오더 품목을 ALV 로 보여 주세요.\n1) VBAK 에서 고객의 오더번호를 gt_vbak 으로 읽습니다.\n2) gt_vbak 이 비어 있으면 NO DATA 를 출력하고 끝냅니다. (비어 있는 채로 FOR ALL ENTRIES 를 쓰면 전체 품목이 읽힙니다!)\n3) VBAP 에서 FOR ALL ENTRIES IN gt_vbak 으로 VBELN, POSNR, MATNR, KWMENG, NETWR 을 읽어 오더·품목 순으로 정렬합니다.\n4) REUSE_ALV_GRID_DISPLAY 의 TABLES t_outtab 에 넘깁니다(필드 카탈로그·구조 이름 없이).',
    fields: [['vbak-vbeln', '오더 번호'], ['vbap-posnr', '품목 번호'], ['vbap-matnr', '자재'], ['vbap-kwmeng', '주문 수량'], ['vbap-netwr', '품목 순금액']],
    tables: ['vbak', 'vbap'], sel: [{ n: 'p_kunnr', kind: 'p', decl: 'TYPE vbak-kunnr', label: '고객' }],
    tests: ['C100', 'C200', 'C400', 'C300'].map(p_kunnr => ({ p_kunnr, db: { vbak: SD_VBAK, vbap: SD_VBAP } })),
    ref: ({ p_kunnr, db }) => { const os = db.vbak.filter(r => r[3] === p_kunnr).map(r => r[0]); if (!os.length) return 'NO DATA'; const rows = db.vbap.filter(r => os.includes(r[0])).sort((a, b) => sdBy(a[0] + a[1], b[0] + b[1])); return alvTxt('', ['VBELN', 'POSNR', 'MATNR', 'KWMENG', 'NETWR'], rows.map(r => r.map(String))); },
    sol: "REPORT z_sd_fae_alv.\n\nPARAMETERS p_kunnr TYPE vbak-kunnr.\n\nSTART-OF-SELECTION.\n  SELECT vbeln, kunnr FROM vbak\n    WHERE kunnr = @p_kunnr\n    INTO TABLE @DATA(gt_vbak).\n  IF gt_vbak IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  SELECT vbeln, posnr, matnr, kwmeng, netwr FROM vbap\n    FOR ALL ENTRIES IN @gt_vbak\n    WHERE vbeln = @gt_vbak-vbeln\n    INTO TABLE @DATA(gt_itab).\n  SORT gt_itab BY vbeln posnr.\n\n  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'\n    TABLES\n      t_outtab = gt_itab." },

  { id: 6123, lv: 2, kind: 'rpt', must: ['exists'], title: '미청구 납품 찾기 (NOT EXISTS)',
    body: '출고(GI)는 끝났는데 아직 대금청구가 안 된 납품을 찾으세요.\n· 납품 헤더 LIKP 중 실제 출고일 WADAT_IST 가 \'00000000\' 이 아닌 납품\n· 문서 흐름 VBFA 에 그 납품(VBELV)의 후속 문서 유형 VBTYP_N = \'M\'(청구)이 없는 납품 → WHERE NOT EXISTS ( SELECT … FROM vbfa WHERE … ) 상관 하위 질의를 쓰세요.\n납품번호 순으로 "납품 고객 출고일", 마지막 줄에 "COUNT 건수"를 출력합니다. 없으면 ALL BILLED.',
    fields: [['likp-vbeln', '납품 번호'], ['likp-kunnr', '납품처'], ['likp-wadat_ist', '실제 출고일 (00000000 = 미출고)'], ['vbfa-vbelv', '선행 문서'], ['vbfa-vbtyp_n', '후속 문서 유형 (J 납품, M 청구)']],
    tables: ['likp', 'vbfa'], sel: [],
    tests: [SD_VBFA, SD_VBFA.filter(r => !(r[0] === '80004' && r[5] === 'M')), SD_VBFA.filter(r => r[5] !== 'M')].map(vbfa => ({ db: { likp: [...SD_LIKP, ['80005', 'LF', '20261013', '1000', 'C400', '20261014', '20261014']], vbfa } })),
    ref: ({ db }) => { const r = db.likp.filter(l => l[6] !== '00000000' && !db.vbfa.some(f => f[0] === l[0] && f[5] === 'M')).sort((a, b) => sdBy(a[0], b[0])); return r.length ? [...r.map(l => `${l[0]} ${l[4]} ${l[6]}`), `COUNT ${r.length}`].join('\n') : 'ALL BILLED'; },
    sol: "REPORT z_sd_unbilled.\n\nSTART-OF-SELECTION.\n  SELECT vbeln, kunnr, wadat_ist\n    FROM likp AS l\n    WHERE wadat_ist <> '00000000'\n      AND NOT EXISTS ( SELECT vbelv FROM vbfa\n                         WHERE vbfa~vbelv = l~vbeln\n                           AND vbfa~vbtyp_n = 'M' )\n    ORDER BY vbeln\n    INTO TABLE @DATA(gt_itab).\n\n  IF gt_itab IS INITIAL.\n    WRITE 'ALL BILLED'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-vbeln, gs_itab-kunnr, gs_itab-wadat_ist.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." }
]);

addMod('sd', [
  { id: 6131, lv: 3, kind: 'cds', title: '판매오더 품목 뷰 (JOIN)',
    body: 'CDS 뷰 ZI_SALESITEM 을 만드세요. 판매오더 품목 VBAP 에 헤더 VBAK 를 INNER JOIN 해서 품목마다 고객·생성일을 붙입니다.\n· define view entity ZI_SALESITEM as select from vbap as Item inner join vbak as Header on Header.vbeln = Item.vbeln\n· 필드(이 이름 그대로): key vbeln, key posnr, kunnr, erdat, matnr, kwmeng, netwr\n· 표준오더(AUART = \'OR\')만 (WHERE)\n채점기가 뷰를 오더·품목 순으로 읽어 출력합니다.',
    fields: [['vbap-vbeln', '오더 번호'], ['vbap-posnr', '품목 번호'], ['vbak-kunnr', '판매처'], ['vbak-erdat', '오더 생성일'], ['vbak-auart', '판매 문서 유형']],
    tables: ['vbak', 'vbap'], show: [{ view: 'zi_salesitem', cols: ['vbeln', 'posnr', 'kunnr', 'erdat', 'matnr', 'kwmeng', 'netwr'], order: ['vbeln', 'posnr'] }],
    outDesc: '머리글 VBELN POSNR KUNNR ERDAT MATNR KWMENG NETWR 다음 줄부터 뷰의 행을 출력합니다(채점기 출력).',
    tests: [{ db: { vbak: SD_VBAK, vbap: SD_VBAP } }, { db: { vbak: SD_VBAK.map(r => r[0] === '20002' ? [r[0], r[1], 'RE', r[3], r[4]] : r), vbap: SD_VBAP } }, { db: { vbak: SD_VBAK.filter(r => r[2] === 'RE'), vbap: SD_VBAP } }],
    ref: ({ db }) => cdsTxt(['vbeln', 'posnr', 'kunnr', 'erdat', 'matnr', 'kwmeng', 'netwr'], db.vbap.map(i => [i, db.vbak.find(h => h[0] === i[0])]).filter(([, h]) => h && h[2] === 'OR').sort((a, b) => sdBy(a[0][0] + a[0][1], b[0][0] + b[0][1])).map(([i, h]) => [i[0], i[1], h[3], h[1], i[2], i[3], i[4]])),
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '판매오더 품목'\ndefine view entity ZI_SALESITEM\n  as select from vbap as Item\n    inner join vbak as Header on Header.vbeln = Item.vbeln\n{\n  key Item.vbeln,\n  key Item.posnr,\n      Header.kunnr,\n      Header.erdat,\n      Item.matnr,\n      Item.kwmeng,\n      Item.netwr\n}\nwhere Header.auart = 'OR'" },

  { id: 6132, lv: 3, kind: 'cds', title: '대금청구 뷰 (연관·경로식·CASE·CAST)',
    body: 'CDS 뷰 ZI_BILLINGDOC 을 VBRK 기반으로 만드세요.\n· association [0..1] to kna1 as _Payer on $projection.kunag = _Payer.kunnr\n· 필드: key vbeln, fkart, kunag, _Payer.name1 as payername,\n  cast( netwr as abap.dec(15,2) ) as netamount,\n  netwr + mwsbk as grossamount,\n  case fkart when \'F2\' then \'INVOICE\' when \'G2\' then \'CREDIT\' else \'OTHER\' end as doccategory,\n  case when fksto = \'X\' then \'CANCELLED\' else \'ACTIVE\' end as status,\n  _Payer (연관 노출)\n고객 마스터에 없는 지급인은 payername 이 빈 값이 됩니다.',
    fields: [['vbrk-vbeln', '청구 문서 번호'], ['vbrk-fkart', '청구 유형 (F2 송장, G2 대변메모)'], ['vbrk-kunag', '지급인(판매처)'], ['vbrk-mwsbk', '세액'], ['vbrk-fksto', '취소 표시 (X)']],
    tables: ['vbrk', 'kna1'], show: [{ view: 'zi_billingdoc', cols: ['vbeln', 'fkart', 'kunag', 'payername', 'netamount', 'grossamount', 'doccategory', 'status'], order: ['vbeln'] }],
    outDesc: '머리글 VBELN FKART KUNAG PAYERNAME NETAMOUNT GROSSAMOUNT DOCCATEGORY STATUS 와 청구 문서별 행(NETAMOUNT 는 소수 2자리)을 출력합니다.',
    tests: [{ db: { vbrk: SD_VBRK, kna1: SD_KNA1 } }, { db: { vbrk: [...SD_VBRK, ['90005', 'S1', '20261022', 'C999', 'K005', 300, 30, 'KRW', '', '']], kna1: SD_KNA1 } }, { db: { vbrk: SD_VBRK.slice(1, 3), kna1: SD_KNA1.slice(2) } }],
    ref: ({ db }) => cdsTxt(['vbeln', 'fkart', 'kunag', 'payername', 'netamount', 'grossamount', 'doccategory', 'status'], db.vbrk.slice().sort((a, b) => sdBy(a[0], b[0])).map(r => { const c = db.kna1.find(k => k[0] === r[3]); return [r[0], r[1], r[3], c ? c[1] : '', r[5].toFixed(2), r[5] + r[6], r[1] === 'F2' ? 'INVOICE' : r[1] === 'G2' ? 'CREDIT' : 'OTHER', r[8] === 'X' ? 'CANCELLED' : 'ACTIVE']; })),
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '대금청구 문서'\ndefine view entity ZI_BILLINGDOC\n  as select from vbrk\n  association [0..1] to kna1 as _Payer on $projection.kunag = _Payer.kunnr\n{\n  key vbeln,\n      fkart,\n      kunag,\n      _Payer.name1 as payername,\n      cast( netwr as abap.dec(15,2) ) as netamount,\n      netwr + mwsbk as grossamount,\n      case fkart\n        when 'F2' then 'INVOICE'\n        when 'G2' then 'CREDIT'\n        else 'OTHER'\n      end as doccategory,\n      case when fksto = 'X' then 'CANCELLED' else 'ACTIVE' end as status,\n      _Payer\n}" },

  { id: 6133, lv: 3, kind: 'cds', title: '기간별 고객 매출 (파라미터·GROUP BY·HAVING)',
    body: '파라미터가 있는 CDS 뷰 ZI_CUSTSALES 를 만드세요.\n· with parameters p_from : abap.dats, p_to : abap.dats\n· VBAK 에서 생성일 ERDAT 가 p_from ~ p_to 사이(BETWEEN $parameters.p_from AND $parameters.p_to)이고 AUART = \'OR\' 인 오더만\n· 고객별로 묶어(GROUP BY kunnr): key kunnr, count( * ) as ordercount, sum( netwr ) as totalnet, max( netwr ) as maxnet, avg( netwr as abap.dec(15,2) ) as avgnet\n· 합계가 5000 이상인 고객만 (HAVING sum( netwr ) >= 5000)\n채점기는 p_from = 20261001, p_to = 20261010 으로 뷰를 읽습니다.',
    fields: [['vbak-erdat', '오더 생성일'], ['vbak-kunnr', '판매처'], ['vbak-netwr', '오더 순금액'], ['vbak-auart', '판매 문서 유형']],
    tables: ['vbak'], show: [{ view: 'zi_custsales', params: { p_from: '20261001', p_to: '20261010' }, cols: ['kunnr', 'ordercount', 'totalnet', 'maxnet', 'avgnet'], order: ['kunnr'] }],
    outDesc: '머리글 KUNNR ORDERCOUNT TOTALNET MAXNET AVGNET 와 고객별 행(AVGNET 은 소수 2자리)을 출력합니다.',
    tests: [{ db: { vbak: SD_VBAK } }, { db: { vbak: [...SD_VBAK, ['20008', '20261009', 'OR', 'C300', 1001], ['20009', '20261011', 'OR', 'C200', 99999], ['20010', '20260930', 'OR', 'C400', 7000], ['20011', '20261002', 'OR', 'C400', 2000]] } }, { db: { vbak: SD_VBAK.filter(r => r[3] !== 'C100') } }],

const SD_RAP_VAL_SOL = "CLASS lhc_item DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS validatequantity FOR VALIDATE ON SAVE\n      IMPORTING keys FOR item~validatequantity.\nENDCLASS.\n\nCLASS lhc_item IMPLEMENTATION.\n  METHOD validatequantity.\n    READ ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY item\n        FIELDS ( kwmeng )\n        WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_item).\n\n    LOOP AT lt_item INTO DATA(ls_item) WHERE kwmeng <= 0.\n      APPEND VALUE #( %tky = ls_item-%tky ) TO failed-item.\n      APPEND VALUE #( %tky = ls_item-%tky\n                      %msg = new_message_with_text(\n                               severity = if_abap_behv_message=>severity-error\n                               text     = '수량은 0보다 커야 합니다' ) ) TO reported-item.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.";
const SD_RAP_DET_SOL = "CLASS lhc_item DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS calcnetwr FOR DETERMINE ON MODIFY\n      IMPORTING keys FOR item~calcnetwr.\nENDCLASS.\n\nCLASS lhc_item IMPLEMENTATION.\n  METHOD calcnetwr.\n    READ ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY item\n        FIELDS ( kwmeng netpr )\n        WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_item).\n\n    MODIFY ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY item\n        UPDATE FIELDS ( netwr )\n        WITH VALUE #( FOR ls_item IN lt_item\n                      ( %tky  = ls_item-%tky\n                        netwr = ls_item-kwmeng * ls_item-netpr ) ).\n  ENDMETHOD.\nENDCLASS.";
const SD_RAP_ACT_SOL = "CLASS lhc_order DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS approve FOR MODIFY\n      IMPORTING keys FOR ACTION order~approve RESULT result.\nENDCLASS.\n\nCLASS lhc_order IMPLEMENTATION.\n  METHOD approve.\n    READ ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY order\n        FIELDS ( status )\n        WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_order).\n\n    DATA lt_ok LIKE lt_order.\n    LOOP AT lt_order INTO DATA(ls_order).\n      IF ls_order-status = 'N'.\n        APPEND ls_order TO lt_ok.\n      ELSE.\n        APPEND VALUE #( %tky = ls_order-%tky ) TO failed-order.\n        APPEND VALUE #( %tky = ls_order-%tky\n                        %msg = new_message_with_text(\n                                 severity = if_abap_behv_message=>severity-error\n                                 text     = '승인할 수 없는 상태입니다' ) ) TO reported-order.\n      ENDIF.\n    ENDLOOP.\n\n    MODIFY ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY order\n        UPDATE FIELDS ( status )\n        WITH VALUE #( FOR ls_ok IN lt_ok ( %tky = ls_ok-%tky status = 'A' ) ).\n\n    READ ENTITIES OF zr_salesorder IN LOCAL MODE\n      ENTITY order\n        ALL FIELDS\n        WITH CORRESPONDING #( lt_ok )\n      RESULT DATA(lt_new).\n\n    result = VALUE #( FOR ls_new IN lt_new ( %tky = ls_new-%tky %param = ls_new ) ).\n  ENDMETHOD.\nENDCLASS.";

  { id: 6142, lv: 4, kind: 'rap', title: 'RAP 검증 — 품목 수량 (VALIDATION)', checkDb: ['zsd_so_h', 'zsd_so_i'], inputs: [], tables: ['zsd_so_h', 'zsd_so_i'],
    bo: SD_BO({ item: { validations: [{ n: 'validatequantity', on: ['create', 'field kwmeng'] }] } }),
    body: '판매오더 BO 의 품목(item) 저장 전에 수량을 검증하세요.\n· 핸들러 클래스 lhc_item (INHERITING FROM cl_abap_behavior_handler)에\n  METHODS validatequantity FOR VALIDATE ON SAVE IMPORTING keys FOR item~validatequantity.\n· READ ENTITIES … IN LOCAL MODE 로 품목의 KWMENG 을 읽고, 0 이하인 품목은\n  failed-item 에 %tky 를, reported-item 에 %tky 와 %msg(심각도 error, 텍스트 \'수량은 0보다 커야 합니다\')를 넣습니다.\n· 검증이 하나라도 실패하면 COMMIT 전체가 실패합니다(채점기가 처리).\n\n행동 정의(BDEF)\n' + SD_BDEF({ item: '\n  validation validatequantity on save { create; field kwmeng; }' }) + SD_RAP_NOTE,
    fields: [['zsd_so_i-kwmeng', '주문 수량 (검증 대상)'], ['zsd_so_i-posnr', '품목 번호'], ['%tky', '변환 키 (transactional key) — 키 필드 묶음'], ['%msg', '메시지 객체 (new_message_with_text)']],
    outDesc: '시나리오 결과 줄과 테이블 내용을 출력합니다(채점기 출력).', tests: sdRapTests('val'), sol: SD_RAP_VAL_SOL },
  { id: 6143, lv: 4, kind: 'rap', title: 'RAP 결정 — 품목 금액 계산 (DETERMINATION)', checkDb: ['zsd_so_h', 'zsd_so_i'], inputs: [], tables: ['zsd_so_h', 'zsd_so_i'],
    bo: SD_BO({ item: { determinations: [{ n: 'calcnetwr', on: ['create', 'field kwmeng', 'field netpr'], when: 'modify' }] } }),
    body: '품목이 생성되거나 수량·단가가 바뀌면 품목 금액을 자동 계산하세요.\n· 핸들러 클래스 lhc_item 에\n  METHODS calcnetwr FOR DETERMINE ON MODIFY IMPORTING keys FOR item~calcnetwr.\n· READ ENTITIES … IN LOCAL MODE 로 KWMENG, NETPR 을 읽고\n  MODIFY ENTITIES … IN LOCAL MODE ENTITY item UPDATE FIELDS ( netwr ) 로 NETWR = KWMENG × NETPR 을 넣습니다.\n· 트리거에 없는 필드(예: MATNR)만 바뀌면 결정은 실행되지 않습니다.\n\n행동 정의(BDEF)\n' + SD_BDEF({ item: '\n  determination calcnetwr on modify { create; field kwmeng, netpr; }' }) + SD_RAP_NOTE,
    fields: [['zsd_so_i-netpr', '단가'], ['zsd_so_i-netwr', '품목 금액 (= 수량 × 단가)'], ['zsd_so_i-kwmeng', '주문 수량']],
    outDesc: '시나리오 결과 줄과 테이블 내용을 출력합니다(채점기 출력).', tests: sdRapTests('det'), sol: SD_RAP_DET_SOL },
  { id: 6144, lv: 4, kind: 'rap', title: 'RAP 액션 — 판매오더 승인 (ACTION + RESULT)', checkDb: ['zsd_so_h', 'zsd_so_i'], inputs: [], tables: ['zsd_so_h', 'zsd_so_i'],
    bo: SD_BO({ order: { actions: [{ n: 'approve', result: true }] } }),
    body: '판매오더 승인 액션 approve 를 구현하세요.\n· 핸들러 클래스 lhc_order 에\n  METHODS approve FOR MODIFY IMPORTING keys FOR ACTION order~approve RESULT result.\n· 상태 STATUS 가 \'N\'(신규)인 오더만 \'A\'(승인)로 바꿉니다(MODIFY ENTITIES … IN LOCAL MODE).\n· 그 밖의 상태면 failed-order 에 %tky, reported-order 에 %tky 와 %msg(error, \'승인할 수 없는 상태입니다\')를 넣습니다.\n· 승인한 오더를 다시 읽어 result 에 %tky 와 %param(오더 전체 필드)을 채웁니다.\n\n행동 정의(BDEF)\n' + SD_BDEF({ order: '\n  action approve result [1] $self;' }) + SD_RAP_NOTE,
    fields: [['zsd_so_h-status', '오더 상태 (N 신규, A 승인, X 거부)'], ['%param', '액션 결과 행 (엔티티 전체 필드)'], ['failed / reported', '응답 구조 — 엔티티별 실패 키와 메시지']],
    outDesc: '시나리오 결과 줄과 테이블 내용을 출력합니다(채점기 출력).', tests: sdRapTests('act'), sol: SD_RAP_ACT_SOL }
]);

// ======================= 4차: 표준 조회 리포트 (PGM) =======================
const sdIn = (v, rs) => { rs = rs || []; const ok = r => r[1] === 'BT' ? v >= r[2] && v <= r[3] : r[1] === 'NE' ? v !== r[2] : v === r[2]; const inc = rs.filter(r => r[0] === 'I'), exc = rs.filter(r => r[0] === 'E'); return (!inc.length || inc.some(ok)) && !exc.some(ok); };
const SD4_LIKP = [...SD_LIKP, ['80005', 'LF', '20261018', '1000', 'C100', '20261020', '20261020']];
const SD4_LIPS = [['80001', '10', '20001', '10', 10, 'M1', '1000', '0001'], ['80001', '20', '20001', '20', 5, 'M2', '1000', '0001'], ['80002', '10', '20002', '10', 12, 'M3', '1000', '0001'],
  ['80003', '10', '20002', '10', 5, 'M3', '1000', '0002'], ['80004', '10', '20004', '10', 6, 'M2', '2000', '0001'], ['80005', '10', '20003', '20', 4, 'M4', '1000', '0001']];
const SD4_VBUP = [['20001', '10', 'C', 'C', 'C'], ['20001', '20', 'C', 'C', 'C'], ['20002', '10', 'B', 'A', 'B'], ['20003', '10', 'A', 'A', 'A'], ['20003', '20', 'B', 'A', 'B'], ['20004', '10', 'C', 'C', 'C'], ['20005', '10', 'C', 'C', 'C']];
const SD4_DB = () => ({ vbak: SD_VBAK, vbap: SD_VBAP, kna1: SD_KNA1, likp: SD4_LIKP, lips: SD4_LIPS, vbup: SD4_VBUP, vbrk: SD_VBRK, vbrp: SD_VBRP });

addMod('sd', [
  { id: 7113, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '판매오더 현황 (VA05)',
    body: 'SAP 표준 VA05(판매오더 리스트)처럼 판매오더를 품목 단위로 조회하는 리포트를 만드세요.\n· VBAK(헤더) – VBAP(품목) – KNA1(고객명) 을 JOIN 합니다.\n· 선택 화면: 오더일 s_erdat, 판매처 s_kunnr (비어 있으면 전체), 체크박스 p_ret — 체크하지 않으면 반품 오더(AUART = \'RE\')는 빼고, 체크하면 포함합니다.\n· 오더번호·품목 순으로 "오더 오더일 고객 고객명 품목 자재 수량 금액" 을 한 줄씩 출력합니다.\n· 마지막 줄에 "TOTAL 품목수 금액합계". 데이터가 없으면 NO DATA.',
    tables: ['vbak', 'vbap', 'kna1'],
    sel: [{ n: 'p_ret', kind: 'p', decl: 'AS CHECKBOX', label: '반품 포함' }, { n: 's_erdat', kind: 's', decl: 'FOR vbak-erdat', label: '오더일' }, { n: 's_kunnr', kind: 's', decl: 'FOR vbak-kunnr', label: '판매처' }],
    fields: [['vbak-erdat', '오더 생성일'], ['vbak-auart', '판매문서 유형 (OR 표준, RE 반품)'], ['vbap-kwmeng', '주문 수량'], ['vbap-netwr', '품목 순액'], ['kna1-name1', '고객명']],
    outDesc: '품목마다 "오더 오더일 고객 고객명 품목 자재 수량 금액", 마지막 줄 "TOTAL 품목수 금액합계" (없으면 NO DATA).',
    tests: [{ p_ret: '', s_erdat: [], s_kunnr: [] }, { p_ret: '', s_erdat: [['I', 'BT', '20261003', '20261010']], s_kunnr: [] }, { p_ret: 'X', s_erdat: [], s_kunnr: [['I', 'EQ', 'C200']] },
      { p_ret: '', s_erdat: [], s_kunnr: [['E', 'EQ', 'C100']] }, { p_ret: 'X', s_erdat: [], s_kunnr: [['I', 'EQ', 'C400']] }].map(x => ({ ...x, db: SD4_DB() })),
    ref: ({ p_ret, s_erdat, s_kunnr, db }) => {
      const rows = [];
      for (const h of db.vbak) { if (!sdIn(h[1], s_erdat) || !sdIn(h[3], s_kunnr) || (p_ret !== 'X' && h[2] === 'RE')) continue; const c = db.kna1.find(k => k[0] === h[3]); if (!c) continue; for (const i of db.vbap.filter(i => i[0] === h[0])) rows.push([h[0], h[1], h[3], c[1], i[1], i[2], i[3], i[4]]); }
      rows.sort((a, b) => sdBy(a[0] + a[4], b[0] + b[4]));
      return rows.length ? [...rows.map(r => r.join(' ')), `TOTAL ${rows.length} ${rows.reduce((s, r) => s + r[7], 0)}`].join('\n') : 'NO DATA';
    },
    sol: "REPORT z_sd_va05.\n\nPARAMETERS p_ret AS CHECKBOX.\nSELECT-OPTIONS: s_erdat FOR vbak-erdat,\n                s_kunnr FOR vbak-kunnr.\n\nSTART-OF-SELECTION.\n  SELECT h~vbeln, h~erdat, h~kunnr, c~name1, i~posnr, i~matnr, i~kwmeng, i~netwr, h~auart\n    FROM vbak AS h\n    INNER JOIN vbap AS i ON i~vbeln = h~vbeln\n    INNER JOIN kna1 AS c ON c~kunnr = h~kunnr\n    WHERE h~erdat IN @s_erdat\n      AND h~kunnr IN @s_kunnr\n    ORDER BY h~vbeln, i~posnr\n    INTO TABLE @DATA(gt_itab).\n\n  IF p_ret <> 'X'.\n    DELETE gt_itab WHERE auart = 'RE'.\n  ENDIF.\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA lv_sum TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-vbeln, gs_itab-erdat, gs_itab-kunnr, gs_itab-name1,\n             gs_itab-posnr, gs_itab-matnr, gs_itab-kwmeng, gs_itab-netwr.\n    lv_sum = lv_sum + gs_itab-netwr.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lines( gt_itab ), lv_sum." },

  { id: 7114, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '미결(미납) 판매오더 (VL10 / VA05 미결)',
    body: 'SAP 표준 VL10 납품 대상·미결 오더 조회처럼, 아직 다 납품되지 않은 판매오더 품목을 찾는 리포트를 만드세요.\n· 품목별 납품 수량 = LIPS 에서 참조 오더 VGBEL·VGPOS 가 같은 LFIMG 의 합 (납품이 없으면 0).\n· 미결 수량 = 주문 수량(VBAP-KWMENG) − 납품 수량.\n· VBUP 의 납품 상태 LFSTA 가 \'C\'(완료)인 품목과 미결 수량이 0 이하인 품목은 뺍니다. (C 는 수량이 남아도 \'마감\' 처리된 품목입니다)\n· 선택 화면: 판매처 s_kunnr, 오더 s_vbeln.\n· 오더·품목 순으로 "오더 품목 자재 주문 납품 미결", 마지막 줄 "OPEN 건수 미결합계". 없으면 NO DATA.\n· WITH 로 납품 합계를 먼저 만들고 LEFT OUTER JOIN 해 보세요.',
    tables: ['vbak', 'vbap', 'vbup', 'lips'],
    sel: [{ n: 's_kunnr', kind: 's', decl: 'FOR vbak-kunnr', label: '판매처' }, { n: 's_vbeln', kind: 's', decl: 'FOR vbak-vbeln', label: '판매오더' }],
    fields: [['lips-vgbel', '참조 문서(판매오더 번호)'], ['lips-vgpos', '참조 품목'], ['lips-lfimg', '납품 수량'], ['vbup-lfsta', '품목 납품 상태 (A 미처리, B 부분, C 완료)'], ['vbap-kwmeng', '주문 수량']],
    outDesc: '미결 품목마다 "오더 품목 자재 주문 납품 미결", 마지막 줄 "OPEN 건수 미결합계" (없으면 NO DATA).',
    tests: [{ s_kunnr: [], s_vbeln: [] }, { s_kunnr: [['I', 'EQ', 'C100']], s_vbeln: [] }, { s_kunnr: [], s_vbeln: [['I', 'EQ', '20004']] }, { s_kunnr: [['I', 'EQ', 'C200']], s_vbeln: [] }].map(x => ({ ...x, db: SD4_DB() })),
    ref: ({ s_kunnr, s_vbeln, db }) => {
      const rows = [];
      for (const h of db.vbak) { if (!sdIn(h[3], s_kunnr) || !sdIn(h[0], s_vbeln)) continue;
        for (const i of db.vbap.filter(i => i[0] === h[0])) { const st = db.vbup.find(u => u[0] === i[0] && u[1] === i[1]); if (!st || st[2] === 'C') continue; const dl = db.lips.filter(l => l[2] === i[0] && l[3] === i[1]).reduce((s, l) => s + l[4], 0); const op = i[3] - dl; if (op <= 0) continue; rows.push([i[0], i[1], i[2], i[3], dl, op]); } }
      rows.sort((a, b) => sdBy(a[0] + a[1], b[0] + b[1]));
      return rows.length ? [...rows.map(r => r.join(' ')), `OPEN ${rows.length} ${rows.reduce((s, r) => s + r[5], 0)}`].join('\n') : 'NO DATA';
    },
    sol: "REPORT z_sd_open_orders.\n\nSELECT-OPTIONS: s_kunnr FOR vbak-kunnr,\n                s_vbeln FOR vbak-vbeln.\n\nSTART-OF-SELECTION.\n  WITH +dlv AS ( SELECT vgbel, vgpos, SUM( lfimg ) AS qty\n                   FROM lips\n                   GROUP BY vgbel, vgpos )\n  SELECT i~vbeln, i~posnr, i~matnr, i~kwmeng, d~qty\n    FROM vbak AS h\n    INNER JOIN vbap AS i ON i~vbeln = h~vbeln\n    INNER JOIN vbup AS u ON u~vbeln = i~vbeln AND u~posnr = i~posnr\n    LEFT OUTER JOIN +dlv AS d ON d~vgbel = i~vbeln AND d~vgpos = i~posnr\n    WHERE h~kunnr IN @s_kunnr\n      AND h~vbeln IN @s_vbeln\n      AND u~lfsta <> 'C'\n    ORDER BY i~vbeln, i~posnr\n    INTO TABLE @DATA(gt_itab).\n\n  DATA: lv_cnt  TYPE i,\n        lv_open TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(lv_rest) = gs_itab-kwmeng - gs_itab-qty.\n    CHECK lv_rest > 0.\n    WRITE: / gs_itab-vbeln, gs_itab-posnr, gs_itab-matnr, gs_itab-kwmeng, gs_itab-qty, lv_rest.\n    lv_cnt = lv_cnt + 1.\n    lv_open = lv_open + lv_rest.\n  ENDLOOP.\n  IF lv_cnt = 0.\n    WRITE 'NO DATA'.\n  ELSE.\n    WRITE: / 'OPEN', lv_cnt, lv_open.\n  ENDIF." },

  { id: 7115, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '출고 내역 (VL06O 출고 완료 납품)',
    body: 'SAP 표준 VL06O(출고 모니터)의 \'출고 완료 납품 조회\'처럼 실제 출고(PGI)된 납품 품목을 조회하는 리포트를 만드세요.\n· LIKP(납품 헤더)와 LIPS(납품 품목)를 JOIN 합니다.\n· 실제 출고일 WADAT_IST 가 s_wadat 범위 안이어야 하고, 아직 출고되지 않은 납품(WADAT_IST = \'00000000\')은 범위가 비어 있어도 빼야 합니다.\n· 선택 화면: 실제 출고일 s_wadat, 납품처 s_kunnr.\n· 납품·품목 순으로 "납품 출고일 고객 품목 자재 수량 플랜트", 마지막 줄 "TOTAL 품목수 수량합계". 없으면 NO DATA.',
    tables: ['likp', 'lips'],
    sel: [{ n: 's_wadat', kind: 's', decl: 'FOR likp-wadat_ist', label: '실제 출고일' }, { n: 's_kunnr', kind: 's', decl: 'FOR likp-kunnr', label: '납품처' }],
    fields: [['likp-wadat_ist', '실제 출고(PGI)일 — 미출고면 00000000'], ['likp-lfdat', '납품 예정일'], ['lips-lfimg', '납품 수량'], ['lips-werks', '출하 플랜트'], ['lips-vgbel', '참조 판매오더']],
    outDesc: '품목마다 "납품 출고일 고객 품목 자재 수량 플랜트", 마지막 줄 "TOTAL 품목수 수량합계" (없으면 NO DATA).',
    tests: [{ s_wadat: [], s_kunnr: [] }, { s_wadat: [['I', 'BT', '20261007', '20261015']], s_kunnr: [] }, { s_wadat: [], s_kunnr: [['I', 'EQ', 'C200']] }, { s_wadat: [['I', 'EQ', '20261001']], s_kunnr: [] }].map(x => ({ ...x, db: SD4_DB() })),
    ref: ({ s_wadat, s_kunnr, db }) => {
      const rows = [];
      for (const h of db.likp) { if (h[6] === '00000000' || !sdIn(h[6], s_wadat) || !sdIn(h[4], s_kunnr)) continue; for (const i of db.lips.filter(i => i[0] === h[0])) rows.push([h[0], h[6], h[4], i[1], i[5], i[4], i[6]]); }
      rows.sort((a, b) => sdBy(a[0] + a[3], b[0] + b[3]));
      return rows.length ? [...rows.map(r => r.join(' ')), `TOTAL ${rows.length} ${rows.reduce((s, r) => s + r[5], 0)}`].join('\n') : 'NO DATA';
    },
    sol: "REPORT z_sd_vl06o_gi.\n\nSELECT-OPTIONS: s_wadat FOR likp-wadat_ist,\n                s_kunnr FOR likp-kunnr.\n\nSTART-OF-SELECTION.\n  SELECT h~vbeln, h~wadat_ist, h~kunnr, i~posnr, i~matnr, i~lfimg, i~werks\n    FROM likp AS h\n    INNER JOIN lips AS i ON i~vbeln = h~vbeln\n    WHERE h~wadat_ist IN @s_wadat\n      AND h~wadat_ist <> '00000000'\n      AND h~kunnr IN @s_kunnr\n    ORDER BY h~vbeln, i~posnr\n    INTO TABLE @DATA(gt_itab).\n\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  DATA lv_qty TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-vbeln, gs_itab-wadat_ist, gs_itab-kunnr, gs_itab-posnr,\n             gs_itab-matnr, gs_itab-lfimg, gs_itab-werks.\n    lv_qty = lv_qty + gs_itab-lfimg.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lines( gt_itab ), lv_qty." },

  { id: 7116, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '대금청구 내역 (VF05)',
    body: 'SAP 표준 VF05(대금청구 문서 리스트)처럼 청구 문서를 조회하는 리포트를 만드세요.\n· VBRK(청구 헤더)를 읽고, 문서마다 VBRP 품목 수를 함께 보여 줍니다(WITH 로 품목 수를 세어 JOIN 해 보세요).\n· 취소된 청구(FKSTO = \'X\')는 뺍니다.\n· 대변메모(FKART = \'G2\')는 매출을 줄이므로 순액·세액을 음수로 표시하고 합계에도 음수로 더합니다.\n· 선택 화면: 청구일 s_fkdat, 지급인 s_kunag.\n· 청구문서 순으로 "문서 유형 청구일 지급인 품목수 순액 세액", 마지막 줄 "TOTAL 문서수 순액합계 세액합계". 없으면 NO DATA.',
    tables: ['vbrk', 'vbrp'],
    sel: [{ n: 's_fkdat', kind: 's', decl: 'FOR vbrk-fkdat', label: '청구일' }, { n: 's_kunag', kind: 's', decl: 'FOR vbrk-kunag', label: '지급인' }],
    fields: [['vbrk-fkart', '청구 유형 (F2 송장, G2 대변메모)'], ['vbrk-fkdat', '청구일'], ['vbrk-kunag', '지급인(판매처)'], ['vbrk-netwr', '순액'], ['vbrk-mwsbk', '세액'], ['vbrk-fksto', '취소 표시 (X = 취소됨)']],
    outDesc: '문서마다 "문서 유형 청구일 지급인 품목수 순액 세액", 마지막 줄 "TOTAL 문서수 순액합계 세액합계" (없으면 NO DATA).',
    tests: [{ s_fkdat: [], s_kunag: [] }, { s_fkdat: [], s_kunag: [['I', 'EQ', 'C200']] }, { s_fkdat: [['I', 'BT', '20261018', '20261031']], s_kunag: [] }, { s_fkdat: [], s_kunag: [['I', 'EQ', 'C300']] }].map(x => ({ ...x, db: SD4_DB() })),
    ref: ({ s_fkdat, s_kunag, db }) => {
      const rows = [];
      for (const h of db.vbrk) { if (h[8] === 'X' || !sdIn(h[2], s_fkdat) || !sdIn(h[3], s_kunag)) continue; const n = db.vbrp.filter(i => i[0] === h[0]).length; if (!n) continue; const sg = h[1] === 'G2' ? -1 : 1; rows.push([h[0], h[1], h[2], h[3], n, sg * h[5], sg * h[6]]); }
      rows.sort((a, b) => sdBy(a[0], b[0]));
      return rows.length ? [...rows.map(r => r.join(' ')), `TOTAL ${rows.length} ${rows.reduce((s, r) => s + r[5], 0)} ${rows.reduce((s, r) => s + r[6], 0)}`].join('\n') : 'NO DATA';
    },
    sol: "REPORT z_sd_vf05.\n\nSELECT-OPTIONS: s_fkdat FOR vbrk-fkdat,\n                s_kunag FOR vbrk-kunag.\n\nSTART-OF-SELECTION.\n  WITH +cnt AS ( SELECT vbeln, COUNT(*) AS items\n                   FROM vbrp\n                   GROUP BY vbeln )\n  SELECT k~vbeln, k~fkart, k~fkdat, k~kunag, c~items, k~netwr, k~mwsbk\n    FROM vbrk AS k\n    INNER JOIN +cnt AS c ON c~vbeln = k~vbeln\n    WHERE k~fkdat IN @s_fkdat\n      AND k~kunag IN @s_kunag\n      AND k~fksto <> 'X'\n    ORDER BY k~vbeln\n    INTO TABLE @DATA(gt_itab).\n\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  DATA: lv_net TYPE i,\n        lv_tax TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    IF gs_itab-fkart = 'G2'.\n      gs_itab-netwr = - gs_itab-netwr.\n      gs_itab-mwsbk = - gs_itab-mwsbk.\n    ENDIF.\n    WRITE: / gs_itab-vbeln, gs_itab-fkart, gs_itab-fkdat, gs_itab-kunag,\n             gs_itab-items, gs_itab-netwr, gs_itab-mwsbk.\n    lv_net = lv_net + gs_itab-netwr.\n    lv_tax = lv_tax + gs_itab-mwsbk.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lines( gt_itab ), lv_net, lv_tax." }
]);

// ===== MM 모듈 (구매·재고) =====
const MM_MARC_D = [['M1', '1000', '001', 100, 20, 50], ['M2', '1000', '001', 30, 10, 0], ['M3', '1000', '002', 5, 2, 10], ['M4', '1000', '001', 10, 0, 5], ['M1', '2000', '001', 50, 10, 20]];
const MM_MARD_2 = [['M1', '1000', '0001', 50, 5], ['M1', '2000', '0001', 30, 0], ['M1', '2000', '0002', 0, 3]];
const mmReorder = ({ p_werks, db }) => {
  const o = db.marc.filter(r => r[1] === p_werks).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([m, , , minbe, , bstrf]) => {
    const st = db.mard.filter(x => x[0] === m && x[1] === p_werks).reduce((s, x) => s + x[3], 0);
    if (st >= minbe) return null;
    const need = minbe - st; const ord = bstrf > 0 ? Math.ceil(need / bstrf) * bstrf : need;
    return `${m} ${st} ${minbe} ${ord}`;
  }).filter(Boolean);
  return o.length ? o.join('\n') : 'NO REORDER';
};
const mmPost = (labst, rows) => { const o = rows.map(([bw, q]) => { const s = bw === '101' ? 1 : ['102', '201', '261'].includes(bw) ? -1 : 0; if (!s || labst + s * q < 0) return `${bw} ${q} REJECT`; labst += s * q; return `${bw} ${q} OK`; }); o.push(`LABST ${labst}`); return o.join('\n'); };

  { id: 6214, lv: 1, kind: 'rpt', noTmplSel: true, title: '재주문점 점검 선택 화면',
    body: '선택 화면에서 재고와 기준값을 받아 자재 상태를 알려 주세요.\n· p_labst (TYPE mard-labst): 가용 재고\n· p_minbe (TYPE marc-minbe): 재주문점\n· p_eisbe (TYPE marc-eisbe): 안전 재고\n· AT SELECTION-SCREEN 에서 셋 중 하나라도 0보다 작으면 MESSAGE \'INVALID QTY\' TYPE \'E\'\n· 재고가 안전 재고보다 적으면 URGENT, 재주문점 이하이면 REORDER, 그 밖에는 OK 를 출력합니다.',
    fields: [['mard-labst', '가용 재고'], ['marc-minbe', '재주문점'], ['marc-eisbe', '안전 재고']],
    tables: [], sel: [{ n: 'p_labst', kind: 'p', decl: 'TYPE mard-labst', label: '가용 재고' }, { n: 'p_minbe', kind: 'p', decl: 'TYPE marc-minbe', label: '재주문점' }, { n: 'p_eisbe', kind: 'p', decl: 'TYPE marc-eisbe', label: '안전 재고' }],
    tests: [[50, 30, 10], [30, 30, 10], [5, 30, 10], [10, 30, 10], [-1, 30, 10], [100, 0, 0]].map(([p_labst, p_minbe, p_eisbe]) => ({ p_labst, p_minbe, p_eisbe })),

    sol: "REPORT z_mm_reorder_check.\n\nPARAMETERS: p_labst TYPE mard-labst,\n            p_minbe TYPE marc-minbe,\n            p_eisbe TYPE marc-eisbe.\n\nAT SELECTION-SCREEN.\n  IF p_labst < 0 OR p_minbe < 0 OR p_eisbe < 0.\n    MESSAGE 'INVALID QTY' TYPE 'E'.\n  ENDIF.\n\nSTART-OF-SELECTION.\n  IF p_labst < p_eisbe.\n    WRITE 'URGENT'.\n  ELSEIF p_labst <= p_minbe.\n    WRITE 'REORDER'.\n  ELSE.\n    WRITE 'OK'.\n  ENDIF." },

  reuse(5101, { id: 6222, lv: 2, title: '저장위치별 재고 (MARD)',

  { id: 6234, lv: 3, title: '재고 클래스와 이동 유형', must: ['lcl_stock'],
    body: '로컬 클래스 lcl_stock 으로 자재 이동을 처리하세요.\n· constructor: 시작 재고 iv_labst\n· post( iv_bwart, iv_menge ) RETURNING rv_ok: 이동 유형에 따라 재고를 바꿉니다.\n  101(입고) +, 102(입고 취소)·201(원가센터 출고)·261(생산오더 출고) −\n  모르는 이동 유형이거나 재고가 0보다 작아지면 바꾸지 않고 abap_false\n· get_labst( ) RETURNING rv_labst\n시작 재고 p_labst 로 객체를 만들고 이동 목록 gt_itab 을 차례로 처리하세요.\n이동마다 "이동유형 수량 OK" 또는 "이동유형 수량 REJECT", 마지막 줄에 "LABST 재고"를 출력합니다.',
    fields: [['mseg-bwart', '이동 유형'], ['mseg-menge', '수량'], ['mard-labst', '가용 재고']],
    structs: { ty_mseg: [{ n: 'bwart', t: 'string' }, { n: 'menge', t: 'i' }] },
    inputs: [{ n: 'p_labst', t: 'i' }, { n: 'gt_itab', t: 'itab', st: 'ty_mseg' }], inDesc: '0 ≤ p_labst ≤ 100,000 / gt_itab: 1~50행', outDesc: '이동마다 한 줄, 마지막에 재고를 출력합니다.',
    tests: [[100, [['101', 50], ['201', 120], ['261', 40], ['102', 10]]], [0, [['201', 1], ['101', 5], ['999', 3]]], [10, [['261', 10], ['101', 0]]]].map(([p_labst, gt_itab]) => ({ p_labst, gt_itab })),
    ref: ({ p_labst, gt_itab }) => mmPost(p_labst, gt_itab),
    sol: "CLASS lcl_stock DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_labst TYPE i,\n             post        IMPORTING iv_bwart TYPE string\n                                   iv_menge TYPE i\n                         RETURNING VALUE(rv_ok) TYPE abap_bool,\n             get_labst   RETURNING VALUE(rv_labst) TYPE i.\n  PRIVATE SECTION.\n    DATA mv_labst TYPE i.\nENDCLASS.\n\nCLASS lcl_stock IMPLEMENTATION.\n  METHOD constructor.\n    mv_labst = iv_labst.\n  ENDMETHOD.\n  METHOD post.\n    DATA lv_sign TYPE i.\n    CASE iv_bwart.\n      WHEN '101'.\n        lv_sign = 1.\n      WHEN '102' OR '201' OR '261'.\n        lv_sign = -1.\n      WHEN OTHERS.\n        rv_ok = abap_false.\n        RETURN.\n    ENDCASE.\n    IF mv_labst + lv_sign * iv_menge < 0.\n      rv_ok = abap_false.\n      RETURN.\n    ENDIF.\n    mv_labst = mv_labst + lv_sign * iv_menge.\n    rv_ok = abap_true.\n  ENDMETHOD.\n  METHOD get_labst.\n    rv_labst = mv_labst.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA(go_stock) = NEW lcl_stock( p_labst ).\n  LOOP AT gt_itab INTO DATA(gs_mseg).\n    IF go_stock->post( iv_bwart = gs_mseg-bwart iv_menge = gs_mseg-menge ) = abap_true.\n      WRITE: / gs_mseg-bwart, gs_mseg-menge, 'OK'.\n    ELSE.\n      WRITE: / gs_mseg-bwart, gs_mseg-menge, 'REJECT'.\n    ENDIF.\n  ENDLOOP.\n  WRITE: / 'LABST', go_stock->get_labst( )." },

  { id: 6244, lv: 4, kind: 'rpt', title: 'MRP 재주문 리포트 (MARC + MARD)',
    body: '플랜트 p_werks 에서 재고가 재주문점 아래로 떨어진 자재와 발주 수량을 보여 주는 리포트를 만드세요.\n· MARC 에서 그 플랜트의 자재(재주문점 minbe, 반올림값 bstrf)를 읽습니다.\n· 자재 재고 = MARD 에서 같은 자재·플랜트의 가용 재고(labst) 합계 (행이 없으면 0)\n· 재고 < 재주문점 이면 부족량 = 재주문점 − 재고, 발주 수량 = 부족량을 bstrf 의 배수로 올림 (bstrf 가 0이면 부족량 그대로)\n· 자재 순으로 "자재 재고 재주문점 발주수량"을 출력합니다. 발주할 자재가 없으면 NO REORDER.',
    fields: [['marc-minbe', '재주문점'], ['marc-bstrf', '반올림값'], ['marc-dispo', 'MRP 관리자'], ['mard-labst', '가용 재고']],
    tables: ['marc', 'mard'], sel: [{ n: 'p_werks', kind: 'p', decl: 'TYPE werks_d', label: '플랜트' }],
    tests: [{ p_werks: '1000', db: { marc: MM_MARC_D, mard: MARD_D } }, { p_werks: '2000', db: { marc: MM_MARC_D, mard: MM_MARD_2 } }, { p_werks: '2000', db: { marc: MM_MARC_D, mard: MARD_D } }, { p_werks: '9000', db: { marc: MM_MARC_D, mard: MARD_D } }],
    ref: mmReorder,
    sol: "REPORT z_mm_mrp_reorder.\n\nPARAMETERS p_werks TYPE werks_d.\n\nSTART-OF-SELECTION.\n  SELECT matnr, minbe, bstrf\n    FROM marc\n    WHERE werks = @p_werks\n    ORDER BY matnr\n    INTO TABLE @DATA(gt_marc).\n  SELECT matnr, labst\n    FROM mard\n    WHERE werks = @p_werks\n    INTO TABLE @DATA(gt_mard).\n\n  DATA: lv_stock TYPE i,\n        lv_order TYPE i,\n        lv_cnt   TYPE i.\n  LOOP AT gt_marc INTO DATA(gs_marc).\n    lv_stock = 0.\n    LOOP AT gt_mard INTO DATA(gs_mard) WHERE matnr = gs_marc-matnr.\n      lv_stock = lv_stock + gs_mard-labst.\n    ENDLOOP.\n    IF lv_stock < gs_marc-minbe.\n      lv_order = gs_marc-minbe - lv_stock.\n      IF gs_marc-bstrf > 0.\n        lv_order = ( lv_order + gs_marc-bstrf - 1 ) DIV gs_marc-bstrf * gs_marc-bstrf.\n      ENDIF.\n      WRITE: / gs_marc-matnr, lv_stock, gs_marc-minbe, lv_order.\n      lv_cnt = lv_cnt + 1.\n    ENDIF.\n  ENDLOOP.\n  IF lv_cnt = 0.\n    WRITE 'NO REORDER'.\n  ENDIF." },

addMod('mm', [
  // ---------- Lv.1 ----------
  { id: 6213, lv: 1, title: '송장 3-way match 판정',
    body: '송장검증(MIRO)에서는 구매오더·입고·송장 세 가지를 맞춰 봅니다(3-way match).\n구매오더 수량 menge, 구매오더 단가 netpr, 입고 수량 wemng, 송장 수량 re_menge, 송장 금액 wrbtr 가 주어집니다. 아래 순서로 판정해 출력하세요.\n1) 입고 수량이 구매오더 수량보다 많으면 GR OVER\n2) 송장 수량이 입고 수량보다 많으면 QTY BLOCK\n3) 송장 금액이 송장 수량 × 구매오더 단가보다 크면 "PRICE BLOCK 차액" (차액 = 송장 금액 − 송장 수량 × 단가)\n4) 모두 아니면 OK',
    fields: [['ekpo-menge', '구매오더 수량'], ['ekpo-netpr', '구매오더 단가'], ['eket-wemng', '입고된 수량'], ['rseg-menge', '송장 수량'], ['rseg-wrbtr', '송장 금액']],
    inputs: [{ n: 'menge', t: 'i' }, { n: 'netpr', t: 'i' }, { n: 'wemng', t: 'i' }, { n: 're_menge', t: 'i' }, { n: 'wrbtr', t: 'i' }],
    inDesc: '0 ≤ 모든 값 ≤ 1,000,000', outDesc: 'GR OVER, QTY BLOCK, "PRICE BLOCK 차액", OK 중 하나를 출력합니다.',
    tests: [[100, 50, 80, 80, 4000], [40, 20, 40, 40, 880], [30, 40, 10, 12, 480], [10, 300, 10, 10, 2900], [10, 100, 12, 10, 1000], [5, 1000, 5, 5, 5000]].map(([menge, netpr, wemng, re_menge, wrbtr]) => ({ menge, netpr, wemng, re_menge, wrbtr })),
    ref: ({ menge, netpr, wemng, re_menge, wrbtr }) => wemng > menge ? 'GR OVER' : re_menge > wemng ? 'QTY BLOCK' : wrbtr > re_menge * netpr ? `PRICE BLOCK ${wrbtr - re_menge * netpr}` : 'OK',
    sol: "DATA lv_diff TYPE i.\nIF wemng > menge.\n  WRITE 'GR OVER'.\nELSEIF re_menge > wemng.\n  WRITE 'QTY BLOCK'.\nELSEIF wrbtr > re_menge * netpr.\n  lv_diff = wrbtr - re_menge * netpr.\n  WRITE: 'PRICE BLOCK', lv_diff.\nELSE.\n  WRITE 'OK'.\nENDIF." },

  // ---------- Lv.2 ----------
  { id: 6221, lv: 2, kind: 'rpt', title: '구매정보레코드 단가 비교 (EINA + EINE)',
    body: '자재 p_matnr 를 구매조직 p_ekorg 에서 살 수 있는 업체와 단가를 구매정보레코드에서 찾으세요.\n· EINA(자재·업체)와 EINE(구매조직별 단가)를 infnr 로 INNER JOIN 합니다.\n· 업체코드 순으로 "업체 netpr peinh aplfz"를 출력합니다.\n· 마지막 줄에 "BEST 업체" — 1개당 단가(netpr ÷ peinh)가 가장 낮은 업체, 같으면 업체코드가 앞선 업체\n· 정보레코드가 없으면 NO INFO RECORD',
    fields: [['eina-infnr', '구매정보레코드 번호'], ['eina-lifnr', '공급업체'], ['eine-ekorg', '구매조직'], ['eine-netpr', '정보레코드 단가'], ['eine-peinh', '가격 단위(이 수량당 단가)'], ['eine-aplfz', '계획 납품 소요일']],
    tables: ['eina', 'eine'], sel: [{ n: 'p_matnr', kind: 'p', decl: 'TYPE matnr', label: '자재' }, { n: 'p_ekorg', kind: 'p', decl: 'TYPE eine-ekorg', label: '구매조직' }],
    tests: [['M1', '1000'], ['M3', '2000'], ['M9', '1000'], ['M2', '1000']].map(([p_matnr, p_ekorg]) => ({ p_matnr, p_ekorg, db: { eina: MM_EINA, eine: MM_EINE } }))
      .concat([{ p_matnr: 'M1', p_ekorg: '1000', db: { eina: MM_EINA, eine: MM_EINE.map(r => r[0] === '53001' ? ['53001', '1000', '1000', 480, 10, 7] : r) } }]),
    ref: ({ p_matnr, p_ekorg, db }) => {
      const r = db.eina.filter(a => a[1] === p_matnr).flatMap(a => db.eine.filter(e => e[0] === a[0] && e[1] === p_ekorg).map(e => [a[2], e[3], e[4], e[5]])).sort(mmCmp(0));
      if (!r.length) return 'NO INFO RECORD';
      let b = null; for (const x of r) if (!b || x[1] * b[2] < b[1] * x[2]) b = x;
      return [...r.map(x => x.join(' ')), `BEST ${b[0]}`].join('\n'); },
    sol: "REPORT z_mm_inforecord.\n\nPARAMETERS: p_matnr TYPE matnr,\n            p_ekorg TYPE eine-ekorg.\n\nSTART-OF-SELECTION.\n  SELECT a~lifnr, b~netpr, b~peinh, b~aplfz\n    FROM eina AS a\n    INNER JOIN eine AS b ON a~infnr = b~infnr\n    WHERE a~matnr = @p_matnr\n      AND b~ekorg = @p_ekorg\n    ORDER BY a~lifnr\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO INFO RECORD'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_best TYPE string,\n        lv_bp   TYPE i,\n        lv_bq   TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-lifnr, gs_itab-netpr, gs_itab-peinh, gs_itab-aplfz.\n    \" 1개당 단가 비교: netpr / peinh 대신 교차 곱으로 비교\n    IF lv_best IS INITIAL OR gs_itab-netpr * lv_bq < lv_bp * gs_itab-peinh.\n      lv_best = gs_itab-lifnr.\n      lv_bp   = gs_itab-netpr.\n      lv_bq   = gs_itab-peinh.\n    ENDIF.\n  ENDLOOP.\n  WRITE: / 'BEST', lv_best." },
  { id: 6224, lv: 2, kind: 'rpt', title: '미결 구매요청 목록 (EBAN)',
    body: '플랜트 p_werks 의 구매요청(EBAN) 중 아직 구매오더로 바뀌지 않은 미결 요청을 보여 주세요.\n· 승인 완료(frgkz = \'2\'), 구매오더 번호(ebeln)가 비어 있음, 삭제 표시(loekz)가 비어 있음\n· 자재는 s_matnr 범위로 거릅니다.\n· 요청번호·품목 순으로 "banfn bnfpo matnr menge lfdat"를 출력하고, 마지막 줄에 "COUNT 건수"\n· 없으면 NO OPEN PR',
    fields: [['eban-banfn', '구매요청 번호'], ['eban-bnfpo', '구매요청 품목'], ['eban-frgkz', '승인(릴리스) 표시'], ['eban-lfdat', '희망 납품일'], ['eban-ebeln', '전환된 구매오더 번호'], ['eban-loekz', '삭제 표시']],
    tables: ['eban'], sel: [{ n: 'p_werks', kind: 'p', decl: 'TYPE werks_d', label: '플랜트' }, { n: 's_matnr', kind: 's', decl: 'FOR eban-matnr', label: '자재' }],
    tests: [['1000', []], ['1000', [['I', 'EQ', 'M2', '']]], ['1000', [['E', 'EQ', 'M2', '']]], ['2000', []], ['3000', []]].map(([p_werks, s_matnr]) => ({ p_werks, s_matnr, db: { eban: MM_EBAN } })),
    ref: ({ p_werks, s_matnr, db }) => {

      return r.length ? [...r.map(x => `${x[0]} ${x[1]} ${x[3]} ${x[5]} ${x[8]}`), `COUNT ${r.length}`].join('\n') : 'NO OPEN PR'; },
    sol: "REPORT z_mm_open_pr.\n\nPARAMETERS p_werks TYPE werks_d.\nSELECT-OPTIONS s_matnr FOR eban-matnr.\n\nSTART-OF-SELECTION.\n  SELECT banfn, bnfpo, matnr, menge, lfdat\n    FROM eban\n    WHERE werks = @p_werks\n      AND matnr IN @s_matnr\n      AND frgkz = '2'\n      AND ebeln = ''\n      AND loekz = ''\n    ORDER BY banfn, bnfpo\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO OPEN PR'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-banfn, gs_itab-bnfpo, gs_itab-matnr, gs_itab-menge, gs_itab-lfdat.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." },

  { id: 6231, lv: 3, kind: 'rpt', title: '송장 ALV 핫스팟 (RBKP → RSEG)', must: ['cl_gui_alv_grid', 'hotspot_click'],
    body: '송장 헤더(RBKP)를 CL_GUI_ALV_GRID 로 보여 주고, 송장번호를 클릭(핫스팟)하면 그 송장의 품목(RSEG) 요약을 메시지로 보여 주세요.\n· ALV 열: BELNR(송장번호, hotspot = \'X\'), LIFNR(공급업체), RMWWR(총액), RBSTAT(상태) — 송장번호 순\n· hotspot_click 핸들러에서 e_row_id-index 로 행을 찾고, RSEG 에서 같은 belnr·gjahr 의 품목 수와 금액(wrbtr) 합계를 구합니다.\n· MESSAGE |송장번호 ITEMS 품목수 NET 금액합 TAX 세액(wmwst1)| TYPE \'I\'',
