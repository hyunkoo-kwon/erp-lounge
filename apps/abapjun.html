<body>
<div id="app"></div>
<script>
// ===== Mini ABAP interpreter (subset) =====
const LIMIT = 300000;
let CUR_L = 0;
class AErr extends Error { constructor(kind, msg, L) { super(msg); this.kind = kind; this.L = L; } }
const CE = (m, L) => new AErr('CE', m, L ?? CUR_L);
const RE = (m, L) => new AErr('RE', m, L ?? CUR_L);
const FLOW_EXIT = { f: 'exit' }, FLOW_CONT = { f: 'cont' }, FLOW_STOP = { f: 'stop' }, FLOW_LEAVE = { f: 'leave' };
const CLASSES = new Map();
const TYPES_REG = new Map();
const clone = x => JSON.parse(JSON.stringify(x));
const FNS = new Set(['line_exists', 'line_index', 'xsdbool', 'boolc', 'concat_lines_of', 'strlen','numofchar','lines','abs','sign','ceil','floor','trunc','frac','sqrt','round','ipow','nmax','nmin','reverse','to_upper','to_lower','condense','substring','repeat','find','count','replace']);

// ---------- Lexer ----------
function lex(src, L0 = 1, top = true) {
  const toks = [];
  const lines = src.replace(/\r/g, '').split('\n');
  const R = '(\\d+|[A-Za-z_][\\w-]*)';
  const reOff = new RegExp('^\\+' + R + '(?:\\(' + R + '\\))?');
  const reLen = new RegExp('^\\(' + R + '\\)');
  for (let li = 0; li < lines.length; li++) {
    const s = lines[li], L = L0 + li;
    if (top && s[0] === '*') continue;
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '"' && top) break;
      if (ch === "'" || ch === '`') {
        let j = i + 1, v = '';
        for (;;) {
          if (j >= s.length) throw CE('문자열 리터럴이 닫히지 않았습니다', L);
          if (s[j] === ch) { if (s[j + 1] === ch) { v += ch; j += 2; continue; } break; }
          v += s[j++];
        }
        toks.push({ t: 'str', v, c: ch === "'", L }); i = j + 1; continue;
      }
      if (ch === '|') {
        let j = i + 1, buf = ''; const parts = [];
        for (;;) {
          if (j >= s.length) throw CE('문자열 템플릿 |...| 이 닫히지 않았습니다', L);
          const c = s[j];
          if (c === '\\') { const n = s[j + 1]; buf += n === 'n' ? '\n' : n === 't' ? '\t' : n; j += 2; continue; }
          if (c === '{') {
            const k = s.indexOf('}', j);
            if (k < 0) throw CE('템플릿의 { } 가 닫히지 않았습니다', L);
            if (buf) { parts.push(buf); buf = ''; }
            const sub = lex(s.slice(j + 1, k), L, false);
            if (!sub.length) throw CE('템플릿 { } 안이 비어 있습니다', L);
            parts.push({ toks: sub }); j = k + 1; continue;
          }
          if (c === '|') break;
          buf += c; j++;
        }
        if (buf) parts.push(buf);
        toks.push({ t: 'tmpl', parts, L }); i = j + 1; continue;

const ddays = (a, b) => Math.round((Date.UTC(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6)) - Date.UTC(+a.slice(0, 4), +a.slice(4, 6) - 1, +a.slice(6))) / 864e5);
const ck11 = s => { let t = 0; for (let i = 0; i < 9; i++) t += (+s[i]) * (i + 1); const m = t % 11; return m === 10 ? 0 : m; };
const withCk = s => s + ck11(s);
const L = (...a) => a.join('\n');

    sol: L('LOOP AT lt INTO DATA(ls).', '  IF req = 0.', '    EXIT.', '  ENDIF.', '  DATA(use) = nmin( val1 = req val2 = ls-qty ).', '  IF use > 0.', '    WRITE: / ls-lot, use.', '    req = req - use.', '  ENDIF.', 'ENDLOOP.', 'IF req > 0.', "  WRITE: / 'SHORT', req.", 'ENDIF.') },

  { id: 2014, lv: 4, tags: ['sort', 'mm'], title: 'ABC 분석',
    body: '자재별 연간 사용금액 amount로 ABC 등급을 매긴다.\n1) 사용금액 내림차순으로 정렬한다(같으면 자재코드 오름차순).\n2) 위에서부터 차례로, "자기 앞 자재까지의 누적금액"이 전체의 70% 미만이면 A, 90% 미만이면 B, 그 외는 C.\n정렬된 순서대로 "자재코드 등급"을 출력하시오.',
    structs: { ty_usage: [{ n: 'matnr', t: 'string' }, { n: 'amount', t: 'i' }] },
    inputs: [{ n: 'lt', t: 'itab', st: 'ty_usage' }], inDesc: '1~100행, 0 ≤ amount ≤ 10,000,000', outDesc: '자재마다 한 줄씩 "자재코드 등급"을 출력한다.',
    tests: [[['M1', 500], ['M2', 300], ['M3', 100], ['M4', 50], ['M5', 50]], [['B', 10], ['A', 10], ['C', 80]], [['Q', 1]], [['M01', 300], ['M02', 300], ['M03', 200], ['M04', 100], ['M05', 100]]].map(lt => ({ lt })),
    ref: ({ lt }) => { const t = lt.reduce((s, r) => s + r[1], 0); const s = [...lt].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)); let c = 0; return s.map(([m, a]) => { const g = c * 100 < t * 70 ? 'A' : c * 100 < t * 90 ? 'B' : 'C'; c += a; return `${m} ${g}`; }).join('\n'); },
    sol: L('DATA total TYPE i.', 'LOOP AT lt INTO DATA(ls).', '  total = total + ls-amount.', 'ENDLOOP.', 'SORT lt BY amount DESCENDING matnr ASCENDING.', 'DATA cum TYPE i.', 'LOOP AT lt INTO ls.', '  IF cum * 100 < total * 70.', "    WRITE: / ls-matnr, 'A'.", '  ELSEIF cum * 100 < total * 90.', "    WRITE: / ls-matnr, 'B'.", '  ELSE.', "    WRITE: / ls-matnr, 'C'.", '  ENDIF.', '  cum = cum + ls-amount.', 'ENDLOOP.') },

  { id: 2015, lv: 2, tags: ['sim', 'sd'], title: '신용한도 점검',
    body: '거래처의 신용한도는 limit, 현재 미결 채권은 open이다. 판매오더가 순서대로 들어올 때(lt), 미결 채권 + 오더 금액이 한도 이하이면 승인(OK)하고 미결 채권에 더한다. 한도를 넘으면 BLOCK한다.\n오더마다 결과를 출력하시오.',
    structs: { ty_order: [{ n: 'vbeln', t: 'string' }, { n: 'netwr', t: 'i' }] },
    inputs: [{ n: 'limit', t: 'i' }, { n: 'open', t: 'i' }, { n: 'lt', t: 'itab', st: 'ty_order' }], inDesc: '0 ≤ open ≤ limit ≤ 1,000,000,000 / lt: 1~100행', outDesc: '오더마다 "오더번호 OK" 또는 "오더번호 BLOCK"을 출력한다.',
    tests: [[1000, 700, [['4500001', 200], ['4500002', 200], ['4500003', 100]]], [500, 0, [['A', 500]]], [100, 100, [['A', 1], ['B', 0]]]].map(([limit, open, lt]) => ({ limit, open, lt })),
    ref: ({ limit, open, lt }) => lt.map(([v, n]) => { if (open + n <= limit) { open += n; return `${v} OK`; } return `${v} BLOCK`; }).join('\n'),
    sol: L('LOOP AT lt INTO DATA(ls).', '  IF open + ls-netwr <= limit.', '    open = open + ls-netwr.', "    WRITE: / ls-vbeln, 'OK'.", '  ELSE.', "    WRITE: / ls-vbeln, 'BLOCK'.", '  ENDIF.', 'ENDLOOP.') },

  { id: 2016, lv: 3, tags: ['agg', 'search', 'sd'], title: '베스트셀러 자재',
    body: '판매 내역 lt에서 총 판매수량이 가장 많은 자재와 그 수량을 구하시오. 같은 자재가 여러 번 나올 수 있다.\n총 판매수량이 같으면 자재코드가 사전순으로 앞서는 것을 고른다.',
    structs: { ty_sale: [{ n: 'matnr', t: 'string' }, { n: 'qty', t: 'i' }] },
    inputs: [{ n: 'lt', t: 'itab', st: 'ty_sale' }], inDesc: '1~100행', outDesc: '"자재코드 총수량"을 출력한다.',
    tests: [[['M2', 5], ['M1', 3], ['M2', 1], ['M1', 3]], [['Z', 1]], [['A', 2], ['B', 7], ['C', 3], ['A', 4]], [['K', 0], ['J', 0]]].map(lt => ({ lt })),
    ref: ({ lt }) => { const m = {}; lt.forEach(([k, q]) => m[k] = (m[k] || 0) + q); const k = Object.keys(m).sort((a, b) => m[b] - m[a] || (a < b ? -1 : 1))[0]; return `${k} ${m[k]}`; },
    sol: L('DATA lt_sum TYPE TABLE OF ty_sale.', 'LOOP AT lt INTO DATA(ls).', '  COLLECT ls INTO lt_sum.', 'ENDLOOP.', 'SORT lt_sum BY qty DESCENDING matnr ASCENDING.', 'READ TABLE lt_sum INTO DATA(best) INDEX 1.', 'WRITE: best-matnr, best-qty.') },

  { id: 2017, lv: 2, tags: ['string', 'sd'], title: '거래처명 정리',
    body: '엑셀로 업로드한 거래처명에 공백이 엉망으로 들어가 있다. 앞뒤 공백을 없애고, 단어 사이의 공백은 한 칸으로 줄인 뒤 모두 대문자로 바꾸시오.',
    inputs: [{ n: 's', t: 'string' }], inDesc: 's는 1~100자, 공백이 아닌 글자를 하나 이상 포함', outDesc: '정리된 거래처명을 출력한다.',

  { id: 2018, lv: 3, tags: ['string', 'agg', 'sd'], title: '주문 문자열 파싱',
    body: '외부 시스템에서 주문이 "자재:수량;자재:수량;…" 형식의 문자열 하나로 넘어온다. 같은 자재가 여러 번 나올 수 있다.\n자재별 수량 합계를 자재코드 오름차순으로 출력하시오.\n직접 구조체 타입(TYPES)을 만들어 보자.',
    inputs: [{ n: 's', t: 'string' }], inDesc: 's는 1~200자, 수량은 0 이상의 정수', outDesc: '자재마다 "자재코드 합계"를 출력한다.',
    tests: ['M001:3;M002:5;M001:2', 'A:1', 'B:10;A:5;B:1;C:0'].map(s => ({ s })),
    ref: ({ s }) => { const m = {}; s.split(';').forEach(t => { const [k, q] = t.split(':'); m[k] = (m[k] || 0) + +q; }); return Object.keys(m).sort().map(k => `${k} ${m[k]}`).join('\n'); },
    sol: L('TYPES: BEGIN OF ty_line,', '         matnr TYPE string,', '         qty   TYPE i,', '       END OF ty_line.', 'DATA lt_sum TYPE TABLE OF ty_line.', 'DATA lt_tok TYPE TABLE OF string.', "SPLIT s AT ';' INTO TABLE lt_tok.", 'LOOP AT lt_tok INTO DATA(tok).', '  DATA ls TYPE ty_line.', '  DATA q TYPE string.', "  SPLIT tok AT ':' INTO ls-matnr q.", '  ls-qty = q.', '  COLLECT ls INTO lt_sum.', 'ENDLOOP.', 'SORT lt_sum BY matnr.', 'LOOP AT lt_sum INTO ls.', '  WRITE: / ls-matnr, ls-qty.', 'ENDLOOP.') },

  { id: 2019, lv: 2, tags: ['greedy', 'fi'], title: '현금 권종 계산',
    body: '급여 일부를 현금으로 지급하려 한다. 50000, 10000, 5000, 1000, 500, 100, 50, 10원권(동전)을 써서 금액 amount를 가장 적은 개수로 맞추시오.\n쓰이는 권종만 큰 단위부터 "권종 매수"로 출력한다.',
    inputs: [{ n: 'amount', t: 'i' }], inDesc: '10 ≤ amount ≤ 10,000,000, amount는 10의 배수', outDesc: '권종마다 한 줄씩 "권종 매수"를 출력한다.',
    tests: [68760, 10, 100000, 1230].map(amount => ({ amount })),
    ref: ({ amount: a }) => [50000, 10000, 5000, 1000, 500, 100, 50, 10].map(u => { const c = Math.floor(a / u); a %= u; return c ? `${u} ${c}` : null; }).filter(Boolean).join('\n'),
    sol: L('DATA(lt_unit) = VALUE int4_table( ( 50000 ) ( 10000 ) ( 5000 ) ( 1000 ) ( 500 ) ( 100 ) ( 50 ) ( 10 ) ).', 'LOOP AT lt_unit INTO DATA(unit).', '  DATA(cnt) = amount DIV unit.', '  IF cnt > 0.', '    WRITE: / unit, cnt.', '    amount = amount MOD unit.', '  ENDIF.', 'ENDLOOP.') },

  { id: 2020, lv: 3, tags: ['greedy', 'sort', 'pp'], title: '작업 순서 정하기',
    body: '기계 한 대로 작업 lt를 하나씩 처리한다. 각 작업의 처리시간은 time이다. 모든 작업의 완료 시각 합을 최소로 하려면 처리시간이 짧은 작업부터 해야 한다(같으면 작업명 오름차순).\n첫째 줄에 작업 순서를, 둘째 줄에 완료 시각의 합을 출력하시오.',
    structs: { ty_job: [{ n: 'job', t: 'string' }, { n: 'time', t: 'i' }] },
    inputs: [{ n: 'lt', t: 'itab', st: 'ty_job' }], inDesc: '1~100행, 1 ≤ time ≤ 1,000', outDesc: '첫째 줄에 작업명을 공백으로 구분해, 둘째 줄에 완료 시각의 합을 출력한다.',
    tests: [[['J1', 5], ['J2', 2], ['J3', 8]], [['A', 3], ['B', 3]], [['X', 10]], [['P', 4], ['Q', 1], ['R', 4], ['S', 2]]].map(lt => ({ lt })),
    ref: ({ lt }) => { const s = [...lt].sort((a, b) => a[1] - b[1] || (a[0] < b[0] ? -1 : 1)); let c = 0, t = 0; s.forEach(r => { c += r[1]; t += c; }); return `${s.map(r => r[0]).join(' ')}\n${t}`; },
    sol: L('SORT lt BY time job.', 'DATA(clock) = 0.', 'DATA(sum) = 0.', 'LOOP AT lt INTO DATA(ls).', '  WRITE ls-job.', '  clock = clock + ls-time.', '  sum = sum + clock.', 'ENDLOOP.', 'WRITE / sum.') },

  { id: 2021, lv: 4, tags: ['sim', 'mm', 'fi'], title: '이동평균 재고금액',
    body: '이동평균법으로 관리하는 자재의 기초 재고수량은 stock_qty, 재고금액은 stock_val이다. 재고 이동 lt가 순서대로 일어난다.\n· GR(입고): 수량에 menge, 금액에 입고금액 amount를 더한다.\n· GI(출고): 출고금액 = menge × 재고금액 ÷ 재고수량 (원 미만 반올림). 수량에서 menge, 금액에서 출고금액을 뺀다. (GI의 amount는 0이며 쓰지 않는다)\n이동이 일어날 때마다 그 직후의 "재고수량 재고금액"을 출력하시오.',
    structs: { ty_mov: [{ n: 'typ', t: 'string' }, { n: 'menge', t: 'i' }, { n: 'amount', t: 'i' }] },
    inputs: [{ n: 'stock_qty', t: 'i' }, { n: 'stock_val', t: 'i' }, { n: 'lt', t: 'itab', st: 'ty_mov' }], inDesc: '출고 시점의 재고수량은 항상 출고수량 이상이며 0보다 크다', outDesc: '이동마다 한 줄씩 "재고수량 재고금액"을 출력한다.',
    tests: [[100, 100000, [['GI', 30, 0], ['GR', 50, 60000], ['GI', 120, 0]]], [10, 1000, [['GI', 3, 0]]], [3, 1000, [['GI', 1, 0], ['GI', 1, 0]]], [0, 0, [['GR', 5, 999], ['GI', 2, 0]]]].map(([stock_qty, stock_val, lt]) => ({ stock_qty, stock_val, lt })),
    ref: ({ stock_qty: q, stock_val: v, lt }) => lt.map(([t, m, a]) => { if (t === 'GR') { q += m; v += a; } else { const g = rh(m * v / q); q -= m; v -= g; } return `${q} ${v}`; }).join('\n'),
    sol: L('LOOP AT lt INTO DATA(ls).', "  IF ls-typ = 'GR'.", '    stock_qty = stock_qty + ls-menge.', '    stock_val = stock_val + ls-amount.', '  ELSE.', '    DATA(gi_val) = ls-menge * stock_val / stock_qty.', '    stock_qty = stock_qty - ls-menge.', '    stock_val = stock_val - gi_val.', '  ENDIF.', '  WRITE: / stock_qty, stock_val.', 'ENDLOOP.') },

  { id: 2022, lv: 3, tags: ['search', 'sd'], title: '수량 스케일 단가',
    body: '가격조건에 수량 스케일이 걸려 있다. 스케일표 lt는 시작 수량 from_qty 오름차순이며, 첫 행의 from_qty는 1이다.\n주문 수량 qty에 적용되는 단가는 from_qty가 qty 이하인 행 중 가장 큰 from_qty의 단가다.\n적용 단가와 판매금액(단가 × 수량)을 구하시오.',
    structs: { ty_scale: [{ n: 'from_qty', t: 'i' }, { n: 'price', t: 'i' }] },
    inputs: [{ n: 'qty', t: 'i' }, { n: 'lt', t: 'itab', st: 'ty_scale' }], inDesc: '1 ≤ qty ≤ 100,000 / lt: 1~20행', outDesc: '단가와 판매금액을 공백으로 구분해 출력한다.',
    tests: [[5, [[1, 1000], [10, 900], [100, 800]]], [10, [[1, 1000], [10, 900], [100, 800]]], [250, [[1, 1000], [10, 900], [100, 800]]], [1, [[1, 1000], [10, 900]]], [7, [[1, 50]]]].map(([qty, lt]) => ({ qty, lt })),
    ref: ({ qty, lt }) => { let p = 0; for (const [f, pr] of lt) if (f <= qty) p = pr; return `${p} ${p * qty}`; },
    sol: L('DATA price TYPE i.', 'LOOP AT lt INTO DATA(ls).', '  IF ls-from_qty <= qty.', '    price = ls-price.', '  ELSE.', '    EXIT.', '  ENDIF.', 'ENDLOOP.', 'WRITE: price, price * qty.') }
,
  // ---------- 추가 Lv.3 / Lv.4 ----------
  { id: 2023, lv: 4, tags: ['search', 'sim', 'pp'], title: 'BOM 다단계 전개',
    body: '완제품 top을 n개 만들려 한다. 자재명세서 lt의 각 행은 "상위자재 parent 1개를 만드는 데 하위자재 child가 qty개 필요하다"는 뜻이다. 하위자재가 다시 다른 자재로 만들어질 수 있다(다단계).\n더 이상 쪼개지지 않는 자재(어떤 행의 parent로도 나오지 않는 자재)를 원자재라 한다. top n개를 만드는 데 필요한 원자재별 총수량을 자재코드 오름차순으로 출력하시오.\nlt에는 top과 상관없는 행이 섞여 있을 수 있다.',
    structs: { ty_bom: [{ n: 'parent', t: 'string' }, { n: 'child', t: 'string' }, { n: 'qty', t: 'i' }] },
    inputs: [{ n: 'top', t: 'string' }, { n: 'n', t: 'i' }, { n: 'lt', t: 'itab', st: 'ty_bom' }], inDesc: '1 ≤ n ≤ 100 / lt: 1~50행, 순환 구조는 없다', outDesc: '원자재마다 "자재코드 총수량"을 출력한다.',
    tests: [['FG', 2, [['FG', 'SA1', 2], ['FG', 'RM1', 1], ['SA1', 'RM1', 3], ['SA1', 'RM2', 4]]], ['A', 1, [['A', 'B', 1], ['B', 'C', 2], ['C', 'D', 3]]], ['X', 5, [['X', 'P', 1], ['X', 'Q', 2], ['Q', 'P', 1]]], ['TOP', 3, [['TOP', 'M1', 2], ['TOP', 'M2', 1], ['M2', 'M1', 1], ['M2', 'M3', 5], ['Z', 'M9', 1]]]].map(([top, n, lt]) => ({ top, n, lt })),
    ref: ({ top, n, lt }) => { const r = {}; const go = (m, q) => { const ch = lt.filter(x => x[0] === m); if (!ch.length) { r[m] = (r[m] || 0) + q; return; } ch.forEach(x => go(x[1], q * x[2])); }; go(top, n); return Object.keys(r).sort().map(k => `${k} ${r[k]}`).join('\n'); },
    sol: L('TYPES: BEGIN OF ty_req,', '         matnr TYPE string,', '         qty   TYPE i,', '       END OF ty_req.', 'DATA lt_queue TYPE TABLE OF ty_req.', 'DATA lt_leaf  TYPE TABLE OF ty_req.', '', 'APPEND VALUE #( matnr = top qty = n ) TO lt_queue.', 'WHILE lines( lt_queue ) > 0.', '  READ TABLE lt_queue INTO DATA(cur) INDEX 1.', '  DELETE lt_queue INDEX 1.', '  DATA(has_child) = abap_false.', '  LOOP AT lt INTO DATA(ls) WHERE parent = cur-matnr.', '    has_child = abap_true.', '    APPEND VALUE #( matnr = ls-child qty = cur-qty * ls-qty ) TO lt_queue.', '  ENDLOOP.', '  IF has_child = abap_false.', '    COLLECT cur INTO lt_leaf.', '  ENDIF.', 'ENDWHILE.', 'SORT lt_leaf BY matnr.', 'LOOP AT lt_leaf INTO DATA(leaf).', '  WRITE: / leaf-matnr, leaf-qty.', 'ENDLOOP.'),
    hint: '재귀 대신 "할 일 목록(큐)" 테이블을 쓰자. 큐에서 하나 꺼내 하위자재가 있으면 큐에 넣고, 없으면 원자재로 집계한다.' },

  { id: 2024, lv: 4, tags: ['date', 'agg', 'fi'], title: '채권 연령 분석',
    body: '기준일 key_date에 미결 채권 lt의 연령을 분석한다. 연체일수 = 기준일 - 만기일 due.\n· 연체일수 0 이하: 미도래\n· 1~30일\n· 31~60일\n· 61일 이상\n거래처별로 네 구간의 금액 합계를 거래처 코드 오름차순으로 출력하시오.',
    structs: { ty_open: [{ n: 'kunnr', t: 'string' }, { n: 'due', t: 'd' }, { n: 'amount', t: 'i' }] },
    inputs: [{ n: 'key_date', t: 'd' }, { n: 'lt', t: 'itab', st: 'ty_open' }], inDesc: 'lt: 1~100행', outDesc: '거래처마다 "거래처 미도래 1~30 31~60 61+"를 출력한다.',
    tests: [['20261108', [['C1', '20261120', 100], ['C1', '20261101', 200], ['C2', '20260915', 300], ['C1', '20260801', 50], ['C2', '20261108', 10]]], ['20260101', [['A', '20251231', 5]]], ['20240301', [['Z', '20240131', 7], ['Z', '20231231', 3], ['Y', '20240101', 1]]]].map(([key_date, lt]) => ({ key_date, lt })),
    ref: ({ key_date, lt }) => { const m = {}; lt.forEach(([k, d, a]) => { const x = ddays(d, key_date); const b = x <= 0 ? 0 : x <= 30 ? 1 : x <= 60 ? 2 : 3; (m[k] = m[k] || [0, 0, 0, 0])[b] += a; }); return Object.keys(m).sort().map(k => `${k} ${m[k].join(' ')}`).join('\n'); },
    sol: L('TYPES: BEGIN OF ty_age,', '         kunnr TYPE string,', '         b0    TYPE i,', '         b30   TYPE i,', '         b60   TYPE i,', '         b90   TYPE i,', '       END OF ty_age.', 'DATA lt_age TYPE TABLE OF ty_age.', '', 'LOOP AT lt INTO DATA(ls).', '  DATA(days) = key_date - ls-due.', '  DATA(ag) = VALUE ty_age( kunnr = ls-kunnr ).', '  IF days <= 0.', '    ag-b0 = ls-amount.', '  ELSEIF days <= 30.', '    ag-b30 = ls-amount.', '  ELSEIF days <= 60.', '    ag-b60 = ls-amount.', '  ELSE.', '    ag-b90 = ls-amount.', '  ENDIF.', '  COLLECT ag INTO lt_age.', 'ENDLOOP.', 'SORT lt_age BY kunnr.', 'LOOP AT lt_age INTO ag.', '  WRITE: / ag-kunnr, ag-b0, ag-b30, ag-b60, ag-b90.', 'ENDLOOP.') },

  { id: 2025, lv: 4, tags: ['greedy', 'sim', 'sd'], title: '트럭 배차',
    body: '적재 한도가 cap kg인 트럭에 출하 박스 lt를 순서대로 싣는다. 각 박스는 "이미 배차된 트럭 중 앞 번호부터 보면서 처음으로 들어가는 트럭"에 싣고, 들어갈 트럭이 없으면 새 트럭을 배차한다(First Fit).\n필요한 트럭 수와 트럭별 적재량을 구하시오.',
    inputs: [{ n: 'cap', t: 'i' }, { n: 'lt', t: 'itab_i' }], inDesc: '1 ≤ cap ≤ 10,000 / lt: 박스 무게(1 이상 cap 이하), 1~100행', outDesc: '첫째 줄에 트럭 수, 다음 줄부터 트럭 번호 순으로 적재량을 출력한다.',
    tests: [[10, [6, 5, 4, 3, 2]], [7, [7, 7, 1]], [100, [30, 30, 30, 30]], [5, [1, 4, 2, 3, 5, 1]]].map(([cap, lt]) => ({ cap, lt })),
    ref: ({ cap, lt }) => { const t = []; lt.forEach(w => { const i = t.findIndex(x => x + w <= cap); if (i >= 0) t[i] += w; else t.push(w); }); return [t.length, ...t].join('\n'); },
    sol: L('DATA lt_truck TYPE TABLE OF i.', 'LOOP AT lt INTO DATA(w).', '  DATA(placed) = abap_false.', '  LOOP AT lt_truck INTO DATA(load).', '    IF load + w <= cap.', '      load = load + w.', '      MODIFY lt_truck FROM load.', '      placed = abap_true.', '      EXIT.', '    ENDIF.', '  ENDLOOP.', '  IF placed = abap_false.', '    APPEND w TO lt_truck.', '  ENDIF.', 'ENDLOOP.', 'WRITE lines( lt_truck ).', 'LOOP AT lt_truck INTO load.', '  WRITE / load.', 'ENDLOOP.'),
    hint: 'LOOP 안에서 MODIFY itab FROM wa 를 쓰면 지금 돌고 있는 행(sy-tabix)이 바뀐다.' },

  { id: 2026, lv: 4, tags: ['date', 'sd'], title: '영업일 납기 계산',
    body: '주문일 order_date의 다음 날부터 영업일을 세어 n번째 영업일을 납기일로 정한다. 토요일·일요일과 공휴일 목록 lt에 있는 날은 영업일이 아니다.\n납기일을 구하시오.\n참고: 1900년 1월 1일은 월요일이다.',
    inputs: [{ n: 'order_date', t: 'd' }, { n: 'n', t: 'i' }, { n: 'lt', t: 'itab_d' }], inDesc: '1 ≤ n ≤ 30 / lt: 공휴일(TYPE d), 0~20행', outDesc: '납기일을 YYYYMMDD 형식으로 출력한다.',
    tests: [['20261106', 1, []], ['20261230', 3, ['20261231', '20270101']], ['20261108', 5, []], ['20260923', 2, ['20260924', '20260925', '20260926']]].map(([order_date, n, lt]) => ({ order_date, n, lt })),
    ref: ({ order_date: o, n, lt }) => { const d = new Date(Date.UTC(+o.slice(0, 4), +o.slice(4, 6) - 1, +o.slice(6))); const f = x => `${x.getUTCFullYear()}${String(x.getUTCMonth() + 1).padStart(2, '0')}${String(x.getUTCDate()).padStart(2, '0')}`; let c = 0; while (c < n) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w === 0 || w === 6 || lt.includes(f(d))) continue; c++; } return f(d); },
    sol: L("CONSTANTS c_monday TYPE d VALUE '19000101'.", 'DATA(lv_date) = order_date.', 'DATA(cnt) = 0.', 'WHILE cnt < n.', '  lv_date = lv_date + 1.', '  DATA(wd) = ( lv_date - c_monday ) MOD 7.   " 0=월 ... 5=토 6=일', '  IF wd >= 5.', '    CONTINUE.', '  ENDIF.', '  READ TABLE lt WITH KEY table_line = lv_date TRANSPORTING NO FIELDS.', '  IF sy-subrc = 0.', '    CONTINUE.', '  ENDIF.', '  cnt = cnt + 1.', 'ENDWHILE.', 'WRITE lv_date.'),
    hint: "요일은 (날짜 - 기준 월요일) MOD 7 로 구할 수 있다. 기준일은 '19000101' 문자 그대로 빼지 말고 TYPE d 상수로 만들어 빼야 날짜 계산이 된다." },

  { id: 2027, lv: 4, tags: ['sort', 'string', 'mm'], title: 'S자 피킹 경로',
    body: '창고 로케이션은 "열-칸" 형식(예: 03-12)이다. 피커는 1열부터 열 번호 순으로 돌며, 홀수 열은 칸 번호가 커지는 방향으로, 짝수 열은 작아지는 방향으로 걷는다(S자 경로).\n피킹할 로케이션 목록 lt를 방문 순서대로 출력하시오.',
    inputs: [{ n: 'lt', t: 'itab_s' }], inDesc: 'lt: "열-칸"(각 2자리) 형식, 1~100행, 중복 없음', outDesc: '방문 순서대로 한 줄에 하나씩 출력한다.',
    tests: [['02-05', '01-03', '02-01', '01-07', '03-02'], ['05-10'], ['04-01', '04-09', '04-05', '01-01'], ['10-02', '09-02', '10-08', '09-01']].map(lt => ({ lt })),
    ref: ({ lt }) => [...lt].sort((a, b) => { const ra = +a.slice(0, 2), rb = +b.slice(0, 2); if (ra !== rb) return ra - rb; const ba = +a.slice(3), bb = +b.slice(3); return ra % 2 ? ba - bb : bb - ba; }).join('\n'),
    sol: L('TYPES: BEGIN OF ty_pick,', '         row TYPE i,', '         key TYPE i,', '         loc TYPE string,', '       END OF ty_pick.', 'DATA lt_pick TYPE TABLE OF ty_pick.', 'LOOP AT lt INTO DATA(loc).', '  DATA(row) = CONV i( loc(2) ).', '  DATA(bin) = CONV i( loc+3(2) ).', '  IF row MOD 2 = 0.', '    bin = 100 - bin.', '  ENDIF.', '  APPEND VALUE #( row = row key = bin loc = loc ) TO lt_pick.', 'ENDLOOP.', 'SORT lt_pick BY row key.', 'LOOP AT lt_pick INTO DATA(ls).', '  WRITE / ls-loc.', 'ENDLOOP.'),
    hint: '정렬 기준을 바로 쓸 수 없으면 "정렬용 키"를 계산해 구조체에 담은 뒤 SORT ... BY 하자.' },

  { id: 2028, lv: 4, tags: ['search', 'sd'], title: '가격 조건 찾기',
    body: 'SAP의 가격결정은 "접근 순서"에 따라 조건 레코드를 찾는다. 할인 조건 lt_cond의 각 행은 거래처 kunnr, 자재 matnr, 할인율 rate(%)이며, *는 "아무거나"를 뜻한다.\n주문 품목 lt마다 아래 순서로 처음 찾은 조건을 쓴다.\n1) 거래처와 자재가 모두 일치\n2) 거래처가 *이고 자재가 일치\n3) 거래처가 일치하고 자재가 *\n4) 없으면 할인율 0\n품목마다 "거래처 자재 할인율 판매가"를 출력하시오. 판매가 = 정가 netpr × (100 - 할인율) ÷ 100, 원 미만 버림.',
    structs: { ty_cond: [{ n: 'kunnr', t: 'string' }, { n: 'matnr', t: 'string' }, { n: 'rate', t: 'i' }], ty_item: [{ n: 'kunnr', t: 'string' }, { n: 'matnr', t: 'string' }, { n: 'netpr', t: 'i' }] },
    inputs: [{ n: 'lt_cond', t: 'itab', st: 'ty_cond' }, { n: 'lt', t: 'itab', st: 'ty_item' }], inDesc: 'lt_cond: 1~50행 / lt: 1~50행', outDesc: '품목마다 한 줄씩 출력한다.',
    tests: [[[['C1', 'M1', 10], ['*', 'M1', 5], ['C2', '*', 3], ['*', 'M2', 7]], [['C1', 'M1', 1000], ['C2', 'M1', 1000], ['C2', 'M3', 200], ['C3', 'M3', 500], ['C2', 'M2', 100]]], [[['*', '*', 50]], [['A', 'B', 99]]], [[['C9', 'M9', 20], ['C9', '*', 15]], [['C9', 'M9', 101], ['C9', 'M1', 101]]]].map(([lt_cond, lt]) => ({ lt_cond, lt })),
    ref: ({ lt_cond, lt }) => lt.map(([k, m, p]) => { const f = (a, b) => lt_cond.find(c => c[0] === a && c[1] === b); const c = f(k, m) || f('*', m) || f(k, '*'); const r = c ? c[2] : 0; return `${k} ${m} ${r} ${Math.floor(p * (100 - r) / 100)}`; }).join('\n'),
    sol: L('LOOP AT lt INTO DATA(item).', '  DATA(rate) = 0.', '  READ TABLE lt_cond INTO DATA(rec) WITH KEY kunnr = item-kunnr matnr = item-matnr.', '  IF sy-subrc <> 0.', "    READ TABLE lt_cond INTO rec WITH KEY kunnr = '*' matnr = item-matnr.", '  ENDIF.', '  IF sy-subrc <> 0.', "    READ TABLE lt_cond INTO rec WITH KEY kunnr = item-kunnr matnr = '*'.", '  ENDIF.', '  IF sy-subrc = 0.', '    rate = rec-rate.', '  ENDIF.', '  DATA(price) = item-netpr * ( 100 - rate ) DIV 100.', '  WRITE: / item-kunnr, item-matnr, rate, price.', 'ENDLOOP.') },

  { id: 2029, lv: 3, tags: ['agg', 'fi'], title: '전표 차대 검사',
    body: '복식부기 전표는 차변(S) 합계와 대변(H) 합계가 같아야 한다. 전표 라인 lt가 주어질 때 전표번호 오름차순으로, 균형이 맞으면 "전표번호 OK", 안 맞으면 "전표번호 DIFF 차액"(차변 합 - 대변 합)을 출력하시오.',
    structs: { ty_line: [{ n: 'belnr', t: 'string' }, { n: 'shkzg', t: 'string' }, { n: 'dmbtr', t: 'i' }] },
    inputs: [{ n: 'lt', t: 'itab', st: 'ty_line' }], inDesc: 'shkzg: S(차변) 또는 H(대변), 1~100행', outDesc: '전표마다 한 줄씩 출력한다.',
    tests: [[['1900000100', 'S', 500], ['1900000100', 'H', 500], ['1900000200', 'S', 300], ['1900000200', 'H', 250], ['1900000200', 'H', 40]], [['1900000009', 'S', 1], ['1900000009', 'H', 2]], [['1900000003', 'H', 5], ['1900000001', 'S', 0], ['1900000001', 'H', 0], ['1900000003', 'S', 5]]].map(lt => ({ lt })),
    ref: ({ lt }) => { const m = {}; lt.forEach(([b, s, a]) => m[b] = (m[b] || 0) + (s === 'S' ? a : -a)); return Object.keys(m).sort().map(b => m[b] === 0 ? `${b} OK` : `${b} DIFF ${m[b]}`).join('\n'); },
    sol: L('TYPES: BEGIN OF ty_sum,', '         belnr TYPE string,', '         bal   TYPE i,', '       END OF ty_sum.', 'DATA lt_sum TYPE TABLE OF ty_sum.', 'LOOP AT lt INTO DATA(ls).', "  DATA(amt) = COND i( WHEN ls-shkzg = 'S' THEN ls-dmbtr ELSE - ls-dmbtr ).", '  COLLECT VALUE ty_sum( belnr = ls-belnr bal = amt ) INTO lt_sum.', 'ENDLOOP.', 'SORT lt_sum BY belnr.', 'LOOP AT lt_sum INTO DATA(s).', '  IF s-bal = 0.', "    WRITE: / s-belnr, 'OK'.", '  ELSE.', "    WRITE: / s-belnr, 'DIFF', s-bal.", '  ENDIF.', 'ENDLOOP.') },

  { id: 2030, lv: 3, tags: ['search', 'sort', 'mm'], title: '공급업체 선정',
    body: '자재별로 여러 공급업체의 견적 lt가 들어왔다. 리드타임 lead가 max_lead일 이하인 견적 중에서 단가가 가장 낮은 업체를 고른다. 단가가 같으면 리드타임이 짧은 업체, 그것도 같으면 업체코드가 사전순으로 앞서는 업체를 고른다.\n자재코드 오름차순으로 "자재 업체 단가"를 출력하고, 조건에 맞는 견적이 없으면 "자재 NONE"을 출력하시오.',

    inputs: [{ n: 'max_lead', t: 'i' }, { n: 'lt', t: 'itab', st: 'ty_quote' }], inDesc: '1 ≤ max_lead ≤ 365 / lt: 1~100행', outDesc: '자재마다 한 줄씩 출력한다.',

    ref: ({ max_lead, lt }) => [...new Set(lt.map(r => r[0]))].sort().map(m => { const c = lt.filter(r => r[0] === m && r[3] <= max_lead).sort((a, b) => a[2] - b[2] || a[3] - b[3] || (a[1] < b[1] ? -1 : 1)); return c.length ? `${m} ${c[0][1]} ${c[0][2]}` : `${m} NONE`; }).join('\n'),
    sol: L('SORT lt BY matnr price lead lifnr.', 'DATA last TYPE string.', 'DATA found TYPE abap_bool.', 'LOOP AT lt INTO DATA(q).', '  IF q-matnr <> last.', '    IF last IS NOT INITIAL AND found = abap_false.', "      WRITE: / last, 'NONE'.", '    ENDIF.', '    last = q-matnr.', '    found = abap_false.', '  ENDIF.', '  IF found = abap_false AND q-lead <= max_lead.', '    WRITE: / q-matnr, q-lifnr, q-price.', '    found = abap_true.', '  ENDIF.', 'ENDLOOP.', 'IF last IS NOT INITIAL AND found = abap_false.', "  WRITE: / last, 'NONE'.", 'ENDIF.') }
];

const jsIn = (v, rs) => {
  if (!rs || !rs.length) return true;
  const hit = ([, o, lo, hi]) => o === 'EQ' ? v === lo : o === 'NE' ? v !== lo : o === 'BT' ? v >= lo && v <= hi : o === 'GE' ? v >= lo : o === 'LE' ? v <= lo : o === 'GT' ? v > lo : o === 'LT' ? v < lo : false;
  const inc = rs.filter(r => r[0] === 'I'), exc = rs.filter(r => r[0] === 'E');
  return (!inc.length || inc.some(hit)) && !exc.some(hit);
};

      .map(t => ({ ...t, db: { vbap: [['10001', '10', 'M1', 10, 1000], ['10001', '20', 'M2', 5, 500], ['10002', '10', 'M1', 8, 800], ['10003', '10', 'M3', 3, 300]], lips: [['80001', '10', '10001', '10', 5], ['80002', '10', '10001', '10', 5], ['80003', '10', '10001', '20', 2], ['80004', '10', '10003', '10', 3]] } })),
    ref: ({ s_vbeln, db }) => { const o = []; db.vbap.filter(x => jsIn(x[0], s_vbeln)).sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1).forEach(x => { const d = db.lips.filter(l => l[2] === x[0] && l[3] === x[1]).reduce((s, l) => s + l[4], 0); if (x[3] - d > 0) o.push(`${x[0]} ${x[1]} ${x[2]} ${x[3]} ${d} ${x[3] - d}`); }); return o.length ? o.join('\n') : 'NO OPEN ITEMS'; },
    sol: L2('REPORT zsd_open_items.', '', 'SELECT-OPTIONS s_vbeln FOR vbap-vbeln.', '', 'START-OF-SELECTION.', '  SELECT vbeln, posnr, matnr, kwmeng', '    FROM vbap', '    WHERE vbeln IN @s_vbeln', '    ORDER BY vbeln, posnr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO OPEN ITEMS'.", '    RETURN.', '  ENDIF.', '', '  " 납품 문서번호(vbeln, posnr)까지 읽어야 같은 수량의 납품이 합쳐지지 않는다', '  SELECT vbeln, posnr, vgbel, vgpos, lfimg', '    FROM lips', '    FOR ALL ENTRIES IN @gt_itab', '    WHERE vgbel = @gt_itab-vbeln AND vgpos = @gt_itab-posnr', '    INTO TABLE @DATA(gt_dlv).', '', '  DATA lv_cnt TYPE i.', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    DATA(lv_dlv) = 0.', '    LOOP AT gt_dlv INTO DATA(gs_dlv) WHERE vgbel = gs_itab-vbeln AND vgpos = gs_itab-posnr.', '      lv_dlv = lv_dlv + gs_dlv-lfimg.', '    ENDLOOP.', '    DATA(lv_open) = gs_itab-kwmeng - lv_dlv.', '    IF lv_open > 0.', '      WRITE: / gs_itab-vbeln, gs_itab-posnr, gs_itab-matnr, gs_itab-kwmeng, lv_dlv, lv_open.', '      lv_cnt = lv_cnt + 1.', '    ENDIF.', '  ENDLOOP.', '  IF lv_cnt = 0.', "    WRITE 'NO OPEN ITEMS'.", '  ENDIF.'),
    hint: 'FOR ALL ENTRIES 는 결과에서 완전히 똑같은 행을 하나로 합칩니다. 같은 품목에 수량 5짜리 납품이 두 번 있으면, 납품 문서번호를 함께 읽지 않을 경우 5만 남아요.' },

  // ---------------- MM ----------------
  { id: 4003, mod: 'mm', lv: 3, title: '플랜트 재고 현황',
    body: '플랜트 p_werks의 재고 현황 리포트를 만드세요.\n· 재고는 MARD 테이블에 저장위치(lgort)별로 나뉘어 있습니다. 자재별로 합쳐서 보여 주세요.\n· 자재명은 MAKT 테이블의 한국어(spras = \'3\') 내역입니다.\n· 자재번호 순으로 "자재 자재명 가용재고 품질재고 합계"를 출력합니다.\n· 데이터가 없으면 NO DATA 를 출력합니다.',
    tables: ['mard', 'makt'], sel: [{ n: 'p_werks', kind: 'p', decl: 'TYPE werks_d', label: '플랜트' }, { n: 's_matnr', kind: 's', decl: 'FOR mard-matnr', label: '자재' }],
    tests: [{ p_werks: '1000', s_matnr: [] }, { p_werks: '1000', s_matnr: [['I', 'EQ', 'M2', '']] }, { p_werks: '2000', s_matnr: [] }, { p_werks: '3000', s_matnr: [] }]
      .map(t => ({ ...t, db: { mard: [['M1', '1000', '0001', 50, 5], ['M1', '1000', '0002', 30, 0], ['M2', '1000', '0001', 0, 10], ['M1', '2000', '0001', 99, 0], ['M3', '1000', '0001', 7, 1]], makt: [['M1', '3', '볼트'], ['M2', '3', '너트'], ['M3', '3', '와셔'], ['M1', 'E', 'Bolt']] } })),
    ref: ({ p_werks, s_matnr, db }) => { const m = {}; db.mard.filter(x => x[1] === p_werks && jsIn(x[0], s_matnr)).forEach(x => { m[x[0]] = m[x[0]] || [0, 0]; m[x[0]][0] += x[3]; m[x[0]][1] += x[4]; }); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; return k.map(x => `${x} ${db.makt.find(t => t[0] === x && t[1] === '3')[2]} ${m[x][0]} ${m[x][1]} ${m[x][0] + m[x][1]}`).join('\n'); },
    sol: L2('REPORT zmm_stock.', '', 'PARAMETERS p_werks TYPE werks_d.', 'SELECT-OPTIONS s_matnr FOR mard-matnr.', '', 'START-OF-SELECTION.', '  SELECT matnr, SUM( labst ) AS labst, SUM( insme ) AS insme', '    FROM mard', '    WHERE werks = @p_werks', '      AND matnr IN @s_matnr', '    GROUP BY matnr', '    ORDER BY matnr', '    INTO TABLE @DATA(gt_itab).', '', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    SELECT SINGLE maktx FROM makt', "      WHERE matnr = @gs_itab-matnr AND spras = '3'", '      INTO @DATA(lv_maktx).', '    WRITE: / gs_itab-matnr, lv_maktx, gs_itab-labst, gs_itab-insme, gs_itab-labst + gs_itab-insme.', '  ENDLOOP.') },

  { id: 4004, mod: 'mm', lv: 3, title: '자재 내역 목록 (FOR ALL ENTRIES)',
    body: '자재유형 s_mtart에 해당하는 자재의 한국어 자재명을 출력하는 리포트를 만드세요.\n1) MARA에서 자재유형으로 자재를 고릅니다.\n2) 고른 자재의 한국어 내역(spras = \'3\')을 MAKT에서 FOR ALL ENTRIES 로 읽습니다.\n3) 자재번호 순으로 "자재 자재명"을 출력합니다.\n해당 자재가 없으면 NO DATA 를 출력합니다.',
    tables: ['mara', 'makt'], sel: [{ n: 's_mtart', kind: 's', decl: 'FOR mara-mtart', label: '자재유형' }],
    tests: [{ s_mtart: [['I', 'EQ', 'ROH', '']] }, { s_mtart: [['I', 'EQ', 'FERT', ''], ['I', 'EQ', 'HALB', '']] }, { s_mtart: [['I', 'EQ', 'DIEN', '']] }, { s_mtart: [] }]
      .map(t => ({ ...t, db: { mara: [['M1', 'FERT', 'A01', 'EA'], ['M2', 'ROH', 'B01', 'KG'], ['M3', 'ROH', 'B02', 'KG'], ['M4', 'HALB', 'A02', 'EA']], makt: [['M1', '3', '완제품A'], ['M2', '3', '원자재B'], ['M3', '3', '원자재C'], ['M3', 'E', 'Raw C'], ['M4', '3', '반제품D']] } })),
    ref: ({ s_mtart, db }) => { const ms = db.mara.filter(x => jsIn(x[1], s_mtart)).map(x => x[0]); if (!ms.length) return 'NO DATA'; return db.makt.filter(t => ms.includes(t[0]) && t[1] === '3').sort((a, b) => a[0] < b[0] ? -1 : 1).map(t => `${t[0]} ${t[2]}`).join('\n'); },
    sol: L2('REPORT zmm_material_text.', '', 'SELECT-OPTIONS s_mtart FOR mara-mtart.', '', 'START-OF-SELECTION.', '  SELECT matnr, mtart FROM mara', '    WHERE mtart IN @s_mtart', '    INTO TABLE @DATA(gt_mara).', '', '  " 드라이버 테이블이 비어 있으면 FOR ALL ENTRIES 가 WHERE 를 통째로 무시한다!', '  IF gt_mara IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '', '  SELECT matnr, maktx FROM makt', '    FOR ALL ENTRIES IN @gt_mara', "    WHERE matnr = @gt_mara-matnr AND spras = '3'", '    INTO TABLE @DATA(gt_itab).', '  SORT gt_itab BY matnr.', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    WRITE: / gs_itab-matnr, gs_itab-maktx.', '  ENDLOOP.'),
    hint: 'FOR ALL ENTRIES IN 의 테이블이 비어 있으면 WHERE 조건 전체가 무시되어 테이블의 모든 행을 읽습니다. 실무에서 가장 유명한 함정이에요.' },

  { id: 4005, mod: 'mm', lv: 4, title: '구매오더 미입고 현황',
    body: '공급업체 s_lifnr의 구매오더 중 아직 다 입고되지 않은 품목을 보여 주는 리포트를 만드세요.\n· EKKO(구매오더 헤더), EKPO(품목), LFA1(공급업체)을 JOIN 합니다.\n· 입고 수량은 EKBE에서 이력 유형 bewtp = \'E\'(입고)인 행의 수량 합계입니다.\n· 미입고 = 발주 수량 - 입고 수량\n· 미입고가 남은 품목만 구매오더, 품목 순으로 "구매오더 품목 업체명 자재 발주수량 입고수량 미입고"를 출력합니다.\n· 하나도 없으면 NO OPEN PO 를 출력합니다.',
    tables: ['ekko', 'ekpo', 'ekbe', 'lfa1'], sel: [{ n: 's_lifnr', kind: 's', decl: 'FOR ekko-lifnr', label: '공급업체' }],
    tests: [{ s_lifnr: [], g: 0 }, { s_lifnr: [['I', 'EQ', 'V200', '']], g: 0 }, { s_lifnr: [['I', 'EQ', 'V100', '']], g: 0 }, { s_lifnr: [], g: 1 }]
      .map(t => ({ s_lifnr: t.s_lifnr, db: { lfa1: [['V100', '대한철강', 'KR'], ['V200', '한국볼트', 'KR']], ekko: [['45001', '1000', 'V100', '20260105'], ['45002', '1000', 'V200', '20260110'], ['45003', '1000', 'V100', '20260201']], ekpo: [['45001', '10', 'M1', '1000', 100, 50], ['45001', '20', 'M2', '1000', 40, 20], ['45002', '10', 'M3', '1000', 10, 5], ['45003', '10', 'M1', '1000', 30, 50]], ekbe: t.g === 0 ? [['45001', '10', '50001', 'E', 50], ['45001', '10', '50002', 'E', 50], ['45001', '20', '50003', 'E', 10], ['45002', '10', '50004', 'E', 10], ['45001', '20', '51001', 'Q', 5]] : [['45001', '10', '50001', 'E', 100]] } })),
    ref: ({ s_lifnr, db }) => { const o = []; db.ekpo.map(p => [p, db.ekko.find(k => k[0] === p[0])]).filter(([, k]) => jsIn(k[2], s_lifnr)).sort((a, b) => (a[0][0] + a[0][1]) < (b[0][0] + b[0][1]) ? -1 : 1).forEach(([p, k]) => { const g = db.ekbe.filter(e => e[0] === p[0] && e[1] === p[1] && e[3] === 'E').reduce((s, e) => s + e[4], 0); if (p[4] - g > 0) o.push(`${p[0]} ${p[1]} ${db.lfa1.find(v => v[0] === k[2])[1]} ${p[2]} ${p[4]} ${g} ${p[4] - g}`); }); return o.length ? o.join('\n') : 'NO OPEN PO'; },
    sol: L2('REPORT zmm_open_po.', '', 'SELECT-OPTIONS s_lifnr FOR ekko-lifnr.', '', 'START-OF-SELECTION.', '  SELECT p~ebeln, p~ebelp, v~name1, p~matnr, p~menge', '    FROM ekko AS k', '    INNER JOIN ekpo AS p ON k~ebeln = p~ebeln', '    INNER JOIN lfa1 AS v ON k~lifnr = v~lifnr', '    WHERE k~lifnr IN @s_lifnr', '    ORDER BY ebeln, ebelp', '    INTO TABLE @DATA(gt_itab).', '', '  IF gt_itab IS NOT INITIAL.', '    SELECT ebeln, ebelp, belnr, menge FROM ekbe', '      FOR ALL ENTRIES IN @gt_itab', "      WHERE ebeln = @gt_itab-ebeln AND ebelp = @gt_itab-ebelp AND bewtp = 'E'", '      INTO TABLE @DATA(gt_gr).', '  ENDIF.', '', '  DATA lv_cnt TYPE i.', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    DATA(lv_gr) = 0.', '    LOOP AT gt_gr INTO DATA(gs_gr) WHERE ebeln = gs_itab-ebeln AND ebelp = gs_itab-ebelp.', '      lv_gr = lv_gr + gs_gr-menge.', '    ENDLOOP.', '    DATA(lv_open) = gs_itab-menge - lv_gr.', '    IF lv_open > 0.', '      WRITE: / gs_itab-ebeln, gs_itab-ebelp, gs_itab-name1, gs_itab-matnr, gs_itab-menge, lv_gr, lv_open.', '      lv_cnt = lv_cnt + 1.', '    ENDIF.', '  ENDLOOP.', '  IF lv_cnt = 0.', "    WRITE 'NO OPEN PO'.", '  ENDIF.'),
    hint: '입고 이력을 FOR ALL ENTRIES 로 읽을 때 입고 문서번호(belnr)를 빼면, 수량이 같은 입고 두 건이 한 건으로 합쳐집니다.' },

  // ---------------- FI ----------------
  { id: 4006, mod: 'fi', lv: 4, title: 'G/L 계정별 잔액',
    body: '회사코드 p_bukrs, 회계연도 p_gjahr, 전기일 범위 s_budat의 전표로 G/L 계정별 잔액 리포트를 만드세요.\n· 전기일(budat)은 BKPF(전표 헤더)에, 계정(hkont)·차대(shkzg)·금액(dmbtr)은 BSEG(전표 품목)에 있습니다. bukrs, belnr, gjahr 세 필드로 JOIN 합니다.\n· 잔액 = 차변(S) 금액 합계 - 대변(H) 금액 합계\n· 계정명은 SKAT의 한국어(spras = \'3\') txt50 입니다.\n· 계정번호 순으로 "계정 계정명 잔액"을 출력합니다. 데이터가 없으면 NO DATA.',
    tables: ['bkpf', 'bseg', 'skat'], sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bukrs', label: '회사코드' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE gjahr', label: '회계연도' }, { n: 's_budat', kind: 's', decl: 'FOR bkpf-budat', label: '전기일' }],
    tests: [{ p_bukrs: '1000', p_gjahr: '2026', s_budat: [] }, { p_bukrs: '1000', p_gjahr: '2026', s_budat: [['I', 'BT', '20260101', '20260131']] }, { p_bukrs: '2000', p_gjahr: '2026', s_budat: [] }, { p_bukrs: '1000', p_gjahr: '2027', s_budat: [] }]
      .map(t => ({ ...t, db: {
        bkpf: [['1000', '100001', '2026', 'SA', '20260110'], ['1000', '100002', '2026', 'SA', '20260215'], ['2000', '100001', '2026', 'SA', '20260110'], ['1000', '100003', '2025', 'SA', '20251231']],
        bseg: [['1000', '100001', '2026', '001', '11000000', 'S', 500], ['1000', '100001', '2026', '002', '40000000', 'H', 500], ['1000', '100002', '2026', '001', '11000000', 'S', 300], ['1000', '100002', '2026', '002', '40000000', 'H', 200], ['1000', '100002', '2026', '003', '25500000', 'H', 100], ['2000', '100001', '2026', '001', '11000000', 'S', 999], ['2000', '100001', '2026', '002', '40000000', 'H', 999], ['1000', '100003', '2025', '001', '11000000', 'S', 50], ['1000', '100003', '2025', '002', '40000000', 'H', 50]],
        skat: [['11000000', '3', '외상매출금'], ['40000000', '3', '제품매출'], ['25500000', '3', '부가세예수금']] } })),
    ref: ({ p_bukrs, p_gjahr, s_budat, db }) => { const m = {}; db.bseg.forEach(s => { const h = db.bkpf.find(x => x[0] === s[0] && x[1] === s[1] && x[2] === s[2]); if (h && h[0] === p_bukrs && h[2] === p_gjahr && jsIn(h[4], s_budat)) m[s[4]] = (m[s[4]] || 0) + (s[5] === 'S' ? s[6] : -s[6]); }); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; return k.map(a => `${a} ${db.skat.find(t => t[0] === a)[2]} ${m[a]}`).join('\n'); },
    sol: L2('REPORT zfi_gl_balance.', '', 'PARAMETERS: p_bukrs TYPE bukrs,', '            p_gjahr TYPE gjahr.', 'SELECT-OPTIONS s_budat FOR bkpf-budat.', '', 'START-OF-SELECTION.', '  SELECT s~hkont, s~shkzg, s~dmbtr', '    FROM bkpf AS h', '    INNER JOIN bseg AS s', '      ON h~bukrs = s~bukrs AND h~belnr = s~belnr AND h~gjahr = s~gjahr', '    WHERE h~bukrs = @p_bukrs', '      AND h~gjahr = @p_gjahr', '      AND h~budat IN @s_budat', '    INTO TABLE @DATA(gt_line).', '  IF gt_line IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '', '  TYPES: BEGIN OF ty_bal,', '           hkont TYPE string,', '           bal   TYPE i,', '         END OF ty_bal.', '  DATA gt_itab TYPE TABLE OF ty_bal.', '  LOOP AT gt_line INTO DATA(gs_line).', "    DATA(lv_amt) = COND i( WHEN gs_line-shkzg = 'S' THEN gs_line-dmbtr ELSE - gs_line-dmbtr ).", '    COLLECT VALUE ty_bal( hkont = gs_line-hkont bal = lv_amt ) INTO gt_itab.', '  ENDLOOP.', '  SORT gt_itab BY hkont.', '', '  LOOP AT gt_itab INTO DATA(gs_itab).', "    SELECT SINGLE txt50 FROM skat WHERE saknr = @gs_itab-hkont AND spras = '3' INTO @DATA(lv_txt).", '    WRITE: / gs_itab-hkont, lv_txt, gs_itab-bal.', '  ENDLOOP.') },

  { id: 4007, mod: 'fi', lv: 4, title: '고객 미결 채권 연령',
    body: '회사코드 p_bukrs의 고객 미결 항목(BSID)으로 기준일 p_keydt 시점의 채권 연령 리포트를 만드세요.\n· 밀린 날 = 기준일 - 만기일(zfbdt)\n· 0일 이하 / 1~30일 / 31~60일 / 61일 이상 네 구간으로 나눕니다.\n· 고객명은 KNA1의 name1 입니다.\n· 고객번호 순으로 "고객 고객명 0이하 1~30 31~60 61이상" 금액을 출력합니다. 데이터가 없으면 NO DATA.',
    tables: ['bsid', 'kna1'], sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bukrs', label: '회사코드' }, { n: 'p_keydt', kind: 'p', decl: 'TYPE datum', label: '기준일' }],
    tests: [{ p_bukrs: '1000', p_keydt: '20261108' }, { p_bukrs: '2000', p_keydt: '20261108' }, { p_bukrs: '1000', p_keydt: '20261231' }, { p_bukrs: '3000', p_keydt: '20261108' }]
      .map(t => ({ ...t, db: { kna1: KNA1, bsid: [['1000', 'C100', '9001', '20261120', 100], ['1000', 'C100', '9002', '20261101', 200], ['1000', 'C200', '9003', '20260915', 300], ['1000', 'C100', '9004', '20260801', 50], ['1000', 'C200', '9005', '20261108', 10], ['2000', 'C300', '9006', '20261001', 77]] } })),
    ref: ({ p_bukrs, p_keydt, db }) => { const m = {}; db.bsid.filter(x => x[0] === p_bukrs).forEach(x => { const d = ddays(x[3], p_keydt); const b = d <= 0 ? 0 : d <= 30 ? 1 : d <= 60 ? 2 : 3; (m[x[1]] = m[x[1]] || [0, 0, 0, 0])[b] += x[4]; }); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; return k.map(c => `${c} ${db.kna1.find(z => z[0] === c)[1]} ${m[c].join(' ')}`).join('\n'); },
    sol: L2('REPORT zfi_ar_aging.', '', 'PARAMETERS: p_bukrs TYPE bukrs,', '            p_keydt TYPE datum.', '', 'START-OF-SELECTION.', '  SELECT d~kunnr, k~name1, d~zfbdt, d~dmbtr', '    FROM bsid AS d', '    INNER JOIN kna1 AS k ON d~kunnr = k~kunnr', '    WHERE d~bukrs = @p_bukrs', '    ORDER BY kunnr', '    INTO TABLE @DATA(gt_open).', '  IF gt_open IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '', '  TYPES: BEGIN OF ty_age,', '           kunnr TYPE string,', '           name1 TYPE string,', '           b0    TYPE i,', '           b30   TYPE i,', '           b60   TYPE i,', '           b90   TYPE i,', '         END OF ty_age.', '  DATA gt_itab TYPE TABLE OF ty_age.', '', '  LOOP AT gt_open INTO DATA(gs_open).', '    DATA(lv_days) = p_keydt - gs_open-zfbdt.', '    DATA(gs_age) = VALUE ty_age( kunnr = gs_open-kunnr name1 = gs_open-name1 ).', '    IF lv_days <= 0.', '      gs_age-b0 = gs_open-dmbtr.', '    ELSEIF lv_days <= 30.', '      gs_age-b30 = gs_open-dmbtr.', '    ELSEIF lv_days <= 60.', '      gs_age-b60 = gs_open-dmbtr.', '    ELSE.', '      gs_age-b90 = gs_open-dmbtr.', '    ENDIF.', '    COLLECT gs_age INTO gt_itab.', '  ENDLOOP.', '', '  LOOP AT gt_itab INTO gs_age.', '    WRITE: / gs_age-kunnr, gs_age-name1, gs_age-b0, gs_age-b30, gs_age-b60, gs_age-b90.', '  ENDLOOP.') },

  { id: 4008, mod: 'fi', lv: 3, title: '전표 유형별 건수',

    body: '자재코드 p_matnr 의 한국어 자재명을 MAKT 테이블에서 읽어 출력하세요.\n· 한국어 내역은 spras = \'3\' 입니다.\n· SELECT SINGLE 을 쓰고, 없으면 NOT FOUND 를 출력합니다.',
    tables: ['makt'], sel: [{ n: 'p_matnr', kind: 'p', decl: 'TYPE matnr', label: '자재' }],
    tests: ['M2', 'M9', 'M1'].map(p_matnr => ({ p_matnr, db: { makt: MAKT_D } })), ref: ({ p_matnr, db }) => { const r = db.makt.find(x => x[0] === p_matnr && x[1] === '3'); return r ? r[2] : 'NOT FOUND'; },
    sol: "REPORT z_maktx.\n\nPARAMETERS p_matnr TYPE matnr.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE maktx\n    FROM makt\n    WHERE matnr = @p_matnr\n      AND spras = '3'\n    INTO @DATA(lv_maktx).\n  IF sy-subrc = 0.\n    WRITE lv_maktx.\n  ELSE.\n    WRITE 'NOT FOUND'.\n  ENDIF." },
  { id: 5101, lv: 2, kind: 'rpt', tags: ['sql', 'mm'], title: '저장위치별 재고 목록 (SELECT INTO TABLE)',
    body: '플랜트 p_werks 의 재고를 MARD 에서 읽어 목록으로 출력하세요.\n· 가용재고(labst)가 0보다 큰 행만 읽습니다.\n· 자재, 저장위치 순으로 "자재 저장위치 가용재고"를 출력하고, 마지막 줄에 "COUNT 건수"를 출력합니다.\n· 데이터가 없으면 NO DATA 를 출력합니다.',
    tables: ['mard'], sel: [{ n: 'p_werks', kind: 'p', decl: 'TYPE werks_d', label: '플랜트' }],
    tests: ['1000', '2000', '9000'].map(p_werks => ({ p_werks, db: { mard: MARD_D } })),
    ref: ({ p_werks, db }) => { const r = db.mard.filter(x => x[1] === p_werks && x[3] > 0).sort((a, b) => (a[0] + a[2]) < (b[0] + b[2]) ? -1 : 1); return r.length ? [...r.map(x => `${x[0]} ${x[2]} ${x[3]}`), `COUNT ${r.length}`].join('\n') : 'NO DATA'; },
    sol: "REPORT z_mard_list.\n\nPARAMETERS p_werks TYPE werks_d.\n\nSTART-OF-SELECTION.\n  SELECT matnr, lgort, labst\n    FROM mard\n    WHERE werks = @p_werks\n      AND labst > 0\n    ORDER BY matnr, lgort\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    WRITE: / gs_itab-matnr, gs_itab-lgort, gs_itab-labst.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." },
  { id: 5102, lv: 2, kind: 'rpt', tags: ['dml'], title: '사원 등록 (INSERT)', checkDb: ['zemp'],
    body: '선택 화면 값으로 사원 테이블 ZEMP 에 한 명을 등록하세요.\n· 작업 영역(TYPE zemp)에 값을 채워 INSERT zemp FROM ... 으로 넣습니다.\n· 성공하면 CREATED, 같은 사번이 이미 있으면(sy-subrc ≠ 0) DUPLICATE 를 출력합니다.\n· 채점기는 프로그램이 끝난 뒤 ZEMP 테이블 내용도 함께 비교합니다.',
    tables: ['zemp'], sel: [{ n: 'p_pernr', kind: 'p', decl: 'TYPE zemp-pernr', label: '사번' }, { n: 'p_ename', kind: 'p', decl: 'TYPE zemp-ename', label: '이름' }, { n: 'p_dept', kind: 'p', decl: 'TYPE zemp-dept', label: '부서' }, { n: 'p_sal', kind: 'p', decl: 'TYPE zemp-salary', label: '급여' }],
    tests: [['1005', '정다은', 'SD', 2700], ['1002', '홍길동', 'MM', 1000], ['1000', '한가람', 'PP', 3100]].map(([p_pernr, p_ename, p_dept, p_sal]) => ({ p_pernr, p_ename, p_dept, p_sal, db: { zemp: ZEMP_D() } })),
    ref: ({ p_pernr, p_ename, p_dept, p_sal, db }) => { const t = db.zemp.map(r => r.slice()); let m = 'DUPLICATE'; if (!t.some(r => r[0] === p_pernr)) { t.push([p_pernr, p_ename, p_dept, p_sal]); m = 'CREATED'; } return m + '\n' + dump('zemp', t); },
    sol: "REPORT z_emp_create.\n\nPARAMETERS: p_pernr TYPE zemp-pernr,\n            p_ename TYPE zemp-ename,\n            p_dept  TYPE zemp-dept,\n            p_sal   TYPE zemp-salary.\n\nSTART-OF-SELECTION.\n  DATA gs_emp TYPE zemp.\n  gs_emp-pernr  = p_pernr.\n  gs_emp-ename  = p_ename.\n  gs_emp-dept   = p_dept.\n  gs_emp-salary = p_sal.\n  INSERT zemp FROM gs_emp.\n  IF sy-subrc = 0.\n    COMMIT WORK.\n    WRITE 'CREATED'.\n  ELSE.\n    WRITE 'DUPLICATE'.\n  ENDIF." },
  { id: 5103, lv: 2, kind: 'rpt', tags: ['dml'], title: '부서 급여 인상 (UPDATE)', checkDb: ['zemp'],
    body: '부서 p_dept 의 모든 사원 급여를 p_rate % 올리세요.\n· UPDATE zemp SET salary = ... WHERE ... 한 문장으로 처리합니다. 새 급여 = 급여 × (100 + 인상률) / 100 (반올림)\n· 바뀐 건수(sy-dbcnt)를 "UPDATED 건수"로 출력하고, 해당 사원이 없으면 NO EMPLOYEE 를 출력합니다.\n· 채점기는 ZEMP 테이블 내용도 함께 비교합니다.',
    tables: ['zemp'], sel: [{ n: 'p_dept', kind: 'p', decl: 'TYPE zemp-dept', label: '부서' }, { n: 'p_rate', kind: 'p', decl: 'TYPE i', label: '인상률(%)' }],
    tests: [['IT', 10], ['HR', 3], ['PP', 5]].map(([p_dept, p_rate]) => ({ p_dept, p_rate, db: { zemp: ZEMP_D() } })),
    ref: ({ p_dept, p_rate, db }) => { const t = db.zemp.map(r => r.slice()); let n = 0; t.forEach(r => { if (r[2] === p_dept) { r[3] = rh(r[3] * (100 + p_rate) / 100); n++; } }); return (n ? `UPDATED ${n}` : 'NO EMPLOYEE') + '\n' + dump('zemp', t); },
    sol: "REPORT z_emp_raise.\n\nPARAMETERS: p_dept TYPE zemp-dept,\n            p_rate TYPE i.\n\nSTART-OF-SELECTION.\n  UPDATE zemp\n    SET salary = salary * ( 100 + @p_rate ) / 100\n    WHERE dept = @p_dept.\n  IF sy-dbcnt > 0.\n    COMMIT WORK.\n    WRITE: 'UPDATED', sy-dbcnt.\n  ELSE.\n    WRITE 'NO EMPLOYEE'.\n  ENDIF." },
  { id: 5104, lv: 2, kind: 'rpt', tags: ['dml'], title: '퇴사자 삭제 (DELETE)', checkDb: ['zemp'],
    body: '사번 범위 s_pernr 에 해당하는 사원을 ZEMP 에서 삭제하세요.\n· DELETE FROM zemp WHERE pernr IN s_pernr 를 씁니다.\n· 단, 범위가 비어 있으면 WHERE 가 "전체"가 되어 모든 사원이 지워집니다! 비어 있으면 아무것도 지우지 말고 NO SELECTION 을 출력하세요.\n· 지웠으면 "DELETED 건수"를 출력합니다.',
    tables: ['zemp'], sel: [{ n: 's_pernr', kind: 's', decl: 'FOR zemp-pernr', label: '사번' }],
    tests: [[['I', 'EQ', '1002', '']], [], [['I', 'BT', '1003', '1009']], [['I', 'EQ', '9999', '']]].map(s_pernr => ({ s_pernr, db: { zemp: ZEMP_D() } })),
    ref: ({ s_pernr, db }) => { const t = db.zemp.map(r => r.slice()); if (!s_pernr.length) return 'NO SELECTION\n' + dump('zemp', t); const k = t.filter(r => !jsIn(r[0], s_pernr)); return `DELETED ${t.length - k.length}\n` + dump('zemp', k); },
    sol: "REPORT z_emp_delete.\n\nSELECT-OPTIONS s_pernr FOR zemp-pernr.\n\nSTART-OF-SELECTION.\n  IF s_pernr IS INITIAL.\n    WRITE 'NO SELECTION'.\n    RETURN.\n  ENDIF.\n  DELETE FROM zemp WHERE pernr IN @s_pernr.\n  COMMIT WORK.\n  WRITE: 'DELETED', sy-dbcnt.",
    hint: 'SELECT-OPTIONS 가 비어 있으면 IN 조건은 "모두 참"입니다. DELETE·UPDATE 전에는 꼭 비어 있는지 확인하세요.' },
  { id: 5105, lv: 2, kind: 'rpt', tags: ['alv', 'sd'], title: '판매오더 ALV (REUSE)',
    body: '고객 범위 s_kunnr 의 판매오더(VBAK 전체 필드)를 ALV 로 보여 주세요.\n· SELECT * 로 읽고, 함수 모듈 REUSE_ALV_GRID_DISPLAY 의 TABLES t_outtab 에 넘깁니다. 필드 카탈로그 없이 i_structure_name = \'VBAK\' 를 쓰세요.\n· 오더번호 순으로 정렬해서 넘깁니다.\n(채점기는 ALV 를 "[ALV] / 머리글 / 행" 텍스트로 바꿔 비교합니다.)',
    tables: ['vbak'], sel: [{ n: 's_kunnr', kind: 's', decl: 'FOR vbak-kunnr', label: '고객' }],
    tests: [[], [['I', 'EQ', 'C100', '']], [['I', 'EQ', 'C999', '']]].map(s_kunnr => ({ s_kunnr, db: { vbak: VBAK_D } })),
    ref: ({ s_kunnr, db }) => alvTxt('', ['VBELN', 'ERDAT', 'AUART', 'KUNNR', 'NETWR'], db.vbak.filter(r => jsIn(r[3], s_kunnr)).sort((a, b) => a[0] < b[0] ? -1 : 1).map(r => r.map(String))),
    sol: "REPORT z_vbak_alv.\n\nSELECT-OPTIONS s_kunnr FOR vbak-kunnr.\n\nSTART-OF-SELECTION.\n  DATA gt_itab TYPE TABLE OF vbak.\n  SELECT * FROM vbak\n    WHERE kunnr IN @s_kunnr\n    ORDER BY vbeln\n    INTO TABLE @gt_itab.\n\n  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'\n    EXPORTING\n      i_structure_name = 'VBAK'\n    TABLES\n      t_outtab         = gt_itab." },
  { id: 5106, lv: 2, kind: 'rpt', tags: ['alv', 'sd'], title: '필드 카탈로그 ALV (REUSE)',
    body: '판매오더를 필드 카탈로그를 써서 ALV 로 보여 주세요.\n· 필드 카탈로그(slis_t_fieldcat_alv) 순서: VBELN(머리글 오더번호), KUNNR(고객), NETWR(금액, 합계 do_sum = \'X\')\n· 제목(i_grid_title)은 판매오더 현황 입니다.\n· 오더유형 p_auart 의 오더만, 오더번호 순으로 보여 줍니다.\n(채점기에서 합계 줄은 "합계 | | 금액합" 으로 표시됩니다.)',
    tables: ['vbak'], sel: [{ n: 'p_auart', kind: 'p', decl: 'TYPE vbak-auart', label: '오더유형' }],
    tests: ['OR', 'RE', 'ZZ'].map(p_auart => ({ p_auart, db: { vbak: VBAK_D } })),
    ref: ({ p_auart, db }) => { const r = db.vbak.filter(x => x[2] === p_auart).sort((a, b) => a[0] < b[0] ? -1 : 1); return alvTxt('판매오더 현황', ['오더번호', '고객', '금액'], r.map(x => [x[0], x[3], String(x[4])]), ['합계', '', String(r.reduce((s, x) => s + x[4], 0))]); },
    sol: "REPORT z_vbak_fcat.\n\nTYPE-POOLS slis.\nPARAMETERS p_auart TYPE vbak-auart.\n\nSTART-OF-SELECTION.\n  SELECT vbeln, kunnr, netwr\n    FROM vbak\n    WHERE auart = @p_auart\n    ORDER BY vbeln\n    INTO TABLE @DATA(gt_itab).\n\n  DATA gt_fcat TYPE slis_t_fieldcat_alv.\n  APPEND VALUE #( fieldname = 'VBELN' seltext_m = '오더번호' ) TO gt_fcat.\n  APPEND VALUE #( fieldname = 'KUNNR' seltext_m = '고객' ) TO gt_fcat.\n  APPEND VALUE #( fieldname = 'NETWR' seltext_m = '금액' do_sum = 'X' ) TO gt_fcat.\n\n  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'\n    EXPORTING\n      i_grid_title = '판매오더 현황'\n      it_fieldcat  = gt_fcat\n    TABLES\n      t_outtab     = gt_itab." },
  { id: 5107, lv: 2, kind: 'rpt', noTmplSel: false, tags: ['fm'], title: 'ALPHA 변환 (Function Module)',
    body: 'SAP 은 숫자로만 된 코드를 앞에 0을 채워 저장합니다(내부 형식). 자재코드 p_matnr 를 변환하세요.\n1) CONVERSION_EXIT_ALPHA_INPUT 으로 18자리 내부 형식을 만들어 출력 (받을 변수는 TYPE c LENGTH 18)\n2) 그 값을 CONVERSION_EXIT_ALPHA_OUTPUT 으로 다시 바꿔 출력\n두 줄로 출력하세요. 숫자가 아닌 코드는 그대로 둡니다.',
    tables: [], sel: [{ n: 'p_matnr', kind: 'p', decl: 'TYPE c LENGTH 18', label: '자재' }],
    tests: ['123', 'ABC', '0000456', '9'].map(p_matnr => ({ p_matnr })),
    ref: ({ p_matnr: m }) => { const i = /^\d+$/.test(m) ? m.padStart(18, '0') : m; return `${i}\n${i.replace(/^0+(?=.)/, '')}`; },
    sol: "REPORT z_alpha.\n\nPARAMETERS p_matnr TYPE c LENGTH 18.\n\nSTART-OF-SELECTION.\n  DATA: lv_in  TYPE c LENGTH 18,\n        lv_out TYPE c LENGTH 18.\n\n  CALL FUNCTION 'CONVERSION_EXIT_ALPHA_INPUT'\n    EXPORTING\n      input  = p_matnr\n    IMPORTING\n      output = lv_in.\n\n  CALL FUNCTION 'CONVERSION_EXIT_ALPHA_OUTPUT'\n    EXPORTING\n      input  = lv_in\n    IMPORTING\n      output = lv_out.\n\n  WRITE: / lv_in, / lv_out." },
  { id: 5108, lv: 2, kind: 'rpt', tags: ['fm', 'date'], title: '날짜 함수 (Function Module)',
    body: '기준일 p_date 와 일수 p_days 로 세 줄을 출력하세요.\n1) 그 달의 말일 — LAST_DAY_OF_MONTHS (day_in → last_day_of_month)\n2) 요일 번호(1=월 … 7=일) — DAY_IN_WEEK (datum → wotnr)\n3) p_days 일 뒤의 날짜 — RP_CALC_DATE_IN_INTERVAL (date, days, months = 0, signum = \'+\', years = 0 → calc_date)',
    tables: [], sel: [{ n: 'p_date', kind: 'p', decl: 'TYPE datum', label: '기준일' }, { n: 'p_days', kind: 'p', decl: 'TYPE i', label: '일수' }],
    tests: [['20261109', 30], ['20240215', 20], ['20261231', 1]].map(([p_date, p_days]) => ({ p_date, p_days })),
    ref: ({ p_date: d, p_days: n }) => { const f = x => `${x.getUTCFullYear()}${String(x.getUTCMonth() + 1).padStart(2, '0')}${String(x.getUTCDate()).padStart(2, '0')}`; const dt = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6))); const last = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6), 0)); const w = (dt.getUTCDay() + 6) % 7 + 1; const nx = new Date(dt); nx.setUTCDate(nx.getUTCDate() + n); return `${f(last)}\n${w}\n${f(nx)}`; },
    sol: "REPORT z_date_fm.\n\nPARAMETERS: p_date TYPE datum,\n            p_days TYPE i.\n\nSTART-OF-SELECTION.\n  DATA: lv_last TYPE datum,\n        lv_wday TYPE i,\n        lv_next TYPE datum.\n\n  CALL FUNCTION 'LAST_DAY_OF_MONTHS'\n    EXPORTING day_in = p_date\n    IMPORTING last_day_of_month = lv_last.\n\n  CALL FUNCTION 'DAY_IN_WEEK'\n    EXPORTING datum = p_date\n    IMPORTING wotnr = lv_wday.\n\n  CALL FUNCTION 'RP_CALC_DATE_IN_INTERVAL'\n    EXPORTING\n      date      = p_date\n      days      = p_days\n      months    = 0\n      signum    = '+'\n      years     = 0\n    IMPORTING\n      calc_date = lv_next.\n\n  WRITE: / lv_last, / lv_wday, / lv_next." },
  { id: 5109, lv: 2, kind: 'rpt', tags: ['fm', 'sd'], title: '고객 정보 함수 (Z 함수 모듈)',
    body: '팀에서 만든 함수 모듈 Z_GET_CUSTOMER_INFO 를 호출해 고객 정보를 출력하세요.\n· 인터페이스는 아래 "함수 인터페이스"를 보세요.\n· 고객이 있으면 "고객명 오더건수 오더금액합계", 없으면(예외 NOT_FOUND) NOT FOUND 를 출력합니다.\n· EXCEPTIONS 를 지정해야 예외가 났을 때 프로그램이 멈추지 않습니다.',
    fmDoc: "FUNCTION z_get_customer_info.\n*  IMPORTING  VALUE(iv_kunnr) TYPE kunnr\n*  EXPORTING  VALUE(ev_name)  TYPE string\n*             VALUE(ev_count) TYPE i\n*             VALUE(ev_total) TYPE i\n*  EXCEPTIONS not_found\n*  (KNA1 에서 고객명, VBAK 에서 오더 건수·금액 합계를 구한다)",
    fms: { Z_GET_CUSTOMER_INFO: c => { const k = String(c.I.iv_kunnr || ''); const cu = c.db('kna1').find(r => r.kunnr === k); if (!cu) throw { fmexc: 'not_found' }; const os = c.db('vbak').filter(r => r.kunnr === k); c.E.ev_name = cu.name1; c.E.ev_count = os.length; c.E.ev_total = os.reduce((s, r) => s + r.netwr, 0); c.ET = { ev_name: { k: 'string' }, ev_count: { k: 'i' }, ev_total: { k: 'i' } }; } },
    tables: ['kna1', 'vbak'], sel: [{ n: 'p_kunnr', kind: 'p', decl: 'TYPE kunnr', label: '고객' }],
    tests: ['C100', 'C999', 'C300'].map(p_kunnr => ({ p_kunnr, db: { kna1: KNA1, vbak: VBAK_D } })),
    ref: ({ p_kunnr, db }) => { const c = db.kna1.find(r => r[0] === p_kunnr); if (!c) return 'NOT FOUND'; const o = db.vbak.filter(r => r[3] === p_kunnr); return `${c[1]} ${o.length} ${o.reduce((s, r) => s + r[4], 0)}`; },
    sol: "REPORT z_cust_info.\n\nPARAMETERS p_kunnr TYPE kunnr.\n\nSTART-OF-SELECTION.\n  DATA: lv_name  TYPE string,\n        lv_count TYPE i,\n        lv_total TYPE i.\n\n  CALL FUNCTION 'Z_GET_CUSTOMER_INFO'\n    EXPORTING\n      iv_kunnr  = p_kunnr\n    IMPORTING\n      ev_name   = lv_name\n      ev_count  = lv_count\n      ev_total  = lv_total\n    EXCEPTIONS\n      not_found = 1\n      OTHERS    = 2.\n  IF sy-subrc <> 0.\n    WRITE 'NOT FOUND'.\n  ELSE.\n    WRITE: lv_name, lv_count, lv_total.\n  ENDIF." },

  // =================== Lv.3 ===================
  { id: 5200, lv: 3, tags: ['class'], title: '계좌 클래스 만들기', must: ['CLASS'],
    body: '로컬 클래스 lcl_account 를 만들어 입출금을 처리하세요.\n· constructor: 시작 잔액 iv_balance 를 받습니다.\n· deposit( iv_amt ): 입금\n· withdraw( iv_amt ) RETURNING rv_ok: 잔액이 충분하면 출금하고 abap_true, 모자라면 출금하지 않고 abap_false\n· get_balance( ) RETURNING rv_balance\n시작 잔액 p_start 로 객체를 만들고, 거래 목록 gt_itab 을 차례로 처리하세요. 거래는 D100(100 입금), W50(50 출금) 형식입니다.\n거래마다 "거래 OK" 또는 "거래 REJECT", 마지막 줄에 "BALANCE 잔액"을 출력합니다.',
    inputs: [{ n: 'p_start', t: 'i' }, { n: 'gt_itab', t: 'itab_s' }], inDesc: '거래: D 또는 W + 금액, 1~50행', outDesc: '거래마다 한 줄, 마지막에 잔액을 출력합니다.',
    tests: [[1000, ['D100', 'W500', 'W700', 'D50']], [0, ['W1']], [500, ['W500', 'D10', 'W10']]].map(([p_start, gt_itab]) => ({ p_start, gt_itab })),
    ref: ({ p_start: b, gt_itab }) => { const o = gt_itab.map(t => { const a = +t.slice(1); if (t[0] === 'D') { b += a; return `${t} OK`; } if (a <= b) { b -= a; return `${t} OK`; } return `${t} REJECT`; }); o.push(`BALANCE ${b}`); return o.join('\n'); },
    sol: "CLASS lcl_account DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_balance TYPE i,\n             deposit     IMPORTING iv_amt TYPE i,\n             withdraw    IMPORTING iv_amt TYPE i RETURNING VALUE(rv_ok) TYPE abap_bool,\n             get_balance RETURNING VALUE(rv_balance) TYPE i.\n  PRIVATE SECTION.\n    DATA mv_balance TYPE i.\nENDCLASS.\n\nCLASS lcl_account IMPLEMENTATION.\n  METHOD constructor.\n    mv_balance = iv_balance.\n  ENDMETHOD.\n  METHOD deposit.\n    mv_balance = mv_balance + iv_amt.\n  ENDMETHOD.\n  METHOD withdraw.\n    IF iv_amt <= mv_balance.\n      mv_balance = mv_balance - iv_amt.\n      rv_ok = abap_true.\n    ELSE.\n      rv_ok = abap_false.\n    ENDIF.\n  ENDMETHOD.\n  METHOD get_balance.\n    rv_balance = mv_balance.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA(go_acc) = NEW lcl_account( p_start ).\n  LOOP AT gt_itab INTO DATA(lv_tx).\n    DATA(lv_amt) = CONV i( lv_tx+1 ).\n    IF lv_tx(1) = 'D'.\n      go_acc->deposit( lv_amt ).\n      WRITE: / lv_tx, 'OK'.\n    ELSEIF go_acc->withdraw( lv_amt ) = abap_true.\n      WRITE: / lv_tx, 'OK'.\n    ELSE.\n      WRITE: / lv_tx, 'REJECT'.\n    ENDIF.\n  ENDLOOP.\n  WRITE: / 'BALANCE', go_acc->get_balance( )." },
  { id: 5201, lv: 3, tags: ['class'], title: '상속과 다형성', must: ['CLASS', 'REDEFINITION'],
    body: '사원 목록 gt_itab(이름 name, 구분 kind, 기본급 base)의 급여를 클래스로 계산하세요.\n· lcl_employee: get_pay( ) 는 기본급을 돌려줍니다.\n· lcl_manager: lcl_employee 를 상속(INHERITING FROM)하고, get_pay( ) 를 REDEFINITION 해서 기본급 + 보너스 30% (base * 13 DIV 10) 를 돌려줍니다.\n· kind 가 M 이면 lcl_manager, E 면 lcl_employee 객체를 만들되, 둘 다 TYPE REF TO lcl_employee 변수에 담아 get_pay( ) 를 부르세요.\n"이름 급여"를 한 줄씩, 마지막에 "TOTAL 합계"를 출력합니다.',
    structs: { ty_emp: [{ n: 'name', t: 'string' }, { n: 'kind', t: 'string' }, { n: 'base', t: 'i' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_emp' }], inDesc: 'kind: E(사원) 또는 M(관리자), 1~50행', outDesc: '사원마다 한 줄, 마지막에 합계를 출력합니다.',
    tests: [[['김', 'E', 1000], ['이', 'M', 2000], ['박', 'E', 1500]], [['최', 'M', 999]], [['A', 'E', 0], ['B', 'M', 10]]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => { let t = 0; const o = gt_itab.map(([n, k, b]) => { const p = k === 'M' ? Math.floor(b * 13 / 10) : b; t += p; return `${n} ${p}`; }); o.push(`TOTAL ${t}`); return o.join('\n'); },
    sol: "CLASS lcl_employee DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_base TYPE i,\n             get_pay RETURNING VALUE(rv_pay) TYPE i.\n  PROTECTED SECTION.\n    DATA mv_base TYPE i.\nENDCLASS.\n\nCLASS lcl_manager DEFINITION INHERITING FROM lcl_employee.\n  PUBLIC SECTION.\n    METHODS get_pay REDEFINITION.\nENDCLASS.\n\nCLASS lcl_employee IMPLEMENTATION.\n  METHOD constructor.\n    mv_base = iv_base.\n  ENDMETHOD.\n  METHOD get_pay.\n    rv_pay = mv_base.\n  ENDMETHOD.\nENDCLASS.\n\nCLASS lcl_manager IMPLEMENTATION.\n  METHOD get_pay.\n    rv_pay = mv_base * 13 DIV 10.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA go_emp TYPE REF TO lcl_employee.\n  DATA lv_total TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    IF gs_itab-kind = 'M'.\n      go_emp = NEW lcl_manager( gs_itab-base ).\n    ELSE.\n      go_emp = NEW lcl_employee( gs_itab-base ).\n    ENDIF.\n    DATA(lv_pay) = go_emp->get_pay( ).\n    lv_total = lv_total + lv_pay.\n    WRITE: / gs_itab-name, lv_pay.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_total." },
  { id: 5202, lv: 3, kind: 'rpt', tags: ['alv', 'class', 'mm'], title: 'CL_GUI_ALV_GRID 로 출력', must: ['cl_gui_alv_grid'],
    body: '구매오더 범위 s_ebeln 의 품목(EKPO)을 CL_GUI_ALV_GRID 로 보여 주세요.\n· 필드 카탈로그(lvc_t_fcat) 순서: EBELN(구매오더), EBELP(품목), MATNR(자재), MENGE(수량, do_sum = \'X\')\n· 레이아웃(lvc_s_layo) grid_title 은 구매오더 품목 입니다.\n· 구매오더·품목 순으로 정렬합니다.\n· 그리드는 cl_gui_container=>default_screen 위에 만들고 set_table_for_first_display 로 표시하세요. (채점기에서는 화면(CALL SCREEN) 없이 바로 표시됩니다.)',
    tables: ['ekpo'], sel: [{ n: 's_ebeln', kind: 's', decl: 'FOR ekpo-ebeln', label: '구매오더' }],
    tests: [[], [['I', 'EQ', '45001', '']], [['I', 'EQ', '49999', '']]].map(s_ebeln => ({ s_ebeln, db: { ekpo: EKPO_D } })),
    ref: ({ s_ebeln, db }) => { const r = db.ekpo.filter(x => jsIn(x[0], s_ebeln)).sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); return alvTxt('구매오더 품목', ['구매오더', '품목', '자재', '수량'], r.map(x => [x[0], x[1], x[2], String(x[4])]), ['합계', '', '', String(r.reduce((s, x) => s + x[4], 0))]); },
    sol: "REPORT z_ekpo_grid.\n\nSELECT-OPTIONS s_ebeln FOR ekpo-ebeln.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gs_layo TYPE lvc_s_layo.\n\nSTART-OF-SELECTION.\n  SELECT ebeln, ebelp, matnr, menge\n    FROM ekpo\n    WHERE ebeln IN @s_ebeln\n    ORDER BY ebeln, ebelp\n    INTO TABLE @DATA(gt_itab).\n\n  gt_fcat = VALUE #( ( fieldname = 'EBELN' coltext = '구매오더' )\n                     ( fieldname = 'EBELP' coltext = '품목' )\n                     ( fieldname = 'MATNR' coltext = '자재' )\n                     ( fieldname = 'MENGE' coltext = '수량' do_sum = 'X' ) ).\n  gs_layo-grid_title = '구매오더 품목'.\n\n  CREATE OBJECT go_grid\n    EXPORTING i_parent = cl_gui_container=>default_screen.\n  go_grid->set_table_for_first_display(\n    EXPORTING is_layout       = gs_layo\n    CHANGING  it_outtab       = gt_itab\n              it_fieldcatalog = gt_fcat ).\n  CALL SCREEN 100." },
  { id: 5203, lv: 3, kind: 'rpt', tags: ['alv', 'event', 'sd'], title: 'ALV 더블클릭 이벤트', must: ['cl_gui_alv_grid', 'double_click'],
    body: '판매오더(VBAK)를 CL_GUI_ALV_GRID 로 보여 주고, 행을 더블클릭하면 그 오더의 품목 정보를 메시지로 보여 주세요.\n· ALV 열: VBELN(오더번호), KUNNR(고객), NETWR(금액) — 오더번호 순\n· 이벤트 핸들러 클래스 lcl_handler 에 double_click 이벤트 메서드를 만들고 SET HANDLER 로 연결합니다.\n· 더블클릭하면 VBAP 에서 그 오더의 품목 수와 수량 합계를 읽어 MESSAGE |오더번호 ITEMS 품목수 QTY 수량합| TYPE \'I\' 로 보여 줍니다.\n· 채점기가 테스트마다 "n번째 행 더블클릭"을 대신 일으킵니다(e_row-index = n).',
    tables: ['vbak', 'vbap'], sel: [],
    tests: [[{ ev: 'double_click', row: 3, col: 'VBELN' }], [{ ev: 'double_click', row: 1, col: 'NETWR' }, { ev: 'double_click', row: 2, col: 'KUNNR' }], [{ ev: 'double_click', row: 4, col: 'VBELN' }]].map(events => ({ events, db: { vbak: VBAK_D, vbap: VBAP_D } })),
    ref: ({ events, db }) => { const r = db.vbak.slice().sort((a, b) => a[0] < b[0] ? -1 : 1); const out = [alvTxt('', ['오더번호', '고객', '금액'], r.map(x => [x[0], x[3], String(x[4])]))]; for (const e of events) { const o = r[e.row - 1]; const it = db.vbap.filter(x => x[0] === o[0]); out.push(`${o[0]} ITEMS ${it.length} QTY ${it.reduce((s, x) => s + x[3], 0)}`); } return out.join('\n'); },
    sol: "REPORT z_vbak_dblclick.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF vbak.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    METHODS on_double_click FOR EVENT double_click OF cl_gui_alv_grid\n      IMPORTING e_row e_column.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_double_click.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row-index.\n    CHECK sy-subrc = 0.\n    SELECT COUNT(*) AS cnt, SUM( kwmeng ) AS qty\n      FROM vbap\n      WHERE vbeln = @gs_itab-vbeln\n      INTO ( @DATA(lv_cnt), @DATA(lv_qty) ).\n    MESSAGE |{ gs_itab-vbeln } ITEMS { lv_cnt } QTY { lv_qty }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT vbeln, kunnr, netwr\n    FROM vbak\n    ORDER BY vbeln\n    INTO CORRESPONDING FIELDS OF TABLE @gt_itab.\n\n  gt_fcat = VALUE #( ( fieldname = 'VBELN' coltext = '오더번호' )\n                     ( fieldname = 'KUNNR' coltext = '고객' )\n                     ( fieldname = 'NETWR' coltext = '금액' ) ).\n  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).\n  DATA(go_handler) = NEW lcl_handler( ).\n  SET HANDLER go_handler->on_double_click FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },
  { id: 5204, lv: 3, kind: 'rpt', tags: ['alv', 'event', 'sd'], title: 'ALV 핫스팟 이벤트', must: ['cl_gui_alv_grid', 'hotspot_click'],
    body: '고객 마스터(KNA1)를 ALV 로 보여 주고, 고객번호를 클릭(핫스팟)하면 그 고객의 판매 실적을 메시지로 보여 주세요.\n· ALV 열: KUNNR(고객번호, hotspot = \'X\'), NAME1(고객명) — 고객번호 순\n· hotspot_click 이벤트 핸들러에서 e_row_id-index 로 행을 찾고, VBAK 에서 오더 건수와 금액 합계를 구해 MESSAGE |고객명: ORDERS 건수 TOTAL 합계| TYPE \'I\' 로 보여 줍니다.',
    tables: ['kna1', 'vbak'], sel: [],
    tests: [[{ ev: 'hotspot_click', row: 1, col: 'KUNNR' }], [{ ev: 'hotspot_click', row: 3, col: 'KUNNR' }, { ev: 'hotspot_click', row: 2, col: 'KUNNR' }]].map(events => ({ events, db: { kna1: KNA1, vbak: VBAK_D } })),
    ref: ({ events, db }) => { const r = db.kna1.slice().sort((a, b) => a[0] < b[0] ? -1 : 1); const out = [alvTxt('', ['고객번호', '고객명'], r.map(x => [x[0], x[1]]))]; for (const e of events) { const c = r[e.row - 1]; const o = db.vbak.filter(x => x[3] === c[0]); out.push(`${c[1]}: ORDERS ${o.length} TOTAL ${o.reduce((s, x) => s + x[4], 0)}`); } return out.join('\n'); },
    sol: "REPORT z_kna1_hotspot.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF kna1.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    CLASS-METHODS on_hotspot FOR EVENT hotspot_click OF cl_gui_alv_grid\n      IMPORTING e_row_id e_column_id.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_hotspot.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row_id-index.\n    SELECT COUNT(*) AS cnt, SUM( netwr ) AS total\n      FROM vbak\n      WHERE kunnr = @gs_itab-kunnr\n      INTO ( @DATA(lv_cnt), @DATA(lv_total) ).\n    MESSAGE |{ gs_itab-name1 }: ORDERS { lv_cnt } TOTAL { lv_total }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT * FROM kna1 ORDER BY kunnr INTO TABLE @gt_itab.\n  gt_fcat = VALUE #( ( fieldname = 'KUNNR' coltext = '고객번호' hotspot = 'X' )\n                     ( fieldname = 'NAME1' coltext = '고객명' ) ).\n  CREATE OBJECT go_grid EXPORTING i_parent = cl_gui_container=>default_screen.\n  SET HANDLER lcl_handler=>on_hotspot FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },
  { id: 5205, lv: 3, kind: 'rpt', tags: ['alv', 'event', 'dml', 'mm'], title: 'ALV 버튼 명령 (user_command)', must: ['cl_gui_alv_grid', 'user_command'], checkDb: ['zproduct'],
    body: '제품 테이블 ZPRODUCT 를 ALV 로 보여 주고, 툴바 버튼 명령을 처리하세요.\n· 처음에 제품 전체를 제품코드 순으로 표시합니다(필드 카탈로그 없이 열 이름 그대로).\n· user_command 이벤트의 e_ucomm 이\n  - PRICE_UP 이면: 모든 제품 단가를 10% 올리고(price * 110 / 100, 반올림) DB 도 UPDATE zproduct FROM TABLE 로 바꿉니다.\n  - CLEAN 이면: 재고(stock)가 0인 제품을 DB 와 화면 테이블에서 지웁니다.\n· 명령을 처리한 뒤 refresh_table_display( ) 로 ALV 를 다시 그립니다.\n· 채점기가 테스트마다 버튼 명령을 차례로 일으키고, 마지막에 ZPRODUCT 내용도 비교합니다.',
    tables: ['zproduct'], sel: [],
    tests: [[{ ev: 'user_command', ucomm: 'PRICE_UP' }], [{ ev: 'user_command', ucomm: 'CLEAN' }, { ev: 'user_command', ucomm: 'PRICE_UP' }], [{ ev: 'user_command', ucomm: 'HELP' }]].map(events => ({ events, db: { zproduct: ZPROD_D() } })),
    ref: ({ events, db }) => { let t = db.zproduct.map(r => r.slice()).sort((a, b) => a[0] < b[0] ? -1 : 1); const show = () => alvTxt('', ['MATNR', 'MAKTX', 'PRICE', 'STOCK'], t.map(r => r.map(String))); const out = [show()]; for (const e of events) { if (e.ucomm === 'PRICE_UP') { t.forEach(r => r[2] = rh(r[2] * 110 / 100)); out.push(show()); } else if (e.ucomm === 'CLEAN') { t = t.filter(r => r[3] !== 0); out.push(show()); } } out.push(dump('zproduct', t)); return out.join('\n'); },
    sol: "REPORT z_product_cmd.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_itab TYPE TABLE OF zproduct.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    METHODS on_command FOR EVENT user_command OF cl_gui_alv_grid\n      IMPORTING e_ucomm.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_command.\n    CASE e_ucomm.\n      WHEN 'PRICE_UP'.\n        LOOP AT gt_itab INTO DATA(gs_itab).\n          gs_itab-price = gs_itab-price * 110 / 100.\n          MODIFY gt_itab FROM gs_itab.\n        ENDLOOP.\n        UPDATE zproduct FROM TABLE @gt_itab.\n      WHEN 'CLEAN'.\n        DELETE FROM zproduct WHERE stock = 0.\n        DELETE gt_itab WHERE stock = 0.\n      WHEN OTHERS.\n        RETURN.\n    ENDCASE.\n    COMMIT WORK.\n    go_grid->refresh_table_display( ).\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT * FROM zproduct ORDER BY matnr INTO TABLE @gt_itab.\n  CREATE OBJECT go_grid EXPORTING i_parent = cl_gui_container=>default_screen.\n  DATA(go_handler) = NEW lcl_handler( ).\n  SET HANDLER go_handler->on_command FOR go_grid.\n  go_grid->set_table_for_first_display( EXPORTING i_structure_name = 'ZPRODUCT'\n                                        CHANGING  it_outtab        = gt_itab )." },
  { id: 5206, lv: 3, kind: 'rpt', noTmplSel: false, tags: ['crud', 'dml'], title: '사원 관리 CRUD 리포트', checkDb: ['zemp'],
    body: '라디오버튼으로 작업을 골라 사원 테이블 ZEMP 를 관리하는 리포트를 만드세요.\n· r_c 등록(Create): 같은 사번이 있으면 MESSAGE \'ALREADY EXISTS\' TYPE \'E\', 없으면 INSERT 후 CREATED\n· r_r 조회(Read): "사번 이름 부서 급여" 출력, 없으면 NOT FOUND\n· r_u 수정(Update): 이름·부서·급여를 선택 화면 값으로 바꾸고 UPDATED, 없으면 NOT FOUND\n· r_d 삭제(Delete): 지우고 DELETED, 없으면 NOT FOUND\n· 등록·수정·삭제가 성공하면 COMMIT WORK 하세요. 채점기는 ZEMP 내용도 함께 비교합니다.',
    tables: ['zemp'], sel: [{ n: 'r_c', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '등록' }, { n: 'r_r', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '조회' }, { n: 'r_u', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '수정' }, { n: 'r_d', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '삭제' }, { n: 'p_pernr', kind: 'p', decl: 'TYPE zemp-pernr', label: '사번' }, { n: 'p_ename', kind: 'p', decl: 'TYPE zemp-ename', label: '이름' }, { n: 'p_dept', kind: 'p', decl: 'TYPE zemp-dept', label: '부서' }, { n: 'p_sal', kind: 'p', decl: 'TYPE zemp-salary', label: '급여' }],
    tests: [['C', '1005', '정다은', 'SD', 2700], ['R', '1003', '', '', 0], ['U', '1002', '이영희', 'FI', 2600], ['D', '1004', '', '', 0], ['C', '1001', '중복', 'IT', 1], ['U', '9999', 'X', 'X', 1], ['R', '9999', '', '', 0], ['D', '9999', '', '', 0]]
      .map(([m, p_pernr, p_ename, p_dept, p_sal]) => ({ r_c: m === 'C' ? 'X' : '', r_r: m === 'R' ? 'X' : '', r_u: m === 'U' ? 'X' : '', r_d: m === 'D' ? 'X' : '', p_pernr, p_ename, p_dept, p_sal, db: { zemp: ZEMP_D() } })),
    ref: (x) => { let t = x.db.zemp.map(r => r.slice()); const i = t.findIndex(r => r[0] === x.p_pernr); let m;
      if (x.r_c === 'X') { if (i >= 0) m = 'ALREADY EXISTS'; else { t.push([x.p_pernr, x.p_ename, x.p_dept, x.p_sal]); m = 'CREATED'; } }
      else if (x.r_r === 'X') m = i >= 0 ? t[i].join(' ') : 'NOT FOUND';
      else if (x.r_u === 'X') { if (i >= 0) { t[i] = [x.p_pernr, x.p_ename, x.p_dept, x.p_sal]; m = 'UPDATED'; } else m = 'NOT FOUND'; }

(function finalize() {
  const ren = s => s == null ? s : String(s).replace(/\blt_q\b/g, 'gt_query').replace(/\blt_(\w+)/g, 'gt_$1').replace(/\blt\b/g, 'gt_itab');
  const NAME = { lt: 'gt_itab', lt_cond: 'gt_cond', lt_q: 'gt_query' };
  for (const p of [...PROBLEMS, ...PRACTICE]) {
    if (EASY[p.id]) p.body = EASY[p.id];
    p.sol = ren(p.sol); p.hint = ren(p.hint); p.inDesc = ren(p.inDesc); p.outDesc = ren(p.outDesc);
    for (const d of p.inputs) if (NAME[d.n]) d.n = NAME[d.n];
    for (const t of p.tests) for (const [o, n] of Object.entries(NAME)) if (o in t.in) { t.in[n] = t.in[o]; delete t.in[o]; }
  }
  for (const p of [...PROBLEMS, ...PRACTICE]) if (p.outDesc) p.outDesc = p.outDesc.replace(/한다\.$/, '합니다.').replace(/둔다\.$/, '둡니다.');
  for (const s of STAGES) s.tip = ren(s.tip);
})();

(function applyLv() {
  const all = [...PROBLEMS, ...PRACTICE];
  for (const [lv, ids] of Object.entries(LV_RULE)) for (const id of ids) { const p = all.find(x => x.id === id); if (!p) throw new Error('no ' + id); p.lv = +lv; }

function reuse(oldId, over) {
  const old = [...PROBLEMS, ...PRACTICE].find(p => p.id === oldId);
  if (!old) throw new Error('reuse: 없는 문제 ' + oldId);
  const p = Object.assign({}, old, { st: undefined, modprog: false, curr: false, tags: [], from: oldId }, over);
  p.tests = old.tests.map(t => ({ in: t.in, out: t.out }));
  return p;
}
// 새 문제 마무리: 테스트 출력 계산
function finish(p) {
  if (p.kind === 'rpt') { p.report = true; p.inputs = []; p.outDesc = p.outDesc || '문제에 적힌 형식대로 출력합니다.'; if (!p.sel) p.sel = []; if (!p.tables) p.tables = []; }
  if (!p.tests[0] || !('out' in p.tests[0]) || !('in' in p.tests[0])) p.tests = p.tests.map(inp => ({ in: inp, out: p.ref(inp) }));
  return p;
}
function addMod(mod, list) {
  for (const p of list) { p.mod = mod; if (!p.tags) p.tags = []; MOD_PROBLEMS.push(p.tests && p.tests[0] && 'out' in p.tests[0] && 'in' in p.tests[0] ? p : finish(p)); }
}

      if (p_kbetr > 0) { if (i >= 0) t[i][2] = p_kbetr; else t.push([p_kunnr, p_matnr, p_kbetr]); m = 'SAVED'; } else if (i >= 0) { t.splice(i, 1); m = 'DELETED'; } else m = 'NOT FOUND';
      return m + '\n' + sdPriceDump(t); },
    sol: "REPORT z_sd_price.\n\nPARAMETERS: p_kunnr TYPE zsd_price-kunnr,\n            p_matnr TYPE zsd_price-matnr,\n            p_kbetr TYPE zsd_price-kbetr.\n\nSTART-OF-SELECTION.\n  IF p_kbetr > 0.\n    DATA(gs_price) = VALUE zsd_price( kunnr = p_kunnr matnr = p_matnr kbetr = p_kbetr ).\n    MODIFY zsd_price FROM gs_price.\n    COMMIT WORK.\n    WRITE 'SAVED'.\n  ELSE.\n    DELETE FROM zsd_price WHERE kunnr = @p_kunnr AND matnr = @p_matnr.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'DELETED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n  ENDIF." },

  // =================== Lv.3 중급 ===================
  reuse(5203, { id: 6132, lv: 3, fields: [['vbak-vbeln', '오더 번호'], ['vbak-kunnr', '판매처'], ['vbak-netwr', '오더 순금액'], ['vbap-kwmeng', '품목 주문 수량']] }),
  { id: 6134, lv: 3, kind: 'rpt', title: '고객별 단가 CRUD 리포트', checkDb: ['zsd_price'],
    body: '라디오버튼으로 작업을 골라 고객별 단가 테이블 ZSD_PRICE 를 관리하세요.\n· r_c 등록: 같은 고객·자재가 있으면 MESSAGE \'ALREADY EXISTS\' TYPE \'E\', 없으면 INSERT 후 CREATED\n· r_r 조회: "고객 자재 단가", 없으면 NOT FOUND\n· r_u 수정: 단가를 p_kbetr 로 UPDATE 후 UPDATED, 없으면 NOT FOUND\n· r_d 삭제: DELETE 후 DELETED, 없으면 NOT FOUND\n(채점기는 실행 뒤 ZSD_PRICE 내용을 덧붙여 비교합니다.)',
    fields: [['zsd_price-kunnr', '고객 번호'], ['zsd_price-matnr', '자재 번호'], ['zsd_price-kbetr', '조건 금액(단가)']],
    tables: ['zsd_price'], sel: [{ n: 'r_c', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '등록' }, { n: 'r_r', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '조회' }, { n: 'r_u', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '수정' }, { n: 'r_d', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '삭제' },
      { n: 'p_kunnr', kind: 'p', decl: 'TYPE zsd_price-kunnr', label: '고객' }, { n: 'p_matnr', kind: 'p', decl: 'TYPE zsd_price-matnr', label: '자재' }, { n: 'p_kbetr', kind: 'p', decl: 'TYPE zsd_price-kbetr', label: '단가' }],
    tests: [['C', 'C200', 'M2', 60], ['C', 'C100', 'M1', 1], ['R', 'C100', 'M2', 0], ['R', 'C200', 'M2', 0], ['U', 'C300', 'M3', 75], ['U', 'C300', 'M1', 75], ['D', 'C100', 'M1', 0], ['D', 'C999', 'M1', 0]]
      .map(([m, p_kunnr, p_matnr, p_kbetr]) => ({ r_c: m === 'C' ? 'X' : '', r_r: m === 'R' ? 'X' : '', r_u: m === 'U' ? 'X' : '', r_d: m === 'D' ? 'X' : '', p_kunnr, p_matnr, p_kbetr, db: { zsd_price: SD_PRICE_D() } })),
    ref: (x) => { const t = x.db.zsd_price.map(r => r.slice()); const i = t.findIndex(r => r[0] === x.p_kunnr && r[1] === x.p_matnr); let m;
      if (x.r_c === 'X') { if (i >= 0) m = 'ALREADY EXISTS'; else { t.push([x.p_kunnr, x.p_matnr, x.p_kbetr]); m = 'CREATED'; } }
      else if (x.r_r === 'X') m = i >= 0 ? t[i].join(' ') : 'NOT FOUND';
      else if (x.r_u === 'X') { if (i >= 0) { t[i][2] = x.p_kbetr; m = 'UPDATED'; } else m = 'NOT FOUND'; }
      else { if (i >= 0) { t.splice(i, 1); m = 'DELETED'; } else m = 'NOT FOUND'; }
      return m + '\n' + sdPriceDump(t); },
    sol: "REPORT z_sd_price_crud.\n\nPARAMETERS: r_c RADIOBUTTON GROUP g1,\n            r_r RADIOBUTTON GROUP g1,\n            r_u RADIOBUTTON GROUP g1,\n            r_d RADIOBUTTON GROUP g1.\nPARAMETERS: p_kunnr TYPE zsd_price-kunnr,\n            p_matnr TYPE zsd_price-matnr,\n            p_kbetr TYPE zsd_price-kbetr.\n\nSTART-OF-SELECTION.\n  DATA(gs_price) = VALUE zsd_price( kunnr = p_kunnr matnr = p_matnr kbetr = p_kbetr ).\n\n  IF r_c = 'X'.\n    SELECT SINGLE kunnr FROM zsd_price WHERE kunnr = @p_kunnr AND matnr = @p_matnr INTO @DATA(lv_kunnr).\n    IF sy-subrc = 0.\n      MESSAGE 'ALREADY EXISTS' TYPE 'E'.\n    ENDIF.\n    INSERT zsd_price FROM gs_price.\n    COMMIT WORK.\n    WRITE 'CREATED'.\n\n  ELSEIF r_r = 'X'.\n    SELECT SINGLE * FROM zsd_price WHERE kunnr = @p_kunnr AND matnr = @p_matnr INTO @DATA(gs_read).\n    IF sy-subrc = 0.\n      WRITE: gs_read-kunnr, gs_read-matnr, gs_read-kbetr.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n\n  ELSEIF r_u = 'X'.\n    UPDATE zsd_price SET kbetr = @p_kbetr WHERE kunnr = @p_kunnr AND matnr = @p_matnr.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'UPDATED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n\n  ELSE.\n    DELETE FROM zsd_price WHERE kunnr = @p_kunnr AND matnr = @p_matnr.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'DELETED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n  ENDIF." },

  // =================== Lv.4 고급 ===================
  reuse(4001, { id: 6141, lv: 4, fields: [['vbak-erdat', '오더 생성일'], ['vbak-kunnr', '판매처'], ['vbak-netwr', '오더 순금액'], ['kna1-name1', '고객명']] }),
