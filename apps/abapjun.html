addMod('fi', [
  // ---------- Lv.1 ----------
  { id: 6414, lv: 1, title: '전표 품목 정렬과 합계 (인터널 테이블)',
    body: '전표 한 장의 품목이 gt_itab(품목번호 buzei, 차대 shkzg, 금액 dmbtr)에 들어 있습니다.\n1) 금액이 큰 순으로 SORT 한 뒤 첫 행을 읽어 "MAX 품목번호 금액"\n2) LOOP 로 차변(S)·대변(H) 합계를 구해 "DEBIT 차변합 CREDIT 대변합"\n3) "LINES 품목수"\n세 줄을 출력하세요.',
    fields: [['bseg-buzei', '전표 품목 번호 (001, 002 …)'], ['bseg-shkzg', '차변(S)/대변(H)'], ['bseg-dmbtr', '현지통화 금액']],
    structs: { ty_bseg: [{ n: 'buzei', t: 'string' }, { n: 'shkzg', t: 'string' }, { n: 'dmbtr', t: 'i' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_bseg' }], inDesc: 'gt_itab: 1~50행, 금액은 서로 다름', outDesc: '세 줄을 출력합니다.',
    tests: [[['001', 'S', 1100], ['002', 'H', 1000], ['003', 'H', 100]], [['001', 'S', 500], ['002', 'H', 499]], [['001', 'H', 70]], [['001', 'S', 30], ['002', 'S', 40], ['003', 'H', 75]]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => { const m = gt_itab.slice().sort((a, b) => b[2] - a[2])[0]; const s = gt_itab.filter(x => x[1] === 'S').reduce((a, x) => a + x[2], 0); const h = gt_itab.filter(x => x[1] === 'H').reduce((a, x) => a + x[2], 0); return `MAX ${m[0]} ${m[2]}\nDEBIT ${s} CREDIT ${h}\nLINES ${gt_itab.length}`; },
    sol: "DATA: lv_debit  TYPE i,\n      lv_credit TYPE i.\n\nSORT gt_itab BY dmbtr DESCENDING.\nREAD TABLE gt_itab INTO DATA(gs_line) INDEX 1.\nWRITE: 'MAX', gs_line-buzei, gs_line-dmbtr.\n\nLOOP AT gt_itab INTO gs_line.\n  IF gs_line-shkzg = 'S'.\n    lv_debit = lv_debit + gs_line-dmbtr.\n  ELSE.\n    lv_credit = lv_credit + gs_line-dmbtr.\n  ENDIF.\nENDLOOP.\nWRITE: / 'DEBIT', lv_debit, 'CREDIT', lv_credit.\nWRITE: / 'LINES', lines( gt_itab )." },

  // ---------- Lv.2 ----------
  { id: 6422, lv: 2, kind: 'rpt', title: '계정별 차대 잔액 (WITH + BSIS + SKAT)', tables: ['bsis', 'skat'],
    body: '회사코드 p_bukrs 의 G/L 미결 항목(BSIS)을 계정별로 차변·대변 합계를 내고, 한국어 계정명(SKAT, spras = \'3\')과 함께 보여 주세요.\n· WITH 로 공통 테이블 식 두 개를 만드세요: +deb(shkzg = \'S\' 인 계정별 SUM( dmbtr )), +cre(shkzg = \'H\' 인 계정별 SUM( dmbtr )).\n· 본 SELECT 에서 SKAT 을 기준으로 +deb, +cre 를 LEFT OUTER JOIN 하고, 둘 중 하나라도 있는 계정만 고릅니다(IS NOT NULL).\n· 계정 순으로 "계정 계정명 DEBIT 차변 CREDIT 대변 BALANCE 차변-대변", 없으면 NO DATA.',
    fields: [['bsis-hkont', 'G/L 계정'], ['bsis-shkzg', '차변(S)/대변(H)'], ['bsis-dmbtr', '금액'], ['skat-txt50', '계정명']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsis-bukrs', label: '회사코드' }],
    tests: ['1000', '2000', '9000'].map(p_bukrs => ({ p_bukrs, db: { bsis: FI_BSIS, skat: FI_SKAT } })),
    ref: ({ p_bukrs, db }) => { const m = {}; db.bsis.filter(x => x[0] === p_bukrs).forEach(x => { const o = m[x[1]] = m[x[1]] || { d: 0, c: 0 }; if (x[4] === 'S') o.d += x[5]; else o.c += x[5]; }); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; return k.map(a => `${a} ${db.skat.find(t => t[0] === a && t[1] === '3')[2]} DEBIT ${m[a].d} CREDIT ${m[a].c} BALANCE ${m[a].d - m[a].c}`).join('\n'); },
    sol: "REPORT zfi_gl_with.\n\nPARAMETERS p_bukrs TYPE bsis-bukrs.\n\nSTART-OF-SELECTION.\n  WITH +deb AS ( SELECT hkont, SUM( dmbtr ) AS amt\n                   FROM bsis\n                   WHERE bukrs = @p_bukrs AND shkzg = 'S'\n                   GROUP BY hkont ),\n       +cre AS ( SELECT hkont, SUM( dmbtr ) AS amt\n                   FROM bsis\n                   WHERE bukrs = @p_bukrs AND shkzg = 'H'\n                   GROUP BY hkont )\n  SELECT t~saknr, t~txt50, d~amt AS debit, c~amt AS credit\n    FROM skat AS t\n    LEFT OUTER JOIN +deb AS d ON d~hkont = t~saknr\n    LEFT OUTER JOIN +cre AS c ON c~hkont = t~saknr\n    WHERE ( d~hkont IS NOT NULL OR c~hkont IS NOT NULL )\n      AND t~spras = '3'\n    ORDER BY t~saknr\n    INTO TABLE @DATA(gt_itab).\n\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(lv_bal) = gs_itab-debit - gs_itab-credit.\n    WRITE: / gs_itab-saknr, gs_itab-txt50, 'DEBIT', gs_itab-debit, 'CREDIT', gs_itab-credit, 'BALANCE', lv_bal.\n  ENDLOOP." },

  { id: 6423, lv: 2, kind: 'rpt', title: '미결 채권 있는 고객 (EXISTS / NOT EXISTS)', tables: ['kna1', 'bsid'],
    body: '회사코드 p_bukrs 기준으로 고객 마스터(KNA1)를 두 무리로 나누세요.\n· 그 회사코드에 미결 채권(BSID)이 하나라도 있는 고객: WHERE EXISTS ( SELECT … FROM bsid WHERE bsid~kunnr = kna1~kunnr AND bsid~bukrs = @p_bukrs )\n· 하나도 없는 고객: WHERE NOT EXISTS ( … )\n먼저 미결 있는 고객을 고객번호 순으로 "OPEN 고객 고객명", 이어서 없는 고객을 "CLEAN 고객 고객명", 마지막 줄 "COUNT 미결고객수 / 전체고객수".',
    fields: [['kna1-kunnr', '고객번호'], ['kna1-name1', '고객명'], ['bsid-bukrs', '회사코드'], ['bsid-kunnr', '미결 항목의 고객번호']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsid-bukrs', label: '회사코드' }],
    tests: ['1000', '2000', '3000'].map(p_bukrs => ({ p_bukrs, db: { kna1: FI_KNA1, bsid: FI_BSID } })),
    ref: ({ p_bukrs, db }) => { const has = k => db.bsid.some(x => x[0] === p_bukrs && x[1] === k); const c = db.kna1.slice().sort((a, b) => a[0] < b[0] ? -1 : 1); const o = c.filter(x => has(x[0])), n = c.filter(x => !has(x[0])); return [...o.map(x => `OPEN ${x[0]} ${x[1]}`), ...n.map(x => `CLEAN ${x[0]} ${x[1]}`), `COUNT ${o.length} / ${c.length}`].join('\n'); },
    sol: "REPORT zfi_ar_exists.\n\nPARAMETERS p_bukrs TYPE bsid-bukrs.\n\nSTART-OF-SELECTION.\n  SELECT kunnr, name1\n    FROM kna1\n    WHERE EXISTS ( SELECT belnr FROM bsid\n                     WHERE bsid~kunnr = kna1~kunnr\n                       AND bsid~bukrs = @p_bukrs )\n    ORDER BY kunnr\n    INTO TABLE @DATA(gt_open).\n  SELECT kunnr, name1\n    FROM kna1\n    WHERE NOT EXISTS ( SELECT belnr FROM bsid\n                         WHERE bsid~kunnr = kna1~kunnr\n                           AND bsid~bukrs = @p_bukrs )\n    ORDER BY kunnr\n    INTO TABLE @DATA(gt_clean).\n\n  LOOP AT gt_open INTO DATA(gs_open).\n    WRITE: / 'OPEN', gs_open-kunnr, gs_open-name1.\n  ENDLOOP.\n  LOOP AT gt_clean INTO DATA(gs_clean).\n    WRITE: / 'CLEAN', gs_clean-kunnr, gs_clean-name1.\n  ENDLOOP.\n  DATA(lv_all) = lines( gt_open ) + lines( gt_clean ).\n  WRITE: / 'COUNT', lines( gt_open ), '/', lv_all." },

  { id: 6424, lv: 2, kind: 'rpt', title: '전표 헤더와 품목 (FOR ALL ENTRIES)', tables: ['bkpf', 'bseg'],
    body: '회사코드 p_bukrs, 전표유형 범위 s_blart 의 전표 헤더(BKPF)를 읽고, FOR ALL ENTRIES 로 그 전표들의 품목(BSEG)을 한 번에 읽으세요.\n· 전표번호 순으로 "전표번호 유형 LINES 품목수 DEBIT 차변합계"\n· 헤더가 없으면 NO DATA (주의: 드라이버 테이블이 비어 있으면 FOR ALL ENTRIES 는 WHERE 를 무시하고 전부 읽습니다)\n· 주의: FOR ALL ENTRIES 는 결과의 중복 행을 없앱니다. 금액이 같은 품목이 있을 수 있으니 키(buzei)도 함께 읽으세요.',
    fields: [['bkpf-belnr', '전표번호'], ['bkpf-blart', '전표 유형'], ['bseg-buzei', '품목 번호 (키)'], ['bseg-shkzg', '차변/대변'], ['bseg-dmbtr', '금액']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bkpf-bukrs', label: '회사코드' }, { n: 's_blart', kind: 's', decl: 'FOR bkpf-blart', label: '전표유형' }],
    tests: [['1000', []], ['1000', [['I', 'EQ', 'SA', '']]], ['1000', [['I', 'EQ', 'ZZ', '']]], ['2000', []], ['1000', [['E', 'EQ', 'SA', '']]]].map(([p_bukrs, s_blart]) => ({ p_bukrs, s_blart, db: { bkpf: FI_BKPF3, bseg: FI_BSEG3 } })),
    ref: ({ p_bukrs, s_blart, db }) => { const h = db.bkpf.filter(x => x[0] === p_bukrs && fiInR(x[3], s_blart)).sort((a, b) => a[1] < b[1] ? -1 : 1); if (!h.length) return 'NO DATA'; return h.map(x => { const it = db.bseg.filter(y => y[0] === x[0] && y[1] === x[1] && y[2] === x[2]); return `${x[1]} ${x[3]} LINES ${it.length} DEBIT ${it.filter(y => y[5] === 'S').reduce((s, y) => s + y[6], 0)}`; }).join('\n'); },
    sol: "REPORT zfi_doc_fae.\n\nPARAMETERS p_bukrs TYPE bkpf-bukrs.\nSELECT-OPTIONS s_blart FOR bkpf-blart.\n\nSTART-OF-SELECTION.\n  SELECT bukrs, belnr, gjahr, blart\n    FROM bkpf\n    WHERE bukrs = @p_bukrs\n      AND blart IN @s_blart\n    ORDER BY belnr\n    INTO TABLE @DATA(gt_head).\n  IF gt_head IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  SELECT bukrs, belnr, gjahr, buzei, shkzg, dmbtr\n    FROM bseg\n    FOR ALL ENTRIES IN @gt_head\n    WHERE bukrs = @gt_head-bukrs\n      AND belnr = @gt_head-belnr\n      AND gjahr = @gt_head-gjahr\n    INTO TABLE @DATA(gt_item).\n\n  DATA: lv_cnt TYPE i,\n        lv_deb TYPE i.\n  LOOP AT gt_head INTO DATA(gs_head).\n    CLEAR: lv_cnt, lv_deb.\n    LOOP AT gt_item INTO DATA(gs_item) WHERE belnr = gs_head-belnr AND gjahr = gs_head-gjahr.\n      lv_cnt = lv_cnt + 1.\n      IF gs_item-shkzg = 'S'.\n        lv_deb = lv_deb + gs_item-dmbtr.\n      ENDIF.\n    ENDLOOP.\n    WRITE: / gs_head-belnr, gs_head-blart, 'LINES', lv_cnt, 'DEBIT', lv_deb.\n  ENDLOOP." },
]);

const FI_ACDOCA_Z = [...FI_ACDOCA, fiAc('0L', '1000', '2026', '100008', '000001', '25500000', 'S', 100, '010'), fiAc('0L', '1000', '2026', '100008', '000002', '10100000', 'H', -100, '010')];
const FI_AROPEN_DDL = "@EndUserText.label: '고객 미결 채권 (기준일 경과일수)'\ndefine view entity ZI_FI_AROPEN\n  with parameters p_keydt : abap.dats\n  as select from bsid\n  association [0..1] to kna1 as _Customer on $projection.kunnr = _Customer.kunnr\n{\n  key bukrs,\n  key kunnr,\n  key belnr,\n      _Customer.name1 as name1,\n      zfbdt,\n      dmbtr,\n      dats_days_between( zfbdt, $parameters.p_keydt ) as days,\n      _Customer\n}";
const fiTb = (db, poper) => { const m = {}; db.acdoca.filter(x => x[0] === '0L' && x[2] === '2026' && x[13] <= poper).forEach(x => { const k = x[1] + '|' + x[5]; const o = m[k] = m[k] || [x[1], x[5], 0, 0]; o[2] += x[11]; o[3]++; }); return Object.values(m).filter(o => o[2] !== 0).sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); };
addMod('fi', [
  { id: 6431, lv: 3, kind: 'cds', title: 'CDS 첫걸음: 전표 헤더·품목 JOIN (BKPF + BSEG)', tables: ['bkpf', 'bseg'],
    body: 'CDS 뷰 ZI_FI_DOCLINE 을 정의하세요. 회계전표 헤더 BKPF(별칭 h)와 품목 BSEG(별칭 i)를 회사코드·전표번호·회계연도로 INNER JOIN 합니다.\n· 필드(이 이름 그대로): key bukrs, key belnr, key buzei, blart, budat, hkont, shkzg, dmbtr\n· 회사코드 1000 만 (where h.bukrs = \'1000\')\n채점기가 뷰를 읽어 회사코드·전표번호·품목 순으로 출력합니다.',
    fields: [['bkpf-bukrs', '회사코드'], ['bkpf-belnr', '전표번호'], ['bkpf-gjahr', '회계연도 (조인 조건에 필요)'], ['bseg-buzei', '품목 번호'], ['bseg-hkont', 'G/L 계정']],
    show: [{ view: 'zi_fi_docline', cols: ['bukrs', 'belnr', 'buzei', 'blart', 'budat', 'hkont', 'shkzg', 'dmbtr'], order: ['bukrs', 'belnr', 'buzei'] }],
    outDesc: '머리글 줄 다음에 뷰의 행을 한 줄씩 출력합니다(채점기가 출력).',
    tests: [{ db: { bkpf: FI_BKPF3, bseg: FI_BSEG3 } }, { db: { bkpf: FI_BKPF, bseg: FI_BSEG.filter(x => x[1] !== '100003') } }, { db: { bkpf: [], bseg: FI_BSEG } }],
    ref: ({ db }) => { const rows = []; for (const h of db.bkpf.filter(x => x[0] === '1000')) for (const i of db.bseg.filter(x => x[0] === h[0] && x[1] === h[1] && x[2] === h[2])) rows.push([h[0], h[1], i[3], h[3], h[4], i[4], i[5], i[6]]); rows.sort((a, b) => (a[1] + a[2]) < (b[1] + b[2]) ? -1 : 1); return cdsTxt(['bukrs', 'belnr', 'buzei', 'blart', 'budat', 'hkont', 'shkzg', 'dmbtr'], rows); },
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '회계전표 품목'\ndefine view entity ZI_FI_DOCLINE\n  as select from bkpf as h\n    inner join bseg as i on  i.bukrs = h.bukrs\n                         and i.belnr = h.belnr\n                         and i.gjahr = h.gjahr\n{\n  key h.bukrs,\n  key h.belnr,\n  key i.buzei,\n      h.blart,\n      h.budat,\n      i.hkont,\n      i.shkzg,\n      i.dmbtr\n}\nwhere h.bukrs = '1000'" },

  { id: 6432, lv: 3, kind: 'cds', title: '연관과 경로식, CASE·CAST (BSIS → SKAT)', tables: ['bsis', 'skat'],
    body: 'CDS 뷰 ZI_FI_GLITEM 을 정의하세요. 소스는 G/L 미결 항목 BSIS 입니다.\n· 연관: association [0..1] to skat as _Text on $projection.hkont = _Text.saknr and _Text.spras = \'3\'\n· 필드: key bukrs, key hkont, key belnr, _Text.txt50 as gltext(경로식), budat, 부호 금액 amount, 구분 side, 그리고 _Text 노출\n· amount: CASE 로 대변(H)이면 dmbtr * -1, 아니면 dmbtr — 그 결과를 cast( … as abap.dec(15,2) ) 로 소수 2자리 금액으로\n· side: shkzg 가 S 면 \'DEBIT\', 아니면 \'CREDIT\'\n· 회사코드 1000 만',
    fields: [['bsis-hkont', 'G/L 계정'], ['bsis-shkzg', '차변(S)/대변(H)'], ['skat-saknr', 'G/L 계정 (연관 조건)'], ['skat-spras', '언어 (3 = 한국어)'], ['skat-txt50', '계정명']],
    show: [{ view: 'zi_fi_glitem', cols: ['hkont', 'belnr', 'gltext', 'budat', 'amount', 'side'], order: ['hkont', 'belnr'] }],
    outDesc: '머리글 줄 다음에 뷰의 행을 한 줄씩 출력합니다. amount 는 소수 2자리입니다.',
    tests: [{ db: { bsis: FI_BSIS, skat: FI_SKAT } }, { db: { bsis: FI_BSIS, skat: FI_SKAT.filter(x => x[0] !== '21100000') } }, { db: { bsis: [['1000', '25500000', '300100', '20261101', 'H', 1234], ['1000', '11300000', '300101', '20261102', 'S', 5]], skat: [['25500000', 'E', 'Output VAT'], ['11300000', 'E', 'Suspense'], ...FI_SKAT] } }],
    ref: ({ db }) => { const rows = db.bsis.filter(x => x[0] === '1000').map(x => { const t = db.skat.find(s => s[0] === x[1] && s[1] === '3'); return [x[1], x[2], t ? t[2] : '', x[3], (x[4] === 'H' ? -x[5] : x[5]).toFixed(2), x[4] === 'S' ? 'DEBIT' : 'CREDIT']; }).sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); return cdsTxt(['hkont', 'belnr', 'gltext', 'budat', 'amount', 'side'], rows); },
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: 'G/L 미결 항목'\ndefine view entity ZI_FI_GLITEM\n  as select from bsis\n  association [0..1] to skat as _Text on  $projection.hkont = _Text.saknr\n                                      and _Text.spras = '3'\n{\n  key bukrs,\n  key hkont,\n  key belnr,\n      _Text.txt50 as gltext,\n      budat,\n      cast( case shkzg when 'H' then dmbtr * -1\n                       else dmbtr end as abap.dec(15,2) ) as amount,\n      case shkzg when 'S' then 'DEBIT'\n                 else 'CREDIT' end as side,\n      _Text\n}\nwhere bukrs = '1000'" },

  { id: 6433, lv: 3, kind: 'cds', title: '파라미터와 집계: 기간별 시산표 (ACDOCA)', tables: ['acdoca'],
    body: 'CDS 뷰 ZI_FI_TB 를 정의하세요. 유니버설 저널 ACDOCA 로 기간까지의 계정 잔액을 구합니다.\n· 파라미터: with parameters p_poper : abap.numc(3)\n· 조건: 원장 rldnr = \'0L\', 회계연도 gjahr = \'2026\', 기간 poper <= $parameters.p_poper\n· 필드: key rbukrs, key racct, sum( hsl ) as balance, count( * ) as lines\n· 회사코드·계정별 GROUP BY, 잔액이 0 인 계정은 having 으로 뺍니다.\n채점기가 p_poper = \'010\' 과 \'011\' 두 번 읽어 출력합니다.',
    fields: [['acdoca-rldnr', '원장 (0L 대표 원장)'], ['acdoca-poper', '전기 기간'], ['acdoca-racct', 'G/L 계정'], ['acdoca-hsl', '현지통화 금액 (대변 음수)']],
    show: [{ view: 'zi_fi_tb', params: { p_poper: '010' }, cols: ['rbukrs', 'racct', 'balance', 'lines'], order: ['rbukrs', 'racct'] }, { view: 'zi_fi_tb', params: { p_poper: '011' }, cols: ['rbukrs', 'racct', 'balance', 'lines'], order: ['rbukrs', 'racct'] }],
    outDesc: '두 번 읽은 결과를 각각 [ZI_FI_TB] 줄 다음에 출력합니다.',
    tests: [{ db: { acdoca: FI_ACDOCA } }, { db: { acdoca: FI_ACDOCA_Z } }, { db: { acdoca: FI_ACDOCA.filter(x => x[13] === '011') } }],
    ref: ({ db }) => ['010', '011'].map(p => '[ZI_FI_TB]\n' + cdsTxt(['rbukrs', 'racct', 'balance', 'lines'], fiTb(db, p))).join('\n'),
    sol: "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '기간별 시산표'\ndefine view entity ZI_FI_TB\n  with parameters p_poper : abap.numc(3)\n  as select from acdoca\n{\n  key rbukrs,\n  key racct,\n      sum( hsl ) as balance,\n      count( * ) as lines\n}\nwhere rldnr = '0L'\n  and gjahr = '2026'\n  and poper <= $parameters.p_poper\ngroup by rbukrs, racct\nhaving sum( hsl ) <> 0" },

  { id: 6434, lv: 3, kind: 'rpt', title: 'ABAP 에서 CDS 소비: 채권 연령 분석 (ZI_FI_AROPEN)', tables: ['bsid', 'kna1'], cds: FI_AROPEN_DDL,
    body: '아래처럼 정의된 CDS 뷰 ZI_FI_AROPEN 을 ABAP 리포트에서 읽어 고객별 채권 연령을 분석하세요.\n\n' + FI_AROPEN_DDL + '\n\n· SELECT … FROM zi_fi_aropen( p_keydt = @p_keydt ) WHERE bukrs = @p_bukrs — 파라미터 뷰는 이름 뒤 괄호로 값을 넘깁니다.\n· days(기준일 - 만기일) 가 0 이하면 NOTDUE, 1~30 이면 D30, 31 이상이면 OVER30 구간으로 금액을 더합니다.\n· 고객번호 순으로 "고객 고객명 NOTDUE 금액 D30 금액 OVER30 금액", 마지막 줄 "TOTAL 전체합계"\n· 미결이 없으면 NO DATA.',
    fields: [['bsid-zfbdt', '만기 계산 기준일'], ['bsid-dmbtr', '미결 금액'], ['kna1-name1', '고객명 (연관 _Customer)']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsid-bukrs', label: '회사코드' }, { n: 'p_keydt', kind: 'p', decl: 'TYPE datum', label: '기준일' }],
    tests: [['1000', '20261110'], ['1000', '20261020'], ['2000', '20261231'], ['9000', '20261110']].map(([p_bukrs, p_keydt]) => ({ p_bukrs, p_keydt, db: { bsid: FI_BSID.concat([['1000', 'C300', '1400020', '20260901', 250]]), kna1: FI_KNA1 } })),
    ref: ({ p_bukrs, p_keydt, db }) => { const r = db.bsid.filter(x => x[0] === p_bukrs); if (!r.length) return 'NO DATA'; const m = {}; r.forEach(x => { const d = ddays(x[3], p_keydt); const o = m[x[1]] = m[x[1]] || [0, 0, 0]; o[d <= 0 ? 0 : d <= 30 ? 1 : 2] += x[4]; }); const k = Object.keys(m).sort(); let t = 0; const out = k.map(c => { t += m[c][0] + m[c][1] + m[c][2]; return `${c} ${db.kna1.find(x => x[0] === c)[1]} NOTDUE ${m[c][0]} D30 ${m[c][1]} OVER30 ${m[c][2]}`; }); return [...out, `TOTAL ${t}`].join('\n'); },
    sol: "REPORT zfi_ar_aging_cds.\n\nPARAMETERS: p_bukrs TYPE bsid-bukrs,\n            p_keydt TYPE datum.\n\nSTART-OF-SELECTION.\n  SELECT kunnr, name1, days, dmbtr\n    FROM zi_fi_aropen( p_keydt = @p_keydt )\n    WHERE bukrs = @p_bukrs\n    ORDER BY kunnr\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  TYPES: BEGIN OF ty_sum,\n           kunnr  TYPE string,\n           name1  TYPE string,\n           notdue TYPE i,\n           d30    TYPE i,\n           over30 TYPE i,\n         END OF ty_sum.\n  DATA: gt_sum TYPE TABLE OF ty_sum,\n        lv_tot TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(gs_sum) = VALUE ty_sum( kunnr = gs_itab-kunnr name1 = gs_itab-name1 ).\n    IF gs_itab-days <= 0.\n      gs_sum-notdue = gs_itab-dmbtr.\n    ELSEIF gs_itab-days <= 30.\n      gs_sum-d30 = gs_itab-dmbtr.\n    ELSE.\n      gs_sum-over30 = gs_itab-dmbtr.\n    ENDIF.\n    COLLECT gs_sum INTO gt_sum.\n    lv_tot = lv_tot + gs_itab-dmbtr.\n  ENDLOOP.\n  LOOP AT gt_sum INTO gs_sum.\n    WRITE: / gs_sum-kunnr, gs_sum-name1, 'NOTDUE', gs_sum-notdue, 'D30', gs_sum-d30, 'OVER30', gs_sum-over30.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lv_tot." }
]);

// ---------- Lv.4 RAP ----------
const FI_BDEF_NOTE = '\n\nBO ZR_FI_JOURNAL (관리형)\n· 루트 엔티티 journal — 테이블 ZFI_JHDR (키 belnr)\n· 하위 엔티티 item — 테이블 ZFI_JITM (키 belnr, buzei), 연관 _item 으로 연결';
const fiJ = (belnr, bldat, blart) => ({ op: 'create', ent: 'journal', rows: [{ '%cid': 'H' + belnr, belnr, bldat, blart, status: 'N' }], fields: ['belnr', 'bldat', 'blart', 'status'] });
const fiI = (belnr, lines) => ({ op: 'cba', ent: 'journal', assoc: '_item', rows: [{ belnr, '%target': lines.map(([buzei, hkont, shkzg, dmbtr]) => ({ '%cid': belnr + buzei, buzei, hkont, shkzg, dmbtr })) }], fields: ['buzei', 'hkont', 'shkzg', 'dmbtr'] });
const FI_RAP_DB = () => ({ zfi_jhdr: FI_JH(), zfi_jitm: FI_JI() });
addMod('fi', [
  { id: 6441, lv: 4, kind: 'rpt', title: 'EML 로 분개 전표 만들기 (MODIFY ENTITIES + COMMIT)', bo: fiBo(), tables: ['zfi_jhdr', 'zfi_jitm'], checkDb: ['zfi_jhdr', 'zfi_jitm'],
    body: 'RAP BO ZR_FI_JOURNAL 에 EML 로 분개 전표 한 장(헤더 + 품목 2줄)을 만드는 리포트를 작성하세요.' + FI_BDEF_NOTE + '\n\n· p_amt 가 0 이하면 INVALID AMOUNT 를 출력하고 끝냅니다.\n· MODIFY ENTITIES OF zr_fi_journal ENTITY journal\n    CREATE FIELDS ( belnr bldat blart status ) WITH … (%cid = \'H1\', bldat \'20261110\', blart \'SA\', status \'N\')\n    CREATE BY \\_item FIELDS ( buzei hkont shkzg dmbtr ) WITH … (001: p_hkdr 차변 S p_amt / 002: p_hkcr 대변 H p_amt)\n    FAILED DATA(…)\n· 실패(failed-journal 이나 failed-item 이 비어 있지 않음)하면 ROLLBACK ENTITIES 후 CREATE FAILED 출력\n· 성공하면 COMMIT ENTITIES 하고, READ ENTITIES … ENTITY journal BY \\_item ALL FIELDS 로 다시 읽어 품목마다 "품목 계정 차대 금액", 마지막에 "POSTED 전표번호 LINES 품목수"\n채점기는 두 테이블 내용도 함께 비교합니다.',
    fields: FI_JFIELDS.concat([['zfi_jitm-hkont', 'G/L 계정 (BSEG-HKONT)']]),
    sel: [{ n: 'p_belnr', kind: 'p', decl: 'TYPE zfi_jhdr-belnr', label: '전표번호' }, { n: 'p_hkdr', kind: 'p', decl: 'TYPE zfi_jitm-hkont', label: '차변 계정' }, { n: 'p_hkcr', kind: 'p', decl: 'TYPE zfi_jitm-hkont', label: '대변 계정' }, { n: 'p_amt', kind: 'p', decl: 'TYPE i', label: '금액' }],
    tests: [['5000002', '51000000', '10100000', 450], ['5000001', '51000000', '10100000', 100], ['5000003', '11000000', '40000000', 0], ['5000009', '10100000', '11000000', 1200]].map(([p_belnr, p_hkdr, p_hkcr, p_amt]) => ({ p_belnr, p_hkdr, p_hkcr, p_amt, db: FI_RAP_DB() })),
    ref: ({ p_belnr, p_hkdr, p_hkcr, p_amt, db }) => { const h = db.zfi_jhdr.map(r => r.slice()), it = db.zfi_jitm.map(r => r.slice()); let msg;
      if (p_amt <= 0) msg = 'INVALID AMOUNT';
      else if (h.some(r => r[0] === p_belnr)) msg = 'CREATE FAILED';
      else { h.push([p_belnr, '20261110', 'SA', 'N', 0]); it.push([p_belnr, '001', p_hkdr, 'S', p_amt], [p_belnr, '002', p_hkcr, 'H', p_amt]); msg = `001 ${p_hkdr} S ${p_amt}\n002 ${p_hkcr} H ${p_amt}\nPOSTED ${p_belnr} LINES 2`; }
      const d2 = (t, rows) => [`[${t.toUpperCase()}]`, ...rows.slice().sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1).map(r => r.join(' '))].join('\n');
      return msg + '\n' + d2('zfi_jhdr', h) + '\n' + d2('zfi_jitm', it); },
    sol: "REPORT zfi_eml_create.\n\nPARAMETERS: p_belnr TYPE zfi_jhdr-belnr,\n            p_hkdr  TYPE zfi_jitm-hkont,\n            p_hkcr  TYPE zfi_jitm-hkont,\n            p_amt   TYPE i.\n\nSTART-OF-SELECTION.\n  IF p_amt <= 0.\n    WRITE 'INVALID AMOUNT'.\n    RETURN.\n  ENDIF.\n\n  MODIFY ENTITIES OF zr_fi_journal\n    ENTITY journal\n      CREATE FIELDS ( belnr bldat blart status )\n        WITH VALUE #( ( %cid = 'H1' belnr = p_belnr bldat = '20261110' blart = 'SA' status = 'N' ) )\n      CREATE BY \\_item FIELDS ( buzei hkont shkzg dmbtr )\n        WITH VALUE #( ( %cid_ref = 'H1' belnr = p_belnr\n                        %target = VALUE #( ( %cid = 'I1' buzei = '001' hkont = p_hkdr shkzg = 'S' dmbtr = p_amt )\n                                           ( %cid = 'I2' buzei = '002' hkont = p_hkcr shkzg = 'H' dmbtr = p_amt ) ) ) )\n    FAILED DATA(ls_failed).\n\n  IF ls_failed-journal IS NOT INITIAL OR ls_failed-item IS NOT INITIAL.\n    ROLLBACK ENTITIES.\n    WRITE 'CREATE FAILED'.\n    RETURN.\n  ENDIF.\n  COMMIT ENTITIES.\n\n  READ ENTITIES OF zr_fi_journal\n    ENTITY journal BY \\_item ALL FIELDS\n      WITH VALUE #( ( belnr = p_belnr ) )\n    RESULT DATA(lt_item).\n  SORT lt_item BY buzei.\n  LOOP AT lt_item INTO DATA(ls_item).\n    WRITE: / ls_item-buzei, ls_item-hkont, ls_item-shkzg, ls_item-dmbtr.\n  ENDLOOP.\n  WRITE: / 'POSTED', p_belnr, 'LINES', lines( lt_item )." },

  { id: 6442, lv: 4, kind: 'rap', title: 'RAP 검증(validation): 차대 균형 검사', outDesc: '채점기가 시나리오의 각 작업 결과(OK/FAILED, FAILED·MSG·RESULT·READ 줄)와 마지막 테이블 내용을 출력합니다.', bo: fiBo({ validations: [{ n: 'validatebalance', on: ['create', 'update'] }] }), inputs: [], tables: ['zfi_jhdr', 'zfi_jitm'], checkDb: ['zfi_jhdr', 'zfi_jitm'],
    body: '분개 전표 BO ZR_FI_JOURNAL 의 저장 시점 검증 validateBalance 를 구현하세요.' + FI_BDEF_NOTE + '\n· BDEF: validation validateBalance on save { create; update; }\n\n행동 구현 클래스 lhc_journal (INHERITING FROM cl_abap_behavior_handler) 에\nMETHODS validatebalance FOR VALIDATE ON SAVE IMPORTING keys FOR journal~validatebalance.\n· READ ENTITIES … IN LOCAL MODE ENTITY journal BY \\_item FIELDS ( shkzg dmbtr ) WITH CORRESPONDING #( keys ) 로 품목을 읽습니다.\n· 전표마다 품목이 없으면 failed-journal 에 %tky 를 넣고 reported-journal 에 메시지 \'품목이 없습니다\'(severity error)\n· 차변(S) 합계와 대변(H) 합계가 다르면 failed 와 메시지 |차대 불일치 { 차변 } / { 대변 }|\n채점기가 생성·수정·커밋 시나리오를 실행해 결과를 출력합니다.',
    fields: FI_JFIELDS.concat([['bseg-shkzg', '차대 균형: 전표의 S 합계 = H 합계']]),
    tests: [

      { db: FI_RAP_DB(), ops: [fiJ('5000003', '20261110', 'SA'), fiI('5000003', [['001', '51000000', 'S', 300], ['002', '10100000', 'H', 250]]), fiJ('5000004', '20261110', 'SA'), fiI('5000004', [['001', '51000000', 'S', 10], ['002', '10100000', 'H', 10]]), { op: 'commit' }] },

    ].map((x, i) => ({ in: x, out: ["ACTION POST OK\n RESULT 5000001 20261101 SA P 0\nCOMMIT OK\n[ZFI_JHDR]\n5000001 20261101 SA P 0\n5000005 20261020 KR P 800","ACTION POST FAILED\n FAILED JOURNAL 5000009 NOT_FOUND\n FAILED JOURNAL 5000005\n MSG JOURNAL 5000005 E:5000005 이미 전기됨\n RESULT 5000001 20261101 SA P 0\nCOMMIT OK\nACTION POST FAILED\n FAILED JOURNAL 5000001\n MSG JOURNAL 5000001 E:5000001 이미 전기됨\n[ZFI_JHDR]\n5000001 20261101 SA P 0\n5000005 20261020 KR P 800","CREATE OK\nACTION POST OK\n RESULT 5000002 20261110 SA P 0\nCOMMIT OK\n[ZFI_JHDR]\n5000001 20261101 SA N 0\n5000002 20261110 SA P 0\n5000005 20261020 KR P 800"][i] })),
    sol: FI_HANDLER_HEAD + "    METHODS post FOR MODIFY\n      IMPORTING keys FOR ACTION journal~post RESULT result.\nENDCLASS.\n\nCLASS lhc_journal IMPLEMENTATION.\n  METHOD post.\n    READ ENTITIES OF zr_fi_journal IN LOCAL MODE\n      ENTITY journal ALL FIELDS WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_head).\n\n    DATA lt_ok LIKE lt_head.\n    LOOP AT lt_head INTO DATA(ls_head).\n      IF ls_head-status = 'P'.\n        APPEND VALUE #( %tky = ls_head-%tky ) TO failed-journal.\n        APPEND VALUE #( %tky = ls_head-%tky\n                        %msg = new_message_with_text( severity = if_abap_behv_message=>severity-error\n                                                      text     = |{ ls_head-belnr } 이미 전기됨| ) ) TO reported-journal.\n      ELSE.\n        APPEND ls_head TO lt_ok.\n      ENDIF.\n    ENDLOOP.\n\n    MODIFY ENTITIES OF zr_fi_journal IN LOCAL MODE\n      ENTITY journal\n        UPDATE FIELDS ( status )\n        WITH VALUE #( FOR o IN lt_ok ( %tky = o-%tky status = 'P' ) ).\n\n    READ ENTITIES OF zr_fi_journal IN LOCAL MODE\n      ENTITY journal ALL FIELDS WITH CORRESPONDING #( lt_ok )\n      RESULT DATA(lt_new).\n    result = VALUE #( FOR n IN lt_new ( %tky = n-%tky %param = n ) ).\n  ENDMETHOD.\nENDCLASS." }

// =================== PGM 4차: 표준 조회 리포트 (FBL3N / FBL5N / FBL1N / 반제 내역) ===================
const fiIn = (v, rs) => {
  const hit = r => { const [, o, lo, hi] = r; return o === 'EQ' ? v === lo : o === 'NE' ? v !== lo : o === 'BT' ? v >= lo && v <= hi : o === 'GE' ? v >= lo : o === 'LE' ? v <= lo : o === 'GT' ? v > lo : o === 'LT' ? v < lo : false; };
  const inc = rs.filter(r => r[0] === 'I'), exc = rs.filter(r => r[0] === 'E');
  return (!inc.length || inc.some(hit)) && !exc.some(hit);
};
const FI_BSID5 = [...FI_BSID, ['1000', 'C300', '1400004', '20261125', 450], ['1000', 'C200', '1400005', '20260920', 120]];
const FI_BSIK5 = [...FI_BSIK, ['1000', 'V300', '5100007', '20260925', 300]];
addMod('fi', [
  { id: 7413, pgm: true, topic: '조회 리포트', kind: 'rpt', title: 'G/L 계정 라인 아이템 (FBL3N)', tables: ['bkpf', 'bseg', 'skat'],
    body: 'SAP 표준 FBL3N(G/L 계정 라인 아이템 조회)처럼, 회사코드 p_bukrs 의 G/L 계정별 전표 품목을 보여 주세요.\n· 전표 헤더 BKPF 와 품목 BSEG 를 회사코드·전표번호·회계연도로 JOIN 하고, 계정 내역은 SKAT(한국어 spras = \'3\')에서 가져옵니다.\n· 계정 s_hkont(BSEG-HKONT), 전기일 s_budat(BKPF-BUDAT) 범위로 거릅니다.\n· p_norev(체크박스)를 체크하면 역분개 관계인 전표(BKPF-STBLG 가 채워진 전표)는 빼세요.\n· 금액은 차변(S) 이면 +, 대변(H) 이면 - 로 표시합니다.\n· 계정, 전기일, 전표번호, 품목 순으로 "계정 계정명 전기일 전표번호 품목 금액"을 출력하고, 마지막 줄에 "TOTAL 금액합계 COUNT 건수".\n· 해당 품목이 없으면 NO DATA.',
    outDesc: '품목마다 "계정 계정명 전기일 전표번호 품목 금액(대변은 -)", 마지막 줄 "TOTAL 합계 COUNT 건수". 없으면 NO DATA.',
    fields: [['bseg-hkont', 'G/L 계정'], ['bseg-shkzg', '차변(S)/대변(H) 지시자'], ['bkpf-budat', '전기일'], ['bkpf-stblg', '역분개 전표번호 (채워져 있으면 역분개 관계)'], ['skat-txt50', 'G/L 계정 내역']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bkpf-bukrs', label: '회사코드' }, { n: 's_hkont', kind: 's', decl: 'FOR bseg-hkont', label: 'G/L 계정' }, { n: 's_budat', kind: 's', decl: 'FOR bkpf-budat', label: '전기일' }, { n: 'p_norev', kind: 'p', decl: 'AS CHECKBOX', label: '역분개 제외' }],
    tests: [['1000', [], [], ''], ['1000', [['I', 'EQ', '11000000', '']], [], 'X'], ['1000', [], [['I', 'BT', '20261001', '20261031']], 'X'], ['1000', [['E', 'EQ', '40000000', ''], ['E', 'EQ', '25500000', '']], [['I', 'GE', '20261015', '']], ''], ['3000', [], [], '']]
      .map(([p_bukrs, s_hkont, s_budat, p_norev]) => ({ p_bukrs, s_hkont, s_budat, p_norev, db: { bkpf: FI_BKPF2, bseg: FI_BSEG2, skat: FI_SKAT } })),
    ref: ({ p_bukrs, s_hkont, s_budat, p_norev, db }) => {
      const rows = [];
      for (const h of db.bkpf) { if (h[0] !== p_bukrs || !fiIn(h[4], s_budat)) continue; if (p_norev === 'X' && h[9]) continue;
        for (const s of db.bseg) if (s[0] === h[0] && s[1] === h[1] && s[2] === h[2] && fiIn(s[4], s_hkont)) { const t = db.skat.find(x => x[0] === s[4] && x[1] === '3'); rows.push([s[4], t ? t[2] : '', h[4], h[1], s[3], s[5] === 'H' ? -s[6] : s[6]]); } }
      if (!rows.length) return 'NO DATA';
      rows.sort((a, b) => (a[0] + a[2] + a[3] + a[4]) < (b[0] + b[2] + b[3] + b[4]) ? -1 : 1);
      return [...rows.map(r => r.join(' ')), `TOTAL ${rows.reduce((s, r) => s + r[5], 0)} COUNT ${rows.length}`].join('\n'); },
    sol: "REPORT zfi_fbl3n.\n\nPARAMETERS p_bukrs TYPE bkpf-bukrs.\nSELECT-OPTIONS: s_hkont FOR bseg-hkont,\n                s_budat FOR bkpf-budat.\nPARAMETERS p_norev AS CHECKBOX.\n\nSTART-OF-SELECTION.\n  SELECT s~hkont, t~txt50, h~budat, h~belnr, s~buzei, s~shkzg, s~dmbtr, h~stblg\n    FROM bkpf AS h\n    INNER JOIN bseg AS s ON s~bukrs = h~bukrs AND s~belnr = h~belnr AND s~gjahr = h~gjahr\n    LEFT OUTER JOIN skat AS t ON t~saknr = s~hkont AND t~spras = '3'\n    WHERE h~bukrs = @p_bukrs\n      AND s~hkont IN @s_hkont\n      AND h~budat IN @s_budat\n    ORDER BY hkont, budat, belnr, buzei\n    INTO TABLE @DATA(gt_itab).\n\n  DATA: lv_amt   TYPE i,\n        lv_total TYPE i,\n        lv_cnt   TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    IF p_norev = 'X' AND gs_itab-stblg IS NOT INITIAL.\n      CONTINUE.\n    ENDIF.\n    lv_amt = gs_itab-dmbtr.\n    IF gs_itab-shkzg = 'H'.\n      lv_amt = - lv_amt.\n    ENDIF.\n    WRITE: / gs_itab-hkont, gs_itab-txt50, gs_itab-budat, gs_itab-belnr, gs_itab-buzei, lv_amt.\n    lv_total = lv_total + lv_amt.\n    lv_cnt = lv_cnt + 1.\n  ENDLOOP.\n  IF lv_cnt = 0.\n    WRITE 'NO DATA'.\n  ELSE.\n    WRITE: / 'TOTAL', lv_total, 'COUNT', lv_cnt.\n  ENDIF." },

  { id: 7414, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '고객 미결 항목 (FBL5N)', tables: ['bsid', 'kna1'],
    body: 'SAP 표준 FBL5N(고객 라인 아이템 조회)의 미결 항목처럼, 회사코드 p_bukrs 의 고객 미결 채권을 기준일 p_keydt 로 보여 주세요.\n· 미결 항목은 BSID, 고객명은 KNA1 에서 읽습니다. 고객 s_kunnr 범위로 거릅니다.\n· 연체일 = 기준일 - 만기일(ZFBDT). 아직 만기 전이면 0 이하가 됩니다.\n· p_over(체크박스)를 체크하면 연체일이 1 이상인 항목만 보여 줍니다.\n· 고객, 만기일, 전표번호 순으로 "고객 고객명 전표번호 만기일 금액 연체일"을 출력하고, 마지막 줄에 "TOTAL 금액합계 COUNT 건수".\n· 항목이 없으면 NO DATA.',
    outDesc: '항목마다 "고객 고객명 전표번호 만기일 금액 연체일", 마지막 줄 "TOTAL 합계 COUNT 건수". 없으면 NO DATA.',
    fields: [['bsid-kunnr', '고객번호'], ['bsid-belnr', '전표번호'], ['bsid-zfbdt', '만기 계산 기준일 (여기서는 만기일)'], ['bsid-dmbtr', '현지통화 금액'], ['kna1-name1', '고객명']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsid-bukrs', label: '회사코드' }, { n: 's_kunnr', kind: 's', decl: 'FOR bsid-kunnr', label: '고객' }, { n: 'p_keydt', kind: 'p', decl: 'TYPE bsid-zfbdt', label: '기준일' }, { n: 'p_over', kind: 'p', decl: 'AS CHECKBOX', label: '연체 항목만' }],
    tests: [['1000', [], '20261031', ''], ['1000', [], '20261031', 'X'], ['1000', [['I', 'BT', 'C200', 'C300']], '20261110', 'X'], ['1000', [['E', 'EQ', 'C100', '']], '20261001', ''], ['1000', [['I', 'EQ', 'C300', '']], '20261101', 'X'], ['2000', [['I', 'EQ', 'C400', '']], '20261031', '']]
      .map(([p_bukrs, s_kunnr, p_keydt, p_over]) => ({ p_bukrs, s_kunnr, p_keydt, p_over, db: { bsid: FI_BSID5, kna1: FI_KNA1 } })),
    ref: ({ p_bukrs, s_kunnr, p_keydt, p_over, db }) => {
      const rows = db.bsid.filter(x => x[0] === p_bukrs && fiIn(x[1], s_kunnr)).map(x => [x[1], db.kna1.find(k => k[0] === x[1])[1], x[2], x[3], x[4], ddays(x[3], p_keydt)])

    body: 'SAP 표준 FBL1N(공급업체 라인 아이템 조회)의 미결 항목을 만기 구간별로 요약해 주세요.\n· 미결 항목은 BSIK, 업체명은 LFA1. 회사코드 p_bukrs, 공급업체 s_lifnr 범위로 거릅니다.\n· 경과일 = 기준일 p_keydt - 만기일(ZFBDT)\n  - 0 이하: 만기 전(NOTDUE)\n  - 1~30일, 31~60일, 61일 이상\n· 업체번호 순으로 "업체 업체명 만기전 1~30 31~60 61이상 합계"를 출력하고, 마지막 줄에 "TOTAL 만기전 1~30 31~60 61이상 합계".\n· 항목이 없으면 NO DATA.',

    ref: ({ p_bukrs, s_lifnr, p_keydt, db }) => {
      const its = db.bsik.filter(x => x[0] === p_bukrs && fiIn(x[1], s_lifnr)); if (!its.length) return 'NO DATA';
      const b = d => d <= 0 ? 0 : d <= 30 ? 1 : d <= 60 ? 2 : 3; const tot = [0, 0, 0, 0, 0];
      const out = [...new Set(its.map(x => x[1]))].sort().map(v => { const a = [0, 0, 0, 0, 0]; for (const x of its.filter(y => y[1] === v)) { a[b(ddays(x[3], p_keydt))] += x[4]; a[4] += x[4]; } a.forEach((n, i) => tot[i] += n); return `${v} ${db.lfa1.find(l => l[0] === v)[1]} ${a.join(' ')}`; });
      return [...out, `TOTAL ${tot.join(' ')}`].join('\n'); },
    sol: "REPORT zfi_fbl1n_aging.\n\nPARAMETERS p_bukrs TYPE bsik-bukrs.\nSELECT-OPTIONS s_lifnr FOR bsik-lifnr.\nPARAMETERS p_keydt TYPE bsik-zfbdt.\n\nTYPES: BEGIN OF ty_age,\n         lifnr  TYPE string,\n         name1  TYPE string,\n         notdue TYPE i,\n         d30    TYPE i,\n         d60    TYPE i,\n         d61    TYPE i,\n         total  TYPE i,\n       END OF ty_age.\nDATA: gt_age TYPE TABLE OF ty_age,\n      gs_tot TYPE ty_age.\n\nSTART-OF-SELECTION.\n  SELECT b~lifnr, l~name1, b~zfbdt, b~dmbtr\n    FROM bsik AS b\n    INNER JOIN lfa1 AS l ON l~lifnr = b~lifnr\n    WHERE b~bukrs = @p_bukrs\n      AND b~lifnr IN @s_lifnr\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(gs_age) = VALUE ty_age( lifnr = gs_itab-lifnr name1 = gs_itab-name1 total = gs_itab-dmbtr ).\n    DATA(lv_days) = p_keydt - gs_itab-zfbdt.\n    IF lv_days <= 0.\n      gs_age-notdue = gs_itab-dmbtr.\n    ELSEIF lv_days <= 30.\n      gs_age-d30 = gs_itab-dmbtr.\n    ELSEIF lv_days <= 60.\n      gs_age-d60 = gs_itab-dmbtr.\n    ELSE.\n      gs_age-d61 = gs_itab-dmbtr.\n    ENDIF.\n    COLLECT gs_age INTO gt_age.\n  ENDLOOP.\n\n  SORT gt_age BY lifnr.\n  LOOP AT gt_age INTO gs_age.\n    WRITE: / gs_age-lifnr, gs_age-name1, gs_age-notdue, gs_age-d30, gs_age-d60, gs_age-d61, gs_age-total.\n    gs_tot-notdue = gs_tot-notdue + gs_age-notdue.\n    gs_tot-d30 = gs_tot-d30 + gs_age-d30.\n    gs_tot-d60 = gs_tot-d60 + gs_age-d60.\n    gs_tot-d61 = gs_tot-d61 + gs_age-d61.\n    gs_tot-total = gs_tot-total + gs_age-total.\n  ENDLOOP.\n  WRITE: / 'TOTAL', gs_tot-notdue, gs_tot-d30, gs_tot-d60, gs_tot-d61, gs_tot-total." },

    body: '원가센터별 실적 gt_itab(kostl 원가센터, wkgbtr 실적)이 주어집니다.\n1) 실적이 가장 큰 원가센터를 찾아 "TOP 원가센터 실적"을 출력하고\n2) 다음 줄에 원가센터 p_kostl 의 "원가센터 실적"을, 없으면 "원가센터 NOT FOUND"를 출력하세요.\nLOOP 없이 SORT ... DESCENDING, READ TABLE ... INDEX / WITH KEY 를 쓰세요. (실적이 같은 원가센터는 없습니다)',
