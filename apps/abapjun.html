    tests: [[{ ev: 'hotspot_click', row: 1, col: 'BELNR' }], [{ ev: 'hotspot_click', row: 2, col: 'BELNR' }, { ev: 'hotspot_click', row: 4, col: 'BELNR' }], [{ ev: 'hotspot_click', row: 3, col: 'BELNR' }]].map(events => ({ events, db: { rbkp: MM_RBKP, rseg: MM_RSEG } })),
    ref: ({ events, db }) => mmAlvEvt(db.rbkp.slice().sort(mmCmp(0)), ['송장번호', '공급업체', '총액', '상태'], [0, 3, 7, 10], events, h => { const it = db.rseg.filter(x => x[0] === h[0] && x[1] === h[1]); return `${h[0]} ITEMS ${it.length} NET ${it.reduce((s, x) => s + x[8], 0)} TAX ${h[8]}`; }),
    sol: "REPORT z_mm_invoice_alv.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF rbkp.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    CLASS-METHODS on_hotspot FOR EVENT hotspot_click OF cl_gui_alv_grid\n      IMPORTING e_row_id e_column_id.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_hotspot.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row_id-index.\n    CHECK sy-subrc = 0.\n    SELECT COUNT(*) AS cnt, SUM( wrbtr ) AS amt\n      FROM rseg\n      WHERE belnr = @gs_itab-belnr\n        AND gjahr = @gs_itab-gjahr\n      INTO ( @DATA(lv_cnt), @DATA(lv_amt) ).\n    MESSAGE |{ gs_itab-belnr } ITEMS { lv_cnt } NET { lv_amt } TAX { gs_itab-wmwst1 }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT * FROM rbkp ORDER BY belnr INTO TABLE @gt_itab.\n  gt_fcat = VALUE #( ( fieldname = 'BELNR'  coltext = '송장번호' hotspot = 'X' )\n                     ( fieldname = 'LIFNR'  coltext = '공급업체' )\n                     ( fieldname = 'RMWWR'  coltext = '총액' )\n                     ( fieldname = 'RBSTAT' coltext = '상태' ) ).\n  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).\n  SET HANDLER lcl_handler=>on_hotspot FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },
  { id: 6232, lv: 3, kind: 'rpt', title: '구매오더 ALV 더블클릭 → 납품일정 (EKPO → EKET)', must: ['cl_gui_alv_grid', 'double_click'],
    body: '구매오더 품목(EKPO)을 CL_GUI_ALV_GRID 로 보여 주고, 행을 더블클릭하면 그 품목의 납품일정(EKET) 요약을 메시지로 보여 주세요.\n· 삭제 표시(loekz)가 없는 품목만, 구매오더·품목 순\n· ALV 열: EBELN(구매오더), EBELP(품목), MATNR(자재), MENGE(수량)\n· 더블클릭하면 EKET 에서 그 품목의 일정 줄 수와, 미입고 수량(일정 수량 menge 합 − 입고 수량 wemng 합)을 구해\n  MESSAGE |구매오더/품목 LINES 줄수 OPEN 미입고수량| TYPE \'I\'',
    fields: [['ekpo-loekz', '삭제 표시'], ['eket-etenr', '납품일정 번호'], ['eket-eindt', '납품 예정일'], ['eket-menge', '일정 수량'], ['eket-wemng', '입고된 수량']],
    tables: ['ekpo', 'eket'], sel: [],
    tests: [[{ ev: 'double_click', row: 1, col: 'EBELN' }], [{ ev: 'double_click', row: 3, col: 'MATNR' }, { ev: 'double_click', row: 2, col: 'EBELP' }], [{ ev: 'double_click', row: 5, col: 'MENGE' }, { ev: 'double_click', row: 4, col: 'EBELN' }]].map(events => ({ events, db: { ekpo: MM_EKPO, eket: MM_EKET } })),
    ref: ({ events, db }) => mmAlvEvt(db.ekpo.filter(x => x[7] === '').sort(mmCmp(0, 1)), ['구매오더', '품목', '자재', '수량'], [0, 1, 2, 4], events, p => { const e = db.eket.filter(x => x[0] === p[0] && x[1] === p[1]); return `${p[0]}/${p[1]} LINES ${e.length} OPEN ${e.reduce((s, x) => s + x[4] - x[5], 0)}`; }),
    sol: "REPORT z_mm_po_schedule.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF ekpo.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    METHODS on_double_click FOR EVENT double_click OF cl_gui_alv_grid\n      IMPORTING e_row e_column.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_double_click.\n    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row-index.\n    CHECK sy-subrc = 0.\n    SELECT COUNT(*) AS cnt, SUM( menge ) AS qty, SUM( wemng ) AS gr\n      FROM eket\n      WHERE ebeln = @gs_itab-ebeln\n        AND ebelp = @gs_itab-ebelp\n      INTO ( @DATA(lv_cnt), @DATA(lv_qty), @DATA(lv_gr) ).\n    DATA(lv_open) = lv_qty - lv_gr.\n    MESSAGE |{ gs_itab-ebeln }/{ gs_itab-ebelp } LINES { lv_cnt } OPEN { lv_open }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT ebeln, ebelp, matnr, menge\n    FROM ekpo\n    WHERE loekz = ''\n    ORDER BY ebeln, ebelp\n    INTO CORRESPONDING FIELDS OF TABLE @gt_itab.\n  gt_fcat = VALUE #( ( fieldname = 'EBELN' coltext = '구매오더' )\n                     ( fieldname = 'EBELP' coltext = '품목' )\n                     ( fieldname = 'MATNR' coltext = '자재' )\n                     ( fieldname = 'MENGE' coltext = '수량' ) ).\n  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).\n  DATA(go_handler) = NEW lcl_handler( ).\n  SET HANDLER go_handler->on_double_click FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },

  // ---------- Lv.4 ----------
  { id: 6241, lv: 4, kind: 'rpt', title: 'P2P 추적: 구매요청 → 구매오더 → 입고',
    body: '플랜트 p_werks 의 구매요청이 어디까지 진행됐는지 추적하는 리포트를 만드세요.\n· EBAN 에서 삭제 표시(loekz)가 없는 요청을 banfn·bnfpo 순으로 읽습니다.\n· 구매오더(ebeln)가 비어 있으면 "banfn bnfpo matnr PR ONLY"\n· 있으면 EKPO 에서 그 품목(ebeln·ebelp)의 발주 수량을, MATDOC 에서 그 품목의 순입고 수량(shkzg S 는 더하고 H 는 뺌 — 101 입고, 102 입고취소, 122 반품)을 구해\n  "banfn bnfpo matnr ebeln ebelp 발주수량 입고수량 상태"를 출력합니다.\n· 상태: 입고 ≥ 발주 → DONE, 입고 > 0 → PARTIAL, 그 밖 → OPEN\n· 요청이 없으면 NO DATA',
    fields: [['eban-ebeln', '전환된 구매오더 번호'], ['ekpo-banfn', '구매오더 품목의 원 구매요청'], ['matdoc-bwart', '이동 유형 (101 입고, 102 입고취소, 122 반품)'], ['matdoc-shkzg', '차대 지시자 (S 증가, H 감소)'], ['matdoc-ebeln', '참조 구매오더']],
    tables: ['eban', 'ekpo', 'matdoc'], sel: [{ n: 'p_werks', kind: 'p', decl: 'TYPE werks_d', label: '플랜트' }],
    tests: [{ p_werks: '1000', db: { eban: MM_EBAN, ekpo: MM_EKPO, matdoc: MM_MATDOC } }, { p_werks: '2000', db: { eban: MM_EBAN, ekpo: MM_EKPO, matdoc: MM_MATDOC } }, { p_werks: '3000', db: { eban: MM_EBAN, ekpo: MM_EKPO, matdoc: MM_MATDOC } },
      { p_werks: '1000', db: { eban: MM_EBAN, ekpo: MM_EKPO, matdoc: MM_MATDOC.concat([['50012', '2026', '1', '101', 'M1', '1000', '0001', 'S', 20, 'EA', 1000, '20261102', '45001', '10', '', ''], ['50013', '2026', '1', '101', 'M1', '1000', '0001', 'S', 20, 'EA', 1000, '20261103', '45001', '10', '', '']]) } }],
    ref: ({ p_werks, db }) => {
      const r = db.eban.filter(x => x[4] === p_werks && x[13] === '').sort(mmCmp(0, 1));
      if (!r.length) return 'NO DATA';
      return r.map(x => { if (!x[11]) return `${x[0]} ${x[1]} ${x[3]} PR ONLY`; const po = db.ekpo.find(p => p[0] === x[11] && p[1] === x[12]); const gr = db.matdoc.filter(m => m[12] === x[11] && m[13] === x[12]).reduce((s, m) => s + mmSg(m[7], m[8]), 0);
        return `${x[0]} ${x[1]} ${x[3]} ${x[11]} ${x[12]} ${po[4]} ${gr} ${gr >= po[4] ? 'DONE' : gr > 0 ? 'PARTIAL' : 'OPEN'}`; }).join('\n'); },
    sol: "REPORT z_mm_p2p_trace.\n\nPARAMETERS p_werks TYPE werks_d.\n\nSTART-OF-SELECTION.\n  SELECT banfn, bnfpo, matnr, ebeln, ebelp\n    FROM eban\n    WHERE werks = @p_werks\n      AND loekz = ''\n    ORDER BY banfn, bnfpo\n    INTO TABLE @DATA(gt_eban).\n  IF gt_eban IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  SELECT ebeln, ebelp, menge\n    FROM ekpo\n    FOR ALL ENTRIES IN @gt_eban\n    WHERE ebeln = @gt_eban-ebeln\n      AND ebelp = @gt_eban-ebelp\n    INTO TABLE @DATA(gt_ekpo).\n  \" FOR ALL ENTRIES 는 같은 행을 하나로 합치므로 키(mblnr, zeile)까지 읽는다\n  SELECT mblnr, mjahr, zeile, ebeln, ebelp, shkzg, menge\n    FROM matdoc\n    FOR ALL ENTRIES IN @gt_eban\n    WHERE ebeln = @gt_eban-ebeln\n      AND ebelp = @gt_eban-ebelp\n    INTO TABLE @DATA(gt_mdoc).\n\n  DATA: lv_gr TYPE i,\n        lv_st TYPE string.\n  LOOP AT gt_eban INTO DATA(gs_eban).\n    IF gs_eban-ebeln IS INITIAL.\n      WRITE: / gs_eban-banfn, gs_eban-bnfpo, gs_eban-matnr, 'PR ONLY'.\n      CONTINUE.\n    ENDIF.\n    READ TABLE gt_ekpo INTO DATA(gs_ekpo) WITH KEY ebeln = gs_eban-ebeln ebelp = gs_eban-ebelp.\n    lv_gr = 0.\n    LOOP AT gt_mdoc INTO DATA(gs_mdoc) WHERE ebeln = gs_eban-ebeln AND ebelp = gs_eban-ebelp.\n      IF gs_mdoc-shkzg = 'S'.\n        lv_gr = lv_gr + gs_mdoc-menge.\n      ELSE.\n        lv_gr = lv_gr - gs_mdoc-menge.\n      ENDIF.\n    ENDLOOP.\n    IF lv_gr >= gs_ekpo-menge.\n      lv_st = 'DONE'.\n    ELSEIF lv_gr > 0.\n      lv_st = 'PARTIAL'.\n    ELSE.\n      lv_st = 'OPEN'.\n    ENDIF.\n    WRITE: / gs_eban-banfn, gs_eban-bnfpo, gs_eban-matnr, gs_eban-ebeln, gs_eban-ebelp, gs_ekpo-menge, lv_gr, lv_st.\n  ENDLOOP." },
  { id: 6242, lv: 4, kind: 'rpt', title: '3-way match 리포트 (EKPO · EKBE · RSEG · RBKP)',
    body: '구매오더 범위 s_ebeln 의 품목별로 발주·입고·송장을 대조하세요.\n· EKPO: 삭제 표시(loekz)가 없는 품목, 구매오더·품목 순 (없으면 NO DATA)\n· 입고 수량 = EKBE 에서 vgabe = \'1\'(입고) 인 이력의 수량 (shkzg S 더하고 H 빼기)\n· 송장 수량·금액 = RSEG 의 menge·wrbtr 합 (S 더하고 H 빼기). 단, RBKP 상태 rbstat = \'5\'(전기됨) 인 송장만\n· 상태 판정 순서: 입고·송장 모두 0 → OPEN / 송장 > 입고 → QTY / 송장 0 → WAIT IR / 송장 금액 > 송장 수량 × 단가(netpr) → PRICE / 그 밖 → MATCH\n· "ebeln ebelp 입고수량 송장수량 송장금액 상태"를 출력합니다.',
    fields: [['ekbe-vgabe', '이력 유형 (1 입고, 2 송장)'], ['ekbe-shkzg', '차대 지시자'], ['rseg-menge', '송장 수량'], ['rseg-wrbtr', '송장 금액'], ['rbkp-rbstat', '송장 상태 (5 전기, A 보류)']],
    tables: ['ekpo', 'ekbe', 'rseg', 'rbkp'], sel: [{ n: 's_ebeln', kind: 's', decl: 'FOR ekko-ebeln', label: '구매오더' }],
    tests: [[], [['I', 'EQ', '45002', '']], [['I', 'BT', '45001', '45001']], [['I', 'EQ', '45009', '']]].map(s_ebeln => ({ s_ebeln, db: { ekpo: MM_EKPO, ekbe: MM_EKBE, rseg: MM_RSEG, rbkp: MM_RBKP } }))
      .concat([{ s_ebeln: [['I', 'BT', '45002', '45003']], db: { ekpo: MM_EKPO, ekbe: MM_EKBE, rseg: MM_RSEG, rbkp: MM_RBKP.map(r => r[0] === '51000004' ? r.slice(0, 10).concat(['5', '']) : r) } }, { s_ebeln: [['I', 'EQ', '45001', '']], db: { ekpo: MM_EKPO, ekbe: MM_EKBE, rseg: MM_RSEG.filter(r => r[4] !== '20'), rbkp: MM_RBKP } }]),
    ref: ({ s_ebeln, db }) => {
      const po = db.ekpo.filter(x => mmIn(x[0], s_ebeln) && x[7] === '').sort(mmCmp(0, 1));
      if (!po.length) return 'NO DATA';
      return po.map(p => {
        const gr = db.ekbe.filter(e => e[0] === p[0] && e[1] === p[1] && e[7] === '1').reduce((s, e) => s + mmSg(e[10], e[4]), 0);
        const ir = db.rseg.filter(r => r[3] === p[0] && r[4] === p[1] && db.rbkp.some(k => k[0] === r[0] && k[1] === r[1] && k[10] === '5'));
        const iq = ir.reduce((s, r) => s + mmSg(r[9], r[7]), 0), ia = ir.reduce((s, r) => s + mmSg(r[9], r[8]), 0);
        const st = gr === 0 && iq === 0 ? 'OPEN' : iq > gr ? 'QTY' : iq === 0 ? 'WAIT IR' : ia > iq * p[5] ? 'PRICE' : 'MATCH';
        return `${p[0]} ${p[1]} ${gr} ${iq} ${ia} ${st}`; }).join('\n'); },
    sol: "REPORT z_mm_3way_match.\n\nSELECT-OPTIONS s_ebeln FOR ekko-ebeln.\n\nSTART-OF-SELECTION.\n  SELECT ebeln, ebelp, menge, netpr\n    FROM ekpo\n    WHERE ebeln IN @s_ebeln\n      AND loekz = ''\n    ORDER BY ebeln, ebelp\n    INTO TABLE @DATA(gt_po).\n  IF gt_po IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  \" 입고 이력 (vgabe = 1)\n  SELECT ebeln, ebelp, belnr, shkzg, menge\n    FROM ekbe\n    WHERE ebeln IN @s_ebeln\n      AND vgabe = '1'\n    INTO TABLE @DATA(gt_gr).\n  \" 전기된 송장 품목\n  SELECT r~belnr, r~buzei, r~ebeln, r~ebelp, r~menge, r~wrbtr, r~shkzg\n    FROM rseg AS r\n    INNER JOIN rbkp AS k ON r~belnr = k~belnr AND r~gjahr = k~gjahr\n    WHERE r~ebeln IN @s_ebeln\n      AND k~rbstat = '5'\n    INTO TABLE @DATA(gt_ir).\n\n  DATA: lv_gr  TYPE i,\n        lv_iq  TYPE i,\n        lv_ia  TYPE i,\n        lv_sgn TYPE i,\n        lv_st  TYPE string.\n  LOOP AT gt_po INTO DATA(gs_po).\n    CLEAR: lv_gr, lv_iq, lv_ia.\n    LOOP AT gt_gr INTO DATA(gs_gr) WHERE ebeln = gs_po-ebeln AND ebelp = gs_po-ebelp.\n      lv_sgn = COND #( WHEN gs_gr-shkzg = 'S' THEN 1 ELSE -1 ).\n      lv_gr = lv_gr + lv_sgn * gs_gr-menge.\n    ENDLOOP.\n    LOOP AT gt_ir INTO DATA(gs_ir) WHERE ebeln = gs_po-ebeln AND ebelp = gs_po-ebelp.\n      lv_sgn = COND #( WHEN gs_ir-shkzg = 'S' THEN 1 ELSE -1 ).\n      lv_iq = lv_iq + lv_sgn * gs_ir-menge.\n      lv_ia = lv_ia + lv_sgn * gs_ir-wrbtr.\n    ENDLOOP.\n    IF lv_gr = 0 AND lv_iq = 0.\n      lv_st = 'OPEN'.\n    ELSEIF lv_iq > lv_gr.\n      lv_st = 'QTY'.\n    ELSEIF lv_iq = 0.\n      lv_st = 'WAIT IR'.\n    ELSEIF lv_ia > lv_iq * gs_po-netpr.\n      lv_st = 'PRICE'.\n    ELSE.\n      lv_st = 'MATCH'.\n    ENDIF.\n    WRITE: / gs_po-ebeln, gs_po-ebelp, lv_gr, lv_iq, lv_ia, lv_st.\n  ENDLOOP." },
  { id: 6243, lv: 4, kind: 'rpt', title: '부대비용 포함 입고 원가 (EKBE + EKBZ)',
    body: '구매오더 p_ebeln 의 품목별 입고 원가를 운임 같은 부대비용까지 포함해 계산하세요.\n· 첫 줄: EKKO 에서 "PO 구매오더 공급업체 통화(waers)". 구매오더가 없으면 NO PO\n· EKPO 의 삭제되지 않은 품목을 품목 순으로 처리합니다.\n· 입고 수량·물품 금액 = EKBE 에서 vgabe = \'1\' 인 이력의 menge·dmbtr 합 (shkzg S 더하고 H 빼기)\n· 입고 수량이 0 이면 "품목 NO GR"\n· 아니면 "품목 GOODS 물품금액", 부대비용 조건(kschl)마다 조건 순으로 "품목 조건 금액"(EKBZ, vgabe = \'1\', S 더하고 H 빼기),\n  마지막에 "품목 TOTAL 합계 UNIT 개당원가" (개당원가 = 합계 DIV 입고 수량)',
    fields: [['ekko-waers', '통화'], ['ekbe-dmbtr', '입고 금액(현지 통화)'], ['ekbz-kschl', '부대비용 조건 유형 (FRA1 운임 등)'], ['ekbz-dmbtr', '부대비용 금액'], ['ekbz-vgabe', '이력 유형 (1 입고)']],
    tables: ['ekko', 'ekpo', 'ekbe', 'ekbz'], sel: [{ n: 'p_ebeln', kind: 'p', decl: 'TYPE ekko-ebeln', label: '구매오더' }],
    tests: ['45001', '45002', '45003', '45009'].map(p_ebeln => ({ p_ebeln, db: { ekko: MM_EKKO, ekpo: MM_EKPO, ekbe: MM_EKBE, ekbz: MM_EKBZ } })),
    ref: ({ p_ebeln, db }) => {
      const h = db.ekko.find(x => x[0] === p_ebeln); if (!h) return 'NO PO';
      const o = [`PO ${h[0]} ${h[2]} ${h[6]}`];
      for (const p of db.ekpo.filter(x => x[0] === p_ebeln && x[7] === '').sort(mmCmp(1))) {
        const g = db.ekbe.filter(e => e[0] === p_ebeln && e[1] === p[1] && e[7] === '1');
        const q = g.reduce((s, e) => s + mmSg(e[10], e[4]), 0), v = g.reduce((s, e) => s + mmSg(e[10], e[9]), 0);
        if (q === 0) { o.push(`${p[1]} NO GR`); continue; }
        o.push(`${p[1]} GOODS ${v}`); const c = {};
        db.ekbz.filter(z => z[0] === p_ebeln && z[1] === p[1] && z[4] === '1').forEach(z => c[z[7]] = (c[z[7]] || 0) + mmSg(z[10], z[9]));
        let t = v; for (const k of Object.keys(c).sort()) { o.push(`${p[1]} ${k} ${c[k]}`); t += c[k]; }
        o.push(`${p[1]} TOTAL ${t} UNIT ${Math.floor(t / q)}`);
      }
      return o.join('\n'); },
    sol: "REPORT z_mm_landed_cost.\n\nPARAMETERS p_ebeln TYPE ekko-ebeln.\n\nTYPES: BEGIN OF ty_cost,\n         kschl TYPE string,\n         amt   TYPE i,\n       END OF ty_cost.\n\nSTART-OF-SELECTION.\n  SELECT SINGLE ebeln, lifnr, waers\n    FROM ekko\n    WHERE ebeln = @p_ebeln\n    INTO @DATA(gs_ekko).\n  IF sy-subrc <> 0.\n    WRITE 'NO PO'.\n    RETURN.\n  ENDIF.\n  WRITE: 'PO', gs_ekko-ebeln, gs_ekko-lifnr, gs_ekko-waers.\n\n  SELECT ebelp, matnr FROM ekpo\n    WHERE ebeln = @p_ebeln AND loekz = ''\n    ORDER BY ebelp\n    INTO TABLE @DATA(gt_po).\n  SELECT ebelp, belnr, shkzg, menge, dmbtr FROM ekbe\n    WHERE ebeln = @p_ebeln AND vgabe = '1'\n    INTO TABLE @DATA(gt_gr).\n  SELECT ebelp, stunr, belnr, kschl, shkzg, dmbtr FROM ekbz\n    WHERE ebeln = @p_ebeln AND vgabe = '1'\n    INTO TABLE @DATA(gt_bz).\n\n  DATA: lv_qty   TYPE i,\n        lv_val   TYPE i,\n        lv_total TYPE i,\n        lv_unit  TYPE i,\n        gs_cost  TYPE ty_cost,\n        gt_cost  TYPE TABLE OF ty_cost.\n  LOOP AT gt_po INTO DATA(gs_po).\n    CLEAR: lv_qty, lv_val, gt_cost.\n    LOOP AT gt_gr INTO DATA(gs_gr) WHERE ebelp = gs_po-ebelp.\n      IF gs_gr-shkzg = 'S'.\n        lv_qty = lv_qty + gs_gr-menge.\n        lv_val = lv_val + gs_gr-dmbtr.\n      ELSE.\n        lv_qty = lv_qty - gs_gr-menge.\n        lv_val = lv_val - gs_gr-dmbtr.\n      ENDIF.\n    ENDLOOP.\n    IF lv_qty = 0.\n      WRITE: / gs_po-ebelp, 'NO GR'.\n      CONTINUE.\n    ENDIF.\n    WRITE: / gs_po-ebelp, 'GOODS', lv_val.\n    LOOP AT gt_bz INTO DATA(gs_bz) WHERE ebelp = gs_po-ebelp.\n      gs_cost-kschl = gs_bz-kschl.\n      gs_cost-amt = COND #( WHEN gs_bz-shkzg = 'S' THEN gs_bz-dmbtr ELSE 0 - gs_bz-dmbtr ).\n      COLLECT gs_cost INTO gt_cost.\n    ENDLOOP.\n    SORT gt_cost BY kschl.\n    lv_total = lv_val.\n    LOOP AT gt_cost INTO gs_cost.\n      WRITE: / gs_po-ebelp, gs_cost-kschl, gs_cost-amt.\n      lv_total = lv_total + gs_cost-amt.\n    ENDLOOP.\n    lv_unit = lv_total DIV lv_qty.\n    WRITE: / gs_po-eb   // ---------- Lv.5 ----------
  { id: 6252, lv: 5, kind: 'rpt', title: '계정지정 구매오더 (EKKN, REDUCE · SWITCH)', ban: ['READ', 'IF', 'CASE', 'APPEND', 'COLLECT'],

  { id: 6222, lv: 2, kind: 'rpt', title: '구매오더 입고 잔량 (WITH 공통 테이블 식)', must: ['with'],
    body: '구매오더 품목(EKPO)별로 입고 순수량과 잔량을 구하세요. 입고 이력은 EKBE 에서 vgabe = \'1\'(입고) 인 행입니다.\n· WITH 로 공통 테이블 식 두 개를 만드세요: +gr = 입고(shkzg = \'S\') 수량 합계, +rt = 반품·취소(shkzg = \'H\') 수량 합계 (ebeln, ebelp 별 GROUP BY)\n· 본 SELECT 는 EKPO 에 +gr, +rt 를 LEFT OUTER JOIN 합니다. 삭제 표시(loekz)가 있는 품목은 뺍니다. 구매오더는 s_ebeln 범위로 거릅니다.\n· 입고순수량 = gr - rt, 잔량 = menge - 입고순수량\n· 구매오더·품목 순으로 "ebeln ebelp matnr menge 입고순수량 잔량", 마지막 줄 "OPEN 잔량이 0보다 큰 품목 수"',

      const items = db.ekpo.filter(x => x[7] === '' && mmIn(x[0], s_ebeln)).sort(mmCmp(0, 1)); let open = 0;
      const lines = items.map(x => { const h = db.ekbe.filter(b => b[0] === x[0] && b[1] === x[1] && b[7] === '1'); const gr = h.filter(b => b[10] === 'S').reduce((s, b) => s + b[4], 0) - h.filter(b => b[10] === 'H').reduce((s, b) => s + b[4], 0); const rest = x[4] - gr; if (rest > 0) open++; return `${x[0]} ${x[1]} ${x[2]} ${x[4]} ${gr} ${rest}`; });
      return [...lines, `OPEN ${open}`].join('\n'); },
    sol: "REPORT z_mm_po_open.\n\nSELECT-OPTIONS s_ebeln FOR ekpo-ebeln.\n\nSTART-OF-SELECTION.\n  WITH\n    +gr AS ( SELECT ebeln, ebelp, SUM( menge ) AS qty\n               FROM ekbe\n               WHERE vgabe = '1' AND shkzg = 'S'\n               GROUP BY ebeln, ebelp ),\n    +rt AS ( SELECT ebeln, ebelp, SUM( menge ) AS qty\n               FROM ekbe\n               WHERE vgabe = '1' AND shkzg = 'H'\n               GROUP BY ebeln, ebelp )\n  SELECT p~ebeln, p~ebelp, p~matnr, p~menge, g~qty AS grqty, r~qty AS rtqty\n    FROM ekpo AS p\n    LEFT OUTER JOIN +gr AS g ON g~ebeln = p~ebeln AND g~ebelp = p~ebelp\n    LEFT OUTER JOIN +rt AS r ON r~ebeln = p~ebeln AND r~ebelp = p~ebelp\n    WHERE p~ebeln IN @s_ebeln\n      AND p~loekz = ''\n    ORDER BY p~ebeln, p~ebelp\n    INTO TABLE @DATA(gt_itab).\n\n  DATA lv_open TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    DATA(lv_gr) = gs_itab-grqty - gs_itab-rtqty.\n    DATA(lv_rest) = gs_itab-menge - lv_gr.\n    IF lv_rest > 0.\n      lv_open = lv_open + 1.\n    ENDIF.\n    WRITE: / gs_itab-ebeln, gs_itab-ebelp, gs_itab-matnr, gs_itab-menge, lv_gr, lv_rest.\n  ENDLOOP.\n  WRITE: / 'OPEN', lv_open." },

const MM_SOL_VAL = "CLASS lhc_po DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS validatesupplier FOR VALIDATE ON SAVE\n      IMPORTING keys FOR po~validatesupplier.\nENDCLASS.\n\nCLASS lhc_po IMPLEMENTATION.\n  METHOD validatesupplier.\n    READ ENTITIES OF zr_purchaseorder IN LOCAL MODE\n      ENTITY po FIELDS ( lifnr ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_po).\n    LOOP AT lt_po INTO DATA(ls_po).\n      DATA(lv_msg) = ``.\n      IF ls_po-lifnr IS INITIAL.\n        lv_msg = `공급업체를 입력하세요`.\n      ELSE.\n        SELECT SINGLE lifnr FROM lfa1 WHERE lifnr = @ls_po-lifnr INTO @DATA(lv_lifnr).\n        IF sy-subrc <> 0.\n          lv_msg = |없는 공급업체 { ls_po-lifnr }|.\n        ENDIF.\n      ENDIF.\n      IF lv_msg IS NOT INITIAL.\n        APPEND VALUE #( %tky = ls_po-%tky ) TO failed-po.\n        APPEND VALUE #( %tky = ls_po-%tky\n                        %msg = new_message_with_text( severity = if_abap_behv_message=>severity-error\n                                                      text     = lv_msg ) ) TO reported-po.\n      ENDIF.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.";
const MM_SOL_DET = "CLASS lhc_item DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS calcnetwr FOR DETERMINE ON MODIFY\n      IMPORTING keys FOR item~calcnetwr.\nENDCLASS.\n\nCLASS lhc_item IMPLEMENTATION.\n  METHOD calcnetwr.\n    READ ENTITIES OF zr_purchaseorder IN LOCAL MODE\n      ENTITY item FIELDS ( menge netpr ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_item).\n    LOOP AT lt_item INTO DATA(ls_item).\n      DATA(lv_netwr) = ls_item-menge * ls_item-netpr.\n      IF ls_item-menge >= 100.\n        lv_netwr = lv_netwr * 95 DIV 100.\n      ENDIF.\n      MODIFY ENTITIES OF zr_purchaseorder IN LOCAL MODE\n        ENTITY item UPDATE FIELDS ( netwr )\n        WITH VALUE #( ( %tky = ls_item-%tky netwr = lv_netwr ) ).\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.";
const MM_SOL_ACT = "CLASS lhc_po DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS approve FOR MODIFY\n      IMPORTING keys FOR ACTION po~approve RESULT result.\nENDCLASS.\n\nCLASS lhc_po IMPLEMENTATION.\n  METHOD approve.\n    READ ENTITIES OF zr_purchaseorder IN LOCAL MODE\n      ENTITY po ALL FIELDS WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_po).\n    LOOP AT lt_po INTO DATA(ls_po).\n      READ ENTITIES OF zr_purchaseorder IN LOCAL MODE\n        ENTITY po BY \\_item ALL FIELDS\n        WITH VALUE #( ( %tky = ls_po-%tky ) )\n        RESULT DATA(lt_item).\n      DATA(lv_msg) = ``.\n      IF ls_po-status = 'A'.\n        lv_msg = `이미 승인된 구매오더입니다`.\n      ELSEIF lt_item IS INITIAL.\n        lv_msg = `품목이 없습니다`.\n      ENDIF.\n      IF lv_msg IS NOT INITIAL.\n        APPEND VALUE #( %tky = ls_po-%tky ) TO failed-po.\n        APPEND VALUE #( %tky = ls_po-%tky\n                        %msg = new_message_with_text( severity = if_abap_behv_message=>severity-error\n                                                      text     = lv_msg ) ) TO reported-po.\n        CONTINUE.\n      ENDIF.\n      MODIFY ENTITIES OF zr_purchaseorder IN LOCAL MODE\n        ENTITY po UPDATE FIELDS ( status )\n        WITH VALUE #( ( %tky = ls_po-%tky status = 'A' ) ).\n      ls_po-status = 'A'.\n      APPEND VALUE #( %tky = ls_po-%tky %param = ls_po ) TO result.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.";

      const dmp = (t, rows) => [`[${t.toUpperCase()}]`, ...rows.slice().sort((a, b) => JSON.stringify(a.slice(0, t === 'zmm_po_h' ? 1 : 2)) < JSON.stringify(b.slice(0, t === 'zmm_po_h' ? 1 : 2)) ? -1 : 1).map(r => r.join(' '))];
      return [...out, ...dmp('zmm_po_h', h), ...dmp('zmm_po_i', it)].join('\n'); },
    sol: "REPORT z_mm_po_create_eml.\n\nPARAMETERS: p_ebeln TYPE zmm_po_h-ebeln,\n            p_lifnr TYPE zmm_po_h-lifnr,\n            p_matnr TYPE matnr,\n            p_menge TYPE i,\n            p_netpr TYPE i.\n\nSTART-OF-SELECTION.\n  MODIFY ENTITIES OF zr_purchaseorder\n    ENTITY po\n      CREATE FIELDS ( ebeln lifnr status )\n      WITH VALUE #( ( %cid = 'H1' ebeln = p_ebeln lifnr = p_lifnr status = 'N' ) )\n      CREATE BY \\_item FIELDS ( ebelp matnr menge netpr netwr )\n      WITH VALUE #( ( ebeln = p_ebeln\n                      %target = VALUE #( ( %cid = 'I1' ebelp = '10' matnr = p_matnr\n                                           menge = p_menge netpr = p_netpr\n                                           netwr = p_menge * p_netpr ) ) ) )\n    MAPPED DATA(ls_mapped)\n    FAILED DATA(ls_failed)\n    REPORTED DATA(ls_reported).\n\n  IF ls_failed-po IS NOT INITIAL.\n    ROLLBACK ENTITIES.\n    WRITE 'DUPLICATE'.\n    RETURN.\n  ENDIF.\n\n  COMMIT ENTITIES.\n  WRITE: 'CREATED', p_ebeln.\n\n  READ ENTITIES OF zr_purchaseorder\n    ENTITY po BY \\_item ALL FIELDS\n    WITH VALUE #( ( ebeln = p_ebeln ) )\n    RESULT DATA(lt_item).\n  LOOP AT lt_item INTO DATA(ls_item).\n    WRITE: / ls_item-ebelp, ls_item-matnr, ls_item-menge, ls_item-netwr.\n  ENDLOOP." },

// ===== PGM 조회 리포트 (ME2N · 미결 · MB51 · MIR5) =====
const MM_EKKO5 = MM_EKKO.concat([['45004', '1000', 'V300', '20261020', 'NB', '2000', 'KRW', 'Z030']]);
const MM_EKPO5 = MM_EKPO.concat([['45004', '10', 'M6', '2000', 3, 900, 'EA', '', '', '', '', ''], ['45004', '20', 'M7', '2000', 8, 25, 'EA', '', 'X', '', '', '']]);
const MM_LFA15 = MM_LFA1.concat([['V300', '세진정밀', 'KR']]);
const MM_EKBE5 = MM_EKBE.concat([['45002', '10', '50012', 'E', 3, '2026', '1', '1', '20261101', 900, 'S', '101'], ['45002', '10', '50013', 'E', 3, '2026', '1', '1', '20261102', 900, 'S', '101']]);
const MM_RBKP5 = MM_RBKP.concat([['51000005', '2026', '1000', 'V100', '20261102', '20261102', 'INV-990', 2200, 200, 'KRW', '5', '51000006'], ['51000006', '2026', '1000', 'V100', '20261103', '20261103', 'INV-990', 2200, 200, 'KRW', '5', '51000005']]);
const MM_RSEG5 = MM_RSEG.concat([['51000005', '2026', '1', '45001', '10', 'M1', '1000', 10, 2000, 'S'], ['51000006', '2026', '1', '45001', '10', 'M1', '1000', 10, 2000, 'H']]);
const mmR = (lo, hi) => [['I', hi ? 'BT' : 'EQ', lo, hi || '']];
addMod('mm', [
  { id: 7212, pgm: true, topic: '조회 리포트', lv: 2, kind: 'rpt', title: '구매오더 현황 (ME2N)',
    body: '구매오더 현황 리포트를 만드세요(표준 ME2N 과 비슷한 조회).\n· EKKO 와 EKPO 를 ebeln 으로, LFA1 을 lifnr 로 INNER JOIN 합니다.\n· 선택 조건: 발주일 s_bedat(EKKO-BEDAT), 공급업체 s_lifnr(EKKO-LIFNR), 구매조직 s_ekorg(EKKO-EKORG)\n· 삭제 표시(EKPO-LOEKZ)가 있는 품목은 뺍니다.\n· 구매오더·품목 순으로 "구매오더 품목 발주일 공급업체 업체명 자재 수량 금액"을 출력합니다. 금액 = 수량 × 단가(netpr)\n· 마지막 줄에 "TOTAL 건수 금액합계". 없으면 NO DATA.',
    fields: [['ekko-bedat', '발주일'], ['ekko-ekorg', '구매조직'], ['ekko-lifnr', '공급업체'], ['ekpo-loekz', '삭제 지시자 (L)'], ['ekpo-netpr', '순단가'], ['lfa1-name1', '공급업체명']],
    tables: ['ekko', 'ekpo', 'lfa1'],
    sel: [{ n: 's_bedat', kind: 's', decl: 'FOR ekko-bedat', label: '발주일' }, { n: 's_lifnr', kind: 's', decl: 'FOR ekko-lifnr', label: '공급업체' }, { n: 's_ekorg', kind: 's', decl: 'FOR ekko-ekorg', label: '구매조직' }],
    outDesc: '품목마다 한 줄, 마지막에 TOTAL 줄을 출력합니다. 없으면 NO DATA.',
    tests: [[[], [], []], [mmR('20261001', '20261010'), [], []], [[], mmR('V100'), mmR('1000')], [[], [], mmR('2000')], [mmR('20261101', '20261130'), [], []]]
      .map(([s_bedat, s_lifnr, s_ekorg]) => ({ s_bedat, s_lifnr, s_ekorg, db: { ekko: MM_EKKO5, ekpo: MM_EKPO5, lfa1: MM_LFA15 } })),
    ref: ({ s_bedat, s_lifnr, s_ekorg, db }) => {
      const rows = [];
      for (const k of db.ekko) { if (!mmIn(k[3], s_bedat) || !mmIn(k[2], s_lifnr) || !mmIn(k[5], s_ekorg)) continue; const l = db.lfa1.find(x => x[0] === k[2]); if (!l) continue;
        for (const p of db.ekpo) if (p[0] === k[0] && p[7] === '') rows.push([k[0], p[1], k[3], k[2], l[1], p[2], p[4], p[4] * p[5]]); }
      if (!rows.length) return 'NO DATA';
      rows.sort(mmCmp(0, 1));
      return rows.map(r => r.join(' ')).concat([`TOTAL ${rows.length} ${rows.reduce((s, r) => s + r[7], 0)}`]).join('\n'); },
    sol: "REPORT z_mm_po_list.\n\nSELECT-OPTIONS: s_bedat FOR ekko-bedat,\n                s_lifnr FOR ekko-lifnr,\n                s_ekorg FOR ekko-ekorg.\n\nSTART-OF-SELECTION.\n  SELECT k~ebeln, p~ebelp, k~bedat, k~lifnr, l~name1, p~matnr, p~menge, p~netpr\n    FROM ekko AS k\n    INNER JOIN ekpo AS p ON p~ebeln = k~ebeln\n    INNER JOIN lfa1 AS l ON l~lifnr = k~lifnr\n    WHERE k~bedat IN @s_bedat\n      AND k~lifnr IN @s_lifnr\n      AND k~ekorg IN @s_ekorg\n      AND p~loekz = ''\n    ORDER BY ebeln, ebelp\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_amt TYPE i,\n        lv_sum TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    lv_amt = gs_itab-menge * gs_itab-netpr.\n    lv_sum = lv_sum + lv_amt.\n    WRITE: / gs_itab-ebeln, gs_itab-ebelp, gs_itab-bedat, gs_itab-lifnr, gs_itab-name1,\n             gs_itab-matnr, gs_itab-menge, lv_amt.\n  ENDLOOP.\n  WRITE: / 'TOTAL', lines( gt_itab ), lv_sum." },

  { id: 7213, pgm: true, topic: '조회 리포트', lv: 2, kind: 'rpt', title: '미결 구매오더 현황 (ME2M)',
    body: '아직 다 입고되지 않은 구매오더 품목을 찾으세요(ME2M 미결 조회와 비슷).\n· EKPO 에서 구매오더 s_ebeln, 플랜트 s_werks 범위 품목 중 삭제(LOEKZ)·납품완료(ELIKZ = \'X\') 표시가 없는 것만 읽습니다.\n· 입고 수량 = EKBE 에서 VGABE = \'1\'(입고) 이력의 수량 합계. SHKZG 가 S 면 더하고 H(102 취소·122 반품)면 뺍니다.\n· 잔량 = 발주수량 - 입고수량, 잔량이 0보다 큰 품목만 구매오더·품목 순으로 "구매오더 품목 자재 발주수량 입고수량 잔량" 출력\n· 마지막 줄 "OPEN 건수". 미결이 없으면 NO OPEN ITEMS\n· EKBE 를 FOR ALL ENTRIES 로 읽을 때는 중복 제거에 조심하세요(이력 키 belnr·gjahr·buzei 를 함께 읽기).',
    fields: [['ekpo-elikz', '납품 완료 지시자'], ['ekpo-menge', '발주 수량'], ['ekbe-vgabe', '이력 유형 (1 입고, 2 송장)'], ['ekbe-shkzg', '차대 지시자 (S/H)'], ['ekbe-bwart', '이동 유형']],
    tables: ['ekpo', 'ekbe'],
    sel: [{ n: 's_ebeln', kind: 's', decl: 'FOR ekpo-ebeln', label: '구매오더' }, { n: 's_werks', kind: 's', decl: 'FOR ekpo-werks', label: '플랜트' }],
    outDesc: '미결 품목마다 한 줄, 마지막에 OPEN 건수. 없으면 NO OPEN ITEMS.',
    tests: [[[], []], [mmR('45001'), []], [[], mmR('2000')], [mmR('45002', '45003'), mmR('1000')], [mmR('45009'), []]]
      .map(([s_ebeln, s_werks]) => ({ s_ebeln, s_werks, db: { ekpo: MM_EKPO5, ekbe: MM_EKBE5 } })),
    ref: ({ s_ebeln, s_werks, db }) => {
      const po = db.ekpo.filter(p => mmIn(p[0], s_ebeln) && mmIn(p[3], s_werks) && p[7] === '' && p[8] === '').sort(mmCmp(0, 1));
      const out = [];
      for (const p of po) { const gr = db.ekbe.filter(e => e[0] === p[0] && e[1] === p[1] && e[7] === '1').reduce((s, e) => s + mmSg(e[10], e[4]), 0); const op = p[4] - gr; if (op > 0) out.push(`${p[0]} ${p[1]} ${p[2]} ${p[4]} ${gr} ${op}`); }
      return out.length ? out.concat([`OPEN ${out.length}`]).join('\n') : 'NO OPEN ITEMS'; },
    sol: "REPORT z_mm_open_po.\n\nSELECT-OPTIONS: s_ebeln FOR ekpo-ebeln,\n                s_werks FOR ekpo-werks.\n\nSTART-OF-SELECTION.\n  SELECT ebeln, ebelp, matnr, menge\n    FROM ekpo\n    WHERE ebeln IN @s_ebeln\n      AND werks IN @s_werks\n      AND loekz = ''\n      AND elikz = ''\n    ORDER BY ebeln, ebelp\n    INTO TABLE @DATA(gt_po).\n  IF gt_po IS INITIAL.\n    WRITE 'NO OPEN ITEMS'.\n    RETURN.\n  ENDIF.\n\n  SELECT ebeln, ebelp, belnr, gjahr, buzei, menge, shkzg\n    FROM ekbe\n    FOR ALL ENTRIES IN @gt_po\n    WHERE ebeln = @gt_po-ebeln\n      AND ebelp = @gt_po-ebelp\n      AND vgabe = '1'\n    INTO TABLE @DATA(gt_gr).\n\n  DATA: lv_gr   TYPE i,\n        lv_open TYPE i,\n        lv_cnt  TYPE i.\n  LOOP AT gt_po INTO DATA(gs_po).\n    lv_gr = 0.\n    LOOP AT gt_gr INTO DATA(gs_gr) WHERE ebeln = gs_po-ebeln AND ebelp = gs_po-ebelp.\n      IF gs_gr-shkzg = 'S'.\n        lv_gr = lv_gr + gs_gr-menge.\n      ELSE.\n        lv_gr = lv_gr - gs_gr-menge.\n      ENDIF.\n    ENDLOOP.\n    lv_open = gs_po-menge - lv_gr.\n    CHECK lv_open > 0.\n    lv_cnt = lv_cnt + 1.\n    WRITE: / gs_po-ebeln, gs_po-ebelp, gs_po-matnr, gs_po-menge, lv_gr, lv_open.\n  ENDLOOP.\n  IF lv_cnt = 0.\n    WRITE 'NO OPEN ITEMS'.\n  ELSE.\n    WRITE: / 'OPEN', lv_cnt.\n  ENDIF." },

  { id: 7214, pgm: true, topic: '조회 리포트', lv: 2, kind: 'rpt', title: '입고 내역 (MB51 · MATDOC)',

    outDesc: '입고 줄마다 한 줄, 마지막에 TOTAL 줄. 없으면 NO DATA.',

    sol: L('DATA lv_total TYPE i.', 'LOOP AT gt_itab INTO DATA(gs_op).', '  DATA(lv_min) = gs_op-vgw01 + gs_op-vgw02 * p_mgvrg.', '  WRITE: / gs_op-vornr, lv_min.', '  lv_total = lv_total + lv_min.', 'ENDLOOP.', 'DATA(lv_hour) = lv_total DIV 60.', 'DATA(lv_rest) = lv_total MOD 60.', "WRITE: / 'TOTAL', lv_hour, lv_rest.") },
  { id: 7301, pgm: true, from: 6313, topic: '선택화면', lv: 1, kind: 'rpt', noTmplSel: true, title: '실적 확인 선택 화면',
    body: '생산 실적을 확인하는 선택 화면 프로그램을 만드세요.\n· PARAMETERS: p_gamng (TYPE i, 계획수량), p_lmnga (TYPE i, 실적수량)\n· 라디오버튼 r_pct, r_rest (RADIOBUTTON GROUP g1)\n· AT SELECTION-SCREEN 에서 p_gamng 가 0 이하이거나 p_lmnga 가 0보다 작으면 MESSAGE \'INVALID QTY\' TYPE \'E\' 로 막습니다.\n· r_pct 를 고르면 진척률 "p_lmnga × 100 DIV p_gamng" 뒤에 % 를 붙여 출력합니다. 예) 60%\n· r_rest 를 고르면 "REST 잔량" 을 출력합니다. 잔량이 0보다 작으면 0 입니다.',
    fields: [['afru-lmnga', '확인된 양품 수량'], ['afko-gamng', '오더 계획수량']],
    tables: [], sel: [{ n: 'p_gamng', kind: 'p', decl: 'TYPE i', label: '계획수량' }, { n: 'p_lmnga', kind: 'p', decl: 'TYPE i', label: '실적수량' }, { n: 'r_pct', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '진척률' }, { n: 'r_rest', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '잔량' }],
    tests: [[100, 60, 'X', ''], [100, 60, '', 'X'], [30, 45, '', 'X'], [30, 45, 'X', ''], [0, 5, 'X', ''], [10, -1, '', 'X'], [3, 1, 'X', '']].map(([p_gamng, p_lmnga, r_pct, r_rest]) => ({ p_gamng, p_lmnga, r_pct, r_rest })),
    ref: ({ p_gamng: g, p_lmnga: l, r_pct }) => g <= 0 || l < 0 ? 'INVALID QTY' : r_pct === 'X' ? `${Math.floor(l * 100 / g)}%` : `REST ${Math.max(0, g - l)}`,
    sol: L('REPORT zpp_confirm_check.', '', 'PARAMETERS: p_gamng TYPE i,', '            p_lmnga TYPE i,', '            r_pct   RADIOBUTTON GROUP g1,', '            r_rest  RADIOBUTTON GROUP g1.', '', 'AT SELECTION-SCREEN.', '  IF p_gamng <= 0 OR p_lmnga < 0.', "    MESSAGE 'INVALID QTY' TYPE 'E'.", '  ENDIF.', '', 'START-OF-SELECTION.', "  IF r_pct = 'X'.", '    DATA(lv_pct) = p_lmnga * 100 DIV p_gamng.', '    WRITE |{ lv_pct }%|.', '  ELSE.', '    DATA(lv_rest) = p_gamng - p_lmnga.', '    IF lv_rest < 0.', '      lv_rest = 0.', '    ENDIF.', "    WRITE: 'REST', lv_rest.", '  ENDIF.') },

  { id: 6314, lv: 1, title: '예약 품목 찾기 (RESB 구조)',
    body: '생산오더의 자재 예약 목록 gt_itab 이 있습니다. 구조는 표준 테이블 RESB 를 본떴습니다.\n· bdmng: 소요량(필요한 수량), enmng: 이미 출고된 수량\n자재 p_matnr 의 예약을 찾아 출고 상태를 알려 주세요.\n· 첫째 줄: "ITEMS 예약품목수"\n· 둘째 줄: 찾으면 미출고 = bdmng - enmng 가 0보다 크면 "예약품목번호 미출고 OPEN", 아니면 "예약품목번호 0 DONE"\n· 없으면 둘째 줄에 "자재 NOT RESERVED"\nLOOP 없이 lines( ) 와 READ TABLE ... WITH KEY 를 쓰세요.',
    fields: [['resb-rspos', '예약 품목 번호'], ['resb-matnr', '자재'], ['resb-bdmng', '소요량'], ['resb-enmng', '출고된 수량']],
    ban: ['LOOP'], structs: { ty_resb: [{ n: 'rspos', t: 'string' }, { n: 'matnr', t: 'string' }, { n: 'bdmng', t: 'i' }, { n: 'enmng', t: 'i' }] },
    inputs: [{ n: 'p_matnr', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_resb' }], inDesc: 'gt_itab: 1~30행, 자재 중복 없음', outDesc: '두 줄을 출력합니다.',
    tests: [['RM2', [['0001', 'RM1', 200, 200], ['0002', 'RM2', 400, 150], ['0003', 'RM3', 100, 0]]], ['RM1', [['0001', 'RM1', 200, 200], ['0002', 'RM2', 400, 150]]], ['RM9', [['0001', 'RM1', 5, 0]]], ['RM4', [['0002', 'RM4', 50, 60]]]].map(([p_matnr, gt_itab]) => ({ p_matnr, gt_itab })),
    ref: ({ p_matnr, gt_itab }) => { const r = gt_itab.find(x => x[1] === p_matnr); const o = r ? (r[2] - r[3] > 0 ? `${r[0]} ${r[2] - r[3]} OPEN` : `${r[0]} 0 DONE`) : `${p_matnr} NOT RESERVED`; return `ITEMS ${gt_itab.length}\n${o}`; },
    sol: L("WRITE: 'ITEMS', lines( gt_itab ).", 'READ TABLE gt_itab INTO DATA(gs_resb) WITH KEY matnr = p_matnr.', 'IF sy-subrc <> 0.', "  WRITE: / p_matnr, 'NOT RESERVED'.", 'ELSE.', '  DATA(lv_open) = gs_resb-bdmng - gs_resb-enmng.', '  IF lv_open > 0.', "    WRITE: / gs_resb-rspos, lv_open, 'OPEN'.", '  ELSE.', "    WRITE: / gs_resb-rspos, 0, 'DONE'.", '  ENDIF.', 'ENDIF.') },
  // =================== Lv.2 초급 ===================
  { id: 7302, pgm: true, from: 6321, topic: '리포트', lv: 2, kind: 'rpt', title: '생산오더 자재 예약 조회 (RESB)',
    body: '생산오더 p_aufnr 에 필요한 자재 예약(RESB)을 읽어 목록으로 출력하세요.\n· 삭제 표시(xloek = \'X\')된 예약은 빼고, 예약품목번호(rspos) 순으로 정렬합니다.\n· 한 줄에 "예약품목 자재 소요량 출고량 미출고" (미출고 = bdmng - enmng, 0보다 작으면 0)\n· 마지막 줄에 "OPEN 미출고합계"\n· 예약이 없으면 NO RESERVATION 을 출력합니다.',
    fields: [['resb-rsnum', '예약 번호'], ['resb-aufnr', '생산오더 번호'], ['resb-bdmng', '소요량'], ['resb-enmng', '출고된 수량'], ['resb-xloek', '삭제 표시']],
    tables: ['resb'], sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE resb-aufnr', label: '생산오더' }],
    tests: ['100001', '100003', '100002', '100004'].map(p_aufnr => ({ p_aufnr, db: ppPick('resb') })),
    ref: ({ p_aufnr, db }) => { const r = ppSort(db.resb.filter(x => x[9] === p_aufnr && x[10] === ''), 1); if (!r.length) return 'NO RESERVATION'; let s = 0; const o = r.map(x => { const op = Math.max(0, x[5] - x[6]); s += op; return `${x[1]} ${x[2]} ${x[5]} ${x[6]} ${op}`; }); o.push(`OPEN ${s}`); return o.join('\n'); },
    sol: L('REPORT zpp_resb_list.', '', 'PARAMETERS p_aufnr TYPE resb-aufnr.', '', 'START-OF-SELECTION.', '  SELECT rspos, matnr, bdmng, enmng', '    FROM resb', '    WHERE aufnr = @p_aufnr', "      AND xloek = ' '", '    ORDER BY rspos', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO RESERVATION'.", '    RETURN.', '  ENDIF.', '', '  DATA lv_sum TYPE i.', '  LOOP AT gt_itab INTO DATA(gs_resb).', '    DATA(lv_open) = gs_resb-bdmng - gs_resb-enmng.', '    IF lv_open < 0.', '      lv_open = 0.', '    ENDIF.', '    WRITE: / gs_resb-rspos, gs_resb-matnr, gs_resb-bdmng, gs_resb-enmng, lv_open.', '    lv_sum = lv_sum + lv_open.', '  ENDLOOP.', "  WRITE: / 'OPEN', lv_sum.") },
  { id: 7303, pgm: true, from: 6322, topic: '리포트', lv: 2, kind: 'rpt', title: '오더별 실적 합계 (GROUP BY)',
    body: '생산 실적 확인 AFRU 를 오더별로 모아 보세요. 오더 범위는 s_aufnr 입니다.\n· 한 오더에 실적 확인(rueck)이 여러 건일 수 있습니다.\n· 오더번호 순으로 "오더 건수 실적합계"를 출력하고, 마지막 줄에 "TOTAL 전체실적"을 출력합니다.\n· SQL 의 COUNT(*), SUM( ) 과 GROUP BY 를 써 보세요. 데이터가 없으면 NO DATA.',
    fields: [['afru-rueck', '실적 확인 번호'], ['afru-aufnr', '생산오더 번호'], ['afru-lmnga', '확인된 양품 수량']],
    tables: ['afru'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afru-aufnr', label: '생산오더' }],
    tests: [[], [['I', 'EQ', '100001', '']], [['I', 'BT', '100002', '100009']], [['I', 'EQ', '100004', '']]].map(s_aufnr => ({ s_aufnr, db: { afru: PP_AFRU } })),
    ref: ({ s_aufnr, db }) => { const m = {}; db.afru.filter(x => jsIn(x[1], s_aufnr)).forEach(x => { m[x[1]] = m[x[1]] || [0, 0]; m[x[1]][0]++; m[x[1]][1] += x[2]; }); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; return [...k.map(a => `${a} ${m[a][0]} ${m[a][1]}`), `TOTAL ${k.reduce((s, a) => s + m[a][1], 0)}`].join('\n'); },
    sol: L('REPORT zpp_afru_sum.', '', 'SELECT-OPTIONS s_aufnr FOR afru-aufnr.', '', 'START-OF-SELECTION.', '  SELECT aufnr, COUNT(*) AS cnt, SUM( lmnga ) AS qty', '    FROM afru', '    WHERE aufnr IN @s_aufnr', '    GROUP BY aufnr', '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '  DATA lv_total TYPE i.', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    WRITE: / gs_itab-aufnr, gs_itab-cnt, gs_itab-qty.', '    lv_total = lv_total + gs_itab-qty.', '  ENDLOOP.', "  WRITE: / 'TOTAL', lv_total.") },

  { id: 6323, lv: 2, kind: 'rpt', title: '생산오더 릴리스 (UPDATE)', checkDb: ['zpp_order'],
    body: '생산오더 상태 테이블 ZPP_ORDER 에서, 오더 범위 s_aufnr 안의 생성(CRTD) 상태 오더를 릴리스(REL)하세요.\n· UPDATE zpp_order SET status = \'REL\' WHERE ... 한 문장으로 처리합니다.\n· 바뀐 건수(sy-dbcnt)를 "RELEASED 건수"로 출력하고 COMMIT WORK 합니다. 바뀐 오더가 없으면 NO ORDER.\n(채점기는 마지막에 ZPP_ORDER 내용도 비교합니다.)',
    fields: [['zpp_order-status', '오더 상태 (CRTD 생성, REL 릴리스, TECO 기술완료)'], ['zpp_order-aufnr', '생산오더 번호'], ['zpp_order-gamng', '계획수량']],
    tables: ['zpp_order'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR zpp_order-aufnr', label: '생산오더' }],
    tests: [[], [['I', 'EQ', '200003', '']], [['I', 'BT', '200002', '200004']], [['I', 'EQ', '200004', '']]].map(s_aufnr => ({ s_aufnr, db: { zpp_order: PP_ZORD() } })),
    ref: ({ s_aufnr, db }) => { const t = db.zpp_order.map(r => r.slice()); let n = 0; t.forEach(r => { if (jsIn(r[0], s_aufnr) && r[3] === 'CRTD') { r[3] = 'REL'; n++; } }); return (n ? `RELEASED ${n}` : 'NO ORDER') + '\n' + dump('zpp_order', t); },
    sol: L('REPORT zpp_release.', '', 'SELECT-OPTIONS s_aufnr FOR zpp_order-aufnr.', '', 'START-OF-SELECTION.', "  UPDATE zpp_order SET status = 'REL'", "    WHERE aufnr IN @s_aufnr", "      AND status = 'CRTD'.", '  IF sy-dbcnt > 0.', '    COMMIT WORK.', "    WRITE: 'RELEASED', sy-dbcnt.", '  ELSE.', "    WRITE 'NO ORDER'.", '  ENDIF.') },

  { id: 7304, pgm: true, from: 6324, topic: 'ALV', lv: 2, kind: 'rpt', title: '오더 공정 ALV (AFKO → AFVC + AFVV)',
    body: '생산오더 p_aufnr 의 공정 목록을 ALV 로 보여 주세요.\n· 오더 헤더 AFKO 의 aufpl(공정 번호 키)로 공정 AFVC 와 공정 수량·시간 AFVV 를 찾습니다. AFVC 와 AFVV 는 aufpl + aplzl 로 INNER JOIN 합니다.\n· 공정번호(vornr) 순으로 정렬합니다.\n· 필드 카탈로그(slis_t_fieldcat_alv): VORNR(공정), ARBPL(작업장), LTXA1(내역), VGW01(준비), VGW02(기계) — seltext_m 에 괄호 안 이름\n· REUSE_ALV_GRID_DISPLAY 의 i_grid_title 은 공정 목록 입니다.\n· 오더가 없으면 NO ORDER, 공정이 없으면 NO OPERATION 을 출력합니다.',
    fields: [['afko-aufpl', '공정 번호(라우팅 키)'], ['afvc-aplzl', '공정 내부 카운터'], ['afvc-vornr', '공정 번호'], ['afvc-arbpl', '작업장'], ['afvv-vgw01', '표준값 1 (준비시간)']],
    tables: ['afko', 'afvc', 'afvv'], sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE afko-aufnr', label: '생산오더' }],
    tests: [{ p_aufnr: '100001', db: ppPick('afko', 'afvc', 'afvv') }, { p_aufnr: '100002', db: ppPick('afko', 'afvc', 'afvv') }, { p_aufnr: '199999', db: ppPick('afko', 'afvc', 'afvv') }, { p_aufnr: '100004', db: { afko: PP_AFKO8, afvc: PP_AFVC.filter(x => x[0] !== 'A004'), afvv: PP_AFVV } }],
    ref: ({ p_aufnr, db }) => { const h = db.afko.find(x => x[0] === p_aufnr); if (!h) return 'NO ORDER'; const r = ppSort(db.afvc.filter(x => x[0] === h[4]).map(c => { const v = db.afvv.find(y => y[0] === c[0] && y[1] === c[1]); return v ? [c[2], c[3], c[5], String(v[2]), String(v[3])] : null; }).filter(Boolean)); return r.length ? alvTxt('공정 목록', ['공정', '작업장', '내역', '준비', '기계'], r) : 'NO OPERATION'; },
    sol: L('REPORT zpp_oper_alv.', '', 'PARAMETERS p_aufnr TYPE afko-aufnr.', '', 'START-OF-SELECTION.', '  SELECT SINGLE aufpl FROM afko', '    WHERE aufnr = @p_aufnr', '    INTO @DATA(lv_aufpl).', '  IF sy-subrc <> 0.', "    WRITE 'NO ORDER'.", '    RETURN.', '  ENDIF.', '', '  SELECT c~vornr, c~arbpl, c~ltxa1, v~vgw01, v~vgw02', '    FROM afvc AS c', '    INNER JOIN afvv AS v ON c~aufpl = v~aufpl', '                        AND c~aplzl = v~aplzl', '    WHERE c~aufpl = @lv_aufpl', '    ORDER BY vornr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO OPERATION'.", '    RETURN.', '  ENDIF.', '', '  DATA gt_fcat TYPE slis_t_fieldcat_alv.', "  APPEND VALUE #( fieldname = 'VORNR' seltext_m = '공정' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'ARBPL' seltext_m = '작업장' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'LTXA1' seltext_m = '내역' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'VGW01' seltext_m = '준비' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'VGW02' seltext_m = '기계' ) TO gt_fcat.", '', "  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'", '    EXPORTING', "      i_grid_title = '공정 목록'", '      it_fieldcat  = gt_fcat', '    TABLES', '      t_outtab     = gt_itab.') },
  // =================== Lv.3 중급 ===================
  { id: 7305, pgm: true, from: 6331, topic: '클래스', lv: 3, title: '생산오더 클래스', must: ['CLASS'],
    body: '로컬 클래스 lcl_prod_order 로 생산 실적 확인을 처리하세요.\n· constructor: 계획수량 iv_gamng 을 받습니다.\n· confirm( iv_qty ) RETURNING rv_ok: 지금까지 실적 + iv_qty 가 계획수량 이하면 실적에 더하고 abap_true, 넘으면 더하지 않고 abap_false\n· get_rest( ) RETURNING rv_rest: 잔량(계획수량 - 실적)\n계획수량 p_gamng 으로 객체를 만들고, 실적 확인 수량 gt_itab 을 차례로 처리하세요.\n확인마다 "수량 OK" 또는 "수량 REJECT", 마지막 줄에 "REST 잔량"을 출력합니다.',
    fields: [['afru-lmnga', '확인된 양품 수량'], ['afko-gamng', '오더 계획수량']],
    inputs: [{ n: 'p_gamng', t: 'i' }, { n: 'gt_itab', t: 'itab_i' }], inDesc: '1 ≤ p_gamng ≤ 10,000 / gt_itab: 실적 수량, 1~30행', outDesc: '확인마다 한 줄, 마지막에 잔량을 출력합니다.',
    tests: [[100, [40, 50, 20, 10]], [10, [11]], [50, [50, 1]], [30, [5, 5, 5]]].map(([p_gamng, gt_itab]) => ({ p_gamng, gt_itab })),
    ref: ({ p_gamng: g, gt_itab }) => { let d = 0; const o = gt_itab.map(q => { if (d + q <= g) { d += q; return `${q} OK`; } return `${q} REJECT`; }); o.push(`REST ${g - d}`); return o.join('\n'); },
    sol: L('CLASS lcl_prod_order DEFINITION.', '  PUBLIC SECTION.', '    METHODS: constructor IMPORTING iv_gamng TYPE i,', '             confirm     IMPORTING iv_qty TYPE i RETURNING VALUE(rv_ok) TYPE abap_bool,', '             get_rest    RETURNING VALUE(rv_rest) TYPE i.', '  PRIVATE SECTION.', '    DATA: mv_gamng TYPE i,', '          mv_done  TYPE i.', 'ENDCLASS.', '', 'CLASS lcl_prod_order IMPLEMENTATION.', '  METHOD constructor.', '    mv_gamng = iv_gamng.', '  ENDMETHOD.', '  METHOD confirm.', '    IF mv_done + iv_qty <= mv_gamng.', '      mv_done = mv_done + iv_qty.', '      rv_ok = abap_true.', '    ELSE.', '      rv_ok = abap_false.', '    ENDIF.', '  ENDMETHOD.', '  METHOD get_rest.', '    rv_rest = mv_gamng - mv_done.', '  ENDMETHOD.', 'ENDCLASS.', '', 'START-OF-SELECTION.', '  DATA(go_order) = NEW lcl_prod_order( p_gamng ).', '  LOOP AT gt_itab INTO DATA(lv_qty).', '    IF go_order->confirm( lv_qty ) = abap_true.', "      WRITE: / lv_qty, 'OK'.", '    ELSE.', "      WRITE: / lv_qty, 'REJECT'.", '    ENDIF.', '  ENDLOOP.', "  WRITE: / 'REST', go_order->get_rest( )."),
  },

  { id: 7306, pgm: true, from: 6332, topic: 'ALV', lv: 3, kind: 'rpt', title: '생산오더 ALV 더블클릭 → 시스템 상태', must: ['cl_gui_alv_grid', 'double_click'],
    body: '생산오더(AFKO)를 CL_GUI_ALV_GRID 로 보여 주고, 행을 더블클릭하면 그 오더의 시스템 상태를 메시지로 보여 주세요.\n· ALV 열: AUFNR(오더), MATNR(자재), GAMNG(계획수량) — 오더번호 순\n· 오더의 상태 오브젝트 번호는 \'OR\' && 오더번호 입니다(예: OR100001). JEST 에서 inact 가 비어 있는(활성) 상태만 읽고, TJ02T(spras = \'3\')에서 짧은 내역 txt04 를 찾습니다.\n· 상태코드(stat) 순으로 내역을 이어 MESSAGE |오더 내역1 내역2 …| TYPE \'I\' 로 보여 줍니다. 내역이 없는 상태코드는 건너뜁니다.\n· 보여 줄 상태가 없으면 |오더 NO STATUS| 입니다.\n· 채점기가 테스트마다 "n번째 행 더블클릭"을 대신 일으킵니다(e_row-index = n).',
    fields: [['jest-objnr', '오브젝트 번호 (OR+오더)'], ['jest-stat', '상태 코드 (I0002 등)'], ['jest-inact', '비활성 표시'], ['tj02t-txt04', '상태 약어 (REL, TECO …)']],
    tables: ['afko', 'jest', 'tj02t'], sel: [],
    tests: [[{ ev: 'double_click', row: 1, col: 'AUFNR' }], [{ ev: 'double_click', row: 2, col: 'MATNR' }, { ev: 'double_click', row: 3, col: 'GAMNG' }], [{ ev: 'double_click', row: 4, col: 'AUFNR' }]].map(events => ({ events, db: ppPick('afko', 'jest', 'tj02t') })).concat([{ events: [{ ev: 'double_click', row: 1, col: 'AUFNR' }], db: { afko: PP_AFKO8, jest: PP_JEST.filter(x => x[0] !== 'OR100001'), tj02t: PP_TJ02T } }]),
    ref: ({ events, db }) => { const r = ppSort(db.afko); const out = [alvTxt('', ['오더', '자재', '계획수량'], r.map(x => [x[0], x[1], String(x[2])]))]; for (const e of events) { const o = r[e.row - 1]; const t = ppActive(db, o[0]).map(s => ppTxt(db, s)).filter(Boolean).map(x => x[2]); out.push(t.length ? `${o[0]} ${t.join(' ')}` : `${o[0]} NO STATUS`); } return out.join('\n'); },
    sol: L('REPORT zpp_afko_status.', '', 'DATA: go_grid TYPE REF TO cl_gui_alv_grid,', '      gt_fcat TYPE lvc_t_fcat,', '      gt_itab TYPE TABLE OF afko.', '', 'CLASS lcl_handler DEFINITION.', '  PUBLIC SECTION.', '    METHODS on_double_click FOR EVENT double_click OF cl_gui_alv_grid', '      IMPORTING e_row e_column.', 'ENDCLASS.', '', 'CLASS lcl_handler IMPLEMENTATION.', '  METHOD on_double_click.', '    READ TABLE gt_itab INTO DATA(gs_itab) INDEX e_row-index.', '    CHECK sy-subrc = 0.', "    DATA(lv_objnr) = |OR{ gs_itab-aufnr }|.", '    SELECT j~stat, t~txt04', '      FROM jest AS j', '      INNER JOIN tj02t AS t ON j~stat = t~istat', '      WHERE j~objnr = @lv_objnr', "        AND j~inact = ' '", "        AND t~spras = '3'", '      ORDER BY stat', '      INTO TABLE @DATA(gt_stat).', '    IF gt_stat IS INITIAL.', "      MESSAGE |{ gs_itab-aufnr } NO STATUS| TYPE 'I'.", '      RETURN.', '    ENDIF.', '    DATA(lv_msg) = CONV string( gs_itab-aufnr ).', '    LOOP AT gt_stat INTO DATA(gs_stat).', '      lv_msg = |{ lv_msg } { gs_stat-txt04 }|.', '    ENDLOOP.', "    MESSAGE lv_msg TYPE 'I'.", '  ENDMETHOD.', 'ENDCLASS.', '', 'START-OF-SELECTION.', '  SELECT * FROM afko ORDER BY aufnr INTO TABLE @gt_itab.', '', "  gt_fcat = VALUE #( ( fieldname = 'AUFNR' coltext = '오더' )", "                     ( fieldname = 'MATNR' coltext = '자재' )", "                     ( fieldname = 'GAMNG' coltext = '계획수량' ) ).", '  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).', '  DATA(go_handler) = NEW lcl_handler( ).', '  SET HANDLER go_handler->on_double_click FOR go_grid.', '  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab', '                                                 it_fieldcatalog = gt_fcat ).') },
  { id: 7307, pgm: true, from: 6333, topic: 'ALV', lv: 3, kind: 'rpt', title: '오더 상태 버튼 (user_command)', must: ['cl_gui_alv_grid', 'user_command'], checkDb: ['zpp_order'],
    body: '생산오더 상태 테이블 ZPP_ORDER 를 ALV 로 보여 주고, 툴바 버튼으로 상태를 바꾸세요.\n· 처음에 오더 전체를 오더번호 순으로 표시합니다(필드 카탈로그 없이 i_structure_name = \'ZPP_ORDER\').\n· user_command 이벤트의 e_ucomm 이\n  - RELEASE 이면: 상태 CRTD 인 오더를 REL 로\n  - TECO 이면: 상태 REL 인 오더를 TECO 로\n  화면 테이블과 DB 를 함께 바꾸고 COMMIT WORK, refresh_table_display( ) 로 다시 그립니다.\n  - 그 밖의 명령은 아무것도 하지 않습니다(다시 그리지도 않음).\n· 채점기가 버튼 명령을 차례로 일으키고, 마지막에 ZPP_ORDER 내용도 비교합니다.',
    fields: [['zpp_order-aufnr', '생산오더 번호'], ['zpp_order-status', '오더 상태 (CRTD → REL → TECO)'], ['sy-ucomm', '누른 기능 코드']],
    tables: ['zpp_order'], sel: [],
    tests: [[{ ev: 'user_command', ucomm: 'RELEASE' }], [{ ev: 'user_command', ucomm: 'TECO' }, { ev: 'user_command', ucomm: 'RELEASE' }], [{ ev: 'user_command', ucomm: 'BACK' }], [{ ev: 'user_command', ucomm: 'RELEASE' }, { ev: 'user_command', ucomm: 'TECO' }]].map(events => ({ events, db: { zpp_order: PP_ZORD() } })),
    ref: ({ events, db }) => { const t = ppSort(db.zpp_order.map(r => r.slice())); const show = () => alvTxt('', ['AUFNR', 'MATNR', 'GAMNG', 'STATUS'], t.map(r => r.map(String))); const out = [show()]; for (const e of events) { const m = { RELEASE: ['CRTD', 'REL'], TECO: ['REL', 'TECO'] }[e.ucomm]; if (!m) continue; t.forEach(r => { if (r[3] === m[0]) r[3] = m[1]; }); out.push(show()); } return out.join('\n') + '\n' + dump('zpp_order', t); },
    sol: L('REPORT zpp_order_cmd.', '', 'DATA: go_grid TYPE REF TO cl_gui_alv_grid,', '      gt_itab TYPE TABLE OF zpp_order.', '', 'CLASS lcl_handler DEFINITION.', '  PUBLIC SECTION.', '    METHODS on_command FOR EVENT user_command OF cl_gui_alv_grid', '      IMPORTING e_ucomm.', '    METHODS change IMPORTING iv_from TYPE string iv_to TYPE string.', 'ENDCLASS.', '', 'CLASS lcl_handler IMPLEMENTATION.', '  METHOD on_command.', '    CASE e_ucomm.', "      WHEN 'RELEASE'.", "        me->change( iv_from = 'CRTD' iv_to = 'REL' ).", "      WHEN 'TECO'.", "        me->change( iv_from = 'REL' iv_to = 'TECO' ).", '      WHEN OTHERS.', '        RETURN.', '    ENDCASE.', '    COMMIT WORK.', '    go_grid->refresh_table_display( ).', '  ENDMETHOD.', '  METHOD change.', '    UPDATE zpp_order SET status = @iv_to WHERE status = @iv_from.', '    LOOP AT gt_itab INTO DATA(gs_itab) WHERE status = iv_from.', '      gs_itab-status = iv_to.', '      MODIFY gt_itab FROM gs_itab.', '    ENDLOOP.', '  ENDMETHOD.', 'ENDCLASS.', '', 'START-OF-SELECTION.', '  SELECT * FROM zpp_order ORDER BY aufnr INTO TABLE @gt_itab.', '  CREATE OBJECT go_grid EXPORTING i_parent = cl_gui_container=>default_screen.', '  DATA(go_handler) = NEW lcl_handler( ).', '  SET HANDLER go_handler->on_command FOR go_grid.', "  go_grid->set_table_for_first_display( EXPORTING i_structure_name = 'ZPP_ORDER'", '                                        CHANGING  it_outtab        = gt_itab ).') },

  { id: 7308, pgm: true, from: 6334, topic: 'CRUD', lv: 3, kind: 'rpt', title: '작업장 관리 CRUD 리포트', checkDb: ['zpp_workctr'],
    body: '라디오버튼으로 작업을 골라 작업장 능력 테이블 ZPP_WORKCTR 를 관리하는 리포트를 만드세요.\n· r_c 등록: 같은 작업장이 있으면 MESSAGE \'ALREADY EXISTS\' TYPE \'E\', 없으면 INSERT 후 CREATED\n· r_r 조회: "작업장 플랜트 내역 능력" 출력, 없으면 NOT FOUND\n· r_u 수정: 선택 화면 값으로 UPDATE 후 UPDATED, 없으면 NOT FOUND\n· r_d 삭제: DELETE 후 DELETED, 없으면 NOT FOUND\n· 선택 화면: p_arbpl, p_werks, p_ktext, p_capa (TYPE zpp_workctr-필드)\n변경 후에는 COMMIT WORK 합니다. (채점기는 마지막에 ZPP_WORKCTR 내용도 비교합니다.)',
    fields: [['zpp_workctr-arbpl', '작업장'], ['zpp_workctr-werks', '플랜트'], ['zpp_workctr-ktext', '작업장 내역'], ['zpp_workctr-capa', '하루 능력(분)']],
    tables: ['zpp_workctr'], sel: [{ n: 'r_c', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '등록' }, { n: 'r_r', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '조회' }, { n: 'r_u', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '수정' }, { n: 'r_d', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '삭제' }, { n: 'p_arbpl', kind: 'p', decl: 'TYPE zpp_workctr-arbpl', label: '작업장' }, { n: 'p_werks', kind: 'p', decl: 'TYPE zpp_workctr-werks', label: '플랜트' }, { n: 'p_ktext', kind: 'p', decl: 'TYPE zpp_workctr-ktext', label: '내역' }, { n: 'p_capa', kind: 'p', decl: 'TYPE zpp_workctr-capa', label: '능력' }],
    tests: [['C', 'WC40', '1000', '검사', 800], ['R', 'WC20', '', '', 0], ['U', 'WC10', '1000', '조립A', 2500], ['D', 'WC30', '', '', 0], ['C', 'WC10', '1000', '중복', 1], ['U', 'WC99', '1000', 'X', 1], ['R', 'WC99', '', '', 0], ['D', 'WC99', '', '', 0]]
      .map(([m, p_arbpl, p_werks, p_ktext, p_capa]) => ({ r_c: m === 'C' ? 'X' : '', r_r: m === 'R' ? 'X' : '', r_u: m === 'U' ? 'X' : '', r_d: m === 'D' ? 'X' : '', p_arbpl, p_werks, p_ktext, p_capa, db: { zpp_workctr: PP_ZWC() } })),
    ref: (x) => { const t = x.db.zpp_workctr.map(r => r.slice()); const i = t.findIndex(r => r[0] === x.p_arbpl); let m; const row = [x.p_arbpl, x.p_werks, x.p_ktext, x.p_capa];
      if (x.r_c === 'X') { if (i >= 0) m = 'ALREADY EXISTS'; else { t.push(row); m = 'CREATED'; } }
      else if (x.r_r === 'X') m = i >= 0 ? t[i].join(' ') : 'NOT FOUND';
      else if (x.r_u === 'X') { if (i >= 0) { t[i] = row; m = 'UPDATED'; } else m = 'NOT FOUND'; }
      else { if (i >= 0) { t.splice(i, 1); m = 'DELETED'; } else m = 'NOT FOUND'; }
      return m + '\n' + dump('zpp_workctr', t); },
    sol: L('REPORT zpp_workctr_crud.', '', 'PARAMETERS: r_c RADIOBUTTON GROUP g1,', '            r_r RADIOBUTTON GROUP g1,', '            r_u RADIOBUTTON GROUP g1,', '            r_d RADIOBUTTON GROUP g1.', 'PARAMETERS: p_arbpl TYPE zpp_workctr-arbpl,', '            p_werks TYPE zpp_workctr-werks,', '            p_ktext TYPE zpp_workctr-ktext,', '            p_capa  TYPE zpp_workctr-capa.', '', 'START-OF-SELECTION.', '  DATA(gs_wc) = VALUE zpp_workctr( arbpl = p_arbpl werks = p_werks ktext = p_ktext capa = p_capa ).', '', "  IF r_c = 'X'.", '    SELECT SINGLE arbpl FROM zpp_workctr WHERE arbpl = @p_arbpl INTO @DATA(lv_arbpl).', '    IF sy-subrc = 0.', "      MESSAGE 'ALREADY EXISTS' TYPE 'E'.", '    ENDIF.', '    INSERT zpp_workctr FROM gs_wc.', '    COMMIT WORK.', "    WRITE 'CREATED'.", '', "  ELSEIF r_r = 'X'.", '    SELECT SINGLE * FROM zpp_workctr WHERE arbpl = @p_arbpl INTO @DATA(gs_read).', '    IF sy-subrc = 0.', '      WRITE: gs_read-arbpl, gs_read-werks, gs_read-ktext, gs_read-capa.', '    ELSE.', "      WRITE 'NOT FOUND'.", '    ENDIF.', '', "  ELSEIF r_u = 'X'.", '    UPDATE zpp_workctr FROM gs_wc.', '    IF sy-subrc = 0.', '      COMMIT WORK.', "      WRITE 'UPDATED'.", '    ELSE.', "      WRITE 'NOT FOUND'.", '    ENDIF.', '', '  ELSE.', '    DELETE FROM zpp_workctr WHERE arbpl = @p_arbpl.', '    IF sy-subrc = 0.', '      COMMIT WORK.', "      WRITE 'DELETED'.", '    ELSE.', "      WRITE 'NOT FOUND'.", '    ENDIF.', '  ENDIF.') },

  // =================== Lv.4 고급 ===================
  { id: 7309, pgm: true, from: 6341, topic: '리포트', lv: 4, kind: 'rpt', title: '생산오더 종합 현황 (AFKO·MATDOC·JEST)',
    body: '생산오더 범위 s_aufnr 의 진척과 상태를 한눈에 보는 리포트를 만드세요.\n· 오더 헤더는 AFKO 입니다. 오더번호 순으로 처리합니다.\n· 입고수량 = 자재 문서 MATDOC 에서 그 오더(aufnr)의 이동유형 101(생산 입고) 수량 합 - 102(입고 취소) 수량 합\n· 진척률 = 입고수량 × 100 DIV 계획수량(gamng)\n· 상태 = JEST(objnr = \'OR\' && 오더, inact 공백)의 활성 상태를 TJ02T(spras = \'3\') 의 txt04 로 바꿔 상태코드 순으로 / 로 이은 것. 없으면 - \n· 한 줄에 "오더 자재 계획수량 입고수량 진척률% 상태"\n· 해당 오더가 없으면 NO DATA',
    fields: [['matdoc-bwart', '이동 유형 (101 입고 / 102 취소 / 261 출고)'], ['matdoc-aufnr', '생산오더 번호'], ['matdoc-menge', '수량'], ['jest-stat', '상태 코드'], ['tj02t-txt04', '상태 약어']],
    tables: ['afko', 'matdoc', 'jest', 'tj02t'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afko-aufnr', label: '생산오더' }],
    tests: [[], [['I', 'BT', '100001', '100002']], [['I', 'EQ', '100003', ''], ['I', 'EQ', '100004', '']], [['I', 'EQ', '300000', '']]].map(s_aufnr => ({ s_aufnr, db: ppPick('afko', 'matdoc', 'jest', 'tj02t') })),
    ref: ({ s_aufnr, db }) => {
      const inR = a => !s_aufnr.length || s_aufnr.some(([, o, l, h]) => o === 'EQ' ? a === l : a >= l && a <= h);
      const r = ppSort(db.afko.filter(x => inR(x[0]))); if (!r.length) return 'NO DATA';
      return r.map(x => { const gr = db.matdoc.filter(m => m[14] === x[0]).reduce((s, m) => s + (m[3] === '101' ? m[8] : m[3] === '102' ? -m[8] : 0), 0); const st = ppActive(db, x[0]).map(s => ppTxt(db, s)).filter(Boolean).map(t => t[2]); return `${x[0]} ${x[1]} ${x[2]} ${gr} ${Math.floor(gr * 100 / x[2])}% ${st.length ? st.join('/') : '-'}`; }).join('\n'); },
    sol: L('REPORT zpp_order_overview.', '', 'TABLES afko.', 'SELECT-OPTIONS s_aufnr FOR afko-aufnr.', '', 'START-OF-SELECTION.', '  SELECT aufnr, matnr, gamng FROM afko', '    WHERE aufnr IN @s_aufnr', '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '', '  SELECT aufnr, bwart, menge FROM matdoc', '    FOR ALL ENTRIES IN @gt_itab', '    WHERE aufnr = @gt_itab-aufnr', "      AND bwart IN ( '101', '102' )", '    INTO TABLE @DATA(gt_md).', '', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    DATA(lv_gr) = 0.', '    LOOP AT gt_md INTO DATA(gs_md) WHERE aufnr = gs_itab-aufnr.', "      IF gs_md-bwart = '101'.", '        lv_gr = lv_gr + gs_md-menge.', '      ELSE.', '        lv_gr = lv_gr - gs_md-menge.', '      ENDIF.', '    ENDLOOP.', '    DATA(lv_pct) = lv_gr * 100 DIV gs_itab-gamng.', '', "    DATA(lv_objnr) = |OR{ gs_itab-aufnr }|.", '    SELECT j~stat, t~txt04', '      FROM jest AS j', '      INNER JOIN tj02t AS t ON j~stat = t~istat', '      WHERE j~objnr = @lv_objnr', "        AND j~inact = ' '", "        AND t~spras = '3'", '      ORDER BY stat', '      INTO TABLE @DATA(gt_stat).', "    DATA(lv_stat) = ``.", '    LOOP AT gt_stat INTO DATA(gs_stat).', '      IF lv_stat IS INITIAL.', '        lv_stat = gs_stat-txt04.', '      ELSE.', "        lv_stat = |{ lv_stat }/{ gs_stat-txt04 }|.", '      ENDIF.', '    ENDLOOP.', '    IF lv_stat IS INITIAL.', "      lv_stat = '-'.", '    ENDIF.', "    WRITE: / gs_itab-aufnr, gs_itab-matnr, gs_itab-gamng, lv_gr, |{ lv_pct }%|, lv_stat.", '  ENDLOOP.') },
  { id: 7310, pgm: true, from: 6342, topic: '리포트', lv: 4, kind: 'rpt', title: '자재 출고 대사 (RESB ↔ MATDOC)',
    body: '생산오더 p_aufnr 의 자재 예약(RESB)과 실제 출고 문서(MATDOC)를 맞춰 보는 리포트를 만드세요.\n· 예약: RESB 에서 그 오더의 삭제되지 않은(xloek 공백) 예약을 예약품목(rspos) 순으로 읽습니다.\n· 실출고 = MATDOC 에서 그 오더·자재의 이동유형 261(오더 출고) 수량 합 - 262(출고 취소) 수량 합\n· 상태: 실출고 0 → OPEN / 소요량보다 적음 → PART / 같음 → FULL / 많음 → OVER\n· 한 줄에 "예약품목 자재 소요량 실출고 상태"\n· 마지막 줄에 "MISMATCH 건수" — RESB 의 출고량(enmng)과 실출고가 다른 예약 건수\n· 예약이 없으면 NO RESERVATION',
    fields: [['resb-bdmng', '소요량'], ['resb-enmng', '출고된 수량 (예약 기준)'], ['matdoc-bwart', '이동 유형 (261 출고 / 262 취소)'], ['matdoc-shkzg', '차대 구분 (H 출고 / S 입고)'], ['matdoc-aufnr', '생산오더 번호']],
    tables: ['resb', 'matdoc'], sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE resb-aufnr', label: '생산오더' }],
    tests: ['100001', '100002', '100003', '100004'].map(p_aufnr => ({ p_aufnr, db: ppPick('resb', 'matdoc') })),
    ref: ({ p_aufnr, db }) => { const r = ppSort(db.resb.filter(x => x[9] === p_aufnr && x[10] === ''), 1); if (!r.length) return 'NO RESERVATION'; let mis = 0; const o = r.map(x => { const a = db.matdoc.filter(m => m[14] === p_aufnr && m[4] === x[2]).reduce((s, m) => s + (m[3] === '261' ? m[8] : m[3] === '262' ? -m[8] : 0), 0); if (a !== x[6]) mis++; const st = a === 0 ? 'OPEN' : a < x[5] ? 'PART' : a === x[5] ? 'FULL' : 'OVER'; return `${x[1]} ${x[2]} ${x[5]} ${a} ${st}`; }); o.push(`MISMATCH ${mis}`); return o.join('\n'); },
    sol: L('REPORT zpp_gi_recon.', '', 'PARAMETERS p_aufnr TYPE resb-aufnr.', '', 'START-OF-SELECTION.', '  SELECT rspos, matnr, bdmng, enmng FROM resb', '    WHERE aufnr = @p_aufnr', "      AND xloek = ' '", '    ORDER BY rspos', '    INTO TABLE @DATA(gt_resb).', '  IF gt_resb IS INITIAL.', "    WRITE 'NO RESERVATION'.", '    RETURN.', '  ENDIF.', '', '  SELECT matnr, bwart, menge FROM matdoc', '    WHERE aufnr = @p_aufnr', "      AND bwart IN ( '261', '262' )", '    INTO TABLE @DATA(gt_md).', '', '  DATA lv_mis TYPE i.', '  LOOP AT gt_resb INTO DATA(gs_resb).', '    DATA(lv_act) = 0.', '    LOOP AT gt_md INTO DATA(gs_md) WHERE matnr = gs_resb-matnr.', "      IF gs_md-bwart = '261'.", '        lv_act = lv_act + gs_md-menge.', '      ELSE.', '        lv_act = lv_act - gs_md-menge.', '      ENDIF.', '    ENDLOOP.', '    IF lv_act <> gs_resb-enmng.', '      lv_mis = lv_mis + 1.', '    ENDIF.', '    DATA(lv_st) = COND string( WHEN lv_act = 0 THEN `OPEN`', '                               WHEN lv_act < gs_resb-bdmng THEN `PART`', '                               WHEN lv_act = gs_resb-bdmng THEN `FULL`', '                               ELSE `OVER` ).', '    WRITE: / gs_resb-rspos, gs_resb-matnr, gs_resb-bdmng, lv_act, lv_st.', '  ENDLOOP.', "  WRITE: / 'MISMATCH', lv_mis.") },
  reuse(2023, { id: 7311, pgm: true, from: 6343, topic: '리포트', lv: 4, title: 'BOM 다단계 전개',
    body: '완제품 top 을 n개 만들려고 합니다. BOM 목록 gt_itab 의 한 줄은 "parent(MAST-MATNR) 1개를 만들려면 child(STPO-IDNRK)가 qty(STPO-MENGE)개 필요하다"는 뜻입니다. child 가 또 다른 반제품일 수도 있어요.\nparent 로 한 번도 나오지 않는 자재가 원자재입니다.\n필요한 원자재별 총수량을 자재코드 순으로 출력하세요. (top 과 상관없는 줄도 섞여 있어요)',
    fields: [['mast-matnr', 'BOM 의 상위 자재'], ['stpo-idnrk', '구성품 자재'], ['stpo-menge', '구성품 수량']] }),

  { id: 7312, pgm: true, from: 6344, topic: '리포트', lv: 4, kind: 'rpt', title: '작업장 부하 분석 (AFVC·AFVV)',
    body: '생산 시작일(gstrp)이 s_gstrp 범위에 드는 생산오더의 공정 부하를 작업장별로 모아 능력과 비교하세요.\n· 오더 AFKO → aufpl 로 공정 AFVC, 공정 수량·시간 AFVV(aufpl + aplzl) 를 찾습니다.\n· 사내 공정(steus = \'PP01\')만 셉니다. PP02 는 외주라 뺍니다.\n· 공정 부하(분) = vgw01(준비) + vgw02(기계, 1개당) × mgvrg(공정수량)\n· 작업장 능력은 ZPP_WORKCTR-CAPA(분) 입니다.\n· 작업장 순으로 "작업장 부하 능력 사용률% 판정" (사용률 = 부하 × 100 DIV 능력, 100 초과면 OVER 아니면 OK)\n· 해당 오더나 공정이 없으면 NO LOAD',
    fields: [['afko-gstrp', '기본 시작일'], ['afvc-steus', '제어키 (PP01 사내 / PP02 외주)'], ['afvv-vgw02', '표준값 2 (기계시간)'], ['afvv-mgvrg', '공정 수량'], ['zpp_workctr-capa', '작업장 능력(분)']],
    tables: ['afko', 'afvc', 'afvv', 'zpp_workctr'], sel: [{ n: 's_gstrp', kind: 's', decl: 'FOR afko-gstrp', label: '시작일' }],
    tests: [[], [['I', 'BT', '20261101', '20261105']], [['I', 'EQ', '20261112', '']], [['I', 'GE', '20261201', '']]].map(s_gstrp => ({ s_gstrp, db: { afko: PP_AFKO8, afvc: PP_AFVC, afvv: PP_AFVV, zpp_workctr: PP_ZWC2() } })),
    ref: ({ s_gstrp, db }) => {
      const inR = d => !s_gstrp.length || s_gstrp.some(([, o, l, h]) => o === 'EQ' ? d === l : o === 'GE' ? d >= l : d >= l && d <= h);
      const m = {}; db.afko.filter(x => inR(x[5])).forEach(h => db.afvc.filter(c => c[0] === h[4] && c[4] === 'PP01').forEach(c => { const v = db.afvv.find(y => y[0] === c[0] && y[1] === c[1]); if (v) m[c[3]] = (m[c[3]] || 0) + v[2] + v[3] * v[4]; }));
      const ks = Object.keys(m).sort(); if (!ks.length) return 'NO LOAD';
      return ks.map(k => { const cp = db.zpp_workctr.find(w => w[0] === k)[3]; const u = Math.floor(m[k] * 100 / cp); return `${k} ${m[k]} ${cp} ${u}% ${u > 100 ? 'OVER' : 'OK'}`; }).join('\n'); },
    sol: L('REPORT zpp_wc_load.', '', 'TABLES afko.', 'SELECT-OPTIONS s_gstrp FOR afko-gstrp.', '', 'TYPES: BEGIN OF ty_load,', '         arbpl TYPE string,', '         load  TYPE i,', '       END OF ty_load.', 'DATA gt_load TYPE TABLE OF ty_load.', '', 'START-OF-SELECTION.', '  SELECT c~arbpl, v~vgw01, v~vgw02, v~mgvrg', '    FROM afko AS h', '    INNER JOIN afvc AS c ON h~aufpl = c~aufpl', '    INNER JOIN afvv AS v ON c~aufpl = v~aufpl', '                        AND c~aplzl = v~aplzl', '    WHERE h~gstrp IN @s_gstrp', "      AND c~steus = 'PP01'", '    INTO TABLE @DATA(gt_op).', '  IF gt_op IS INITIAL.', "    WRITE 'NO LOAD'.", '    RETURN.', '  ENDIF.', '', '  LOOP AT gt_op INTO DATA(gs_op).', '    DATA(gs_load) = VALUE ty_load( arbpl = gs_op-arbpl', '                                   load  = gs_op-vgw01 + gs_op-vgw02 * gs_op-mgvrg ).', '    COLLECT gs_load INTO gt_load.', '  ENDLOOP.', '  SORT gt_load BY arbpl.', '', '  SELECT arbpl, capa FROM zpp_workctr INTO TABLE @DATA(gt_wc).', '  LOOP AT gt_load INTO gs_load.', '    READ TABLE gt_wc INTO DATA(gs_wc) WITH KEY arbpl = gs_load-arbpl.', '    DATA(lv_pct) = gs_load-load * 100 DIV gs_wc-capa.', '    DATA(lv_flag) = COND string( WHEN lv_pct > 100 THEN `OVER` ELSE `OK` ).', '    WRITE: / gs_load-arbpl, gs_load-load, gs_wc-capa, |{ lv_pct }%|, lv_flag.', '  ENDLOOP.') },
  // =================== Lv.5 New Syntax ===================
  { id: 6351, lv: 5, title: 'VALUE ... FOR WHERE 로 미출고 예약',
    body: '생산오더의 자재 예약 gt_itab(구조는 RESB 를 본뜬 ty_resb)이 있습니다.\n삭제 표시(xloek)가 없고 아직 덜 출고된(bdmng > enmng) 예약만 골라, 미출고 수량(bdmng - enmng)을 담은 새 테이블을 VALUE #( FOR ... WHERE ( ... ) ) 로 한 번에 만드세요.\n그다음 한 줄씩 "예약품목 자재 미출고"를 출력하고, 마지막 줄에 "COUNT 건수"를 출력합니다.\nAPPEND 와 DATA 선언문은 쓸 수 없습니다(인라인 선언과 TYPES 는 됩니다).',
    fields: [['resb-rspos', '예약 품목 번호'], ['resb-bdmng', '소요량'], ['resb-enmng', '출고된 수량'], ['resb-xloek', '삭제 표시']],
    ban: ['APPEND', 'DATA'], structs: { ty_resb: [{ n: 'rspos', t: 'string' }, { n: 'matnr', t: 'string' }, { n: 'bdmng', t: 'i' }, { n: 'enmng', t: 'i' }, { n: 'xloek', t: 'string' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_resb' }], inDesc: 'gt_itab: 1~30행, xloek 는 X 또는 빈 값', outDesc: '골라낸 예약마다 "예약품목 자재 미출고", 마지막에 "COUNT 건수"를 출력합니다.',
    tests: [[['0001', 'RM1', 200, 200, ''], ['0002', 'RM2', 400, 150, ''], ['0003', 'RM3', 100, 0, ''], ['0004', 'RM5', 30, 0, 'X']], [['0001', 'RM1', 5, 9, '']], [['0001', 'A', 1, 0, ''], ['0002', 'B', 2, 1, '']]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => { const r = gt_itab.filter(x => x[4] === '' && x[2] > x[3]); return [...r.map(x => `${x[0]} ${x[1]} ${x[2] - x[3]}`), `COUNT ${r.length}`].join('\n'); },
    sol: L('TYPES: BEGIN OF ty_open,', '         rspos TYPE string,', '         matnr TYPE string,', '         open  TYPE i,', '       END OF ty_open,', '       tt_open TYPE STANDARD TABLE OF ty_open WITH EMPTY KEY.', 'DATA(gt_open) = VALUE tt_open( FOR gs IN gt_itab', "                               WHERE ( xloek = ' ' AND bdmng > enmng )", '                               ( rspos = gs-rspos matnr = gs-matnr open = gs-bdmng - gs-enmng ) ).', 'LOOP AT gt_open INTO DATA(gs_open).', '  WRITE: / gs_open-rspos, gs_open-matnr, gs_open-open.', 'ENDLOOP.', "WRITE: / 'COUNT', lines( gt_open ).") },
  { id: 6352, lv: 5, title: 'REDUCE 와 COND 로 오더 상태',
    body: '생산오더의 계획수량 p_gamng 과 실적 확인 수량 목록 gt_itab 이 있습니다.\n실적 합계를 REDUCE 로 구하고, 상태를 COND 로 정해 "합계 상태" 를 출력하세요.\n· 합계 ≥ 계획수량: DONE\n· 합계 > 0: WIP\n· 그 밖: NEW\nLOOP, IF, CASE 는 쓸 수 없습니다.',
    fields: [['afru-lmnga', '확인된 양품 수량'], ['afko-gamng', '오더 계획수량']],
    ban: ['LOOP', 'IF', 'CASE'],
    inputs: [{ n: 'p_gamng', t: 'i' }, { n: 'gt_itab', t: 'itab_i' }], inDesc: '1 ≤ p_gamng ≤ 10,000 / gt_itab: 0~30행', outDesc: '"합계 상태"를 출력합니다.',
    tests: [[100, [40, 20]], [100, [60, 40]], [50, []], [10, [0, 0]], [5, [3, 9]]].map(([p_gamng, gt_itab]) => ({ p_gamng, gt_itab })),
    ref: ({ p_gamng, gt_itab }) => { const s = gt_itab.reduce((a, b) => a + b, 0); return `${s} ${s >= p_gamng ? 'DONE' : s > 0 ? 'WIP' : 'NEW'}`; },
    sol: L('DATA(lv_sum) = REDUCE i( INIT s = 0 FOR q IN gt_itab NEXT s = s + q ).', 'DATA(lv_stat) = COND string( WHEN lv_sum >= p_gamng THEN `DONE`', '                             WHEN lv_sum > 0 THEN `WIP`', '                             ELSE `NEW` ).', 'WRITE: lv_sum, lv_stat.') },

  { id: 6353, lv: 5, kind: 'rpt', title: '테이블 식으로 오더 상태 내역 (JEST·TJ02T)',
    body: '생산오더 p_aufnr 의 활성 시스템 상태를 내역과 함께 출력하세요.\n· JEST 에서 objnr = \'OR\' && 오더번호, inact 공백인 상태를 상태코드(stat) 순으로 읽습니다.\n· TJ02T 에서 spras = \'3\' 인 내역 전체를 한 번에 인터널 테이블로 읽어 둡니다.\n· 상태마다 "상태코드 약어(txt04) 내역(txt30)"을 출력하고, TJ02T 에 없는 상태코드는 "상태코드 NO TEXT" 로 출력합니다.\n· 활성 상태가 없으면 NO STATUS\nREAD TABLE 대신 테이블 식 gt_txt[ istat = … ] 와 line_exists( ) 를 쓰세요.',
    fields: [['jest-objnr', '오브젝트 번호 (OR+오더)'], ['jest-inact', '비활성 표시'], ['tj02t-istat', '시스템 상태 코드'], ['tj02t-txt04', '상태 약어'], ['tj02t-txt30', '상태 내역']],
    ban: ['READ'], tables: ['jest', 'tj02t'], sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE afko-aufnr', label: '생산오더' }],
    tests: ['100002', '100003', '100001', '100009'].map(p_aufnr => ({ p_aufnr, db: ppPick('jest', 'tj02t') })),
    ref: ({ p_aufnr, db }) => { const s = ppActive(db, p_aufnr); if (!s.length) return 'NO STATUS'; return s.map(x => { const t = ppTxt(db, x); return t ? `${x} ${t[2]} ${t[3]}` : `${x} NO TEXT`; }).join('\n'); },
    sol: L('REPORT zpp_status_text.', '', 'PARAMETERS p_aufnr TYPE afko-aufnr.', '', 'START-OF-SELECTION.', '  DATA(lv_objnr) = |OR{ p_aufnr }|.', '  SELECT objnr, stat FROM jest', '    WHERE objnr = @lv_objnr', "      AND inact = ' '", '    ORDER BY stat', '    INTO TABLE @DATA(gt_stat).', '  IF gt_stat IS INITIAL.', "    WRITE 'NO STATUS'.", '    RETURN.', '  ENDIF.', "  SELECT istat, txt04, txt30 FROM tj02t WHERE spras = '3' INTO TABLE @DATA(gt_txt).", '', '  LOOP AT gt_stat INTO DATA(gs_stat).', '    IF line_exists( gt_txt[ istat = gs_stat-stat ] ).', '      DATA(gs_txt) = gt_txt[ istat = gs_stat-stat ].', '      WRITE: / gs_stat-stat, gs_txt-txt04, gs_txt-txt30.', '    ELSE.', "      WRITE: / gs_stat-stat, 'NO TEXT'.", '    ENDIF.', '  ENDLOOP.') },
  { id: 6354, lv: 5, title: 'GROUP BY 루프로 작업장별 실적',
    body: '공정 실적 gt_itab(작업장 arbpl, 실적수량 lmnga)을 작업장별로 묶어, 작업장 순으로 "작업장 건수 실적합계"를 출력하세요.\nCOLLECT, SORT 대신 LOOP AT ... GROUP BY ... ASCENDING 과 REDUCE 를 쓰세요.',
    fields: [['afru-lmnga', '확인된 양품 수량'], ['crhd-arbpl', '작업장']],
    ban: ['COLLECT', 'SORT'], structs: { ty_conf: [{ n: 'arbpl', t: 'string' }, { n: 'lmnga', t: 'i' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_conf' }], inDesc: 'gt_itab: 1~50행', outDesc: '작업장마다 "작업장 건수 실적합계"를 출력합니다.',
    tests: [[['WC20', 10], ['WC10', 5], ['WC20', 7], ['WC30', 1], ['WC10', 3]], [['A', 1]], [['B', 2], ['A', 3], ['B', 4]]].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => { const m = {}; gt_itab.forEach(([a, q]) => { m[a] = m[a] || [0, 0]; m[a][0]++; m[a][1] += q; }); return Object.keys(m).sort().map(a => `${a} ${m[a][0]} ${m[a][1]}`).join('\n'); },
    sol: L('LOOP AT gt_itab INTO DATA(gs_conf)', '     GROUP BY ( arbpl = gs_conf-arbpl cnt = GROUP SIZE ) ASCENDING', '     INTO DATA(grp).', '  DATA(lv_sum) = REDUCE i( INIT s = 0 FOR m IN GROUP grp NEXT s = s + m-lmnga ).', '  WRITE: / grp-arbpl, grp-cnt, lv_sum.', 'ENDLOOP.') }
]);
