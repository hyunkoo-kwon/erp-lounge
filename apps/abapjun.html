addMod('pp', [
  // ---- Lv.1 (선택 화면 대신 CASE·오프셋) ----
  { id: 6313, lv: 1, title: '오브젝트 번호와 시스템 상태',
    body: '생산오더의 상태는 오브젝트 번호(JEST-OBJNR)에 붙어 있습니다. 생산오더의 오브젝트 번호는 "OR" + 오더번호(6자리) 입니다. 예) OR100001\n오브젝트 번호 p_objnr 와 상태 코드 p_stat 이 주어집니다.\n· 첫째 줄: 앞 두 글자가 OR 이면 "ORDER 오더번호", 아니면 "NOT ORDER"\n· 둘째 줄: CASE 로 상태 코드를 바꿔 "약어 다음작업"을 출력하세요.\n  I0001 → CRTD RELEASE / I0002 → REL CONFIRM / I0010 → PCNF CONFIRM / I0009 → CNF TECO / I0045 → TECO NONE / 그 밖 → ???? UNKNOWN',
    fields: [['jest-objnr', '오브젝트 번호 (OR + 오더번호)'], ['jest-stat', '시스템 상태 코드 (I0001 …)'], ['tj02t-txt04', '상태 약어 (CRTD, REL …)']],
    inputs: [{ n: 'p_objnr', t: 'string' }, { n: 'p_stat', t: 'string' }], inDesc: 'p_objnr: 2~20자, p_stat: 5자', outDesc: '두 줄을 출력합니다.',
    tests: [['OR100001', 'I0002'], ['OR100045', 'I0045'], ['KS1000C100', 'I0001'], ['OR200003', 'I0010'], ['OR100002', 'I0009'], ['OR1', 'I9999']].map(([p_objnr, p_stat]) => ({ p_objnr, p_stat })),
    ref: ({ p_objnr, p_stat }) => { const a = p_objnr.slice(0, 2) === 'OR' ? `ORDER ${p_objnr.slice(2)}` : 'NOT ORDER'; const m = { I0001: 'CRTD RELEASE', I0002: 'REL CONFIRM', I0010: 'PCNF CONFIRM', I0009: 'CNF TECO', I0045: 'TECO NONE' }; return `${a}\n${m[p_stat] || '???? UNKNOWN'}`; },
    sol: L("IF p_objnr(2) = 'OR'.", '  DATA(lv_aufnr) = p_objnr+2.', "  WRITE: 'ORDER', lv_aufnr.", 'ELSE.', "  WRITE 'NOT ORDER'.", 'ENDIF.', 'CASE p_stat.', "  WHEN 'I0001'. WRITE: / 'CRTD', 'RELEASE'.", "  WHEN 'I0002'. WRITE: / 'REL', 'CONFIRM'.", "  WHEN 'I0010'. WRITE: / 'PCNF', 'CONFIRM'.", "  WHEN 'I0009'. WRITE: / 'CNF', 'TECO'.", "  WHEN 'I0045'. WRITE: / 'TECO', 'NONE'.", "  WHEN OTHERS. WRITE: / '????', 'UNKNOWN'.", 'ENDCASE.') },

  // ---- Lv.2 : EXISTS / WITH / FOR ALL ENTRIES ----
  { id: 6321, lv: 2, kind: 'rpt', title: '자재 출고가 시작된 오더 (EXISTS)', must: ['exists'],
    body: '생산오더(AFKO) 중 자재 출고가 시작된 오더와 아직인 오더를 나눠 보여 주세요. 오더 범위는 s_aufnr 입니다.\n· 자재 출고 = 자재 문서 MATDOC 에 그 오더(aufnr)로 이동유형(bwart) 261 행이 있는 것\n· 첫째 묶음: "STARTED" 줄 다음에 출고가 있는 오더를 한 줄씩 "오더 자재" (WHERE EXISTS 하위 질의)\n· 둘째 묶음: "WAITING" 줄 다음에 출고가 없는 오더 (WHERE NOT EXISTS)\n· 두 묶음 모두 오더번호 순, 해당 오더가 없으면 그 묶음에 NONE 한 줄',
    fields: [['afko-aufnr', '생산오더 번호'], ['afko-matnr', '생산할 자재(완제품)'], ['matdoc-aufnr', '자재 문서의 오더 번호'], ['matdoc-bwart', '이동 유형 (261 = 오더 출고)']],
    tables: ['afko', 'matdoc'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afko-aufnr', label: '생산오더' }],
    tests: [[], [['I', 'BT', '100002', '100004']], [['I', 'EQ', '100003', '']], [['I', 'EQ', '100001', '']]].map(s_aufnr => ({ s_aufnr, db: ppPick('afko', 'matdoc') })).concat([{ s_aufnr: [], db: { afko: PP_AFKO8, matdoc: PP_MATDOC.filter(r => r[14] !== '100002' || r[3] !== '261') } }]),
    ref: ({ s_aufnr, db }) => { const ks = ppSort(db.afko.filter(k => jsIn(k[0], s_aufnr))); const st = k => db.matdoc.some(m => m[14] === k[0] && m[3] === '261'); const a = ks.filter(st), b = ks.filter(k => !st(k)); const f = x => x.length ? x.map(k => `${k[0]} ${k[1]}`) : ['NONE']; return ['STARTED', ...f(a), 'WAITING', ...f(b)].join('\n'); },
    sol: L('REPORT zpp_issue_started.', '', 'SELECT-OPTIONS s_aufnr FOR afko-aufnr.', '', 'START-OF-SELECTION.', '  SELECT aufnr, matnr FROM afko AS k', '    WHERE aufnr IN @s_aufnr', '      AND EXISTS ( SELECT mblnr FROM matdoc', '                    WHERE matdoc~aufnr = k~aufnr', "                      AND matdoc~bwart = '261' )", '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_started).', '', '  SELECT aufnr, matnr FROM afko AS k', '    WHERE aufnr IN @s_aufnr', '      AND NOT EXISTS ( SELECT mblnr FROM matdoc', '                        WHERE matdoc~aufnr = k~aufnr', "                          AND matdoc~bwart = '261' )", '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_waiting).', '', "  WRITE 'STARTED'.", '  IF gt_started IS INITIAL.', "    WRITE / 'NONE'.", '  ENDIF.', '  LOOP AT gt_started INTO DATA(gs_ord).', '    WRITE: / gs_ord-aufnr, gs_ord-matnr.', '  ENDLOOP.', "  WRITE / 'WAITING'.", '  IF gt_waiting IS INITIAL.', "    WRITE / 'NONE'.", '  ENDIF.', '  LOOP AT gt_waiting INTO gs_ord.', '    WRITE: / gs_ord-aufnr, gs_ord-matnr.', '  ENDLOOP.') },

  { id: 6322, lv: 2, kind: 'rpt', title: '오더 진척률 (WITH 공통 테이블 식)', must: ['with'],
    body: '생산오더별 실적 진척률을 한 번의 WITH 문으로 구하세요. 오더 범위는 s_aufnr 입니다.\n· 공통 테이블 식 +conf: 실적 확인 AFRU 를 오더(aufnr)별로 모아 양품 수량(lmnga) 합계 qty\n· 본 질의: AFKO 를 +conf 와 LEFT OUTER JOIN (실적이 없는 오더도 나와야 합니다)\n· 오더번호 순으로 "오더 자재 계획수량 실적 진척률%" (진척률 = 실적 × 100 DIV 계획수량, 예: 60%)\n· 오더가 없으면 NO DATA',
    fields: [['afru-aufnr', '실적 확인의 오더 번호'], ['afru-lmnga', '확인된 양품 수량'], ['afko-gamng', '오더 계획수량']],
    tables: ['afko', 'afru'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afko-aufnr', label: '생산오더' }],
    tests: [[], [['I', 'BT', '100003', '100004']], [['I', 'EQ', '100002', '']], [['I', 'EQ', '999999', '']]].map(s_aufnr => ({ s_aufnr, db: { afko: PP_AFKO8, afru: PP_AFRU2 } })),
    ref: ({ s_aufnr, db }) => { const c = ppConf(db); const ks = ppSort(db.afko.filter(k => jsIn(k[0], s_aufnr))); if (!ks.length) return 'NO DATA'; return ks.map(k => { const q = c[k[0]] || 0; return `${k[0]} ${k[1]} ${k[2]} ${q} ${Math.floor(q * 100 / k[2])}%`; }).join('\n'); },
    sol: L('REPORT zpp_progress.', '', 'SELECT-OPTIONS s_aufnr FOR afko-aufnr.', '', 'START-OF-SELECTION.', '  WITH +conf AS ( SELECT aufnr, SUM( lmnga ) AS qty', '                   FROM afru', '                   GROUP BY aufnr )', '  SELECT k~aufnr, k~matnr, k~gamng, c~qty', '    FROM afko AS k', '    LEFT OUTER JOIN +conf AS c ON c~aufnr = k~aufnr', '    WHERE k~aufnr IN @s_aufnr', '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '  LOOP AT gt_itab INTO DATA(gs_itab).', '    DATA(lv_pct) = gs_itab-qty * 100 DIV gs_itab-gamng.', '    WRITE: / gs_itab-aufnr, gs_itab-matnr, gs_itab-gamng, gs_itab-qty, |{ lv_pct }%|.', '  ENDLOOP.') },

  { id: 6324, lv: 2, kind: 'rpt', title: '오더 공정 ALV (FOR ALL ENTRIES)', must: ['entries'],
    body: '오더 범위 s_aufnr 의 사내 공정을 ALV 로 보여 주세요.\n· 먼저 AFKO 에서 오더번호와 aufpl(공정 번호 키)을 읽습니다. 오더가 없으면 NO ORDER 를 출력하고 끝냅니다. (FOR ALL ENTRIES 는 드라이버 테이블이 비면 WHERE 가 무시되니 꼭 확인!)\n· AFVC 를 FOR ALL ENTRIES IN 오더 테이블로 aufpl 이 같고 제어키(steus)가 PP01(사내)인 공정만 읽습니다.\n· 출력 테이블: 오더(aufnr), 공정(vornr), 작업장(arbpl), 내역(ltxa1) — 오더·공정 순 정렬\n· 필드 카탈로그 seltext_m: AUFNR 오더, VORNR 공정, ARBPL 작업장, LTXA1 내역 / REUSE_ALV_GRID_DISPLAY 의 i_grid_title 은 사내 공정',
    fields: [['afko-aufpl', '공정 번호(라우팅 키)'], ['afvc-aufpl', '공정 번호 키'], ['afvc-steus', '제어 키 (PP01 사내, PP02 외주)'], ['afvc-vornr', '공정 번호'], ['afvc-arbpl', '작업장']],
    tables: ['afko', 'afvc'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afko-aufnr', label: '생산오더' }],
    tests: [[['I', 'EQ', '100001', '']], [['I', 'BT', '100002', '100004']], [['I', 'EQ', '999999', '']], []].map(s_aufnr => ({ s_aufnr, db: ppPick('afko', 'afvc') })),
    ref: ({ s_aufnr, db }) => { const ks = db.afko.filter(k => jsIn(k[0], s_aufnr)); if (!ks.length) return 'NO ORDER'; const rows = []; for (const k of ks) for (const c of db.afvc) if (c[0] === k[4] && c[4] === 'PP01') rows.push([k[0], c[2], c[3], c[5]]); rows.sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); return alvTxt('사내 공정', ['오더', '공정', '작업장', '내역'], rows); },
    sol: L('REPORT zpp_oper_fae.', '', 'SELECT-OPTIONS s_aufnr FOR afko-aufnr.', '', 'TYPES: BEGIN OF ty_out,', '         aufnr TYPE string,', '         vornr TYPE string,', '         arbpl TYPE string,', '         ltxa1 TYPE string,', '       END OF ty_out.', 'DATA gt_out TYPE TABLE OF ty_out.', '', 'START-OF-SELECTION.', '  SELECT aufnr, aufpl FROM afko', '    WHERE aufnr IN @s_aufnr', '    INTO TABLE @DATA(gt_afko).', '  IF gt_afko IS INITIAL.', "    WRITE 'NO ORDER'.", '    RETURN.', '  ENDIF.', '', '  SELECT aufpl, vornr, arbpl, ltxa1 FROM afvc', '    FOR ALL ENTRIES IN @gt_afko', '    WHERE aufpl = @gt_afko-aufpl', "      AND steus = 'PP01'", '    INTO TABLE @DATA(gt_afvc).', '', '  LOOP AT gt_afvc INTO DATA(gs_afvc).', '    READ TABLE gt_afko INTO DATA(gs_afko) WITH KEY aufpl = gs_afvc-aufpl.', '    APPEND VALUE #( aufnr = gs_afko-aufnr vornr = gs_afvc-vornr arbpl = gs_afvc-arbpl ltxa1 = gs_afvc-ltxa1 ) TO gt_out.', '  ENDLOOP.', '  SORT gt_out BY aufnr vornr.', '', '  DATA gt_fcat TYPE slis_t_fieldcat_alv.', "  APPEND VALUE #( fieldname = 'AUFNR' seltext_m = '오더' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'VORNR' seltext_m = '공정' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'ARBPL' seltext_m = '작업장' ) TO gt_fcat.", "  APPEND VALUE #( fieldname = 'LTXA1' seltext_m = '내역' ) TO gt_fcat.", "  CALL FUNCTION 'REUSE_ALV_GRID_DISPLAY'", '    EXPORTING', "      i_grid_title = '사내 공정'", '      it_fieldcat  = gt_fcat', '    TABLES', '      t_outtab     = gt_out.') },

  // ---- Lv.3 : CDS View ----
  { id: 6331, lv: 3, kind: 'cds', title: '예약 자재 CDS 뷰 (JOIN)',
    body: '생산오더의 자재 예약을 보여 주는 CDS 뷰 ZI_PP_RESERVATION 을 정의하세요.\n· 데이터 소스: RESB as r, 생산오더 헤더 AFKO as k 와 INNER JOIN (r.aufnr = k.aufnr)\n· 삭제 표시(xloek)가 비어 있는 예약만 (where r.xloek = \'\')\n· 필드(별칭 그대로): key rsnum, key rspos, aufnr, fg_matnr(오더의 완제품 = k.matnr), matnr, bdmng, enmng, open_qty(= bdmng - enmng)',
    fields: [['resb-rsnum', '예약 번호'], ['resb-rspos', '예약 품목'], ['resb-bdmng', '소요량'], ['resb-enmng', '출고된 수량'], ['resb-xloek', '삭제 표시']],
    tables: ['resb', 'afko'], show: [{ view: 'zi_pp_reservation', cols: ['rsnum', 'rspos', 'aufnr', 'fg_matnr', 'matnr', 'bdmng', 'enmng', 'open_qty'], order: ['rsnum', 'rspos'] }],
    outDesc: '채점기가 뷰를 예약번호·품목 순으로 읽어 RSNUM RSPOS AUFNR FG_MATNR MATNR BDMNG ENMNG OPEN_QTY 를 출력합니다.',
    tests: [{ db: ppPick('resb', 'afko') }, { db: { resb: PP_RESB, afko: PP_AFKO8.filter(k => k[0] !== '100002') } }, { db: { resb: PP_RESB.map(r => r[0] === 'R001' ? [...r.slice(0, 10), 'X', r[11]] : r), afko: PP_AFKO8 } }],
    ref: ({ db }) => { const rows = []; for (const r of db.resb) { if (r[10] !== '') continue; const k = db.afko.find(x => x[0] === r[9]); if (!k) continue; rows.push([r[0], r[1], r[9], k[1], r[2], r[5], r[6], r[5] - r[6]]); } rows.sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); return cdsTxt(['rsnum', 'rspos', 'aufnr', 'fg_matnr', 'matnr', 'bdmng', 'enmng', 'open_qty'], rows); },
    sol: L("@AccessControl.authorizationCheck: #NOT_REQUIRED", "@EndUserText.label: '생산오더 예약 자재'", 'define view entity ZI_PP_RESERVATION', '  as select from resb as r', '    inner join afko as k on r.aufnr = k.aufnr', '{', '  key r.rsnum,', '  key r.rspos,', '      r.aufnr,', '      k.matnr             as fg_matnr,', '      r.matnr,', '      r.bdmng,', '      r.enmng,', '      r.bdmng - r.enmng   as open_qty', '}', "where r.xloek = ''") },

  { id: 6332, lv: 3, kind: 'cds', title: '공정 CDS 뷰 (association·CASE·CAST)',
    body: '생산오더 공정 AFVC 를 기본으로 하는 CDS 뷰 ZI_PP_OPERATION 을 정의하세요.\n· association [1..1] to afvv as _Qty on $projection.aufpl = _Qty.aufpl and $projection.aplzl = _Qty.aplzl\n· association [0..1] to crhd as _Wc on $projection.arbpl = _Wc.arbpl\n· 필드: key aufpl, key aplzl, vornr, arbpl, wc_text(= _Wc.ktext, 작업장이 없으면 빈 값), setup(= _Qty.vgw01), machine(= _Qty.vgw02),\n  optype(= 제어키 steus 가 PP02 면 \'EXT\', 아니면 \'INT\' — CASE), total_min(= vgw01 + vgw02 × mgvrg 를 abap.int4 로 CAST)\n· 연관 _Qty, _Wc 도 노출(expose)하세요.',
    fields: [['afvc-steus', '제어 키 (PP01 사내, PP02 외주)'], ['afvv-vgw01', '표준값 1 (준비시간)'], ['afvv-vgw02', '표준값 2 (단위당 기계시간)'], ['afvv-mgvrg', '공정 수량'], ['crhd-ktext', '작업장 내역']],
    tables: ['afvc', 'afvv', 'crhd'], show: [{ view: 'zi_pp_operation', cols: ['aufpl', 'vornr', 'arbpl', 'wc_text', 'setup', 'machine', 'optype', 'total_min'], order: ['aufpl', 'vornr'] }],
    outDesc: '채점기가 뷰를 aufpl·공정 순으로 읽어 AUFPL VORNR ARBPL WC_TEXT SETUP MACHINE OPTYPE TOTAL_MIN 을 출력합니다.',
    tests: [{ db: { afvc: PP_AFVC, afvv: PP_AFVV, crhd: PP_CRHD } }, { db: { afvc: PP_AFVC.filter(c => c[0] === 'A001'), afvv: PP_AFVV, crhd: [...PP_CRHD, ['WC30', '1000', '외주검사']] } }, { db: { afvc: PP_AFVC.filter(c => c[0] !== 'A001'), afvv: PP_AFVV.map(v => [v[0], v[1], v[2] + 1, v[3], v[4] * 2, v[5], v[6]]), crhd: [] } }],
    ref: ({ db }) => { const rows = db.afvc.map(c => { const v = db.afvv.find(x => x[0] === c[0] && x[1] === c[1]) || [0, 0, 0, 0, 0]; const w = db.crhd.find(x => x[0] === c[3]); return [c[0], c[2], c[3], w ? w[2] : '', v[2], v[3], c[4] === 'PP02' ? 'EXT' : 'INT', v[2] + v[3] * v[4]]; }); rows.sort((a, b) => (a[0] + a[1]) < (b[0] + b[1]) ? -1 : 1); return cdsTxt(['aufpl', 'vornr', 'arbpl', 'wc_text', 'setup', 'machine', 'optype', 'total_min'], rows); },
    sol: L("@EndUserText.label: '생산오더 공정'", 'define view entity ZI_PP_OPERATION', '  as select from afvc as c', '  association [1..1] to afvv as _Qty on  $projection.aufpl = _Qty.aufpl', '                                      and $projection.aplzl = _Qty.aplzl', '  association [0..1] to crhd as _Wc  on  $projection.arbpl = _Wc.arbpl', '{', '  key c.aufpl,', '  key c.aplzl,', '      c.vornr,', '      c.arbpl,', '      _Wc.ktext    as wc_text,', '      _Qty.vgw01   as setup,', '      _Qty.vgw02   as machine,', "      case c.steus when 'PP02' then 'EXT' else 'INT' end as optype,", '      cast( _Qty.vgw01 + _Qty.vgw02 * _Qty.mgvrg as abap.int4 ) as total_min,', '      _Qty,', '      _Wc', '}') },

  { id: 6333, lv: 3, kind: 'cds', title: '작업장 부하 CDS 뷰 (파라미터·GROUP BY·HAVING)',
    body: '기간 안에 시작하는 생산오더의 작업장별 부하를 집계하는 파라미터 CDS 뷰 ZI_PP_WCLOAD 를 정의하세요.\n· with parameters p_from : abap.dats, p_to : abap.dats\n· 데이터 소스: AFKO as k, AFVC as c (c.aufpl = k.aufpl), AFVV as v (v.aufpl = c.aufpl and v.aplzl = c.aplzl) INNER JOIN\n· 조건: 시작일 k.gstrp 가 $parameters.p_from ~ p_to 사이(between), 사내 공정 c.steus = \'PP01\'\n· 작업장(arbpl)별 GROUP BY: key arbpl, ops(= count(*)), load_min(= sum( v.vgw01 + v.vgw02 * v.mgvrg ))\n· 부하가 100분을 넘는 작업장만 (having)\n(채점기는 p_from = 20261101, p_to = 20261110 으로 읽습니다)',
    fields: [['afko-gstrp', '기본 시작일'], ['afvc-steus', '제어 키'], ['afvv-vgw01', '준비시간'], ['afvv-vgw02', '단위당 기계시간'], ['afvv-mgvrg', '공정 수량']],
    tables: ['afko', 'afvc', 'afvv'], show: [{ view: 'zi_pp_wcload', cols: ['arbpl', 'ops', 'load_min'], order: ['arbpl'], params: { p_from: '20261101', p_to: '20261110' } }],
    outDesc: '채점기가 뷰를 작업장 순으로 읽어 ARBPL OPS LOAD_MIN 을 출력합니다.',
    tests: [{ db: ppPick('afko', 'afvc', 'afvv') }, { db: { afko: PP_AFKO8.map(k => k[0] === '100003' ? [...k.slice(0, 5), '20261105', ...k.slice(6)] : k), afvc: PP_AFVC, afvv: PP_AFVV } }, { db: { afko: PP_AFKO8, afvc: PP_AFVC.map(c => c[3] === 'WC10' ? [...c.slice(0, 4), 'PP02', c[5]] : c), afvv: PP_AFVV } }],
    ref: ({ db }) => { const m = {}; for (const k of db.afko) { if (k[5] < '20261101' || k[5] > '20261110') continue; for (const c of db.afvc) { if (c[0] !== k[4] || c[4] !== 'PP01') continue; const v = db.afvv.find(x => x[0] === c[0] && x[1] === c[1]); if (!v) continue; m[c[3]] = m[c[3]] || [0, 0]; m[c[3]][0]++; m[c[3]][1] += v[2] + v[3] * v[4]; } } return cdsTxt(['arbpl', 'ops', 'load_min'], Object.keys(m).sort().filter(a => m[a][1] > 100).map(a => [a, ...m[a]])); },
    sol: L("@EndUserText.label: '작업장 부하'", 'define view entity ZI_PP_WCLOAD', '  with parameters', '    p_from : abap.dats,', '    p_to   : abap.dats', '  as select from afko as k', '    inner join afvc as c on c.aufpl = k.aufpl', '    inner join afvv as v on  v.aufpl = c.aufpl', '                         and v.aplzl = c.aplzl', '{', '  key c.arbpl,', '      count( * )                             as ops,', '      sum( v.vgw01 + v.vgw02 * v.mgvrg )     as load_min', '}', 'where k.gstrp between $parameters.p_from and $parameters.p_to', "  and c.steus = 'PP01'", 'group by c.arbpl', 'having sum( v.vgw01 + v.vgw02 * v.mgvrg ) > 100') },

  { id: 6334, lv: 3, kind: 'cds', title: '오더 진척 소비 뷰 (뷰 위의 뷰)', cds: PP_CONF_CDS,
    body: '이미 만들어진 인터페이스 뷰 ZI_PP_ORDERCONF(오더별 실적 합계, 아래 DDL)를 재사용해서 소비 뷰 ZC_PP_ORDERPROGRESS 를 정의하세요.\n· 데이터 소스: AFKO as k\n· association [0..1] to ZI_PP_ORDERCONF as _Conf on $projection.aufnr = _Conf.aufnr\n· 필드: key aufnr, matnr, gamng, conf_qty(= 실적, 없으면 0 — coalesce), pct(= division( 실적 × 100, gamng, 1 )),\n  state(= 실적이 없으면 \'OPEN\', 실적 ≥ 계획이면 \'DONE\', 그 밖 \'PART\' — CASE, _Conf.conf_qty is null 사용)\n\n주어진 뷰:\n' + PP_CONF_CDS,
    fields: [['afru-lmnga', '확인된 양품 수량'], ['afko-gamng', '오더 계획수량'], ['zi_pp_orderconf-conf_qty', '오더별 실적 합계 (CDS)']],
    tables: ['afko', 'afru'], show: [{ view: 'zc_pp_orderprogress', cols: ['aufnr', 'matnr', 'gamng', 'conf_qty', 'pct', 'state'], order: ['aufnr'] }],
    outDesc: '채점기가 뷰를 오더 순으로 읽어 AUFNR MATNR GAMNG CONF_QTY PCT STATE 를 출력합니다. PCT 는 소수 둘째 자리까지 표시합니다.',
    tests: [{ db: { afko: PP_AFKO8, afru: PP_AFRU2 } }, { db: { afko: PP_AFKO8, afru: [...PP_AFRU2, ['R05', '100001', 50], ['R06', '100004', 7]] } }, { db: { afko: PP_AFKO8, afru: [] } }],
    ref: ({ db }) => { const c = {}; for (const r of db.afru) c[r[1]] = (c[r[1]] || 0) + r[2]; return cdsTxt(['aufnr', 'matnr', 'gamng', 'conf_qty', 'pct', 'state'], ppSort(db.afko).map(k => { const q = c[k[0]]; const v = q || 0; return [k[0], k[1], k[2], v, (Math.round(v * 100 / k[2] * 10) / 10).toFixed(2), q === undefined ? 'OPEN' : v >= k[2] ? 'DONE' : 'PART']; })); },
    sol: L("@EndUserText.label: '생산오더 진척'", 'define view entity ZC_PP_ORDERPROGRESS', '  as select from afko as k', '  association [0..1] to ZI_PP_ORDERCONF as _Conf on $projection.aufnr = _Conf.aufnr', '{', '  key k.aufnr,', '      k.matnr,', '      k.gamng,', '      coalesce( _Conf.conf_qty, 0 )                              as conf_qty,', '      division( coalesce( _Conf.conf_qty, 0 ) * 100, k.gamng, 1 ) as pct,', "      case when _Conf.conf_qty is null     then 'OPEN'", "           when _Conf.conf_qty >= k.gamng then 'DONE'", "           else 'PART' end                                          as state", '}') },

  // ---- Lv.4 : RAP (생산오더 BO ZR_PP_ORDER) ----
  { id: 6341, lv: 4, kind: 'rpt', title: 'EML 로 생산오더·공정 생성', bo: ppBo(), checkDb: ['zpp_rap_ord', 'zpp_rap_op'],
    body: '생산오더 BO ZR_PP_ORDER(엔티티 order, 하위 엔티티 oper — 연관 _oper)에 EML 로 오더와 공정 2개를 한 번에 만드세요.\n· MODIFY ENTITIES OF zr_pp_order ENTITY order\n  CREATE FIELDS ( aufnr matnr werks gamng status ) — %cid = \'O1\', werks = \'1000\', status = \'CRTD\', 나머지는 선택 화면 값\n  CREATE BY \\_oper FIELDS ( vornr arbpl vgw01 ) — 공정 0010/WC10/30, 0020/WC20/20 (%cid P1, P2)\n  MAPPED, FAILED, REPORTED 를 받습니다.\n· FAILED 가 비어 있지 않으면 "CREATE FAILED" 를 출력하고 ROLLBACK ENTITIES 후 끝냅니다.\n· 성공하면 COMMIT ENTITIES 하고 "CREATED 오더수 공정수"(MAPPED 의 행 수)를 출력합니다.\n· 그다음 READ ENTITIES ... ENTITY order BY \\_oper ALL FIELDS 로 그 오더의 공정을 읽어 "공정 작업장 준비시간"을 한 줄씩 출력하세요.\n(채점기는 마지막에 ZPP_RAP_ORD, ZPP_RAP_OP 내용도 비교합니다.)',
    fields: PP_BO_FIELDS,
    tables: ['zpp_rap_ord', 'zpp_rap_op'], sel: [{ n: 'p_aufnr', kind: 'p', decl: 'TYPE zpp_rap_ord-aufnr', label: '생산오더' }, { n: 'p_matnr', kind: 'p', decl: 'TYPE zpp_rap_ord-matnr', label: '자재' }, { n: 'p_gamng', kind: 'p', decl: 'TYPE i', label: '계획수량' }],
    tests: [['300003', 'FG3', 70], ['300001', 'FG1', 10], ['300009', 'FG9', 5]].map(([p_aufnr, p_matnr, p_gamng]) => ({ p_aufnr, p_matnr, p_gamng, db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: PP_ROP() } })),
    ref: ({ p_aufnr, p_matnr, p_gamng, db }) => { const o = db.zpp_rap_ord.map(r => r.slice()), p = db.zpp_rap_op.map(r => r.slice()); let out; if (o.some(r => r[0] === p_aufnr)) out = 'CREATE FAILED'; else { o.push([p_aufnr, p_matnr, '1000', p_gamng, 'CRTD', '']); p.push([p_aufnr, '0010', 'WC10', 30], [p_aufnr, '0020', 'WC20', 20]); out = ['CREATED 1 2', '0010 WC10 30', '0020 WC20 20'].join('\n'); } return [out, ppDump('zpp_rap_ord', o), ppDump('zpp_rap_op', p)].join('\n'); },
    sol: L('REPORT zpp_eml_create.', '', 'PARAMETERS: p_aufnr TYPE zpp_rap_ord-aufnr,', '            p_matnr TYPE zpp_rap_ord-matnr,', '            p_gamng TYPE i.', '', 'START-OF-SELECTION.', '  MODIFY ENTITIES OF zr_pp_order', '    ENTITY order', '      CREATE FIELDS ( aufnr matnr werks gamng status )', "        WITH VALUE #( ( %cid = 'O1' aufnr = p_aufnr matnr = p_matnr werks = '1000' gamng = p_gamng status = 'CRTD' ) )", '      CREATE BY \\_oper FIELDS ( vornr arbpl vgw01 )', "        WITH VALUE #( ( %cid_ref = 'O1' aufnr = p_aufnr", "                        %target = VALUE #( ( %cid = 'P1' vornr = '0010' arbpl = 'WC10' vgw01 = 30 )", "                                           ( %cid = 'P2' vornr = '0020' arbpl = 'WC20' vgw01 = 20 ) ) ) )", '    MAPPED DATA(ls_mapped)', '    FAILED DATA(ls_failed)', '    REPORTED DATA(ls_reported).', '', '  IF ls_failed IS NOT INITIAL.', "    WRITE 'CREATE FAILED'.", '    ROLLBACK ENTITIES.', '    RETURN.', '  ENDIF.', '  COMMIT ENTITIES.', "  WRITE: 'CREATED', lines( ls_mapped-order ), lines( ls_mapped-oper ).", '', '  READ ENTITIES OF zr_pp_order', '    ENTITY order BY \\_oper ALL FIELDS', '      WITH VALUE #( ( aufnr = p_aufnr ) )', '    RESULT DATA(lt_oper).', '  LOOP AT lt_oper INTO DATA(ls_oper).', '    WRITE: / ls_oper-vornr, ls_oper-arbpl, ls_oper-vgw01.', '  ENDLOOP.') },

  { id: 6342, lv: 4, kind: 'rap', title: '검증(validation) — 계획수량 점검', outDesc: '시나리오 단계마다 채점기가 결과 줄(CREATE/UPDATE/ACTION/COMMIT OK·FAILED, 실패·메시지, READ·RESULT)을 출력하고, 마지막에 ZPP_RAP_ORD 내용을 붙입니다.', inputs: [], checkDb: ['zpp_rap_ord'],
    bo: ppBo({ validations: [{ n: 'validatequantity', on: ['create', 'field gamng'] }] }),
    body: '생산오더 BO ZR_PP_ORDER 의 행동 정의(BDEF)에 다음 검증이 있습니다.\n  validation validateQuantity on save { create; field gamng; }\n핸들러 클래스 lhc_order 를 만들어 검증을 구현하세요.\n· 대상 오더를 READ ENTITIES ... IN LOCAL MODE 로 읽습니다(FIELDS ( matnr gamng )).\n· 자재(matnr)가 비어 있으면: failed-order 에 %tky 를 넣고, reported-order 에 메시지 \'자재를 입력하세요\' (심각도 error)\n· 아니고 계획수량(gamng)이 0 이하면: 메시지 \'계획수량은 0보다 커야 합니다\'\n· 아니고 10000 을 넘으면: 메시지 \'계획수량은 10000 이하여야 합니다\'\n메시지는 new_message_with_text( severity = if_abap_behv_message=>severity-error text = ... ) 로 만듭니다.\n채점기는 테스트마다 생성·수정·COMMIT ENTITIES 시나리오를 실행해 결과를 출력합니다. 검증이 하나라도 실패하면 그 COMMIT 전체가 실패합니다.',
    fields: PP_BO_FIELDS,
    tables: ['zpp_rap_ord'],
    tests: [{ in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"create","ent":"order","rows":[{"%cid":"C1","aufnr":"300003","matnr":"FG3","werks":"1000","gamng":70,"status":"CRTD"}],"fields":["aufnr","matnr","werks","gamng","status"]},{"op":"commit"},{"op":"create","ent":"order","rows":[{"%cid":"C2","aufnr":"300004","matnr":"","werks":"1000","gamng":10},{"%cid":"C3","aufnr":"300005","matnr":"FG5","werks":"1000","gamng":0}],"fields":["aufnr","matnr","werks","gamng"]},{"op":"commit"}] }, out: "CREATE OK\nCOMMIT OK\nCREATE OK\nCOMMIT FAILED\n FAILED ORDER 300004\n FAILED ORDER 300005\n MSG ORDER 300004 E:자재를 입력하세요\n MSG ORDER 300005 E:계획수량은 0보다 커야 합니다\n[ZPP_RAP_ORD]\n300001 FG1 1000 100 CRTD N\n300002 FG2 1000 600 REL H\n300003 FG3 1000 70 CRTD " },
      { in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"update","ent":"order","rows":[{"aufnr":"300001","gamng":20000}],"fields":["gamng"]},{"op":"commit"},{"op":"update","ent":"order","rows":[{"aufnr":"300001","gamng":250},{"aufnr":"399999","gamng":1}],"fields":["gamng"]},{"op":"commit"}] }, out: "UPDATE OK\nCOMMIT FAILED\n FAILED ORDER 300001\n MSG ORDER 300001 E:계획수량은 10000 이하여야 합니다\nUPDATE FAILED\n FAILED ORDER 399999 NOT_FOUND\nCOMMIT OK\n[ZPP_RAP_ORD]\n300001 FG1 1000 250 CRTD N\n300002 FG2 1000 600 REL H" },
      { in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"update","ent":"order","rows":[{"aufnr":"300002","status":"TECO"}],"fields":["status"]},{"op":"commit"},{"op":"create","ent":"order","rows":[{"%cid":"C1","aufnr":"300006","matnr":"FG6","werks":"1000","gamng":10000}],"fields":["aufnr","matnr","werks","gamng"]},{"op":"commit"}] }, out: "UPDATE OK\nCOMMIT OK\nCREATE OK\nCOMMIT OK\n[ZPP_RAP_ORD]\n300001 FG1 1000 100 CRTD N\n300002 FG2 1000 600 TECO H\n300006 FG6 1000 10000  " }], ref: null,
    sol: L(...PP_HANDLER_HEAD(['METHODS validatequantity FOR VALIDATE ON SAVE', '      IMPORTING keys FOR order~validatequantity.']), 'CLASS lhc_order IMPLEMENTATION.', '  METHOD validatequantity.', '    READ ENTITIES OF zr_pp_order IN LOCAL MODE', '      ENTITY order FIELDS ( matnr gamng )', '      WITH CORRESPONDING #( keys )', '      RESULT DATA(lt_order).', '    LOOP AT lt_order INTO DATA(ls_order).', '      DATA lv_text TYPE string.', '      CLEAR lv_text.', '      IF ls_order-matnr IS INITIAL.', "        lv_text = '자재를 입력하세요'.", '      ELSEIF ls_order-gamng <= 0.', "        lv_text = '계획수량은 0보다 커야 합니다'.", '      ELSEIF ls_order-gamng > 10000.', "        lv_text = '계획수량은 10000 이하여야 합니다'.", '      ENDIF.', '      IF lv_text IS NOT INITIAL.', '        APPEND VALUE #( %tky = ls_order-%tky ) TO failed-order.', '        APPEND VALUE #( %tky = ls_order-%tky', '                        %msg = new_message_with_text( severity = if_abap_behv_message=>severity-error', '                                                      text     = lv_text ) ) TO reported-order.', '      ENDIF.', '    ENDLOOP.', '  ENDMETHOD.', 'ENDCLASS.') },

  { id: 6343, lv: 4, kind: 'rap', title: '결정(determination) — 상태·우선순위 자동 설정', outDesc: '시나리오 단계마다 채점기가 결과 줄(CREATE/UPDATE/ACTION/COMMIT OK·FAILED, 실패·메시지, READ·RESULT)을 출력하고, 마지막에 ZPP_RAP_ORD 내용을 붙입니다.', inputs: [], checkDb: ['zpp_rap_ord'],
    bo: ppBo({ determinations: [{ n: 'setdefaults', on: ['create', 'field gamng'], when: 'modify' }] }),
    body: '생산오더 BO ZR_PP_ORDER 의 BDEF 에 다음 결정이 있습니다.\n  determination setDefaults on modify { create; field gamng; }\n핸들러 클래스 lhc_order 에 결정을 구현하세요.\n· 대상 오더를 IN LOCAL MODE 로 읽습니다(FIELDS ( gamng status )).\n· 상태(status)가 비어 있으면 \'CRTD\', 이미 있으면 그대로 둡니다.\n· 우선순위(prio): 계획수량 500 이상이면 \'H\', 아니면 \'N\'\n· MODIFY ENTITIES ... IN LOCAL MODE ENTITY order UPDATE FIELDS ( status prio ) 로 한 번에 반영하세요.\n채점기는 테스트마다 생성·수정·COMMIT 시나리오를 실행하고 READ 결과와 테이블을 출력합니다.',
    fields: [['zpp_rap_ord-status', '상태 (CRTD/REL)'], ['zpp_rap_ord-prio', '우선순위 (H 높음, N 보통)'], ['zpp_rap_ord-gamng', '계획수량']],
    tables: ['zpp_rap_ord'],
    tests: [{ in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"create","ent":"order","rows":[{"%cid":"C1","aufnr":"300003","matnr":"FG3","werks":"1000","gamng":700},{"%cid":"C2","aufnr":"300004","matnr":"FG4","werks":"1000","gamng":499}],"fields":["aufnr","matnr","werks","gamng"]},{"op":"commit"},{"op":"read","ent":"order","keys":[{"aufnr":"300003"},{"aufnr":"300004"}]}] }, out: "CREATE OK\nCOMMIT OK\nREAD ORDER 300003 FG3 1000 700 CRTD H\nREAD ORDER 300004 FG4 1000 499 CRTD N\n[ZPP_RAP_ORD]\n300001 FG1 1000 100 CRTD N\n300002 FG2 1000 600 REL H\n300003 FG3 1000 700 CRTD H\n300004 FG4 1000 499 CRTD N" },
      { in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"update","ent":"order","rows":[{"aufnr":"300002","gamng":100},{"aufnr":"300001","gamng":500}],"fields":["gamng"]},{"op":"commit"},{"op":"read","ent":"order","keys":[{"aufnr":"300001"},{"aufnr":"300002"}]}] }, out: "UPDATE OK\nCOMMIT OK\nREAD ORDER 300001 FG1 1000 500 CRTD H\nREAD ORDER 300002 FG2 1000 100 REL N\n[ZPP_RAP_ORD]\n300001 FG1 1000 500 CRTD H\n300002 FG2 1000 100 REL N" },
      { in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"create","ent":"order","rows":[{"%cid":"C1","aufnr":"300007","matnr":"FG7","werks":"1000","gamng":800,"status":"REL"}],"fields":["aufnr","matnr","werks","gamng","status"]},{"op":"update","ent":"order","rows":[{"aufnr":"300001","werks":"2000"}],"fields":["werks"]},{"op":"commit"}] }, out: "CREATE OK\nUPDATE OK\nCOMMIT OK\n[ZPP_RAP_ORD]\n300001 FG1 2000 100 CRTD N\n300002 FG2 1000 600 REL H\n300007 FG7 1000 800 REL H" }], ref: null,
    sol: L(...PP_HANDLER_HEAD(['METHODS setdefaults FOR DETERMINE ON MODIFY', '      IMPORTING keys FOR order~setdefaults.']), 'CLASS lhc_order IMPLEMENTATION.', '  METHOD setdefaults.', '    READ ENTITIES OF zr_pp_order IN LOCAL MODE', '      ENTITY order FIELDS ( gamng status )', '      WITH CORRESPONDING #( keys )', '      RESULT DATA(lt_order).', '    MODIFY ENTITIES OF zr_pp_order IN LOCAL MODE', '      ENTITY order UPDATE FIELDS ( status prio )', '      WITH VALUE #( FOR ls IN lt_order', '                    ( %tky   = ls-%tky', "                      status = COND #( WHEN ls-status IS INITIAL THEN 'CRTD' ELSE ls-status )", "                      prio   = COND #( WHEN ls-gamng >= 500 THEN 'H' ELSE 'N' ) ) ).", '  ENDMETHOD.', 'ENDCLASS.') },

  { id: 6344, lv: 4, kind: 'rap', title: '액션(action) — 생산오더 릴리스', outDesc: '시나리오 단계마다 채점기가 결과 줄(CREATE/UPDATE/ACTION/COMMIT OK·FAILED, 실패·메시지, READ·RESULT)을 출력하고, 마지막에 ZPP_RAP_ORD 내용을 붙입니다.', inputs: [], checkDb: ['zpp_rap_ord'],
    bo: ppBo({ actions: [{ n: 'release', result: true }] }),
    body: '생산오더 BO ZR_PP_ORDER 의 BDEF 에 다음 액션이 있습니다.\n  action release result [1] $self;\n핸들러 클래스 lhc_order 에 액션을 구현하세요.\n· 대상 오더를 IN LOCAL MODE 로 읽습니다(ALL FIELDS).\n· 상태가 \'CRTD\' 가 아닌 오더: failed-order 에 %tky, reported-order 에 메시지 \'생성 상태만 릴리스할 수 있습니다\' (error)\n· \'CRTD\' 인 오더: 상태를 \'REL\' 로 바꿉니다 (MODIFY ... IN LOCAL MODE UPDATE FIELDS ( status )).\n· result 에는 릴리스한 오더만 %tky 와 %param(바뀐 뒤의 오더 전체)으로 돌려줍니다. 바꾼 뒤 다시 READ 해서 채우세요.\n없는 오더는 채점기가 NOT_FOUND 로 처리하므로 핸들러에 오지 않습니다.',
    fields: [['zpp_rap_ord-status', '상태 (CRTD → REL)'], ['zpp_rap_ord-aufnr', '생산오더 번호']],
    tables: ['zpp_rap_ord'],

      { in: { db: { zpp_rap_ord: PP_RORD(), zpp_rap_op: [] }, ops: [{"op":"action","ent":"order","action":"release","rows":[{"aufnr":"300002"},{"aufnr":"399999"}],"showResult":true},{"op":"commit"}] }, out: "ACTION RELEASE FAILED\n FAILED ORDER 399999 NOT_FOUND\n FAILED ORDER 300002\n MSG ORDER 300002 E:생성 상태만 릴리스할 수 있습니다\nCOMMIT OK\n[ZPP_RAP_ORD]\n300001 FG1 1000 100 CRTD N\n300002 FG2 1000 600 REL H" },

// ===== 4차: 표준 조회 리포트 (COOIS · MB51 · CO14) =====
addF('afru', [['vornr', 'c'], ['arbpl', 'c'], ['budat', 'd'], ['ism01', 'i'], ['stokz', 'c']]);
const PP_QAFKO = [
  ['500001', 'FG1', 100, '20261115', '', '20261103', '', ''], ['500002', 'FG2', 60, '20261110', '', '20261105', '', ''],
  ['500003', 'FG1', 40, '20261120', '', '20261112', '', ''], ['500004', 'FG3', 30, '20261108', '', '20261101', '', ''],
  ['500005', 'FG2', 20, '20261125', '', '20261118', '', '']];
const PP_QAFPO = [['500001', '0001', 'FG1', 100, 95], ['500002', '0001', 'FG2', 60, 35], ['500003', '0001', 'FG1', 40, 0], ['500004', '0001', 'FG3', 30, 20], ['500005', '0001', 'FG2', 20, 0]];
const PP_QJEST = [
  ['OR500001', 'I0002', ''], ['OR500001', 'I0009', ''], ['OR500001', 'I0012', ''],
  ['OR500002', 'I0002', ''], ['OR500002', 'I0010', ''],
  ['OR500003', 'I0001', ''],
  ['OR500004', 'I0002', ''], ['OR500004', 'I0045', ''],
  ['OR500005', 'I0001', 'X'], ['OR500005', 'I0002', '']];
const PP_QTJ02T = [...PP_TJ02T, ['I0012', '3', 'DLV', '납품됨'], ['I0012', 'E', 'DLV', 'Delivered']];
const PP_QMD = [...PP_MATDOC, ppMd('4900000008', '0001', '261', 'RM3', '0002', 'H', 40, '20261103', '100001'), ppMd('4900000009', '0001', '261', 'RM3', '0002', 'H', 40, '20261104', '100001')];
const PP_QAFRU = [
  ['R101', '500001', 40, '0010', 'WC10', '20261104', 120, ''], ['R102', '500001', 60, '0010', 'WC10', '20261105', 150, ''],
  ['R103', '500001', 100, '0020', 'WC20', '20261106', 200, ''], ['R104', '500002', 35, '0010', 'WC10', '20261107', 90, ''],
  ['R105', '500002', 10, '0010', 'WC10', '20261108', 30, 'X'], ['R106', '500004', 30, '0010', 'WC20', '20261102', 70, '']];
const ppIn = (rs, v) => {
  if (!rs || !rs.length) return true;
  const m = ([, o, l, h]) => o === 'EQ' ? v === l : o === 'NE' ? v !== l : o === 'BT' ? v >= l && v <= h : o === 'GE' ? v >= l : o === 'LE' ? v <= l : o === 'GT' ? v > l : o === 'LT' ? v < l : o === 'CP' ? new RegExp('^' + l.replace(/\*/g, '.*') + '$').test(v) : false;
  const inc = rs.filter(r => r[0] === 'I'), exc = rs.filter(r => r[0] === 'E');
  return (inc.length ? inc.some(m) : true) && !exc.some(m);
};
const ppQStat = (db, aufnr) => db.jest.filter(x => x[0] === 'OR' + aufnr && x[2] === '').map(x => x[1]).sort().map(s => db.tj02t.find(t => t[0] === s && t[1] === '3')).filter(Boolean).map(t => t[2]);

addMod('pp', [
  { id: 7313, pgm: true, topic: '조회 리포트', lv: 4, kind: 'rpt', title: '생산오더 현황 (COOIS)',

    tables: ['afko', 'jest', 'tj02t'],
    sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afko-aufnr', label: '생산오더' }, { n: 's_matnr', kind: 's', decl: 'FOR afko-matnr', label: '자재' }, { n: 's_gstrp', kind: 's', decl: 'FOR afko-gstrp', label: '기본 시작일' }],
    outDesc: '오더마다 "오더 자재 계획수량 시작일 상태…" 한 줄, 마지막에 "COUNT 오더수". 없으면 NO DATA.',
    tests: [[[], [], []], [[], [['I', 'EQ', 'FG1', '']], []], [[], [], [['I', 'BT', '20261101', '20261105']]], [[['E', 'EQ', '500002', '']], [['I', 'EQ', 'FG2', '']], []], [[], [['I', 'EQ', 'FG9', '']], []]]
      .map(([s_aufnr, s_matnr, s_gstrp]) => ({ s_aufnr, s_matnr, s_gstrp, db: { afko: PP_QAFKO, jest: PP_QJEST, tj02t: PP_QTJ02T } })),

      return [...r.map(x => [x[0], x[1], x[2], x[5], ...ppQStat(db, x[0])].join(' ')), `COUNT ${r.length}`].join('\n'); },
    sol: L('REPORT zpp_coois.', '', 'TABLES afko.', 'SELECT-OPTIONS: s_aufnr FOR afko-aufnr,', '                s_matnr FOR afko-matnr,', '                s_gstrp FOR afko-gstrp.', '', 'DATA lv_objnr TYPE string.', '', 'START-OF-SELECTION.',
      '  SELECT aufnr, matnr, gamng, gstrp FROM afko', '    WHERE aufnr IN @s_aufnr', '      AND matnr IN @s_matnr', '      AND gstrp IN @s_gstrp', '    ORDER BY aufnr', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '',
      '  LOOP AT gt_itab INTO DATA(gs_itab).', '    lv_objnr = |OR{ gs_itab-aufnr }|.', '    SELECT j~stat, t~txt04', '      FROM jest AS j', '      INNER JOIN tj02t AS t ON t~istat = j~stat', '      WHERE j~objnr = @lv_objnr', "        AND j~inact = ' '", "        AND t~spras = '3'", '      ORDER BY j~stat', '      INTO TABLE @DATA(gt_stat).',

  { id: 7314, pgm: true, topic: '조회 리포트', lv: 4, kind: 'rpt', title: '미완료 생산오더 잔량 (COOIS)',
    body: 'SAP 표준 COOIS 에서 미완료 오더만 거르는 것처럼, 아직 끝나지 않은 생산오더의 입고 잔량을 보여 주세요.\n· AFKO 와 오더 품목 AFPO 를 aufnr 로 JOIN, 자재 범위 s_matnr, 오더번호 순.\n· 활성 상태(JEST, inact 공백)에 TECO(I0045) 나 DLV(I0012) 가 있는 오더는 제외합니다.\n· p_rel 체크 시 릴리스(I0002 활성)된 오더만 봅니다.\n· 잔량 = 계획수량 psmng - 입고수량 wemng, 잔량이 0 이하면 제외.\n· 한 줄: "오더 자재 계획수량 입고수량 잔량", 마지막 줄 "TOTAL 잔량합계". 없으면 NO DATA.',

    outDesc: '"오더 자재 계획수량 입고수량 잔량" 줄들과 마지막 "TOTAL 잔량합계". 없으면 NO DATA.',
    tests: [[[], ''], [[], 'X'], [[['I', 'EQ', 'FG1', '']], ''], [[['I', 'EQ', 'FG3', '']], '']].map(([s_matnr, p_rel]) => ({ s_matnr, p_rel, db: { afko: PP_QAFKO, afpo: PP_QAFPO, jest: PP_QJEST } })),

        const open = p[3] - p[4]; if (open <= 0) continue; out.push(`${h[0]} ${h[1]} ${p[3]} ${p[4]} ${open}`); tot += open; }
      return out.length ? [...out, `TOTAL ${tot}`].join('\n') : 'NO DATA'; },
    sol: L('REPORT zpp_open_orders.', '', 'TABLES afko.', 'SELECT-OPTIONS s_matnr FOR afko-matnr.', 'PARAMETERS p_rel AS CHECKBOX.', '', 'DATA: lv_objnr TYPE string,', '      lv_done  TYPE i,', '      lv_rel   TYPE i,', '      lv_open  TYPE i,', '      lv_cnt   TYPE i,', '      lv_tot   TYPE i.', '', 'START-OF-SELECTION.',
      '  SELECT a~aufnr, a~matnr, p~psmng, p~wemng', '    FROM afko AS a', '    INNER JOIN afpo AS p ON p~aufnr = a~aufnr', '    WHERE a~matnr IN @s_matnr', '    ORDER BY a~aufnr', '    INTO TABLE @DATA(gt_itab).', '',
      '  LOOP AT gt_itab INTO DATA(gs_itab).', '    lv_objnr = |OR{ gs_itab-aufnr }|.', '    SELECT COUNT(*) FROM jest', '      WHERE objnr = @lv_objnr', "        AND inact = ' '", "        AND stat IN ( 'I0045', 'I0012' )", '      INTO @lv_done.', '    IF lv_done > 0.', '      CONTINUE.', '    ENDIF.',

      '    lv_open = gs_itab-psmng - gs_itab-wemng.', '    IF lv_open <= 0.', '      CONTINUE.', '    ENDIF.', '    WRITE: / gs_itab-aufnr, gs_itab-matnr, gs_itab-psmng, gs_itab-wemng, lv_open.', '    lv_cnt = lv_cnt + 1.', '    lv_tot = lv_tot + lv_open.', '  ENDLOOP.', '',
      '  IF lv_cnt = 0.', "    WRITE 'NO DATA'.", '  ELSE.', "    WRITE: / 'TOTAL', lv_tot.", '  ENDIF.') },

  { id: 7315, pgm: true, topic: '조회 리포트', lv: 4, kind: 'rpt', title: '오더별 자재 출고 내역 (MB51)',
    body: 'SAP 표준 MB51(자재 문서 목록)을 생산오더 기준으로 보는 것처럼, 오더별 부품 소요 대비 실제 출고를 보여 주세요.\n· 예약: RESB 에서 오더 범위 s_aufnr, 삭제 표시(xloek) 없는 행을 오더·예약품목(rspos) 순으로 읽습니다. 없으면 NO DATA.\n· 출고: MATDOC 에서 그 오더들의 이동유형 261(출고)·262(출고 취소)를 FOR ALL ENTRIES 로 읽습니다. 같은 수량 문서가 여러 건일 수 있으니 문서 키(mblnr, zeile)도 함께 읽으세요.\n· 출고수량 = 오더·자재가 같은 261 수량 합 - 262 수량 합\n· 한 줄: "오더 예약품목 자재 소요량 출고수량 판정", 판정: 소요량 - 출고 > 0 이면 "OPEN 차이", < 0 이면 "OVER 차이(양수)", 같으면 OK\n· 마지막 줄 "TOTAL 출고수량합계"',
    fields: [['resb-bdmng', '소요량'], ['resb-xloek', '예약 삭제 표시'], ['matdoc-bwart', '이동 유형 (261 오더 출고 / 262 출고 취소)'], ['matdoc-mblnr', '자재 문서 번호'], ['matdoc-aufnr', '생산오더 번호']],
    tables: ['resb', 'matdoc'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR resb-aufnr', label: '생산오더' }],
    outDesc: '"오더 예약품목 자재 소요량 출고수량 판정" 줄들과 "TOTAL 출고합계". 예약이 없으면 NO DATA.',
    tests: [[], [['I', 'EQ', '100002', '']], [['I', 'BT', '100001', '100003'], ['E', 'EQ', '100001', '']], [['I', 'EQ', '100009', '']]].map(s_aufnr => ({ s_aufnr, db: { resb: PP_RESB, matdoc: PP_QMD } })),
    ref: ({ s_aufnr, db }) => {
      const r = db.resb.filter(x => ppIn(s_aufnr, x[9]) && x[10] === '').sort((a, b) => (a[9] + a[1]) < (b[9] + b[1]) ? -1 : 1); if (!r.length) return 'NO DATA';
      let tot = 0;

      return [...o, `TOTAL ${tot}`].join('\n'); },
    sol: L('REPORT zpp_order_gi_list.', '', 'TABLES resb.', 'SELECT-OPTIONS s_aufnr FOR resb-aufnr.', '', 'DATA: lv_iss  TYPE i,', '      lv_diff TYPE i,', '      lv_tot  TYPE i.', '', 'START-OF-SELECTION.',
      '  SELECT aufnr, rspos, matnr, bdmng FROM resb', '    WHERE aufnr IN @s_aufnr', "      AND xloek = ' '", '    ORDER BY aufnr, rspos', '    INTO TABLE @DATA(gt_resb).', '  IF gt_resb IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '',
      '  SELECT mblnr, zeile, aufnr, matnr, bwart, menge FROM matdoc', '    FOR ALL ENTRIES IN @gt_resb', '    WHERE aufnr = @gt_resb-aufnr', "      AND ( bwart = '261' OR bwart = '262' )", '    INTO TABLE @DATA(gt_md).', '',
      '  LOOP AT gt_resb INTO DATA(gs_resb).', '    CLEAR lv_iss.', '    LOOP AT gt_md INTO DATA(gs_md) WHERE aufnr = gs_resb-aufnr AND matnr = gs_resb-matnr.', "      IF gs_md-bwart = '261'.", '        lv_iss = lv_iss + gs_md-menge.', '      ELSE.', '        lv_iss = lv_iss - gs_md-menge.', '      ENDIF.', '    ENDLOOP.',
      '    lv_diff = gs_resb-bdmng - lv_iss.', '    WRITE: / gs_resb-aufnr, gs_resb-rspos, gs_resb-matnr, gs_resb-bdmng, lv_iss.', '    IF lv_diff > 0.', "      WRITE: 'OPEN', lv_diff.", '    ELSEIF lv_diff < 0.', '      lv_diff = - lv_diff.', "      WRITE: 'OVER', lv_diff.", '    ELSE.', "      WRITE 'OK'.", '    ENDIF.', '    lv_tot = lv_tot + lv_iss.', '  ENDLOOP.', "  WRITE: / 'TOTAL', lv_tot.") },

  { id: 7316, pgm: true, topic: '조회 리포트', lv: 4, kind: 'rpt', title: '생산 실적 확인 내역 (CO14)',
    body: 'SAP 표준 CO14(실적 확인 조회)처럼 생산오더 실적 확인 내역을 오더별 소계와 함께 보여 주세요.\n· AFRU 에서 오더 s_aufnr, 작업장 s_arbpl 범위로 읽되, 취소된 확인(stokz = \'X\')은 제외합니다. 오더·확인번호(rueck) 순.\n· 한 줄: "오더 확인번호 공정 작업장 확인수량 작업시간"\n· 오더가 끝날 때마다 "SUM 오더 확인수량합 작업시간합", 마지막 줄 "TOTAL 확인수량합 작업시간합"\n· AT NEW / AT END OF 를 써 보세요. 없으면 NO DATA.',
    fields: [['afru-rueck', '확인 번호'], ['afru-lmnga', '확인 수량(양품)'], ['afru-arbpl', '작업장'], ['afru-ism01', '실적 작업시간'], ['afru-stokz', '취소 표시 (X = 취소된 확인)']],
    tables: ['afru'], sel: [{ n: 's_aufnr', kind: 's', decl: 'FOR afru-aufnr', label: '생산오더' }, { n: 's_arbpl', kind: 's', decl: 'FOR afru-arbpl', label: '작업장' }],
    outDesc: '확인 내역 줄, 오더마다 SUM 줄, 마지막 TOTAL 줄. 없으면 NO DATA.',
    tests: [[[], []], [[], [['I', 'EQ', 'WC20', '']]], [[['I', 'EQ', '500002', '']], []], [[], [['I', 'EQ', 'WC30', '']]]].map(([s_aufnr, s_arbpl]) => ({ s_aufnr, s_arbpl, db: { afru: PP_QAFRU } })),
    ref: ({ s_aufnr, s_arbpl, db }) => {
      const r = db.afru.filter(x => ppIn(s_aufnr, x[1]) && ppIn(s_arbpl, x[4]) && x[7] !== 'X').sort((a, b) => (a[1] + a[0]) < (b[1] + b[0]) ? -1 : 1); if (!r.length) return 'NO DATA';
      const o = []; let q = 0, t = 0, tq = 0, tt = 0;
      r.forEach((x, i) => { o.push(`${x[1]} ${x[0]} ${x[3]} ${x[4]} ${x[2]} ${x[6]}`); q += x[2]; t += x[6]; tq += x[2]; tt += x[6]; if (i === r.length - 1 || r[i + 1][1] !== x[1]) { o.push(`SUM ${x[1]} ${q} ${t}`); q = 0; t = 0; } });
      return [...o, `TOTAL ${tq} ${tt}`].join('\n'); },
    sol: L('REPORT zpp_conf_list.', '', 'TABLES afru.', 'SELECT-OPTIONS: s_aufnr FOR afru-aufnr,', '                s_arbpl FOR afru-arbpl.', '', 'DATA: lv_q  TYPE i,', '      lv_t  TYPE i,', '      lv_tq TYPE i,', '      lv_tt TYPE i.', '', 'START-OF-SELECTION.',
      '  SELECT aufnr, rueck, vornr, arbpl, lmnga, ism01 FROM afru', '    WHERE aufnr IN @s_aufnr', '      AND arbpl IN @s_arbpl', "      AND stokz = ' '", '    ORDER BY aufnr, rueck', '    INTO TABLE @DATA(gt_itab).', '  IF gt_itab IS INITIAL.', "    WRITE 'NO DATA'.", '    RETURN.', '  ENDIF.', '',
      '  LOOP AT gt_itab INTO DATA(gs_itab).', '    AT NEW aufnr.', '      CLEAR: lv_q, lv_t.', '    ENDAT.', '    WRITE: / gs_itab-aufnr, gs_itab-rueck, gs_itab-vornr, gs_itab-arbpl, gs_itab-lmnga, gs_itab-ism01.', '    lv_q = lv_q + gs_itab-lmnga.', '    lv_t = lv_t + gs_itab-ism01.', '    lv_tq = lv_tq + gs_itab-lmnga.', '    lv_tt = lv_tt + gs_itab-ism01.',
      '    AT END OF aufnr.', "      WRITE: / 'SUM', gs_itab-aufnr, lv_q, lv_t.", '    ENDAT.', '  ENDLOOP.', "  WRITE: / 'TOTAL', lv_tq, lv_tt.") }
]);

addMod('fi', [
  // =================== Lv.1 입문 ===================
  { id: 6411, lv: 1, title: '미결·반제 판정 (BSID / BSAD)',
    body: '고객 송장 한 건의 정보가 주어집니다. 반제전표번호 augbl 이 비어 있으면 아직 미결(BSID), 있으면 반제 완료(BSAD) 입니다.\n· 미결: 기준일 keydt 가 만기일 zfbdt 보다 늦으면 "OPEN OVERDUE 지난일수", 아니면 OPEN NOT DUE\n· 반제: 반제일 augdt 가 만기일보다 늦으면 "CLEARED LATE 늦은일수", 아니면 CLEARED ON TIME\n날짜끼리 빼면 일수가 나옵니다 (예: keydt - zfbdt).',
    fields: [['bsid-zfbdt', '만기 계산 기준일'], ['bsad-augbl', '반제 전표번호 (비어 있으면 미결)'], ['bsad-augdt', '반제일 (입금 처리일)']],
    inputs: [{ n: 'augbl', t: 'string' }, { n: 'zfbdt', t: 'd' }, { n: 'augdt', t: 'd' }, { n: 'keydt', t: 'd' }], inDesc: '미결이면 augbl 은 빈 문자열, augdt 는 00000000', outDesc: '판정 결과 한 줄을 출력합니다.',
    tests: [['', '20261001', '00000000', '20261010'], ['', '20261101', '00000000', '20261031'], ['1500001', '20261001', '20261005', '20261109'], ['1500002', '20261010', '20261010', '20261109'], ['', '20261109', '00000000', '20261109'], ['1500003', '20260930', '20260901', '20261109']]
      .map(([augbl, zfbdt, augdt, keydt]) => ({ augbl, zfbdt, augdt, keydt })),
    ref: ({ augbl, zfbdt, augdt, keydt }) => { if (!augbl) { const d = fiDays(zfbdt, keydt); return d > 0 ? `OPEN OVERDUE ${d}` : 'OPEN NOT DUE'; } const d = fiDays(zfbdt, augdt); return d > 0 ? `CLEARED LATE ${d}` : 'CLEARED ON TIME'; },
    sol: "DATA lv_days TYPE i.\n\nIF augbl IS INITIAL.\n  lv_days = keydt - zfbdt.\n  IF lv_days > 0.\n    WRITE: 'OPEN OVERDUE', lv_days.\n  ELSE.\n    WRITE 'OPEN NOT DUE'.\n  ENDIF.\nELSE.\n  lv_days = augdt - zfbdt.\n  IF lv_days > 0.\n    WRITE: 'CLEARED LATE', lv_days.\n  ELSE.\n    WRITE 'CLEARED ON TIME'.\n  ENDIF.\nENDIF." },

  { id: 6412, lv: 1, title: '차변·대변 부호 (BSEG-SHKZG)',
    body: '전표 품목의 차대 구분 shkzg 와 금액 dmbtr 가 주어집니다.\n· S(차변) → DEBIT 금액\n· H(대변) → CREDIT -금액 (대변은 음수로 표시)\n· 그 밖 → ERROR\nCASE 문으로 나눠 출력하세요.',
    fields: [['bseg-shkzg', '차변/대변 지시자 (S 차변, H 대변)'], ['bseg-dmbtr', '현지통화 금액']],
    inputs: [{ n: 'shkzg', t: 'string' }, { n: 'dmbtr', t: 'i' }], inDesc: 'shkzg: 한 글자, 0 ≤ dmbtr ≤ 1,000,000', outDesc: '"DEBIT 금액", "CREDIT -금액", ERROR 중 하나를 출력합니다.',
    tests: [['S', 500], ['H', 500], ['X', 100], ['H', 0], ['S', 1000000]].map(([shkzg, dmbtr]) => ({ shkzg, dmbtr })),
    ref: ({ shkzg, dmbtr }) => shkzg === 'S' ? `DEBIT ${dmbtr}` : shkzg === 'H' ? `CREDIT ${-dmbtr}` : 'ERROR',
    sol: "CASE shkzg.\n  WHEN 'S'.\n    WRITE: 'DEBIT', dmbtr.\n  WHEN 'H'.\n    DATA(lv_amt) = dmbtr * -1.\n    WRITE: 'CREDIT', lv_amt.\n  WHEN OTHERS.\n    WRITE 'ERROR'.\nENDCASE." },

  { id: 6413, lv: 1, title: '유니버설 저널 라인 찾기 (ACDOCA 구조)',
    body: 'S/4HANA 의 회계 라인은 ACDOCA 한 테이블에 쌓입니다. 한 전표의 라인이 gt_itab(라인 docln, 계정 racct, 차대 drcrk, 금액 hsl)에 들어 있습니다. ACDOCA 의 hsl 은 차변(S)이 양수, 대변(H)이 음수입니다.\n첫째 줄에 "LINES 라인수", 둘째 줄에 라인 p_docln 의 "계정 차대 금액"을 출력하세요. 없으면 NOT FOUND.\nLOOP 없이 lines( ) 와 READ TABLE ... WITH KEY 를 쓰세요.',
    ban: ['LOOP'], fields: [['acdoca-docln', '전표 라인 번호 (6자리)'], ['acdoca-racct', 'G/L 계정'], ['acdoca-drcrk', '차변/대변 (S/H)'], ['acdoca-hsl', '현지통화 금액 (대변은 음수)']],
    structs: { ty_acdoca: [{ n: 'docln', t: 'string' }, { n: 'racct', t: 'string' }, { n: 'drcrk', t: 'string' }, { n: 'hsl', t: 'i' }] },
    inputs: [{ n: 'p_docln', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_acdoca' }], inDesc: 'gt_itab: 1~50행, 라인번호 중복 없음', outDesc: '두 줄을 출력합니다.',
    tests: [['000002', [['000001', '11000000', 'S', 1100], ['000002', '40000000', 'H', -1000], ['000003', '25500000', 'H', -100]]], ['000009', [['000001', '11000000', 'S', 500], ['000002', '40000000', 'H', -500]]], ['000001', [['000001', '51000000', 'S', 300]]]].map(([p_docln, gt_itab]) => ({ p_docln, gt_itab })),
    ref: ({ p_docln, gt_itab }) => { const r = gt_itab.find(x => x[0] === p_docln); return `LINES ${gt_itab.length}\n` + (r ? `${r[1]} ${r[2]} ${r[3]}` : 'NOT FOUND'); },
    sol: "WRITE: 'LINES', lines( gt_itab ).\nREAD TABLE gt_itab INTO DATA(gs_line) WITH KEY docln = p_docln.\nIF sy-subrc = 0.\n  WRITE: / gs_line-racct, gs_line-drcrk, gs_line-hsl.\nELSE.\n  WRITE / 'NOT FOUND'.\nENDIF." },

  reuse(5004, { id: 7401, pgm: true, topic: '선택화면', from: 6414, lv: 1, title: '송장 금액 선택 화면 (체크박스·라디오)',
    body: '송장 금액을 입력받는 선택 화면을 만드세요.\n· p_amt (TYPE i): 공급가액 (BSEG-DMBTR)\n· p_vat: 체크박스 (AS CHECKBOX) — 체크하면 부가세 10%(DIV 10)를 더합니다.\n· r_krw, r_usd: 라디오버튼 (RADIOBUTTON GROUP g1) — 전표 통화(BKPF-WAERS)를 고릅니다.\n"금액 통화"를 출력하세요. 체크된 항목의 값은 \'X\' 입니다.',
    fields: [['bseg-dmbtr', '현지통화 금액'], ['bkpf-waers', '전표 통화 키 (KRW, USD …)']] }),

  // =================== Lv.2 초급 ===================
  { id: 6421, lv: 2, kind: 'rpt', title: 'G/L 미결 항목 조회 (BSIS)', tables: ['bsis'],
    body: 'G/L 계정의 미결 항목은 BSIS 에 있습니다. 회사코드 p_bukrs, 계정 p_hkont 의 미결 항목을 읽어 출력하세요.\n· 전기일, 전표번호 순으로 "전표번호 전기일 금액" — 대변(H)은 음수로 표시합니다.\n· 마지막 줄에 "BALANCE 잔액"(부호 반영 합계)을 출력합니다.\n· 없으면 NO OPEN ITEM.',
    fields: [['bsis-hkont', 'G/L 계정'], ['bsis-belnr', '전표번호'], ['bsis-budat', '전기일'], ['bsis-shkzg', '차변(S)/대변(H)'], ['bsis-dmbtr', '현지통화 금액']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsis-bukrs', label: '회사코드' }, { n: 'p_hkont', kind: 'p', decl: 'TYPE bsis-hkont', label: 'G/L 계정' }],
    tests: [['1000', '11300000'], ['1000', '21100000'], ['1000', '40000000'], ['2000', '11300000']].map(([p_bukrs, p_hkont]) => ({ p_bukrs, p_hkont, db: { bsis: FI_BSIS } })),
    ref: ({ p_bukrs, p_hkont, db }) => { const r = db.bsis.filter(x => x[0] === p_bukrs && x[1] === p_hkont).sort((a, b) => (a[3] + a[2]) < (b[3] + b[2]) ? -1 : 1); if (!r.length) return 'NO OPEN ITEM'; const v = x => x[4] === 'H' ? -x[5] : x[5]; return [...r.map(x => `${x[2]} ${x[3]} ${v(x)}`), `BALANCE ${r.reduce((s, x) => s + v(x), 0)}`].join('\n'); },
    sol: "REPORT zfi_bsis.\n\nPARAMETERS: p_bukrs TYPE bsis-bukrs,\n            p_hkont TYPE bsis-hkont.\n\nSTART-OF-SELECTION.\n  SELECT belnr, budat, shkzg, dmbtr\n    FROM bsis\n    WHERE bukrs = @p_bukrs\n      AND hkont = @p_hkont\n    ORDER BY budat, belnr\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO OPEN ITEM'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_amt TYPE i,\n        lv_bal TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    lv_amt = gs_itab-dmbtr.\n    IF gs_itab-shkzg = 'H'.\n      lv_amt = - lv_amt.\n    ENDIF.\n    lv_bal = lv_bal + lv_amt.\n    WRITE: / gs_itab-belnr, gs_itab-budat, lv_amt.\n  ENDLOOP.\n  WRITE: / 'BALANCE', lv_bal." },

  reuse(4008, { id: 7402, pgm: true, topic: '리포트', from: 6422, lv: 2, title: '전표 유형별 건수 (BKPF, GROUP BY)',
    fields: [['bkpf-bukrs', '회사코드'], ['bkpf-blart', '전표 유형 (SA 일반, DR 고객송장, KR 공급업체송장)'], ['bkpf-budat', '전기일']] }),

  { id: 7403, pgm: true, topic: '리포트', from: 6423, lv: 2, kind: 'rpt', title: '계정 회사코드 설정 (SKB1 + SKAT)', tables: ['skb1', 'skat'],
    body: '회사코드 p_bukrs 의 G/L 계정 설정을 SKB1 에서 읽고, 한국어 계정명(SKAT, spras = \'3\')을 JOIN 해서 계정번호 순으로 출력하세요.\n"계정 계정명 구분" — 구분은\n· 조정계정 구분 mitkz 가 D → RECON_AR (고객 조정계정), K → RECON_AP (공급업체 조정계정)\n· 그 밖에 미결관리 xopvw = \'X\' → OPEN_ITEM\n· 그 밖 → NORMAL\n마지막 줄에 "COUNT 계정수". 없으면 NO DATA.',
    fields: [['skb1-saknr', 'G/L 계정번호'], ['skb1-mitkz', '조정계정 구분 (D 고객, K 공급업체)'], ['skb1-xopvw', '미결 항목 관리 여부'], ['skat-txt50', '계정명']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE skb1-bukrs', label: '회사코드' }],
    tests: ['1000', '2000', '9000'].map(p_bukrs => ({ p_bukrs, db: { skb1: FI_SKB1, skat: FI_SKAT } })),
    ref: ({ p_bukrs, db }) => { const r = db.skb1.filter(x => x[0] === p_bukrs).sort((a, b) => a[1] < b[1] ? -1 : 1); if (!r.length) return 'NO DATA'; const k = x => x[4] === 'D' ? 'RECON_AR' : x[4] === 'K' ? 'RECON_AP' : x[3] === 'X' ? 'OPEN_ITEM' : 'NORMAL'; return [...r.map(x => `${x[1]} ${db.skat.find(t => t[0] === x[1] && t[1] === '3')[2]} ${k(x)}`), `COUNT ${r.length}`].join('\n'); },
    sol: "REPORT zfi_skb1.\n\nPARAMETERS p_bukrs TYPE skb1-bukrs.\n\nSTART-OF-SELECTION.\n  SELECT b~saknr, t~txt50, b~xopvw, b~mitkz\n    FROM skb1 AS b\n    INNER JOIN skat AS t ON b~saknr = t~saknr\n    WHERE b~bukrs = @p_bukrs\n      AND t~spras = '3'\n    ORDER BY b~saknr\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA lv_kind TYPE string.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    CASE gs_itab-mitkz.\n      WHEN 'D'.\n        lv_kind = 'RECON_AR'.\n      WHEN 'K'.\n        lv_kind = 'RECON_AP'.\n      WHEN OTHERS.\n        IF gs_itab-xopvw = 'X'.\n          lv_kind = 'OPEN_ITEM'.\n        ELSE.\n          lv_kind = 'NORMAL'.\n        ENDIF.\n    ENDCASE.\n    WRITE: / gs_itab-saknr, gs_itab-txt50, lv_kind.\n  ENDLOOP.\n  WRITE: / 'COUNT', lines( gt_itab )." },

  { id: 7404, pgm: true, topic: 'CRUD', from: 6424, lv: 2, kind: 'rpt', title: '보류 전표 일괄 전기 (UPDATE)', tables: ['zfi_parked'], checkDb: ['zfi_parked'],
    body: '보류 전표 테이블 ZFI_PARKED 에서 상태(status)가 H(보류)이고 증빙일(bldat)이 기준일 p_date 이하인 전표를 모두 P(전기)로 바꾸세요.\n· UPDATE ... SET ... WHERE 한 문장으로 처리합니다.\n· 바뀐 건수(sy-dbcnt)가 있으면 COMMIT WORK 후 "POSTED 건수", 없으면 NO DOCUMENT 를 출력합니다.\n· 채점기는 ZFI_PARKED 내용도 함께 비교합니다.',
    fields: [['zfi_parked-belnr', '전표번호'], ['zfi_parked-bldat', '증빙일 (BKPF-BLDAT 와 같은 뜻)'], ['zfi_parked-status', '상태 (H 보류, P 전기)']],
    sel: [{ n: 'p_date', kind: 'p', decl: 'TYPE datum', label: '기준일' }],
    tests: ['20261031', '20261109', '20261001', '20261231'].map(p_date => ({ p_date, db: { zfi_parked: FI_PARKED() } })),
    ref: ({ p_date, db }) => { const t = db.zfi_parked.map(r => r.slice()); let n = 0; t.forEach(r => { if (r[3] === 'H' && r[1] <= p_date) { r[3] = 'P'; n++; } }); return (n ? `POSTED ${n}` : 'NO DOCUMENT') + '\n' + dump('zfi_parked', t); },
    sol: "REPORT zfi_post_parked.\n\nPARAMETERS p_date TYPE datum.\n\nSTART-OF-SELECTION.\n  UPDATE zfi_parked\n    SET status = 'P'\n    WHERE status = 'H'\n      AND bldat <= @p_date.\n  IF sy-dbcnt > 0.\n    COMMIT WORK.\n    WRITE: 'POSTED', sy-dbcnt.\n  ELSE.\n    WRITE 'NO DOCUMENT'.\n  ENDIF." },

  // =================== Lv.3 중급 ===================
  { id: 7405, pgm: true, topic: '클래스', from: 6431, lv: 3, kind: 'rpt', title: '고객 채권 클래스 (BSID + BSAD)', must: ['lcl_customer'], tables: ['bsid', 'bsad'],
    body: '로컬 클래스 lcl_customer 로 고객 한 명의 채권 상태를 분석하세요.\n· constructor( iv_bukrs, iv_kunnr ): 미결 항목(BSID)과 반제 항목(BSAD)을 읽어 인스턴스 속성(인터널 테이블)에 담습니다.\n· get_open( ) RETURNING: 미결 금액 합계\n· get_cleared( ) RETURNING: 반제 건수\n· get_late( ) RETURNING: 반제일 augdt 가 만기일 zfbdt 보다 늦은 반제 건수\n선택 화면 p_bukrs, p_kunnr 로 객체를 만들고 "고객 OPEN 미결합계 CLEARED 반제건수 LATE 지연건수" 를 출력하세요.\n둘째 줄: 지연건수 × 2 가 반제건수보다 크면 RISK HIGH, 아니면 RISK LOW.\n미결도 반제도 없으면 NO DATA 만 출력합니다.',
    fields: [['bsid-dmbtr', '미결 금액'], ['bsad-augdt', '반제일'], ['bsad-augbl', '반제 전표번호'], ['bsad-zfbdt', '만기 계산 기준일']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsid-bukrs', label: '회사코드' }, { n: 'p_kunnr', kind: 'p', decl: 'TYPE bsid-kunnr', label: '고객' }],
    tests: [['1000', 'C100'], ['1000', 'C200'], ['1000', 'C300'], ['1000', 'C900'], ['2000', 'C100']].map(([p_bukrs, p_kunnr]) => ({ p_bukrs, p_kunnr, db: { bsid: FI_BSID, bsad: FI_BSAD } })),
    ref: ({ p_bukrs, p_kunnr, db }) => { const o = db.bsid.filter(x => x[0] === p_bukrs && x[1] === p_kunnr); const c = db.bsad.filter(x => x[0] === p_bukrs && x[1] === p_kunnr); if (!o.length && !c.length) return 'NO DATA'; const late = c.filter(x => x[2] > x[6]).length; return `${p_kunnr} OPEN ${o.reduce((s, x) => s + x[4], 0)} CLEARED ${c.length} LATE ${late}\nRISK ${late * 2 > c.length ? 'HIGH' : 'LOW'}`; },
    sol: "REPORT zfi_customer_class.\n\nPARAMETERS: p_bukrs TYPE bsid-bukrs,\n            p_kunnr TYPE bsid-kunnr.\n\nCLASS lcl_customer DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_bukrs TYPE string iv_kunnr TYPE string,\n             get_open    RETURNING VALUE(rv_amt) TYPE i,\n             get_cleared RETURNING VALUE(rv_cnt) TYPE i,\n             get_late    RETURNING VALUE(rv_cnt) TYPE i.\n  PRIVATE SECTION.\n    DATA: mt_open  TYPE TABLE OF bsid,\n          mt_clear TYPE TABLE OF bsad.\nENDCLASS.\n\nCLASS lcl_customer IMPLEMENTATION.\n  METHOD constructor.\n    SELECT * FROM bsid\n      WHERE bukrs = @iv_bukrs AND kunnr = @iv_kunnr\n      INTO TABLE @mt_open.\n    SELECT * FROM bsad\n      WHERE bukrs = @iv_bukrs AND kunnr = @iv_kunnr\n      INTO TABLE @mt_clear.\n  ENDMETHOD.\n  METHOD get_open.\n    LOOP AT mt_open INTO DATA(ls_open).\n      rv_amt = rv_amt + ls_open-dmbtr.\n    ENDLOOP.\n  ENDMETHOD.\n  METHOD get_cleared.\n    rv_cnt = lines( mt_clear ).\n  ENDMETHOD.\n  METHOD get_late.\n    LOOP AT mt_clear INTO DATA(ls_clear) WHERE augdt > zfbdt.\n      rv_cnt = rv_cnt + 1.\n    ENDLOOP.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA(go_cust) = NEW lcl_customer( iv_bukrs = p_bukrs iv_kunnr = p_kunnr ).\n  DATA(lv_open) = go_cust->get_open( ).\n  DATA(lv_clr) = go_cust->get_cleared( ).\n  DATA(lv_late) = go_cust->get_late( ).\n  IF lv_open = 0 AND lv_clr = 0.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  WRITE: p_kunnr, 'OPEN', lv_open, 'CLEARED', lv_clr, 'LATE', lv_late.\n  IF lv_late * 2 > lv_clr.\n    WRITE / 'RISK HIGH'.\n  ELSE.\n    WRITE / 'RISK LOW'.\n  ENDIF." },

  { id: 7406, pgm: true, topic: '클래스', from: 6432, lv: 3, title: '전표 클래스 (차대 균형)', must: ['lcl_document'],
    body: '로컬 클래스 lcl_document 로 전표 한 장의 차대 균형을 검사하세요.\n· constructor( iv_belnr ): 전표번호를 받습니다.\n· add_line( iv_shkzg, iv_dmbtr ): 품목을 더합니다. S 는 차변 합계에, H 는 대변 합계에 더합니다.\n· get_debit( ), get_credit( ): 차변 합계, 대변 합계를 돌려줍니다(RETURNING).\n· is_balanced( ) RETURNING rv_ok: 두 합계가 같으면 abap_true\n전표번호 p_belnr 로 객체를 만들고 gt_itab 의 품목을 모두 더한 뒤 "전표번호 차변합 대변합 BALANCED" 또는 "... UNBALANCED" 를 출력하세요.',
    fields: [['bkpf-belnr', '전표번호'], ['bseg-shkzg', '차변/대변'], ['bseg-dmbtr', '금액']],
    structs: { ty_line: [{ n: 'shkzg', t: 'string' }, { n: 'dmbtr', t: 'i' }] },
    inputs: [{ n: 'p_belnr', t: 'string' }, { n: 'gt_itab', t: 'itab', st: 'ty_line' }], inDesc: 'gt_itab: 1~50행, shkzg 는 S 또는 H', outDesc: '한 줄을 출력합니다.',
    tests: [['100001', [['S', 500], ['H', 500]]], ['100002', [['S', 1100], ['H', 1000], ['H', 100]]], ['100009', [['S', 300], ['H', 200]]], ['100010', [['H', 50]]]].map(([p_belnr, gt_itab]) => ({ p_belnr, gt_itab })),
    ref: ({ p_belnr, gt_itab }) => { const s = gt_itab.filter(x => x[0] === 'S').reduce((a, x) => a + x[1], 0); const h = gt_itab.filter(x => x[0] === 'H').reduce((a, x) => a + x[1], 0); return `${p_belnr} ${s} ${h} ${s === h ? 'BALANCED' : 'UNBALANCED'}`; },
    sol: "CLASS lcl_document DEFINITION.\n  PUBLIC SECTION.\n    METHODS: constructor IMPORTING iv_belnr TYPE string,\n             add_line    IMPORTING iv_shkzg TYPE string iv_dmbtr TYPE i,\n             get_debit   RETURNING VALUE(rv_amt) TYPE i,\n             get_credit  RETURNING VALUE(rv_amt) TYPE i,\n             is_balanced RETURNING VALUE(rv_ok) TYPE abap_bool.\n  PRIVATE SECTION.\n    DATA: mv_belnr  TYPE string,\n          mv_debit  TYPE i,\n          mv_credit TYPE i.\nENDCLASS.\n\nCLASS lcl_document IMPLEMENTATION.\n  METHOD constructor.\n    mv_belnr = iv_belnr.\n  ENDMETHOD.\n  METHOD add_line.\n    IF iv_shkzg = 'S'.\n      mv_debit = mv_debit + iv_dmbtr.\n    ELSE.\n      mv_credit = mv_credit + iv_dmbtr.\n    ENDIF.\n  ENDMETHOD.\n  METHOD get_debit.\n    rv_amt = mv_debit.\n  ENDMETHOD.\n  METHOD get_credit.\n    rv_amt = mv_credit.\n  ENDMETHOD.\n  METHOD is_balanced.\n    rv_ok = xsdbool( mv_debit = mv_credit ).\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  DATA(go_doc) = NEW lcl_document( p_belnr ).\n  LOOP AT gt_itab INTO DATA(gs_line).\n    go_doc->add_line( iv_shkzg = gs_line-shkzg iv_dmbtr = gs_line-dmbtr ).\n  ENDLOOP.\n  DATA(lv_debit) = go_doc->get_debit( ).\n  DATA(lv_credit) = go_doc->get_credit( ).\n  IF go_doc->is_balanced( ) = abap_true.\n    WRITE: p_belnr, lv_debit, lv_credit, 'BALANCED'.\n  ELSE.\n    WRITE: p_belnr, lv_debit, lv_credit, 'UNBALANCED'.\n  ENDIF." },

  { id: 7407, pgm: true, topic: 'ALV', from: 6433, lv: 3, kind: 'rpt', title: '전표 ALV 더블클릭 (BKPF → BSEG)', must: ['cl_gui_alv_grid', 'double_click'], tables: ['bkpf', 'bseg'],
    body: '회계전표 헤더(BKPF)를 CL_GUI_ALV_GRID 로 보여 주고, 행을 더블클릭하면 그 전표의 품목(BSEG) 정보를 메시지로 보여 주세요.\n· ALV 열: BELNR(전표번호), BLART(유형), BUDAT(전기일) — 전표번호 순\n· 이벤트 핸들러 클래스 lcl_handler 에 double_click 메서드를 만들고 SET HANDLER 로 연결합니다.\n· 더블클릭하면 BSEG 에서 같은 bukrs·belnr·gjahr 의 품목을 읽어 MESSAGE |전표번호 LINES 품목수 DEBIT 차변합계| TYPE \'I\' 로 보여 줍니다.\n· 채점기가 테스트마다 "n번째 행 더블클릭"을 대신 일으킵니다(e_row-index = n).',
    fields: [['bkpf-belnr', '전표번호'], ['bkpf-blart', '전표 유형'], ['bkpf-budat', '전기일'], ['bseg-shkzg', '차변/대변'], ['bseg-dmbtr', '금액']],
    sel: [],
    tests: [[{ ev: 'double_click', row: 2, col: 'BELNR' }], [{ ev: 'double_click', row: 1, col: 'BLART' }, { ev: 'double_click', row: 4, col: 'BUDAT' }], [{ ev: 'double_click', row: 3, col: 'BELNR' }]].map(events => ({ events, db: { bkpf: FI_BKPF, bseg: FI_BSEG } })),
    ref: ({ events, db }) => { const r = db.bkpf.slice().sort((a, b) => a[1] < b[1] ? -1 : 1); const out = [alvTxt('', ['전표번호', '유형', '전기일'], r.map(x => [x[1], x[3], x[4]]))]; for (const e of events) { const h = r[e.row - 1]; const it = db.bseg.filter(x => x[0] === h[0] && x[1] === h[1] && x[2] === h[2]); out.push(`${h[1]} LINES ${it.length} DEBIT ${it.filter(x => x[5] === 'S').reduce((s, x) => s + x[6], 0)}`); } return out.join('\n'); },
    sol: "REPORT zfi_doc_alv.\n\nDATA: go_grid TYPE REF TO cl_gui_alv_grid,\n      gt_fcat TYPE lvc_t_fcat,\n      gt_itab TYPE TABLE OF bkpf.\n\nCLASS lcl_handler DEFINITION.\n  PUBLIC SECTION.\n    METHODS on_double_click FOR EVENT double_click OF cl_gui_alv_grid\n      IMPORTING e_row e_column.\nENDCLASS.\n\nCLASS lcl_handler IMPLEMENTATION.\n  METHOD on_double_click.\n    READ TABLE gt_itab INTO DATA(gs_doc) INDEX e_row-index.\n    CHECK sy-subrc = 0.\n    SELECT shkzg, dmbtr\n      FROM bseg\n      WHERE bukrs = @gs_doc-bukrs\n        AND belnr = @gs_doc-belnr\n        AND gjahr = @gs_doc-gjahr\n      INTO TABLE @DATA(gt_line).\n    DATA lv_debit TYPE i.\n    LOOP AT gt_line INTO DATA(gs_line) WHERE shkzg = 'S'.\n      lv_debit = lv_debit + gs_line-dmbtr.\n    ENDLOOP.\n    MESSAGE |{ gs_doc-belnr } LINES { lines( gt_line ) } DEBIT { lv_debit }| TYPE 'I'.\n  ENDMETHOD.\nENDCLASS.\n\nSTART-OF-SELECTION.\n  SELECT * FROM bkpf\n    ORDER BY belnr\n    INTO TABLE @gt_itab.\n\n  gt_fcat = VALUE #( ( fieldname = 'BELNR' coltext = '전표번호' )\n                     ( fieldname = 'BLART' coltext = '유형' )\n                     ( fieldname = 'BUDAT' coltext = '전기일' ) ).\n  go_grid = NEW #( i_parent = cl_gui_container=>default_screen ).\n  DATA(go_handler) = NEW lcl_handler( ).\n  SET HANDLER go_handler->on_double_click FOR go_grid.\n  go_grid->set_table_for_first_display( CHANGING it_outtab       = gt_itab\n                                                 it_fieldcatalog = gt_fcat )." },

  { id: 7408, pgm: true, topic: 'CRUD', from: 6434, lv: 3, kind: 'rpt', title: 'G/L 계정 관리 CRUD (ZFI_GLACCT)', tables: ['zfi_glacct'], checkDb: ['zfi_glacct'],
    body: '라디오버튼으로 작업을 골라 G/L 계정 테이블 ZFI_GLACCT 를 관리하는 리포트를 만드세요.\n· r_c 등록: 같은 계정이 있으면 MESSAGE \'ALREADY EXISTS\' TYPE \'E\', 없으면 INSERT 후 CREATED\n· r_r 조회: "계정 계정명 BS" 또는 "계정 계정명 PL" 출력 (xbilk = \'X\' 면 재무상태표 BS, 아니면 손익계산서 PL), 없으면 NOT FOUND\n· r_u 수정: 계정명·BS 여부를 선택 화면 값으로 바꾸고 UPDATED, 없으면 NOT FOUND\n· r_d 삭제: 지우고 DELETED, 없으면 NOT FOUND\n· 등록·수정·삭제가 성공하면 COMMIT WORK 하세요. 채점기는 ZFI_GLACCT 내용도 함께 비교합니다.',
    fields: [['zfi_glacct-saknr', 'G/L 계정번호 (SKA1-SAKNR)'], ['zfi_glacct-txt50', '계정명 (SKAT-TXT50)'], ['zfi_glacct-xbilk', '재무상태표 계정 여부 (SKA1-XBILK)']],
    sel: [{ n: 'r_c', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '등록' }, { n: 'r_r', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '조회' }, { n: 'r_u', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '수정' }, { n: 'r_d', kind: 'p', decl: 'RADIOBUTTON GROUP g1', label: '삭제' },
      { n: 'p_saknr', kind: 'p', decl: 'TYPE zfi_glacct-saknr', label: '계정' }, { n: 'p_txt50', kind: 'p', decl: 'TYPE zfi_glacct-txt50', label: '계정명' }, { n: 'p_xbilk', kind: 'p', decl: 'AS CHECKBOX', label: 'BS 계정' }],
    tests: [['C', '51000000', '복리후생비', ''], ['C', '11000000', '중복', 'X'], ['R', '25500000', '', ''], ['R', '40000000', '', ''], ['U', '40000000', '상품매출', ''], ['D', '25500000', '', ''], ['R', '99999999', '', ''], ['U', '99999999', 'X', 'X'], ['D', '99999999', '', '']]
      .map(([m, p_saknr, p_txt50, p_xbilk]) => ({ r_c: m === 'C' ? 'X' : '', r_r: m === 'R' ? 'X' : '', r_u: m === 'U' ? 'X' : '', r_d: m === 'D' ? 'X' : '', p_saknr, p_txt50, p_xbilk, db: { zfi_glacct: FI_GL() } })),
    ref: (x) => { const t = x.db.zfi_glacct.map(r => r.slice()); const i = t.findIndex(r => r[0] === x.p_saknr); let m;
      if (x.r_c === 'X') { if (i >= 0) m = 'ALREADY EXISTS'; else { t.push([x.p_saknr, x.p_txt50, x.p_xbilk]); m = 'CREATED'; } }
      else if (x.r_r === 'X') m = i >= 0 ? `${t[i][0]} ${t[i][1]} ${t[i][2] === 'X' ? 'BS' : 'PL'}` : 'NOT FOUND';
      else if (x.r_u === 'X') { if (i >= 0) { t[i] = [x.p_saknr, x.p_txt50, x.p_xbilk]; m = 'UPDATED'; } else m = 'NOT FOUND'; }
      else { if (i >= 0) { t.splice(i, 1); m = 'DELETED'; } else m = 'NOT FOUND'; }
      return m + '\n' + dump('zfi_glacct', t); },
    sol: "REPORT zfi_gl_crud.\n\nPARAMETERS: r_c RADIOBUTTON GROUP g1,\n            r_r RADIOBUTTON GROUP g1,\n            r_u RADIOBUTTON GROUP g1,\n            r_d RADIOBUTTON GROUP g1.\nPARAMETERS: p_saknr TYPE zfi_glacct-saknr,\n            p_txt50 TYPE zfi_glacct-txt50,\n            p_xbilk AS CHECKBOX.\n\nSTART-OF-SELECTION.\n  DATA(gs_gl) = VALUE zfi_glacct( saknr = p_saknr txt50 = p_txt50 xbilk = p_xbilk ).\n\n  IF r_c = 'X'.\n    SELECT SINGLE saknr FROM zfi_glacct WHERE saknr = @p_saknr INTO @DATA(lv_saknr).\n    IF sy-subrc = 0.\n      MESSAGE 'ALREADY EXISTS' TYPE 'E'.\n    ENDIF.\n    INSERT zfi_glacct FROM gs_gl.\n    COMMIT WORK.\n    WRITE 'CREATED'.\n\n  ELSEIF r_r = 'X'.\n    SELECT SINGLE * FROM zfi_glacct WHERE saknr = @p_saknr INTO @DATA(gs_read).\n    IF sy-subrc <> 0.\n      WRITE 'NOT FOUND'.\n    ELSEIF gs_read-xbilk = 'X'.\n      WRITE: gs_read-saknr, gs_read-txt50, 'BS'.\n    ELSE.\n      WRITE: gs_read-saknr, gs_read-txt50, 'PL'.\n    ENDIF.\n\n  ELSEIF r_u = 'X'.\n    UPDATE zfi_glacct FROM gs_gl.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'UPDATED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n\n  ELSE.\n    DELETE FROM zfi_glacct WHERE saknr = @p_saknr.\n    IF sy-subrc = 0.\n      COMMIT WORK.\n      WRITE 'DELETED'.\n    ELSE.\n      WRITE 'NOT FOUND'.\n    ENDIF.\n  ENDIF." },

  // =================== Lv.4 고급 ===================
  { id: 7409, pgm: true, topic: '리포트', from: 6441, lv: 4, kind: 'rpt', title: '계정별 잔액 시산표 (ACDOCA + SKAT)', tables: ['acdoca', 'skat'],
    body: 'S/4HANA 유니버설 저널 ACDOCA 로 시산표를 만드세요.\n· 원장 rldnr = \'0L\'(대표 원장), 회사코드 p_bukrs, 회계연도 p_gjahr, 기간 poper 가 p_poper 이하인 라인만 읽습니다.\n· 계정(racct)별로 hsl 을 합칩니다(hsl 은 대변이 음수라 그냥 더하면 잔액). SUM( ) 과 GROUP BY 를 써 보세요.\n· 계정 순으로 "계정 계정명(SKAT, 한국어) 잔액" 을 출력합니다.\n· 마지막 줄: 전체 잔액 합이 0 이면 CHECK OK, 아니면 "CHECK DIFF 합계".\n· 라인이 없으면 NO DATA.',
    fields: [['acdoca-rldnr', '원장 (0L 대표 원장)'], ['acdoca-racct', 'G/L 계정'], ['acdoca-poper', '전기 기간 (001~012)'], ['acdoca-hsl', '현지통화 금액 (부호 포함)'], ['skat-txt50', '계정명']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE acdoca-rbukrs', label: '회사코드' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE acdoca-gjahr', label: '회계연도' }, { n: 'p_poper', kind: 'p', decl: 'TYPE acdoca-poper', label: '기간(까지)' }],
    tests: [['1000', '2026', '010'], ['1000', '2026', '011'], ['2000', '2026', '012'], ['1000', '2025', '012']].map(([p_bukrs, p_gjahr, p_poper]) => ({ p_bukrs, p_gjahr, p_poper, db: { acdoca: FI_ACDOCA, skat: FI_SKAT } })),
    ref: ({ p_bukrs, p_gjahr, p_poper, db }) => { const m = {}; db.acdoca.filter(x => x[0] === '0L' && x[1] === p_bukrs && x[2] === p_gjahr && x[13] <= p_poper).forEach(x => m[x[5]] = (m[x[5]] || 0) + x[11]); const k = Object.keys(m).sort(); if (!k.length) return 'NO DATA'; const tot = k.reduce((s, a) => s + m[a], 0); return [...k.map(a => `${a} ${db.skat.find(t => t[0] === a && t[1] === '3')[2]} ${m[a]}`), tot === 0 ? 'CHECK OK' : `CHECK DIFF ${tot}`].join('\n'); },
    sol: "REPORT zfi_trial_balance.\n\nPARAMETERS: p_bukrs TYPE acdoca-rbukrs,\n            p_gjahr TYPE acdoca-gjahr,\n            p_poper TYPE acdoca-poper.\n\nSTART-OF-SELECTION.\n  SELECT racct, SUM( hsl ) AS bal\n    FROM acdoca\n    WHERE rldnr = '0L'\n      AND rbukrs = @p_bukrs\n      AND gjahr = @p_gjahr\n      AND poper <= @p_poper\n    GROUP BY racct\n    ORDER BY racct\n    INTO TABLE @DATA(gt_itab).\n  IF gt_itab IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA lv_total TYPE i.\n  LOOP AT gt_itab INTO DATA(gs_itab).\n    SELECT SINGLE txt50 FROM skat\n      WHERE saknr = @gs_itab-racct AND spras = '3'\n      INTO @DATA(lv_txt).\n    WRITE: / gs_itab-racct, lv_txt, gs_itab-bal.\n    lv_total = lv_total + gs_itab-bal.\n  ENDLOOP.\n  IF lv_total = 0.\n    WRITE / 'CHECK OK'.\n  ELSE.\n    WRITE: / 'CHECK DIFF', lv_total.\n  ENDIF." },

  reuse(4007, { id: 7410, pgm: true, topic: '리포트', from: 6442, lv: 4, title: '고객 미결 채권 연령 (BSID)',
    fields: [['bsid-kunnr', '고객번호'], ['bsid-zfbdt', '만기 계산 기준일'], ['bsid-dmbtr', '미결 금액'], ['kna1-name1', '고객명']] }),
  { id: 7411, pgm: true, topic: '리포트', from: 6443, lv: 4, kind: 'rpt', title: '역분개 제외 계정유형별 합계 (BKPF-STBLG + BSEG-KOART)', tables: ['bkpf', 'bseg'],
    body: '회사코드 p_bukrs, 회계연도 p_gjahr 의 전표를 계정 유형별로 합계 내세요.\n· 역분개된 전표와 역분개 전표는 둘 다 BKPF-STBLG(역분개 전표번호)가 채워져 있습니다. 이런 전표는 빼고, 뺀 전표 수를 셉니다.\n· 남은 전표의 BSEG 품목을 계정 유형 koart 별로 합칩니다. 차변(S)은 +, 대변(H)은 - 입니다.\n· "D 합계"(고객), "K 합계"(공급업체), "S 합계"(G/L) 세 줄을 이 순서로, 마지막에 "EXCLUDED 뺀전표수" 를 출력합니다.\n· 전표가 하나도 없으면 NO DATA.',
    fields: [['bkpf-stblg', '역분개 전표번호'], ['bseg-koart', '계정 유형 (D 고객, K 공급업체, S G/L)'], ['bseg-shkzg', '차변/대변'], ['bseg-dmbtr', '금액']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bkpf-bukrs', label: '회사코드' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE bkpf-gjahr', label: '회계연도' }],
    tests: [['1000', '2026'], ['2000', '2026'], ['1000', '2025']].map(([p_bukrs, p_gjahr]) => ({ p_bukrs, p_gjahr, db: { bkpf: FI_BKPF2, bseg: FI_BSEG2 } }))
      .concat([{ p_bukrs: '1000', p_gjahr: '2026', db: { bkpf: FI_BKPF2.map(r => r[1] === '100005' ? [...r.slice(0, 9), ''] : r), bseg: FI_BSEG2 } }]),
    ref: ({ p_bukrs, p_gjahr, db }) => { const h = db.bkpf.filter(x => x[0] === p_bukrs && x[2] === p_gjahr); if (!h.length) return 'NO DATA'; const keep = h.filter(x => !x[9]).map(x => x[1]); const s = { D: 0, K: 0, S: 0 }; db.bseg.filter(x => x[0] === p_bukrs && x[2] === p_gjahr && keep.includes(x[1])).forEach(x => s[x[7]] += x[5] === 'S' ? x[6] : -x[6]); return `D ${s.D}\nK ${s.K}\nS ${s.S}\nEXCLUDED ${h.length - keep.length}`; },
    sol: "REPORT zfi_koart_sum.\n\nPARAMETERS: p_bukrs TYPE bkpf-bukrs,\n            p_gjahr TYPE bkpf-gjahr.\n\nSTART-OF-SELECTION.\n  SELECT belnr, stblg\n    FROM bkpf\n    WHERE bukrs = @p_bukrs\n      AND gjahr = @p_gjahr\n    INTO TABLE @DATA(gt_head).\n  IF gt_head IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n\n  DATA: lv_d   TYPE i,\n        lv_k   TYPE i,\n        lv_s   TYPE i,\n        lv_exc TYPE i,\n        lv_amt TYPE i.\n  LOOP AT gt_head INTO DATA(gs_head).\n    IF gs_head-stblg IS NOT INITIAL.\n      lv_exc = lv_exc + 1.\n      CONTINUE.\n    ENDIF.\n    SELECT koart, shkzg, dmbtr\n      FROM bseg\n      WHERE bukrs = @p_bukrs\n        AND belnr = @gs_head-belnr\n        AND gjahr = @p_gjahr\n      INTO TABLE @DATA(gt_line).\n    LOOP AT gt_line INTO DATA(gs_line).\n      lv_amt = gs_line-dmbtr.\n      IF gs_line-shkzg = 'H'.\n        lv_amt = - lv_amt.\n      ENDIF.\n      CASE gs_line-koart.\n        WHEN 'D'. lv_d = lv_d + lv_amt.\n        WHEN 'K'. lv_k = lv_k + lv_amt.\n        WHEN 'S'. lv_s = lv_s + lv_amt.\n      ENDCASE.\n    ENDLOOP.\n  ENDLOOP.\n  WRITE: 'D', lv_d.\n  WRITE: / 'K', lv_k.\n  WRITE: / 'S', lv_s.\n  WRITE: / 'EXCLUDED', lv_exc." },

  { id: 7412, pgm: true, topic: '리포트', from: 6444, lv: 4, kind: 'rpt', title: '공급업체 지급 실적 (BSAK + BSIK + LFA1)', tables: ['bsak', 'bsik', 'lfa1'],
    body: '회사코드 p_bukrs 의 공급업체별 지급 실적과 남은 미지급을 한 장으로 보여 주세요.\n· 지급(반제) 완료 항목은 BSAK, 아직 미지급 항목은 BSIK 에 있습니다.\n· 지급액: BSAK 중 반제일 augdt 가 s_augdt 범위인 항목의 금액 합계, 지연: 그중 반제일이 만기일 zfbdt 보다 늦은 건수\n· 미지급: BSIK 의 금액 합계(범위와 상관없이 전부)\n· 두 테이블 어디에든 나오는 업체를 업체번호 순으로 "업체 업체명 PAID 지급액 LATE 지연건수 OPEN 미지급" 출력\n· 마지막 줄 "TOTAL PAID 지급합계 OPEN 미지급합계". 업체가 없으면 NO DATA.',
    fields: [['bsak-augdt', '반제일 (지급일)'], ['bsak-zfbdt', '만기 계산 기준일'], ['bsak-dmbtr', '반제된 금액'], ['bsik-dmbtr', '미결(미지급) 금액'], ['lfa1-name1', '공급업체명']],
    sel: [{ n: 'p_bukrs', kind: 'p', decl: 'TYPE bsak-bukrs', label: '회사코드' }, { n: 's_augdt', kind: 's', decl: 'FOR bsak-augdt', label: '반제일' }],
    tests: [['1000', [['I', 'BT', '20261001', '20261031']]], ['1000', []], ['2000', [['I', 'BT', '20261001', '20261031']]], ['3000', []], ['1000', [['I', 'GE', '20261016', '']]]].map(([p_bukrs, s_augdt]) => ({ p_bukrs, s_augdt, db: { bsak: FI_BSAK, bsik: FI_BSIK, lfa1: FI_LFA1 } })),
    ref: ({ p_bukrs, s_augdt, db }) => { const inR = d => !s_augdt.length || s_augdt.some(r => r[1] === 'BT' ? d >= r[2] && d <= r[3] : r[1] === 'GE' ? d >= r[2] : d === r[2]); const paid = db.bsak.filter(x => x[0] === p_bukrs && inR(x[2])); const open = db.bsik.filter(x => x[0] === p_bukrs);
      const vs = [...new Set([...db.bsak.filter(x => x[0] === p_bukrs).map(x => x[1]), ...open.map(x => x[1])])].sort(); if (!vs.length) return 'NO DATA'; let tp = 0, to = 0;
      const out = vs.map(v => { const p = paid.filter(x => x[1] === v); const ps = p.reduce((s, x) => s + x[7], 0); const os = open.filter(x => x[1] === v).reduce((s, x) => s + x[4], 0); tp += ps; to += os; return `${v} ${db.lfa1.find(l => l[0] === v)[1]} PAID ${ps} LATE ${p.filter(x => x[2] > x[6]).length} OPEN ${os}`; });
      return [...out, `TOTAL PAID ${tp} OPEN ${to}`].join('\n'); },
    sol: "REPORT zfi_vendor_payment.\n\nPARAMETERS p_bukrs TYPE bsak-bukrs.\nSELECT-OPTIONS s_augdt FOR bsak-augdt.\n\nSTART-OF-SELECTION.\n  SELECT bukrs, lifnr FROM bsak WHERE bukrs = @p_bukrs INTO TABLE @DATA(gt_vendor).\n  SELECT bukrs, lifnr FROM bsik WHERE bukrs = @p_bukrs APPENDING TABLE @gt_vendor.\n  IF gt_vendor IS INITIAL.\n    WRITE 'NO DATA'.\n    RETURN.\n  ENDIF.\n  SORT gt_vendor BY lifnr.\n  DELETE ADJACENT DUPLICATES FROM gt_vendor COMPARING lifnr.\n\n  SELECT lifnr, augdt, zfbdt, dmbtr FROM bsak\n    WHERE bukrs = @p_bukrs AND augdt IN @s_augdt\n    INTO TABLE @DATA(gt_paid).\n  SELECT lifnr, dmbtr FROM bsik\n    WHERE bukrs = @p_bukrs\n    INTO TABLE @DATA(gt_open).\n\n  DATA: lv_paid TYPE i, lv_late TYPE i, lv_open TYPE i,\n        lv_tp   TYPE i, lv_to   TYPE i.\n  LOOP AT gt_vendor INTO DATA(gs_vendor).\n    CLEAR: lv_paid, lv_late, lv_open.\n    LOOP AT gt_paid INTO DATA(gs_paid) WHERE lifnr = gs_vendor-lifnr.\n      lv_paid = lv_paid + gs_paid-dmbtr.\n      IF gs_paid-augdt > gs_paid-zfbdt.\n        lv_late = lv_late + 1.\n      ENDIF.\n    ENDLOOP.\n    LOOP AT gt_open INTO DATA(gs_open) WHERE lifnr = gs_vendor-lifnr.\n      lv_open = lv_open + gs_open-dmbtr.\n    ENDLOOP.\n    SELECT SINGLE name1 FROM lfa1 WHERE lifnr = @gs_vendor-lifnr INTO @DATA(lv_name).\n    WRITE: / gs_vendor-lifnr, lv_name, 'PAID', lv_paid, 'LATE', lv_late, 'OPEN', lv_open.\n    lv_tp = lv_tp + lv_paid.\n    lv_to = lv_to + lv_open.\n  ENDLOOP.\n  WRITE: / 'TOTAL PAID', lv_tp, 'OPEN', lv_to." },

  // =================== Lv.5 New Syntax ===================
  reuse(3010, { id: 6451, lv: 5, title: '월별 전표 금액 추세 (GROUP BY 루프)',
    body: '전표 gt_itab(전기일 budat, 금액 netwr)를 전기 월(BKPF-MONAT)별로 묶어, 월 순서대로 "YYYY-MM 건수 합계 추세"를 출력하세요.\n추세: 바로 전 달보다 합계가 크면 UP, 작으면 DOWN, 같으면 SAME, 첫 달은 -\nCOLLECT, SORT 대신 LOOP AT ... GROUP BY, REDUCE, COND 를 쓰세요.',
    fields: [['bkpf-budat', '전기일'], ['bkpf-monat', '회계 기간(월)'], ['bseg-dmbtr', '금액']] }),

  { id: 6452, lv: 5, title: 'SWITCH로 전표 유형 이름', ban: ['CASE', 'IF'],
    body: '전표 유형 코드(BKPF-BLART) 목록 gt_itab 을 이름으로 바꿔 한 줄씩 "코드 이름"으로 출력하세요.\nSA → GL, DR → AR_INVOICE, DZ → AR_PAYMENT, KR → AP_INVOICE, KZ → AP_PAYMENT, 그 밖 → OTHER\nIF, CASE 대신 SWITCH 와 문자열 템플릿을 쓰세요.',
    fields: [['bkpf-blart', '전표 유형 (SA 일반, DR/DZ 고객, KR/KZ 공급업체)']],
    inputs: [{ n: 'gt_itab', t: 'itab_s' }], inDesc: 'gt_itab: 1~50행, 두 글자 코드', outDesc: '코드마다 한 줄씩 출력합니다.',
    tests: [['SA', 'DR', 'KZ'], ['XX'], ['KR', 'DZ', 'AB', 'SA']].map(gt_itab => ({ gt_itab })),
    ref: ({ gt_itab }) => gt_itab.map(c => `${c} ${({ SA: 'GL', DR: 'AR_INVOICE', DZ: 'AR_PAYMENT', KR: 'AP_INVOICE', KZ: 'AP_PAYMENT' })[c] || 'OTHER'}`).join('\n'),
    sol: "LOOP AT gt_itab INTO DATA(lv_blart).\n  DATA(lv_name) = SWITCH string( lv_blart\n    WHEN 'SA' THEN `GL`\n    WHEN 'DR' THEN `AR_INVOICE`\n    WHEN 'DZ' THEN `AR_PAYMENT`\n    WHEN 'KR' THEN `AP_INVOICE`\n    WHEN 'KZ' THEN `AP_PAYMENT`\n    ELSE `OTHER` ).\n  WRITE / |{ lv_blart } { lv_name }|.\nENDLOOP." },

  { id: 6453, lv: 5, kind: 'rpt', title: 'REDUCE로 전표 차대 검증 (ACDOCA)', ban: ['LOOP', 'IF', 'CASE', 'DO', 'WHILE'], tables: ['acdoca'],
    body: 'ACDOCA 에서 대표 원장(rldnr = \'0L\'), 회사코드 1000, 회계연도 2026 의 전표 p_belnr 라인을 읽어 차대를 검증하세요.\n· 차변 합계 = drcrk = \'S\' 인 hsl 의 합, 대변 합계 = drcrk = \'H\' 인 hsl 의 합에 부호를 바꾼 값(양수)\n· "전표번호 LINES 라인수 DEBIT 차변 CREDIT 대변 BALANCED" (같으면) 또는 "... UNBALANCED"\n· 라인이 없으면 "전표번호 NOT FOUND"\nLOOP, IF 대신 REDUCE ... FOR ... WHERE 와 COND 를 쓰세요.',
    fields: [['acdoca-rldnr', '원장'], ['acdoca-belnr', '전표번호'], ['acdoca-drcrk', '차변/대변'], ['acdoca-hsl', '현지통화 금액 (대변 음수)']],
    sel: [{ n: 'p_belnr', kind: 'p', decl: 'TYPE acdoca-belnr', label: '전표번호' }],
    tests: ['100002', '100006', '100009', '100001'].map(p_belnr => ({ p_belnr, db: { acdoca: FI_ACDOCA } })),
    ref: ({ p_belnr, db }) => { const r = db.acdoca.filter(x => x[0] === '0L' && x[1] === '1000' && x[2] === '2026' && x[3] === p_belnr); if (!r.length) return `${p_belnr} NOT FOUND`; const d = r.filter(x => x[10] === 'S').reduce((s, x) => s + x[11], 0); const c = -r.filter(x => x[10] === 'H').reduce((s, x) => s + x[11], 0); return `${p_belnr} LINES ${r.length} DEBIT ${d} CREDIT ${c} ${d === c ? 'BALANCED' : 'UNBALANCED'}`; },
    sol: "REPORT zfi_acdoca_check.\n\nPARAMETERS p_belnr TYPE acdoca-belnr.\n\nSTART-OF-SELECTION.\n  SELECT drcrk, hsl\n    FROM acdoca\n    WHERE rldnr = '0L'\n      AND rbukrs = '1000'\n      AND gjahr = '2026'\n      AND belnr = @p_belnr\n    INTO TABLE @DATA(gt_itab).\n\n  DATA(lv_debit) = REDUCE i( INIT s = 0 FOR r IN gt_itab WHERE ( drcrk = 'S' ) NEXT s = s + r-hsl ).\n  DATA(lv_credit) = REDUCE i( INIT s = 0 FOR r IN gt_itab WHERE ( drcrk = 'H' ) NEXT s = s - r-hsl ).\n  WRITE COND string(\n    WHEN gt_itab IS INITIAL THEN |{ p_belnr } NOT FOUND|\n    WHEN lv_debit = lv_credit THEN |{ p_belnr } LINES { lines( gt_itab ) } DEBIT { lv_debit } CREDIT { lv_credit } BALANCED|\n    ELSE |{ p_belnr } LINES { lines( gt_itab ) } DEBIT { lv_debit } CREDIT { lv_credit } UNBALANCED| )." },

  { id: 6454, lv: 5, title: '테이블 식으로 계정명 조회 (SKAT)', ban: ['READ'],
    body: '계정 내역 gt_itab(계정 saknr, 계정명 txt50)에서 조회할 계정 gt_query 를 하나씩 찾아 "계정 계정명"을 출력하세요. 없으면 "계정 NOT FOUND".\nREAD TABLE 대신 테이블 식 gt_itab[ saknr = ... ] 와 line_exists( ) 를 쓰세요.',
    fields: [['skat-saknr', 'G/L 계정번호'], ['skat-spras', '언어 (3 = 한국어)'], ['skat-txt50', '계정명']],
    structs: { ty_gl: [{ n: 'saknr', t: 'string' }, { n: 'txt50', t: 'string' }] },
    inputs: [{ n: 'gt_itab', t: 'itab', st: 'ty_gl' }, { n: 'gt_query', t: 'itab_s' }], inDesc: 'gt_itab: 1~100행, 계정 중복 없음 / gt_query: 1~50행', outDesc: '조회마다 한 줄씩 출력합니다.',
    tests: [[[['11000000', '외상매출금'], ['40000000', '제품매출'], ['25500000', '부가세예수금']], ['40000000', '99999999', '11000000']], [[['10100000', '보통예금']], ['10100000']], [[['10100000', '보통예금']], ['21000000']]].map(([gt_itab, gt_query]) => ({ gt_itab, gt_query })),
    ref: ({ gt_itab, gt_query }) => gt_query.map(q => { const r = gt_itab.find(x => x[0] === q); return r ? `${q} ${r[1]}` : `${q} NOT FOUND`; }).join('\n'),
    sol: "LOOP AT gt_query INTO DATA(lv_saknr).\n  IF line_exists( gt_itab[ saknr = lv_saknr ] ).\n    WRITE / |{ lv_saknr } { gt_itab[ saknr = lv_saknr ]-txt50 }|.\n  ELSE.\n    WRITE / |{ lv_saknr } NOT FOUND|.\n  ENDIF.\nENDLOOP." }
]);
