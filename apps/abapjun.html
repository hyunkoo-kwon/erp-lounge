        { op: 'read', ent: 'order', keys: [{ aufnr: 'Z3001' }, { aufnr: 'Z3002' }] },
        { op: 'commit' }] } },
      { in: { db: { zco_order: CO_ORDER() }, ops: [
        { op: 'create', ent: 'order', fields: ['aufnr', 'ktext', 'budget', 'status'], rows: [{ '%cid': 'C1', aufnr: 'Z3003', ktext: '긴급 수리', budget: 9000, status: 'REL' }] },
        { op: 'create', ent: 'order', fields: ['aufnr', 'ktext', 'budget'], rows: [{ '%cid': 'C2', aufnr: 'Z3004', ktext: '교육', budget: 5000 }] },
        { op: 'update', ent: 'order', fields: ['budget'], rows: [{ aufnr: 'Z3004', budget: 100 }] },
        { op: 'commit' }] } }],
    sol: CO_LHC_HEAD('    METHODS setinitialstatus FOR DETERMINE ON MODIFY\n      IMPORTING keys FOR order~setinitialstatus.') +
      "  METHOD setinitialstatus.\n    READ ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        FIELDS ( budget status ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_order).\n\n    DELETE lt_order WHERE status IS NOT INITIAL.\n    CHECK lt_order IS NOT INITIAL.\n\n    MODIFY ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        UPDATE FIELDS ( status )\n        WITH VALUE #( FOR ls_order IN lt_order\n                      ( %tky   = ls_order-%tky\n                        status = COND #( WHEN ls_order-budget >= 5000 THEN 'HOLD' ELSE 'CRTD' ) ) ).\n  ENDMETHOD.\nENDCLASS." }),

  coRap({ id: 6544, kind: 'rap', title: '오더 릴리스 액션 (action·result)',
    bo: CO_ORDER_BO({ actions: [{ n: 'release', result: true }] }),
    body: 'BDEF 에 액션이 선언돼 있습니다. 핸들러 lhc_order 에 구현하세요.\n  action release result [1] $self;\n· 상태가 \'CRTD\' 인 오더만 \'REL\' 로 바꿉니다(MODIFY ENTITIES ... IN LOCAL MODE).\n· 이미 \'REL\' 이거나 \'CRTD\' 가 아닌 오더는 바꾸지 말고 failed-order 와 reported-order(\'릴리스할 수 없는 상태입니다\')에 넣습니다.\n· 성공한 오더는 바뀐 뒤의 값을 다시 읽어 result 에 %tky 와 %param(오더 전체)으로 돌려줍니다.\n채점기는 결과 줄 " RESULT 오더 내역 예산 상태"도 출력합니다.',
    fields: [['zco_order-status', '상태 (CRTD → REL 로 릴리스)'], ['zco_order-aufnr', '오더 번호'], ['aufk-auart', '실제 SAP 의 오더 유형 (참고)']],
    outDesc: '시나리오 단계마다 결과 줄이 나오고, 끝에 [ZCO_ORDER] 내용이 붙습니다.',
    tests: [
      { in: { db: { zco_order: CO_ORDER() }, ops: [
        { op: 'action', ent: 'order', action: 'release', rows: [{ aufnr: 'Z1003' }], showResult: true },
        { op: 'action', ent: 'order', action: 'release', rows: [{ aufnr: 'Z1001' }, { aufnr: 'Z9999' }], showResult: true },
        { op: 'commit' }] } },
      { in: { db: { zco_order: CO_ORDER().concat([['Z1004', '창립 기념', 1000, 'HOLD'], ['Z1005', '봉사 활동', 200, 'CRTD']]) }, ops: [
        { op: 'action', ent: 'order', action: 'release', rows: [{ aufnr: 'Z1004' }, { aufnr: 'Z1005' }, { aufnr: 'Z1003' }], showResult: true },
        { op: 'commit' }] } }],
    sol: CO_LHC_HEAD('    METHODS release FOR MODIFY\n      IMPORTING keys FOR ACTION order~release RESULT result.') +
      "  METHOD release.\n    READ ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        FIELDS ( status ) WITH CORRESPONDING #( keys )\n      RESULT DATA(lt_order).\n\n    DATA lt_ok LIKE lt_order.\n    LOOP AT lt_order INTO DATA(ls_order).\n      IF ls_order-status = 'CRTD'.\n        APPEND ls_order TO lt_ok.\n      ELSE.\n        APPEND VALUE #( %tky = ls_order-%tky ) TO failed-order.\n        APPEND VALUE #( %tky = ls_order-%tky\n                        %msg = new_message_with_text(\n                                 severity = if_abap_behv_message=>severity-error\n                                 text     = '릴리스할 수 없는 상태입니다' ) ) TO reported-order.\n      ENDIF.\n    ENDLOOP.\n    CHECK lt_ok IS NOT INITIAL.\n\n    MODIFY ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        UPDATE FIELDS ( status )\n        WITH VALUE #( FOR ls_ok IN lt_ok ( %tky = ls_ok-%tky status = 'REL' ) ).\n\n    READ ENTITIES OF zr_intorder IN LOCAL MODE\n      ENTITY order\n        ALL FIELDS WITH CORRESPONDING #( lt_ok )\n      RESULT DATA(lt_new).\n    result = VALUE #( FOR ls_new IN lt_new ( %tky = ls_new-%tky %param = ls_new ) ).\n  ENDMETHOD.\nENDCLASS." })
].map(p => { p.bdef = CO_BDEF(p.id === 6542 ? '  validation validateBudget on save { create; field Budget; }' : p.id === 6543 ? '  determination setInitialStatus on modify { create; }' : p.id === 6544 ? '  action release result [1] $self;' : '  validation validateBudget on save { create; field Budget; }'); if (p.kind === 'rap') for (const t of p.tests) t.out = CO_OUT[p.id + ':' + p.tests.indexOf(t)] ?? '?'; return p; }));

// =================== 4차: 표준 조회 리포트 (T-code 쿼리) — PGM 7513~7516 ===================
const CO_CSKB = [['1000', '4100000', '1'], ['1000', '4200000', '1'], ['1000', '4300000', '1'], ['1000', '9400000', '42'], ['1000', '9500000', '43']];
const coIn = (v, rs) => { const ok = r => { const o = r[1]; return o === 'BT' ? v >= r[2] && v <= r[3] : o === 'NE' ? v !== r[2] : o === 'GT' ? v > r[2] : o === 'GE' ? v >= r[2] : o === 'LT' ? v < r[2] : o === 'LE' ? v <= r[2] : v === r[2]; }; const inc = (rs || []).filter(r => r[0] === 'I'), exc = (rs || []).filter(r => r[0] === 'E'); return (!inc.length || inc.some(ok)) && !exc.some(ok); };
const coTxt = (db, kostl) => { const r = db.cskt.find(x => x[0] === '1000' && x[1] === kostl && x[2] === '3'); return r ? r[3] : ''; };
addMod('co', [
  { id: 7513, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '원가센터 실적 라인 아이템 (KSB1)',
    body: 'SAP 표준 KSB1(원가센터 실제 라인 아이템 조회)처럼, 원가센터에 쌓인 CO 실적 라인을 한 줄씩 보여 주는 리포트를 만드세요.\n· 선택 화면: 회계연도 p_gjahr, 원가센터 s_kostl, 기간 s_perio, 원가요소 s_kstar\n· COEP 에서 관리회계 영역 1000, 회계연도 p_gjahr 인 실적 라인을 읽습니다.\n· 원가센터 라인만 대상입니다: COEP-OBJNR 을 CSKS-OBJNR 과 조인하고(내부오더 OR… 라인은 자동 제외), CSKS-KOSTL 이 s_kostl 범위에 들어야 합니다.\n· 원가센터 내역은 CSKT(한국어 spras = \'3\'), 원가요소 범주는 CSKB-KATYP 에서 가져옵니다.\n· 원가센터, 기간, 전표번호, 품목 순으로 "원가센터 내역 기간 전표번호 원가요소 범주 금액"을 출력하고, 마지막 줄에 "TOTAL 건수 합계". 없으면 NO DATA.',
    fields: [['coep-objnr', '오브젝트 번호 (KS+원가센터)'], ['coep-perio', '기간'], ['coep-kstar', '원가요소'], ['coep-wkgbtr', '관리회계 통화 금액'], ['csks-objnr', '원가센터 오브젝트 번호'], ['cskb-katyp', '원가요소 범주 (1 = 1차 원가)']],
    tables: ['coep', 'csks', 'cskt', 'cskb'],
    sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coep-gjahr', label: '회계연도' }, { n: 's_kostl', kind: 's', decl: 'FOR csks-kostl', label: '원가센터' }, { n: 's_perio', kind: 's', decl: 'FOR coep-perio', label: '기간' }, { n: 's_kstar', kind: 's', decl: 'FOR coep-kstar', label: '원가요소' }],
    outDesc: '라인마다 "원가센터 내역 기간 전표번호 원가요소 범주 금액", 마지막 줄 "TOTAL 건수 합계". 없으면 NO DATA.',
    tests: [{ p_gjahr: '2026' }, { p_gjahr: '2026', s_kostl: [['I', 'EQ', 'C100']], s_perio: [['I', 'BT', '001', '002']] }, { p_gjahr: '2026', s_kostl: [['I', 'BT', 'C200', 'C300']], s_kstar: [['E', 'EQ', '4100000']] }, { p_gjahr: '2024' }]
      .map(t => ({ ...t, db: { coep: CO_COEP, csks: CO_CSKS, cskt: CO_CSKT, cskb: CO_CSKB } })),
    ref: t => { const db = t.db; const r = [];
      for (const c of db.coep) { if (c[0] !== '1000' || c[3] !== t.p_gjahr || !coIn(c[4], t.s_perio) || !coIn(c[6], t.s_kstar)) continue; const cs = db.csks.find(x => x[5] === c[5]); if (!cs || !coIn(cs[1], t.s_kostl)) continue; const kb = db.cskb.find(x => x[0] === c[0] && x[1] === c[6]); if (!kb) continue; r.push([cs[1], coTxt(db, cs[1]), c[4], c[1], c[2], c[6], kb[2], c[7]]); }
      if (!r.length) return 'NO DATA';
      r.sort((a, b) => (a[0] + a[2] + a[3] + a[4]) < (b[0] + b[2] + b[3] + b[4]) ? -1 : 1);
      return [...r.map(x => [x[0], x[1], x[2], x[3], x[5], x[6], x[7]].join(' ')), `TOTAL ${r.length} ${r.reduce((s, x) => s + x[7], 0)}`].join('\n'); },
    sol: `REPORT zco_ksb1.

PARAMETERS p_gjahr TYPE coep-gjahr.
SELECT-OPTIONS: s_kostl FOR csks-kostl,
                s_perio FOR coep-perio,
                s_kstar FOR coep-kstar.

START-OF-SELECTION.
  SELECT s~kostl, t~ktext, e~perio, e~belnr, e~buzei, e~kstar, b~katyp, e~wkgbtr
    FROM coep AS e
    INNER JOIN csks AS s ON s~objnr = e~objnr
    INNER JOIN cskb AS b ON b~kokrs = e~kokrs AND b~kstar = e~kstar
    LEFT OUTER JOIN cskt AS t ON t~kokrs = s~kokrs AND t~kostl = s~kostl AND t~spras = '3'
    WHERE e~kokrs = '1000'
      AND e~gjahr = @p_gjahr
      AND e~perio IN @s_perio
      AND e~kstar IN @s_kstar
      AND s~kostl IN @s_kostl
    ORDER BY kostl, perio, belnr, buzei
    INTO TABLE @DATA(gt_itab).
  IF gt_itab IS INITIAL.
    WRITE 'NO DATA'.
    RETURN.
  ENDIF.

  DATA lv_sum TYPE i.
  LOOP AT gt_itab INTO DATA(gs_itab).
    WRITE: / gs_itab-kostl, gs_itab-ktext, gs_itab-perio, gs_itab-belnr,
             gs_itab-kstar, gs_itab-katyp, gs_itab-wkgbtr.
    lv_sum = lv_sum + gs_itab-wkgbtr.
  ENDLOOP.
  WRITE: / 'TOTAL', lines( gt_itab ), lv_sum.` },

  { id: 7514, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '원가센터 계획/실적 비교 (S_ALR_87013611)',
    body: 'SAP 표준 S_ALR_87013611(원가센터: 실적/계획/차이)처럼, 원가센터별 계획과 실적을 기간 범위로 비교하는 리포트를 만드세요.\n· 선택 화면: 회계연도 p_gjahr, 시작 기간 p_from, 끝 기간 p_to (1~12), 원가센터 s_kostl\n· COSP 에서 버전 VERSN = \'000\' 만 읽습니다. 값 유형 WRTTP 01 = 계획, 04 = 실적.\n· 금액은 기간 컬럼 WKG001~WKG012 중 p_from ~ p_to 기간만 더합니다(모든 원가요소 합계).\n· 원가센터 라인만: COSP-OBJNR = CSKS-OBJNR 로 조인하고 CSKS-KOSTL 이 s_kostl 에 들어야 합니다. 내역은 CSKT(spras = \'3\').\n· 원가센터 순으로 "원가센터 내역 계획 실적 차이 달성률"을 출력합니다. 차이 = 실적 - 계획, 달성률 = 실적 × 100 / 계획 (정수 반올림), 계획이 0 이면 달성률은 -.\n· 마지막 줄 "TOTAL 계획합계 실적합계 차이합계". 대상이 없으면 NO DATA.',
    fields: [['cosp-wrttp', '값 유형 (01 계획 · 04 실적)'], ['cosp-versn', '버전 (000 = 실적·기본 계획)'], ['cosp-wkg001', '1월 금액 (WKG001~WKG012)'], ['cosp-objnr', '오브젝트 번호'], ['csks-kostl', '원가센터']],
    tables: ['cosp', 'csks', 'cskt'],
    sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE cosp-gjahr', label: '회계연도' }, { n: 'p_from', kind: 'p', decl: 'TYPE i', label: '시작 기간' }, { n: 'p_to', kind: 'p', decl: 'TYPE i', label: '끝 기간' }, { n: 's_kostl', kind: 's', decl: 'FOR csks-kostl', label: '원가센터' }],
    outDesc: '원가센터마다 "원가센터 내역 계획 실적 차이 달성률", 마지막 줄 "TOTAL 계획 실적 차이". 없으면 NO DATA.',
    tests: [{ p_gjahr: '2026', p_from: 1, p_to: 3 }, { p_gjahr: '2026', p_from: 1, p_to: 6, s_kostl: [['I', 'BT', 'C100', 'C200']] }, { p_gjahr: '2026', p_from: 4, p_to: 6, s_kostl: [['E', 'EQ', 'C300']] }, { p_gjahr: '2025', p_from: 1, p_to: 12 }, { p_gjahr: '2026', p_from: 1, p_to: 12, s_kostl: [['I', 'EQ', 'C999']] }]
      .map(t => ({ ...t, db: { cosp: CO_COSP, csks: CO_CSKS, cskt: CO_CSKT } })),
    ref: t => { const db = t.db; const m = {};
      for (const c of db.cosp) { if (c[1] !== t.p_gjahr || c[3] !== '000' || (c[2] !== '01' && c[2] !== '04')) continue; const cs = db.csks.find(x => x[5] === c[0]); if (!cs || !coIn(cs[1], t.s_kostl)) continue; const k = cs[1]; m[k] = m[k] || [0, 0]; m[k][c[2] === '01' ? 0 : 1] += coRowSum(c, t.p_from, t.p_to); }
      const ks = Object.keys(m).sort(); if (!ks.length) return 'NO DATA';
      let P = 0, A = 0; const out = ks.map(k => { const [p, a] = m[k]; P += p; A += a; return [k, coTxt(db, k), p, a, a - p, p ? rh(a * 100 / p) : '-'].filter(x => x !== '').join(' '); });
      return [...out, `TOTAL ${P} ${A} ${A - P}`].join('\n'); },
    sol: `REPORT zco_plan_actual.

PARAMETERS: p_gjahr TYPE cosp-gjahr,
            p_from  TYPE i,
            p_to    TYPE i.
SELECT-OPTIONS s_kostl FOR csks-kostl.

START-OF-SELECTION.
  SELECT s~kostl, p~wrttp, p~wkg001, p~wkg002, p~wkg003, p~wkg004, p~wkg005, p~wkg006,
         p~wkg007, p~wkg008, p~wkg009, p~wkg010, p~wkg011, p~wkg012
    FROM cosp AS p
    INNER JOIN csks AS s ON s~objnr = p~objnr
    WHERE p~gjahr = @p_gjahr
      AND p~versn = '000'
      AND p~wrttp IN ( '01', '04' )
      AND s~kostl IN @s_kostl
    INTO TABLE @DATA(gt_cosp).
  IF gt_cosp IS INITIAL.
    WRITE 'NO DATA'.
    RETURN.
  ENDIF.

  TYPES: BEGIN OF ty_out,
           kostl TYPE string,
           plan  TYPE i,
           act   TYPE i,
         END OF ty_out.
  DATA gt_out TYPE TABLE OF ty_out.

  LOOP AT gt_cosp INTO DATA(gs).
    DATA(lv_amt) = 0.
    DO 12 TIMES.
      IF sy-index >= p_from AND sy-index <= p_to.
        lv_amt = lv_amt + SWITCH i( sy-index
          WHEN 1 THEN gs-wkg001 WHEN 2 THEN gs-wkg002 WHEN 3 THEN gs-wkg003
          WHEN 4 THEN gs-wkg004 WHEN 5 THEN gs-wkg005 WHEN 6 THEN gs-wkg006
          WHEN 7 THEN gs-wkg007 WHEN 8 THEN gs-wkg008 WHEN 9 THEN gs-wkg009
          WHEN 10 THEN gs-wkg010 WHEN 11 THEN gs-wkg011 ELSE gs-wkg012 ).
      ENDIF.
    ENDDO.
    DATA(ls_out) = VALUE ty_out( kostl = gs-kostl ).
    IF gs-wrttp = '01'.
      ls_out-plan = lv_amt.
    ELSE.
      ls_out-act = lv_amt.
    ENDIF.
    COLLECT ls_out INTO gt_out.
  ENDLOOP.
  SORT gt_out BY kostl.

  DATA: lv_p TYPE i, lv_a TYPE i.
  LOOP AT gt_out INTO ls_out.
    SELECT SINGLE ktext FROM cskt
      WHERE kokrs = '1000' AND kostl = @ls_out-kostl AND spras = '3'
      INTO @DATA(lv_ktext).
    IF sy-subrc <> 0.
      CLEAR lv_ktext.
    ENDIF.
    IF ls_out-plan = 0.
      WRITE: / ls_out-kostl, lv_ktext, ls_out-plan, ls_out-act, ls_out-act - ls_out-plan, '-'.
    ELSE.
      DATA(lv_pct) = ls_out-act * 100 / ls_out-plan.
      WRITE: / ls_out-kostl, lv_ktext, ls_out-plan, ls_out-act, ls_out-act - ls_out-plan, lv_pct.
    ENDIF.
    lv_p = lv_p + ls_out-plan.
    lv_a = lv_a + ls_out-act.
  ENDLOOP.
  WRITE: / 'TOTAL', lv_p, lv_a, lv_a - lv_p.` },

  { id: 7515, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '내부오더 실적 라인 아이템 (KOB1)',
    body: 'SAP 표준 KOB1(내부오더 실제 라인 아이템)처럼, 내부오더별 실적 라인과 오더 소계를 보여 주는 리포트를 만드세요.\n· 선택 화면: 회계연도 p_gjahr, 오더유형 s_auart, 내부오더 s_aufnr\n· 내부오더 마스터 AUFK 와 CO 실적 COEP 를 오브젝트 번호로 조인합니다(AUFK-OBJNR = COEP-OBJNR, 값은 \'OR\' + 오더번호).\n· COEP 는 관리회계 영역 1000, 회계연도 p_gjahr 만.\n· 오더, 기간, 전표번호 순으로 "오더 내역 기간 전표번호 원가요소 금액"을 출력하고, 오더가 바뀔 때마다 "SUM 오더 소계" 줄을 넣습니다(AT END OF 를 써 보세요).\n· 마지막 줄 "TOTAL 합계". 없으면 NO DATA.',
    fields: [['aufk-aufnr', '내부오더 번호'], ['aufk-auart', '오더유형'], ['aufk-objnr', '오브젝트 번호 (OR+오더)'], ['coep-wkgbtr', '관리회계 통화 금액'], ['coep-kstar', '원가요소']],
    tables: ['aufk', 'coep'],
    sel: [{ n: 'p_gjahr', kind: 'p', decl: 'TYPE coep-gjahr', label: '회계연도' }, { n: 's_auart', kind: 's', decl: 'FOR aufk-auart', label: '오더유형' }, { n: 's_aufnr', kind: 's', decl: 'FOR aufk-aufnr', label: '내부오더' }],
    outDesc: '라인 "오더 내역 기간 전표번호 원가요소 금액", 오더마다 "SUM 오더 소계", 마지막 "TOTAL 합계". 없으면 NO DATA.',
    tests: [{ p_gjahr: '2026' }, { p_gjahr: '2026', s_aufnr: [['E', 'EQ', 'Z1001']] }, { p_gjahr: '2026', s_auart: [['I', 'EQ', 'ZI01']], s_aufnr: [['I', 'BT', 'Z1001', 'Z1001']] }, { p_gjahr: '2026', s_auart: [['I', 'EQ', 'ZI02']] }, { p_gjahr: '2025' }]
      .map(t => ({ ...t, db: { aufk: CO_AUFK, coep: CO_COEP } })),
    ref: t => { const db = t.db; const r = [];
      for (const a of db.aufk) { if (!coIn(a[1], t.s_auart) || !coIn(a[0], t.s_aufnr)) continue; for (const c of db.coep) if (c[5] === a[3] && c[0] === '1000' && c[3] === t.p_gjahr) r.push([a[0], a[2], c[4], c[1], c[2], c[6], c[7]]); }
      if (!r.length) return 'NO DATA';
      r.sort((x, y) => (x[0] + x[2] + x[3] + x[4]) < (y[0] + y[2] + y[3] + y[4]) ? -1 : 1);
      const out = []; let tot = 0, sub = 0;
      r.forEach((x, i) => { out.push([x[0], x[1], x[2], x[3], x[5], x[6]].join(' ')); sub += x[6]; tot += x[6]; if (i === r.length - 1 || r[i + 1][0] !== x[0]) { out.push(`SUM ${x[0]} ${sub}`); sub = 0; } });
      out.push(`TOTAL ${tot}`); return out.join('\n'); },
    sol: `REPORT zco_kob1.

PARAMETERS p_gjahr TYPE coep-gjahr.
SELECT-OPTIONS: s_auart FOR aufk-auart,
                s_aufnr FOR aufk-aufnr.

START-OF-SELECTION.
  SELECT a~aufnr, a~ktext, e~perio, e~belnr, e~buzei, e~kstar, e~wkgbtr
    FROM aufk AS a
    INNER JOIN coep AS e ON e~objnr = a~objnr
    WHERE a~auart IN @s_auart
      AND a~aufnr IN @s_aufnr
      AND e~kokrs = '1000'
      AND e~gjahr = @p_gjahr
    ORDER BY aufnr, perio, belnr, buzei
    INTO TABLE @DATA(gt_itab).
  IF gt_itab IS INITIAL.
    WRITE 'NO DATA'.
    RETURN.
  ENDIF.

  DATA: lv_sub TYPE i, lv_tot TYPE i.
  LOOP AT gt_itab INTO DATA(gs_itab).
    WRITE: / gs_itab-aufnr, gs_itab-ktext, gs_itab-perio, gs_itab-belnr,
             gs_itab-kstar, gs_itab-wkgbtr.
    lv_sub = lv_sub + gs_itab-wkgbtr.
    lv_tot = lv_tot + gs_itab-wkgbtr.
    AT END OF aufnr.
      WRITE: / 'SUM', gs_itab-aufnr, lv_sub.
      CLEAR lv_sub.
    ENDAT.
  ENDLOOP.
  WRITE: / 'TOTAL', lv_tot.` },

  { id: 7516, pgm: true, topic: '조회 리포트', kind: 'rpt', title: '손익센터 손익 (KE5Z · ACDOCA)',
    body: 'SAP 표준 KE5Z(손익센터 실제 라인 아이템)·손익센터 손익 보고서처럼, 유니버설 저널 ACDOCA 로 손익센터별 매출·비용·이익을 집계하세요.\n· 선택 화면: 원장 p_rldnr, 회계연도 p_gjahr, 기간 s_poper, 손익센터 s_prctr\n· ACDOCA 에서 원장 RLDNR = p_rldnr, 회사코드 RBUKRS = \'1000\', 회계연도 p_gjahr, 손익센터가 비어 있지 않은 라인만 읽습니다.\n· 계정 범위로 구분: RACCT 4000000~4999999 = 매출(대변이라 HSL 이 음수 → 부호를 바꿔 양수로), 5000000~5999999 = 비용(HSL 그대로). 그 밖의 계정은 무시합니다.\n· 이익 = 매출 - 비용. 손익센터 내역은 CEPCT(spras = \'3\').\n· 손익센터 순으로 "손익센터 내역 매출 비용 이익", 마지막 줄 "TOTAL 매출 비용 이익". 없으면 NO DATA.',
    fields: [['acdoca-rldnr', '원장 (0L 선행 원장)'], ['acdoca-prctr', '손익센터'], ['acdoca-racct', 'G/L 계정'], ['acdoca-hsl', '회사코드 통화 금액 (대변 음수)'], ['acdoca-poper', '전기 기간'], ['cepct-ktext', '손익센터 내역']],
    tables: ['acdoca', 'cepct'],
    sel: [{ n: 'p_rldnr', kind: 'p', decl: 'TYPE acdoca-rldnr', label: '원장' }, { n: 'p_gjahr', kind: 'p', decl: 'TYPE acdoca-gjahr', label: '회계연도' }, { n: 's_poper', kind: 's', decl: 'FOR acdoca-poper', label: '기간' }, { n: 's_prctr', kind: 's', decl: 'FOR acdoca-prctr', label: '손익센터' }],
    outDesc: '손익센터마다 "손익센터 내역 매출 비용 이익", 마지막 "TOTAL 매출 비용 이익". 없으면 NO DATA.',
    tests: [{ p_rldnr: '0L', p_gjahr: '2026' }, { p_rldnr: '0L', p_gjahr: '2026', s_poper: [['I', 'BT', '001', '002']] }, { p_rldnr: '2L', p_gjahr: '2026' }, { p_rldnr: '0L', p_gjahr: '2026', s_prctr: [['E', 'EQ', 'P3000']], s_poper: [['I', 'EQ', '003']] }, { p_rldnr: '0L', p_gjahr: '2024' }]
      .map(t => ({ ...t, db: { acdoca: CO_ACDOCA, cepct: CO_CEPCT } })),
    ref: t => { const db = t.db; const m = {};
      for (const a of db.acdoca) { if (a[0] !== t.p_rldnr || a[1] !== '1000' || a[2] !== t.p_gjahr || !a[7] || !coIn(a[13], t.s_poper) || !coIn(a[7], t.s_prctr)) continue; const acc = a[5]; const k = a[7]; if (acc >= '4000000' && acc <= '4999999') { m[k] = m[k] || [0, 0]; m[k][0] -= a[11]; } else if (acc >= '5000000' && acc <= '5999999') { m[k] = m[k] || [0, 0]; m[k][1] += a[11]; } }
      const ks = Object.keys(m).sort(); if (!ks.length) return 'NO DATA';
      let R = 0, C = 0; const txt = k => { const r = db.cepct.find(x => x[0] === k && x[1] === '3'); return r ? r[2] : ''; };
      const out = ks.map(k => { const [r, c] = m[k]; R += r; C += c; return `${k} ${txt(k)} ${r} ${c} ${r - c}`; });
      return [...out, `TOTAL ${R} ${C} ${R - C}`].join('\n'); },
    sol: `REPORT zco_pca_pl.

PARAMETERS: p_rldnr TYPE acdoca-rldnr,
            p_gjahr TYPE acdoca-gjahr.
SELECT-OPTIONS: s_poper FOR acdoca-poper,
                s_prctr FOR acdoca-prctr.

START-OF-SELECTION.
  SELECT prctr, racct, hsl
    FROM acdoca
    WHERE rldnr = @p_rldnr
      AND rbukrs = '1000'
      AND gjahr = @p_gjahr
      AND poper IN @s_poper
      AND prctr IN @s_prctr
      AND prctr <> ''
      AND racct BETWEEN '4000000' AND '5999999'
    INTO TABLE @DATA(gt_acd).

  TYPES: BEGIN OF ty_pl,
           prctr TYPE string,
           rev   TYPE i,
           cost  TYPE i,
         END OF ty_pl.
  DATA gt_pl TYPE TABLE OF ty_pl.
  LOOP AT gt_acd INTO DATA(gs).
    DATA(ls_pl) = VALUE ty_pl( prctr = gs-prctr ).
    IF gs-racct < '5000000'.
      ls_pl-rev = - gs-hsl.
    ELSE.
      ls_pl-cost = gs-hsl.
    ENDIF.
    COLLECT ls_pl INTO gt_pl.
  ENDLOOP.
  IF gt_pl IS INITIAL.
    WRITE 'NO DATA'.
    RETURN.
  ENDIF.
  SORT gt_pl BY prctr.

  DATA: lv_r TYPE i, lv_c TYPE i.
  LOOP AT gt_pl INTO ls_pl.
    SELECT SINGLE ktext FROM cepct
      WHERE prctr = @ls_pl-prctr AND spras = '3'
      INTO @DATA(lv_ktext).
    IF sy-subrc <> 0.
      CLEAR lv_ktext.
    ENDIF.
    WRITE: / ls_pl-prctr, lv_ktext, ls_pl-rev, ls_pl-cost, ls_pl-rev - ls_pl-cost.
    lv_r = lv_r + ls_pl-rev.
    lv_c = lv_c + ls_pl-cost.
  ENDLOOP.
  WRITE: / 'TOTAL', lv_r, lv_c, lv_r - lv_c.` }
]);

function erdSvg(code) {
  const E = ERD[code]; if (!E) return '';
  const relF = {}; for (const [a, b, f] of E.rel) for (const t of [a, b]) (relF[t] = relF[t] || new Set()).add(f);
  const W = 196, CW = 330, PAD = 14;
  const boxes = {};
  const rows = {}; for (const [t, [c, r]] of Object.entries(E.pos)) { if (!DDIC[t]) continue; const d = DDIC[t]; const keys = d.f.slice(0, d.key).map(f => f[0]); const extra = d.f.slice(d.key).map(f => f[0]).filter(f => [...(relF[t] || [])].some(s => s.toLowerCase().includes(f))).slice(0, 3); const lines = [...keys.map(k => ['k', k]), ...extra.map(k => ['f', k])]; const h = 40 + lines.length * 15; boxes[t] = { c, r, h, lines, d }; rows[r] = Math.max(rows[r] || 0, h); }
  const rowY = []; let y = PAD; for (let r = 0; r <= Math.max(...Object.keys(rows).map(Number)); r++) { rowY[r] = y; y += (rows[r] || 60) + 46; }
  const Hh = y - 46 + PAD, Ww = E.cols * CW - (CW - W) + PAD * 2;
  for (const b of Object.values(boxes)) { b.x = PAD + b.c * CW; b.y = rowY[b.r] + ((rows[b.r] - b.h) / 2); }
  const ctr = b => [b.x + W / 2, b.y + b.h / 2];
  const clip = (b, tx, ty) => { const [cx, cy] = ctr(b); const dx = tx - cx, dy = ty - cy; const sx = dx ? (W / 2) / Math.abs(dx) : Infinity, sy = dy ? (b.h / 2) / Math.abs(dy) : Infinity; const s = Math.min(sx, sy); return [cx + dx * s, cy + dy * s]; };

      { const lx = 0.25 * p1[0] + 0.5 * cx + 0.25 * p2[0], ly = 0.25 * p1[1] + 0.5 * cy + 0.25 * p2[1]; if (inside(lx, ly, [])) ok = false; }
      if (ok || !best) { best = { p1, p2, cx, cy }; if (ok) break; }
    }
    const { p1, p2, cx, cy } = best;
    g += `<path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="none" stroke="#94a3b8" stroke-width="1.4" ${f ? '' : 'stroke-dasharray="4 3"'} marker-end="url(#ah)"/>`;
    const lab = [f, card].filter(Boolean).join('  '); if (lab) { const mx = 0.25 * p1[0] + 0.5 * cx + 0.25 * p2[0], my = 0.25 * p1[1] + 0.5 * cy + 0.25 * p2[1]; labels.push([mx, my, lab]); }
  }
  let lg = ''; const placed = []; for (let [mx, my, lab] of labels) { const w = lab.length * 6.2 + 10; for (let t = 0; t < 8 && placed.some(([x, y, ww]) => Math.abs(x - mx) < (w + ww) / 2 && Math.abs(y - my) < 16); t++) my += 17; placed.push([mx, my, w]); lg += `<rect x="${(mx - w / 2).toFixed(1)}" y="${(my - 8).toFixed(1)}" width="${w.toFixed(1)}" height="15" rx="4" fill="#fff" stroke="#e2e8f0"/><text x="${mx.toFixed(1)}" y="${(my + 3.5).toFixed(1)}" font-size="10" text-anchor="middle" fill="#475569">${esc2(lab)}</text>`; }
  for (const [t, b] of Object.entries(boxes)) {
    const z = /^z/.test(t);
    g += `<g><rect x="${b.x}" y="${b.y}" width="${W}" height="${b.h}" rx="8" fill="#fff" stroke="${z ? '#f59e0b' : '#334155'}" stroke-width="1.3"/>`;
    g += `<rect x="${b.x}" y="${b.y}" width="${W}" height="34" rx="8" fill="${z ? '#fef3c7' : '#0f172a'}"/><rect x="${b.x}" y="${b.y + 26}" width="${W}" height="8" fill="${z ? '#fef3c7' : '#0f172a'}"/>`;
    g += `<text x="${b.x + 10}" y="${b.y + 15}" font-size="13" font-weight="700" fill="${z ? '#92400e' : '#fbbf24'}" font-family="Consolas,monospace">${t.toUpperCase()}</text><text x="${b.x + 10}" y="${b.y + 29}" font-size="10" fill="${z ? '#92400e' : '#cbd5e1'}">${esc2(b.d.desc)}</text>`;
    b.lines.forEach(([k, n], i) => { g += `<text x="${b.x + 10}" y="${b.y + 50 + i * 15}" font-size="11" fill="${k === 'k' ? '#0f172a' : '#64748b'}" font-family="Consolas,monospace">${k === 'k' ? '🔑 ' : '↳ '}${n.toUpperCase()}</text>`; });

}

const HL_KW = new Set(('data types type types begin end of like value values constants field-symbols if else elseif endif case when others endcase do enddo times while endwhile loop at endloop endat ' +
  'into from where select single endselect table tables with key index sort by ascending descending stable collect concatenate split replace translate condense separated respecting blanks ' +
  'write new-line skip uline clear refresh free append insert modify delete read lines move to and or not is initial bound null in between exit continue check return stop leave program ' +
  'report parameters select-options selection-screen start-of-selection end-of-selection initialization top-of-page message display obligatory default checkbox radiobutton group ' +
  'class definition implementation endclass public protected private section methods class-methods class-data method endmethod importing exporting changing returning raising exceptions ' +
  'inheriting redefinition final abstract create object call function perform form endform using events class-events event raise set handler me super ref new ' +
  'cond switch conv reduce corresponding mapping except base init next until for then size inner left outer join on order having up rows appending fields entries all distinct as ' +
  'count sum max min avg commit rollback work update entities entity result failed reported mapped local mode execute link response ' +
  'define view root association composition parent cast preserving union standard sorted hashed empty unique occurs length decimals optional preferred ' +
  'adjacent duplicates comparing transporting no binary search first last assigning casting equiv eq ne lt gt le ge co cn ca na cs ns cp np ' +
  'tables_ abap_true abap_false space sy-subrc').split(/\s+/).filter(Boolean));
const HL_SYS = /^sy-\w+$/;
function hlEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hlCode(src) {
  const out = [];
  for (const line of String(src).split('\n')) {
    if (/^\*/.test(line)) { out.push(`<span class="hc">${hlEsc(line)}</span>`); continue; }
    let h = '', i = 0;
    const word = /[A-Za-z_%][\w%]*(?:-[A-Za-z_%][\w%]*)*/y;
    while (i < line.length) {
      const c = line[i];
      if (c === '"' || (c === '/' && line[i + 1] === '/')) { h += `<span class="hc">${hlEsc(line.slice(i))}</span>`; break; }
      if (c === "'" || c === '`') { let j = i + 1; while (j < line.length && !(line[j] === c && line[j + 1] !== c)) { if (line[j] === c) j++; j++; } h += `<span class="hs">${hlEsc(line.slice(i, j + 1))}</span>`; i = j + 1; continue; }
      if (c === '|') {
        let j = i + 1, part = '|';
        let seg = '<span class="hs">';
        while (j < line.length && line[j] !== '|') {
          if (line[j] === '{') { const k = line.indexOf('}', j); const e = k < 0 ? line.length : k; seg += hlEsc(part) + '</span>' + '<span class="hb">{</span>' + hlCode(line.slice(j + 1, e)) + '<span class="hb">}</span><span class="hs">'; part = ''; j = e + 1; continue; }
          if (line[j] === '\\') { part += line[j] + (line[j + 1] || ''); j += 2; continue; }
          part += line[j++];
        }
        h += seg + hlEsc(part + (j < line.length ? '|' : '')) + '</span>'; i = j + 1; continue;
      }
      if (c === '@' && /[A-Za-z]/.test(line[i + 1] || '') && /^\s*$/.test(line.slice(0, i))) { const m = /@[\w.]+/y; m.lastIndex = i; const r = m.exec(line); h += `<span class="ha">${hlEsc(r[0])}</span>`; i += r[0].length; continue; }
      if (/\d/.test(c) && !/[\w]/.test(line[i - 1] || '')) { let j = i; while (j < line.length && /[\d.]/.test(line[j])) j++; h += `<span class="hn">${line.slice(i, j)}</span>`; i = j; continue; }
      if (/[A-Za-z_%]/.test(c)) {
        word.lastIndex = i; const r = word.exec(line); const w = r[0]; const prev = line[i - 1] || '';
        const lw = w.toLowerCase();
        const isKw = prev !== '-' && prev !== '~' && prev !== '>' && (HL_KW.has(lw) || HL_SYS.test(lw) || /^(end|class-|select-|start-|end-|top-|at-)/.test(lw) && HL_KW.has(lw));
        h += isKw ? `<span class="hk">${hlEsc(w)}</span>` : hlEsc(w); i += w.length; continue;
      }
      h += hlEsc(c); i++;
    }
    out.push(h);
  }
  return out.join('\n');
}

    if (e.key === 'Tab') { e.preventDefault(); const a = ta.selectionStart, b = ta.selectionEnd; ta.value = ta.value.slice(0, a) + '  ' + ta.value.slice(b); ta.selectionStart = ta.selectionEnd = a + 2; DB.code[p.id] = ta.value; save(); paint(); }
  });
}

function errLine(r) { return r.L ? ` (${r.L}번째 줄)` : ''; }
function runEx(id) {
  const p = byId(id); const src = $('code').value;
  let prog;
  try { prog = compile(src, p); } catch (e) { if (e instanceof AErr) { $('res').innerHTML = `<div class="verdict CE">컴파일 에러${errLine(e)}</div><pre class="msg">${esc(e.message)}</pre>`; return; } throw e; }
  const bn = banCheck(src, p);
  let h = bn ? `<div class="verdict BAN">사용 금지 구문${errLine(bn)}</div><pre class="msg">${esc(bn.msg)}</pre>` : '';
  p.tests.slice(0, 2).forEach((t, i) => {
    const r = runOne(prog, p, t.in);
    if (r.err) { h += `<div class="exr"><h3>예제 ${i + 1} — <span class="${r.err.kind}">${VNAME[r.err.kind]}</span>${errLine(r.err)}</h3><pre class="msg">${esc(r.err.message)}</pre></div>`; return; }
    const ok = normOut(r.out) === normOut(t.out);
    h += `<div class="exr"><h3>예제 ${i + 1} — ${ok ? '<span class="AC">일치</span>' : '<span class="WA">불일치</span>'}</h3><pre class="io">${esc(r.out) || '<span class="sub">(출력 없음)</span>'}</pre>${ok ? '' : `<p class="sub">기대 출력</p><pre class="io">${esc(t.out)}</pre>`}</div>`;
  });
  $('res').innerHTML = h;
}
function submit(id) {
  const p = byId(id); const src = $('code').value;
  $('res').innerHTML = '<div class="verdict wait">채점 중...</div>';
  setTimeout(() => {
    const r = judge(src, p, p.tests);
    DB.subs.unshift({ id, v: r.v, t: Date.now(), len: src.length }); DB.subs = DB.subs.slice(0, 100);
    DB.tried[id] = true; if (r.v === 'AC') DB.ac[id] = true; save();
    let h = `<div class="verdict ${r.v}">${VNAME[r.v]}${r.v === 'CE' || r.v === 'RE' || r.v === 'BAN' ? errLine(r) : ''}</div>`;
    if (r.v === 'WA') h += `<p class="sub">테스트 ${p.tests.length}개 중 ${r.idx + 1}번째에서 틀렸습니다. 예제 실행으로 출력 형식부터 확인해 보세요.</p>`;
    if (r.v === 'CE' || r.v === 'RE' || r.v === 'TLE' || r.v === 'BAN') h += `<pre class="msg">${esc(r.msg)}</pre>`;
    if (r.v === 'AC') {
      const sp = seqOf(p); const nx = sp[sp.indexOf(p) + 1];
      $('ans').innerHTML = ansBox(p);
      const al = afterLast(p);
      h += nx ? `<a class="btn" href="#p${nx.id}">다음 문제 → ${nx.id} ${nx.title}</a>` : `<a class="btn" href="${al.href}">${MODI[p.mod].name} 모듈 완주! ${al.label}</a>`;
    }
    $('res').innerHTML = h;
  }, 30);
}

function status() {
  let h = nav('status') + `<h1>채점 현황</h1><p class="lead">최근 제출 100건</p>`;
  if (!DB.subs.length) h += `<p class="sub">아직 제출 기록이 없습니다.</p>`;
  else {
    h += `<table class="list"><thead><tr><th>문제</th><th>결과</th><th class="r">시각</th></tr></thead><tbody>`;
    for (const s of DB.subs) {
      const p = byId(s.id); const d = new Date(s.t);
      h += `<tr onclick="location.hash='p${s.id}'"><td><a href="#p${s.id}">${s.id}</a> <span class="sub">${p ? p.title : ''}</span></td><td><span class="${s.v}">${VNAME[s.v]}</span></td><td class="r sub">${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</td></tr>`;
    }
    h += `</tbody></table><button class="btn ghost" id="rst" onclick="resetAll()">모든 기록 초기화</button>`;
  }
  $('app').innerHTML = h;
}
let armed = false;
function resetAll() { if (!armed) { armed = true; $('rst').textContent = '한 번 더 누르면 초기화됩니다'; return; } armed = false; DB = { code: {}, ac: {}, tried: {}, subs: [], peek: {} }; save(); status(); }

function rules() {
  $('app').innerHTML = nav('rules') + `<h1>채점 규칙</h1>

<tr><td class="num"><span class="lv" style="background:#0f172a;color:#fbbf24">PGM</span></td><td><b>모듈별 프로그램 개발</b><div class="sub">선택 화면·클래스·ALV 이벤트·CRUD·업무 리포트 — 실전 프로그램</div></td><td class="r sub">${ALLP.filter(p => p.pgm).length}문제</td></tr></tbody></table></section>
  <section class="sec"><h2>모듈 구성</h2><p class="body">모듈마다 Lv.1~5 를 4문제씩 풉니다. 문제에 나오는 표준 테이블 필드는 문제 아래 📘 상자에 소개돼 있어요.</p><table class="list"><tbody>${MODULES.map(m => `<tr><td class="num">${modChip(m.code)}</td><td><b>${m.full}</b><div class="sub">${m.tables.map(t => t.toUpperCase()).join(' · ')}</div></td><td class="r sub">${modList(m.code).length + pgmList(m.code).length}문제</td></tr>`).join('')}</tbody></table></section>

  <li>숫자는 앞뒤 공백 없이 출력합니다. 음수는 <code>-5</code>로 표시합니다. 실제 SAP 리스트는 <code>5-</code>처럼 부호가 뒤에 붙고 자리 맞춤 공백이 들어갑니다.</li>
  <li>날짜(TYPE d)는 YYYYMMDD 그대로 출력합니다.</li>
  <li>MESSAGE 는 화면 아래 메시지 대신 출력 한 줄로 처리합니다. TYPE 'E' 면 그 자리에서 프로그램이 끝납니다.</li>
  <li>ALV 는 화면 대신 <code>[ALV] 제목</code> / 머리글 / 행을 <code> | </code> 로 이은 텍스트로 출력합니다. 합계(do_sum) 줄은 <code>합계 | | 값</code> 입니다. 머리글은 필드 카탈로그의 텍스트, 없으면 필드명 대문자입니다.</li>
  <li>CL_GUI_ALV_GRID 는 CALL SCREEN 없이 set_table_for_first_display 순간 표시됩니다. 더블클릭·핫스팟·버튼 명령 이벤트는 채점기가 프로그램 실행 뒤 차례로 일으킵니다.</li>
  <li>DB 를 바꾸는 문제는 프로그램이 끝난 뒤 테이블 내용을 <code>[ZEMP]</code> 처럼 출력 뒤에 붙여 비교합니다. ROLLBACK WORK 를 하면 마지막 COMMIT 시점으로 돌아갑니다.</li>
  <li>각 줄 끝의 공백과 맨 앞·뒤의 빈 줄은 무시하고 비교합니다.</li></ul></section>

function route() {
  const h = location.hash.replace('#', '');
  let m;
  if ((m = h.match(/^p(\d+)$/))) problem(+m[1]);
  else if ((m = h.match(/^m-([a-z]+)(?:-([1-5]|pgm))?$/))) modPage(m[1], m[2] ? (m[2] === 'pgm' ? 'pgm' : +m[2]) : 0);
  else if ((m = h.match(/^lv([1-5])$/))) level(+m[1]);
  else if (h === 'status') status();
  else if (h === 'rules') rules();
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window.self) {
  try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {}
}
route();
