</head><body>
<title>SAP ABAP Programming — 기초 · New Syntax · CDS · RAP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃 : SAP Quartz 쉘 바 + 왼쪽 Easy Access 트리 + 오른쪽 레슨 ( F1 창 · 편집기 창 ) */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface2: #FAFBFD; --fg: #32363A; --muted: #6A6D70; --line: #D9D9D9; --line2: #E5E5E5;
  --shell: #4E6A87; --shell-fg: #FFFFFF; --brand: #0A6ED1; --brand-soft: #EBF5FE; --brand-line: #91C8F6; --sel: #E5F0FA;
  --hdr: #EEF1F4; --stat: #F2F2F2; --code-bg: #FFFFFF; --code-ln: #9AA5B8;
  --kw: #0000FF; --str: #3C8C14; --cm: #808080; --num: #2E7BCF; --sym: #800080;
  --f-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", "D2Coding", Consolas, "Courier New", monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--shell); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* 쉘 바 */
.shell { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--shell); color: var(--shell-fg);
  display: flex; align-items: center; gap: 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell .menu { display: none; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; text-decoration: none; color: inherit; }
.brand b { font-size: 16px; letter-spacing: .02em; }
.brand span { font-size: 12px; opacity: .75; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; min-width: 0; }
.search input { width: 100%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; border-radius: 4px; padding: 7px 12px 7px 40px; font: inherit; font-size: 14px; }
.search input::placeholder { color: rgba(255,255,255,.7); }
.search .key { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 600 11px var(--f-code); background: rgba(255,255,255,.2); border-radius: 3px; padding: 1px 5px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-height: 60vh; overflow: auto; }
.results a { display: block; padding: 8px 12px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line2); }
.results a:hover, .results a.on { background: var(--sel); }
.results small { display: block; color: var(--muted); font-family: var(--f-code); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 본문 2 단 */
.wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100% - 48px); }
nav.tree { background: var(--surface); border-right: 1px solid var(--line); padding-block: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 48px); height: calc(100vh - 48px - env(safe-area-inset-top, 0px)); overflow: auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 8px; }
.tree h4 { margin: 14px 8px 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; font-weight: 700; }
.tree a { display: block; padding: 5px 10px 5px 26px; border-radius: 4px; text-decoration: none; color: var(--fg); font-size: 13.5px; position: relative; }
.tree a::before { content: "•"; position: absolute; left: 12px; color: var(--muted); }
.tree a:hover { background: var(--surface2); }
.tree a.on { background: var(--sel); color: var(--brand); font-weight: 700; }
.tree a.top { padding-left: 10px; font-weight: 700; }
.tree a.top::before { content: none; }
main { min-width: 0; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.crumb { font-size: 12.5px; color: var(--muted); }
h1 { font-size: 26px; line-height: 1.3; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.chip { display: inline-block; font: 600 11.5px var(--f-code); color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 10px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 15.5px; margin: 0; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* SAP 창 공통 */
.win { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
.win > .tb { background: var(--shell); color: #fff; font-size: 12.5px; font-weight: 700; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
.win > .tb .ctl { margin-left: auto; letter-spacing: 8px; opacity: .8; font-weight: 400; }
.win > .tool { background: var(--surface2); border-bottom: 1px solid var(--line2); padding: 4px 8px; display: flex; gap: 4px; }
.win > .tool i { width: 20px; height: 18px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); font: normal 10px/16px var(--f-code); color: var(--brand); text-align: center; }
.win > .st { background: var(--stat); border-top: 1px solid var(--line2); font-size: 11px; color: var(--muted); padding: 3px 10px; }

/* 코드 */
pre.code { margin: 0; background: var(--code-bg); font: 13px/1.6 var(--f-code); overflow-x: auto; padding: 8px 0; counter-reset: ln; flex: 1; }
pre.code .l { display: block; padding: 0 12px 0 48px; position: relative; min-height: 1.6em; white-space: pre; }
pre.code .l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 34px; text-align: right; color: var(--code-ln); }
pre.code .l.hi { background: color-mix(in srgb, #FFD84D 35%, transparent); }
.a { color: #A0522D; } .k { color: var(--kw); } .s { color: var(--str); } .c { color: var(--cm); font-style: italic; } .n { color: var(--num); } .p { color: var(--sym); }

/* F1 창 */
.f1 .body { display: grid; grid-template-columns: 230px minmax(0, 1fr); }
.f1 .side { background: var(--surface2); border-right: 1px solid var(--line2); padding: 10px 8px; font-size: 12.5px; }
.f1 .side div { padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f1 .side div.on { background: var(--sel); color: var(--brand); font-weight: 700; border-radius: 3px; }
.f1 .doc { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.f1 .doc .nm { font-size: 19px; font-weight: 700; color: var(--brand); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.f1 .doc .lb { font-weight: 700; color: var(--brand); font-size: 13.5px; margin-top: 4px; }
.f1 .doc .syn { background: var(--hdr); border: 1px solid var(--line); border-radius: 3px; }
.f1 .doc .syn pre.code, .f1 .doc .exm pre.code { background: transparent; }
.f1 .doc .syn pre.code .l { padding-left: 12px; } .f1 .doc .syn pre.code .l::before { content: none; }
.f1 .doc .exm { border: 1px solid var(--line); border-radius: 3px; background: var(--code-bg); }
.f1 .doc p { margin: 0; }

/* 비교 */
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: stretch; gap: 0; }
.cmp .arw { display: flex; align-items: center; justify-content: center; color: var(--brand); font-size: 18px; }
.cmp .old .tb { background: #6A7C8F; }
.info { background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 4px; padding: 12px 16px 12px 48px; position: relative; }
.info::before { content: "i"; position: absolute; left: 14px; top: 13px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font: 700 13px/22px var(--f-code); text-align: center; }
.info p { margin: 0 0 4px; max-width: 75ch; } .info p:last-child { margin: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }

/* ALV 표 */
table.alv { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.alv th { background: var(--hdr); font-weight: 700; text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line2); }
table.alv td { padding: 5px 10px; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); }
table.alv tr:nth-child(even) td { background: var(--surface2); }
table.alv tr.on td { background: var(--sel); }
table.alv td.mono { font-family: var(--f-code); }
.scroll { overflow-x: auto; }

/* 디버거 */
.dbg .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:hover { border-color: var(--brand); }

/* 홈 · 사전 */
.hero { display: flex; flex-direction: column; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px; }
.card:hover { border-color: var(--brand); }
.card b { font-size: 14px; } .card small { color: var(--muted); font-size: 12.5px; }
.grp { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 -4px; letter-spacing: .03em; }
.dict input { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; background: var(--surface); color: var(--fg); font: inherit; }
table.alv tr.link { cursor: pointer; } table.alv tr.link:hover td { background: var(--sel); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.pager a { text-decoration: none; color: var(--brand); font-weight: 500; max-width: 48%; }
.tree .crs { margin: 18px 4px 2px; padding: 8px 6px 2px; border-top: 2px solid var(--shell); font-size: 13px; font-weight: 700; color: var(--shell); letter-spacing: .02em; }
.tree .crs:first-of-type { margin-top: 12px; }
.grid.courses { grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); }
.courses .card { border-top: 3px solid var(--brand); }
.card .cnt { font-size: 12.5px; color: var(--brand); font-weight: 500; margin-top: 2px; }
.card .kind { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
h2.crs-h { margin: 14px 0 -6px; padding-top: 14px; border-top: 1px solid var(--line); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.tree { position: fixed; z-index: 25; left: 0; top: calc(env(safe-area-inset-top, 0px) + 48px); width: min(300px, 85vw); box-shadow: 4px 0 20px rgba(0,0,0,.2); transform: translateX(-105%); transition: transform .2s; }
  nav.tree.open { transform: none; }
  .shell .menu { display: inline-block; }
  .brand span { display: none; }
  .f1 .body { grid-template-columns: minmax(0, 1fr); } .f1 .side { display: none; }
  .cmp { grid-template-columns: minmax(0, 1fr); } .cmp .arw { transform: rotate(90deg); height: 26px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { nav.tree { transition: none; } }
</style>

<header class="shell">
  <button class="menu" id="menu" aria-label="목차 열기">☰</button>
  <a class="brand" href="#home"><b>SAP ABAP Programming</b><span>기초 · New Syntax · CDS View · RAP</span></a>
  <div class="search">
    <span class="key">F1</span>
    <input id="q" type="search" autocomplete="off" placeholder="문법 검색 : REDUCE, VALUE, ASSOCIATION, EML …" aria-label="문법 검색">
    <div class="results" id="res" hidden></div>
  </div>
</header>
<div class="wrap">
  <nav class="tree" id="tree" aria-label="레슨 목차"></nav>
  <main><div class="page" id="view"></div></main>
</div>

<script id="data" type="application/json">{"lessons": [{"id": "b01", "part": "기초 1 · 데이터", "title": "데이터 선언 : DATA · TYPES · CONSTANTS", "sub": "변수 · 타입 · 상수 만들기", "f1": {"name": "DATA · TYPES · CONSTANTS - 선언", "tree": ["Declarations", "Data Objects", "DATA"], "syntax": "DATA var TYPE type [VALUE val].\nTYPES ty  TYPE type.\nCONSTANTS c TYPE type VALUE val.", "effect": "변수, 타입, 상수를 선언한다.", "note": "CONSTANTS 는 값을 바꿀 수 없다. VALUE 를 빼면 변수는 초기값으로 시작한다.", "example": "DATA lv_carrid TYPE s_carr_id VALUE 'LH'."}, "code": [["기본 형태", "DATA lv_carrid TYPE s_carr_id VALUE 'LH'.\nDATA lv_cnt    TYPE i.\nDATA lv_price  TYPE p LENGTH 15 DECIMALS 2.\nDATA lv_date   TYPE d.\nCONSTANTS gc_max TYPE i VALUE 100."]], "table": {"title": "ABAP 기본 타입", "cols": ["타입", "뜻", "예"], "rows": [["c", "문자 ( 고정 길이 )", "'LH'"], ["n", "숫자로만 된 문자", "'0400'"], ["i", "정수", "100"], ["p", "소수 ( 포장 숫자 )", "3666.00"], ["d", "날짜 YYYYMMDD", "20261120"], ["t", "시간 HHMMSS", "093000"], ["string", "길이가 변하는 문자열", "`ABAP`"]]}, "pairs": [["DATA lv_cnt TYPE i.\nlv_cnt = lines( gt_scarr ).", "DATA(lv_cnt) = lines( gt_scarr )."]], "para": "DATA 는 변수, TYPES 는 타입, CONSTANTS 는 바꿀 수 없는 상수를 만든다.\nTYPE 뒤에는 ABAP 기본 타입( c, n, i, p, d, t, string )이나 DDIC 타입( s_carr_id, scarr-carrid )을 쓴다. DDIC 타입을 쓰면 길이와 화면 이름이 함께 따라온다.\n새 문법에서는 값을 받는 자리에서 DATA( ) 로 바로 선언할 수 있다."}, {"id": "b02", "part": "기초 1 · 데이터", "title": "구조 : TYPES BEGIN OF", "sub": "여러 필드를 한 줄로 묶기", "f1": {"name": "TYPES BEGIN OF - 구조 타입", "tree": ["Declarations", "Types", "TYPES BEGIN OF"], "syntax": "TYPES : BEGIN OF ty_name,\n          comp1 TYPE type1,\n          comp2 TYPE type2,\n        END OF ty_name.", "effect": "여러 필드를 묶은 구조 타입을 만든다. 필드는 구조-필드 로 쓴다.", "note": "INCLUDE TYPE 으로 다른 구조의 필드를 통째로 넣을 수 있다.", "example": "DATA ls_flight TYPE ty_flight.\nls_flight-carrid = 'LH'."}, "code": [["기본 형태", "TYPES : BEGIN OF ty_flight,\n          carrid TYPE s_carr_id,\n          connid TYPE s_conn_id,\n          price  TYPE s_price,\n        END OF ty_flight.\n\nDATA ls_flight TYPE ty_flight."]], "pairs": [["ls_flight-carrid = 'LH'.\nls_flight-connid = '0400'.\nls_flight-price  = '666.00'.", "ls_flight = VALUE #( carrid = 'LH'\n                     connid = '0400'\n                     price  = '666.00' )."]], "para": "구조는 여러 필드를 한 줄로 묶은 것이다. 인터널 테이블의 한 줄 모양으로 가장 많이 쓴다.\n필드는 ls_flight-carrid 처럼 구조 이름과 필드 이름을 - 로 잇는다.\n새 문법의 VALUE #( ) 를 쓰면 여러 필드를 한 번에 채운다."}, {"id": "b03", "part": "기초 1 · 데이터", "title": "인터널 테이블 : 종류와 선언", "sub": "STANDARD · SORTED · HASHED", "f1": {"name": "TABLE OF - 인터널 테이블", "tree": ["Declarations", "Internal Tables", "TABLE OF"], "syntax": "DATA itab TYPE {STANDARD|SORTED|HASHED} TABLE OF ty\n     {WITH [NON-]UNIQUE KEY comp1 ... | WITH EMPTY KEY}.", "effect": "같은 모양의 줄을 여러 개 담는 메모리 속 표를 만든다.", "note": "HASHED 는 UNIQUE KEY 만 쓸 수 있다. 헤더 라인( WITH HEADER LINE )은 예전 방식이라 쓰지 않는다.", "example": "DATA gt_scarr TYPE STANDARD TABLE OF scarr WITH EMPTY KEY."}, "code": [["세 종류", "DATA gt_scarr  TYPE STANDARD TABLE OF scarr WITH EMPTY KEY.\nDATA gt_sorted TYPE SORTED TABLE OF sflight\n                WITH NON-UNIQUE KEY carrid connid.\nDATA gt_hash   TYPE HASHED TABLE OF scarr\n                WITH UNIQUE KEY carrid."]], "table": {"title": "종류별 차이", "cols": ["종류", "찾는 방법", "언제"], "rows": [["STANDARD", "번호 · 처음부터 차례로", "일반 목록"], ["SORTED", "키 순서로 정렬 · 빠른 탐색", "키 순서 · 범위 조회"], ["HASHED", "키로 바로 찾기", "키로 한 줄 찾기가 많을 때"]]}, "pairs": [["DATA gt_scarr TYPE TABLE OF scarr WITH HEADER LINE.", "DATA gt_scarr TYPE TABLE OF scarr.\nDATA gs_scarr TYPE scarr."]], "para": "인터널 테이블은 프로그램이 실행되는 동안만 있는 메모리 속 표다. DB 에서 읽은 데이터를 담아 가공할 때 쓴다.\nSTANDARD 는 넣은 순서대로, SORTED 는 키 순서로 정렬되어 저장되고, HASHED 는 키로 한 줄을 바로 찾는다.\n예전의 헤더 라인 대신 표와 작업 영역( 구조 )을 따로 선언한다."}, {"id": "b04", "part": "기초 1 · 데이터", "title": "줄 다루기 : APPEND · INSERT · MODIFY · DELETE", "sub": "인터널 테이블에 넣고 바꾸고 지우기", "f1": {"name": "APPEND · INSERT · MODIFY · DELETE itab", "tree": ["Internal Tables", "Processing Statements", "APPEND, INSERT, MODIFY, DELETE"], "syntax": "APPEND wa TO itab.\nINSERT wa INTO [TABLE] itab [INDEX idx].\nMODIFY itab FROM wa [INDEX idx] [TRANSPORTING comp].\nDELETE itab [INDEX idx | WHERE cond].", "effect": "인터널 테이블에 줄을 더하고, 바꾸고, 지운다.", "note": "SORTED · HASHED 표에는 APPEND 대신 INSERT … INTO TABLE 을 쓴다.", "example": "DELETE gt_sflight WHERE carrid = 'LH'."}, "pairs": [["ls_r-sign = 'I'. ls_r-option = 'EQ'. ls_r-low = 'LH'.\nAPPEND ls_r TO lr_carrid.", "APPEND VALUE #( sign = 'I' option = 'EQ' low = 'LH' )\n       TO lr_carrid."], ["LOOP AT gt_sflight INTO ls.\n  IF ls-carrid = 'LH'.\n    DELETE gt_sflight INDEX sy-tabix.\n  ENDIF.\nENDLOOP.", "DELETE gt_sflight WHERE carrid = 'LH'."]], "para": "APPEND 는 맨 뒤에, INSERT 는 원하는 위치( INDEX )나 키 순서 자리에 줄을 넣는다.\nMODIFY 는 작업 영역의 값으로 줄을 바꾸고, TRANSPORTING 으로 바꿀 필드만 고를 수 있다.\nDELETE … WHERE 는 조건에 맞는 줄을 한 번에 지운다. LOOP 를 돌며 하나씩 지울 필요가 없다.", "code": []}, {"id": "b05", "part": "기초 1 · 데이터", "title": "읽기 : READ TABLE · LOOP AT", "sub": "한 줄 읽기 , 차례로 읽기", "f1": {"name": "READ TABLE · LOOP AT itab", "tree": ["Internal Tables", "Processing Statements", "READ TABLE, LOOP AT"], "syntax": "READ TABLE itab INTO wa {INDEX idx | WITH KEY c1 = v1 ...}.\nLOOP AT itab INTO wa [WHERE cond].\n  ...\nENDLOOP.", "effect": "READ TABLE 은 한 줄을, LOOP AT 은 여러 줄을 차례로 읽는다.", "note": "READ 뒤에는 sy-subrc( 0 = 찾음 )를 확인한다. LOOP 안의 sy-tabix 는 지금 줄 번호다.", "example": "LOOP AT gt_scarr INTO DATA(ls_scarr).\nENDLOOP."}, "pairs": [["READ TABLE gt_scarr INTO gs_scarr\n     WITH KEY carrid = 'LH'.\nIF sy-subrc = 0.\n  lv_name = gs_scarr-carrname.\nENDIF.", "lv_name = VALUE #( gt_scarr[ carrid = 'LH' ]-carrname OPTIONAL )."], ["DATA ls_scarr TYPE scarr.\nLOOP AT gt_scarr INTO ls_scarr.\n  WRITE / ls_scarr-carrid.\nENDLOOP.", "LOOP AT gt_scarr INTO DATA(ls_scarr).\n  WRITE / ls_scarr-carrid.\nENDLOOP."]], "para": "READ TABLE 은 번호( INDEX )나 키( WITH KEY )로 한 줄을 찾아 작업 영역에 복사한다. 찾았는지는 sy-subrc 로 확인한다.\nLOOP AT 은 줄을 처음부터 하나씩 꺼낸다. WHERE 로 필요한 줄만 돌 수 있다.\n새 문법에서는 itab[ ] 와 INTO DATA( ) 로 더 짧게 쓴다.", "code": []}, {"id": "b06", "part": "기초 2 · 제어 · 문자열", "title": "조건문 : IF · CASE · CHECK", "sub": "조건에 따라 실행할 문장 고르기", "f1": {"name": "IF · CASE · CHECK - 조건", "tree": ["Program Flow Logic", "Control Structures", "IF, CASE"], "syntax": "IF cond1.\n  ...\nELSEIF cond2.\n  ...\nELSE.\n  ...\nENDIF.\n\nCASE operand.\n  WHEN v1 [OR v2].\n  WHEN OTHERS.\nENDCASE.", "effect": "조건에 따라 실행할 문장을 고른다.", "note": "비교 : = <> < > <= >= , IS INITIAL , BETWEEN , IN 레인지. CHECK 는 조건이 거짓이면 지금 블록을 빠져나간다.", "example": "IF ls-price > 3000.\n  lv_grade = 'A'.\nENDIF."}, "code": [["조건식 모음", "IF lv_carrid IS INITIAL.\nENDIF.\nIF ls-price BETWEEN 1000 AND 2000.\nENDIF.\nIF ls-carrid IN s_carrid AND ls-seatsocc < ls-seatsmax.\nENDIF.\nCHECK sy-subrc = 0."]], "pairs": [["IF ls-price > 3000.\n  lv_grade = 'A'.\nELSE.\n  lv_grade = 'B'.\nENDIF.", "lv_grade = COND #( WHEN ls-price > 3000 THEN 'A'\n                   ELSE 'B' )."], ["CASE lv_flag.\n  WHEN 'I'. lv_text = '추가'.\n  WHEN OTHERS. lv_text = '-'.\nENDCASE.", "lv_text = SWITCH #( lv_flag WHEN 'I' THEN '추가'\n                            ELSE '-' )."]], "para": "IF 는 조건식을 위에서부터 보고 처음 참인 블록을 실행한다. CASE 는 값 하나를 WHEN 의 값들과 비교한다.\n조건식에는 비교 연산자, IS INITIAL, BETWEEN, IN( 레인지 · 선택 조건 ), AND · OR · NOT 을 쓴다.\n값을 하나 고르는 일이면 새 문법 COND · SWITCH 로 식 하나로 쓸 수 있다."}, {"id": "b07", "part": "기초 2 · 제어 · 문자열", "title": "반복문 : DO · WHILE · EXIT · CONTINUE", "sub": "같은 일을 여러 번", "f1": {"name": "DO · WHILE - 반복", "tree": ["Program Flow Logic", "Control Structures", "DO, WHILE"], "syntax": "DO [n TIMES].\n  ...\nENDDO.\n\nWHILE cond.\n  ...\nENDWHILE.", "effect": "문장을 반복한다. sy-index 는 지금 반복 회차다.", "note": "EXIT 는 반복을 끝내고, CONTINUE 는 다음 회차로 넘어간다. 횟수 없는 DO 에는 EXIT 가 꼭 있어야 한다.", "example": "DO 3 TIMES.\n  WRITE / sy-index.\nENDDO."}, "code": [["EXIT · CONTINUE", "DO 10 TIMES.\n  IF sy-index MOD 2 = 0.\n    CONTINUE.          \" 짝수는 건너뜀\n  ENDIF.\n  IF sy-index > 7.\n    EXIT.              \" 반복 끝\n  ENDIF.\n  lv_sum = lv_sum + sy-index.\nENDDO."]], "pairs": [["DO 10 TIMES.\n  lv_sum = lv_sum + sy-index.\nENDDO.", "lv_sum = REDUCE i( INIT s = 0\n                   FOR i = 1 UNTIL i > 10\n                   NEXT s = s + i )."]], "para": "DO n TIMES 는 정해진 횟수만큼, WHILE 은 조건이 참인 동안 반복한다. 회차는 sy-index 에 들어 있다.\nEXIT 는 반복을 바로 끝내고, CONTINUE 는 남은 문장을 건너뛰고 다음 회차로 간다.\n값 하나를 만드는 반복은 새 문법 REDUCE … FOR i = … UNTIL 로 쓸 수 있다."}, {"id": "b08", "part": "기초 2 · 제어 · 문자열", "title": "문자열 : CONCATENATE · SPLIT · CONDENSE · REPLACE", "sub": "문자열 잇기 · 자르기 · 다듬기", "f1": {"name": "문자열 처리 문장", "tree": ["Processing Internal Data", "Character String Processing", "Statements"], "syntax": "CONCATENATE a b INTO c [SEPARATED BY sep].\nSPLIT text AT sep INTO a b | INTO TABLE itab.\nCONDENSE text [NO-GAPS].\nREPLACE [ALL OCCURRENCES OF] sub IN text WITH new.\n... text+off(len) ...", "effect": "문자열을 잇고, 자르고, 공백을 정리하고, 바꾼다.", "note": "text+off(len) 은 off 번째( 0 부터 )에서 len 글자를 뜻한다.", "example": "SPLIT '2026-11-20' AT '-' INTO lv_y lv_m lv_d."}, "code": [["자주 쓰는 문장", "SPLIT 'AA,LH,UA' AT ',' INTO TABLE lt_carr.\nCONDENSE lv_txt NO-GAPS.\nREPLACE ALL OCCURRENCES OF '-' IN lv_date WITH ''.\nlv_year = lv_date+0(4)."]], "pairs": [["CONCATENATE ls-carrid ls-connid INTO lv_msg\n  SEPARATED BY space.", "lv_msg = |{ ls-carrid } { ls-connid }|."], ["CONDENSE lv_txt.\nTRANSLATE lv_txt TO UPPER CASE.", "lv_txt = to_upper( condense( lv_txt ) )."]], "para": "CONCATENATE 는 잇기, SPLIT 은 구분자로 자르기, CONDENSE 는 공백 정리, REPLACE 는 바꾸기다.\nlv_date+0(4) 처럼 위치와 길이로 일부를 잘라 쓸 수 있다.\n새 문법에서는 문자열 템플릿 | { } | 과 문자열 함수로 식 하나로 쓴다."}, {"id": "b09", "part": "기초 3 · DB · 모듈 · 출력", "title": "Open SQL 조회 : SELECT", "sub": "DB 테이블에서 읽기", "f1": {"name": "SELECT - 조회", "tree": ["ABAP SQL", "Reads", "SELECT"], "syntax": "SELECT SINGLE f1 f2 FROM dbtab INTO (v1, v2) WHERE cond.\nSELECT f1 f2 FROM dbtab INTO TABLE itab WHERE cond.\nSELECT ... FOR ALL ENTRIES IN itab WHERE f = itab-f.", "effect": "DB 테이블에서 한 줄( SINGLE ) 또는 여러 줄을 읽는다.", "note": "sy-subrc = 0 이면 찾음, sy-dbcnt 는 읽은 줄 수다. FOR ALL ENTRIES 는 기준 표가 비어 있으면 전체를 읽으니 먼저 확인한다.", "example": "SELECT SINGLE carrname FROM scarr INTO lv_name\n  WHERE carrid = 'LH'."}, "pairs": [["SELECT SINGLE carrname FROM scarr INTO lv_name\n  WHERE carrid = lv_carrid.", "SELECT SINGLE FROM scarr\n  FIELDS carrname\n  WHERE carrid = @lv_carrid\n  INTO @DATA(lv_name)."], ["SELECT a~carrid a~connid b~carrname\n  FROM sflight AS a INNER JOIN scarr AS b\n    ON a~carrid = b~carrid\n  INTO TABLE lt_list.", "SELECT FROM sflight AS a\n  INNER JOIN scarr AS b ON a~carrid = b~carrid\n  FIELDS a~carrid,\n         a~connid,\n         b~carrname\n  INTO TABLE @DATA(lt_list)."]], "para": "SELECT SINGLE 은 한 줄, INTO TABLE 은 여러 줄을 인터널 테이블로 읽는다. JOIN 으로 두 테이블을 이어 읽는다.\nFOR ALL ENTRIES 는 인터널 테이블의 값들로 조건을 거는 방법이다. 기준 표가 비어 있으면 조건 없이 전부 읽으므로 IF … IS NOT INITIAL 로 먼저 확인한다.\n새 문법에서는 변수에 @, 필드 사이에 콤마를 쓰고, INTO @DATA( ) 로 바로 받는다.", "code": []}, {"id": "b10", "part": "기초 3 · DB · 모듈 · 출력", "title": "DB 변경 : INSERT · UPDATE · MODIFY · DELETE", "sub": "저장 · 확정 · 취소", "f1": {"name": "INSERT · UPDATE · MODIFY · DELETE dbtab", "tree": ["ABAP SQL", "Writes", "INSERT, UPDATE, MODIFY, DELETE"], "syntax": "INSERT dbtab FROM wa | FROM TABLE itab.\nUPDATE dbtab SET f1 = v1 WHERE cond.\nMODIFY dbtab FROM wa.\nDELETE FROM dbtab WHERE cond.\nCOMMIT WORK.  |  ROLLBACK WORK.", "effect": "DB 테이블에 줄을 넣고, 바꾸고, 지운다. COMMIT WORK 로 확정하고 ROLLBACK WORK 로 취소한다.", "note": "MODIFY 는 키가 있으면 UPDATE, 없으면 INSERT 다. 실패하면 sy-subrc 가 0 이 아니다.", "example": "UPDATE sflight SET price = @lv_price\n  WHERE carrid = 'LH' AND connid = '0400'."}, "code": [["한 번에 저장하기", "DELETE sflight FROM TABLE @lt_delete.\n\nINSERT sflight FROM TABLE @lt_insert ACCEPTING DUPLICATE KEYS.\nIF sy-subrc <> 0.\n  ROLLBACK WORK.\n  RETURN.\nENDIF.\n\nCOMMIT WORK."]], "pairs": [["UPDATE sflight SET price = ls-price\n  WHERE carrid = ls-carrid\n    AND connid = ls-connid\n    AND fldate = ls-fldate.", "UPDATE sflight SET price = @ls-price\n  WHERE carrid = @ls-carrid\n    AND connid = @ls-connid\n    AND fldate = @ls-fldate."]], "para": "INSERT 는 새 줄, UPDATE 는 있는 줄 수정, MODIFY 는 있으면 수정 · 없으면 추가, DELETE 는 삭제다. FROM TABLE 로 여러 줄을 한 번에 처리한다.\n여러 변경을 한 묶음으로 처리하다 실패하면 ROLLBACK WORK 로 앞의 작업까지 취소하고, 모두 성공하면 COMMIT WORK 로 확정한다.\nACCEPTING DUPLICATE KEYS 를 붙이면 중복 키에서 덤프 대신 sy-subrc = 4 가 된다. 실습은 SFLIGHT 같은 교육용 테이블에서만 한다."}, {"id": "b11", "part": "기초 3 · DB · 모듈 · 출력", "title": "모듈화 : METHOD · CALL FUNCTION", "sub": "반복되는 처리를 이름 붙인 단위로", "f1": {"name": "METHODS · CALL FUNCTION - 모듈화", "tree": ["Program Structure", "Modularization", "Methods, Function Modules"], "syntax": "CLASS lcl DEFINITION.\n  PUBLIC SECTION.\n    CLASS-METHODS m IMPORTING iv TYPE t1\n                    RETURNING VALUE(rv) TYPE t2.\nENDCLASS.\n\nCALL FUNCTION 'NAME'\n  EXPORTING p1 = a1\n  IMPORTING p2 = a2\n  EXCEPTIONS OTHERS = 1.", "effect": "반복되는 처리를 메서드나 함수 모듈로 나눠 이름을 붙인다.", "note": "FORM · PERFORM 은 예전 방식이라 새로 만들 때는 메서드를 쓴다. RETURNING 메서드는 식 안에서 바로 부른다.", "example": "lv_name = lcl_util=>get_name( lv_carrid )."}, "pairs": [["PERFORM get_name USING lv_carrid CHANGING lv_name.\n\nFORM get_name USING iv TYPE s_carr_id\n              CHANGING cv TYPE s_carrname.\n  SELECT SINGLE carrname FROM scarr INTO cv\n    WHERE carrid = iv.\nENDFORM.", "lv_name = lcl_util=>get_name( lv_carrid ).\n\nMETHOD get_name.\n  SELECT SINGLE FROM scarr\n    FIELDS carrname\n    WHERE carrid = @iv_carrid\n    INTO @rv_name.\nENDMETHOD."]], "para": "모듈화는 같은 처리를 여러 곳에서 쓰도록 이름 붙인 단위로 나누는 것이다. 프로그램 안에서는 로컬 클래스의 메서드, 여러 프로그램이 함께 쓰면 함수 모듈( SE37 )이나 글로벌 클래스를 만든다.\nRETURNING 으로 값을 돌려주는 메서드는 lv = lcl=>m( … ) 처럼 식 안에서 바로 부른다.\nFORM · PERFORM 은 예전 방식이라 새 프로그램에서는 쓰지 않는다.", "code": []}, {"id": "b12", "part": "기초 3 · DB · 모듈 · 출력", "title": "출력 : WRITE · SALV", "sub": "목록 화면과 ALV 그리드", "f1": {"name": "WRITE · CL_SALV_TABLE - 출력", "tree": ["User Dialogs", "Lists, ALV", "WRITE, SALV"], "syntax": "WRITE / text.\n\ncl_salv_table=>factory( IMPORTING r_salv_table = lo_alv\n                        CHANGING  t_table      = itab ).\nlo_alv->display( ).", "effect": "WRITE 는 목록 화면에 글자를 찍고, SALV 는 인터널 테이블을 ALV 그리드로 보여 준다.", "note": "factory 는 예외 CX_SALV_MSG 를 낼 수 있어 TRY 로 감싼다.", "example": "WRITE : / ls-carrid, ls-connid."}, "pairs": [["LOOP AT gt_sflight INTO ls.\n  WRITE : / ls-carrid, ls-connid, ls-price.\nENDLOOP.", "TRY.\n    cl_salv_table=>factory( IMPORTING r_salv_table = DATA(lo_alv)\n                            CHANGING  t_table      = gt_sflight ).\n    lo_alv->display( ).\n  CATCH cx_salv_msg.\nENDTRY."]], "para": "WRITE 는 가장 단순한 목록 출력이다. / 는 줄 바꿈이다.\n조회 결과를 표로 보여 줄 때는 SALV( CL_SALV_TABLE )를 쓴다. 정렬, 필터, 합계, 엑셀 내보내기가 기본으로 들어 있다.\n편집이 필요한 화면은 CL_GUI_ALV_GRID 를 쓴다.", "code": []}, {"id": "b13", "part": "기초 3 · DB · 모듈 · 출력", "title": "예외 처리 : TRY · CATCH · sy-subrc", "sub": "오류에도 멈추지 않게", "f1": {"name": "TRY · CATCH - 예외 처리", "tree": ["Program Flow Logic", "Exception Handling", "TRY"], "syntax": "TRY.\n    ...\n  CATCH cx_class INTO DATA(lx).\n    ... lx->get_text( ) ...\nENDTRY.", "effect": "실행 중 생긴 예외를 잡아 프로그램이 멈추지 않게 한다.", "note": "예전 문장은 sy-subrc 로, 클래스 기반 예외는 TRY 로 처리한다. 테이블 식 itab[ ] 은 줄이 없으면 CX_SY_ITAB_LINE_NOT_FOUND 를 낸다.", "example": "CATCH cx_sy_zerodivide INTO DATA(lx)."}, "pairs": [["READ TABLE gt_scarr INTO gs_scarr WITH KEY carrid = 'XX'.\nIF sy-subrc <> 0.\n  MESSAGE '없는 항공사' TYPE 'S'.\nENDIF.", "TRY.\n    DATA(ls_scarr) = gt_scarr[ carrid = 'XX' ].\n  CATCH cx_sy_itab_line_not_found.\n    MESSAGE '없는 항공사' TYPE 'S'.\nENDTRY."]], "para": "예외는 실행 중에 생긴 오류다. 잡지 않으면 덤프( ST22 )가 나고 프로그램이 멈춘다.\nTRY 안에서 예외가 나면 맞는 CATCH 로 건너뛴다. INTO DATA( lx ) 로 받으면 get_text( ) 로 내용을 볼 수 있다.\n예전 문장( READ TABLE, SELECT 등 )은 예외 대신 sy-subrc 로 결과를 알려 준다.", "code": []}, {"id": "ns00", "part": "New Syntax 1 · 선언 · 생성", "title": "인라인 문법이란", "sub": "문장 여러 개를 식 하나로", "pairs": [["DATA lv_cnt TYPE i.\nDESCRIBE TABLE gt_scarr LINES lv_cnt.", "DATA(lv_cnt) = lines( gt_scarr )."], ["DATA lo_grid TYPE REF TO cl_gui_alv_grid.\nCREATE OBJECT lo_grid\n  EXPORTING i_parent = go_right.", "DATA(lo_grid) = NEW cl_gui_alv_grid( i_parent = go_right )."]], "para": "인라인 문법은 따로 쓰던 선언, 생성, 계산을 값이 필요한 자리에 바로 써 넣는 방식이다.\n문장이 식으로 바뀌었다. 식은 값을 돌려주므로 대입문 오른쪽, 파라미터, IF 조건에 바로 들어간다.\n종류는 세 가지다. 인라인 선언 DATA( ), 생성자 식 NEW · VALUE · COND 등, 내장 함수와 테이블 식 lines( ) · itab[ ].", "table": {"title": "생성자 연산자", "cols": ["연산자", "돌려주는 것"], "rows": [["NEW", "새 객체 ( 참조 )"], ["VALUE", "구조 · 인터널 테이블"], ["CONV", "타입을 바꾼 값"], ["CAST", "바꾼 참조"], ["CORRESPONDING", "같은 이름 필드를 옮긴 값"], ["COND · SWITCH", "조건에 맞는 값"], ["REDUCE", "표를 돌며 만든 값 하나"], ["FILTER", "조건에 맞는 줄만 남은 표"]]}}, {"id": "ns01", "part": "New Syntax 1 · 선언 · 생성", "title": "인라인 선언 : DATA( )", "sub": "쓰는 자리에서 바로 선언", "pairs": [["DATA ls_scarr TYPE scarr.\nLOOP AT gt_scarr INTO ls_scarr.", "LOOP AT gt_scarr INTO DATA(ls_scarr)."], ["DATA lt_rows TYPE lvc_t_row.\ngo_grid->get_selected_rows(\n  IMPORTING et_index_rows = lt_rows ).", "go_grid->get_selected_rows(\n  IMPORTING et_index_rows = DATA(lt_rows) )."]], "para": "값을 받는 자리에서 DATA( ) 로 변수를 바로 만든다.\n타입은 들어오는 값을 보고 자동으로 정해진다.\nLOOP 의 INTO, SELECT 의 INTO, 메서드의 받는 파라미터에서 가장 많이 쓴다.", "ex": "SELECT … INTO TABLE @DATA(lt_sflight).", "ver": "7.40", "f1": {"name": "DATA - 인라인 선언", "tree": ["Declarations", "Inline Declarations", "DATA( )"], "syntax": "... DATA(var) ...", "effect": "그 자리에서 변수를 선언한다. 타입은 들어오는 값의 타입이다.", "note": "같은 이름은 한 번만 선언한다. 선언한 줄 아래에서만 쓴다.", "example": "DATA(lv_cnt) = lines( gt_scarr ).\nLOOP AT gt_scarr INTO DATA(ls_scarr). ENDLOOP."}, "extra": []}, {"id": "ns02", "part": "New Syntax 1 · 선언 · 생성", "title": "NEW · CAST : 객체 만들기 , 형 변환", "sub": "CREATE OBJECT , ?= 대신", "pairs": [["DATA go_con TYPE REF TO cl_gui_custom_container.\nCREATE OBJECT go_con\n  EXPORTING container_name = 'CON_100'.", "go_con = NEW #( container_name = 'CON_100' )."], ["lo_struct ?= cl_abap_typedescr=>describe_by_data( gs_itab ).", "lo_struct = CAST #( cl_abap_typedescr=>describe_by_data( gs_itab ) )."]], "para": "NEW 는 객체를 만들어 돌려준다. CREATE OBJECT 를 한 줄로 쓴 것이다.\nCAST 는 ?= 를 식으로 쓴 것이다.\n# 은 받는 쪽 타입을 그대로 쓰라는 뜻이다.", "ex": "DATA(lo_grid) = NEW cl_gui_alv_grid( i_parent = go_right ).", "ver": "7.40", "f1": {"name": "NEW · CAST - 생성 · 형 변환 연산자", "tree": ["Constructor Expressions", "NEW, CAST"], "syntax": "... NEW class|#( [p1 = a1 p2 = a2 ...] ) ...\n... CAST type|#( dobj ) ...", "effect": "NEW 는 객체를 만들어 참조를 돌려준다. CAST 는 참조를 아래 클래스 타입으로 바꾼다.", "note": "DATA( ) 로 받으면 # 대신 클래스 이름을 쓴다. CAST 가 실패하면 CX_SY_MOVE_CAST_ERROR.", "example": "DATA(lo_grid) = NEW cl_gui_alv_grid( i_parent = go_right )."}, "extra": []}, {"id": "ns03", "part": "New Syntax 1 · 선언 · 생성", "title": "VALUE #( ) : 구조 · 표를 값으로", "sub": "한 줄 , 여러 줄 , BASE", "pairs": [["ls_r-sign = 'I'. ls_r-option = 'EQ'.\nls_r-low = 'AA'. APPEND ls_r TO lr_carrid.\nls_r-low = 'LH'. APPEND ls_r TO lr_carrid.", "lr_carrid = VALUE #( sign = 'I' option = 'EQ'\n                     ( low = 'AA' )\n                     ( low = 'LH' ) )."], ["APPEND ls_r TO lr_carrid.", "lr_carrid = VALUE #( BASE lr_carrid ( sign = 'I' option = 'EQ' low = 'UA' ) )."]], "para": "VALUE 는 구조나 표를 값으로 한 번에 만든다.\n괄호 ( ) 하나가 한 줄이다. 모든 줄에 같은 값은 앞에 한 번만 쓴다.\nBASE 를 붙이면 기존 내용 뒤에 줄을 더한다.", "ex": "DATA lr_carrid TYPE RANGE OF s_carr_id.", "ver": "7.40", "f1": {"name": "VALUE - 값 연산자", "tree": ["Constructor Expressions", "VALUE"], "syntax": "... VALUE type|#( [BASE itab] [comp = val ...]\n                   ( line1 ) ( line2 ) ... ) ...", "effect": "구조나 표를 값으로 만든다. 괄호 ( ) 하나가 한 줄이다.", "note": "BASE 가 없으면 기존 내용은 지워진다.", "example": "lr_carrid = VALUE #( sign = 'I' option = 'EQ'\n                     ( low = 'AA' ) ( low = 'LH' ) )."}, "extra": []}, {"id": "ns04", "part": "New Syntax 2 · 변환 · 조건", "title": "CORRESPONDING #( ) : 같은 이름 필드 복사", "sub": "MOVE-CORRESPONDING 대신 , MAPPING · EXCEPT", "pairs": [["MOVE-CORRESPONDING ls_itab TO ls_sflight.", "ls_sflight = CORRESPONDING #( ls_itab )."], ["LOOP AT lt_itab INTO ls_itab.\n  MOVE-CORRESPONDING ls_itab TO ls_sflight.\n  APPEND ls_sflight TO lt_sflight.\nENDLOOP.", "lt_sflight = CORRESPONDING #( lt_itab )."]], "para": "이름이 같은 필드끼리 값을 옮긴다. 구조도, 표도 된다.\n표끼리 쓰면 LOOP 없이 한 번에 옮긴다.\n이름이 다른 필드는 MAPPING 으로 짝짓는다 ( 다음 장 ).", "ex": null, "ver": "7.40", "f1": {"name": "CORRESPONDING - 구성요소 연산자", "tree": ["Constructor Expressions", "CORRESPONDING"], "syntax": "... CORRESPONDING type|#( [BASE ( base )] struc|itab [mapping] ) ...", "effect": "이름이 같은 필드끼리 값을 옮긴 새 구조나 표를 만든다.", "note": "옮기지 않은 필드는 초기값이다. 남기려면 BASE ( ) 를 쓴다.", "example": "lt_sflight = CORRESPONDING #( lt_itab )."}, "extra": []}, {"id": "ns04m", "part": "New Syntax 2 · 변환 · 조건", "title": "CORRESPONDING : MAPPING · EXCEPT · BASE", "sub": "이름이 다른 필드 짝짓기 , 빼기 , 남기기", "pairs": [["ls_out-airline     = ls_sflight-carrid.\nls_out-flight_date = ls_sflight-fldate.\nls_out-price       = ls_sflight-price.", "ls_out = CORRESPONDING #( ls_sflight\n           MAPPING airline     = carrid\n                   flight_date = fldate )."], ["MOVE-CORRESPONDING ls_sflight TO ls_out.\n\" ls_out 의 다른 필드는 그대로", "ls_out = CORRESPONDING #( BASE ( ls_out ) ls_sflight ).\n\" BASE 가 없으면 다른 필드는 초기화"]], "para": "MAPPING 받는필드 = 보내는필드 로 이름이 다른 필드를 짝짓는다.\nEXCEPT 는 옮기지 않을 필드를 뺀다. EXCEPT * 면 MAPPING 한 필드만 옮긴다.\nBASE ( ) 가 없으면 받는 쪽의 나머지 필드는 초기값이 된다.", "ex": "ls_out = CORRESPONDING #( ls_sflight\n           MAPPING airline = carrid\n           EXCEPT * ).", "ver": "7.40", "f1": {"name": "CORRESPONDING - MAPPING · EXCEPT", "tree": ["Constructor Expressions", "CORRESPONDING", "mapping"], "syntax": "... CORRESPONDING #( src MAPPING t1 = s1 [t2 = s2 ...]\n                      [EXCEPT {t3 t4 ...}|*] ) ...", "effect": "MAPPING 은 이름이 다른 필드를 짝짓고, EXCEPT 는 필드를 뺀다.", "note": "EXCEPT * 면 MAPPING 에 적은 필드만 옮긴다.", "example": "ls_out = CORRESPONDING #( ls_sflight\n            MAPPING airline = carrid EXCEPT * )."}, "extra": [], "short": "MAPPING · EXCEPT · BASE"}, {"id": "ns05", "part": "New Syntax 2 · 변환 · 조건", "title": "CONV # : 타입 바꾸기", "sub": "임시 변수 없이 식 안에서 변환", "pairs": [["DATA lv_text TYPE string.\nlv_text = ls_sflight-seatsocc.\ncl_demo_output=>display( lv_text ).", "cl_demo_output=>display( CONV string( ls_sflight-seatsocc ) )."], ["DATA lv_price TYPE i.\nlv_price = ls_sflight-price.", "DATA(lv_price) = CONV i( ls_sflight-price )."]], "para": "CONV 는 값을 원하는 타입으로 바꿔 돌려준다.\n변수를 하나 더 만들어 옮겨 담던 일을 식 하나로 한다.\n메서드 파라미터 타입을 맞출 때 가장 많이 쓴다.", "ex": "go_obj->set_text( CONV #( lv_num ) ).", "ver": "7.40", "f1": {"name": "CONV - 변환 연산자", "tree": ["Constructor Expressions", "CONV"], "syntax": "... CONV type|#( dobj ) ...", "effect": "값을 지정한 타입으로 바꿔 돌려준다.", "note": "바꿀 수 없는 값이면 예외가 난다.", "example": "DATA(lv_txt) = CONV string( ls_sflight-seatsocc )."}, "extra": []}, {"id": "ns06", "part": "New Syntax 2 · 변환 · 조건", "title": "COND : 조건에 따라 값 고르기", "sub": "IF 를 식 하나로", "pairs": [["IF ls_sflight-price > 3000.\n  lv_grade = 'A'.\nELSEIF ls_sflight-price > 1000.\n  lv_grade = 'B'.\nELSE.\n  lv_grade = 'C'.\nENDIF.", "lv_grade = COND #( WHEN ls_sflight-price > 3000 THEN 'A'\n                   WHEN ls_sflight-price > 1000 THEN 'B'\n                   ELSE 'C' )."]], "para": "COND 는 IF 를 식으로 쓴 것이다. WHEN 을 위에서부터 보고, 처음 참인 THEN 값을 돌려준다.\n참인 WHEN 을 찾으면 아래 WHEN 은 보지 않는다. 그래서 큰 조건부터 적는다.\n맞는 WHEN 이 없고 ELSE 도 없으면 초기값이다.", "ex": "MESSAGE |등급 { COND string( WHEN ls-price > 3000 THEN 'A'\n                            ELSE 'B' ) }| TYPE 'S'.", "ver": "7.40", "f1": {"name": "COND · SWITCH - 조건 연산자", "tree": ["Constructor Expressions", "COND, SWITCH"], "syntax": "... COND type|#( [LET ... IN] WHEN cond1 THEN r1 [WHEN ...] [ELSE r] ) ...\n... SWITCH type|#( [LET ... IN] op WHEN c1 THEN r1 [WHEN ...] [ELSE r] ) ...", "effect": "처음 맞는 WHEN 의 값을 돌려준다.", "note": "맞는 WHEN 도 ELSE 도 없으면 초기값이다.", "example": "lv_grade = COND #( WHEN ls-price > 3000 THEN 'A' ELSE 'B' )."}, "extra": [{"id": "ns06x", "title": "COND 예제 : 조건 · 계산식", "sub": "WHEN 에는 IF 조건 , THEN 에는 값 또는 계산식", "code": "\" ① 등급 : 위에서부터 첫 번째 참\nlv_grade = COND #( WHEN ls-price > 3000 THEN 'A'\n                   WHEN ls-price > 1000 THEN 'B'\n                   ELSE 'C' ).\n\n\" ② AND · OR 조건\nlv_note = COND #( WHEN ls-seatsocc = 0 THEN '예약 없음'\n                  WHEN ls-seatsocc >= ls-seatsmax\n                    OR ls-fldate < sy-datum THEN '판매 종료'\n                  ELSE '판매 중' ).\n\n\" ③ THEN 에 계산식\nlv_pay = COND s_price( WHEN lv_vip = abap_true\n                       THEN ls-price * '0.9'\n                       ELSE ls-price ).", "rtitle": "결과  ( LH 0400 · 3,666 · 만석 · VIP )", "cols": ["예제", "결과"], "rows": [["① lv_grade", "A"], ["② lv_note", "판매 종료"], ["③ lv_pay", "3,299.40"]], "para": "① 3,666 은 첫 WHEN( > 3000 )에서 참이라 A 가 되고, 두 번째 WHEN 은 보지 않는다. 그래서 큰 조건을 위에 적는다.\n② WHEN 에는 IF 에 쓰는 조건이면 무엇이든 쓴다. AND, OR, IS INITIAL, line_exists( ) 도 된다.\n③ THEN 에는 계산식도 온다. 결과 타입(s_price)을 적어 두면 모든 THEN 값이 그 타입으로 맞춰진다."}]}, {"id": "ns06s", "part": "New Syntax 2 · 변환 · 조건", "title": "SWITCH : 값 하나로 고르기", "sub": "CASE 를 식 하나로", "pairs": [["CASE ls-flag.\n  WHEN 'I'.\n    lv_text = '추가'.\n  WHEN 'U'.\n    lv_text = '수정'.\n  WHEN 'D'.\n    lv_text = '삭제'.\n  WHEN OTHERS.\n    lv_text = '-'.\nENDCASE.", "lv_text = SWITCH #( ls-flag\n                    WHEN 'I' THEN '추가'\n                    WHEN 'U' THEN '수정'\n                    WHEN 'D' THEN '삭제'\n                    ELSE '-' )."]], "para": "SWITCH 는 CASE 를 식으로 쓴 것이다. 괄호 바로 뒤의 값 하나를 WHEN 의 값과 같은지 비교한다.\n처음 같은 WHEN 의 THEN 값을 돌려준다. ELSE 는 WHEN OTHERS 와 같다.\n크다, 작다 같은 비교나 여러 필드 조건이 필요하면 COND 를 쓴다.", "ex": "lv_msg = |{ SWITCH string( sy-ucomm WHEN 'SAVE' THEN '저장'\n                                   ELSE '처리' ) } 완료|.", "ver": "7.40", "f1": null, "extra": [{"id": "ns06sx", "title": "SWITCH 예제 · COND 와 차이", "sub": "코드값을 글자로 바꿀 때", "code": "\" ① 상태 코드 → 글자\nlv_text = SWITCH #( ls-flag WHEN 'I' THEN '추가'\n                            WHEN 'U' THEN '수정'\n                            WHEN 'D' THEN '삭제'\n                            ELSE '-' ).\n\n\" ② 버튼 코드 → 메시지\nlv_msg = SWITCH string( sy-ucomm\n                        WHEN 'SAVE'    THEN '저장했습니다'\n                        WHEN 'REFRESH' THEN '다시 읽었습니다'\n                        ELSE '처리했습니다' ).\n\n\" ③ 안 되는 것 : 범위 비교 → COND 로\n\" SWITCH #( ls-price WHEN > 3000 … )", "rtitle": "COND 와 SWITCH", "cols": ["구분", "COND", "SWITCH"], "rows": [["대신하는 문장", "IF", "CASE"], ["비교", "조건식 무엇이든", "= 비교만"], ["WHEN 뒤", "조건", "값 하나"], ["많이 쓰는 곳", "범위 · 여러 조건", "코드값 → 글자"]], "para": "SWITCH 는 괄호 뒤 값 하나가 WHEN 의 값과 같은지만 본다. 상태 코드, 버튼 코드를 글자로 바꿀 때 가장 많이 쓴다.\n같은 값이 없고 ELSE 도 없으면 초기값이다.\n'3000 보다 크다' 같은 범위 비교나 여러 필드 조건은 SWITCH 로 쓸 수 없다. 이때는 COND 를 쓴다."}]}, {"id": "ns06l", "part": "New Syntax 2 · 변환 · 조건", "title": "LET : 식 안의 임시 변수", "sub": "같은 계산을 한 번만", "pairs": [["lv_free = ls-seatsmax - ls-seatsocc.\nIF lv_free = 0.\n  lv_status = '만석'.\nELSEIF lv_free < 10.\n  lv_status = '마감 임박'.\nELSE.\n  lv_status = '여유'.\nENDIF.", "lv_status = COND #( LET free = ls-seatsmax - ls-seatsocc IN\n                    WHEN free = 0  THEN '만석'\n                    WHEN free < 10 THEN '마감 임박'\n                    ELSE '여유' )."]], "para": "LET 은 식 안에서만 쓰는 임시 변수다. LET 이름 = 값 IN 뒤에서 쓴다.\n같은 계산을 여러 번 쓰지 않아도 된다.\n식이 끝나면 사라지고, 이미 있는 변수와 같은 이름은 쓸 수 없다.", "ex": "lt_out = VALUE #( FOR ls IN lt_sflight\n  LET free = ls-seatsmax - ls-seatsocc IN\n  ( connid = ls-connid seatsfree = free ) ).", "ver": "7.40", "f1": {"name": "LET - 지역 보조 변수", "tree": ["Constructor Expressions", "LET"], "syntax": "... LET var1 = rhs1 [var2 = rhs2 ...] IN ...", "effect": "식 안에서만 쓰는 임시 변수를 만든다.", "note": "식 밖에서는 쓸 수 없다. 이미 있는 변수와 같은 이름은 안 된다.", "example": "lv_status = COND #( LET free = ls-seatsmax - ls-seatsocc IN\n                    WHEN free = 0 THEN '만석' ELSE '여유' )."}, "extra": [{"id": "ns06lx", "title": "LET 예제 : 쓰는 자리와 계산 횟수", "sub": "식 맨 앞 = 한 번 , FOR 뒤 = 줄마다", "code": "\" ① LET 여러 개 : 뒤 변수가 앞 변수를 쓴다\nlv_msg = CONV string(\n  LET free = ls-seatsmax - ls-seatsocc\n      txt  = COND string( WHEN free = 0 THEN '만석'\n                          ELSE '여유' ) IN\n  |{ ls-connid } { txt } ( 빈 좌석 { free } )| ).\n\n\" ② VALUE 앞 LET : 모든 줄에 같은 값\nlr_date = VALUE #( LET today = sy-datum IN\n                   sign = 'I' option = 'BT'\n                   ( low = today high = today + 30 ) ).\n\n\" ③ FOR 뒤 LET : 줄마다 다시 계산\nlv_sum = REDUCE i( INIT s = 0 FOR ls IN lt_sflight\n                   LET f = ls-seatsmax - ls-seatsocc IN\n                   NEXT s = s + f ).", "rtitle": "LET 을 쓰는 자리", "cols": ["자리", "계산"], "rows": [["COND · SWITCH 맨 앞", "한 번"], ["VALUE · CONV · NEW 맨 앞", "한 번"], ["FOR … 뒤 ( VALUE )", "줄마다"], ["FOR … 뒤 ( REDUCE )", "줄마다"]], "para": "LET 은 '이 식 안에서 쓸 이름' 을 먼저 정하는 문법이다. 여러 개를 적으면 위에서부터 차례로 계산되어, 뒤 변수가 앞 변수를 쓸 수 있다 ( ① ).\n식 맨 앞에 쓰면 한 번만 계산되고 ( ② ), FOR 뒤에 쓰면 줄마다 다시 계산된다 ( ③ ).\nLET 이름은 식이 끝나면 사라진다. 밖에서 쓰려면 식의 결과로 받는다."}]}, {"id": "ns07", "part": "New Syntax 3 · 인터널 테이블", "title": "테이블 식 itab[ ] : 한 줄 읽기", "sub": "READ TABLE 대신", "pairs": [["READ TABLE gt_scarr INTO ls_scarr\n     WITH KEY carrid = 'LH'.\nlv_name = ls_scarr-carrname.", "lv_name = gt_scarr[ carrid = 'LH' ]-carrname."], ["READ TABLE gt_scarr INTO ls_scarr INDEX 1.\nIF sy-subrc <> 0.\n  CLEAR ls_scarr.\nENDIF.", "ls_scarr = VALUE #( gt_scarr[ 1 ] OPTIONAL )."]], "para": "itab[ ] 은 READ TABLE 을 식으로 쓴 것이다. 번호나 필드 = 값으로 한 줄을 꺼낸다.\n뒤에 -필드 를 붙이면 그 필드만 꺼낸다.\n줄이 없으면 sy-subrc 대신 예외가 난다. VALUE #( … OPTIONAL ) 로 감싸면 초기값을 받는다.", "ex": null, "ver": "7.40", "f1": {"name": "itab[ ] - 테이블 식", "tree": ["Internal Tables", "Table Expressions"], "syntax": "... itab[ idx ] ...\n... itab[ [KEY key] comp1 = op1 comp2 = op2 ... ] ...", "effect": "표에서 한 줄을 꺼내 그 자리에 돌려준다.", "note": "줄이 없으면 CX_SY_ITAB_LINE_NOT_FOUND. sy-subrc, sy-tabix 는 바뀌지 않는다.\nVALUE #( … OPTIONAL | DEFAULT 값 ) 으로 감싸면 예외 대신 값을 받는다.", "example": "lv_name = gt_scarr[ carrid = 'LH' ]-carrname."}, "extra": []}, {"id": "ns08", "part": "New Syntax 3 · 인터널 테이블", "title": "line_exists · line_index · lines", "sub": "있는지 , 몇 번째인지 , 몇 줄인지", "pairs": [["READ TABLE gt_scarr TRANSPORTING NO FIELDS\n     WITH KEY carrid = 'LH'.\nIF sy-subrc = 0.", "IF line_exists( gt_scarr[ carrid = 'LH' ] )."], ["DESCRIBE TABLE gt_scarr LINES lv_cnt.", "lv_cnt = lines( gt_scarr )."]], "para": "line_exists 는 줄이 있는지 참, 거짓으로 알려 준다. 예외가 나지 않는다.\nline_index 는 몇 번째 줄인지 돌려주고, 없으면 0 이다.\nlines 는 줄 수다.", "ex": "DATA(lv_idx) = line_index( gt_scarr[ carrid = 'LH' ] ).", "ver": "7.40", "f1": {"name": "line_exists · line_index · lines - 테이블 함수", "tree": ["Built-In Functions", "Table Functions"], "syntax": "... line_exists( itab[ ... ] ) ...\n... line_index( itab[ ... ] ) ...\n... lines( itab ) ...", "effect": "있는지 ( 참 · 거짓 ), 몇 번째인지 ( 없으면 0 ), 몇 줄인지 돌려준다.", "note": "line_exists 는 IF 같은 조건 자리에서 쓴다. 예외가 나지 않는다.", "example": "IF line_exists( gt_scarr[ carrid = 'LH' ] ).\nENDIF."}, "extra": []}, {"id": "ns09", "part": "New Syntax 3 · 인터널 테이블", "title": "VALUE FOR : 표를 돌며 새 표 만들기", "sub": "LOOP + APPEND 대신", "pairs": [["LOOP AT lt_sflight INTO ls_sflight\n     WHERE carrid = 'LH'.\n  APPEND ls_sflight TO lt_lh.\nENDLOOP.", "lt_lh = VALUE #( FOR ls IN lt_sflight\n                 WHERE ( carrid = 'LH' )\n                 ( ls ) )."], ["LOOP AT lt_sflight INTO ls_sflight.\n  ls_r-low = ls_sflight-connid.\n  APPEND ls_r TO lr_connid.\nENDLOOP.", "lr_connid = VALUE #( FOR ls IN lt_sflight\n                     ( sign = 'I' option = 'EQ' low = ls-connid ) )."]], "para": "FOR 는 표를 한 줄씩 돌며 새 표를 만든다. 괄호 ( ) 안이 새 줄 모양이다.\nWHERE ( 조건 ) 으로 필요한 줄만 고른다.\nLOOP + APPEND 를 식 하나로 쓴 것이다.", "ex": null, "ver": "7.40", "f1": {"name": "FOR - 반복 식 ( VALUE )", "tree": ["Iteration Expressions", "FOR ... IN"], "syntax": "... VALUE type|#( FOR wa IN itab [INDEX INTO idx] [WHERE ( cond )]\n                   [LET ... IN] ( line ) ) ...", "effect": "표를 한 줄씩 돌며 새 표의 줄을 만든다.", "note": "WHERE 조건은 괄호로 감싼다.", "example": "lt_lh = VALUE #( FOR ls IN lt_sflight WHERE ( carrid = 'LH' ) ( ls ) )."}, "extra": []}, {"id": "ns10", "part": "New Syntax 3 · 인터널 테이블", "title": "REDUCE : 표를 돌며 값 하나 만들기", "sub": "건수 , 합계", "pairs": [["CLEAR lv_cnt.\nLOOP AT lt_sflight INTO ls WHERE carrid = 'LH'.\n  lv_cnt = lv_cnt + 1.\nENDLOOP.", "lv_cnt = REDUCE i( INIT n = 0\n                   FOR ls IN lt_sflight WHERE ( carrid = 'LH' )\n                   NEXT n = n + 1 )."], ["LOOP AT lt_sflight INTO ls.\n  lv_sum = lv_sum + ls-price.\nENDLOOP.", "lv_sum = REDUCE s_price( INIT s = 0\n                         FOR ls IN lt_sflight\n                         NEXT s = s + ls-price )."]], "para": "REDUCE 는 표를 돌며 값 하나를 만든다.\nINIT 이 시작 값, NEXT 가 줄마다 할 계산이다. 마지막 값이 결과다.\n건수 세기, 합계에 가장 많이 쓴다.", "ex": null, "ver": "7.40", "f1": {"name": "REDUCE - 축약 연산자", "tree": ["Constructor Expressions", "REDUCE"], "syntax": "... REDUCE type( INIT x1 = rhs1 [x2 = rhs2 ...]\n                 FOR ...\n                 NEXT x1 = ... [x2 = ...] ) ...", "effect": "표를 돌며 값 하나를 만든다. 결과는 INIT 의 첫 변수 값이다.", "note": "INIT 변수는 NEXT 에서만 쓴다.", "example": "lv_cnt = REDUCE i( INIT n = 0 FOR ls IN lt_sflight NEXT n = n + 1 )."}, "extra": [{"id": "ns10d", "title": "REDUCE 동작 순서 : 디버거로 보기", "sub": "INIT → FOR → NEXT 반복 → 결과", "debug": true}, {"id": "ns10x", "title": "REDUCE 예제 : 최댓값 · 문자열 · 숫자 반복", "sub": "합계 말고도 값 하나를 만드는 일이면 무엇이든", "code": "\" ① 최댓값\nlv_max = REDUCE s_price( INIT m = 0\n                         FOR ls IN lt_sflight\n                         NEXT m = nmax( val1 = m val2 = ls-price ) ).\n\n\" ② 문자열 잇기\nlv_list = REDUCE string( INIT t = ``\n                         FOR ls IN lt_scarr\n                         NEXT t = t && ls-carrid && ` ` ).\n\n\" ③ 숫자로 반복 : 1 ~ 10 합계\nlv_tot = REDUCE i( INIT s = 0\n                   FOR i = 1 UNTIL i > 10\n                   NEXT s = s + i ).\n\n\" ④ INIT 여러 개 : 결과는 첫 번째 ( s )\nlv_occ = REDUCE i( INIT s = 0 c = 0\n                   FOR ls IN lt_lh\n                   NEXT c = c + 1\n                        s = s + ls-seatsocc ).", "rtitle": "결과", "cols": ["변수", "값"], "rows": [["① lv_max", "3,666.00"], ["② lv_list", "AA AZ LH UA"], ["③ lv_tot", "55"], ["④ lv_occ", "1,253"]], "para": "REDUCE 는 '시작 값 + 줄마다 할 일' 로 값 하나를 만든다. 합계뿐 아니라 최댓값 ( ① ), 문자열 잇기 ( ② ) 에도 쓴다.\nFOR i = 1 UNTIL i > 10 처럼 표 없이 숫자로도 돈다 ( ③ ).\nINIT 변수를 여러 개 두면 도우미로 쓸 수 있지만, 결과는 언제나 첫 번째 변수다 ( ④ )."}]}, {"id": "ns11", "part": "New Syntax 3 · 인터널 테이블", "title": "FILTER : 조건에 맞는 줄만 남기기", "sub": "키가 있는 표에서 빠르게 거르기", "pairs": [["LOOP AT lt_sflight INTO ls\n     WHERE carrid = 'LH'.\n  APPEND ls TO lt_lh.\nENDLOOP.", "DATA lt_sflight TYPE SORTED TABLE OF sflight\n     WITH NON-UNIQUE KEY carrid.\n\nlt_lh = FILTER #( lt_sflight WHERE carrid = 'LH' )."]], "para": "FILTER 는 조건에 맞는 줄만 남긴 새 표를 만든다. EXCEPT 면 반대다.\n원래 표에 정렬 키나 해시 키가 있어야 하고, WHERE 에는 그 키 필드를 쓴다.\n키가 없는 표는 VALUE FOR … WHERE 를 쓴다.", "ex": "lt_etc = FILTER #( lt_sflight EXCEPT WHERE carrid = 'LH' ).", "ver": "7.40", "f1": {"name": "FILTER - 필터 연산자", "tree": ["Constructor Expressions", "FILTER"], "syntax": "... FILTER type|#( itab [EXCEPT] [USING KEY key]\n                    WHERE c1 op f1 [AND c2 op f2 ...] ) ...", "effect": "조건에 맞는 줄만 ( EXCEPT 면 맞지 않는 줄만 ) 남긴 새 표를 만든다.", "note": "정렬 키나 해시 키가 있는 표만 된다. WHERE 는 그 키 필드를 AND 로 잇는다.", "example": "lt_lh = FILTER #( lt_sflight WHERE carrid = 'LH' )."}, "extra": []}, {"id": "ns12", "part": "New Syntax 3 · 인터널 테이블", "title": "LOOP AT … GROUP BY : 묶어서 돌기", "sub": "SORT + AT NEW 대신", "pairs": [["SORT lt_sflight BY carrid.\nLOOP AT lt_sflight INTO ls.\n  AT NEW carrid. … ENDAT.\nENDLOOP.", "LOOP AT lt_sflight INTO DATA(ls)\n     GROUP BY ls-carrid INTO DATA(lv_carrid).\n  DATA(lv_cnt) = REDUCE i( INIT n = 0\n                   FOR m IN GROUP lv_carrid NEXT n = n + 1 ).\n  WRITE : / lv_carrid, lv_cnt.\nENDLOOP."]], "para": "GROUP BY 는 같은 값끼리 묶어 그룹마다 한 번 돈다. SORT 가 필요 없다.\nINTO 뒤 변수에 그룹 키가 들어온다.\n그룹 안 줄은 LOOP AT GROUP 으로 꺼낸다.", "ex": "LOOP AT GROUP lv_carrid INTO DATA(ls_m). … ENDLOOP.", "ver": "7.40", "f1": {"name": "LOOP AT itab - GROUP BY", "tree": ["Internal Tables", "LOOP AT itab", "GROUP BY"], "syntax": "LOOP AT itab INTO wa GROUP BY key [ASCENDING|DESCENDING]\n     [WITHOUT MEMBERS] [INTO group].\n  [LOOP AT GROUP group INTO member. ... ENDLOOP.]\nENDLOOP.", "effect": "같은 키끼리 묶어 그룹마다 한 번씩 돈다.", "note": "SORT 가 필요 없다. 그룹 안 줄은 LOOP AT GROUP 으로 꺼낸다.", "example": "LOOP AT lt_sflight INTO DATA(ls) GROUP BY ls-carrid INTO DATA(g).\nENDLOOP."}, "extra": []}, {"id": "ns12b", "part": "New Syntax 3 · 인터널 테이블", "title": "GROUP BY : 키 여러 개 · GROUP SIZE", "sub": "항공사 + 편명으로 묶고 건수까지", "pairs": [["SORT lt_sflight BY carrid connid.\nLOOP AT lt_sflight INTO ls.\n  lv_cnt = lv_cnt + 1.\n  AT END OF connid.\n    WRITE : / ls-carrid, ls-connid, lv_cnt.\n    CLEAR lv_cnt.\n  ENDAT.\nENDLOOP.", "LOOP AT lt_sflight INTO DATA(ls)\n     GROUP BY ( carrid = ls-carrid\n                connid = ls-connid\n                size   = GROUP SIZE )\n     INTO DATA(lg).\n  WRITE : / lg-carrid, lg-connid, lg-size.\nENDLOOP."]], "para": "키가 여러 개면 GROUP BY ( 이름 = 값 … ) 로 쓴다.\nGROUP SIZE 는 그룹의 줄 수, GROUP INDEX 는 그룹 번호다.\nSORT 와 AT END OF 로 세던 일을 대신한다.", "ex": "GROUP BY ( carrid = ls-carrid\n           idx    = GROUP INDEX ) ASCENDING", "ver": "7.40", "f1": {"name": "GROUP BY - 그룹 키 구조", "tree": ["Internal Tables", "LOOP AT itab", "group_key"], "syntax": "... GROUP BY ( k1 = op1 k2 = op2 ...\n               [gs = GROUP SIZE] [gi = GROUP INDEX] ) ...", "effect": "여러 필드를 묶어 그룹 키 하나로 쓴다.", "note": "GROUP SIZE = 줄 수, GROUP INDEX = 그룹 번호.", "example": "GROUP BY ( carrid = ls-carrid size = GROUP SIZE ) INTO DATA(lg)."}, "extra": [], "short": "GROUP BY 키 여러 개"}, {"id": "ns12c", "part": "New Syntax 3 · 인터널 테이블", "title": "GROUP BY : 그룹 안 줄 돌기 · 그룹별 합계", "sub": "LOOP AT GROUP , FOR GROUPS", "pairs": [["SORT lt_sflight BY carrid.\nLOOP AT lt_sflight INTO ls.\n  lv_sum = lv_sum + ls-price.\n  AT END OF carrid.\n    WRITE : / ls-carrid, lv_sum. CLEAR lv_sum.\n  ENDAT.\nENDLOOP.", "LOOP AT lt_sflight INTO DATA(ls)\n     GROUP BY ls-carrid INTO DATA(lv_carrid).\n  CLEAR lv_sum.\n  LOOP AT GROUP lv_carrid INTO DATA(ls_m).\n    lv_sum = lv_sum + ls_m-price.\n  ENDLOOP.\n  WRITE : / lv_carrid, lv_sum.\nENDLOOP."]], "para": "그룹 안의 줄은 LOOP AT GROUP 으로 하나씩 꺼낸다.\n그룹별 합계 표는 VALUE 안에서 FOR GROUPS 로 만든다.\nWITHOUT MEMBERS 를 붙이면 그룹 키만 돈다.", "ex": "lt_sum = VALUE #( FOR GROUPS g OF ls IN lt_sflight\n  GROUP BY ls-carrid\n  ( carrid = g\n    total  = REDUCE s_price( INIT s = 0\n      FOR m IN GROUP g NEXT s = s + m-price ) ) ).", "ver": "7.40", "f1": {"name": "FOR GROUPS · FOR ... IN GROUP", "tree": ["Iteration Expressions", "FOR GROUPS"], "syntax": "... FOR GROUPS g OF wa IN itab GROUP BY key ...\n... FOR m IN GROUP g ...", "effect": "식 안에서 그룹마다, 그룹 안 줄마다 돈다.", "note": "LOOP AT GROUP 과 같은 일을 식으로 한다.", "example": "lt_sum = VALUE #( FOR GROUPS g OF ls IN lt_sflight GROUP BY ls-carrid\n                  ( carrid = g ) )."}, "extra": [], "short": "GROUP BY 그룹 안 줄"}, {"id": "ns13", "part": "New Syntax 4 · 문자열", "title": "문자열 템플릿 | { } |", "sub": "CONCATENATE 대신", "pairs": [["CONCATENATE ls-carrid ls-connid INTO lv_msg\n  SEPARATED BY space.", "lv_msg = |{ ls-carrid } { ls-connid }|."], ["WRITE lv_date TO lv_txt.\nCONCATENATE '비행일 :' lv_txt INTO lv_msg.", "lv_msg = |비행일 : { ls-fldate DATE = USER }|."]], "para": "| | 안의 글자는 그대로, { } 안은 변수 값으로 바뀐다.\n{ } 안에서 DATE = USER, ALPHA = OUT 같은 형식을 바로 준다.\n문자열 잇기는 && 다.", "ex": "lv_msg = |저장 { lv_cnt } 건| && | 완료|.", "ver": "7.02", "f1": {"name": "| ... | - 문자열 템플릿", "tree": ["String Processing", "String Templates"], "syntax": "... |text { expr [format_options] } text| ...\n... str1 && str2 ...", "effect": "글자와 { } 안의 값을 이어 문자열을 만든다.", "note": "| { } \\ 를 글자로 쓰려면 앞에 \\ 를 붙인다.", "example": "lv_msg = |{ ls-carrid } { ls-fldate DATE = USER }|."}, "extra": []}, {"id": "ns14", "part": "New Syntax 4 · 문자열", "title": "문자열 함수", "sub": "문장 대신 식으로", "pairs": [["CONDENSE lv_txt.\nTRANSLATE lv_txt TO UPPER CASE.", "lv_txt = to_upper( condense( lv_txt ) )."], ["lv_len = STRLEN( lv_txt ).\nlv_part = lv_txt+0(3).", "lv_len  = strlen( lv_txt ).\nlv_part = substring( val = lv_txt off = 0 len = 3 )."]], "para": "CONDENSE, TRANSLATE 같은 문장을 함수로 쓴다.\n함수는 값을 돌려주므로 겹쳐 쓰거나 템플릿 안에 바로 넣는다.\n원래 변수는 바뀌지 않으니 결과를 다시 넣는다.", "ex": "lv_txt = replace( val = lv_txt sub = '-' with = '' occ = 0 ).", "ver": "7.02", "f1": {"name": "문자열 함수", "tree": ["Built-In Functions", "String Functions"], "syntax": "... condense( val = text [del = ] [from = ] [to = ] ) ...\n... to_upper( text ) ...   ... strlen( text ) ...\n... substring( val = text [off = ] [len = ] ) ...", "effect": "바꾼 문자열을 값으로 돌려준다.", "note": "원래 변수는 그대로다. substring 범위를 넘으면 예외가 난다.", "example": "lv_txt = to_upper( condense( lv_txt ) )."}, "extra": []}, {"id": "ns15", "part": "New Syntax 5 · Open SQL", "title": "새 Open SQL : @ · 콤마 · FIELDS", "sub": "ABAP 변수에는 @", "pairs": [["SELECT carrid connid fldate price\n  FROM sflight\n  INTO TABLE lt_sflight\n  WHERE carrid = p_carrid.", "SELECT FROM sflight\n  FIELDS carrid,\n         connid,\n         fldate,\n         price\n  WHERE carrid = @p_carrid\n  INTO TABLE @DATA(lt_sflight)."]], "para": "변수 앞에 @, 필드 사이에 콤마를 쓴다.\nFROM 을 먼저 쓰면 FIELDS 로 필드를 적는다 ( 7.50 ). 코드 완성이 필드를 알려 준다.\nINTO 는 맨 뒤에 쓰고, @DATA( ) 로 표를 바로 선언한다.", "ex": null, "ver": "7.40 · FIELDS 7.50", "f1": {"name": "SELECT - ABAP SQL", "tree": ["ABAP SQL", "SELECT"], "syntax": "SELECT FROM dbtab\n  FIELDS f1, f2, ...\n  [WHERE cond]\n  INTO TABLE @itab|@DATA(itab).", "effect": "변수에는 @, 필드 사이에는 콤마. FROM 을 먼저 쓰면 FIELDS 를 쓴다.", "note": "한 문장 안에서 예전 문법과 섞을 수 없다. FIELDS 는 7.50 부터.", "example": "SELECT FROM sflight\n  FIELDS carrid,\n         connid\n  INTO TABLE @DATA(lt_sflight)."}, "extra": []}, {"id": "ns16", "part": "New Syntax 5 · Open SQL", "title": "SQL 식 : 계산 · CASE · COALESCE", "sub": "LOOP 에서 하던 계산을 DB 에서", "pairs": [["SELECT … INTO TABLE lt_sflight.\nLOOP AT lt_sflight INTO ls.\n  ls-seatsfree = ls-seatsmax - ls-seatsocc.\n  MODIFY lt_sflight FROM ls.\nENDLOOP.", "SELECT FROM sflight\n  FIELDS carrid,\n         connid,\n         seatsmax - seatsocc AS seatsfree,\n         CASE WHEN price > 3000 THEN 'A'\n              ELSE 'B'\n         END AS grade\n  INTO TABLE @DATA(lt_free)."]], "para": "SELECT 안에서 계산, CASE, COALESCE 를 쓴다. AS 로 결과 이름을 붙인다.\nCOALESCE( a, b ) 는 a 가 NULL 이면 b 다.\n가져와서 LOOP 로 하던 계산을 DB 에서 끝낸다.", "ex": "COALESCE( b~cityfrom, '-' ) AS cityfrom", "ver": "7.40", "f1": {"name": "SQL 식 - ABAP SQL", "tree": ["ABAP SQL", "SQL Expressions"], "syntax": "... f1 + f2 ...   ... CAST( expr AS type ) ...\n... CASE WHEN cond THEN r1 [WHEN ...] [ELSE r] END ...\n... COALESCE( a, b ) ...   ... AS alias ...", "effect": "SELECT 안에서 계산 · 조건 · NULL 대체를 DB 가 한다.", "note": "CASE 결과끼리는 타입이 맞아야 한다.", "example": "seatsmax - seatsocc AS seatsfree"}, "extra": []}, {"id": "ns17", "part": "New Syntax 5 · Open SQL", "title": "WITH : 결과에 이름 붙여 다시 쓰기", "sub": "SELECT 를 두 번 하던 일을 한 문장으로", "pairs": [["SELECT … FROM sflight\n  WHERE carrid = 'LH'\n  INTO TABLE lt_lh.\nLOOP AT lt_lh … 편명별 합계 계산 … ENDLOOP.", "WITH +lh AS ( SELECT FROM sflight\n                FIELDS connid,\n                       price\n                WHERE carrid = 'LH' )\nSELECT FROM +lh\n  FIELDS connid,\n         SUM( price ) AS total\n  GROUP BY connid\n  INTO TABLE @DATA(lt_sum)."]], "para": "WITH 는 SELECT 결과에 +이름 을 붙여, 뒤의 SELECT 에서 테이블처럼 쓴다 ( 7.51 ).\n먼저 거르고, 그 결과로 합계를 내는 일을 한 문장으로 한다.", "ex": null, "ver": "7.51", "f1": {"name": "WITH - 공통 테이블 식", "tree": ["ABAP SQL", "WITH"], "syntax": "WITH +cte1 AS ( SELECT ... )\n     [, +cte2 AS ( SELECT ... )]\nSELECT ... FROM +cte1 ... INTO ...", "effect": "SELECT 결과에 이름을 붙여 뒤에서 테이블처럼 쓴다.", "note": "7.51 부터. 정의한 이름은 뒤에서 꼭 써야 한다.", "example": "WITH +lh AS ( SELECT FROM sflight FIELDS connid, price\n                WHERE carrid = 'LH' )\nSELECT FROM +lh FIELDS connid INTO TABLE @DATA(lt)."}, "extra": []}, {"id": "app1", "part": "New Syntax 6 · 응용", "title": "응용 ① FILTER → REDUCE : 고르고 모으기", "sub": "LH 항공편만 골라 건수 · 합계 · 평균", "extra": [{"title": "코드와 결과", "sub": "결과 값은 예시 데이터 기준", "code": "DATA lt_sflight TYPE SORTED TABLE OF sflight\n     WITH NON-UNIQUE KEY carrid.\n\nSELECT FROM sflight\n  FIELDS *\n  INTO TABLE @lt_sflight.\n\nDATA(lt_lh) = FILTER #( lt_sflight WHERE carrid = 'LH' ).\n\nDATA(lv_cnt) = lines( lt_lh ).\nDATA(lv_sum) = REDUCE s_price( INIT s = 0\n                               FOR ls IN lt_lh\n                               NEXT s = s + ls-price ).\nDATA(lv_avg) = COND s_price( WHEN lv_cnt > 0\n                             THEN lv_sum / lv_cnt ).", "rtitle": "결과", "cols": ["변수", "값"], "rows": [["lt_lh", "4 줄"], ["lv_cnt", "4"], ["lv_sum", "7,822.00"], ["lv_avg", "1,955.50"]], "para": "FILTER 로 먼저 줄을 줄이고, REDUCE 로 남은 줄을 모아 값 하나를 만든다. 고르기와 모으기를 나누면 읽기 쉽다.\nFILTER 를 쓰려고 lt_sflight 를 carrid 정렬 키가 있는 SORTED TABLE 로 선언했다.\n평균은 COND 로 0 건일 때 나누기를 막았다. ELSE 가 없으므로 0 건이면 초기값 0 이다."}]}, {"id": "app2", "part": "New Syntax 6 · 응용", "title": "응용 ② VALUE FOR + LET + COND : 상태표 만들기", "sub": "항공편마다 빈 좌석과 상태를 계산", "extra": [{"title": "코드와 결과", "sub": "결과 값은 예시 데이터 기준", "code": "TYPES : BEGIN OF ty_out,\n          carrid TYPE s_carr_id,\n          connid TYPE s_conn_id,\n          free   TYPE i,\n          status TYPE string,\n        END OF ty_out,\n        tt_out TYPE STANDARD TABLE OF ty_out WITH EMPTY KEY.\n\nDATA(lt_out) = VALUE tt_out(\n  FOR ls IN lt_sflight\n  LET free = ls-seatsmax - ls-seatsocc IN\n  ( carrid = ls-carrid\n    connid = ls-connid\n    free   = free\n    status = COND #( WHEN free = 0  THEN '만석'\n                     WHEN free < 10 THEN '마감 임박'\n                     ELSE '여유' ) ) ).", "rtitle": "lt_out", "cols": ["CARRID", "CONNID", "FREE", "STATUS"], "rows": [["LH", "0400", "0", "만석"], ["LH", "0400", "8", "마감 임박"], ["LH", "2402", "35", "여유"], ["AA", "0017", "112", "여유"]], "para": "LET 으로 빈 좌석 free 를 줄마다 한 번만 계산하고, 같은 줄 안에서 free 칸과 COND 조건에 두 번 쓴다.\n예전에는 LOOP 안에서 변수에 계산하고, IF 로 상태를 정하고, APPEND 하던 일이다.\nLET 의 free 는 이 식 안에서만 산다. 같은 이름의 변수가 밖에 있으면 안 된다."}]}, {"id": "app3", "part": "New Syntax 6 · 응용", "title": "응용 ③ REDUCE 구조 결과 : 한 번 돌며 여러 값", "sub": "건수 · 좌석 · 점유율을 한 번에", "extra": [{"title": "코드와 결과", "sub": "결과 값은 예시 데이터 기준", "code": "TYPES : BEGIN OF ty_sum,\n          cnt TYPE i,\n          occ TYPE i,\n          max TYPE i,\n        END OF ty_sum.\n\nDATA(ls_sum) = REDUCE ty_sum(\n  INIT s = VALUE ty_sum( )\n  FOR ls IN lt_lh\n  NEXT s-cnt = s-cnt + 1\n       s-occ = s-occ + ls-seatsocc\n       s-max = s-max + ls-seatsmax ).\n\nDATA(lv_rate) = COND decfloat16(\n  LET x = ls_sum IN\n  WHEN x-max > 0 THEN x-occ * 100 / x-max ).", "rtitle": "결과", "cols": ["필드", "값"], "rows": [["ls_sum-cnt", "4"], ["ls_sum-occ", "1,253"], ["ls_sum-max", "1,600"], ["lv_rate", "78.3125"]], "para": "REDUCE 의 결과를 구조로 두면, 표를 한 번만 돌면서 건수와 합계 여러 개를 함께 낸다.\nINIT 에 VALUE ty_sum( ) 으로 빈 구조를 주고, NEXT 에서 구성요소마다 더한다.\n점유율은 LET 으로 결과에 짧은 이름을 붙이고, COND 로 0 으로 나누는 경우를 막았다."}]}, {"id": "app4", "part": "New Syntax 6 · 응용", "title": "응용 ④ FILTER … IN 표 + LET + REDUCE", "sub": "고른 항공사 여러 개의 좌석 점유율", "extra": [{"title": "코드와 결과", "sub": "결과 값은 예시 데이터 기준", "code": "DATA lt_carr TYPE SORTED TABLE OF scarr\n     WITH UNIQUE KEY carrid.\nlt_carr = VALUE #( ( carrid = 'AA' ) ( carrid = 'LH' ) ).\n\nDATA(lt_pick) = FILTER #( lt_sflight IN lt_carr\n                          WHERE carrid = carrid ).\n\nDATA(lv_rate) = COND decfloat16(\n  LET occ = REDUCE i( INIT n = 0 FOR l IN lt_pick\n                      NEXT n = n + l-seatsocc )\n      max = REDUCE i( INIT n = 0 FOR l IN lt_pick\n                      NEXT n = n + l-seatsmax ) IN\n  WHEN max > 0 THEN occ * 100 / max ).", "rtitle": "결과", "cols": ["변수", "값"], "rows": [["lt_carr", "AA , LH"], ["lt_pick", "6 줄"], ["occ", "1,620"], ["max", "2,000"], ["lv_rate", "81"]], "para": "FILTER … IN 은 다른 표에 있는 값으로 거른다. 거르는 표 lt_carr 에 정렬 키나 해시 키가 있어야 한다. WHERE carrid = carrid 는 두 표의 carrid 를 비교한다.\nLET 안에서 REDUCE 두 개로 좌석 합계를 구하고, IN 뒤의 COND 에서 점유율을 계산한다.\nocc, max 는 식 밖에서 쓸 수 없다. 화면에 보여 주려면 ③처럼 구조로 받는다."}]}, {"id": "cds01", "part": "CDS 1 · CDS의 문을 열다", "title": "CDS 란 : Code Pushdown 과 계보", "short": "CDS 란", "sub": "필수 · 계산은 DB 에서 , 정의는 ABAP 저장소에서", "lang": "CDS", "f1": {"name": "ABAP CDS - 데이터 정의", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions"], "st": "ABAP CDS", "syntax": "[@entity_annotation ...]\ndefine view entity cds_entity\n  as select from data_source\n{\n  element_list\n}\n[where cond]", "effect": "DB 에서 실행될 뷰를 ABAP 저장소 객체( DDL 소스 )로 정의한다.", "note": "CDS 는 ADT( Eclipse )에서 만들고 고친다. SE11 로는 만들 수 없다.", "example": "define view entity ZI_101\n  as select from scarr\n{\n  key carrid as Carrid\n}"}, "ptitle": "ABAP 에서 계산 ↔ CDS 에서 계산", "plabels": ["ABAP 에서 계산", "CDS 뷰"], "plang": ["", "CDS"], "pairs": [["SELECT FROM sflight\n  FIELDS carrid,\n         connid,\n         fldate,\n         seatsmax,\n         seatsocc\n  INTO TABLE @DATA(lt_sflight).\n\nLOOP AT lt_sflight INTO DATA(ls).\n  DATA(lv_free) = ls-seatsmax - ls-seatsocc.\nENDLOOP.", "define view entity ZI_102\n  as select from sflight\n{\n  key carrid              as Carrid,\n  key connid              as Connid,\n  key fldate              as Fldate,\n      seatsmax - seatsocc as SeatsFree\n}"]], "table": {"title": "CDS 계보", "cols": ["세대", "정의", "특징"], "rows": [["DDIC 뷰 ( SE11 )", "SE11 데이터베이스 뷰", "조인만 · 계산 · 연관 없음"], ["CDS DDIC 기반 뷰", "define view + @AbapCatalog.sqlViewName", "7.40 SP05 부터 · DDIC SQL 뷰가 하나 더 생김 · 이제 새로 만들지 않음 ( obsolete )"], ["CDS 뷰 엔티티", "define view entity", "7.55 부터 · SQL 뷰 없음 · 활성화가 빠름 · 지금의 표준"]]}, "para": "Code Pushdown 은 데이터를 ABAP 으로 가져와 LOOP 로 계산하던 일을 DB( HANA )에서 끝내는 것이다. 조인, 계산, 집계를 뷰에 정의하면 필요한 결과만 ABAP 으로 온다.\nCDS( Core Data Services )는 그 뷰를 ABAP 저장소 객체로 정의하는 언어다. 필드와 함께 의미( 어노테이션 )와 관계( 연관 )를 적는다.\nADT 에서 패키지 우클릭 → New → Other ABAP Repository Object → Core Data Services → Data Definition 으로 만든다. 활성화( Ctrl+F3 ) 뒤 F8( Data Preview )로 결과를 바로 본다."}, {"id": "cds02", "part": "CDS 1 · CDS의 문을 열다", "title": "DEFINE VIEW ENTITY : 기본 구조", "short": "DEFINE VIEW ENTITY", "sub": "필수 · 예전 define view 와 무엇이 다른가", "ver": "7.55", "lang": "CDS", "f1": {"name": "DEFINE VIEW ENTITY", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "DEFINE VIEW ENTITY"], "syntax": "[@entity_annotation ...]\ndefine [root] view entity cds_entity\n  [with parameters ...]\n  as select [distinct] from data_source [as alias]\n  [join ... | association ...]\n{\n  [key] element [as alias], ...\n}\n[where cond]\n[group by ...] [having ...]", "effect": "CDS 뷰 엔티티를 정의한다. 활성화하면 DB 에 뷰가 만들어지고, ABAP 에서는 엔티티 이름 하나로 조회한다.", "note": "DDIC SQL 뷰 이름( sqlViewName )이 없다. 클라이언트 처리는 자동이다.\n필드 사이는 콤마로 잇고, 마지막 필드 뒤에는 콤마를 쓰지 않는다.", "example": "define view entity ZI_101\n  as select from scarr\n{\n  key carrid   as Carrid,\n      carrname as Carrname\n}", "st": "ABAP CDS"}, "ptitle": "예전 define view ↔ define view entity", "plabels": ["define view ( 예전 )", "define view entity"], "plang": ["CDS", "CDS"], "pairs": [["@AbapCatalog.sqlViewName: 'ZV_101'\n@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '항공사'\ndefine view ZI_101_OLD\n  as select from scarr\n{\n  key carrid   as Carrid,\n      carrname as Carrname,\n      currcode as Currcode\n}", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '항공사'\ndefine view entity ZI_101\n  as select from scarr\n{\n  key carrid   as Carrid,\n      carrname as Carrname,\n      currcode as Currcode\n}"]], "table": {"title": "두 방식 비교", "cols": ["항목", "define view ( 예전 )", "define view entity"], "rows": [["SQL 뷰 이름", "@AbapCatalog.sqlViewName 필수 ( 16 자 )", "없음"], ["만들어지는 객체", "DDL 소스 + DDIC SQL 뷰", "DDL 소스 하나"], ["클라이언트 처리", "어노테이션으로 지정", "자동"], ["실습", "비교용으로만 본다", "모든 실습"]]}, "para": "view entity 는 define view entity 로 시작한다. 예전 define view 에 꼭 있던 @AbapCatalog.sqlViewName 이 없다.\n예전 방식은 활성화할 때 DDIC SQL 뷰가 하나 더 생겨 이름이 둘이었다. view entity 는 엔티티 하나뿐이라 활성화가 빠르고, MANDT 처리도 자동이다.\n위쪽 @ 줄은 엔티티 어노테이션, 중괄호 { } 안이 필드 목록이다. 예전 방식은 기존 시스템에서 읽을 수 있을 만큼만 알고, 새로 만들 때는 view entity 를 쓴다."}, {"id": "cds03", "part": "CDS 1 · CDS의 문을 열다", "title": "필드 · 키 · 식 : CASE · CAST · 함수 · $session", "short": "필드 · 키 · 식", "sub": "필수 · key , as , WHERE , 계산 필드", "lang": "CDS", "f1": {"name": "CDS - 요소 목록 · 식", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "SELECT, element_list"], "syntax": "{ [key] field [as Alias],\n  arith_expr                as Alias,\n  case ... end              as Alias,\n  cast( expr as dtype )     as Alias,\n  func( arg1, arg2 )        as Alias,\n  $session.system_date      as Alias }", "effect": "필드를 고르고, 이름을 붙이고, 계산 결과를 새 필드로 만든다.", "note": "key 필드는 목록 맨 앞에 이어서 쓴다.\n금액( CURR ) 필드는 통화 필드를 함께 두고 @Semantics.amount.currencyCode 로 가리킨다.", "example": "seatsmax - seatsocc as SeatsFree,", "st": "ABAP CDS"}, "code": [["ZI_102 : 항공편 + 계산 필드", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '항공편'\ndefine view entity ZI_102\n  as select from sflight\n{\n  key carrid                                 as Carrid,\n  key connid                                 as Connid,\n  key fldate                                 as Fldate,\n      @Semantics.amount.currencyCode: 'Currency'\n      price                                  as Price,\n      currency                               as Currency,\n      seatsmax                               as SeatsMax,\n      seatsocc                               as SeatsOcc,\n      seatsmax - seatsocc                    as SeatsFree,\n      case\n        when seatsocc >= seatsmax then 'F'   // 만석\n        when seatsocc = 0         then 'E'   // 예약 없음\n        else 'O'                             // 판매 중\n      end                                    as Status,\n      cast( connid as abap.char( 10 ) )      as ConnText,\n      concat_with_space( carrid, connid, 1 ) as FlightCode,\n      dats_days_between( $session.system_date,\n                         fldate )            as DaysToGo\n}\nwhere\n  seatsmax > 0"]], "table": {"title": "자주 쓰는 함수 · 변수", "cols": ["분류", "쓰는 법", "뜻"], "rows": [["문자", "concat( a, b ) · concat_with_space( a, b, n )", "잇기"], ["문자", "substring( s, pos, len ) · length( s )", "자르기 · 길이"], ["숫자", "div( a, b ) · division( a, b, dec ) · round( a, n )", "나누기 · 반올림"], ["날짜", "dats_days_between( d1, d2 ) · dats_add_days( d, n, 'NULL' )", "날짜 차이 · 날짜 더하기"], ["세션", "$session.system_date · $session.system_language · $session.user", "시스템 날짜 · 로그온 언어 · 사용자"]]}, "para": "key 는 줄을 구분하는 필드다. 목록 맨 앞에 이어서 적는다.\nas 로 별칭을 붙인다. 테이블 필드 이름( carrid )을 업무 이름( Carrid )으로 바꿔 두면 ABAP 과 화면에서 그 이름을 쓴다.\n계산, CASE, CAST, 함수, $session 변수로 새 필드를 만든다. WHERE 는 필드 목록 뒤에 쓴다.\n금액 price 는 통화 currency 와 짝이다. view entity 에서는 @Semantics.amount.currencyCode 로 같은 뷰 안의 통화 필드( 별칭 )를 가리킨다."}, {"id": "cds04", "part": "CDS 1 · CDS의 문을 열다", "title": "ABAP 에서 CDS 조회 : SELECT FROM 뷰", "short": "ABAP 에서 조회", "sub": "필수 · 리포트에서 CDS 를 테이블처럼", "f1": {"name": "SELECT FROM cds_entity", "tree": ["ABAP SQL", "SELECT", "FROM cds_entity"], "syntax": "SELECT FROM cds_entity[( p1 = a1 ... )]\n  FIELDS elem1,\n         elem2,\n         \\_assoc-elem\n  WHERE cond\n  INTO TABLE @DATA(itab).", "effect": "CDS 엔티티를 DB 테이블처럼 읽는다. 필드는 CDS 에서 붙인 별칭으로 부른다.", "note": "@AccessControl.authorizationCheck: #CHECK 인 뷰는 DCL 권한 조건이 자동으로 붙는다.", "example": "SELECT FROM zi_102\n  FIELDS Carrid,\n         SeatsFree\n  INTO TABLE @DATA(lt_free).", "st": "ABAP CDS"}, "ptitle": "ABAP 에서 계산 ↔ CDS 조회", "plabels": ["ABAP 에서 계산", "CDS 조회"], "pairs": [["SELECT FROM sflight\n  FIELDS carrid,\n         connid,\n         fldate,\n         seatsmax,\n         seatsocc\n  WHERE carrid = @p_carrid\n  INTO TABLE @DATA(lt_sflight).\n\nLOOP AT lt_sflight INTO DATA(ls).\n  DATA(lv_free) = ls-seatsmax - ls-seatsocc.\nENDLOOP.", "SELECT FROM zi_102\n  FIELDS Carrid,\n         Connid,\n         Fldate,\n         SeatsFree,\n         Status\n  WHERE Carrid = @p_carrid\n    AND SeatsFree > 0\n  INTO TABLE @DATA(lt_free)."]], "code": [["결과를 ALV 로", "TRY.\n    cl_salv_table=>factory( IMPORTING r_salv_table = DATA(lo_alv)\n                            CHANGING  t_table      = lt_free ).\n    lo_alv->display( ).\n  CATCH cx_salv_msg.\nENDTRY."]], "para": "ABAP SQL 에서 CDS 엔티티는 테이블과 똑같이 FROM 뒤에 쓴다. 필드는 CDS 에서 붙인 별칭( Carrid , SeatsFree )으로 부른다.\n계산은 뷰에 이미 들어 있으므로 ABAP 에는 LOOP 가 필요 없다. 같은 뷰를 여러 리포트가 함께 쓴다.\n리포트를 짜기 전에 ADT Data Preview( F8 )로 뷰 결과를 먼저 확인한다."}, {"id": "cds05", "part": "CDS 2 · 데이터를 잇다", "title": "JOIN : 두 테이블 잇기", "short": "JOIN", "sub": "필수 · inner join , left outer join", "lang": "CDS", "f1": {"name": "CDS - JOIN", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "SELECT, JOIN"], "syntax": "... from src1 as a\n      {inner | left outer | right outer} join src2 as b\n        on a.field = b.field", "effect": "두 데이터 소스를 ON 조건으로 이어 한 줄로 만든다.", "note": "필드는 별칭.필드 로 쓴다. ABAP SQL 의 ~ 대신 . 이다.", "example": "inner join scarr as c on c.carrid = f.carrid", "st": "ABAP CDS"}, "ptitle": "ABAP SQL JOIN ↔ CDS JOIN", "plabels": ["ABAP SQL", "CDS ZI_201"], "plang": ["", "CDS"], "pairs": [["SELECT FROM sflight AS f\n  INNER JOIN scarr AS c ON c~carrid = f~carrid\n  FIELDS f~carrid,\n         f~connid,\n         f~fldate,\n         c~carrname\n  INTO TABLE @DATA(lt_list).", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '항공편 + 항공사'\ndefine view entity ZI_201\n  as select from sflight as f\n    inner join scarr as c on c.carrid = f.carrid\n{\n  key f.carrid   as Carrid,\n  key f.connid   as Connid,\n  key f.fldate   as Fldate,\n      c.carrname as Carrname,\n      @Semantics.amount.currencyCode: 'Currency'\n      f.price    as Price,\n      f.currency as Currency,\n      f.seatsmax as SeatsMax,\n      f.seatsocc as SeatsOcc\n}"]], "para": "JOIN 은 ABAP SQL 과 같다. inner join 은 양쪽에 다 있는 줄만, left outer join 은 왼쪽 줄을 모두 남긴다.\n별칭과 필드는 . 으로 잇는다. ABAP SQL 의 ~ 와 다르다.\n한 번 정의한 조인은 이 뷰를 쓰는 모든 프로그램이 함께 쓴다. inner join 은 줄 수에 영향을 주므로 그 필드를 쓰지 않아도 실행된다. 필요할 때만 잇고 싶으면 다음 장의 association 을 쓴다."}, {"id": "cds06", "part": "CDS 2 · 데이터를 잇다", "title": "ASSOCIATION : 필요할 때만 잇기", "short": "ASSOCIATION", "sub": "필수 · 카디널리티 , $projection , 경로식 , 노출", "lang": "CDS", "f1": {"name": "CDS - ASSOCIATION", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "SELECT, ASSOCIATION"], "syntax": "association [min..max] to target as _Alias\n  on $projection.Elem = _Alias.Elem\n{\n  ...,\n  _Alias.Elem as Name,   // 경로식 : 이때 조인\n  _Alias                 // 노출 ( exposed )\n}", "effect": "대상 엔티티와의 관계를 정의한다. 경로식으로 쓰거나, 노출된 연관을 소비하는 쪽이 쓸 때만 조인된다.", "note": "연관 이름은 _ 로 시작하는 것이 관례다.\n$projection 으로 쓴 필드는 필드 목록에 있어야 한다. 카디널리티를 빼면 [0..1] 이다.", "example": "association [1..1] to ZI_101 as _Carrier\n  on $projection.Carrid = _Carrier.Carrid", "st": "ABAP CDS"}, "code": [["ZI_202 : 노선 + 연관", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '노선'\ndefine view entity ZI_202\n  as select from spfli\n  association [1..1] to ZI_101 as _Carrier\n    on $projection.Carrid = _Carrier.Carrid\n  association [0..*] to ZI_102 as _Flight\n    on  $projection.Carrid = _Flight.Carrid\n    and $projection.Connid = _Flight.Connid\n{\n  key carrid            as Carrid,\n  key connid            as Connid,\n      cityfrom          as Cityfrom,\n      cityto            as Cityto,\n      _Carrier.Carrname as Carrname,   // 경로식 → 조인\n      _Carrier,                        // 노출\n      _Flight                          // 노출\n}"], ["ABAP SQL 에서 경로식", "SELECT FROM zi_202\n  FIELDS Carrid,\n         Connid,\n         \\_Carrier-Carrname AS CarrierName\n  WHERE Cityfrom = 'FRANKFURT'\n  INTO TABLE @DATA(lt_route).", ""]], "table": {"title": "카디널리티와 경로식", "cols": ["표기", "뜻", "예"], "rows": [["[1..1] · [0..1]", "대상이 하나 ( to-one )", "노선 → 항공사"], ["[0..*] · [1..*]", "대상이 여러 개 ( to-many )", "노선 → 항공편"], ["_Carrier.Carrname", "CDS 안 경로식", "필드처럼 쓴다"], ["\\_Carrier-Carrname", "ABAP SQL 경로식", "노출된 연관만"], ["_Text[ 1: Language = … ].Name", "필터 경로식", "to-many 를 한 줄로 거름"]]}, "para": "association 은 '이 대상과 이렇게 이어진다' 는 관계만 적어 둔다. JOIN 과 달리 정의만으로는 조인되지 않는다.\n필드 목록에 _Carrier.Carrname 처럼 경로식을 쓰면 그때 조인이 된다. _Carrier 만 적어 노출하면, 이 뷰를 쓰는 쪽( 다른 CDS , ABAP SQL , OData )이 필요할 때 이어 읽는다.\n[1..1] 은 대상이 하나, [0..*] 는 여러 개다. to-many 경로를 필드로 쓰면 줄 수가 늘어나니 조심한다. 경로 뒤에 [ 조건 ] 을 붙이면 대상을 거른다 ( 필터 연관 · CDS 4 의 I_Product 예 )."}, {"id": "cds07", "part": "CDS 2 · 데이터를 잇다", "title": "집계 : GROUP BY · HAVING · 집계 함수", "short": "집계 GROUP BY", "sub": "필수 · count , sum , max , min , avg", "lang": "CDS", "f1": {"name": "CDS - GROUP BY · HAVING", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "GROUP BY, HAVING"], "syntax": "{\n  key field1,\n      count( * )      as Cnt,\n      sum( field2 )   as Total\n}\ngroup by\n  field1\n[having cond]", "effect": "같은 값끼리 묶어 줄 하나로 만들고, 집계 함수로 건수 · 합계를 낸다.", "note": "집계 함수가 아닌 필드는 모두 group by 에 쓴다. group by 에는 별칭이 아니라 데이터 소스 필드를 쓴다.", "example": "count( * ) as FlightCnt,", "st": "ABAP CDS"}, "ptitle": "LOOP 로 합계 ↔ CDS 집계", "plabels": ["ABAP LOOP GROUP BY", "CDS ZI_203"], "plang": ["", "CDS"], "pairs": [["LOOP AT lt_sflight INTO DATA(ls)\n     GROUP BY ( carrid = ls-carrid\n                connid = ls-connid )\n     INTO DATA(lg).\n  DATA(lv_occ) = REDUCE i( INIT s = 0\n                           FOR m IN GROUP lg\n                           NEXT s = s + m-seatsocc ).\nENDLOOP.", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '노선별 좌석 집계'\ndefine view entity ZI_203\n  as select from sflight\n{\n  key carrid          as Carrid,\n  key connid          as Connid,\n      count( * )      as FlightCnt,\n      sum( seatsocc ) as SeatsOcc,\n      max( seatsmax ) as SeatsMaxTop,\n      min( fldate )   as FirstDate\n}\ngroup by\n  carrid,\n  connid\nhaving\n  count( * ) > 1"]], "table": {"title": "집계 함수", "cols": ["함수", "결과"], "rows": [["count( * )", "줄 수"], ["count( distinct f )", "서로 다른 값의 수"], ["sum( f )", "합계"], ["max( f ) · min( f )", "최댓값 · 최솟값"], ["avg( f )", "평균"]]}, "para": "집계 뷰는 같은 값끼리 묶어 그룹마다 한 줄을 만든다. 집계 함수가 없는 필드는 모두 group by 에 적는다.\ngroup by 에는 별칭( Carrid )이 아니라 원래 필드( carrid )를 쓴다.\nwhere 는 묶기 전에 줄을 거르고, having 은 묶은 결과를 거른다. 위 예는 항공편이 2 건 이상인 노선만 남긴다."}, {"id": "cds08", "part": "CDS 2 · 데이터를 잇다", "title": "UNION : 결과 합치기", "short": "UNION", "sub": "심화 · 출발 도시와 도착 도시를 한 목록으로", "lang": "CDS", "f1": {"name": "CDS - UNION", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "UNION"], "syntax": "define view entity cds_entity\n  as select from src1 { ... }\nunion [all]\n  select from src2 { ... }", "effect": "두 SELECT 결과를 위아래로 붙인다.", "note": "모든 가지의 필드 개수 · 이름 · 순서 · key 가 같아야 하고 타입이 맞아야 한다. union 은 중복 줄을 없애고 union all 은 그대로 둔다.", "example": "union\n  select from spfli { ... }", "st": "ABAP CDS"}, "code": [["ZI_204 : 도시 목록", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '취항 도시'\ndefine view entity ZI_204\n  as select from spfli\n{\n  key cityfrom  as City,\n      countryfr as Country\n}\nunion\n  select from spfli\n{\n  key cityto    as City,\n      countryto as Country\n}"]], "para": "UNION 은 두 결과를 위아래로 합친다. 위 예는 출발 도시와 도착 도시를 한 목록으로 모은다.\n가지마다 필드 개수, 이름, 순서, key 를 같게 쓴다. 이름은 첫 가지의 별칭을 따른다.\nunion 은 같은 줄을 하나로 합치므로 도시가 한 번씩만 나온다. 중복을 그대로 두려면 union all 을 쓴다."}, {"id": "cds09", "part": "CDS 2 · 데이터를 잇다", "title": "매개변수 : WITH PARAMETERS", "short": "WITH PARAMETERS", "sub": "필수 · 기준일자로 조회하는 뷰", "lang": "CDS", "f1": {"name": "CDS - WITH PARAMETERS", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "WITH PARAMETERS"], "syntax": "define view entity cds_entity\n  with parameters\n    [@Environment.systemField: #SYSTEM_DATE]\n    p_name : dtype\n  as select from ...\n{ ... }\nwhere field = $parameters.p_name", "effect": "뷰를 읽을 때 값을 넘겨받는다. 뷰 안에서는 $parameters.이름 으로 쓴다.", "note": "@Environment.systemField: #SYSTEM_DATE 를 붙이면 ABAP SQL 에서 값을 생략할 때 시스템 날짜가 들어간다.", "example": "SELECT FROM zi_205( p_date = @sy-datum ) ...", "st": "ABAP CDS"}, "code": [["ZI_205 : 기준일 이후 항공편", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '기준일 이후 항공편'\ndefine view entity ZI_205\n  with parameters\n    @Environment.systemField: #SYSTEM_DATE\n    p_date : abap.dats\n  as select from sflight\n{\n  key carrid              as Carrid,\n  key connid              as Connid,\n  key fldate              as Fldate,\n      seatsmax - seatsocc as SeatsFree\n}\nwhere\n  fldate >= $parameters.p_date"], ["ABAP 에서 값 넘기기", "SELECT FROM zi_205( p_date = @sy-datum )\n  FIELDS Carrid,\n         Connid,\n         Fldate,\n         SeatsFree\n  INTO TABLE @DATA(lt_next).", ""]], "para": "WITH PARAMETERS 는 뷰에 입력 칸을 만든다. 기준일, 언어, 통화처럼 조회할 때마다 바뀌는 값을 받는다.\n뷰 안에서는 $parameters.p_date 로 쓰고, ABAP SQL 에서는 뷰 이름 뒤 괄호 안에 p_date = @값 으로 넘긴다.\nWHERE 에 값을 고정해 두는 것보다 재사용이 쉽다. 같은 뷰로 '오늘 이후' , '월말 이후' 를 모두 조회한다."}, {"id": "cds10", "part": "CDS 3 · 의미를 입히다", "title": "어노테이션 체계 : @ 로 의미 입히기", "short": "어노테이션 체계", "sub": "필수 · @AbapCatalog , @EndUserText , @Semantics 금액 · 수량", "lang": "CDS", "f1": {"name": "CDS - 어노테이션", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "ABAP CDS - Annotations"], "syntax": "@Domain.name: value               // 엔티티 앞\ndefine view entity cds_entity ...\n{\n  @Domain.name: value             // 필드 앞\n  field as Alias\n}", "effect": "뷰와 필드에 의미를 붙인다. 컴파일러, 권한 검사, OData · Fiori 같은 프레임워크가 이 값을 읽는다.", "note": "값에는 'text' , true , #ENUM , [ ... ] , { ... } 가 온다. 코드 완성( Ctrl+Space )으로 넣으면 이름 오타를 막는다.", "example": "@Semantics.amount.currencyCode: 'Currency'\nprice as Price,", "st": "ABAP CDS"}, "code": [["ZI_301 : 예약 ( 금액 · 수량 )", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '항공 예약'\n@Metadata.allowExtensions: true\ndefine view entity ZI_301\n  as select from sbook\n{\n  key carrid     as Carrid,\n  key connid     as Connid,\n  key fldate     as Fldate,\n  key bookid     as Bookid,\n      @Semantics.amount.currencyCode: 'Currency'\n      forcuram   as Amount,\n      forcurkey  as Currency,\n      @Semantics.quantity.unitOfMeasure: 'WeightUnit'\n      luggweight as Luggweight,\n      wunit      as WeightUnit\n}"], ["ZI_101 에 텍스트 연결", "define view entity ZI_101\n  as select from scarr\n{\n      @ObjectModel.text.element: [ 'Carrname' ]\n  key carrid   as Carrid,\n      @Semantics.text: true\n      carrname as Carrname,\n      currcode as Currcode\n}"]], "table": {"title": "주요 어노테이션", "cols":
