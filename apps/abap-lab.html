 ["어노테이션", "붙는 곳", "뜻"], "rows": [["@AbapCatalog.sqlViewName", "엔티티 ( 예전 뷰만 )", "SQL 뷰 이름 · view entity 에는 없음"], ["@AbapCatalog.viewEnhancementCategory", "엔티티", "확장( extend ) 허용 범위"], ["@AccessControl.authorizationCheck", "엔티티", "DCL 권한 검사 : #CHECK · #NOT_REQUIRED …"], ["@EndUserText.label", "엔티티 · 필드", "사람이 읽는 이름"], ["@Metadata.allowExtensions", "엔티티", "Metadata Extension 허용"], ["@Semantics.amount.currencyCode", "금액 필드", "통화 필드를 가리킴"], ["@Semantics.quantity.unitOfMeasure", "수량 필드", "단위 필드를 가리킴"], ["@ObjectModel.text.element", "키 필드", "설명 필드를 가리킴"], ["@UI.…", "필드 ( 주로 MDE )", "Fiori 화면 배치"]]}, "para": "어노테이션은 @도메인.이름: 값 형식이다. 엔티티 앞에 쓰면 뷰 전체, 필드 앞에 쓰면 그 필드에 붙는다.\n@AbapCatalog 은 DDIC · 활성화, @AccessControl 은 권한, @EndUserText 는 이름표, @Semantics 는 필드의 뜻, @ObjectModel 은 모델 관계, @UI 는 화면이다.\n금액은 통화, 수량은 단위와 꼭 짝지어 둔다. 그래야 소수 자릿수와 화면 표시가 맞는다."}, {"id": "cds11", "part": "CDS 3 · 의미를 입히다", "title": "VDM 계층 : Basic · Composite · Consumption", "short": "VDM 계층", "sub": "필수 · I_ 와 C_ 명명 관례", "lang": "CDS", "code": [["ZC_301 : 소비 뷰 ( ZI_201 위 )", "@AccessControl.authorizationCheck: #CHECK\n@EndUserText.label: '항공편 조회'\n@Metadata.allowExtensions: true\ndefine view entity ZC_301\n  as select from ZI_201\n{\n  key Carrid,\n  key Connid,\n  key Fldate,\n      Carrname,\n      @Semantics.amount.currencyCode: 'Currency'\n      Price,\n      Currency,\n      SeatsMax - SeatsOcc as SeatsFree\n}"]], "table": {"title": "VDM 계층", "cols": ["계층", "접두어", "하는 일", "이 과정의 예"], "rows": [["Basic", "I_", "테이블 하나 · 업무 이름으로 필드 정리", "ZI_101 , ZI_102"], ["Composite", "I_", "Basic 을 조인 · 연관으로 묶음", "ZI_201 , ZI_202"], ["Consumption", "C_", "앱 하나를 위한 모양 · UI · 권한", "ZC_301"], ["RAP 데이터 모델", "R_", "트랜잭션 BO 의 뿌리", "ZR_TRAVEL_###"]]}, "para": "VDM( Virtual Data Model )은 CDS 를 층으로 쌓는 SAP 의 설계 방식이다. 아래는 여러 앱이 함께 쓰고, 위로 갈수록 앱 하나에 맞춘다.\nBasic 은 테이블 하나를 업무 이름으로 감싸고, Composite 는 Basic 을 묶고, Consumption 은 화면 · 권한 · 매개변수처럼 앱마다 다른 것을 둔다. SAP 표준은 @VDM.viewType 어노테이션으로 계층을 적는다.\n고객 객체는 Z 를 붙여 ZI_ , ZC_ 로 쓴다. 아래 계층은 쓰는 곳이 많으니 함부로 바꾸지 않고, 바꿀 것은 C_ 에 둔다."}, {"id": "cds12", "part": "CDS 3 · 의미를 입히다", "title": "DCL 접근 제어 : DEFINE ROLE", "short": "DCL 접근 제어", "sub": "필수 · 조회만 해도 권한이 걸린다", "lang": "DCL", "f1": {"name": "DEFINE ROLE", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Access Control", "DEFINE ROLE"], "syntax": "@MappingRole: true\ndefine role role_name {\n  grant select on cds_entity\n    where cond;\n}", "effect": "CDS 엔티티를 읽을 때 자동으로 붙는 줄 단위 권한 조건을 정의한다.", "note": "뷰에 @AccessControl.authorizationCheck: #CHECK 를 둔다. 권한이 없으면 오류가 아니라 0 건이 나온다.", "example": "where ( Carrid ) = aspect pfcg_auth( S_CARRID, CARRID, ACTVT = '03' );", "st": "ABAP CDS"}, "ptitle": "AUTHORITY-CHECK ↔ DCL", "plabels": ["AUTHORITY-CHECK", "DCL 이 붙은 뷰"], "pairs": [["SELECT FROM sflight\n  FIELDS carrid,\n         connid\n  INTO TABLE @DATA(lt_sflight).\n\nLOOP AT lt_sflight INTO DATA(ls).\n  AUTHORITY-CHECK OBJECT 'S_CARRID'\n    ID 'CARRID' FIELD ls-carrid\n    ID 'ACTVT'  FIELD '03'.\n  IF sy-subrc <> 0.\n    DELETE lt_sflight INDEX sy-tabix.\n  ENDIF.\nENDLOOP.", "SELECT FROM zc_301\n  FIELDS Carrid,\n         Connid\n  INTO TABLE @DATA(lt_flight).\n\n\" DCL ZC_301 의 조건이 SELECT 에 자동으로 붙는다"]], "code": [["ZC_301 : 접근 제어 ( DCL )", "@EndUserText.label: '항공편 조회 권한'\n@MappingRole: true\ndefine role ZC_301 {\n  grant select on ZC_301\n    where ( Carrid ) = aspect pfcg_auth( S_CARRID, CARRID, ACTVT = '03' );\n}"]], "table": {"title": "조건 쓰는 법", "cols": ["종류", "예", "뜻"], "rows": [["PFCG 권한", "( Carrid ) = aspect pfcg_auth( S_CARRID, CARRID, ACTVT = '03' )", "사용자 역할의 권한 객체 값"], ["고정 값", "Currency = 'EUR'", "리터럴 조건"], ["조합", "cond1 and cond2", "여러 조건"]]}, "para": "DCL( Data Control Language )은 '이 뷰에서 이 사용자가 볼 수 있는 줄' 을 정한다. 프로그램에 AUTHORITY-CHECK 를 쓰지 않아도 SELECT 할 때 조건이 자동으로 붙는다.\npfcg_auth 는 권한 객체 S_CARRID 의 필드 CARRID 를 뷰 필드 Carrid 와 짝짓는다. ACTVT = '03' 은 조회 활동만 본다.\n권한이 없으면 오류가 아니라 0 건이다. 결과가 비면 데이터보다 권한을 먼저 확인한다."}, {"id": "cds13", "part": "CDS 3 · 의미를 입히다", "title": "Metadata Extension 과 @UI", "short": "Metadata Extension", "sub": "필수 · 화면 어노테이션은 뷰 밖에 따로", "lang": "DDLX", "f1": {"name": "ANNOTATE ENTITY", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Metadata Extensions", "ANNOTATE ENTITY"], "syntax": "@Metadata.layer: #CORE | #LOCALIZATION | #INDUSTRY | #PARTNER | #CUSTOMER\nannotate entity cds_entity with\n{\n  @annotation ...\n  Element;\n}", "effect": "뷰 밖의 별도 소스에서 필드에 어노테이션을 붙인다.", "note": "뷰에 @Metadata.allowExtensions: true 가 있어야 한다. 필드는 콤마가 아니라 세미콜론으로 끝낸다.", "example": "@UI.lineItem: [ { position: 10 } ]\nCarrid;", "st": "ABAP CDS"}, "code": [["ZC_301 : 메타데이터 확장", "@Metadata.layer: #CUSTOMER\n@UI.headerInfo: { typeName: '항공편',\n                  typeNamePlural: '항공편',\n                  title: { value: 'Carrname' } }\nannotate entity ZC_301 with\n{\n  @UI.facet: [ { id: 'General',\n                 type: #IDENTIFICATION_REFERENCE,\n                 label: '기본 정보',\n                 position: 10 } ]\n  @UI.lineItem: [ { position: 10 } ]\n  @UI.selectionField: [ { position: 10 } ]\n  @UI.identification: [ { position: 10 } ]\n  Carrid;\n\n  @UI.lineItem: [ { position: 20 } ]\n  @UI.identification: [ { position: 20 } ]\n  Connid;\n\n  @UI.lineItem: [ { position: 30 } ]\n  @UI.selectionField: [ { position: 20 } ]\n  Fldate;\n\n  @UI.lineItem: [ { position: 40 } ]\n  Carrname;\n\n  @UI.lineItem: [ { position: 50 } ]\n  SeatsFree;\n}"]], "table": {"title": "자주 쓰는 @UI", "cols": ["어노테이션", "화면 위치"], "rows": [["@UI.headerInfo", "객체 페이지 제목 · 목록 이름"], ["@UI.lineItem", "목록( List Report ) 열"], ["@UI.selectionField", "위쪽 필터 칸"], ["@UI.facet", "객체 페이지 구역"], ["@UI.identification", "#IDENTIFICATION_REFERENCE 구역 안의 필드"]]}, "para": "@UI 어노테이션을 뷰에 직접 쓰면 필드 목록이 길어지고 읽기 어렵다. Metadata Extension( DDLX )에 따로 두면 뷰는 데이터, MDE 는 화면만 맡는다.\nannotate entity ZC_301 with { } 안에 필드 이름과 어노테이션을 쓰고, 필드마다 세미콜론으로 끝낸다.\nposition 은 열과 칸의 순서다. 10 , 20 , 30 처럼 띄워 두면 나중에 사이에 넣기 쉽다."}, {"id": "cds14", "part": "CDS 3 · 의미를 입히다", "title": "조회 앱 : Service Definition · Binding · Preview", "short": "조회 앱 만들기", "sub": "필수 · ZUI_301 → ZUI_301_O4 → Fiori 미리보기", "lang": "SRVD", "code": [["ZUI_301 : 서비스 정의", "@EndUserText.label: '항공편 조회 서비스'\ndefine service ZUI_301 {\n  expose ZC_301 as Flight;\n}"]], "table": {"title": "만드는 순서", "cols": ["순서", "할 일", "객체"], "rows": [["1", "Service Definition 만들기 → expose", "ZUI_301"], ["2", "Service Binding 만들기 ( OData V4 - UI )", "ZUI_301_O4"], ["3", "바인딩 열기 → Publish", "로컬 서비스 엔드포인트"], ["4", "엔티티 Flight 선택 → Preview", "Fiori Elements 목록 · 객체 페이지"]]}, "para": "CDS 를 Fiori 앱으로 보려면 서비스 정의로 내보낼 엔티티를 고르고, 서비스 바인딩으로 OData 프로토콜을 정한다.\nPreview 를 누르면 코드 없이 Fiori Elements 목록이 뜬다. 열과 필터는 앞 장의 @UI 어노테이션대로 나온다.\nBDEF 가 없으니 조회만 된다. 만들기 · 고치기 · 지우기는 RAP 과정에서 동작( Behavior Definition )을 더한다."}, {"id": "cds15", "part": "CDS 4 · 실무로 연결하다", "title": "Released 표준 CDS 활용", "short": "표준 CDS 활용", "sub": "필수 · 테이블 대신 I_Product , I_Customer", "lang": "CDS", "code": [["ZR401 : 표준 제품 뷰 위에", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '제품 목록'\ndefine view entity ZR401\n  as select from I_Product\n{\n  key Product,\n      ProductType,\n      BaseUnit,\n      _Text[ 1: Language = $session.system_language ].ProductName as ProductName\n}"]], "table": {"title": "자주 쓰는 표준 뷰", "cols": ["표준 뷰", "내용", "예전에 읽던 테이블"], "rows": [["I_Product", "제품", "MARA"], ["I_ProductText", "제품 이름 ( 언어별 )", "MAKT"], ["I_Customer", "고객", "KNA1"], ["I_Supplier", "공급업체", "LFA1"], ["I_SalesOrder", "판매 오더 헤더", "VBAK"]]}, "para": "S/4HANA 에서는 MARA , KNA1 을 바로 읽기보다 SAP 이 제공하는 I_ 뷰를 쓴다. 필드 이름이 업무 이름이고, 텍스트와 연관이 이미 들어 있다.\nADT 에서 뷰를 열고 Properties → API State 에서 Released( C1 계약 )인지 확인한다. Released 뷰는 업그레이드에도 모양이 유지되고, ABAP Cloud 에서는 Released 객체만 쓸 수 있다.\n_Text[ 1: Language = $session.system_language ] 는 to-many 텍스트 연관을 '로그온 언어 한 줄' 로 거르는 필터 경로식이다."}, {"id": "cds16", "part": "CDS 4 · 실무로 연결하다", "title": "확장 : EXTEND VIEW ENTITY", "short": "EXTEND VIEW ENTITY", "sub": "심화 · 원본을 고치지 않고 필드 더하기", "lang": "CDS", "f1": {"name": "EXTEND VIEW ENTITY", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS Entity Extensions", "EXTEND VIEW ENTITY"], "syntax": "extend view entity cds_entity with\n{\n  data_source.field as Alias,\n  ...\n}", "effect": "원본 뷰 엔티티를 고치지 않고 필드 · 연관을 덧붙인다.", "note": "원본이 확장을 막지 않아야 한다( @AbapCatalog.viewEnhancementCategory ). 원본 데이터 소스의 필드는 이름( 또는 별칭 ).필드 로 쓴다.", "example": "spfli.distance as Distance", "st": "ABAP CDS"}, "code": [["ZI_202 확장 : 거리 필드", "extend view entity ZI_202 with\n{\n  @Semantics.quantity.unitOfMeasure: 'DistanceUnit'\n  spfli.distance as Distance,\n  spfli.distid   as DistanceUnit\n}"]], "table": {"title": "확장 방법", "cols": ["대상", "쓰는 문"], "rows": [["view entity", "extend view entity … with"], ["예전 define view", "extend view … with"], ["화면 어노테이션", "Metadata Extension ( annotate entity )"]]}, "para": "확장은 원본 뷰를 고치지 않고 필드를 더하는 방법이다. 표준 뷰나 다른 팀의 뷰에 고객 필드를 붙일 때 쓴다.\n확장 소스는 따로 활성화되고, 원본 뷰를 쓰는 모든 곳에서 더한 필드가 보인다.\n원본 데이터 소스는 spfli.distance 처럼 이름( 또는 별칭 )으로 가리킨다. 원본을 고칠 권한이 있으면 확장보다 원본 수정이 단순하다."}, {"id": "cds17", "part": "CDS 4 · 실무로 연결하다", "title": "Table Function ( AMDP ) 개념", "short": "Table Function", "sub": "심화 · CDS 로 안 되는 계산을 SQLScript 로", "lang": "CDS", "code": [["ZR402 : 테이블 함수 정의", "@EndUserText.label: '빈 좌석 ( Table Function )'\ndefine table function ZR402\n  returns\n  {\n    client    : abap.clnt;\n    carrid    : s_carr_id;\n    connid    : s_conn_id;\n    fldate    : s_date;\n    seatsfree : abap.int4;\n  }\n  implemented by method zcl_r402_tf=>get_data;"], ["ZCL_R402_TF : AMDP 구현", "CLASS zcl_r402_tf DEFINITION PUBLIC FINAL CREATE PUBLIC.\n  PUBLIC SECTION.\n    INTERFACES if_amdp_marker_hdb.\n    CLASS-METHODS get_data FOR TABLE FUNCTION zr402.\nENDCLASS.\n\nCLASS zcl_r402_tf IMPLEMENTATION.\n  METHOD get_data BY DATABASE FUNCTION FOR HDB\n                  LANGUAGE SQLSCRIPT\n                  OPTIONS READ-ONLY\n                  USING sflight.\n    RETURN SELECT mandt AS client,\n                  carrid,\n                  connid,\n                  fldate,\n                  seatsmax - seatsocc AS seatsfree\n             FROM sflight\n            WHERE mandt = SESSION_CONTEXT( 'CLIENT' );\n  ENDMETHOD.\nENDCLASS.", ""]], "para": "Table Function 은 CDS 엔티티의 모양( returns )만 CDS 로 정하고, 내용은 AMDP 메서드의 SQLScript 로 채운다.\nABAP SQL 에서는 일반 CDS 처럼 SELECT FROM zr402 로 읽는다. 클라이언트 필드( client )를 첫 필드로 두고, SQLScript 에서 SESSION_CONTEXT( 'CLIENT' ) 로 거른다.\n먼저 CDS 식 · 집계 · UNION 으로 되는지 보고, 그래도 안 될 때만 쓴다. SQLScript 는 HANA 전용이고 유지보수가 어렵다."}, {"id": "cds18", "part": "CDS 4 · 실무로 연결하다", "title": "CDS 기반 ALV : SALV IDA", "short": "SALV IDA", "sub": "심화 · 큰 데이터를 DB 에서 바로 보여 주기", "f1": {"name": "CL_SALV_GUI_TABLE_IDA", "tree": ["User Dialogs", "ALV", "SALV IDA"], "syntax": "cl_salv_gui_table_ida=>create_for_cds_view(\n    iv_cds_view_name = 'CDS_NAME' )->fullscreen( )->display( ).", "effect": "CDS 엔티티를 ALV 로 보여 준다. 화면에 필요한 줄만 DB 에서 읽는다.", "note": "SAP GUI 화면용이다. 정렬 · 필터 · 합계도 DB 에서 한다.", "example": "cl_salv_gui_table_ida=>create_for_cds_view( 'ZC_301' )->fullscreen( )->display( ).", "st": "ABAP CDS"}, "ptitle": "SALV ↔ SALV IDA", "plabels": ["CL_SALV_TABLE", "CL_SALV_GUI_TABLE_IDA"], "pairs": [["SELECT FROM zc_301\n  FIELDS *\n  INTO TABLE @DATA(lt_all).\n\nTRY.\n    cl_salv_table=>factory( IMPORTING r_salv_table = DATA(lo_alv)\n                            CHANGING  t_table      = lt_all ).\n    lo_alv->display( ).\n  CATCH cx_salv_msg.\nENDTRY.", "cl_salv_gui_table_ida=>create_for_cds_view( 'ZC_301' )->fullscreen( )->display( )."]], "para": "CL_SALV_TABLE 은 전체 데이터를 인터널 테이블로 읽은 뒤 보여 준다. 100 만 줄이면 100 만 줄이 메모리에 올라온다.\nSALV IDA 는 CDS 이름만 받는다. 화면에 보이는 만큼 DB 에서 읽고, 정렬 · 필터 · 합계도 DB 에 맡긴다.\nDCL 권한도 그대로 적용된다. 조회 리포트는 CDS + IDA 조합이 가장 짧다."}, {"id": "cds19", "part": "CDS 4 · 실무로 연결하다", "title": "성능 : SELECT-in-LOOP ↔ CDS 집계", "short": "성능 비교", "sub": "필수 · DB 를 몇 번 부르는가", "ptitle": "SELECT-in-LOOP ↔ CDS 집계", "plabels": ["SELECT-in-LOOP", "CDS 집계 뷰"], "pairs": [["SELECT FROM scarr\n  FIELDS carrid\n  INTO TABLE @DATA(lt_carr).\n\nLOOP AT lt_carr INTO DATA(ls_carr).\n  SELECT FROM sflight\n    FIELDS SUM( seatsocc ) AS occ\n    WHERE carrid = @ls_carr-carrid\n    INTO @DATA(lv_occ).\nENDLOOP.", "SELECT FROM zi_203\n  FIELDS Carrid,\n         SUM( SeatsOcc ) AS SeatsOcc\n  GROUP BY Carrid\n  INTO TABLE @DATA(lt_occ)."]], "table": {"title": "비교", "cols": ["항목", "SELECT-in-LOOP", "CDS 집계"], "rows": [["DB 호출", "항공사 수 + 1 번", "1 번"], ["옮기는 데이터", "줄마다 왕복", "결과만"], ["로직 위치", "리포트마다", "뷰 하나에 모아 재사용"]]}, "para": "LOOP 안의 SELECT 는 줄마다 DB 를 왕복한다. 항공사가 1,000 개면 1,001 번이다.\n집계를 CDS( ZI_203 )에 두면 DB 가 한 번에 묶어 계산하고 결과만 돌려준다.\n차이는 SQL 추적( ST05 )으로 직접 본다. DB 호출 횟수와 시간이 함께 보인다."}, {"id": "cds20", "part": "CDS 4 · 실무로 연결하다", "title": "RAP 로 넘어가기", "short": "RAP 로", "sub": "필수 · 조회 뷰에서 트랜잭션 BO 로", "lang": "CDS", "code": [["root 가 붙으면 BO 의 시작", "define root view entity ZR_TRAVEL_###\n  as select from ztravel_###\n{\n  key travel_uuid as TravelUUID,\n      description as Description\n      // 필드 목록 …\n}"]], "table": {"title": "조회 앱 → RAP 앱", "cols": ["지금까지 ( 조회 )", "RAP 에서 더하는 것"], "rows": [["define view entity", "define root view entity + composition"], ["ZC_ select 뷰", "as projection on + provider contract"], ["Metadata Extension @UI", "그대로 + 액션 버튼"], ["Service Definition · Binding", "그대로"], ["( 없음 )", "Behavior Definition + Behavior Pool : 만들기 · 고치기 · 지우기 · 검사"]]}, "para": "CDS 과정에서 만든 것은 읽기 전용 앱이다. 데이터 모델, 화면 어노테이션, 서비스는 RAP 에서도 그대로 쓴다.\nRAP 은 여기에 동작을 더한다. root 뷰로 BO 의 시작을 정하고, BDEF 로 만들기 · 고치기 · 검사 규칙을 적는다.\n다음 과정은 SAP 튜토리얼처럼 테이블 하나에서 마법사로 RAP 앱을 만들고, 만들어진 객체를 하나씩 읽는다."}, {"id": "rap01", "part": "RAP 1 · 구조", "title": "RAP 개요 : BO · 서비스 · 소비", "short": "RAP 개요", "sub": "필수 · 데이터 모델 + 동작 = 비즈니스 오브젝트", "ptitle": "예전 방식 ↔ RAP", "plabels": ["화면 + 함수 모듈", "RAP BO ( EML )"], "pairs": [["\" 화면( 모듈 풀 ) PAI 에서\nCALL FUNCTION 'Z_TRAVEL_CREATE'      \" 업무별 BAPI · 함수 모듈\n  EXPORTING\n    is_travel = ls_travel\n  TABLES\n    et_return = lt_return.\n\nCALL FUNCTION 'BAPI_TRANSACTION_COMMIT'\n  EXPORTING\n    wait = abap_true.", "MODIFY ENTITIES OF zr_travel_###\n  ENTITY Travel\n    CREATE FIELDS ( CustomerID BeginDate EndDate )\n    WITH VALUE #( ( %cid       = 'T1'\n                    CustomerID = '000001'\n                    BeginDate  = '20261201'\n                    EndDate    = '20261210' ) )\n  FAILED DATA(ls_failed)\n  REPORTED DATA(ls_reported).\n\nCOMMIT ENTITIES."]], "table": {"title": "RAP 의 층", "cols": ["층", "객체", "하는 일"], "rows": [["데이터 모델", "루트 뷰 엔티티 ZR_ ( CDS )", "BO 의 필드 · 부모 · 자식"], ["동작", "Behavior Definition + Behavior Pool", "만들기 · 고치기 · 지우기 · 검사 · 버튼"], ["프로젝션", "ZC_ 뷰 + 프로젝션 BDEF", "이 서비스에서 보일 필드 · 동작"], ["서비스", "Service Definition · Binding", "OData V2 · V4 로 내보내기"], ["소비", "Fiori Elements · Web API · EML", "화면 · 외부 시스템 · ABAP 코드"]]}, "para": "RAP( ABAP RESTful Application Programming Model )은 S/4HANA 와 ABAP Cloud 에서 업무 앱과 API 를 만드는 표준 방식이다.\n중심은 비즈니스 오브젝트( BO )다. CDS 로 데이터 모양을 정하고, BDEF 로 할 수 있는 동작을 정하고, 필요한 로직만 ABAP 클래스에 쓴다.\n같은 BO 를 Fiori 화면, OData API, ABAP 코드( EML )가 함께 쓴다. 화면마다 따로 짜던 저장 · 검사 로직이 BO 하나에 모인다."}, {"id": "rap02", "part": "RAP 1 · 구조", "title": "실습 흐름 : 테이블 → 마법사 → 미리보기", "short": "실습 흐름 ( 마법사 )", "sub": "필수 · SAP Developers 튜토리얼 순서 ( Travel )", "lang": "TABL", "code": [["ZTRAVEL_### : 테이블", "@EndUserText.label : '여행'\n@AbapCatalog.enhancement.category : #NOT_EXTENSIBLE\n@AbapCatalog.tableCategory : #TRANSPARENT\n@AbapCatalog.deliveryClass : #A\n@AbapCatalog.dataMaintenance : #RESTRICTED\ndefine table ztravel_### {\n  key client            : abap.clnt not null;\n  key travel_uuid       : sysuuid_x16 not null;\n  agency_id             : /dmo/agency_id;\n  customer_id           : /dmo/customer_id;\n  begin_date            : /dmo/begin_date;\n  end_date              : /dmo/end_date;\n  @Semantics.amount.currencyCode : 'ztravel_###.currency_code'\n  total_price           : /dmo/total_price;\n  currency_code         : /dmo/currency_code;\n  description           : /dmo/description;\n  overall_status        : /dmo/overall_status;\n  created_by            : abp_creation_user;\n  created_at            : abp_creation_tstmpl;\n  local_last_changed_by : abp_locinst_lastchange_user;\n  local_last_changed_at : abp_locinst_lastchange_tstmpl;\n  last_changed_at       : abp_lastchange_tstmpl;\n}"]], "table": {"title": "ADT 실습 순서", "cols": ["순서", "ADT 에서", "결과"], "rows": [["1", "패키지 만들기", "객체를 담을 곳"], ["2", "Database Table 만들기 → 활성화", "ZTRAVEL_###"], ["3", "테이블 우클릭 → Generate ABAP Repository Objects", "생성 마법사 시작"], ["4", "ABAP RESTful Application Programming Model: UI Service 선택", "객체 이름 확인 · 변경"], ["5", "Next → 확인 → Finish", "CDS · BDEF · 클래스 · 서비스가 한 번에 생김"], ["6", "서비스 바인딩 열기 → Publish", "OData V4 서비스 게시"], ["7", "엔티티 Travel 선택 → Preview", "Fiori Elements 앱에서 만들기 · 고치기"]]}, "para": "튜토리얼은 테이블 하나에서 시작한다. 마법사가 테이블 필드를 읽어 데이터 모델부터 서비스 바인딩까지 한 번에 만든다.\n키는 UUID( sysuuid_x16 ) 하나로 두었다. BDEF 의 numbering : managed 로 새 줄의 키를 프레임워크가 채운다. 튜토리얼 버전에 따라 travel_id 키 + early numbering 으로 나올 수 있다.\n마지막 5 개 관리 필드( created_by … last_changed_at )는 managed RAP 가 자동으로 채우고 잠금 · ETag 에 쓴다. ### 은 자기 번호로 바꾼다."}, {"id": "rap03", "part": "RAP 1 · 구조", "title": "생성된 객체 한눈에", "short": "생성된 객체", "sub": "필수 · 마법사가 만든 객체와 역할", "table": {"title": "생성 객체 ( 이름은 마법사 화면에서 정한다 )", "cols": ["객체", "예", "역할"], "rows": [["DB 테이블", "ZTRAVEL_###", "활성 데이터"], ["Draft 테이블", "ZTRAVEL_###_D", "편집 중인 임시 데이터"], ["루트 뷰 엔티티 ( 데이터 모델 )", "ZR_TRAVEL_###", "BO 의 필드 · 업무 이름"], ["Behavior Definition", "ZR_TRAVEL_###", "동작 : CRUD · draft · 잠금 · ETag"], ["Behavior Pool", "ZBP_R_TRAVEL_###", "동작 구현 ABAP 클래스"], ["프로젝션 뷰", "ZC_TRAVEL_###", "서비스에 보일 필드"], ["프로젝션 BDEF", "ZC_TRAVEL_###", "서비스에서 쓸 동작 ( use … )"], ["Metadata Extension", "ZC_TRAVEL_###", "@UI 화면 배치"], ["Service Definition", "ZUI_TRAVEL_###", "expose ZC_TRAVEL_###"], ["Service Binding", "ZUI_TRAVEL_O4_###", "OData V4 - UI"]]}, "para": "같은 이름의 객체가 여러 종류다. ZR_TRAVEL_### 은 CDS 이면서 BDEF 이고, ZC_TRAVEL_### 은 CDS , MDE , 프로젝션 BDEF 다. 객체 종류가 다르면 이름이 같아도 된다.\n읽는 순서는 아래에서 위로 : 테이블 → ZR_ ( 모델 · 동작 ) → ZC_ ( 프로젝션 ) → 서비스 정의 → 바인딩.\n마법사 결과는 출발점이다. 다음 장부터 객체를 하나씩 열어 읽고, 업무 로직( determination , validation , action )을 직접 더한다."}, {"id": "rap04", "part": "RAP 1 · 구조", "title": "데이터 모델 : 루트 뷰 엔티티 · COMPOSITION", "short": "데이터 모델", "sub": "필수 · define root view entity , 부모 · 자식", "lang": "CDS", "f1": {"name": "DEFINE ROOT VIEW ENTITY · COMPOSITION", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS View Entities", "ROOT, COMPOSITION"], "syntax": "define root view entity Root\n  as select from dbtab\n  composition [0..*] of Child as _Child\n{ ... _Child }\n\ndefine view entity Child\n  as select from dbtab2\n  association to parent Root as _Parent\n    on $projection.ParentKey = _Parent.ParentKey\n{ ... _Parent }", "effect": "BO 의 맨 위 엔티티( root )와 부모 · 자식 관계를 정의한다.", "note": "BO 에는 root 가 하나뿐이다. 자식은 composition 으로, 자식에서 부모는 association to parent 로 잇는다.", "example": "composition [0..*] of ZR_BOOKING_### as _Booking", "st": "ABAP RAP"}, "code": [["ZR_TRAVEL_### : 데이터 모델", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '여행'\ndefine root view entity ZR_TRAVEL_###\n  as select from ztravel_###\n{\n  key travel_uuid           as TravelUUID,\n      agency_id             as AgencyID,\n      customer_id           as CustomerID,\n      begin_date            as BeginDate,\n      end_date              as EndDate,\n      @Semantics.amount.currencyCode: 'CurrencyCode'\n      total_price           as TotalPrice,\n      currency_code         as CurrencyCode,\n      description           as Description,\n      overall_status        as OverallStatus,\n      @Semantics.user.createdBy: true\n      created_by            as CreatedBy,\n      @Semantics.systemDateTime.createdAt: true\n      created_at            as CreatedAt,\n      @Semantics.user.localInstanceLastChangedBy: true\n      local_last_changed_by as LocalLastChangedBy,\n      @Semantics.systemDateTime.localInstanceLastChangedAt: true\n      local_last_changed_at as LocalLastChangedAt,\n      @Semantics.systemDateTime.lastChangedAt: true\n      last_changed_at       as LastChangedAt\n}"], ["심화 : 자식 엔티티를 붙일 때", "// 루트 ZR_TRAVEL_### 에 추가 ( 필드 목록에 _Booking 도 노출 )\ncomposition [0..*] of ZR_BOOKING_### as _Booking\n\n// 자식 ZR_BOOKING_###\ndefine view entity ZR_BOOKING_###\n  as select from zbooking_###\n  association to parent ZR_TRAVEL_### as _Travel\n    on $projection.TravelUUID = _Travel.TravelUUID\n{\n  key booking_uuid as BookingUUID,\n      parent_uuid  as TravelUUID,\n      _Travel\n}"]], "table": {"title": "관리 필드 어노테이션", "cols": ["필드", "@Semantics", "채우는 때"], "rows": [["CreatedBy", "user.createdBy", "만들 때"], ["CreatedAt", "systemDateTime.createdAt", "만들 때"], ["LocalLastChangedBy", "user.localInstanceLastChangedBy", "이 줄이 바뀔 때"], ["LocalLastChangedAt", "systemDateTime.localInstanceLastChangedAt", "이 줄이 바뀔 때 ( ETag )"], ["LastChangedAt", "systemDateTime.lastChangedAt", "BO 어디든 바뀔 때 ( total ETag )"]]}, "para": "define root view entity 의 root 가 'BO 의 맨 위' 라는 표시다. BO 하나에 root 는 하나다.\n자식이 있으면 root 에 composition , 자식에 association to parent 를 쓴다. composition 은 '부모가 지워지면 자식도 지워지는' 소유 관계다.\n관리 필드에 @Semantics 를 붙이면 managed RAP 가 만든 사람 · 시각을 자동으로 채운다. 권한 검사는 여기서 #NOT_REQUIRED 로 두고, 실무에서는 DCL 을 만든 뒤 #CHECK 로 바꾼다."}, {"id": "rap05", "part": "RAP 1 · 구조", "title": "Projection View : AS PROJECTION ON", "short": "Projection View", "sub": "필수 · 서비스에 보일 모양만 고른다", "lang": "CDS", "f1": {"name": "AS PROJECTION ON", "root": "ABAP - Core Data Services ( ABAP CDS )", "tree": ["ABAP CDS - Data Definitions", "CDS Projection Views", "AS PROJECTION ON"], "syntax": "define root view entity ZC_entity\n  provider contract transactional_query\n  as projection on ZR_entity\n{\n  key Elem1,\n      Elem2,\n      _Child : redirected to composition child ZC_child\n}", "effect": "아래 BO( ZR_ )를 그대로 두고 서비스마다 보일 필드와 연관을 고른다.", "note": "트랜잭션 서비스의 루트 프로젝션은 provider contract transactional_query 를 쓴다.\n연관은 redirected to 로 프로젝션끼리 다시 잇는다.", "example": "as projection on ZR_TRAVEL_###", "st": "ABAP RAP"}, "code": [["ZC_TRAVEL_### : 프로젝션 뷰", "@AccessControl.authorizationCheck: #NOT_REQUIRED\n@EndUserText.label: '여행 ( 프로젝션 )'\n@Metadata.allowExtensions: true\ndefine root view entity ZC_TRAVEL_###\n  provider contract transactional_query\n  as projection on ZR_TRAVEL_###\n{\n  key TravelUUID,\n      AgencyID,\n      CustomerID,\n      BeginDate,\n      EndDate,\n      TotalPrice,\n      CurrencyCode,\n      Description,\n      OverallStatus,\n      LocalLastChangedAt\n}"]], "table": {"title": "select 뷰 ↔ projection 뷰", "cols": ["항목", "as select from", "as projection on"], "rows": [["조인 · 계산", "자유롭게", "고르기 · 이름 · 가상 요소 정도"], ["동작( BDEF )", "자기 BDEF", "프로젝션 BDEF ( use … )"], ["쓰는 곳", "데이터 모델 · 조회", "RAP 서비스"]]}, "para": "프로젝션 뷰는 BO 를 서비스에 맞게 '잘라 보여 주는' 층이다. 같은 ZR_ 위에 UI 용 , API 용 프로젝션을 따로 둘 수 있다.\nprovider contract transactional_query 는 '트랜잭션 서비스의 루트 프로젝션' 이라는 계약이다. 이 계약이 있으면 허용되는 문법을 엄격하게 검사한다.\nETag 에 쓰는 LocalLastChangedAt 은 프로젝션에도 남긴다. 화면에 안 보여도 동시 수정 검사에 필요하다."}, {"id": "rap06", "part": "RAP 1 · 구조", "title": "Metadata Extension : 목록 · 객체 페이지", "short": "Metadata Extension ( RAP )", "sub": "필수 · @UI.facet , lineItem , identification , 버튼", "lang": "DDLX", "code": [["ZC_TRAVEL_### : 메타데이터 확장", "@Metadata.layer: #CUSTOMER\n@UI.headerInfo: { typeName: '여행',\n                  typeNamePlural: '여행',\n                  title: { value: 'Description' } }\nannotate entity ZC_TRAVEL_### with\n{\n  @UI.facet: [ { id: 'Travel',\n                 purpose: #STANDARD,\n                 type: #IDENTIFICATION_REFERENCE,\n                 label: '여행',\n                 position: 10 } ]\n  @UI.hidden: true\n  TravelUUID;\n\n  @UI.lineItem: [ { position: 10 } ]\n  @UI.identification: [ { position: 10 } ]\n  @UI.selectionField: [ { position: 10 } ]\n  CustomerID;\n\n  @UI.lineItem: [ { position: 20 } ]\n  @UI.identification: [ { position: 20 } ]\n  BeginDate;\n\n  @UI.lineItem: [ { position: 30 } ]\n  @UI.identification: [ { position: 30 } ]\n  EndDate;\n\n  @UI.lineItem: [ { position: 40 },\n                  { type: #FOR_ACTION, dataAction: 'acceptTravel', label: '승인' } ]\n  @UI.identification: [ { position: 40 },\n                        { type: #FOR_ACTION, dataAction: 'acceptTravel', label: '승인' } ]\n  OverallStatus;\n}"]], "table": {"title": "목록 · 객체 페이지 위치", "cols": ["어노테이션", "Fiori Elements 화면"], "rows": [["@UI.headerInfo", "객체 페이지 제목"], ["@UI.lineItem", "List Report 열"], ["@UI.selectionField", "필터 칸"], ["@UI.facet + @UI.identification", "객체 페이지 구역과 그 안의 필드"], ["type: #FOR_ACTION", "액션 버튼 ( dataAction = BDEF 의 액션 이름 )"], ["@UI.hidden", "화면에서 숨김 ( UUID 키 )"]]}, "para": "CDS 과정의 MDE 와 같은 문법이다. RAP 앱은 객체 페이지에서 입력까지 하므로 @UI.facet 과 @UI.identification 이 함께 필요하다.\nUUID 키는 사람이 볼 값이 아니므로 @UI.hidden 으로 숨긴다.\ntype: #FOR_ACTION 은 버튼이다. dataAction 의 이름은 BDEF 의 액션 이름( acceptTravel )과 같아야 한다. 액션은 RAP 2 에서 만든다."}, {"id": "rap07", "part": "RAP 2 · 동작", "title": "Behavior Definition : managed · CRUD · 필드 제어", "short": "Behavior Definition", "sub": "필수 · 무엇을 할 수 있는 BO 인가", "lang": "BDEF", "f1": {"name": "DEFINE BEHAVIOR FOR", "root": "ABAP RESTful Application Programming Model", "tree": ["ABAP CDS - BDL", "Behavior Definitions", "DEFINE BEHAVIOR FOR"], "st": "ABAP RAP", "syntax": "managed | unmanaged [implementation in class ZBP_... unique];\nstrict ( 2 );\n[with draft;]\n\ndefine behavior for RootEntity [alias Name]\n[persistent table dbtab]\n[draft table draft_tab]\n[etag master Field]\n[lock master [total etag Field]]\n[authorization master ( global | instance )]\n{\n  create; update; delete;\n  field ( readonly | mandatory | ... ) F1, F2;\n  mapping for dbtab [corresponding] { Elem = field; ... }\n}", "effect": "BO 가 할 수 있는 동작과 규칙을 정의한다.", "note": "managed 는 저장을 프레임워크가, unmanaged 는 개발자가 한다. strict ( 2 ) 는 최신 규칙 검사를 켠다.", "example": "field ( readonly, numbering : managed ) TravelUUID;"}, "code": [["ZR_TRAVEL_### : 동작 정의 ( 마법사 결과를 줄인 것 )", "managed implementation in class zbp_r_travel_### unique;\nstrict ( 2 );\nwith draft;\n\ndefine behavior for ZR_TRAVEL_### alias Travel\npersistent table ztravel_###\ndraft table ztravel_###_d\netag master LocalLastChangedAt\nlock master total etag LastChangedAt\nauthorization master ( global )\n{\n  create;\n  update;\n  delete;\n\n  field ( readonly, numbering : managed ) TravelUUID;\n  field ( readonly ) CreatedBy, CreatedAt, LocalLastChangedBy,\n                     LocalLastChangedAt, LastChangedAt;\n  field ( mandatory ) CustomerID, BeginDate, EndDate;\n\n  draft action Edit;\n  draft action Activate optimized;\n  draft action Discard;\n  draft action Resume;\n  draft determine action Prepare;\n\n  mapping for ztravel_### corresponding\n  {\n    TravelUUID         = travel_uuid;\n    AgencyID           = agency_id;\n    CustomerID         = customer_id;\n    BeginDate          = begin_date;\n    EndDate            = end_date;\n    TotalPrice         = total_price;\n    CurrencyCode       = currency_code;\n    OverallStatus      = overall_status;\n    CreatedBy          = created_by;\n    CreatedAt          = created_at;\n    LocalLastChangedBy = local_last_changed_by;\n    LocalLastChangedAt = local_last_changed_at;\n    LastChangedAt      = last_changed_at;\n    // Description 은 이름이 같아 corresponding 이 짝짓는다\n  }\n}"]], "table": {"title": "managed ↔ unmanaged", "cols": ["항목", "managed", "unmanaged"], "rows": [["DB 저장", "프레임워크", "개발자 ( saver 클래스 lsc_ )"], ["트랜잭션 버퍼", "프레임워크", "개발자"], ["잘 맞는 곳", "새로 만드는 앱", "기존 BAPI · 함수 모듈을 감쌀 때"], ["저장 끼워 넣기", "with additional save · with unmanaged save", "-"]]}, "para": "첫 줄은 구현 방식이다. managed 는 읽기 · 쓰기 · 잠금 · 저장을 프레임워크가 하고, 개발자는 업무 로직만 쓴다. implementation in class 로 behavior pool 을 정한다.\ndefine behavior for 아래 줄은 엔티티 규칙이다. persistent table 은 저장할 테이블, field ( readonly ) 는 화면 · API 에서 못 바꾸는 필드, mandatory 는 꼭 넣어야 하는 필드다.\nmapping 은 CDS 이름( TravelUUID )과 테이블 이름( travel_uuid )을 짝짓는다. corresponding 을 붙이면 이름이 같은 필드는 적지 않아도 된다. draft · 잠금 · ETag 줄은 다음 장에서 본다."}, {"id": "rap08", "part": "RAP 2 · 동작", "title": "Draft · 잠금 · ETag", "short": "Draft · 잠금 · ETag", "sub": "심화 · 편집 중인 데이터와 동시 수정 지키기", "lang": "BDEF", "code": [["BDEF 머리 부분", "with draft;\n\ndefine behavior for ZR_TRAVEL_### alias Travel\npersistent table ztravel_###\ndraft table ztravel_###_d               // 편집 중 데이터\netag master LocalLastChangedAt          // 줄 단위 버전 ( 동시 수정 검사 )\nlock master total etag LastChangedAt    // 잠금 + draft 용 버전"]], "table": {"title": "개념 정리", "cols": ["개념", "BDEF", "하는 일"], "rows": [["Draft", "with draft · draft table", "편집 중 값을 draft 테이블에 저장 · 브라우저를 닫아도 남음"], ["잠금", "lock master", "Edit 하면 활성 인스턴스에 enqueue 잠금 · 다른 사용자는 편집 불가"], ["Total ETag", "total etag LastChangedAt", "잠금이 풀린 draft 를 다시 열 때 활성 데이터가 바뀌었는지 확인"], ["ETag", "etag master LocalLastChangedAt", "읽은 뒤 다른 사람이 바꿨으면 수정 거부 ( 낙관적 잠금 )"]]}, "para": "draft 를 켜면 Fiori 에서 편집( Edit )을 누를 때 활성 인스턴스가 draft 로 복사되고, lock master 가 활성 인스턴스에 잠금( enqueue )을 건다. 입력하는 동안 값은 draft 테이블에 쌓이고, 저장( Activate )하면 활성 테이블로 옮겨진다.\n이 잠금은 정해진 독점 시간 동안만 유지된다. 잠금이 풀린 뒤 draft 를 다시 열면( Resume ) total etag( LastChangedAt )로 그 사이 활성 데이터가 바뀌었는지 확인하고, 바뀌었으면 이어 쓰지 못하게 한다.\netag master 는 줄마다 버전 값을 둔다. 클라이언트가 읽은 버전과 지금 버전이 다르면 수정을 거부한다. 서비스로 내보내려면 프로젝션 BDEF 에 use etag 를 둔다."}, {"id": "rap09", "part": "RAP 2 · 동작", "title": "Projection BDEF : use", "short": "Projection BDEF", "sub": "필수 · 서비스에서 쓸 동작만 고르기", "lang": "BDEF", "f1": {"name": "PROJECTION BDEF - USE", "root": "ABAP RESTful Application Programming Model", "tree": ["ABAP CDS - BDL", "Projection BDEF", "USE"], "st": "ABAP RAP", "syntax": "projection;\nstrict ( 2 );\n[use draft;]\n\ndefine behavior for ZC_entity [alias Name]\n[use etag]\n{\n  use create;\n  use update;\n  use delete;\n  use action ActionName;\n}", "effect": "아래 BDEF 의 동작 중 이 서비스에서 쓸 것을 고른다.", "note": "use 하지 않은 동작은 서비스에서 보이지 않는다. use etag 를 빼면 ETag 검사가 서비스로 나가지 않는다.", "example": "use action acceptTravel;"}, "code": [["ZC_TRAVEL_### : 프로젝션 동작 정의", "projection;\nstrict ( 2 );\nuse draft;\n\ndefine behavior for ZC_TRAVEL_### alias Travel\nuse etag\n{\n  use create;\n  use update;\n  use delete;\n\n  use action Edit;\n  use action Activate;\n  use action Discard;\n  use action Resume;\n  use action Prepare;\n\n  use action acceptTravel;      // RAP 2 · Action 장에서 더함\n}"]], "para": "프로젝션 BDEF 는 새 동작을 만들지 않는다. 아래 BDEF 의 동작 중 이 서비스에서 쓸 것만 use 로 고른다.\ndraft BO 는 use draft 와 draft 액션( Edit , Activate , Discard , Resume , Prepare )을 use 해야 Fiori 에서 편집 · 저장이 된다.\nuse etag 는 마법사가 넣어 주지만 손으로 만들 때 빠뜨리기 쉽다. 빠지면 동시 수정 검사가 서비스에서 동작하지 않는다."}, {"id": "rap10", "part": "RAP 2 · 동작", "title": "Behavior Pool : 핸들러 클래스 구조", "short": "Behavior Pool", "sub": "필수 · ZBP_ 클래스와 lhc_ 로컬 클래스", "code": [["ZBP_R_TRAVEL_### : 글로벌 클래스", "CLASS zbp_r_travel_### DEFINITION PUBLIC ABSTRACT FINAL\n  FOR BEHAVIOR OF zr_travel_###.\nENDCLASS.\n\nCLASS zbp_r_travel_### IMPLEMENTATION.\nENDCLASS."], ["Local Types : lhc_travel", "CLASS lhc_travel DEFINITION INHERITING FROM cl_abap_behavior_handler.\n  PRIVATE SECTION.\n    METHODS get_global_authorizations FOR GLOBAL AUTHORIZATION\n      IMPORTING REQUEST requested_authorizations FOR Travel\n      RESULT result.\nENDCLASS.\n\nCLASS lhc_travel IMPLEMENTATION.\n  METHOD get_global_authorizations.\n    IF requested_authorizations-%create = if_abap_behv=>mk-on.\n      result-%create = if_abap_behv=>auth-allowed.\n    ENDIF.\n  ENDMETHOD.\nENDCLASS."]], "table": {"title": "핸들러 메서드 종류", "cols": ["BDEF", "메서드 선언", "언제 불리나"], "rows": [["authorization master ( global )", "FOR GLOBAL AUTHORIZATION", "작업 전 권한 확인"], ["determination … on modify", "FOR DETERMINE ON MODIFY", "값이 바뀐 직후"], ["determination … on save", "FOR DETERMINE ON SAVE", "저장 직전"], ["validation … on save", "FOR VALIDATE ON SAVE", "저장 직전 검사"], ["action", "FOR MODIFY … FOR ACTION", "버튼 · EML EXECUTE"], ["features : instance", "FOR INSTANCE FEATURES", "버튼 · 필드 켜고 끄기"]]}, "para": "BDEF 의 implementation in class 로 정한 클래스가 behavior pool 이다. 글로벌 클래스는 껍데기( ABSTRACT FINAL FOR BEHAVIOR OF )이고, 실제 코드는 Local Types 탭의 로컬 클래스에 쓴다.\nlhc_( local handler class )는 cl_abap_behavior_handler 를 상속하고 엔티티마다 하나씩 둔다. 저장 단계를 직접 다룰 때는 cl_abap_behavior_saver 를 상속한 lsc_ 클래스를 둔다.\n핸들러 안에서는 COMMIT WORK 나 COMMIT ENTITIES 를 쓰지 않는다. 저장 시점은 프레임워크가 정한다. BDEF 에 줄을 더하면 ADT 빠른 수정( Ctrl+1 )으로 메서드 껍데기를 만든다."}, {"id": "rap11", "part": "RAP 2 · 동작", "title": "Determination : 값 자동 채우기", "short": "Determination", "sub": "필수 · 만들 때 상태를 'O' 로", "code": [["BDEF 에 추가", "field ( readonly ) OverallStatus;\n\ndetermination setStatusOpen on modify { create; }", "BDEF"], ["lhc_travel : 선언", "METHODS setStatusOpen FOR DETERMINE ON MODIFY\n  IMPORTING keys FOR Travel~setStatusOpen."], ["lhc_travel : 구현", "METHOD setStatusOpen.\n  READ ENTITIES OF zr_travel_### IN LOCAL MODE\n    ENTITY Travel\n      FIELDS ( OverallStatus )\n      WITH CORRESPONDING #( keys )\n    RESULT DATA(lt_travel).\n\n  DELETE lt_travel WHERE OverallStatus IS NOT INITIAL.\n  IF lt_travel IS INITIAL.\n    RETURN.\n  ENDIF.\n\n  MODIFY ENTITIES OF zr_travel_### IN LOCAL MODE\n    ENTITY Travel\n      UPDATE FIELDS ( OverallStatus )\n      WITH VALUE #( FOR ls IN lt_travel\n                    ( %tky          = ls-%tky\n                      OverallStatus = 'O' ) ).\nENDMETHOD."]], "para": "determination 은 조건이 맞으면 프레임워크가 부르는 메서드다. on modify 는 값이 바뀐 직후, on save 는 저장 직전에 돈다. { create; } , { field BeginDate; } 처럼 언제 부를지 적는다.\nIN LOCAL MODE 는 자기 BO 안에서 읽고 쓸 때 쓴다. 권한 · 기능 제어를 건너뛰므로 readonly 인 OverallStatus 도 바꿀 수 있다.\nkeys 에는 바뀐 줄의 키가 들어온다. %tky 는 키에 draft 여부까지 담은 것이라 핸들러 안에서는 %tky 로 줄을 가리킨다."}, {"id": "rap12", "part": "RAP 2 · 동작", "title": "Validation : 저장 전 검사", "short": "Validation", "sub": "필수 · FAILED 와 REPORTED 로 알리기", "code": [["BDEF 에 추가", "validation validateDates on save { create; field BeginDate, EndDate; }\n\n// rap07 의 Prepare 줄을 이렇게 바꾼다 : draft 에서도 검사\ndraft determine action Prepare\n{\n  validation validateDates;\n}", "BDEF"], ["lhc_travel : 선언", "METHODS validateDates FOR VALIDATE ON SAVE\n  IMPORTING keys FOR Travel~validateDates."], ["lhc_travel : 구현", "METHOD validateDates.\n  READ ENTITIES OF zr_travel_### IN LOCAL MODE\n    ENTITY Travel\n      FIELDS ( BeginDate EndDate )\n      WITH CORRESPONDING #( keys )\n    RESULT DATA(lt_travel).\n\n  LOOP AT lt_travel INTO DATA(ls).\n    IF ls-EndDate < ls-BeginDate.\n      APPEND VALUE #( %tky = ls-%tky ) TO failed-travel.\n      APPEND VALUE #( %tky = ls-%tky\n                      %msg = new_message_with_text(\n                               severity = if_abap_behv_message=>severity-error\n                               text     = '종료일이 시작일보다 빠르다' )\n                      %element-EndDate = if_abap_behv=>mk-on )\n             TO reported-travel.\n    ENDIF.\n  ENDLOOP.\nENDMETHOD."]], "table": {"title": "검사 결과 알리기", "cols": ["응답", "넣는 것", "결과"], "rows": [["failed-travel", "%tky", "이 인스턴스는 저장하지 않는다"], ["reported-travel", "%tky · %msg · %element-필드", "화면 메시지 · 필드 강조"]]}, "para": "validation 은 저장 직전( on save )에 도는 검사다. 값을 바꾸지 않고, 틀린 줄을 failed 에 넣고 이유를 reported 에 넣는다.\n{ create; field BeginDate, EndDate; } 는 '만들 때와 두 날짜가 바뀔 때' 검사하라는 뜻이다.\ndraft BO 는 Prepare 에 validation 을 등록해야 draft 저장 전에도 메시지가 나온다. failed , reported 는 메서드에 자동으로 있는 응답 파라미터다."}, {"id": "rap13", "part": "RAP 2 · 동작", "title": "Action : 버튼 하나의 업무", "short": "Action", "sub": "필수 · 승인 버튼 acceptTravel", "code": [["BDEF 와 프로젝션 BDEF", "// ZR_TRAVEL_### ( 동작 정의 )\naction acceptTravel result [1] $self;\n\n// ZC_TRAVEL_### ( 프로젝션 동작 정의 )\nuse action acceptTravel;", "BDEF"], ["lhc_travel : 선언", "METHODS acceptTravel FOR MODIFY\n  IMPORTING keys FOR ACTION Travel~acceptTravel RESULT result."], ["lhc_travel : 구현", "METHOD acceptTravel.\n  MODIFY ENTITIES OF zr_travel_### IN LOCAL MODE\n    ENTITY Travel\n      UPDATE FIELDS ( OverallStatus )\n      WITH VALUE #( FOR key IN keys\n                    ( %tky          = key-%tky\n                      OverallStatus = 'A' ) ).\n\n  READ ENTITIES OF zr_travel_### IN LOCAL MODE\n    ENTITY Travel\n      ALL FIELDS WITH CORRESPONDING #( keys )\n    RESULT DATA(lt_travel).\n\n  result = VALUE #( FOR ls IN lt_travel\n                    ( %tky   = ls-%tky\n                      %param = ls ) ).\nENDMETHOD."]], "para": "action 은 CRUD 가 아닌 업무 동작이다. '승인' , '반려' , '복사' 처럼 버튼 하나로 하는 일을 정의한다.\nresult [1] $self 는 '처리한 자기 줄 하나를 돌려준다' 는 뜻이다. 돌려준 값으로 Fiori 화면이 새 상태를 바로 보여 준다.\n버튼이 보이려면 세 곳이 맞아야 한다. BDEF 의 action , 프로젝션 BDEF 의 use action , MDE 의 #FOR_ACTION dataAction 이름이다. 상태에 따라 버튼을 끄려면 ( features : instance ) 를 더한다."}, {"id": "rap14", "part": "RAP 2 · 동작", "title": "EML : READ · MODIFY · COMMIT ENTITIES", "short": "EML", "sub": "필수 · ABAP 코드에서 BO 읽고 쓰기", "f1": {"name": "READ ENTITIES · MODIFY ENTITIES · COMMIT ENTITIES", "tree": ["ABAP for RAP Business Objects", "ABAP EML"], "syntax": "READ ENTITIES OF bo [IN LOCAL MODE]\n  ENTITY entity\n    FIELDS ( f1 f2 ) | ALL FIELDS WITH keys\n  RESULT DATA(result)\n  [FAILED DATA(failed)] [REPORTED DATA(reported)].\n\nMODIFY ENTITIES OF bo [IN LOCAL MODE]\n  ENTITY entity\n    CREATE | UPDATE FIELDS ( f1 f2 ) WITH itab\n    | DELETE FROM itab | EXECUTE action FROM itab\n  [MAPPED DATA(mapped)] [FAILED DATA(failed)] [REPORTED DATA(reported)].\n\nCOMMIT ENTITIES [RESPONSE OF bo FAILED DATA(f) REPORTED DATA(r)].\nROLLBACK ENTITIES.", "effect": "ABAP 코드에서 RAP BO 를 읽고, 트랜잭션 버퍼를 바꾸고, 저장한다.", "note": "MODIFY 는 DB 가 아니라 버퍼를 바꾼다. COMMIT ENTITIES 를 해야 저장 순서가 돈다.\n핸들러( behavior pool ) 안에서는 COMMIT ENTITIES 를 쓰지 않는다.", "example": "COMMIT ENTITIES.", "st": "ABAP RAP"}, "code": [["ZCL_RAP_EML_READ_### : 읽기", "CLASS zcl_rap_eml_read_### DEFINITION PUBLIC FINAL CREATE PUBLIC.\n  PUBLIC SECTION.\n    INTERFACES if_oo_adt_classrun.\nENDCLASS.\n\nCLASS zcl_rap_eml_read_### IMPLEMENTATION.\n  METHOD if_oo_adt_classrun~main.\n    SELECT FROM zr_travel_###\n      FIELDS TravelUUID\n      INTO TABLE @DATA(lt_key)\n      UP TO 3 ROWS.\n\n    READ ENTITIES OF zr_travel_###\n      ENTITY Travel\n        FIELDS ( CustomerID OverallStatus )\n        WITH CORRESPONDING #( lt_key )\n      RESULT DATA(lt_travel)\n      FAILED DATA(ls_failed).\n\n    out->write( lt_travel ).\n  ENDMETHOD.\nENDCLASS."], ["ZCL_RAP_EML_CREATE_### : 만들고 저장", "CLASS zcl_rap_eml_create_### DEFINITION PUBLIC FINAL CREATE PUBLIC.\n  PUBLIC SECTION.\n    INTERFACES if_oo_adt_classrun.\nENDCLASS.\n\nCLASS zcl_rap_eml_create_### IMPLEMENTATION.\n  METHOD if_oo_adt_classrun~main.\n    MODIFY ENTITIES OF zr_travel_###\n      ENTITY Travel\n        CREATE FIELDS ( CustomerID BeginDate EndDate Description )\n        WITH VALUE #( ( %cid        = 'T1'\n                        CustomerID  = '000001'\n                        BeginDate   = '20261201'\n                        EndDate     = '20261210'\n                        Description = 'EML 로 만든 여행' ) )\n      MAPPED DATA(ls_mapped)\n      FAILED DATA(ls_failed)\n      REPORTED DATA(ls_reported).\n\n    COMMIT ENTITIES\n      RESPONSE OF zr_travel_###\n      FAILED DATA(ls_failed_c)\n      REPORTED DATA(ls_reported_c).\n\n    IF sy-subrc <> 0.\n      out->write( '저장 거부 : ls_reported_c 확인' ).\n    ELSE.\n      out->write( ls_mapped-travel ).\n    ENDIF.\n  ENDMETHOD.\nENDCLASS."]], "table": {"title": "EML 문", "cols": ["문", "하는 일"], "rows": [["READ ENTITIES", "버퍼 · DB 에서 읽기"], ["MODIFY ENTITIES … CREATE · UPDATE · DELETE", "버퍼 바꾸기 ( 아직 DB 아님 )"], ["MODIFY ENTITIES … EXECUTE action", "액션 실행"], ["COMMIT ENTITIES", "저장 순서 실행 → DB 반영"], ["ROLLBACK ENTITIES", "버퍼의 변경 버리기"], ["IN LOCAL MODE", "자기 BO 핸들러 안 : 권한 · 기능 제어 건너뛰기"]]}, "para": "EML( Entity Manipulation Language )은 ABAP 에서 RAP BO 를 읽고 바꾸는 문법이다. Fiori 가 OData 로 하는 일을 ABAP 코드로 한다.\nMODIFY 는 DB 가 아니라 트랜잭션 버퍼를 바꾼다. COMMIT ENTITIES 를 해야 저장 순서( 다음 장 )가 돌고 DB 에 반영된다.\n%cid 는 아직 키가 없는 새 줄에 붙이는 임시 이름이다. MAPPED 가 %cid 와 프레임워크가 채운 키( TravelUUID )를 짝지어 돌려준다."}, {"id": "rap15", "part": "RAP 2 · 동작", "title": "응답과 저장 순서 : FAILED · REPORTED · MAPPED", "short": "응답 · 저장 순서", "sub": "심화 · 실패는 어느 단계에서 , 어떻게 알려 주나", "code": [["버퍼 단계와 저장 단계", "MODIFY ENTITIES OF zr_travel_###\n  ENTITY Travel\n    UPDATE FIELDS ( EndDate )\n    WITH VALUE #( ( TravelUUID = lv_uuid1  EndDate = '20261205' )\n                  ( TravelUUID = lv_uuid2  EndDate = '20261205' ) )\n  FAILED DATA(ls_failed)\n  REPORTED DATA(ls_reported).\n\n\" 버퍼 단계 : 실패한 인스턴스만 ls_failed-travel 에 담긴다\nLOOP AT ls_failed-travel INTO DATA(ls_f).\n  \" ls_f-%fail-cause : not_found , locked , unauthorized …\nENDLOOP.\n\nCOMMIT ENTITIES\n  RESPONSE OF zr_travel_###\n  FAILED DATA(ls_failed_c)\n  REPORTED DATA(ls_reported_c).\n\nIF sy-subrc <> 0.\n  \" 저장 검사 실패 : 이번 COMMIT 은 DB 에 쓰지 않았다\n  ROLLBACK ENTITIES.\nENDIF."]], "table": {"title": "저장 순서 ( COMMIT ENTITIES )", "cols": ["단계", "하는 일", "실패하면"], "rows": [["finalize", "on save determination", "failed → 저장 거부"], ["check_before_save", "on save validation", "failed → 저장 거부"], ["cleanup_finalize", "앞 두 단계 실패 뒤 정리", "버퍼 변경은 남는다"], ["adjust_numbers", "late numbering 키 확정", "( late numbering 일 때 )"], ["save", "DB 쓰기 ( managed 는 프레임워크 )", "여기부터는 되돌릴 수 없다"], ["cleanup", "버퍼 비우기", "-"]]}, "para": "MODIFY 단계( interaction phase )의 실패는 인스턴스마다 따로다. 키가 없거나 잠겨 있는 줄만 FAILED 에 담기고, 같은 문의 다른 줄은 버퍼에 반영된다. 그래서 MODIFY 뒤에 FAILED 를 확인한다.\nCOMMIT ENTITIES 는 저장 순서( save sequence )를 돈다. finalize 나 check_before_save 에서 하나라도 실패하면 이번 저장 전체가 거부되어 DB 에 아무것도 쓰지 않고 sy-subrc = 4 가 된다.\n거부되어도 버퍼의 변경은 남아 있다. 고쳐서 다시 COMMIT 하거나 ROLLBACK ENTITIES 로 버린다. REPORTED 는 메시지( %msg ), MAPPED 는 새 줄의 %cid 와 키를 돌려준다."}, {"id": "rap16", "part": "RAP 3 · 서비스", "title": "Service Definition : EXPOSE", "short": "Service Definition", "sub": "필수 · 무엇을 내보낼까", "lang": "SRVD", "f1": {"name": "DEFINE SERVICE", "root": "ABAP RESTful Application Programming Model", "tree": ["Business Services", "Service Definition", "DEFINE SERVICE"], "st": "ABAP RAP", "syntax": "@EndUserText.label: 'text'\ndefine service service_name {\n  expose cds_entity [as Alias];\n}", "effect": "서비스로 내보낼 엔티티를 고른다.", "note": "프로토콜( OData V2 · V4 )과 용도( UI · Web API )는 서비스 바인딩에서 정한다.", "example": "expose ZC_TRAVEL_### as Travel;"}, "code": [["ZUI_TRAVEL_### : 서비스 정의", "@EndUserText.label: '여행 서비스'\ndefine service ZUI_TRAVEL_### {\n  expose ZC_TRAVEL_### as Travel;\n}"]], "table": {"title": "쓰는 규칙", "cols": ["규칙", "이유"], "rows": [["ZC_ 프로젝션을 expose", "ZR_ 은 여러 서비스가 함께 쓰는 바닥"], ["as Travel", "OData 엔티티 셋 이름이 된다"], ["자식 · 값 도움 뷰도 expose", "서비스 안에서 이어 읽으려면 함께 내보낸다"]]}, "para": "서비스 정의는 '이 서비스에 무엇이 들어가는가' 만 적는다. 프로토콜은 정하지 않는다.\n내보내는 것은 프로젝션( ZC_ )이다. 데이터 모델( ZR_ )을 바로 내보내지 않는다.\n자식 엔티티가 있으면 그 프로젝션도 expose 한다. 하나의 서비스 정의에 바인딩을 여러 개 걸 수 있다."}, {"id": "rap17", "part": "RAP 3 · 서비스", "title": "Service Binding : OData V2 · V4 · UI · Web API", "short": "Service Binding", "sub": "필수 · 같은 정의를 여러 방식으로", "table": {"title": "바인딩 유형", "cols": ["바인딩 유형", "쓰는 곳", "이름 예"], "rows": [["OData V4 - UI", "Fiori Elements 앱", "ZUI_TRAVEL_O4_###"], ["OData V2 - UI", "V2 기반 Fiori 앱", "ZUI_TRAVEL_O2_###"], ["OData V4 - Web API", "외부 시스템 연동 API ( UI 어노테이션 없이 )", "ZAPI_TRAVEL_O4_###"], ["OData V2 - Web API", "V2 API 연동", "ZAPI_TRAVEL_O2_###"]]}, "para": "서비스 바인딩은 서비스 정의를 어떤 프로토콜과 용도로 내보낼지 정한다. 같은 정의에 UI 용 , API 용 바인딩을 따로 만든다.\n바인딩을 만든 뒤 Publish 를 눌러야 서비스가 열린다. 온프레미스는 릴리스에 따라 /IWFND/V4_ADMIN 에서 서비스 그룹을 게시하는 단계가 더 있다( 튜토리얼 안내 ).\n이름에 용도( UI · API )와 버전( O2 · O4 )을 붙이면 목록에서 바로 구분된다. 새 앱은 OData V4 를 기본으로 한다."}, {"id": "rap18", "part": "RAP 3 · 서비스", "title": "Fiori Elements Preview 와 테스트", "short": "Preview · 테스트", "sub": "필수 · 만들기 → 편집 → 저장까지 확인", "table": {"title": "Preview 점검표", "cols": ["확인할 것", "기대 결과", "안 되면 볼 곳"], "rows": [["Go 로 목록 읽기", "줄이 보인다", "@UI.lineItem · DCL 권한"], ["Create", "새 줄 · OverallStatus = O", "determination setStatusOpen"], ["종료일 < 시작일로 저장", "오류 메시지 · EndDate 강조", "validation · Prepare 등록"], ["Edit 후 창 닫기 → 다시 열기", "draft 가 남아 이어서 편집", "with draft · use draft"], ["다른 사용자로 같은 줄 Edit", "잠겨 있다는 메시지", "lock master"], ["승인 버튼", "OverallStatus = A", "action · use action · dataAction"]]}, "para": "서비스 바인딩에서 엔티티 Travel 을 고르고 Preview 를 누르면 Fiori Elements 앱이 뜬다. 코드 없이 목록, 객체 페이지, 만들기 · 편집 · 삭제가 된다.\n위 점검표를 순서대로 돌리면 BDEF 와 핸들러의 동작을 모두 확인한다. 안 되는 항목은 오른쪽 열의 객체부터 본다.\n같은 확인을 EML 클래스( RAP 2 )로 코드에서도 할 수 있다. 반복 테스트는 ABAP Unit 으로 자 Open SQL", "groups": ["New Syntax 1 · 선언 · 생성", "New Syntax 2 · 변환 · 조건", "New Syntax 3 · 인터널 테이블", "New Syntax 4 · 문자열", "New Syntax 5 · Open SQL", "New Syntax 6 · 응용"]}, {"id": "cds", "name": "SAP ABAP CDS View", "sub": "view entity · 연관 · 어노테이션 · 접근 제어", "groups": ["CDS 1 · CDS의 문을 열다", "CDS 2 · 데이터를 잇다", "CDS 3 · 의미를 입히다", "CDS 4 · 실무로 연결하다"]}, {"id": "rap", "name": "SAP ABAP RAP", "sub": "BO · 동작 정의 · EML · 서비스", "groups": ["RAP 1 · 구조", "RAP 2 · 동작", "RAP 3 · 서비스"]}], "ckw": ["action", "all", "and", "annotate", "as", "aspect", "association", "authorization", "avg", "behavior", "by", "case", "cast", "child", "class", "composition", "contract", "corresponding", "count", "create", "define", "delete", "determination", "determine", "distinct", "draft", "else", "end", "entity", "etag", "expose", "extend", "field", "for", "from", "function", "global", "grant", "group", "having", "implementation", "implemented", "in", "inner", "instance", "is", "join", "key", "left", "lock", "managed", "mandatory", "mapping", "master", "max", "method", "min", "modify", "not", "null", "numbering", "of", "on", "optimized", "or", "outer", "parameters", "parent", "persistent", "pfcg_auth", "projection", "provider", "readonly", "redirected", "result", "returns", "right", "role", "root", "save", "select", "service", "strict", "sum", "table", "then", "to", "total", "transactional_query", "union", "unique", "unmanaged", "update", "use", "validation", "view", "when", "where", "with"]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const L = D.lessons, byId = Object.fromEntries(L.map(x => [x.id, x]));
const GROUPS = D.groups;
const COURSES = D.courses || [{ name: 'ABAP', groups: GROUPS }];
const inCourse = c => L.filter(x => c.groups.includes(x.part));

/* ---------- ABAP 색칠 ---------- */
const KW = new Set(D.kw);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hlLine(line) {
  if (/^\*/.test(line)) return '<span class="c">' + esc(line) + '</span>';
  let out = '', i = 0;
  const re = /('(?:[^']|'')*'|`[^`]*`|\|(?:[^|\\]|\\.)*\|?)|(".*$)|([A-Za-z_][\w~]*(?:-(?!>)[A-Za-z_][\w~]*)*)|(\d+)|(->|=>|[()\[\]#@.,:=+\-*\/<>])/g;
  let m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(i, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="s">' + t + '</span>';
    else if (m[2]) out += '<span class="c">' + t + '</span>';
    else if (m[3]) out += KW.has(m[0].toUpperCase()) && m[0] === m[0].toUpperCase() ? '<span class="k">' + t + '</span>' : t;
    else if (m[4]) out += '<span class="n">' + t + '</span>';
    else out += '<span class="p">' + t + '</span>';
    i = m.index + m[0].length;
  }
  return out + esc(line.slice(i));
}
/* CDS · DCL · DDLX · SRVD · BDEF · 테이블 정의 : 소문자 키워드 , // 주석 , @어노테이션 , #값 */
const CKW = new Set(D.ckw || []);
const LANGN = { CDS: 'DDL 편집기', DCL: 'DCL 편집기', DDLX: '메타데이터 확장', SRVD: '서비스 정의', BDEF: '동작 정의', TABL: '테이블 편집기' };
function hlDdl(line) {
  let out = '', i = 0, m;
  const re = /('(?:[^']|'')*')|(\/\/.*$)|(@[A-Za-z]\w*(?:\.[A-Za-z]\w*)+)|((?<![\w#])#[A-Za-z]\w*)|([A-Za-z_]\w*)|(\d+)|([()\[\]{}.,:;=+\-*\/<>])/g;
  while ((m = re.exec(line))) {
    out += esc(line.slice(i, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="s">' + t + '</span>';
    else if (m[2]) out += '<span class="c">' + t + '</span>';
    else if (m[3]) out += '<span class="a">' + t + '</span>';
    else if (m[4]) out += '<span class="n">' + t + '</span>';
    else if (m[5]) out += CKW.has(m[0]) ? '<span class="k">' + t + '</span>' : t;
    else if (m[6]) out += '<span class="n">' + t + '</span>';
    else out += '<span class="p">' + t + '</span>';
    i = m.index + m[0].length;
  }
  return out + esc(line.slice(i));
}
const code = (src, hi, lang) => '<pre class="code">' + src.split('\n').map((l, k) => '<span class="l' + (hi === k ? ' hi' : '') + '">' + (lang ? hlDdl(l) : hlLine(l)) + '</span>').join('') + '</pre>';
const editor = (title, src, cls = '', st, lang) => `<div class="win ${cls}"><div class="tb">${lang ? LANGN[lang] || lang : 'ABAP 편집기'} : ${esc(title)}<span class="ctl">— □ ✕</span></div>
  <div class="tool"><i>◀</i><i>▶</i><i>✓</i><i>▣</i></div>${code(src, undefined, lang)}<div class="st">${lang || 'ABAP'} | ${st || '활성'} | ${src.split('\n').length} 줄</div></div>`;
const paras = t => t.split('\n').map(p => '<p>' + esc(p) + '</p>').join('');
const alv = (title, cols, rows, mono = [0], onRow) => `<div class="win"><div class="tb">${esc(title)}<span class="ctl">— □ ✕</span></div>
  <div class="tool"><i>▼</i><i>Σ</i><i>⎙</i></div><div class="scroll"><table class="alv"><thead><tr>${cols.map(c => '<th>' + esc(c) + '</th>').join('')}</tr></thead>
  <tbody>${rows.map((r, k) => '<tr' + (onRow ? ' class="link" data-go="' + onRow[k] + '"' : '') + '>' + r.map((v, i) => '<td' + (mono.includes(i) ? ' class="mono"' : '') + '>' + esc(String(v)) + '</td>').join('') + '</tr>').join('')}</tbody></table></div>
  <div class="st">${rows.length} 건</div></div>`;

/* ---------- 목차 ---------- */
function drawTree(cur) {
  let h = `<a class="top${cur === 'home' ? ' on' : ''}" href="#home">시작 화면</a><a class="top${cur === 'f1' ? ' on' : ''}" href="#f1">F1 문법 사전</a>`;
  for (const c of COURSES) {
    h += '<div class="crs">' + esc(c.name) + '</div>';
    for (const g of c.groups) {
      h += '<h4>' + esc(g) + '</h4>';
      for (const x of L.filter(x => x.part === g)) h += `<a href="#${x.id}" class="${x.id === cur ? 'on' : ''}">${esc(x.short || x.title.split(' : ')[0])}</a>`;
    }
  }
  const t = document.getElementById('tree'); t.innerHTML = h;
  const on = t.querySelector('a.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
}

/* ---------- 화면 ---------- */
function f1Win(x) {
  const f = x.f1; if (!f) return '';
  const tree = ['ABAP 키워드 문서', f.root || 'ABAP - Reference', ...f.tree];
  return `<section><div class="win f1"><div class="tb">ABAP 키워드 문서 ( F1 )<span class="ctl">— □ ✕</span></div>
  <div class="tool"><i>◀</i><i>▶</i><i>⌂</i><i>⎙</i></div>
  <div class="body"><div class="side">${tree.map((t, i) => `<div class="${i === tree.length - 1 ? 'on' : ''}" style="padding-left:${6 + Math.min(i, 5) * 10}px">${i === tree.length - 1 ? '• ' : '▾ '}${esc(t)}</div>`).join('')}</div>
  <div class="doc"><div class="nm">${esc(f.name)}</div>
  <div class="lb">Syntax</div><div class="syn">${code(f.syntax, undefined, x.lang)}</div>
  <div class="lb">Effect · 효과</div><p>${esc(f.effect)}</p>
  ${f.note ? `<div class="lb">Note · 주의</div>${paras(f.note)}` : ''}
  <div class="lb">Example · 예</div><div class="exm">${code(f.example, undefined, x.lang)}</div></div></div>
  <div class="st">SAP | ABAP 키워드 문서 | ${x.ver ? esc(x.ver) + ' 이상' : f.st ? esc(f.st) : '기본 문법'}</div></div></section>`;
}
function lesson(x) {
  const i = L.indexOf(x), prev = L[i - 1], next = L[i + 1];
  let h = `<div><div class="crumb">${esc(x.part)}</div><h1>${esc(x.title)}${x.ver ? '<span class="chip">' + esc(x.ver) + '</span>' : ''}</h1><p class="sub">${esc(x.sub)}</p></div>`;
  h += f1Win(x);
  if (x.pairs && x.pairs.length) {
    const pl = x.plabels || ['예전 문법', '새 문법'], pg = x.plang || [];
    h += '<section><h2>' + esc(x.ptitle || '예전 문법 ↔ 새 문법') + '</h2>' + x.pairs.map(([a, b]) => `<div class="cmp">${editor(pl[0], a, 'old', undefined, pg[0])}<div class="arw">➜</div>${editor(pl[1], b, '', undefined, pg[1])}</div>`).join('') + '</section>';
  }
  if (x.para || x.ex) {
    h += '<section><h2>설명</h2>' + (x.ex ? `<div class="two"><div class="info">${paras(x.para)}</div>${editor('예', x.ex, '', undefined, x.lang)}</div>` : `<div class="info">${paras(x.para)}</div>`) + '</section>';
  }
  for (const [lb, src, lg] of (x.code || [])) h += `<section><h2>${esc(lb)}</h2>${editor(lb, src, '', undefined, lg === undefined ? x.lang : lg)}</section>`;
  if (x.table) h += `<section><h2>${esc(x.table.title)}</h2>${alv(x.table.title, x.table.cols, x.table.rows)}</section>`;
  for (const e of (x.extra || [])) {
    if (e.debug) { h += debugBlock(e); continue; }
    h += `<section><div><h2 style="margin:0">${esc(e.title)}</h2><p class="sub" style="margin:0">${esc(e.sub)}</p></div>
      <div class="two">${editor('ZNEW_SYNTAX', e.code)}${alv(e.rtitle, e.cols, e.rows)}</div><div class="info">${paras(e.para)}</div></section>`;
  }
  h += `<div class="pager">${prev ? `<a href="#${prev.id}">← ${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a href="#${next.id}">${esc(next.title)} →</a>` : ''}</div>`;
  return h;
}
const TRACE = [["1", "3,666.00", "0", "0 + 3,666", "3,666"], ["2", "3,666.00", "3,666", "+ 3,666", "7,332"], ["3", "245.00", "7,332", "+ 245", "7,577"], ["4", "245.00", "7,577", "+ 245", "7,822"], ["끝", "-", "", "결과 = s", "7,822"]];
const DSRC = "DATA(lv_sum) = REDUCE s_price(\n  INIT s = 0\n  FOR ls IN lt_lh\n  NEXT s = s + ls-price ).";
function debugBlock(e) {
  return `<section class="dbg"><div><h2 style="margin:0">${esc(e.title)}</h2><p class="sub" style="margin:0">${esc(e.sub)}</p></div>
  <div class="win"><div class="tb">ABAP 디버거 ( 세션 1 )<span class="ctl">— □ ✕</span></div>
  <div class="tool" style="gap:6px"><button class="btn pri" id="dstep">단계 F5</button><button class="btn" id="dreset">처음부터</button></div>
  <div class="two" style="padding:10px"><div><div class="lb" style="font-weight:700;font-size:13px;margin-bottom:4px">소스 코드</div><div class="win" id="dsrc">${code(DSRC, 1)}</div></div>
  <div id="dvar"></div></div><div class="st" id="dst">INIT : s = 0</div></div>
  <div class="info"><p>① INIT 이 s = 0 을 만든다. ② FOR 가 lt_lh 의 줄을 하나씩 ls 에 넣는다. ③ 줄마다 NEXT 가 s 를 바꾼다.</p><p>④ 줄이 끝나면 s 가 REDUCE 의 결과가 된다. INIT 변수가 여러 개여도 결과는 첫 번째 변수다.</p></div></section>`;
}
function wireDebug() {
  const b = document.getElementById('dstep'); if (!b) return;
  let k = 0;
  const draw = () => {
    const rows = TRACE.slice(0, k);
    document.getElementById('dvar').innerHTML = alv('변수 ( 회차별 )', ['회차', 'ls-price', 's ( 전 )', 'NEXT', 's ( 후 )'], rows.length ? rows : [['-', '-', '0', 'INIT', '0']], [1, 2, 4]);
    const tr = document.querySelectorAll('#dvar tbody tr'); if (k && tr[k - 1]) tr[k - 1].classList.add('on');
    document.getElementById('dsrc').innerHTML = code(DSRC, k === 0 ? 1 : k > 4 ? 0 : 3);
    document.getElementById('dst').textContent = k === 0 ? 'INIT : s = 0' : k > 4 ? '끝 : lv_sum = 7,822' : `${k} 회차 : NEXT 실행 → s = ${TRACE[k - 1][4]}`;
    b.disabled = k > 4;
  };
  b.onclick = () => { k = Math.min(k + 1, 5); draw(); };
  document.getElementById('dreset').onclick = () => { k = 0; draw(); };
  draw();
}
function home() {
  let h = `<div class="hero"><div class="crumb">SAP Easy Access</div><h1>SAP ABAP Programming</h1>
  <p class="sub">기초 · New Syntax · CDS View · RAP 네 과정을 F1 도움말 · 비교 · 예제로 익힌다. 예제는 SCARR · SFLIGHT · SPFLI 와 Travel 시나리오 기준.</p>
  <div class="legend"><span>오른쪽 위 검색창 ( F1 키 ) 으로 키워드를 찾는다</span><span>레슨마다 F1 화면 → 비교 → 설명 → 예제 순서</span><span>필수 · 심화 표시는 레슨 부제에</span></div></div>`;
  h += '<div class="grid courses">' + COURSES.map((c, k) => { const ls = inCourse(c); return `<a class="card" href="#${ls[0].id}"><span class="kind">과정 ${k + 1}</span><b>${esc(c.name)}</b><small>${esc(c.sub || '')}</small><span class="cnt">${ls.length} 레슨 · 첫 레슨 ${esc(ls[0].short || ls[0].title.split(' : ')[0])} →</span></a>`; }).join('') + '</div>';
  for (const c of COURSES) {
    h += `<h2 class="crs-h">${esc(c.name)}</h2>`;
    for (const g of c.groups) h += `<div class="grp">${esc(g)}</div><div class="grid">` + L.filter(x => x.part === g).map(x => `<a class="card" href="#${x.id}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></a>`).join('') + '</div>';
  }
  return h;
}
function dict(q = '') {
  const items = L.filter(x => x.f1);
  return `<div><div class="crumb">ABAP 키워드 문서</div><h1>F1 문법 사전</h1><p class="sub">키워드를 입력하면 바로 걸러진다. 줄을 누르면 해당 레슨의 F1 화면으로 간다.</p></div>
  <div class="dict"><input id="dq" type="search" placeholder="예 : LOOP, CORRESPONDING, @DATA" value="${esc(q)}" aria-label="사전 검색"></div><div id="dlist"></div>`;
}
function drawDict(q) {
  const s = q.trim().toLowerCase();
  const items = L.filter(x => x.f1 && (!s || (x.f1.name + ' ' + x.title + ' ' + x.f1.syntax).toLowerCase().includes(s)));
  document.getElementById('dlist').innerHTML = alv('문법 목록', ['문법', '분류', 'Syntax'], items.map(x => [x.f1.name, x.part, x.f1.syntax.split('\n')[0]]), [2], items.map(x => x.id));
  document.querySelectorAll('#dlist tr.link').forEach(r => r.onclick = () => location.hash = r.dataset.go);
}

/* ---------- 라우팅 ---------- */
function route() {
  const id = location.hash.slice(1) || 'home';
  const v = document.getElementById('view');
  if (id === 'f1') { v.innerHTML = dict(); drawDict(''); document.getElementById('dq').oninput = e => drawDict(e.target.value); }
  else if (byId[id]) { v.innerHTML = lesson(byId[id]); wireDebug(); }
  else v.innerHTML = home();
  drawTree(byId[id] ? id : id === 'f1' ? 'f1' : 'home');
  document.getElementById('tree').classList.remove('open');
  window.scrollTo(0, 0);
  try { if (byId[id]) localStorage.setItem('abap-lab-last', id); } catch (e) {}
}
window.addEventListener('hashchange', route);

/* ---------- 검색 ---------- */
const q = document.getElementById('q'), res = document.getElementById('res');
let hits = [], sel = 0;
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = L.filter(x => (x.title + ' ' + (x.f1 ? x.f1.name + ' ' + x.f1.syntax : '') + ' ' + x.sub).toLowerCase().includes(s))
    .sort((a, b) => (b.title.toLowerCase().startsWith(s) - a.title.toLowerCase().startsWith(s))).slice(0, 10);
  sel = 0;
  res.innerHTML = hits.length ? hits.map((x, k) => `<a href="#${x.id}" class="${k === 0 ? 'on' : ''}">${esc(x.title)}<small>${esc(x.f1 ? x.f1.syntax.split('\n')[0] : x.sub)}</small></a>`).join('') : '<a>찾는 문법이 없다. 다른 키워드로 찾아본다.</a>';
  res.hidden = false;
}
q.addEventListener('input', search);
q.addEventListener('keydown', e => {
  const a = res.querySelectorAll('a[href]');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!a.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : a.length - 1)) % a.length; a.forEach((n, k) => n.classList.toggle('on', k === sel)); }
  if (e.key === 'Enter' && hits[sel]) { location.hash = hits[sel].id; res.hidden = true; q.blur(); }
  if (e.key === 'Escape') { res.hidden = true; q.blur(); }
});
res.addEventListener('click', () => { res.hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'F1' || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) { e.preventDefault(); q.focus(); q.select(); } });
document.getElementById('menu').onclick = () => document.getElementById('tree').classList.toggle('open');

route();
</script>

<script id="lounge-read-js">
(function(){
 var MIN=13, MINCODE=13.5, BODY=15;
 function fix(root){
  var els=(root||document.body).querySelectorAll('*');
  for(var i=0;i<els.length;i++){var el=els[i];
   if(el.dataset.lr)continue;
   var t='';for(var c=el.firstChild;c;c=c.nextSibling)if(c.nodeType===3)t+=c.nodeValue;
   if(!t.trim()){continue}
   var cs=getComputedStyle(el),fs=parseFloat(cs.fontSize),ff=cs.fontFamily.toLowerCase();
   var mono=/mono|consolas|courier|menlo|d2coding/.test(ff);
   var min=mono?MINCODE:MIN;
   if(el.tagName==='P'||el.tagName==='LI'||el.tagName==='DD'){min=Math.max(min,BODY-1)}
   if(fs<min){el.style.fontSize=min+'px'}
   el.dataset.lr='1';
  }
 }
 var tm;function run(){clearTimeout(tm);tm=setTimeout(function(){fix()},30)}
 if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
 new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
 window.addEventListener('hashchange',run);
})();
</script>
