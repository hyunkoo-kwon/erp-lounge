<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP SD 실습 앱 — 주문에서 입금까지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#4E6A87; --brand:#0A6ED1; --brand2:#0854A0; --sel:#EBF5FE;
  --ink:#1D2D3E; --sub:#556B82; --line:#D9DEE3; --soft:#F5F6F7;
  --ok:#107E3E; --okbg:#F1FDF6; --ng:#BB0000; --ngbg:#FFEBEB; --warn:#E9730C;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,select,input{font:inherit;color:inherit}
.shell{background:var(--shell);color:#fff}
.shell .in{max-width:1100px;margin:0 auto;padding:16px 18px 14px}
.shell .eyebrow{font-size:12px;letter-spacing:.08em;color:#BCD4EA;font-weight:700}
.shell h1{margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.shell p{margin:2px 0 0;color:#D5E1EC;font-size:13px}
nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
nav .in{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;padding:12px 12px;text-decoration:none;color:var(--sub);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav a.on{color:var(--brand);border-color:var(--brand);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
section{display:none}
section.on{display:block}
h2{font-size:21px;margin:0 0 4px;font-weight:900;color:var(--shell)}
h3{font-size:16px;margin:22px 0 8px;color:var(--shell)}
.lead{color:var(--sub);margin:0 0 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.card h4{margin:0 0 6px;font-size:15px;color:var(--shell)}
.card p{margin:0;color:var(--sub);font-size:14px}
.card.sel{background:var(--sel);border-color:#B0D4F7}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--sel);color:var(--brand2);margin:0 4px 4px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--shell);color:#fff;font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
tr:hover td{background:#FAFBFC}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--sel)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],select{border:1px solid #B8C3CE;border-radius:6px;padding:6px 8px;width:100%;background:#fff}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:500}
/* flow */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;position:relative;text-align:left}
.step .n{font-size:12px;color:var(--brand);font-weight:700}
.step .t{font-weight:900;font-size:16px;color:var(--shell)}
.step .c{font-size:13px;color:var(--sub)}
.step.on{background:var(--sel);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.detail{margin-top:12px;border:1px solid #B0D4F7;background:var(--sel);border-radius:10px;padding:16px}
.detail h4{margin:0 0 6px;color:var(--shell)}
.detail dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}
.detail dt{color:var(--sub);font-weight:700}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* org tree */
.tree{font-size:14px}
.node{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff;margin:4px 0;cursor:pointer}
.node b{color:var(--shell)}
.node.on{border-color:var(--brand);background:var(--sel)}
.tree ul{list-style:none;margin:0;padding-left:26px;border-left:2px solid var(--line)}
.tree li{position:relative;padding-left:10px}
.tree li::before{content:"";position:absolute;left:-2px;top:20px;width:10px;border-top:2px solid var(--line)}
/* sim */
.sim{display:grid;grid-template-columns:300px 1fr;gap:16px}
.sim>*{min-width:0}
@media(max-width:820px){.sim{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h4{margin:0 0 10px;font-size:15px;color:var(--shell)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--brand);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:#fff;color:var(--brand);padding:6px;cursor:pointer;font-weight:700;font-size:13px}
.seg button.on{background:var(--brand);color:#fff}
.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stock div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.stock small{display:block;color:var(--sub);font-size:12px}
.stock b{font-size:18px;color:var(--shell);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.je{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.je .tw{overflow-x:auto}
.je .h{background:var(--soft);padding:6px 10px;font-size:13px;font-weight:700;color:var(--shell);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.je table td,.je table th{padding:5px 10px;font-size:13px}
.je table th{background:#fff;color:var(--sub);border-bottom:1px solid var(--line)}
.je .none{padding:8px 10px;font-size:13px;color:var(--sub)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--sub);margin-top:6px}
.empty{color:var(--sub);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.taccts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.tacc{border:1px solid var(--line);border-radius:8px;padding:8px}
.tacc .nm{font-weight:700;font-size:13px;color:var(--shell);text-align:center;border-bottom:2px solid var(--shell);padding-bottom:4px}
.tacc .sides{display:grid;grid-template-columns:1fr 1fr;font-size:13px}
.tacc .sides div{padding:4px 6px}
.tacc .sides div:first-child{border-right:2px solid var(--shell)}
.tacc .bal{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
/* pricing */
tr.subt td{background:var(--soft);font-weight:700;color:var(--shell)}
tr.stat td{color:var(--sub);font-style:italic}
tr.tot td{background:var(--sel);font-weight:900;color:var(--brand2)}
#ptb td{white-space:nowrap}
@media(max-width:480px){.stock b{font-size:15px}.stock div{padding:6px 8px}}
/* search */
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search input{flex:1 1 240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
/* lane */
.sp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lane{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:13px;min-width:110px}
.box b{display:block;color:var(--shell);font-size:14px}
.arr{color:var(--brand);font-weight:900}
/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.q .qt{font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.exp{font-size:13px;color:var(--sub);margin-top:6px;display:none}
.exp.on{display:block}
.score{position:sticky;top:52px;background:#fff;padding:8px 0;font-weight:700;color:var(--shell);z-index:5}
footer{max-width:1100px;margin:0 auto;padding:0 18px 30px;color:var(--sub);font-size:12px}
</style>
<style id="white-shell">/* WHITE SHELL — SAP Horizon 느낌 흰색 상단 */
.shell,body>header,nav.top{background:#fff!important;color:#1D2D3E!important;border-bottom:1px solid #E5E5E5!important;box-shadow:0 1px 3px rgba(0,0,0,.06)!important}
nav.top{box-shadow:0 0 0 100vmax #fff,0 1px 3px rgba(0,0,0,.06)!important}
body::before{background:#fff!important}
.shell *,body>header *,nav.top *{color:inherit}
.shell p,.shell small,body>header p,body>header small,nav.top small{color:#556B82!important}
.shell .eyebrow,body>header .eyebrow{color:#0A6ED1!important}
.shell h1,body>header h1,nav.top a.logo{color:#1D2D3E!important}
body>header h1 span,body>header h1 em,body>header em{color:#0A6ED1!important}
nav.top a{color:#0854A0!important}
.shell a{color:#0A6ED1!important}
.shell span.logo{color:#fff!important}
body>header .hw>button,body>header #home{background:#EEF2F6!important;color:#1D2D3E!important}
body>header .chip{background:#EEF2F6!important;color:#32363A!important}
body>header .chip.on{background:#0A6ED1!important;color:#fff!important}
body>header input{border:1px solid #CDD5DE!important}
#seg{background:#EEF2F6!important}
#seg button{color:#556B82!important}
#seg button b{color:inherit!important}
#seg button.on{background:#fff!important;color:#0854A0!important;box-shadow:0 1px 3px rgba(0,0,0,.12)!important}
</style>
</head>
<body>
<div class="shell"><div class="in">
  <div class="eyebrow">SAP SD · 실습 예시 · USD</div>
  <h1>SAP SD 실습 앱 — 주문에서 입금까지</h1>
  <p>단계마다 콘텐츠로 개념을 잡고, 이어지는 IMG 설정으로 직접 구현해 봄</p>
</div></div>
<nav><div class="in" id="nav"></div></nav>
<main id="main"></main>
<footer>곰선비의 ERP 실무노트 · 학습용 예시 데이터(가상 회사 기준, 금액은 가상)</footer>

<script src="course-kit.js"></script>
<script>
const TABS=[["intro", "0 소개"], ["org", "1 조직구조"], ["master", "2 기준정보"], ["o2c", "3 판매 흐름"], ["doct", "4 판매문서 유형"], ["price", "5 가격결정"], ["sim", "6 출하·청구 실습"], ["flow", "7 문서흐름"], ["acct", "8 계정결정·가용성"], ["dict", "T-code·테이블"], ["quiz", "퀴즈"]];
const CH=[{"k": "intro", "n": "0", "t": "SD 모듈 소개", "lead": "SD가 무엇을 하고, ERP 안에서 어디와 연결되는지 먼저 봅니다."}, {"k": "org", "n": "1", "t": "조직구조", "lead": "판매조직·유통경로·제품군·출하지점. 판매의 뼈대입니다."}, {"k": "master", "n": "2", "t": "기준정보", "lead": "고객(BP)·자재 판매 데이터·가격 조건. 주문이 자동으로 끌어오는 값입니다."}, {"k": "o2c", "n": "3", "t": "판매 프로세스 (O2C)", "lead": "견적 → 주문 → 출하 → 청구 → 수금. SD의 기본 흐름입니다."}, {"k": "doct", "n": "4", "t": "판매문서 유형", "lead": "주문 유형·품목 범주·일정라인 범주가 문서의 동작을 정합니다."}, {"k": "price", "n": "5", "t": "가격결정", "lead": "조건 유형·액세스 시퀀스·가격결정 절차로 가격이 계산됩니다."}, {"k": "sim", "n": "6", "t": "출하 · 청구 실습", "lead": "직접 출하와 청구를 처리하며 재고·회계 변화를 봅니다."}, {"k": "flow", "n": "7", "t": "문서흐름", "lead": "문서가 어떻게 이어지고 상태가 바뀌는지 봅니다."}, {"k": "acct", "n": "8", "t": "계정결정 · 가용성", "lead": "청구가 어떤 매출 계정으로 가는지, 재고 가용성은 어떻게 보는지 정합니다."}, {"k": "dict", "n": "", "t": "T-code · 테이블", "lead": ""}, {"k": "quiz", "n": "", "t": "퀴즈", "lead": ""}];
const IMG={"org": [["판매조직 정의 · 회사코드 할당", "OVX5 · OVX3", "Enterprise Structure > Definition / Assignment > Sales and Distribution", "UE00 → 회사코드 US00", "판매 책임 조직을 만들고 법인에 연결합니다."], ["유통경로 정의 · 할당", "OVXI · OVXK", "Enterprise Structure > Definition / Assignment > Sales and Distribution", "WH 도매 · RE 소매", "고객에게 가는 경로를 만듭니다."], ["제품군 정의 · 할당", "OVXB · OVXA", "Enterprise Structure > Definition > Logistics - General / Assignment > Sales and Distribution", "BI 자전거 · AS 부품", "제품 그룹 단위를 만듭니다."], ["판매영역 설정", "OVXG", "Enterprise Structure > Assignment > Sales and Distribution > Set up sales area", "UE00-WH-BI", "판매조직 + 유통경로 + 제품군 조합을 확정합니다."], ["판매조직·유통경로 → 플랜트", "OVX6", "Enterprise Structure > Assignment > Sales and Distribution > Assign sales organization - distribution channel - plant", "UE00-WH → DL00 · MI00", "어느 플랜트 재고를 팔 수 있는지 정합니다."], ["출하지점 정의 · 플랜트 할당", "OVXD · OVXC", "Enterprise Structure > Definition / Assignment > Logistics Execution", "MI00 출하지점 → 플랜트 MI00", "실제로 물건이 나가는 장소입니다."]], "master": [["고객 BP 그룹 · 번호 범위", "", "Cross-Application Components > SAP Business Partner > Business Partner > Basic Settings > Number Ranges and Groupings", "고객용 BP 그룹", "S/4HANA에서는 고객도 BP로 만들고 역할(FLCU00·FLCU01)을 붙입니다."], ["고객 계정 지정 그룹", "", "Sales and Distribution > Basic Functions > Account Assignment/Costing > Revenue Account Determination > Check Master Data Relevant For Account Assignment", "01 국내 · 02 해외", "고객 판매 데이터의 이 값이 8단계 매출 계정 결정에 쓰입니다."], ["인코텀즈 · 지급조건 확인", "", "Sales and Distribution > Master Data > Business Partners > Customers > Shipping / Billing Document", "FOB · 30일 지급", "고객 판매 데이터의 기본값을 준비합니다."]], "o2c": [["출하지점 결정", "OVL2", "Logistics Execution > Shipping > Basic Shipping Functions > Shipping Point and Goods Receiving Point Determination > Assign Shipping Points", "출하 조건 + 적재 그룹 + 플랜트 → 출하지점", "주문 품목마다 출하지점이 자동으로 정해집니다."], ["복사 제어 (주문 → 출하)", "VTLA", "Logistics Execution > Shipping > Copying Control > Specify Copy Control for Deliveries", "OR → LF", "주문 데이터가 출하 문서로  const r=(c,t,rate,v,k,cls)=>`<tr${cls?` class="${cls}"`:""}><td class="mono">${c}</td><td>${t}</td><td class="num">${rate}</td><td class="num">${fmt(v)}</td><td class="mono">${k}</td></tr>`;

  r("K004","자재 할인",`−${fmt(k4)} /EA`,d4,"ERS")+

/* ---------------- SIM ---------------- */
let S={};
function simReset(){
 S={st0:num("#s_st"),cost:num("#s_cost"),qty:num("#s_qty"),pr:num("#s_pr"),disc:num("#s_disc"),fr:num("#s_fr"),tx:num("#s_tax"),step:0,docs:[],acc:{},ar:0,cogs:0,rev:0};
 S.stQ=S.st0; S.stV=S.st0*S.cost;
 drawSim();
}
function post(title,lines,info){
 S.docs.push({title,lines,info});
 lines.forEach(l=>{const a=S.acc[l[0]]||(S.acc[l[0]]={d:0,c:0});if(l[1]>0)a.d+=l[1];else a.c+=-l[1];});
}
function simSO(){
 post("① 판매오더 VA01",[],`가격결정 · ATP · 신용 점검 수행. 소요량 ${S.qty} EA 전달 — 회계전표 없음`);
 S.step=1; drawSim();
}
function simPGI(){
 const k=Math.min(S.qty,S.stQ); if(k<S.qty){S.short=S.qty-k;}
 const map=S.stQ?S.stV/S.stQ:0, v=k*map; S.dq=k;
 if(k>0){post("② 출고 전기 PGI · 이동유형 601",[["GBB-VAX 매출원가",v,`${k} EA × 이동평균가 ${fmt(map)}`],["BSX 재고",-v,"재고 감소"]]);}
 else post("② 출고 전기 PGI · 이동유형 601",[],"가용 재고가 없어 출고 불가 — 기초 재고를 늘려서 다시 시도");
 S.stQ-=k; S.stV-=v; S.cogs+=v; S.step=2; drawSim();
}
function simBill(){
 const q=S.dq||0, gross=q*S.pr, disc=gross*S.disc/100, fr=q?S.fr:0, base=gross-disc+fr, tax=base*S.tx/100, tot=base+tax;
 if(!q){post("③ 대금청구 VF01",[],"출고 수량이 0이라 청구 대상 없음");S.step=3;drawSim();return;}
 const L=[["고객 AR (조정계정)",tot,"청구 합계 (세금 포함)"]];
 if(disc)L.push(["ERS 매출할인",disc,`K007 ${S.disc}%`]);
 L.push(["ERL 매출",-gross,`${q} EA × ${fmt(S.pr)} (PR00)`]);
 if(fr)L.push(["ERF 운임수익",-fr,"KF00"]);
 if(tax)L.push(["MWS 부가세(출력세)",-tax,`과세표준 ${fmt(base)} × ${S.tx}%`]);
 post("③ 대금청구 VF01 (F2)",L);
 S.ar+=tot; S.rev+=gross-disc; S.step=3; drawSim();
}
function simPay(){
 if(S.ar>0)post("④ 입금 F-28",[["은행",S.ar,"고객 입금"],["고객 AR (조정계정)",-S.ar,"미결항목 반제"]]);
 else post("④ 입금 F-28",[],"반제할 미결 채권 없음");
 S.ar=0; S.step=4; drawSim();
}
function drawSim(){
 const map=S.stQ?S.stV/S.stQ:0, gm=S.rev-S.cogs;
 $("#stk").innerHTML=`<div><small>재고 수량</small><b>${S.stQ.toLocaleString()} EA</b></div><div><small>재고 금액 USD</small><b>${fmt(S.stV)}</b></div><div><small>이동평균가</small><b>${fmt(map)}</b></div>
 <div><small>미결 채권 AR</small><b>${fmt(S.ar)}</b></div><div><small>순매출 (ERL−ERS)</small><b>${fmt(S.rev)}</b></div><div><small>매출총이익${S.rev?` ${(gm/S.rev*100).toFixed(1)}%`:""}</small><b style="color:${gm<0?'var(--ng)':'var(--shell)'}">${fmt(gm)}</b></div>`;
 $("#b_so").disabled=S.step!=0;$("#b_pgi").disabled=S.step!=1;$("#b_bill").disabled=S.step!=2;$("#b_pay").disabled=S.step!=3;
 $("#jes").innerHTML=S.docs.length?S.docs.map(j=>`<div class="je"><div class="h"><span>${j.title}</span></div>${j.lines.length?`<div class="tw"><table><tr><th>계정</th><th class="num">차변</th><th class="num">대변</th><th>근거</th></tr>${j.lines.map(l=>`<tr><td>${l[0]}</td><td class="num">${l[1]>0?fmt(l[1]):""}</td><td class="num">${l[1]<0?fmt(-l[1]):""}</td><td style="color:var(--sub)">${l[2]}</td></tr>`).join("")}</table></div>`:`<div class="none">${j.info}</div>`}</div>`).join(""):`<div class="empty">왼쪽 값을 정하고 ① 판매오더부터 누름</div>`;
 const keys=Object.keys(S.acc);
 $("#tacc").innerHTML=keys.length?keys.map(k=>{const a=S.acc[k],b=a.d-a.c;return `<div class="tacc"><div class="nm">${k}</div><div class="sides"><div class="num">${a.d?fmt(a.d):""}</div><div class="num">${a.c?fmt(a.c):""}</div></div><div class="bal">잔액 ${b>=0?"차":"대"} ${fmt(Math.abs(b))}</div></div>`}).join(""):`<div class="note">전표가 생기면 계정별 누계가 보임</div>`;
 const msg={0:"오더 전",1:"오더 완료 — 아직 회계 영향 없음",2:S.short?`PGI 완료 — 재고 부족으로 ${S.short} EA 미출고`:"PGI 완료 — 재고 감소, 매출원가 인식",3:"청구 완료 — 매출·채권·세금 인식",4:"입금 완료 — 고객 AR 잔액 0"};
 $("#simmsg").textContent=msg[S.step];
}

const R={intro:[renderIntro],o2c:[renderO2C,()=>o2cDetail(0)],org:[renderOrg,()=>orgDetail("so")],master:[renderMaster],price:[renderPrice,drawPrice],sim:[renderSim,()=>simReset()],flow:[renderFlow],doct:[renderDoct,drawDoct],acct:[renderAcct],dict:[renderDict,drawDict],quiz:[renderQuiz,drawScore]};
$("#nav").innerHTML=TABS.map(t=>`<a href="#${t[0]}" data-t="${t[0]}">${t[1]}</a>`).join("");
function go(){
 let t=location.hash.slice(1); if(!R[t]) t="intro";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t==t));
 $("#main").innerHTML=`<section class="on">${CK.wrap(CH,IMG,t,R[t][0]())}</section>`;
 if(R[t][1]) R[t][1]();
 const a=document.querySelector(`nav a[data-t="${t}"]`); if(a) a.scrollIntoView({inline:"center",block:"nearest"});
}
window.addEventListener("hashchange",()=>{go();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
 const el=e.target.closest("button,.node"); if(!el) return;
 if(el.classList.contains("step")){document.querySelectorAll(".step").forEach(s=>s.classList.remove("on"));el.classList.add("on");o2cDetail(+el.dataset.i);}
 else if(el.classList.contains("node")) orgDetail(el.dataset.k);
 else if(el.id=="p_reset"){go();}
 else if(el.id=="b_reset") simReset();
 else if(el.id=="b_so") simSO(); else if(el.id=="b_pgi") simPGI(); else if(el.id=="b_bill") simBill(); else if(el.id=="b_pay") simPay();
 else if(el.closest("#dtc")){dtF=el.dataset.c;document.querySelectorAll("#dtc .chip").forEach(c=>c.classList.toggle("on",c===el));drawDoct();}
 else if(el.closest("#dc")){dictF=el.dataset.c;document.querySelectorAll("#dc .chip").forEach(c=>c.classList.toggle("on",c===el));drawDict();}
 else if(el.classList.contains("opt")){const qi=+el.dataset.q,oi=+el.dataset.o;if(qi in qs)return;const ok=oi==QZ[qi][2];qs[qi]=ok;
  document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b=>{if(+b.dataset.o==QZ[qi][2])b.classList.add("ok");else if(b===el)b.classList.add("ng");});
  $("#e"+qi).classList.add("on");drawScore();}
 else if(el.id=="qreset") go();
});
document.addEventListener("input",e=>{const id=e.target.id;if(id=="dtq")drawDoct();else if(id=="dq")drawDict();else if(id.startsWith("p_"))drawPrice();});
go();
</script>

<script id="lounge-read-js">
(function(){
 var MIN=13, MINCODE=13.5, BODY=15;
 function fix(root){
  var els=(root||document.body).querySelectorAll('*');
  for(var i=0;i<els.length;i++){var el=els[i];
   if(el.dataset.lr)continue;
   var t='';for(var c=el.firstChild;c;c=c.nextSibling)if(c.nodeType===3)t+=c.nodeValue;
   if(!t.trim()){continue}
   var cs=getComputedStyle(el),fs=parseFloat(cs.fontSize),ff=cs.fontFamily.toLowerCase();
   var mono=/mono|consolas|courier|menlo|d2coding/.test(ff);
   var min=mono?MINCODE:MIN;
   if(el.tagName==='P'||el.tagName==='LI'||el.tagName==='DD'){min=Math.max(min,BODY-1)}
   if(fs<min){el.style.fontSize=min+'px'}
   el.dataset.lr='1';
  }
 }
 var tm;function run(){clearTimeout(tm);tm=setTimeout(function(){fix()},30)}
 if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
 new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});
 window.addEventListener('hashchange',run);
})();
</script>
