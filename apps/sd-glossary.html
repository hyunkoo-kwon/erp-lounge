<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SD 용어집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 검색 바 → 주문-수금 흐름 → 분류 칩 → 용어 목록(펼침형). 흰 바탕에 파랑 강조 하나. 단일 라이트 테마. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#1A1A1A; --muted:#5B6672; --line:#E1E4E8;
  --shell:#354A5F; --shell-fg:#FFFFFF;
  --accent:#0A6ED1; --accent-soft:#EEF5FD; --accent-ink:#0854A0;
  --mark:#FFF0A8; --mark-fg:#1A1A1A; --code-bg:#F2F4F6;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 쉘 바 */
.shell{background:var(--shell);color:var(--shell-fg);padding-block:20px 18px;border-bottom:1px solid var(--line)}
.shell *{color:inherit}
.shell input{color:#1A1A1A}
.shell .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.search{position:relative;flex:1 1 320px;max-width:460px}
.search input{width:100%;height:42px;border:1px solid #C5CCD3;border-radius:8px;background:#fff;color:#1A1A1A;font:inherit;padding:0 76px 0 14px}
.search input::placeholder{color:#6A7886}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px var(--mono);color:#556B82;border:1px solid #C5CDD5;border-radius:4px;padding:1px 7px;background:#F5F6F7}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:#556B82;font-size:18px;cursor:pointer;border-radius:6px}
.search .clear[hidden]{display:none}

/* 주문-수금 흐름 */
.flow{padding-block:18px 6px}
.flow-label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.flow li{display:flex;align-items:center}
.flow li:not(:last-child)::after{content:"›";color:var(--muted);padding:0 8px;font-size:18px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px;font-weight:500}
.step:hover{border-color:var(--accent);color:var(--accent-ink)}

/* 필터 */
.filters{padding-block:14px 8px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:7px;align-items:baseline}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.status{font-size:13px;color:var(--muted);padding-block:6px 10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* 목록 */
.group{margin-block:0 22px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:0;padding:10px 2px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--fg)}
.group-h .n{font-weight:400;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px}
.term{border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.head{width:100%;text-align:left;background:transparent;border:0;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 16px;align-items:start}
.head:hover{background:var(--accent-soft)}
.names{min-width:0}
.en{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ko{color:var(--muted);margin-left:8px;font-size:14px}
.gist{grid-column:1;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.term[data-open="true"] .gist{display:none}
.tags{grid-column:2;grid-row:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag{font:12px var(--mono);background:var(--code-bg);border-radius:4px;padding:1px 7px;color:var(--fg);white-space:nowrap}
.star{color:var(--accent);font-size:14px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:6px 2px 0 6px;transition:transform .15s}
.term[data-open="true"] .chev{transform:rotate(-135deg);margin-top:10px}
.body{padding:2px 16px 18px;display:grid;gap:14px}
.body[hidden]{display:none}
.def{margin:0;font-size:16px;line-height:1.75;max-width:62ch}
.ex{margin:0;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:14px;max-width:62ch}
.ex b{color:var(--accent-ink);margin-right:6px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px}
.meta h3{margin:0 0 5px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.code{font:13px var(--mono);background:var(--code-bg);border:1px solid transparent;border-radius:6px;padding:2px 9px;cursor:pointer}
.code:hover{border-color:var(--accent)}
.code.done{border-color:var(--accent);color:var(--accent-ink)}
.rel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13.5px;cursor:pointer}
.rel:hover{border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
mark{background:var(--mark);color:var(--mark-fg);border-radius:2px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg)}
.empty button{margin-top:12px}
.note{color:var(--muted);font-size:12.5px;padding-block:6px 40px;max-width:70ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){
  .tags{display:none}
  .head{grid-template-columns:minmax(0,1fr) auto}
  .ko{display:block;margin:0}
  .flow li:not(:last-child)::after{padding:0 5px}
  .step{padding:4px 11px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

<header class="shell">
  <div class="wrap">
    <div class="brand">
      <h1>SD 용어집</h1>
      <p><span id="count">0</span>개 용어 · Sales and Distribution · Global Bike 예시</p>
    </div>
    <div class="search">
      <label class="sr" for="q">용어 검색</label>
      <input id="q" type="search" autocomplete="off" placeholder="용어, 한글, T-code, 테이블 (예: VA01, KNVV)">
      <kbd id="slash" aria-hidden="true">/</kbd>
      <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="flow" aria-label="주문에서 수금까지">
    <p class="flow-label">ORDER-TO-CASH</p>
    <ol id="flow"></ol>
  </section>
  <div class="filters" id="filters" role="group" aria-label="분류"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="results"></div>
  <p class="note">정의는 S/4HANA와 ECC 공통 개념을 기준으로 썼고, 테이블과 T-code는 버전에 따라 다를 수 있음. 예시의 조직 코드와 고객, 금액은 실습용 가상 데이터임.</p>
</main>

<script>
// [id, 영문 용어, 한글, 분류, 정의, Global Bike 예시, T-code, 테이블, 관련 id, 별칭]
const TERMS = [
// ───────── 조직 (org)
["client","Client","클라이언트","org","SAP 시스템 안에서 데이터를 가르는 최상위 단위임. 로그온할 때 선택하며, 클라이언트가 다르면 마스터와 거래 데이터가 완전히 분리됨.","실습 시스템에는 하나의 클라이언트에 Global Bike 데이터가 들어 있음.","","T000","company-code",""],
["company-code","Company Code","회사코드","org","재무제표를 작성하는 법적 회계 단위임. 판매와 청구의 금액이 이 회사코드의 회계에 기록됨.","US00은 Global Bike 미국 법인, DE00은 독일 법인임.","OX02","T001","sales-org,plant,accounting-doc","BUKRS"],
["sales-org","Sales Organization","영업조직","org","판매 조건과 책임을 갖는 조직 단위임. 판매오더와 청구문서는 반드시 하나의 영업조직에 속함.","UE00이 미국 판매를 맡는 영업조직임.","OVX5","TVKO","company-code,distr-channel,sales-area","VKORG"],
["distr-channel","Distribution Channel","유통채널","org","고객에게 제품이 도달하는 경로를 나눈 단위임. 같은 제품도 채널에 따라 가격과 납품 방식이 달라질 수 있음.","WH는 도매(Wholesale) 채널임.","OVXI","TVTW","sales-org,sales-area","VTWEG"],
["division","Division","제품군","org","제품을 묶는 분류 단위임. 영업조직과 유통채널이 같아도 제품군이 다르면 별도로 실적을 집계할 수 있음.","BI는 자전거(Bikes) 제품군임.","OVXB","TSPA","sales-area","SPART"],
["sales-area","Sales Area","판매영역","org","영업조직 + 유통채널 + 제품군 세 값의 조합임. 판매오더는 반드시 하나의 판매영역에서 입력하며, 고객과 자재의 영업 데이터도 이 단위로 저장됨.","UE00 / WH / BI 조합이 실습의 기본 판매영역임.","OVXA","TVTA","sales-org,distr-channel,division,sales-area-data",""],
["plant","Plant","플랜트","org","자재의 재고와 출고를 관리하는 물류 단위임. 판매오더 품목마다 어느 플랜트에서 납품할지 지정함.","MI00은 Miami 플랜트, DL00은 Dallas 플랜트임.","OX10","T001W","storage-loc,delivering-plant,shipping-point","WERKS"],
["storage-loc","Storage Location","저장위치","org","플랜트 안에서 재고를 구분하는 보관 장소임. 재고는 플랜트와 저장위치 단위로 관리됨.","MI00 / FG00에 완제품(Finished Goods) 재고가 있음.","OX09","T001L","plant","LGORT"],
["shipping-point","Shipping Point","출하지점","org","납품을 처리하는 가장 상위의 물류 조직임. 납품문서는 하나의 출하지점에서 만들어짐.","","OVXD","TVST","plant,shipping-point-det,delivery","VSTEL"],
["loading-point","Loading Point","적재지점","org","출하지점 안에서 상차가 이뤄지는 세부 장소임. 도크나 램프 같은 물리적 위치를 뜻함.","","","TVLA","shipping-point",""],
["sales-office","Sales Office","영업소","org","지역별로 영업을 담당하는 사무소 단위임. 판매오더 헤더에 입력하여 실적을 나눠 볼 때 씀.","","","TVBUR","sales-group,sales-org",""],
["sales-group","Sales Group","영업그룹","org","영업소 안에서 영업 담당자를 묶은 단위임. 영업사원 그룹별 실적을 볼 때 씀.","","","TVKGR","sales-office",""],
["credit-control-area","Credit Control Area","여신통제영역","org","고객의 여신 한도를 관리하는 조직 단위임. 하나의 영역이 여러 회사코드의 여신을 함께 관리할 수 있음.","","OB45","T014","credit-check,credit-limit","KKBER"],

// ───────── 기준정보 (md)
["business-partner","Business Partner (BP)","비즈니스 파트너","md","고객, 공급업체, 연락처를 하나의 마스터로 통합하는 S/4HANA의 기준 객체임. 고객은 BP를 만들고 고객 역할(Customer role)을 붙여 사용함.","한국 고객 BP 1004401 Seoul Cycle Co., Ltd.가 직수출 실습의 BP임.","BP","BUT000, BUT020","customer-master,account-group,partner-function","BP"],
["customer-master","Customer Master","고객마스터","md","고객에 관한 일반, 회사코드, 영업영역 데이터를 담은 마스터임. ECC에서는 XD01/VD01로 만들고, S/4HANA에서는 BP로 대신함.","고객 127000 Philly Bikes가 대표 실습 고객임.","XD01, VD01, BP","KNA1, KNB1, KNVV","business-partner,sold-to,sales-area-data","Customer"],
["sales-area-data","Customer Sales Area Data","고객 영업영역 데이터","md","고객마스터 중 판매영역 단위로 저장되는 영역임. 통화, 인코텀즈, 지급조건, 파트너 기능, 가격그룹이 여기에 들어감.","127000은 UE00 / WH / BI에 영업영역 데이터를 가짐.","VD02, BP","KNVV, KNVP","customer-master,sales-area,incoterms,payment-terms",""],
["sold-to","Sold-to Party","판매처","md","주문을 낸 고객임. 판매오더 헤더에 가장 먼저 입력하며 코드는 AG임.","127000 Philly Bikes가 주문한 고객임.","","VBPA","ship-to,bill-to,payer,partner-function","AG"],
["ship-to","Ship-to Party","납품처","md","제품을 실제로 받는 곳임. 판매처와 다르면 오더에서 별도로 지정하며 코드는 WE임.","","","VBPA","sold-to,partner-function","WE"],
["bill-to","Bill-to Party","청구처","md","청구서를 받는 곳임. 코드는 RE이고 청구문서의 수신자가 됨.","","","VBPA","sold-to,billing-doc,partner-function","RE"],
["payer","Payer","지급인","md","대금을 실제로 지급하는 곳임. 코드는 RG이고 미수채권이 이 고객 계정에 쌓임.","","","VBPA","sold-to,bill-to,partner-function","RG"],
["partner-function","Partner Function","파트너 기능","md","한 오더에서 고객이 맡는 역할의 구분임. 판매처, 납품처, 청구처, 지급인이 기본이며 오더에 자동으로 복사됨.","","VOPA","TPAR, KNVP, VBPA","sold-to,ship-to,bill-to,payer,partner-det",""],
["account-group","Account Group","계정그룹","md","마스터를 만들 때 필드 구성과 번호 범위를 정하는 분류임. 같은 고객이라도 계정그룹에 따라 입력 필드가 다름.","","OBD2","T077D","customer-master,number-range","KTOKD"],
["material-master","Material Master","자재마스터","md","자재 하나에 관한 모든 데이터를 담은 마스터임. 기본, 영업, 플랜트, 회계 등 여러 뷰로 구성되며 MM과 SD가 함께 씀.","DXTR1000 Deluxe Touring Bike가 대표 실습 자재임.","MM01, MM02, MM03","MARA, MARC, MVKE, MBEW, MAKT","material-views,material-type,item-cat-group","Material"],
["material-views","Material Master Views","자재마스터 뷰","md","자재마스터를 업무 부서별로 나눈 화면 묶음임. 판매는 Sales org. 1·2, Sales: General/Plant 뷰를 채우고, 회계는 Accounting 뷰를 채움.","","MM01","MARA, MVKE, MARC","material-master,delivering-plant,checking-group",""],
["material-type","Material Type","자재유형","md","자재의 성격을 정하는 분류임. 완제품은 FERT, 상품은 HAWA, 반제품은 HALB 같은 키를 씀.","DXTR1000은 완제품(FERT)임.","OMS2","T134","material-master,item-cat-group","MTART"],
["item-cat-group","Item Category Group","품목범주그룹","md","자재마스터에 지정하는 키로, 오더 유형과 만나 품목범주를 결정함. 일반 품목은 NORM, 판매 BOM 헤더는 ERLA를 씀.","","MM02","MVKE-MTPOS, TPTM","item-category,item-cat-det,sales-bom","MTPOS"],
["base-uom","Base Unit of Measure","기본단위","md","자재의 재고를 관리하는 기준 단위임. 모든 수량은 결국 이 단위로 환산되어 저장됨.","DXTR1000의 기본단위는 EA임.","CUNI","MARA-MEINS, T006","sales-unit","MEINS"],
["sales-unit","Sales Unit","판매단위","md","오더에서 고객에게 파는 단위임. 기본단위와 다르면 환산 비율을 자재마스터에 정의해 둠.","","","MARA, MVKE","base-uom","VRKME"],
["delivering-plant","Delivering Plant","납품플랜트","md","자재마스터 영업 뷰에 넣는, 이 자재를 기본으로 출고할 플랜트임. 오더에서 플랜트 결정의 한 출처가 됨.","","MM02","MVKE-DWERK","plant,plant-det","DWERK"],
["checking-group","Checking Group","점검그룹","md","자재마스터 MRP 3 뷰의 Availability check 값임. 어떤 재고와 입고를 반영해 가용성을 점검할지를 정함.","DXTR1000은 일별 요구량 기준 점검그룹을 씀.","OVZ2","MARC-MTVFP, TMVF","atp,checking-rule,scope-of-check","MTVFP"],
["standard-price","Standard Price","표준가","md","자재를 평가하는 고정 단가임. 출고하면 이 단가로 매출원가가 계산됨.","DXTR1000의 표준가는 1,400 USD임.","MM02","MBEW-STPRS","valuation-class,vprs,pgi","STPRS"],
["valuation-class","Valuation Class","평가클래스","md","자재를 어느 재고 계정과 연결할지 정하는 키임. 출고 때 자동 전표의 계정을 찾는 열쇠가 됨.","DXTR1000은 평가클래스 7920을 씀.","","MBEW-BKLAS","standard-price,account-determination","BKLAS"],
["bom","Bill of Materials (BOM)","자재명세서","md","제품을 이루는 구성품과 수량의 목록임. 생산 BOM과 판매 BOM의 두 용도가 있음.","","CS01, CS02, CS03","STKO, STPO, MAST","sales-bom",""],
["cust-material","Customer-Material Info Record","고객-자재 정보","md","고객이 쓰는 자재번호와 우리 자재번호를 연결하는 기록임. 고객이 자기 번호로 주문해도 오더에서 자재가 인식됨.","","VD51","KNMT","customer-master,material-master",""],

// ───────── 판매문서 (doc)
["sales-document","Sales Document","판매문서","doc","문의, 견적, 오더, 계약처럼 판매 활동을 담은 문서의 총칭임. 모두 헤더, 품목, 스케줄 라인의 세 층 구조를 가짐.","","VA03","VBAK, VBAP, VBEP","inquiry,quotation,sales-order,schedule-line",""],
["inquiry","Inquiry","견적요청","doc","고객이 제품 정보와 가격을 물어 온 것을 기록한 판매문서임. 법적 구속력이 없고 오더 유형은 IN을 씀.","","VA11","VBAK","quotation,sales-order,order-type","IN"],
["quotation","Quotation","견적","doc","고객에게 가격과 조건을 약속하는 구속력 있는 판매문서임. 유효기간이 있고 오더 유형은 QT를 씀.","","VA21","VBAK","inquiry,sales-order,doc-flow","QT"],
["sales-order","Sales Order","판매오더","doc","고객의 주문을 담은 판매문서임. 오더가 저장되면 가용성 점검, 가격 결정, 여신 점검이 함께 수행됨.","고객 127000이 DXTR1000을 주문하는 문서가 판매오더임.","VA01, VA02, VA03","VBAK, VBAP, VBEP, VBKD","order-type,item-category,schedule-line,atp,pricing-procedure","SO"],
["order-type","Sales Document Type","오더유형","doc","판매문서의 종류를 정하는 두 글자 키임. OR은 표준 오더, RE는 반품, CR은 대변메모 요청, KB는 위탁 보충 등이 있음.","실습의 기본은 OR 표준 오더임.","VOV8","TVAK","sales-order,item-cat-det,copy-control","Order Type, AUART"],
["item-category","Item Category","품목범주","doc","오더 품목이 어떻게 처리될지를 정하는 키임. 가격결정, 납품 대상 여부, 청구 방식이 여기서 갈림. TAN은 표준 품목임.","","VOV7","TVAP","item-cat-group,item-cat-det,sales-bom","PSTYV"],
["schedule-line","Schedule Line","스케줄 라인","doc","품목의 납품 일자와 수량을 담는 가장 하위 층임. 확인수량이 이 라인에 기록되며, 재고가 모자라면 라인이 여러 개로 나뉨.","오더 B 4 EA는 D+0에 2 EA, D+7에 2 EA의 두 라인이 됨.","VA02","VBEP","confirmed-qty,schedule-line-cat,atp","Delivery schedule"],
["schedule-line-cat","Schedule Line Category","스케줄 라인 범주","doc","스케줄 라인이 납품 대상인지, 소요를 만들지 정하는 키임. CP는 MRP 소요와 가용성 점검을 수행함.","","VOV6","TVEP","schedule-line,item-category",""],
["doc-flow","Document Flow","문서 흐름","doc","오더에서 납품, 청구, 회계전표까지 이어진 후속 문서의 연결 기록임. 판매문서 화면의 문서 흐름 버튼으로 봄.","","VA03","VBFA","sales-order,delivery,billing-doc,accounting-doc",""],
["outline-agreement","Contract","계약","doc","일정 기간 동안의 수량이나 금액을 약속한 상위 계약임. 수량계약은 WK1, 금액계약은 WK2를 쓰고, 개별 오더가 이 계약을 참조함.","","VA41","VBAK","sales-order,scheduling-agreement","WK1, WK2"],
["scheduling-agreement","Scheduling Agreement","납품일정계약","doc","고객과 합의한 일정별 납품 수량을 계약으로 만든 문서임. 오더 유형은 LP이고 반복 납품에 쓰임.","","VA31","VBAK, VBEP","outline-agreement","LP"],
["delivery","Outbound Delivery","납품문서","delivery_placeholder","","","","","",""],
["rejection-reason","Reason for Rejection","거부사유","doc","오더 품목을 취소하지 않고 거부 처리할 때 붙이는 키임. 거부된 품목은 납품과 청구에서 제외됨.","","VA02","TVAG","sales-order",""],
["incompletion-log","Incompletion Log","미완료 로그","doc","필수 값이 빠진 문서의 누락 필드 목록임. 미완료 문서는 후속 문서로 복사되지 않음.","","OVA2","VBUV","sales-order,delivery-block",""],
["delivery-block","Delivery / Billing Block","납품 · 청구 보류","doc","특정 오더의 납품이나 청구를 일시 멈추는 설정임. 풀기 전까지 후속 문서를 만들 수 없음.","","V.14","VBAK-LIFSK, FAKSK","sales-order,credit-check",""],
["output-det","Output Determination","출력 결정","doc","오더확인서, 납품서, 청구서 같은 출력물을 언제 누구에게 어떤 방식으로 낼지 정하는 기능임.","","NACE","NAST","sales-order,billing-doc",""],

// ───────── 가격 (prc)
["pricing-procedure","Pricing Procedure","가격결정절차","prc","가격 계산에 쓰이는 조건유형의 순서와 계산 규칙을 담은 표임. 총액, 할인, 세금, 원가가 이 절차에 따라 차례로 계산됨.","RVAA01이 표준 절차임.","V/08","T683, T683S","condition-type,access-sequence,pricing-proc-det","RVAA01"],
["condition-type","Condition Type","조건유형","prc","가격, 할인, 할증, 세금 같은 계산 요소 하나를 뜻하는 네 글자 키임. PR00은 가격, K007은 고객 할인, MWST는 세금, VPRS는 원가임.","","V/06","T685","pricing-procedure,condition-record,access-sequence","KSCHL"],
["condition-record","Condition Record","조건레코드","prc","조건유형에 실제 금액이나 비율을 저장한 기록임. 키 조합, 유효기간, 값으로 이뤄짐.","DXTR1000 PR00 1,800 USD가 하나의 레코드임.","VK11, VK12, VK13","KONH, KONP, A###","condition-type,condition-table,condition-scale","VK11"],
["access-sequence","Access Sequence","접근순서","prc","조건레코드를 어떤 키 순서로 찾을지 정한 검색 전략임. 구체적인 키부터 찾아 먼저 발견된 값을 씀.","","V/07","T682","condition-type,condition-table",""],
["condition-table","Condition Table","조건 테이블","prc","조건레코드의 키 필드 조합을 정의한 테이블임. 고객 + 자재, 가격그룹 + 자재 같은 조합이 있음.","","V/03","A### (A로 시작하는 테이블)","condition-record,access-sequence",""],
["condition-technique","Condition Technique","조건 기법","prc","가격결정 절차, 조건유형, 접근순서, 조건레코드로 값을 자동으로 찾는 SAP의 설계 방식임. 가격 외에 출력, 계정 결정도 같은 기법을 씀.","","","","pricing-procedure,condition-type,access-sequence,condition-record",""],
["customer-discount","Customer Discount (K007)","고객 할인","prc","특정 고객에게 비율로 주는 할인 조건임. 조건레코드에 고객 번호와 퍼센트를 저장함.","고객 127000에 5% 할인을 K007로 등록하는 예를 씀.","VK11","KONP","condition-type,condition-record",""],
["net-price","Net Price","순가격","prc","할인과 할증을 반영한 최종 단가임. 오더 품목의 순가치(Net value)는 순가격 × 수량임.","","VA03","VBAP-NETWR","pricing-procedure",""],
["pricing-date","Pricing Date","가격결정일","prc","어느 날짜의 조건레코드를 기준으로 가격을 찾을지 정하는 일자임. 기본은 오더 입력일이며 바꿀 수 있음.","","VA02","VBKD-PRSDT","condition-record",""],
["condition-scale","Condition Scale","조건 스케일","prc","수량이나 금액 구간에 따라 단가가 달라지는 구조임. 예를 들어 10 EA 이상이면 단가를 낮춤.","","VK11","KONM","condition-record",""],
["rebate","Rebate Agreement","리베이트 합의","prc","일정 기간의 누적 판매에 대해 사후에 돌려주는 할인 약정임. 기간이 끝난 뒤 정산하여 대변메모로 지급함.","","VBO1","KONA","condition-record,credit-memo",""],
["tax-condition","Tax Condition (MWST)","세금 조건","prc","부가세나 판매세를 가격결정 절차에서 계산하는 조건유형임. 미국은 세율이 관할지별이라 UTXJ 같은 별도 절차를 씀.","","","A### , KONP","pricing-procedure,zero-rating","MWST, UTXJ"],
["vprs","Cost Condition (VPRS)","원가 조건","prc","오더에서 자재의 원가를 불러오는 조건유형임. 통계용이라 가격에는 영향이 없고 수익성 분석의 원가 기준이 됨.","DXTR1000 VPRS는 표준가 1,400 USD를 가져옴.","","","standard-price,copa","VPRS"],
["statistical-cond","Statistical Condition","통계 조건","prc","금액을 계산하지만 순가치에는 더하지 않는 조건임. 원가나 이익 같은 참고 값을 보여 줄 때 씀.","","V/06","T685A","vprs",""],

// ───────── 가용성 · 출고 (atp)
["atp","Available to Promise (ATP)","가용 재고 확약","atp","현재고와 입고 예정에서 이미 약속한 수량을 뺀 값임. 고객에게 약속할 수 있는 수량을 기준으로 확인수량이 계산됨.","현재고 5 EA, 입고 20 EA(D+7)에서 오더 A 3 EA를 빼면 D+0 가용은 2 EA임.","CO09, MD04","","checking-group,confirmed-qty,scope-of-check","Availability Check"],
["checking-rule","Checking Rule","점검 규칙","atp","판매오더, 납품 같은 거래마다 어떤 방식으로 점검할지 정한 키임. 점검그룹과 만나 실제 점검 범위가 결정됨.","","OVZ9","","checking-group,scope-of-check",""],
["scope-of-check","Scope of Check","점검 범위","atp","가용성 점검에 포함할 재고, 입고, 출고의 종류를 정한 설정임. 안전재고나 구매요청, 생산오더를 반영할지 여기서 고름.","","OVZ9","TMVF","checking-group,checking-rule",""],
["confirmed-qty","Confirmed Quantity","확인수량","atp","가용성 점검 결과로 시스템이 확약한 수량임. 스케줄 라인에 기록되며 납품 대상 수량의 기준이 됨.","오더 A 3 EA는 D+0에 3 EA 모두 확인됨.","VA02","VBEP-BMENG","atp,schedule-line,complete-delivery","BMENG"],
["req-delivery-date","Requested Delivery Date","요청납품일","atp","고객이 받고 싶다고 요청한 날짜임. 오더 헤더에 입력하며 점검의 기준일이 됨.","","VA01","VBAK-VDATU","material-avail-date,delivery-scheduling","VDATU"],
["material-avail-date","Material Availability Date","자재가용일","atp","납품일에서 리드타임을 거꾸로 뺀 날짜로, 이 날까지 자재가 준비돼야 함. 가용성 점검은 이 날짜 기준으로 수행됨.","","VA02","VBEP-MBDAT","delivery-scheduling,req-delivery-date","MBDAT"],
["delivery-scheduling","Delivery Scheduling","납품 일정 산정","atp","요청납품일에서 운송, 적재, 피킹 같은 리드타임을 거슬러 가며 각 단계의 날짜를 계산하는 기능임.","","","VBEP, TVRO","req-delivery-date,material-avail-date,route",""],
["complete-delivery","Complete Delivery","완전납품","atp","오더 전체를 한 번에 납품하도록 지정하는 설정임. 일부만 확인되면 모든 수량이 가장 늦은 확인일에 맞춰 납품됨.","오더 B에 켜면 4 EA 전량이 D+7에 납품됨.","VA02","VBAK-AUTLF, KNVV-AUTLF","partial-delivery,confirmed-qty",""],
["partial-delivery","Partial Delivery","부분납품","atp","확인된 수량부터 먼저 나눠 납품하는 방식임. 한 품목을 몇 번까지 나눌지 한도를 정할 수 있음.","","","KNVV-KZTLF","complete-delivery",""],
["backorder","Backorder Processing","백오더 처리","atp","재고가 새로 들어왔을 때 확인되지 않은 오더 라인에 재고를 다시 배분하는 기능임.","","V_V2","VBBE","atp,confirmed-qty",""],
["requirements-transfer","Transfer of Requirements","소요 이관","atp","확인된 판매 수량이 MRP 소요로 넘어가는 것임. 이 소요를 보고 생산이나 구매가 계획됨.","","MD04","VBBE","atp,strategy-group,mto-mts",""],
["strategy-group","Strategy Group","전략그룹","atp","자재마스터 MRP 3 뷰에서 계획 방식을 정하는 키임. 플랜트마다 달리 줄 수 있어 MTO와 MTS를 나눔.","MI00은 전략그룹 20(MTO), DL00은 10(MTS)임.","MM02","MARC-STRGR, T461S","mto-mts,requirements-transfer","MRP 3 뷰"],
["mto-mts","MTO / MTS","주문생산 / 계획생산","atp","MTO는 주문이 들어온 뒤 생산하고, MTS는 재고를 미리 만들어 두었다가 파는 방식임. 전략그룹과 소요유형으로 구분됨.","MI00 MTO, DL00 MTS로 비교 실습함.","MD04","","strategy-group,requirements-transfer",""],
["stock-req-list","Stock/Requirements List","재고 / 소요 목록","atp","한 자재의 현재고, 입고, 소요를 날짜순으로 보여 주는 화면임. 오더가 재고를 어떻게 사용했는지 확인하는 대표 도구임.","","MD04","","atp,requirements-transfer","MD04"],
["shipping-cond","Shipping Condition","출하조건","atp","고객이 요구하는 납품 속도나 방식을 뜻하는 키임. 출하지점 결정에 쓰임.","","OVSA","TVSB","shipping-point-det,route","VSBED"],
["route","Route","경로","atp","납품에서 도착까지의 운송 경로임. 운송 리드타임과 운송 구간이 경로에서 정해짐.","","OVTC","TVRO","delivery-scheduling",""],
["picking","Picking","피킹","atp","납품 대상 자재를 보관 위치에서 꺼내는 작업임. 납품문서에서 피킹 수량을 입력함.","","VL02N","LIPS-PIKMG","delivery,packing,pgi",""],
["packing","Packing","포장","atp","납품할 자재를 박스나 파렛트 같은 포장 단위에 담는 작업임. 핸들링 유닛(HU)으로 관리하기도 함.","","VL02N","VEKP","picking,handling-unit",""],
["handling-unit","Handling Unit (HU)","핸들링 유닛","atp","포장재와 내용물을 하나의 번호로 묶은 물류 단위임. 파렛트나 박스를 개별로 추적할 때 씀.","","HUMO","VEKP","packing",""],
["batch","Batch","배치","atp","같은 조건에서 생산된 자재를 묶은 로트 번호임. 품질 이력이나 유효기간을 추적할 때 씀.","","MSC1N","MCH1","picking",""],

["billing-due-list","Billing Due List","청구 대상 목록","bil","아직 청구되지 않은 납품과 오더를 모아서 한 번에 청구문서로 만드는 화면임.","","VF04","VKDFS","billing-doc",""],
["cancel-billing","Cancel Billing","청구 취소","bil","잘못 만든 청구문서를 취소하는 처리임. 청구취소문서(S1)가 생기고 회계전표도 역분개됨.","","VF11","VBRK","billing-doc",""],

["revenue-acct","Revenue Account Determination","매출계정 결정","bil","청구 때 매출 계정을 정하는 규칙임. 고객 계정지정그룹, 자재 계정지정그룹, 계정키의 조합으로 찾음.","","VKOA","KOTE","account-determination,billing-doc",""],
["credit-check","Credit Check","여신 점검","bil","오더 저장 시 고객의 미수금과 한도를 비교해 초과하면 오더를 보류하는 기능임.","","FD32, UKM_BP","KNKK","credit-limit,delivery-block,credit-control-area",""],

["payment-terms","Payment Terms","지급조건","bil","대금을 언제까지 어떻게 받을지 정한 조건임. 예를 들어 30일 이내 순액, 10일 이내 2% 할인이 있음.","","OBB8","T052","sales-area-data,incoterms","ZTERM"],

["exchange-rate","Exchange Rate","환율","bil","통화 간 환산 비율임. 환율유형 M이 표준이고, 청구 시점의 환율로 외화 매출을 회사 통화로 바꿈.","","OB08","TCURR","accounting-doc",""],

["local-lc","Local L/C","내국신용장","exp","국내 거래에서 수출용 원자재를 사고팔 때 발행하는 신용장임. 수출 신용장을 근거로 국내 은행이 발행함.","","","","lc",""],

["bl","Bill of Lading (B/L)","선하증권","exp","해상 운송 업체가 화물을 받았음을 증명하는 서류임. 화물의 소유권을 나타내기도 함.","","","","commercial-invoice,packing-list","B/L"],

// delivery 항목은 위에서 placeholder로 자리만 잡았으므로 실제 값으로 교체
(function () {
  const i = TERMS.findIndex(t => t[0] === "delivery");
  TERMS[i] = ["delivery","Outbound Delivery","납품문서","doc","고객에게 물건을 내보내기 위한 물류 문서임. 피킹, 포장, 출고 전기가 이 문서에서 이뤄지며 판매오더를 참조해서 만듦.","MI00 / FG00에서 DXTR1000을 내보내는 문서가 납품문서임.","VL01N, VL02N, VL03N","LIKP, LIPS","picking,packing,pgi,delivery-type,doc-flow","Delivery"];
})();

</script>
<script>
(function () {
  const CATS = [
    ["org", "조직"], ["md", "기준정보"], ["doc", "판매문서"], ["prc", "가격결정"], ["atp", "가용성·출고"],
    ["bil", "청구·회계"], ["exp", "수출·무역"], ["spc", "특수 거래"], ["lnk", "MM·FI 연계"], ["cfg", "설정"]
  ];
  const CAT_NAME = Object.fromEntries(CATS);
  const FLOW = [["inquiry","견적요청"],["quotation","견적"],["sales-order","판매오더"],["delivery","납품"],["pgi","출고 전기"],["billing-doc","청구"],["accounting-doc","회계전표"]];
  const split = s => (s || "").split(",").map(x => x.trim()).filter(Boolean);
  const DB = TERMS.map((t, i) => ({
    id: t[0], en: t[1], ko: t[2], cat: t[3], def: t[4], ex: t[5], tc: split(t[6]), tb: split(t[7]), rel: split(t[8]), alias: split(t[9]), ord: i
  }));
  const BY = Object.fromEntries(DB.map(t => [t.id, t]));
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem("sd-gloss-fav") || "[]")); } catch (e) {}
  const saveFavs = () => { try { localStorage.setItem("sd-gloss-fav", JSON.stringify([...favs])); } catch (e) {} };

  const state = { q: "", cat: "all", open: new Set() };

  $("count").textContent = DB.length;

  // 흐름 바
  $("flow").innerHTML = FLOW.map(f => `<li><button class="step" type="button" data-go="${f[0]}">${f[1]}</button></li>`).join("");

  function tokens() { return state.q.toLowerCase().split(/\s+/).filter(Boolean); }

  function score(t, toks) {
    let total = 0;
    const en = t.en.toLowerCase(), ko = t.ko, al = t.alias.map(a => a.toLowerCase()), tc = t.tc.map(a => a.toLowerCase()), tb = t.tb.join(" ").toLowerCase();
    for (const k of toks) {
      let s = 0;
      if (en === k || ko === k) s = 140;
      else if (tc.includes(k) || al.includes(k)) s = 110;
      else if (en.startsWith(k) || ko.startsWith(k)) s = 90;
      else if (en.includes(k) || ko.includes(k)) s = 65;
      else if (al.some(a => a.includes(k)) || tc.some(a => a.includes(k))) s = 50;
      else if (tb.includes(k)) s = 40;
      else if (t.id.includes(k)) s = 30;
      else if (t.def.toLowerCase().includes(k) || t.ex.toLowerCase().includes(k)) s = 10;
      if (!s) return 0;
      total += s;
    }
    return total;
  }

  function hl(text, toks) {
    let out = esc(text);
    toks.forEach(k => {
      const re = new RegExp("(" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi");
      out = out.replace(re, "<mark>$1</mark>");
    });
    return out;
  }

  function filtered() {
    const toks = tokens();
    let list = DB.filter(t => state.cat === "all" || (state.cat === "fav" ? favs.has(t.id) : t.cat === state.cat));
    if (toks.length) {
      list = list.map(t => ({ t, s: score(t, toks) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s || a.t.ord - b.t.ord).map(x => x.t);
    }
    return list;
  }

  function renderFilters() {
    const toks = tokens();
    const base = toks.length ? DB.filter(t => score(t, toks) > 0) : DB;
    const cnt = c => base.filter(t => t.cat === c).length;
    const chip = (key, label, n, cls) => `<button class="chip ${cls || ""}" type="button" data-cat="${key}" aria-pressed="${state.cat === key}">${label}<span class="n">${n}</span></button>`;
    $("filters").innerHTML = chip("all", "전체", base.length) + CATS.map(c => chip(c[0], c[1], cnt(c[0]))).join("") + chip("fav", "★ 즐겨찾기", favs.size, "fav");
  }

  function termHTML(t, toks) {
    const open = state.open.has(t.id);
    const tags = t.tc.slice(0, 2).map(c => `<span class="tag">${hl(c, toks)}</span>`).join("");
    const group = (title, items, cls) => items.length ? `<div><h3>${title}</h3><div class="chips">${items}</div></div>` : "";
    const codes = group("T-CODE", t.tc.map(c => `<button class="code" type="button" data-copy="${esc(c)}" title="클릭하여 복사">${hl(c, toks)}</button>`).join(""));
    const tabs = group("테이블", t.tb.map(c => `<button class="code" type="button" data-copy="${esc(c)}" title="클릭하여 복사">${hl(c, toks)}</button>`).join(""));
    const alias = group("다른 표기", t.alias.map(c => `<span class="tag">${esc(c)}</span>`).join(""));
    const rel = group("관련 용어", t.rel.filter(r => BY[r]).map(r => `<button class="rel" type="button" data-go="${r}">${esc(BY[r].ko)}</button>`).join(""));
    return `<article class="term" id="t-${t.id}" data-open="${open}">
      <button class="head" type="button" aria-expanded="${open}" aria-controls="b-${t.id}" data-toggle="${t.id}">
        <span class="names"><span class="en">${hl(t.en, toks)}</span><span class="ko">${hl(t.ko, toks)}</span></span>
        <span class="tags">${favs.has(t.id) ? '<span class="star" aria-label="즐겨찾기">★</span>' : ""}${tags}<span class="chev" aria-hidden="true"></span></span>
        <span class="gist">${hl(t.def, toks)}</span>
      </button>
      <div class="body" id="b-${t.id}" ${open ? "" : "hidden"}>
        <p class="def">${hl(t.def, toks)}</p>
        ${t.ex ? `<p class="ex"><b>Global Bike</b>${hl(t.ex, toks)}</p>` : ""}
        <div class="meta">${codes}${tabs}${alias}${rel}</div>
        <div class="acts">
          <button class="btn" type="button" data-fav="${t.id}" aria-pressed="${favs.has(t.id)}">${favs.has(t.id) ? "★ 즐겨찾기 해제" : "☆ 즐겨찾기"}</button>
          <button class="btn" type="button" data-link="${t.id}">링크 복사</button>
        </div>
      </div>
    </article>`;
  }

  function render() {
    const toks = tokens();
    const list = filtered();
    renderFilters();
    $("clear").hidden = !state.q;
    const catLabel = state.cat === "all" ? "" : state.cat === "fav" ? " · 즐겨찾기" : " · " + CAT_NAME[state.cat];
    $("status").innerHTML = `<span>${list.length}개 결과${catLabel}</span><span>${state.open.size ? `<button class="btn" type="button" data-collapse>모두 접기</button>` : ""}</span>`;
    const box = $("results");
    if (!list.length) {
      box.innerHTML = `<div class="empty"><p><b>${state.cat === "fav" && !state.q ? "즐겨찾기한 용어가 없음" : "검색 결과가 없음"}</b></p><p>${state.cat === "fav" && !state.q ? "용어를 펼친 뒤 ☆ 버튼으로 담을 수 있음." : "한글, 영문, T-code(VA01), 테이블(KNVV) 중 하나로 다시 찾아봄."}</p><button class="btn" type="button" data-reset>필터 초기화</button></div>`;
      return;
    }
    if (toks.length) {
      box.innerHTML = `<div class="group"><div class="list">${list.map(t => termHTML(t, toks)).join("")}</div></div>`;
    } else {
      box.innerHTML = CATS.map(([k, name]) => {
        const items = list.filter(t => t.cat === k);
        if (!items.length) return "";
        return `<section class="group"><h2 class="group-h">${name}<span class="n">${items.length}</span></h2><div class="list">${items.map(t => termHTML(t, toks)).join("")}</div></section>`;
      }).join("");
    }
  }

  function copy(text, el, okLabel) {
    const done = () => { if (!el) return; const old = el.textContent; el.classList.add("done"); el.textContent = okLabel || "복사됨"; setTimeout(() => { el.classList.remove("done"); el.textContent = old; }, 1100); };
    try { navigator.clipboard.writeText(text).then(done, () => fallback(text, done)); } catch (e) { fallback(text, done); }
  }
  function fallback(text, done) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove();
  }

  function goTo(id, scroll) {
    if (!BY[id]) return;
    // 목록에 보이지 않으면 필터를 풀어서 보이게 함
    state.q = ""; $("q").value = "";
    if (state.cat !== "all" && state.cat !== "fav") state.cat = "all";
    if (state.cat === "fav" && !favs.has(id)) state.cat = "all";
    state.open.add(id);
    render();
    if (scroll !== false) {
      const el = $("t-" + id);
      if (el) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.toggle) {
      const id = b.dataset.toggle;
      if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
      render(); const h = $("t-" + id); if (h) h.querySelector(".head").focus({ preventScroll: true });
      if (state.open.has(id)) history.replaceState(null, "", "#t-" + id);
    } else if (b.dataset.cat) { state.cat = b.dataset.cat; render(); }
    else if (b.dataset.go) { goTo(b.dataset.go); history.replaceState(null, "", "#t-" + b.dataset.go); }
    else if (b.dataset.copy) copy(b.dataset.copy, b);
    else if (b.dataset.fav) { const id = b.dataset.fav; favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); const y = scrollY; render(); scrollTo(0, y); }
    else if (b.dataset.link) copy(location.href.split("#")[0] + "#t-" + b.dataset.link, b, "복사됨");
    else if (b.dataset.collapse) { state.open.clear(); render(); }
    else if (b.dataset.reset) { state.q = ""; $("q").value = ""; state.cat = "all"; render(); }
  });
  $("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
  $("clear").addEventListener("click", () => { state.q = ""; $("q").value = ""; render(); $("q").focus(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("q") && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "Escape" && document.activeElement === $("q")) { state.q = ""; $("q").value = ""; render(); $("q").blur(); }
  });
  $("q").addEventListener("focus", () => { $("slash").style.display = "none"; });
  $("q").addEventListener("blur", () => { $("slash").style.display = ""; });

  function fromHash() {
    const m = /^#t-([a-z0-9-]+)$/.exec(location.hash);
    if (m && BY[m[1]]) goTo(m[1]);
  }
  window.addEventListener("hashchange", fromHash);
  render();
  fromHash();
})();
</script>
