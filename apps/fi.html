<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP FI 모듈 교육 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#354A5F; --brand:#0A6ED1; --brand2:#0854A0; --sel:#EBF5FE; --sel2:#D1E8FF;
  --ink:#32363A; --sub:#6A6D70; --line:#E5E5E5; --soft:#F7F7F7;
  --ok:#107E3E; --okbg:#F1FDF6; --ng:#BB0000; --ngbg:#FFEBEB;
  --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,select,input{font:inherit;color:inherit}
.shell{background:var(--shell);color:#fff}
.shell .in{max-width:1080px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:13px;background:var(--brand);padding:3px 8px;border-radius:4px;letter-spacing:.04em}
.shell h1{margin:0;font-size:17px;font-weight:700}
.shell small{margin-left:auto;font-size:12px;opacity:.8}
nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
nav .in{max-width:1080px;margin:0 auto;display:flex;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;padding:12px 13px;text-decoration:none;color:var(--sub);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--brand);border-color:var(--brand);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:21px;margin:4px 0 4px;font-weight:900;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px;font-weight:700;color:var(--shell)}
.lead{color:var(--sub);margin:0 0 16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;background:var(--sel);border:1px solid var(--sel2);border-radius:5px;padding:0 6px;margin:2px 2px 0 0;color:var(--brand2)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--sel);color:var(--brand2)}
.pill.done{background:var(--okbg);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--shell);color:#fff;font-weight:700;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
/* home */
.hero{border:1px solid var(--line);border-radius:12px;padding:18px;background:linear-gradient(180deg,var(--sel),#fff)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.lcard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:#fff;text-align:left;width:100%}
.lcard:hover{border-color:var(--brand)}
.lno{flex:none;width:36px;height:36px;border-radius:8px;background:var(--shell);color:#fff;display:grid;place-items:center;font-weight:900}
.lcard.done .lno{background:var(--ok)}
.lcard b{display:block}
.lcard span{font-size:13px;color:var(--sub)}
/* org */
.org{display:grid;gap:6px;justify-items:center;font-size:14px}
.org .n{border:2px solid var(--shell);border-radius:8px;padding:6px 14px;text-align:center;background:#fff;min-width:150px}
.org .n.k{background:var(--shell);color:#fff}
.org .n small{display:block;font-size:12px;opacity:.75}
.org .v{color:var(--brand);font-weight:900;line-height:1}
.org .h{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .st{flex:1 1 130px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px;background:var(--soft)}
.flow .st b{display:block;color:var(--shell);font-size:14px}
.flow .st span{font-size:13px;color:var(--sub);display:block}
.flow .ar{align-self:center;color:var(--brand);font-weight:900}
.concept{border-left:4px solid var(--shell);padding:2px 0 2px 12px;margin:0 0 12px}
.concept b{color:var(--shell)}
.concept p{margin:2px 0 0;font-size:14px}
.note{background:var(--sel);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.note b{color:var(--brand2)}
.je-h{font-weight:700;margin:10px 0 4px;font-size:14px}
.je-h span{font-weight:400;color:var(--sub)}
.pk{font-family:var(--mono);font-weight:700;color:var(--brand2)}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid #cfd4dd;border-radius:8px;background:#fff;padding:10px 13px;margin:7px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}
.ex{font-size:14px;color:var(--sub);margin-top:4px;display:none}
.ex.on{display:block}
.score{font-size:40px;font-weight:900;color:var(--brand)}
/* lab (SAP GUI mock) */
.gui{border:1px solid #c6c6c6;border-radius:8px;overflow:hidden;background:#fff}
.gui .tb{background:var(--shell);color:#fff;padding:7px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.gui .tb .tc{font-family:var(--mono);background:#fff;color:var(--ink);padding:1px 8px;border-radius:3px;font-size:12px}
.gui .hd{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px}
.gui .hd label{color:var(--sub);display:block;font-size:12px}
.gui .hd div b{font-family:var(--mono)}
.lines{padding:10px 12px}
.ln{display:grid;grid-template-columns:90px 1fr 120px 34px;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:560px){.ln{grid-template-columns:72px 1fr 92px 30px}}
.ln select,.ln input{width:100%;padding:7px 6px;border:1px solid #bfc4cc;border-radius:5px;background:#fff;font-size:13px}
.ln input{text-align:right;font-variant-numeric:tabular-nums}
.ln .x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px}
.lnh{display:grid;grid-template-columns:90px 1fr 120px 34px;gap:6px;font-size:12px;color:var(--sub);padding:0 2px 4px}
@media(max-width:560px){.lnh{grid-template-columns:72px 1fr 92px 30px}}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.sum .bal{font-weight:700}
.sum .bal.z{color:var(--ok)} .sum .bal.nz{color:var(--ng)}
.scene{font-size:16px;font-weight:500;padding:12px 14px;background:var(--sel);border-left:4px solid var(--brand);border-radius:6px;margin:8px 0 12px}
.fb{margin-top:12px;border-radius:8px;padding:12px 14px;display:none;font-size:14px}
.fb.ok{display:block;background:var(--okbg);border:1px solid #bfe3cd}
.fb.ng{display:block;background:var(--ngbg);border:1px solid #f2c6c2}
.fb .t{font-weight:900;margin-bottom:4px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid #cfd4dd;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.dots button.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dots button.cur{outline:2px solid var(--brand);outline-offset:2px}
.pkref{font-size:13px}
.pkref td{padding:5px 8px}
/* tcode */
.drill{font-family:var(--mono);font-size:40px;font-weight:900;color:var(--brand);text-align:center;margin:4px 0}
.tcg{display:grid;gap:12px}
@media(min-width:760px){.tcg{grid-template-columns:repeat(2,1fr)}}
.tcg table td:first-child{font-family:var(--mono);font-weight:700;color:var(--brand2);white-space:nowrap;width:1%}
.back{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;margin-bottom:8px}
</style>
</head>
<body>
<div class="shell"><div class="in"><span class="logo">SAP</span><h1>FI 모듈 교육 앱</h1><small>Global Bike · US00 · USD</small></div></div>
<nav><div class="in" id="nav">
  <a href="#home" data-v="home">홈</a>
  <a href="#lessons" data-v="lessons">레슨</a>
  <a href="#lab" data-v="lab">전표 실습</a>
  <a href="#quiz" data-v="quiz">종합 퀴즈</a>
  <a href="#tcode" data-v="tcode">T-code</a>
</div></nav>
<main id="app"></main>

<script>
/* ───────── 실습용 기준정보 (Global Bike 기반, 계정번호는 실습용) ───────── */
const ACCT = {
  "113100":"은행 보통예금","140000":"매출채권(조정계정)","160000":"매입채무(조정계정)",
  "310000":"상품 재고","191100":"GR/IR 대사계정","211000":"기계장치(자산 조정계정)","211099":"감가상각누계액",
  "800000":"매출","893015":"매출원가","470000":"임차료","476100":"소모품비","481000":"감가상각비",
  "127000":"고객 Philly Bikes","115000":"공급업체 Mid-West Supply"
};
const PK = {
  "01":"01 고객 차변(송장)","11":"11 고객 대변(대변메모)","15":"15 고객 대변(입금)",
  "21":"21 공급업체 차변(차변메모)","25":"25 공급업체 차변(지급)","31":"31 공급업체 대변(송장)",
  "40":"40 G/L 차변","50":"50 G/L 대변","70":"70 자산 차변","75":"75 자산 대변",
  "81":"81 비용 차변(MM)","86":"86 GR/IR 차변(MM)","89":"89 재고 차변(MM)","96":"96 GR/IR 대변(MM)","99":"99 재고 대변(MM)"
};
const DR = new Set(["01","21","25","40","70","81","86","89"]);
const fmt = n => Number(n).toLocaleString("en-US");

/* ───────── 레슨 ───────── */
const L = [
{ t:"FI 개요와 조직구조", g:"FI가 맡는 일과 회사코드 중심의 조직 단위를 이해함",
  html:`
  <div class="concept"><b>FI(Financial Accounting)</b><p>외부 보고용 회계. 모든 거래를 회사코드 단위 전표로 기록하고 재무상태표·손익계산서를 만듦. 내부 관리는 CO가 담당함.</p></div>
  <div class="concept"><b>하위 컴포넌트</b><p>GL(총계정원장) · AP(채무) · AR(채권) · AA(고정자산) · BL(은행) · 결산. AP·AR·AA는 보조원장이고 결과는 GL의 조정계정으로 모임.</p></div>
  <h3 style="margin-top:16px">Global Bike 조직구조</h3>
  <div class="org">
    <div class="n k">Client<small>GBI 실습 클라이언트</small></div><div class="v">↓</div>
    <div class="n">Chart of Accounts <b>GL00</b><small>계정과목표 — 두 회사가 공유</small></div><div class="v">↓</div>
    <div class="h"><div class="n k">Company Code <b>US00</b><small>Global Bike Inc. · USD</small></div><div class="n k">Company Code <b>DE00</b><small>Global Bike Germany · EUR</small></div></div><div class="v">↑</div>
    <div class="n">Controlling Area <b>NA00</b> 등<small>CO 연결 단위</small></div>
  </div>
  <div class="note"><b>핵심</b> — 회사코드 = 재무제표를 만드는 최소 단위. 계정과목표·회계연도변형·통화가 회사코드에 붙음.</div>
  <div class="tw"><table><tr><th>조직 단위</th><th>역할</th><th>T-code</th></tr>
  <tr><td>Company Code</td><td>법적 독립 회계 단위</td><td><span class="chip">OX02</span></td></tr>
  <tr><td>Chart of Accounts</td><td>G/L 계정 목록</td><td><span class="chip">OB13</span><span class="chip">OB62</span></td></tr>
  <tr><td>Fiscal Year Variant</td><td>회계기간 정의(K4 = 12+4)</td><td><span class="chip">OB29</span><span class="chip">OB37</span></td></tr>
  <tr><td>Posting Period Variant</td><td>기간 열기·닫기</td><td><span class="chip">OB52</span></td></tr></table></div>`,
  q:[
   ["재무제표를 작성하는 FI의 최소 조직 단위는?",["Client","Company Code","Plant","Controlling Area"],1,"회사코드가 B/S·P/L 작성 단위임."],
   ["AP·AR·AA 거래가 GL에 집계되는 계정은?",["임시계정","조정계정(Reconciliation Account)","GR/IR 계정","이익잉여금"],1,"보조원장 → 조정계정으로 자동 집계됨."],
   ["회계기간을 열고 닫는 T-code는?",["OB52","OB13","FS00","OX02"],0,"OB52에서 계정유형별로 기간을 통제함."]
  ]},
{ t:"기준정보: G/L 계정과 BP", g:"전표에 쓰이는 계정·고객·공급업체 마스터 구조를 이해함",
  html:`
  <div class="grid g2">
   <div class="card"><h3>G/L 계정 (FS00)</h3>
    <p style="margin:0;font-size:14px"><b>COA 세그먼트</b> — 계정번호·계정명·계정유형(재무상태표/손익)<br><b>회사코드 세그먼트</b> — 통화·미결관리·조정계정 유형·필드상태그룹</p>
    <div><span class="chip">SKA1</span><span class="chip">SKB1</span></div></div>
   <div class="card"><h3>Business Partner (BP)</h3>
    <p style="margin:0;font-size:14px">S/4HANA에서 고객·공급업체를 하나의 BP로 관리함. 역할 <b>FLCU01</b>(고객 회계), <b>FLVN01</b>(공급업체 회계)에 회사코드 데이터와 조정계정을 지정함.</p>
    <div><span class="chip">BP</span><span class="chip">KNA1/KNB1</span><span class="chip">LFA1/LFB1</span></div></div>
  </div>
  <h3>보조원장과 조정계정</h3>
  <div class="flow">
   <div class="st"><b>고객 127000</b><span>Philly Bikes 송장 10,000</span></div><div class="ar">→</div>
   <div class="st"><b>140000 매출채권</b><span>조정계정에 자동 반영</span></div><div class="ar">→</div>
   <div class="st"><b>재무상태표</b><span>매출채권 10,000</span></div>
  </div>
  <div class="note"><b>규칙</b> — 조정계정에는 직접 전기할 수 없음. 고객·공급업체 라인으로만 갱신됨. 그래서 보조원장 합계와 GL 잔액이 항상 일치함.</div>
  <div class="concept"><b>미결관리(Open Item Management)</b><p>반드시 상계되어야 하는 계정(GR/IR, 은행 중간계정)에 켬. 라인이 미결 → 반제 상태로 관리됨.</p></div>`,
  q:[
   ["S/4HANA에서 고객과 공급업체를 통합 관리하는 마스터는?",["Customer Master","Business Partner","Vendor Group","Account Group"],1,"BP 하나에 역할로 고객·공급업체 데이터를 붙임."],
   ["G/L 계정의 회사코드 세그먼트 테이블은?",["SKA1","SKB1","KNB1","T001"],1,"SKA1=COA 수준, SKB1=회사코드 수준."],
   ["조정계정에 대한 설명으로 옳은 것은?",["FB50으로 직접 전기함","보조원장 전기로만 갱신됨","손익계정임","결산 시 삭제됨"],1,"직접 전기 불가가 핵심 통제임."]
  ]},
{ t:"GL 전표의 구조", g:"전표 헤더·라인, 전표유형, 전기키를 읽고 쓸 수 있음",
  html:`
  <div class="grid g2">
   <div class="card"><h3>헤더 (BKPF)</h3><p style="margin:0;font-size:14px">회사코드 · 전표번호 · 회계연도 · 전표유형 · 전표일·전기일 · 통화 · 참조</p></div>
   <div class="card"><h3>라인 (BSEG / ACDOCA)</h3><p style="margin:0;font-size:14px">전기키 · 계정 · 금액 · 코스트센터 · 손익센터 · 적요</p></div>
  </div>
  <div class="tw"><table><tr><th>전표유형</th><th>용도</th><th>발생 화면</th></tr>
   <tr><td><b>SA</b></td><td>G/L 일반 전표</td><td>FB50</td></tr>
   <tr><td><b>KR</b> / <b>KZ</b></td><td>공급업체 송장 / 지급</td><td>FB60 / F-53, F110</td></tr>
   <tr><td><b>DR</b> / <b>DZ</b></td><td>고객 송장 / 입금</td><td>FB70 / F-28</td></tr>
   <tr><td><b>WE</b> / <b>RE</b></td><td>입고 / 송장검증</td><td>MIGO / MIRO</td></tr>
   <tr><td><b>RV</b></td><td>SD 대금청구 이관</td><td>VF01</td></tr>
   <tr><td><b>AF</b></td><td>감가상각</td><td>AFAB</td></tr></table></div>
  <h3 style="margin-top:16px">전기키 읽는 법</h3>
  <div class="tw"><table class="pkref"><tr><th>계정유형</th><th>차변</th><th>대변</th></tr>
   <tr><td>고객 (D)</td><td class="pk">01</td><td class="pk">11 · 15</td></tr>
   <tr><td>공급업체 (K)</td><td class="pk">21 · 25</td><td class="pk">31</td></tr>
   <tr><td>G/L (S)</td><td class="pk">40</td><td class="pk">50</td></tr>

/* ───────── T-code ───────── */
const TC = [
 ["조직·설정",[["OX02","회사코드 정의"],["OB13","계정과목표 정의"],["OB29","회계연도변형"],["OB52","전기기간 열기·닫기"],["OBA7","전표유형"],["OB41","전기키"],["FBN1","전표 번호범위"]]],
 ["기준정보",[["FS00","G/L 계정 중앙 관리"],["BP","Business Partner"],["AS01","자산마스터 생성"],["FI12","거래은행"]]],
 ["GL",[["FB50","G/L 전표 입력"],["FB03","전표 조회"],["FB08","역분개"],["FV50","G/L 보류전표"],["FBL3N","G/L 개별항목 조회"],["F-03","G/L 반제"]]],
 ["AP",[["FB60","공급업체 송장"],["MIRO","송장검증"],["F-53","수동 지급"],["F110","자동지급"],["FBL1N","공급업체 개별항목"],["F-48","선급금 지급"]]],
 ["AR",[["FB70","고객 송장"],["F-28","입금"],["FBL5N","고객 개별항목"],["F150","독촉"],["VFX3","회계 이관 차단 청구"]]],
 ["AA·은행·결산",[["AFAB","감가상각 실행"],["F-90","자산 취득(공급업체)"],["F-92","자산 매각(고객)"],["FF_5","전자은행명세 업로드"],["FAGL_FCV","외화평가"],["FAGLGVTR","G/L 잔액이월"],["MR11","GR/IR 계정 정리"],["F.01","재무제표"]]]
];
const TCALL = TC.flatMap(g=>g[1]);

/* ───────── 상태 ───────── */
let S={done:[],lab:[]};
try{ S=Object.assign(S,JSON.parse(localStorage.getItem("fiapp")||"{}")); }catch(e){}
const save=()=>{ try{ localStorage.setItem("fiapp",JSON.stringify(S)); }catch(e){} };
const $=s=>document.querySelector(s);
const app=$("#app");

function jeTable(rows){
  let d=0,c=0;
  const tr=rows.map(r=>{d+=r[2];c+=r[3];return `<tr><td class="pk">${r[0]}</td><td>${r[1]} ${ACCT[r[1]]}</td><td class="n">${r[2]?fmt(r[2]):""}</td><td class="n">${r[3]?fmt(r[3]):""}</td></tr>`;}).join("");
  return `<div class="tw"><table><tr><th>PK</th><th>계정</th><th class="n">차변</th><th class="n">대변</th></tr>${tr}</table></div>`;
}
function quizBlock(qs,key){
  return qs.map((q,i)=>`<div class="card" data-q="${key}-${i}"><b>Q${i+1}. ${q[0]}</b>
   ${q[1].map((o,j)=>`<button class="opt" data-a="${j}" data-c="${q[2]}">${o}</button>`).join("")}
   <div class="ex">${q[3]}</div></div>`).join("");
}
function bindQuiz(root,onAnswer){
  root.querySelectorAll("[data-q]").forEach(card=>{
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const c=+b.dataset.c, a=+b.dataset.a;
      card.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.a===c) x.classList.add("ok");});
      if(a!==c) b.classList.add("ng");
      card.querySelector(".ex").classList.add("on");
      onAnswer&&onAnswer(a===c);
    });
  });
}

/* ───────── 화면 ───────── */
function vHome(){
  const pct=Math.round(S.done.length/L.length*100), lp=Math.round(S.lab.length/LAB.length*100);
  app.innerHTML=`
  <div class="hero">
    <h2>SAP FI, 한 바퀴</h2>
    <p class="lead" style="margin:0">조직구조 → 기준정보 → 전표 → P2P → O2C → 자산 → 은행 → 결산 → S/4HANA. Global Bike US00 회사코드, USD 거래로 배움.</p>
    <div class="grid g2" style="margin-top:12px">
      <div><b>레슨 진도</b> ${S.done.length}/${L.length}<div class="bar"><i style="width:${pct}%"></i></div></div>
      <div><b>전표 실습</b> ${S.lab.length}/${LAB.length}<div class="bar"><i style="width:${lp}%"></i></div></div>
    </div>
  </div>
  <h3 style="margin:20px 0 10px">학습 순서</h3>
  <div class="grid g2">${L.map((l,i)=>`<button class="lcard ${S.done.includes(i)?"done":""}" data-l="${i}"><div class="lno">${S.done.includes(i)?"✓":i+1}</div><div><b>${l.t}</b><span>${l.g}</span></div></button>`).join("")}</div>
  <div class="grid g3" style="margin-top:16px">
    <div class="card"><h3>전표 실습</h3><p style="margin:0 0 10px;font-size:14px">SAP 화면처럼 전기키·계정·금액을 직접 입력하고 채점받음.</p><a class="btn sm" href="#lab" style="text-decoration:none">시작</a></div>
    <div class="card"><h3>종합 퀴즈</h3><p style="margin:0 0 10px;font-size:14px">전 레슨에서 10문제를 무작위 출제함.</p><a class="btn sm" href="#quiz" style="text-decoration:none">풀기</a></div>
    <div class="card"><h3>T-code</h3><p style="margin:0 0 10px;font-size:14px">업무별 T-code 맵과 4지선다 드릴.</p><a class="btn sm" href="#tcode" style="text-decoration:none">보기</a></div>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.l));
}
function vLessons(){
  app.innerHTML=`<h2>레슨</h2><p class="lead">각 레슨은 개념 → 흐름 → 전표 → 이해도 체크로 구성됨.</p>
  <div class="grid">${L.map((l,i)=>`<button class="lcard ${S.done.includes(i)?"done":""}" data-l="${i}"><div class="lno">${S.done.includes(i)?"✓":i+1}</div><div><b>${l.t}</b><span>${l.g}</span></div></button>`).join("")}</div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLesson(+b.dataset.l));
}
function openLesson(i){
  const l=L[i]; let right=0, answered=0;
  app.innerHTML=`<button class="back" id="bk">← 레슨 목록</button>
   <div class="row"><span class="pill ${S.done.includes(i)?"done":""}">LESSON ${i+1}${S.done.includes(i)?" · 완료":""}</span></div>
   <h2>${l.t}</h2><p class="lead"><b>학습 목표</b> — ${l.g}</p>
   <div class="card">${l.html}</div>
   <h3>이해도 체크</h3>${quizBlock(l.q,"l"+i)}
   <div class="row" style="margin-top:8px">
    ${i>0?`<button class="btn ghost" id="prev">← 이전</button>`:""}
    <button class="btn" id="fin">${S.done.includes(i)?"완료됨 · 다음 레슨":"레슨 완료"}</button>
   </div><div id="qr" class="fb"></div>`;
  if(l.je){ const box=$("#"+l.je.id); box.innerHTML=l.je.list.map(([h,rows])=>`<div class="je-h">${h}</div>${jeTable(rows)}`).join(""); }
  bindQuiz(app,ok=>{answered++; if(ok) right++; if(answered===l.q.length){const f=$("#qr"); f.className="fb "+(right===l.q.length?"ok":"ng"); f.innerHTML=`<div class="t">${right} / ${l.q.length} 정답</div>${right===l.q.length?"모두 맞혔음. 레슨 완료를 누르세요.":"해설을 읽고 개념을 다시 확인하세요."}`;}});
  $("#bk").onclick=()=>{location.hash="lessons";route();};
  if($("#prev")) $("#prev").onclick=()=>openLesson(i-1);
  $("#fin").onclick=()=>{ if(!S.done.includes(i)){S.done.push(i);save();} i<L.length-1?openLesson(i+1):(location.hash="home",route()); };
  window.scrollTo(0,0);
}

/* lab */
let li=0;
function vLab(){
  const x=LAB[li];
  const pkOpt=v=>`<option value="">PK</option>`+Object.keys(PK).map(k=>`<option value="${k}" ${k===v?"selected":""}>${k}</option>`).join("");
  const acOpt=v=>`<option value="">계정 선택</option>`+Object.entries(ACCT).map(([k,n])=>`<option value="${k}" ${k===v?"selected":""}>${k} ${n}</option>`).join("");
  app.innerHTML=`<h2>전표 실습</h2><p class="lead">상황을 읽고 SAP 전표를 입력함. 금액은 양수로 넣고 차·대변은 전기키가 결정함.</p>
  <div class="dots">${LAB.map((_,k)=>`<button class="${S.lab.includes(k)?"done":""} ${k===li?"cur":""}" data-k="${k}">${k+1}</button>`).join("")}</div>
  <div class="scene">${li+1}. ${x.s}</div>
  <div class="gui">
   <div class="tb"><span class="tc">${x.tc}</span> 전표 입력 — Global Bike Inc.</div>
   <div class="hd"><div><label>회사코드</label><b>US00</b></div><div><label>전표유형</label><b>${x.dt}</b></div><div><label>전기일</label><b>2026-11-30</b></div><div><label>통화</label><b>USD</b></div></div>
   <div class="lines"><div class="lnh"><span>전기키</span><span>계정</span><span style="text-align:right">금액</span><span></span></div><div id="rows"></div>
    <button class="btn ghost sm" id="add">+ 라인 추가</button></div>
   <div class="sum"><span id="sd">차변 0</span><span id="sc">대변 0</span><span id="sb" class="bal z">잔액 0</span></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn" id="chk">전기 (채점)</button><button class="btn ghost" id="hint">힌트</button><button class="btn ghost" id="ans">정답 보기</button>
   <span style="margin-left:auto"></span>${li>0?`<button class="btn ghost sm" id="pv">이전</button>`:""}${li<LAB.length-1?`<button class="btn ghost sm" id="nx">다음</button>`:""}</div>
  <div id="fb" class="fb"></div>
  <details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">전기키 참고표</summary>
   <div class="tw" style="margin-top:8px"><table class="pkref"><tr><th>PK</th><th>의미</th></tr>${Object.entries(PK).map(([k,v])=>`<tr><td class="pk">${k}</td><td>${v.slice(3)}</td></tr>`).join("")}</table></div></details>`;
  let rows=[["","",""],["","",""]];
  const draw=()=>{
    $("#rows").innerHTML=rows.map((r,k)=>`<div class="ln" data-r="${k}"><select data-f="0">${pkOpt(r[0])}</select><select data-f="1">${acOpt(r[1])}</select><input data-f="2" inputmode="decimal" placeholder="0" value="${r[2]}"><button class="x" data-del="${k}" aria-label="삭제">✕</button></div>`).join("");
    calc();
  };
  const calc=()=>{
    let d=0,c=0; rows.forEach(r=>{const a=+String(r[2]).replace(/,/g,"")||0; if(!r[0])return; DR.has(r[0])?d+=a:c+=a;});
    $("#sd").textContent="차변 "+fmt(d); $("#sc").textContent="대변 "+fmt(c);
    const b=$("#sb"); b.textContent="잔액 "+fmt(d-c); b.className="bal "+(d===c?"z":"nz");
  };
  $("#rows").addEventListener("input",e=>{const r=e.target.closest("[data-r]"); if(!r) return; rows[+r.dataset.r][+e.target.dataset.f]=e.target.value; calc();});
  $("#rows").addEventListener("change",e=>{const r=e.target.closest("[data-r]"); if(!r) return; rows[+r.dataset.r][+e.target.dataset.f]=e.target.value; calc();});
  $("#rows").addEventListener("click",e=>{const d=e.target.dataset.del; if(d===undefined) return; rows.splice(+d,1); if(!rows.length) rows.push(["","",""]); draw();});
  $("#add").onclick=()=>{rows.push(["","",""]);draw();};
  const fb=(ok,t,m)=>{const f=$("#fb"); f.className="fb "+(ok?"ok":"ng"); f.innerHTML=`<div class="t">${t}</div>${m}`;};
  $("#hint").onclick=()=>fb(false,"힌트",x.h);
  $("#ans").onclick=()=>{ rows=x.a.map(a=>[a[0][0],a[1],String(Math.abs(a[2]))]); draw(); fb(true,"정답",x.h); };
  $("#chk").onclick=()=>{
    const used=rows.filter(r=>r[0]||r[1]||r[2]);
    if(used.some(r=>!r[0]||!r[1]||!(+String(r[2]).replace(/,/g,"")))) return fb(false,"입력 누락","모든 라인에 전기키·계정·금액을 넣어야 함.");
    let d=0,c=0; used.forEach(r=>{const a=+String(r[2]).replace(/,/g,""); DR.has(r[0])?d+=a:c+=a;});
    if(d!==c) return fb(false,"전기 불가 — 잔액 ≠ 0","SAP는 차변과 대변 합계가 같아야 전표를 저장함. 차이 "+fmt(d-c)+" USD.");
    const pool=x.a.map(a=>({pk:a[0],ac:a[1],amt:a[2]})); const miss=[];
    const ok = used.length===pool.length && used.every(r=>{
      const amt=(DR.has(r[0])?1:-1)*+String(r[2]).replace(/,/g,"");
      const k=pool.findIndex(p=>p.ac===r[1]&&p.pk.includes(r[0])&&p.amt===amt);
      if(k<0){miss.push(r); return false;} pool.splice(k,1); return true;});
    if(ok){ if(!S.lab.includes(li)){S.lab.push(li);save();} fb(true,"전기 완료 ✓","전표 "+(1900000000+li*7+11)+" 이(가) 회사코드 US00에 전기됨 (실습). "+x.h);
      document.querySelector(`.dots [data-k="${li}"]`).classList.add("done"); }
    else fb(false,"잔액은 맞지만 분개가 다름", "계정 또는 전기키를 다시 확인하세요. 확인할 라인: "+miss.map(r=>`<span class="pk">${r[0]}</span> ${r[1]}`).join(", "));
  };
  app.querySelectorAll(".dots [data-k]").forEach(b=>b.onclick=()=>{li=+b.dataset.k;vLab();});
  if($("#pv")) $("#pv").onclick=()=>{li--;vLab();};
  if($("#nx")) $("#nx").onclick=()=>{li++;vLab();};
  draw();
}

/* quiz */
function vQuiz(){
  const pool=L.flatMap((l,i)=>l.q.map(q=>[...q,l.t])).sort(()=>Math.random()-.5).slice(0,10);
  let right=0,n=0;
  app.innerHTML=`<h2>종합 퀴즈</h2><p class="lead">9개 레슨에서 무작위 10문제.</p>
   ${pool.map((q,i)=>`<div class="card" data-q="g-${i}"><span class="pill">${q[4]}</span><div style="margin-top:6px"><b>Q${i+1}. ${q[0]}</b></div>
    ${q[1].map((o,j)=>`<button class="opt" data-a="${j}" data-c="${q[2]}">${o}</button>`).join("")}<div class="ex">${q[3]}</div></div>`).join("")}
   <div class="card" id="res" style="display:none;text-align:center"></div>`;
  bindQuiz(app,ok=>{n++; if(ok) right++; if(n===pool.length){const r=$("#res"); r.style.display="block"; r.innerHTML=`<div class="score">${right} / 10</div><p>${right>=8?"FI 흐름을 잘 이해하고 있음.":"틀린 문제의 레슨을 다시 보세요."}</p><button class="btn" id="again">다시 풀기</button>`; $("#again").onclick=vQuiz; r.scrollIntoView({behavior:"smooth"});}});
}

/* tcode */
function vTcode(){
  app.innerHTML=`<h2>T-code</h2><p class="lead">업무 흐름별로 자주 쓰는 T-code. 아래 드릴로 외움.</p>
   <div class="card" id="drill"></div>
   <div class="tcg">${TC.map(([g,list])=>`<div class="card"><h3>${g}</h3><table>${list.map(([c,d])=>`<tr><td>${c}</td><td>${d}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
  let sc=0,cnt=0;
  const next=()=>{
    const ans=TCALL[Math.floor(Math.random()*TCALL.length)];
    const opts=[ans,...TCALL.filter(t=>t!==ans).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
    const d=$("#drill");
    d.innerHTML=`<div class="row"><b>T-code 드릴</b><span style="margin-left:auto;font-size:13px;color:var(--sub)">${sc} / ${cnt}</span></div>
     <p style="text-align:center;margin:10px 0 0;color:var(--sub)">이 업무의 T-code는?</p><div style="text-align:center;font-size:22px;font-weight:900;margin:2px 0 8px">${ans[1]}</div>
     <div class="grid g2">${opts.map(o=>`<button class="opt" style="font-family:var(--mono);font-weight:700;text-align:center" data-v="${o[0]}">${o[0]}</button>`).join("")}</div>`;
    d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      cnt++; const ok=b.dataset.v===ans[0]; if(ok) sc++;
      d.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.v===ans[0]) x.classList.add("ok");});
      if(!ok) b.classList.add("ng");
      setTimeout(next, ok?600:1300);
    });
  };
  next();
}

/* router */
const V={home:vHome,lessons:vLessons,lab:vLab,quiz:vQuiz,tcode:vTcode};
function route(){
  const h=(location.hash||"#home").slice(1); const v=V[h]?h:"home";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  V[v](); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
