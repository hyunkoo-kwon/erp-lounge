<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAP CO 용어집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#1b1d22;--sub:#5f6470;--line:#e3e5ea;
  --accent:#0A6ED1;--accent-soft:#EBF5FE;--star:#0A6ED1;--chip:#F7F7F7;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--sub);font-size:12px}
header{background:#354A5F;border-bottom:0}
.brand h1{color:#fff}.brand h1 span{color:#91C8F6}.brand small{color:#D1E8FF}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:11px 36px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:18px;padding:6px 8px;display:none;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--sub);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--card)}
main{padding:12px 16px;max-width:760px;margin:0 auto}
.count{font-size:12px;color:var(--sub);margin:2px 2px 10px}
.list{display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:active{transform:scale(.99)}
.item .body{flex:1;min-width:0}
.item .en{font-weight:700;font-size:15px}
.item .ko{color:var(--accent);font-size:14px;margin-left:6px;font-weight:500}
.item .d{color:var(--sub);font-size:13px;margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.tb{background:var(--chip);color:var(--sub)}
.star{border:0;background:none;font-size:19px;color:var(--line);cursor:pointer;padding:0 2px;line-height:1}
.star.on{color:var(--star)}
.empty{text-align:center;color:var(--sub);padding:48px 12px;font-size:14px;line-height:1.7}
mark{background:#dfe4f7;color:inherit;border-radius:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--sub);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
nav svg{width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:20px 20px 0 0;max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet .cat{font-size:12px;color:var(--sub)}
.sheet h2{font-size:22px;margin:4px 0 2px;letter-spacing:-.3px}
.sheet .kot{color:var(--accent);font-size:16px;font-weight:500}
.sheet .abbr{font-family:var(--mono);font-size:12px;color:var(--sub);margin-left:6px}
.sheet p{font-size:15px;line-height:1.75;margin:14px 0}
.tip{background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.65;margin:12px 0}
.tip b{color:var(--accent)}
.sec{font-size:12px;color:var(--sub);margin:16px 0 6px;font-weight:700;letter-spacing:.3px}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.code{font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer}
.code.tb{background:var(--chip);color:var(--ink)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.fc-wrap{perspective:1200px;margin-top:6px}
.fc{position:relative;height:340px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.face.back{transform:rotateY(180deg);text-align:left;justify-content:flex-start;overflow-y:auto}
.face .q{font-size:13px;color:var(--sub);margin-bottom:10px}
.face .big{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.face .hint{font-size:14px;color:var(--sub);line-height:1.6;margin-top:14px}
.face .tap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub)}
.fc-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 2px 10px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:7px;border-radius:8px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.score{display:flex;gap:8px;font-size:13px}
.score span{padding:3px 9px;border-radius:999px;background:var(--chip)}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>SAP <span>CO</span> 용어집</h1><small id="total"></small></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="용어 · 한글 · T-code · 테이블 검색" autocomplete="off">
    <button id="clr" aria-label="지우기">✕</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="view"></main>

<nav>
  <button data-tab="list" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>용어</button>
  <button data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>즐겨찾기</button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>학습카드</button>
</nav>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
const CATS = {
 GEN:"원가회계 기초", ORG:"조직·기본", CEL:"원가요소", CCA:"코스트센터", IO:"내부오더",
 PCP:"제품원가계획", PCC:"원가대상관리", ML:"물질원장", PA:"수익성분석", PCA:"손익센터",
 CLS:"기간마감", S4:"S/4HANA"
};
const D = [
["직접원가","Direct Cost","","GEN","특정 원가대상(제품·오더)에 직접 추적 가능한 원가임. 직접재료비·직접노무비가 대표적임.","","",["간접원가","원가대상"]],
["간접원가","Indirect Cost / Overhead","","GEN","여러 원가대상에 공통으로 발생해 직접 추적이 어려운 원가임. 코스트센터에 모은 뒤 배부기준으로 나눔.","","",["직접원가","오버헤드 계산","배부(Assessment)"]],
["고정비","Fixed Cost","","GEN","조업도(생산량·작업시간)와 무관하게 일정하게 발생하는 원가임. 감가상각비·임차료 등.","","",["변동비","고정비/변동비 분할"]],
["변동비","Variable Cost","","GEN","조업도에 비례해 증감하는 원가임. 원재료비·동력비 등.","","",["고정비","고정비/변동비 분할"]],
["원가동인","Cost Driver","","GEN","원가 발생을 유발하는 요인임. SAP에서는 활동유형·통계주요지표가 원가동인 역할을 함.","","",["활동유형","통계 주요지표"]],
["공헌이익","Contribution Margin","CM","GEN","매출액에서 변동비를 뺀 금액임. 고정비 회수와 이익 창출에 기여하는 몫으로 CO-PA 리포트의 핵심 지표임.","","",["수익성 분석","변동비"]],
["표준원가계산","Standard Costing","","GEN","사전에 정한 표준(수량×단가)으로 원가를 계산하고 실제와의 차이를 분석하는 방식임. SAP 제조업 기본 방식임.","","",["표준원가","차이 계산"]],
["원가대상","Cost Object","","GEN","원가를 집계하는 대상임. 코스트센터·내부오더·생산오더·WBS·수익성 세그먼트 등이 있음.","","",["실제 전기 vs 통계 전기"]],

["관리회계 영역","Controlling Area","KOKRS","ORG","CO의 최상위 조직단위임. 하나 이상의 회사코드를 할당하며, 할당된 회사코드는 같은 계정과목표·회계연도 변형을 써야 함.","OKKP / OX19","TKA01 / TKA02",["회사코드","표준 계층"]],
["운영관련 관심분야","Operating Concern","ERKRS","ORG","CO-PA의 최상위 조직단위임. 하나 이상의 관리회계 영역을 할당하며 특성·값필드 구조를 정의함.","KEA0 / KEKK","TKEB",["수익성 분석","특성"]],
["회사코드","Company Code","BUKRS","ORG","법적 재무제표를 작성하는 FI 단위임. CO에서는 관리회계 영역에 할당되어 원가 흐름의 출발점이 됨.","OX02 / OX19","T001",["관리회계 영역"]],
["계정과목표","Chart of Accounts","KTOPL","ORG","G/L 계정 목록임. 관리회계 영역과 회사코드가 같은 운영 계정과목표를 공유해야 함.","OB13","T004",["원가요소"]],
["회계연도 변형","Fiscal Year Variant","PERIV","ORG","회계연도의 기간 수와 기간 구분을 정의함. K4 = 역년 12기간 + 특별기간 4개.","OB29","T009",["관리회계 영역"]],
["표준 계층","Standard Hierarchy","","ORG","관리회계 영역의 모든 코스트센터를 담는 필수 트리 구조임. 코스트센터 생성 시 반드시 노드에 할당함.","OKEON","SETHEADER / SETNODE",["코스트센터","코스트센터 그룹"]],
["버전","Version","VERSN","ORG","계획·실적 데이터를 구분하는 키임. 버전 0은 실적과 기본 계획을 담는 필수 버전임.","OKEQ","TKA09",["원가 계획"]],
["가치유형","Value Type","WRTTP","ORG","CO 라인아이템의 성격을 구분함. 04 실적, 01 계획, 11 통계 실적, 21/22 약정 등.","","",["실제 전기 vs 통계 전기"]],
["실제 전기 vs 통계 전기","Real vs Statistical Posting","","ORG","한 줄의 비용은 실제(real) 원가대상 하나에만 귀속되고, 나머지 대상에는 통계용으로만 기록됨. 통계 금액은 배부·정산 대상이 아님.","","",["통계 오더","원가대상"]],
["오브젝트 번호","Object Number","OBJNR","ORG","CO 원가대상을 시스템 내부에서 식별하는 키임. KS+관리회계영역+코스트센터, OR+오더번호 형식.","","ONR00",["원가대상"]],
["기능영역","Functional Area","FKBER","ORG","매출원가법 손익계산서(생산·판매·관리·연구)용 분류임. 코스트센터 범주나 G/L에서 파생됨.","OKBD","TFKB",["코스트센터 범주"]],
["세그먼트","Segment","SEGMENT","ORG","IFRS 8 / US GAAP 세그먼트 보고 단위임. 손익센터에 할당되어 파생됨.","","FAGL_SEGM",["손익센터"]],

["원가요소","Cost Element","KSTAR","CEL","CO에서 원가·수익을 분류하는 단위임. S/4HANA에서는 별도 마스터가 아니라 G/L 계정의 한 유형으로 통합됨.","FS00 (S/4) / KA01·KA06 (ECC)","SKA1 / CSKB (ECC)",["1차 원가요소","2차 원가요소","원가요소 범주"]],
["1차 원가요소","Primary Cost Element","","CEL","FI에서 외부 거래로 발생한 비용·수익을 CO로 넘기는 원가요소임. 대응 G/L 계정이 손익계정으로 존재함.","FS00","",["원가요소","2차 원가요소"]],
["2차 원가요소","Secondary Cost Element","","CEL","CO 내부 배분(배부·활동배부·정산·오버헤드)에만 쓰는 원가요소임. FI 손익에 영향을 주지 않음.","FS00","",["배부(Assessment)","직접 활동배부"]],
["원가요소 범주","Cost Element Category","KATYP","CEL","원가요소 용도를 지정함. 1 일반 1차, 11 수익, 12 매출차감, 22 외부정산, 21 내부정산, 41 오버헤드, 42 배부, 43 내부 활동배부.","FS00","",["1차 원가요소","2차 원가요소"]],
["원가요소 그룹","Cost Element Group","","CEL","원가요소를 묶은 집합임. 계획·배부 사이클·리포트 범위 지정에 사용함.","KAH1 / KAH2","SETHEADER",["원가요소"]],

["코스트센터","Cost Center","KOSTL","CCA","책임·발생 장소별로 간접원가를 집계하는 단위임. 부서·라인·지원조직 단위로 만듦.","KS01 / KS02 / KS03","CSKS / CSKT",["코스트센터 범주","표준 계층"]],
["코스트센터 범주","Cost Center Category","KOSAR","CCA","코스트센터의 성격(생산·관리·판매·지원 등)을 구분하고 활동유형·기능영역 기본값을 지정함.","OKA2","TKA05",["코스트센터","기능영역"]],
["코스트센터 그룹","Cost Center Group","","CCA","코스트센터를 묶은 대안 계층임. 리포트와 배부 사이클의 송신·수신 범위로 사용함.","KSH1 / KSH2","SETHEADER",["표준 계층"]],
["활동유형","Activity Type","LSTAR","CCA","코스트센터가 제공하는 산출물 단위임(기계시간·인건시간 등). 활동량×활동단가로 원가를 배부함.","KL01 / KL02 / KL03","CSLA",["활동단가","직접 활동배부","작업장"]],

const CATK = Object.keys(CATS);
const DATA = D.map((r,i)=>({id:"t"+i,ko:r[0],en:r[1],ab:r[2],cat:r[3],desc:r[4],
  tc:r[5]?r[5].split(" / "):[],tb:r[6]?r[6].split(" / "):[],tip:TIPS[r[0]]||null,relKo:r[7]}));
const idByKo = Object.fromEntries(DATA.map(d=>[d.ko,d.id]));
DATA.forEach(d=>d.rel=d.relKo.map(k=>idByKo[k]).filter(Boolean));
const byId = Object.fromEntries(DATA.map(d=>[d.id,d]));

let tab="list", cat="all", query="";
let favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem("co-favs")||"[]")); }catch(e){}
const saveFavs=()=>{ try{ localStorage.setItem("co-favs",JSON.stringify([...favs])); }catch(e){} };

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=(s)=>{ s=esc(s); if(!query) return s; const q=esc(query).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return s.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`); };

$("#total").textContent = `${DATA.length}개 용어`;

function renderChips(){
  const all=[["all","전체"],...Object.entries(CATS)];
  $("#chips").innerHTML = all.map(([k,v])=>`<button class="chip ${cat===k?"on":""}" data-c="${k}">${v}</button>`).join("");
}
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  cat=b.dataset.c; renderChips(); render();
});

function match(d){
  if(cat!=="all" && d.cat!==cat) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  return [d.en,d.ko,d.ab,d.desc,...d.tc,...d.tb].some(x=>x.toLowerCase().includes(q));
}

function card(d){
  const tags=[...d.tc.slice(0,3).map(t=>`<span class="tag">${hl(t)}</span>`),...d.tb.slice(0,2).map(t=>`<span class="tag tb">${hl(t)}</span>`)].join("");
  return `<div class="item" data-id="${d.id}">
    <div class="body">
      <div><span class="en">${hl(d.en)}</span><span class="ko">${hl(d.ko)}</span></div>
      <div class="d">${hl(d.desc)}</div>
      ${tags?`<div class="tags">${tags}</div>`:""}
    </div>
    <button class="star ${favs.has(d.id)?"on":""}" data-star="${d.id}" aria-label="즐겨찾기">★</button>
  </div>`;
}

function render(){
  const v=$("#view");
  $("header").style.display = tab==="study" ? "none" : "";
  if(tab==="study") return renderStudy();
  let list = DATA.filter(match);
  if(tab==="fav") list = list.filter(d=>favs.has(d.id));
  if(!list.length){
    v.innerHTML = `<div class="empty">${tab==="fav"&&!favs.size?"아직 즐겨찾기한 용어가 없습니다.<br>용어 옆 ★을 눌러 추가하세요.":"검색 결과가 없습니다."}</div>`;
    return;
  }
  v.innerHTML = `<div class="count">${list.length}개</div><div class="list">${list.map(card).join("")}</div>`;
}

$("#view").addEventListener("click",e=>{
  const s=e.target.closest("[data-star]");
  if(s){ e.stopPropagation(); toggleFav(s.dataset.star); render(); return; }
  const it=e.target.closest(".item"); if(it) openSheet(it.dataset.id);
});

function toggleFav(id){ favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); }

function openSheet(id){
  const d=byId[id];
  const sh=$("#sheet");
  const codeBtns=(arr,cls)=>arr.map(c=>`<button class="code ${cls}" data-copy="${esc(c)}">${esc(c)}</button>`).join("");
  sh.innerHTML = `<div class="grip"></div>
    <div class="cat">${CATS[d.cat]}</div>
    <h2>${esc(d.en)}${d.ab?`<span class="abbr">${esc(d.ab)}</span>`:""}</h2>
    <div class="kot">${esc(d.ko)}</div>
    <p>${esc(d.desc)}</p>
    ${d.tip?`<div class="tip"><b>실무 포인트</b><br>${esc(d.tip)}</div>`:""}
    ${d.tc.length?`<div class="sec">T-CODE · 탭하여 복사</div><div class="codes">${codeBtns(d.tc,"")}</div>`:""}
    ${d.tb.length?`<div class="sec">테이블</div><div class="codes">${codeBtns(d.tb,"tb")}</div>`:""}
    ${d.rel.length?`<div class="sec">관련 용어</div><div class="rel">${d.rel.map(r=>`<button data-go="${r}">${esc(byId[r].ko)}</button>`).join("")}</div>`:""}
    <div class="row">
      <button class="btn" data-fav="${d.id}">${favs.has(d.id)?"★ 즐겨찾기 해제":"☆ 즐겨찾기"}</button>
      <button class="btn pri" data-close>닫기</button>
    </div>`;
  sh.scrollTop=0;
  sh.classList.add("open"); $("#bg").classList.add("open");
}
function closeSheet(){ $("#sheet").classList.remove("open"); $("#bg").classList.remove("open"); }
$("#bg").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.close!==undefined) return closeSheet();
  if(t.dataset.go) return openSheet(t.dataset.go);
  if(t.dataset.fav){ toggleFav(t.dataset.fav); openSheet(t.dataset.fav); render(); return; }
  if(t.dataset.copy){
    try{ await navigator.clipboard.writeText(t.dataset.copy); toast(`${t.dataset.copy} 복사됨`); }
    catch(err){ toast("복사할 수 없습니다"); }
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

let tt;
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1400); }

const qi=$("#q");
qi.addEventListener("input",()=>{ query=qi.value.trim(); $("#clr").style.display=query?"block":"none"; render(); });
$("#clr").addEventListener("click",()=>{ qi.value=""; query=""; $("#clr").style.display="none"; render(); qi.focus(); });

document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  if(tab==="study") initStudy();
  render(); window.scrollTo(0,0);
});

let deck=[], idx=0, mode="ko", src="all", known=0, unknown=0;
function initStudy(){
  let pool = src==="fav" ? DATA.filter(d=>favs.has(d.id)) : src==="all" ? DATA : DATA.filter(d=>d.cat===src);
  deck = pool.slice().sort(()=>Math.random()-.5);
  idx=0; known=0; unknown=0;
}
function renderStudy(){
  const v=$("#view");
  const opts=[["all","전체"],["fav","즐겨찾기"],...Object.entries(CATS)].map(([k,n])=>`<option value="${k}" ${src===k?"selected":""}>${n}</option>`).join("");
  const top = `<div style="padding-top:calc(4px + env(safe-area-inset-top))">
    <div class="brand" style="margin:6px 0 12px"><h1>학습 <span>카드</span></h1>
      <select id="src" style="font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)">${opts}</select></div>
    <div class="seg"><button data-m="ko" class="${mode==="ko"?"on":""}">한글 → 영문</button><button data-m="en" class="${mode==="en"?"on":""}">영문 → 한글</button><button data-m="desc" class="${mode==="desc"?"on":""}">설명 → 용어</button></div>`;
  if(!deck.length){ v.innerHTML = top+`<div class="empty">카드가 없습니다.<br>즐겨찾기를 추가하거나 다른 범위를 선택하세요.</div></div>`; bindStudy(); return; }
  if(idx>=deck.length){
    v.innerHTML = top+`<div class="empty" style="padding-top:40px"><div style="font-size:40px">🎯</div><b style="font-size:18px;color:var(--ink)">한 바퀴 완료</b><br>알았음 ${known} · 다시 볼 것 ${unknown}<div class="row" style="max-width:320px;margin:20px auto 0"><button class="btn pri" id="again">다시 섞기</button></div></div></div>`;
    bindStudy(); $("#again").onclick=()=>{initStudy();render();}; return;
  }
  const d=deck[idx];
  const front = mode==="ko" ? `<div class="q">영문 용어는?</div><div class="big">${esc(d.ko)}</div><div class="hint">${CATS[d.cat]}</div>`
              : mode==="en" ? `<div class="q">한글 용어는?</div><div class="big">${esc(d.en)}</div><div class="hint">${CATS[d.cat]}</div>`
              : `<div class="q">이 설명에 해당하는 용어는?</div><div class="hint" style="font-size:15px;color:var(--ink);margin:0">${esc(d.desc)}</div>`;
  const back = `<div class="cat" style="font-size:12px;color:var(--sub)">${CATS[d.cat]}</div>
    <div style="font-size:21px;font-weight:700;margin-top:4px">${esc(d.en)}</div>
    <div style="color:var(--accent);font-weight:500;margin-bottom:10px">${esc(d.ko)}</div>
    <div style="font-size:14px;line-height:1.7;color:var(--sub)">${esc(d.desc)}</div>
    ${d.tc.length?`<div class="tags" style="margin-top:12px">${d.tc.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}`;
  v.innerHTML = top+`
    <div class="prog"><i style="width:${idx/deck.length*100}%"></i></div>
    <div class="fc-meta"><span>${idx+1} / ${deck.length}</span><div class="score"><span>✓ ${known}</span><span>↻ ${unknown}</span></div></div>
    <div class="fc-wrap"><div class="fc" id="fc"><div class="face">${front}<div class="tap">탭하여 뒤집기</div></div><div class="face back">${back}</div></div></div>
    <div class="row"><button class="btn" id="no">↻ 다시 볼래요</button><button class="btn pri" id="yes">✓ 알아요</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="star">${favs.has(d.id)?"★ 즐겨찾기됨":"☆ 즐겨찾기 추가"}</button></div>
  </div>`;
  bindStudy();
  $("#fc").onclick=()=>$("#fc").classList.toggle("flip");
  $("#yes").onclick=()=>{known++;idx++;render();};
  $("#no").onclick=()=>{unknown++;deck.push(d);idx++;render();};
  $("#star").onclick=()=>{toggleFav(d.id);render();};
}
function bindStudy(){
  const s=$("#src"); if(s) s.onchange=()=>{src=s.value;initStudy();render();};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
}

renderChips(); render();
</script>
