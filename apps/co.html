<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP CO 실습 앱 — 원가센터에서 수익성 분석까지</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#354A5F; --brand:#0A6ED1; --brand2:#0854A0; --sel:#EBF5FE;
  --ink:#1D2D3E; --sub:#556B82; --line:#D9DEE3; --soft:#F5F6F7;
  --ok:#107E3E; --okbg:#F1FDF6; --ng:#BB0000; --ngbg:#FFEBEB; --warn:#E9730C;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,select,input{font:inherit;color:inherit}
.shell{background:var(--shell);color:#fff}
.shell .in{max-width:1100px;margin:0 auto;padding:16px 18px 14px}
.shell .eyebrow{font-size:12px;letter-spacing:.08em;color:#BCD4EA;font-weight:700}
.shell h1{margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.shell p{margin:2px 0 0;color:#D5E1EC;font-size:13px}
nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
nav .in{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;padding:12px 12px;text-decoration:none;color:var(--sub);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
nav a.on{color:var(--brand);border-color:var(--brand);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
section{display:none}
section.on{display:block}
h2{font-size:21px;margin:0 0 4px;font-weight:900;color:var(--shell)}
h3{font-size:16px;margin:22px 0 8px;color:var(--shell)}
.lead{color:var(--sub);margin:0 0 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.card h4{margin:0 0 6px;font-size:15px;color:var(--shell)}
.card p{margin:0;color:var(--sub);font-size:14px}
.card.sel{background:var(--sel);border-color:#B0D4F7}
button.card{text-align:left;cursor:pointer;width:100%}
button.card:hover{border-color:var(--brand)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--sel);color:var(--brand2);margin:0 4px 4px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--shell);color:#fff;font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
tr:hover td{background:#FAFBFC}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--sel)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],select{border:1px solid #B8C3CE;border-radius:6px;padding:6px 8px;width:100%;background:#fff}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--sub);font-weight:500}
/* flow */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;position:relative;text-align:left}
.step .n{font-size:12px;color:var(--brand);font-weight:700}
.step .t{font-weight:900;font-size:16px;color:var(--shell)}
.step .c{font-size:13px;color:var(--sub)}
.step.on{background:var(--sel);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.detail{margin-top:12px;border:1px solid #B0D4F7;background:var(--sel);border-radius:10px;padding:16px}
.detail h4{margin:0 0 6px;color:var(--shell)}
.detail dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}
.detail dt{color:var(--sub);font-weight:700}
.detail dd{margin:0;min-width:0}
/* org tree */
.tree{font-size:14px}
.node{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff;margin:4px 0;cursor:pointer}
.node b{color:var(--shell)}
.node.on{border-color:var(--brand);background:var(--sel)}
.tree ul{list-style:none;margin:0;padding-left:26px;border-left:2px solid var(--line)}
.tree li{position:relative;padding-left:10px}
.tree li::before{content:"";position:absolute;left:-2px;top:20px;width:10px;border-top:2px solid var(--line)}
/* sim */
.sim{display:grid;grid-template-columns:300px 1fr;gap:16px}
.sim>div{min-width:0}
@media(max-width:820px){.sim{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h4{margin:0 0 10px;font-size:15px;color:var(--shell)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--brand);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:#fff;color:var(--brand);padding:6px;cursor:pointer;font-weight:700;font-size:13px}
.seg button.on{background:var(--brand);color:#fff}
.stock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stock div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0}
.stock small{display:block;color:var(--sub);font-size:12px}
.stock b{font-size:18px;color:var(--shell);word-break:break-all}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.je{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.je .h{background:var(--soft);padding:6px 10px;font-size:13px;font-weight:700;color:var(--shell);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.je .tb{overflow-x:auto}
.je table{min-width:520px}
.tbl table{min-width:560px}
.je td:first-child,.tbl td:first-child{white-space:nowrap}
.je table td,.je table th{padding:5px 10px;font-size:13px}
.je table th{background:#fff;color:var(--sub);border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--sub);margin-top:6px}
.empty{color:var(--sub);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.taccts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.tacc{border:1px solid var(--line);border-radius:8px;padding:8px}
.tacc .nm{font-weight:700;font-size:13px;color:var(--shell);text-align:center;border-bottom:2px solid var(--shell);padding-bottom:4px}
.tacc .sides{display:grid;grid-template-columns:1fr 1fr;font-size:13px}
.tacc .sides div{padding:4px 6px}
.tacc .sides div:first-child{border-right:2px solid var(--shell)}
.tacc .bal{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
/* search */
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search input{flex:1 1 240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
/* special */
.sp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lane{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:13px;min-width:110px;max-width:100%}
.box b{display:block;color:var(--shell);font-size:14px}
.arr{color:var(--brand);font-weight:900}
/* close checklist */
.ck{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;background:#fff;cursor:pointer}
.ck:hover{border-color:var(--brand)}
.ck.on{background:var(--sel);border-color:var(--brand)}
.ck .bx{flex:none;width:20px;height:20px;border:2px solid #B8C3CE;border-radius:5px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:900}
.ck.done .bx{background:var(--ok);border-color:var(--ok)}
.ck .ct{font-weight:700;color:var(--shell)}
.ck .cs{font-size:13px;color:var(--sub)}
.pos{color:var(--ng)} .negv{color:var(--ok)}
tr.sum td{font-weight:900;background:var(--soft)}
/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.q .qt{font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0;background:#fff;cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.exp{font-size:13px;color:var(--sub);margin-top:6px;display:none}
.exp.on{display:block}
.score{position:sticky;top:52px;background:#fff;padding:8px 0;font-weight:700;color:var(--shell);z-index:5}
footer{max-width:1100px;margin:0 auto;padding:0 18px 30px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div class="shell"><div class="in">
  <div class="eyebrow">SAP CO · GLOBAL BIKE · USD</div>
  <h1>SAP CO 실습 앱 — 원가센터에서 수익성 분석까지</h1>
  <p>S/4HANA 관리회계 구조, 배부·분배, 오더 정산, 제품원가, 차이, Material Ledger, CO-PA를 눌러 보며 익힘</p>
</div></div>
<nav><div class="in" id="nav"></div></nav>
<main id="main"></main>
<footer>곰선비의 ERP 실무노트 · 학습용 예시 데이터(Global Bike 기준 가정, 관리회계영역 NA00 · 회사코드 US00, 계정번호·코드·금액은 가상)</footer>

<script>
const TABS=[
 ["org","CO 구조"],["ce","원가요소"],["cca","원가센터 시뮬레이터"],["io","내부오더"],["pc","제품원가 산정"],
 ["var","생산오더 차이·정산"],["ml","Material Ledger"],["pa","CO-PA 수익성"],["close","기간마감 순서"],["dict","T-code·테이블"],["quiz","퀴즈"]
];
const $=s=>document.querySelector(s);
const fmt=n=>(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const sfmt=n=>(n<0?"−":n>0?"+":"")+fmt(Math.abs(n));
const val=id=>{const e=$("#"+id);return e?(Number(e.value)||0):0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function jeHtml(docs,cols){
 return docs.map(j=>`<div class="je"><div class="h"><span>${j.title}</span>${j.sub?`<span style="font-weight:500;color:var(--sub)">${j.sub}</span>`:""}</div><div class="tb"><table><tr><th>${cols[0]}</th><th>${cols[1]}</th><th class="num">차변</th><th class="num">대변</th><th>근거</th></tr>${j.lines.map(l=>`<tr><td>${l[0]}</td><td class="mono">${l[1]}</td><td class="num">${l[2]>0?fmt(l[2]):""}</td><td class="num">${l[2]<0?fmt(-l[2]):""}</td><td style="color:var(--sub)">${l[3]||""}</td></tr>`).join("")}</table></div></div>`).join("");
}

/* ---------------- ORG ---------------- */
const ORG={
 oc:["Operating Concern GB00","경영단위 (CO-PA)","수익성 분석의 최상위 단위. 특성(고객·제품·지역 등)을 정의하고 관리회계영역에 할당(KEKK). 여러 관리회계영역이 하나의 경영단위를 공유할 수 있음.","KEA0 · KEKK","코드 GB00은 예시"],
 ka:["Controlling Area NA00","관리회계영역","원가센터·오더·손익센터가 속하는 CO의 기본 조직 단위. 통화, 계정과목표, 회계연도변형, 표준계층을 지정(OKKP).","TKA01","같은 관리회계영역에 묶이는 회사코드는 운영 계정과목표와 회계연도변형이 같아야 함"],
 cc:["Company Code US00","회사코드","재무제표를 내는 법인 단위(Global Bike Inc.). 관리회계영역에 할당(OX19). 하나의 회사코드는 하나의 관리회계영역에만 속함.","T001 · TKA02 (할당)","여러 회사코드를 하나의 관리회계영역에 할당하면 회사 간 원가 배분이 가능"],
 sh:["Std. Hierarchy NA00","원가센터 표준계층","관리회계영역의 모든 원가센터가 반드시 한 노드에 속하는 트리. 원가센터 생성 시 필수 입력(OKEON).","SETHEADER · SETNODE","대체 계층은 원가센터 그룹(KSH1)으로 따로 만듦"],
 n1:["노드 NA-ADM","관리 부문","관리·IT 같은 지원 원가센터를 묶는 노드.","OKEON",""],
 n2:["노드 NA-OPS","운영 부문","생산·영업 같은 수신(운영) 원가센터를 묶는 노드.","OKEON",""],
 k1:["CC 1000 관리","원가센터","총무·재무 등 관리 비용을 모음. 기간말 배부의 송신자.","CSKS (마스터) · CSKT (텍스트)","원가센터 범주(관리·생산·영업 등)로 활동유형 사용 여부 등을 통제"],
 k2:["CC 2000 IT","원가센터","IT 인프라 비용. 고정 비율로 운영 원가센터에 배분.","CSKS",""],
 k3:["CC 3000 생산 조립","원가센터","조립 라인. 활동유형(조립 시간)을 생산오더에 배부.","CSKS · CSLA (활동유형)",""],
 k4:["CC 4000 영업","원가센터","영업 비용. 최종적으로 CO-PA로 배부 가능(KEU5).","CSKS",""],
 pc:["Profit Center PC-BIKE","손익센터","내부 손익을 보는 단위. 원가센터·자재·오더에 손익센터를 지정해 ACDOCA의 PRCTR에 자동 기록.","CEPC","S/4HANA에서는 별도 EC-PCA 원장 없이 ACDOCA에 통합. 손익센터별 재무상태표는 문서분할로"],
};
function renderOrg(){
 const n=k=>`<span class="node" data-k="${k}"><b>${ORG[k][0]}</b> · ${ORG[k][1]}</span>`;
 return `<h2>CO 조직구조</h2><p class="lead">Global Bike 미국 법인 기준 예시. 상자를 누르면 설명과 테이블이 보임</p>
 <div class="grid g2"><div class="card tree">
 ${n("oc")}<ul><li>${n("ka")}<ul>
  <li>${n("cc")}</li>
  <li>${n("sh")}<ul>
   <li>${n("n1")}<ul><li>${n("k1")}</li><li>${n("k2")}</li></ul></li>
   <li>${n("n2")}<ul><li>${n("k3")}</li><li>${n("k4")}</li></ul></li>
  </ul></li>
  <li>${n("pc")}</li>
 </ul></li></ul>
 </div><div class="detail" id="orgd" style="margin-top:0"></div></div>
 <h3>할당 규칙</h3>
 <div class="grid g3">
  <div class="card"><h4>회사코드 → 관리회계영역 <span class="tag">OX19</span></h4><p>회사코드는 하나의 관리회계영역에만 할당. 관리회계영역은 여러 회사코드를 가질 수 있음</p></div>
  <div class="card"><h4>관리회계영역 → 경영단위 <span class="tag">KEKK</span></h4><p>관리회계영역 하나에 경영단위 하나. 경영단위는 여러 관리회계영역에서 공유 가능</p></div>
  <div class="card"><h4>원가센터 → 표준계층 <span class="tag">OKEON</span></h4><p>모든 원가센터는 표준계층의 한 노드에 반드시 속함. 손익센터도 자체 표준계층이 있음</p></div>
 </div>
 <h3>Universal Journal — ACDOCA 한 줄에 FI와 CO가 함께</h3>
 <p class="note" style="margin-top:-4px">S/4HANA에서는 FI·CO·AA·ML·CO-PA(계정 기반) 실적이 ACDOCA 하나에 기록됨. 별도의 FI-CO 조정 원장이 필요 없음</p>
 <div class="tbl"><table><tr><th>RLDNR</th><th>RBUKRS</th><th>KOKRS</th><th>RACCT</th><th class="num">HSL (USD)</th><th>RCNTR</th><th>PRCTR</th><th>AUFNR</th><th>설명</th></tr>
  <tr><td class="mono">0L</td><td class="mono">US00</td><td class="mono">NA00</td><td class="mono">610000</td><td class="num">5,000.00</td><td class="mono">1000</td><td class="mono">PC-ADM</td><td></td><td>급여 (1차 원가, FI 전표)</td></tr>
  <tr><td class="mono">0L</td><td class="mono">US00</td><td class="mono">NA00</td><td class="mono">942100</td><td class="num">−1,250.00</td><td class="mono">1000</td><td class="mono">PC-ADM</td><td></td><td>배부 송신 (2차 원가, CO 전표)</td></tr>
  <tr><td class="mono">0L</td><td class="mono">US00</td><td class="mono">NA00</td><td class="mono">942100</td><td class="num">1,250.00</td><td class="mono">3000</td><td class="mono">PC-BIKE</td><td></td><td>배부 수신 (2차 원가, CO 전표)</td></tr>
  <tr><td class="mono">0L</td><td class="mono">US00</td><td class="mono">NA00</td><td class="mono">943000</td><td class="num">900.00</td><td></td><td class="mono">PC-BIKE</td><td class="mono">1000123</td><td>활동배부 → 생산오더</td></tr>
 </table></div>
 <p class="note">계정번호·오더번호는 예시. 2차 원가 행도 ACDOCA에 기록되며, 손익센터가 다르면 손익센터별 손익이 바로 바뀜. ECC의 COEP·COSP·COSS 실적은 ACDOCA 기반 호환 뷰로 읽힘</p>`;
}

function ccRead(){const p={};CCS.forEach(c=>{p[c[0]]=PE.map((e,j)=>val(`p_${c[0]}_${j}`))});return p;}
function ccInit(){
 const p=ccRead();C.bal={};C.docs=[];C.ran=false;C.act=false;C.order=0;
 CCS.forEach(c=>{C.bal[c[0]]={};PE.forEach((e,j)=>C.bal[c[0]][e[0]]=p[c[0]][j]);});
 drawCC();
}
function ccRun(){
 if(C.ran) ccInit();
 const segs=[{s:"1000",nm:"관리비",ce:"942100",w:{3000:val("b_hc3"),4000:val("b_hc4")},basis:"인원"},{s:"2000",nm:"IT비",ce:"942200",w:{3000:val("b_p3"),4000:val("b_p4")},basis:"고정 %"}];
 segs.forEach(g=>{
  const W=g.w[3000]+g.w[4000]; if(W<=0) return;
  const sh={3000:g.w[3000]/W,4000:g.w[4000]/W}; const L=[];
  const pct=r=>Math.round(sh[r]*1000)/10+"%";
  if(C.mode=="A"){
   const tot=Object.values(C.bal[g.s]).reduce((a,b)=>a+b,0);
   L.push([`CC ${g.s}`,g.ce,-tot,"송신 원가 합계 (범주 42)"]);
   ["3000","4000"].forEach(r=>{const a=tot*sh[r];L.push([`CC ${r}`,g.ce,a,`${g.basis} ${pct(r)}`]);C.bal[r][g.ce]=(C.bal[r][g.ce]||0)+a;});
   C.bal[g.s][g.ce]=(C.bal[g.s][g.ce]||0)-tot;
  }else{
   PE.forEach(e=>{const amt=C.bal[g.s][e[0]];if(!amt)return;
    L.push([`CC ${g.s}`,e[0],-amt,`${e[1]} 그대로 송신`]);
    ["3000","4000"].forEach(r=>{const a=amt*sh[r];L.push([`CC ${r}`,e[0],a,`${g.basis} ${pct(r)}`]);C.bal[r][e[0]]+=a;});
    C.bal[g.s][e[0]]-=amt;});
  }
  C.docs.push({title:`${C.mode=="A"?"KSU5 배부":"KSV5 분배"} · 세그먼트 ${g.nm} (송신 CC ${g.s})`,sub:"CO 전표",lines:L});
 });
 C.ran=true; drawCC();
}
function ccAct(){
 const amt=val("a_rate")*val("a_hrs");
 C.bal["3000"]["943000"]=(C.bal["3000"]["943000"]||0)-amt; C.order=amt;
 C.docs.push({title:"KB21N 직접 활동배부 · ASSY",sub:"CO 전표 (생산오더 확정 CO11N에서도 자동 발생)",lines:[["생산오더 1000123","943000",amt,`${val("a_hrs").toLocaleString()} H × ${fmt(val("a_rate"))}`],["CC 3000","943000",-amt,"활동 송신 (범주 43)"]]});
 C.act=true; drawCC();
}
function drawCC(){
 const els=[...PE.map(e=>e[0])];["942100","942200","943000"].forEach(k=>{if(CCS.some(c=>C.bal[c[0]]&&C.bal[c[0]][k]!==undefined))els.push(k)});
 const rows=CCS.map(c=>{const b=C.bal[c[0]];const t=els.reduce((a,k)=>a+(b[k]||0),0);return `<tr><td><b>CC ${c[0]}</b> ${c[1]}</td>${els.map(k=>`<td class="num">${b[k]!==undefined&&Math.abs(b[k])>0.004?fmt(b[k]):""}</td>`).join("")}<td class="num"><b>${fmt(t)}</b></td></tr>`;});
 if(C.act) rows.push(`<tr><td><b>생산오더</b> 1000123</td>${els.map(k=>`<td class="num">${k=="943000"?fmt(C.order):""}</td>`).join("")}<td class="num"><b>${fmt(C.order)}</b></td></tr>`);
 const grand=CCS.reduce((a,c)=>a+Object.values(C.bal[c[0]]).reduce((x,y)=>x+y,0),0)+(C.act?C.order:0);
 rows.push(`<tr class="sum"><td>합계</td>${els.map(k=>`<td class="num">${fmt(CCS.reduce((a,c)=>a+(C.bal[c[0]][k]||0),0)+(C.act&&k=="943000"?C.order:0))}</td>`).join("")}<td class="num">${fmt(grand)}</td></tr>`);
 $("#ccbal").innerHTML=`<table><tr><th>오브젝트</th>${els.map(k=>`<th class="num">${k}<br><span style="font-weight:500">${CEN[k]}</span></th>`).join("")}<th class="num">합계</th></tr>${rows.join("")}</table>`;
 $("#ccje").innerHTML=C.docs.length?jeHtml(C.docs,["오브젝트","원가요소"]):`<div class="empty">배부 또는 분배를 고르고 ① 사이클 실행을 누름</div>`;
 $("#cc_act").disabled=!C.ran||C.act; $("#cc_run").disabled=C.ran;
 let m="1차 원가만 있음 — 지원 원가센터(1000·2000)에 원가가 쌓여 있음";
 if(C.ran) m=C.mode=="A"?"배부 완료 — 수신자에는 942100·942200(범주 42) 한 줄씩. 급여·임차료 구분은 사라짐":"분배 완료 — 수신자에 급여·임차료 원가요소가 그대로 남음";
 if(C.act){const r=Object.values(C.bal["3000"]).reduce((a,b)=>a+b,0);m=Math.abs(r)<0.005?"활동배부 완료 — 생산 조립 원가센터 잔액 0 (완전 흡수)":r>0?`활동배부 완료 — CC 3000에 ${fmt(r)} 과소 흡수(차변 잔액). 실제 활동가격(KSII) 재계산 대상`:`활동배부 완료 — CC 3000이 ${fmt(-r)} 과대 흡수(대변 잔액)`;}

}

function varCalc(){
 const lot=Math.max(1,val("v_lot")),Qo=val("v_out"),pf=val("v_pf"),pw=val("v_pw"),h=val("v_h"),r=val("v_r"),su=val("v_su");
 const fixed=su*r, varU=pf+2*pw+h*r, std=varU+fixed/lot;
 const fq=val("a_fq"),fp=val("a_fp"),wq=val("a_wq"),wp=val("a_wp"),ah=val("a_h"),asu=val("a_su"),un=val("a_un");
 const actM=fq*fp,actW=wq*wp,actH=ah*r,actS=asu*r,actual=actM+actW+actH+actS+un;
 const credit=Qo*std, target=Qo*varU+fixed;
 const price=(fp-pf)*fq+(wp-pw)*wq;
 const qty=(fq-Qo)*pf+(wq-2*Qo)*pw+(ah-h*Qo)*r+(asu-su)*r;
 const res=un, lotv=fixed-fixed/lot*Qo;
 return {lot,Qo,std,credit,target,actual,price,qty,res,lotv,actM,actW,actH,actS,un,fq,fp,wq,wp,ah,asu,r,total:actual-credit};
}

/* ---------------- ROUTER ---------------- */
const R={org:[renderOrg,()=>orgDetail("ka")],ce:[renderCE,ceDetail],cca:[renderCCA,ccInit],io:[renderIO,()=>{ioRule();drawIO()}],pc:[renderPC,drawPC],var:[renderVar,drawVar],ml:[renderML,drawML],pa:[renderPA,drawPA],close:[renderClose,drawClose],dict:[renderDict,drawDict],quiz:[renderQuiz,drawScore]};
$("#nav").innerHTML=TABS.map(t=>`<a href="#${t[0]}" data-t="${t[0]}">${t[1]}</a>`).join("");
let cur="";
function go(){
 let t=location.hash.slice(1); if(!R[t]) t="org"; cur=t;
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t==t));
 $("#main").innerHTML=`<section class="on">${R[t][0]()}</section>`;
 if(R[t][1]) R[t][1]();
 const a=document.querySelector(`nav a[data-t="${t}"]`); if(a) a.scrollIntoView({inline:"center",block:"nearest"});
}
window.addEventListener("hashchange",()=>{go();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
 const el=e.target.closest("button,.node,.ck,[data-ckb]"); if(!el) return;
 if(el.classList.contains("node")) orgDetail(el.dataset.k);
 else if(el.dataset.ce!==undefined){ceK=+el.dataset.ce;ceDetail();}
 else if(el.closest("#ccseg")){C.mode=el.dataset.m;document.querySelectorAll("#ccseg button").forEach(b=>b.classList.toggle("on",b===el));ccInit();}
 else if(el.id=="cc_run") ccRun(); else if(el.id=="cc_act") ccAct(); else if(el.id=="cc_reset") ccInit();
 else if(el.closest("#ioseg")){IO.rcv=el.dataset.r;document.querySelectorAll("#ioseg button").forEach(b=>b.classList.toggle("on",b===el));ioRule();ioReset();}
 else if(el.id=="io_run") ioRun(); else if(el.id=="io_reset") ioReset();
 else if(el.closest("#vseg")){V.st=el.dataset.s;document.querySelectorAll("#vseg button").forEach(b=>b.classList.toggle("on",b===el));drawVar();}
 else if(el.id=="v_run"){V.ran=true;drawVar();}
 else if(el.closest("#pac")){paF.reg=el.dataset.c;document.querySelectorAll("#pac .chip").forEach(c=>c.classList.toggle("on",c===el));drawPA();}
 else if(el.dataset.ckb!==undefined){const i=+el.dataset.ckb;clD[i]=!clD[i];clK=i;drawClose();}
 else if(el.dataset.cl!==undefined){clK=+el.dataset.cl;drawClose();}
 else if(el.id=="clreset"){clD={};drawClose();}
 else if(el.closest("#dc")){dictF=el.dataset.c;document.querySelectorAll("#dc .chip").forEach(c=>c.classList.toggle("on",c===el));drawDict();}
 else if(el.classList.contains("opt")){const qi=+el.dataset.q,oi=+el.dataset.o;if(qi in qs)return;const ok=oi==QZ[qi][2];qs[qi]=ok;
  document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b=>{if(+b.dataset.o==QZ[qi][2])b.classList.add("ok");else if(b===el)b.classList.add("ng");});
  $("#e"+qi).classList.add("on");drawScore();}
 else if(el.id=="qreset") go();
});
document.addEventListener("input",e=>{
 const id=e.target.id;
 if(id=="dq") drawDict();
 else if(cur=="pc") drawPC();
 else if(cur=="ml") drawML();
 else if(cur=="pa") drawPA();
 else if(cur=="var") drawVar();
 else if(cur=="io"){if(IO.done) ioReset(); else drawIO();}
 else if(cur=="cca") ccInit();
});
go();
