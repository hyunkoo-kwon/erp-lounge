<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ERP 케이스 스터디 · ERP 라운지</title>
<style>
:root{--shell:#4E6A87;--brand:#0A6ED1;--brand2:#0854A0;--bg:#FAFBFD;--ink:#32363A;--sub:#6A6D70;--line:#E5E5E5;
--good:#107E3E;--goodbg:#EEF8F1;--ok:#B05B00;--okbg:#FEF4E8;--bad:#BB0000;--badbg:#FDEEEE;--soft:#F3F8FD;
--sh:0 0 .125rem rgba(0,0,0,.15),0 .125rem .5rem rgba(0,0,0,.1);
--sans:'Noto Sans KR','IBM Plex Sans KR',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
header{background:var(--shell);color:#fff}
.hw{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hw h1{font-size:18px;font-weight:700}
.hw button{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:6px}
main{max-width:760px;margin:0 auto;padding:22px 20px 150px}
.card{background:#fff;border-radius:10px;box-shadow:var(--sh);padding:20px}
h2{font-size:23px;line-height:1.4}
.lead{color:var(--sub);margin-top:6px}
.story{display:grid;gap:12px;margin-top:18px}
.story .card b{display:block;color:var(--brand);font-size:13px;margin-bottom:4px}
.story ul{margin-left:18px}
.btn{border:0;border-radius:8px;padding:13px 20px;font-size:16px;font-weight:700}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{background:var(--brand2)}
.btn.s{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.row .btn{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.sc{background:#fff;border:0;border-radius:10px;box-shadow:var(--sh);padding:16px;text-align:left;color:var(--ink);border-top:3px solid var(--brand);transition:box-shadow .15s}
.sc:hover{box-shadow:0 0 .125rem rgba(0,0,0,.15),0 .5rem 1rem rgba(0,0,0,.15)}
.sc.adv{border-top-color:#E9730C}
.sc .n{font-size:12.5px;font-weight:700;color:var(--brand)}
.sc.adv .n{color:#E9730C}
.sc b{display:block;font-size:17px;margin:2px 0}
.sc span{font-size:14px;color:var(--sub);display:block}
.sc .pg{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--sub)}
.sc .pg.done{color:var(--good)}
.dots{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.dots i{width:28px;height:6px;border-radius:99px;background:#DCE3EA}
.dots i.on{background:var(--brand)}.dots i.cur{background:var(--brand2);width:40px}
.dots span{margin-left:auto;font-size:13px;color:var(--sub);font-weight:600}
.eyeb{font-size:13px;font-weight:700;color:var(--brand)}
.easy{background:var(--soft);border-radius:10px;padding:14px 16px;margin:14px 0}
.easy b{display:block;font-size:13px;color:var(--brand2);margin-bottom:2px}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.terms button{background:#fff;border:1px solid #C9D6E3;border-radius:99px;padding:4px 11px;font-size:13.5px;color:var(--brand2);font-weight:600}
.terms button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tdef{display:none;margin-top:8px;font-size:14.5px;background:#fff;border-radius:8px;padding:10px 12px}
.tdef.show{display:block}
.q{font-size:20px;font-weight:700;line-height:1.45;margin-top:4px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid #D5DADF;border-radius:10px;padding:14px 15px;font-size:16px;color:var(--ink);line-height:1.5;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:#EEF2F6;display:grid;place-items:center;font-size:14px;font-weight:700;color:#556B82}
.opt.sel.g{border-color:var(--good);background:var(--goodbg)}.opt.sel.g .k{background:var(--good);color:#fff}
.opt.sel.o{border-color:var(--ok);background:var(--okbg)}.opt.sel.o .k{background:var(--ok);color:#fff}
.opt.sel.r{border-color:var(--bad);background:var(--badbg)}.opt.sel.r .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.res{margin-top:14px;border-radius:10px;padding:16px}
.res.g{background:var(--goodbg)}.res.o{background:var(--okbg)}.res.r{background:var(--badbg)}
.res .h{font-size:17px;font-weight:700}
.res.g .h{color:var(--good)}.res.o .h{color:var(--ok)}.res.r .h{color:var(--bad)}
.res p{margin-top:4px}
.res details{margin-top:10px;font-size:14.5px}
.res summary{cursor:pointer;font-weight:700;color:var(--brand2);font-size:14px}
.res .det{margin-top:6px;color:#3F4A56}
.imp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.imp span{font-size:13px;background:#fff;border:1px solid #DCE3EA;border-radius:4px;padding:2px 8px}
.sum{display:grid;gap:10px;margin-top:16px}
.si{background:#fff;border-radius:10px;box-shadow:var(--sh);padding:14px 16px;border-left:4px solid var(--line)}
.si.g{border-left-color:var(--good)}.si.o{border-left-color:var(--ok)}.si.r{border-left-color:var(--bad)}
.si .qq{font-size:13.5px;color:var(--sub)}
.si .aa{font-weight:700;margin-top:2px}
.si .tg{font-size:12px;font-weight:700;margin-top:4px}
.si.g .tg{color:var(--good)}.si.o .tg{color:var(--ok)}.si.r .tg{color:var(--bad)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.score div{background:#fff;border-radius:10px;box-shadow:var(--sh);padding:12px;text-align:center}
.score b{display:block;font-size:24px}
.score span{font-size:13px;color:var(--sub)}
.note{font-size:13.5px;color:var(--sub);margin-top:16px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#32363A;color:#fff;padding:9px 16px;border-radius:6px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:560px){.grid{grid-template-columns:1fr}h2{font-size:21px}.q{font-size:18.5px}}
@media print{header,.row,#toast,a[href="../index.html"]{display:none!important}.si{box-shadow:none;border:1px solid #ccc}}
.mh{margin-bottom:10px}.mh h2{margin-top:2px}
.back{background:none;border:0;color:var(--brand);font-weight:700;font-size:14px;padding:0;margin-bottom:6px}
.mtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 14px}
.mtabs button{border:0;background:none;padding:10px 12px;font-size:15px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.mtabs button.on{color:var(--brand2);border-bottom-color:var(--brand)}
.mtabs small{font-size:12px;font-weight:600;margin-left:3px}
.brief{display:grid;gap:8px;font-size:15px}
.brief b{display:block;font-size:12.5px;color:var(--brand);font-weight:700}
.brief ul{margin-left:18px}
.qlist{display:grid;gap:8px;margin-top:14px}
.ql{display:flex;gap:10px;align-items:center;background:#fff;border:0;border-left:4px solid var(--line);border-radius:8px;box-shadow:var(--sh);padding:13px 14px;text-align:left;color:var(--ink);font-size:15px}
.ql.g{border-left-color:var(--good)}.ql.o{border-left-color:var(--ok)}.ql.r{border-left-color:var(--bad)}
.ql .qn{font-weight:700;color:var(--brand);font-size:13px;min-width:24px}
.ql .qt{flex:1}.ql .qt small{display:block;color:var(--sub);font-size:13px}
.ql .ar{color:var(--brand)}
.ibar{height:6px;background:#E5EAF0;border-radius:99px;overflow:hidden;margin-top:8px}.ibar i{display:block;height:100%;background:var(--good)}
.steps{list-style:none;display:grid;gap:10px;margin-top:14px}
.stp{display:flex;gap:12px;background:#fff;border-radius:10px;box-shadow:var(--sh);padding:14px}
.stp.ok{background:#F5FBF7}
.chk{flex:none;position:relative;cursor:pointer}
.chk input{position:absolute;opacity:0;width:32px;height:32px;margin:0;cursor:pointer}
.chk span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#EBF5FE;color:var(--brand2);font-weight:700;font-size:14px}
.stp.ok .chk span{background:var(--good);color:#fff;font-size:0}.stp.ok .chk span::after{content:"✓";font-size:16px}
.chk input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.sb{flex:1;min-width:0}
.sh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sh b{font-size:16px;line-height:1.45}
.tc{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;background:#EBF5FE;color:var(--brand2);border-radius:4px;padding:2px 7px;max-width:55%;text-align:right}
.sv{font-size:14px;margin-top:4px}.sv em{font-style:normal;font-size:12px;font-weight:700;color:var(--good);background:var(--goodbg);border-radius:4px;padding:1px 6px;margin-right:4px}
.sw{font-size:14px;color:var(--sub);margin-top:3px}
.sb details{margin-top:6px}.sb summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand2)}
.path{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#F5F7F9;border-radius:6px;padding:8px 10px;margin-top:6px;word-break:break-word}
.dm{margin-top:18px}.dmh{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.dmh span{font-size:13px;color:var(--sub);font-weight:700;flex:none}
.dm .si{margin-bottom:8px}
.dsub{font-size:13px;font-weight:700;color:var(--brand2);margin:10px 0 6px}
.brief .ct{font-size:17px;font-weight:700;color:var(--ink)}
.mtabs{overflow-x:auto;scrollbar-width:none}.mtabs::-webkit-scrollbar{display:none}.mtabs button{flex:none;white-space:nowrap}
</style>

<style id="white-shell">/* WHITE SHELL — SAP Horizon 느낌 흰색 상단 */
.shell,body>header,nav.top{background:#fff!important;color:#1D2D3E!important;border-bottom:1px solid #E5E5E5!important;box-shadow:0 1px 3px rgba(0,0,0,.06)!important}
nav.top{box-shadow:0 0 0 100vmax #fff,0 1px 3px rgba(0,0,0,.06)!important}
body::before{background:#fff!important}
.shell *,body>header *,nav.top *{color:inherit}
.shell p,.shell small,body>header p,body>header small,nav.top small{color:#556B82!important}
.shell .eyebrow,body>header .eyebrow{color:#0A6ED1!important}
.shell h1,body>header h1,nav.top a.logo{color:#1D2D3E!important}
body>header h1 span,body>header h1 em,body>header em{color:#0A6ED1!important}
nav.top a{color:#0854A0!important}
.shell a{color:#0A6ED1!important}
.shell span.logo{color:#fff!important}
body>header .hw>button,body>header #home{background:#EEF2F6!important;color:#1D2D3E!important}
body>header .chip{background:#EEF2F6!important;color:#32363A!important}
body>header .chip.on{background:#0A6ED1!important;color:#fff!important}
body>header input{border:1px solid #CDD5DE!important}
#seg{background:#EEF2F6!important}
#seg button{color:#556B82!important}
#seg button b{color:inherit!important}
#seg button.on{background:#fff!important;color:#0854A0!important;box-shadow:0 1px 3px rgba(0,0,0,.12)!important}
</style>
</head>
<body>
<header><div class="hw"><h1>ERP 케이스 스터디</h1><button id="home">모듈 목록</button></div></header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>

function text(){let s="[A사 해결안 · ERP 케이스 스터디]\n";MODS.forEach(m=>{s+=`\n■ ${m.n} ${m.t} (IMG ${imgN(m)}/${m.img.length})\n`;types(m).forEach(t=>{const c=m.cases[t];s+=` [${CT[t]}] ${c.title}\n`;c.qs.forEach((d,i)=>{const x=S.a[ak(m,t,i)];s+=`  - ${d.q}\n    → ${x==null?"미답":d.o[x][0]+" ("+GR[d.o[x][1]][0]+")"}\n`})})});return s}

function render(){
 let h;const m=M(V.m);
 if(V.p==="home")h=home();else if(V.p==="doc")h=doc();else if(V.tab==="img")h=imgView(m);else h=caseView(m,V.tab,V.q);
 $("#main").innerHTML=h;
 const hs=V.p==="mod"?`#${V.m}-${V.tab}${V.q!=null?"-"+(V.q+1):""}`:V.p==="doc"?"#doc":"";
 if(location.hash!==hs)history.replaceState(null,"",hs||location.pathname);
}
function go(v){V=v;render();window.scrollTo({top:0,behavior:"smooth"})}
let tt;function toast(x){const el=$("#toast");el.textContent=x;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1500)}
$("#home").onclick=()=>go({p:"home"});
$("#main").addEventListener("change",e=>{const c=e.target.dataset.c;if(!c)return;if(e.target.checked)S.c[c]=1;else delete S.c[c];save();const y=window.scrollY;render();window.scrollTo(0,y)});
$("#main").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.go){go({p:b.dataset.go});return}
 if(b.dataset.m){const m=M(b.dataset.m);go({p:"mod",m:m.id,tab:types(m)[0],q:null});return}
 if(b.dataset.tab){go({p:"mod",m:V.m,tab:b.dataset.tab,q:null});return}
 if(b.dataset.q!=null){go({p:"mod",m:V.m,tab:V.tab,q:+b.dataset.q});return}
 if(b.dataset.tm!=null){const t=M(V.m).cases[V.tab].qs[V.q].tm[+b.dataset.tm],el=$("#tdef"),on=b.classList.contains("on");document.querySelectorAll(".terms button").forEach(x=>x.classList.remove("on"));if(on){el.classList.remove("show");return}b.classList.add("on");el.innerHTML=`<b>${esc(t[0])}</b> — ${esc(t[1])}`;el.classList.add("show");return}
 if(b.classList.contains("opt")&&!b.disabled){S.a[ak(M(V.m),V.tab,V.q)]=+b.dataset.j;save();render();const r=document.querySelector(".res");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});return}
 if(b.dataset.re){delete S.a[ak(M(V.m),V.tab,V.q)];save();render();return}
 if(b.dataset.nx){const m=M(V.m),c=m.cases[V.tab],ts=types(m),ni=ts.indexOf(V.tab)+1;go(V.q+1<c.qs.length?{p:"mod",m:m.id,tab:V.tab,q:V.q+1}:ni<ts.length?{p:"mod",m:m.id,tab:ts[ni],q:null}:{p:"mod",m:m.id,tab:"img",q:null});return}
 if(b.id==="cp"){try{await navigator.clipboard.writeText(text());toast("복사됐어요")}catch(err){toast("복사할 수 없어요")}return}
 if(b.id==="pr"){window.print();return}
 if(b.id==="rs"){if(confirm("모든 답과 체크를 지울까요?")){S={a:{},c:{}};save();go({p:"home"})}return}
});
(function(){const h=location.hash.replace("#","");
 const ALIAS={"case":"tx"};
 let mm=h.match(/^(\w+)-(org|md|tx|img|case)(?:-(\d+))?$/);
 if(mm&&M(mm[1])){const m=M(mm[1]);let t=ALIAS[mm[2]]||mm[2];if(t!=="img"&&!m.cases[t])t=types(m)[0];V={p:"mod",m:m.id,tab:t,q:t!=="img"&&mm[3]?Math.min(+mm[3]-1,m.cases[t].qs.length-1):null}}
 else if(M(h))V={p:"mod",m:h,tab:types(M(h))[0],q:null};
 else if(h==="doc")V={p:"doc"};render()})();
